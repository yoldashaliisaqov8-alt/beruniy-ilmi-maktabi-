<h1>Tarbiya</h1>
<p class="sub">Suhbat savollari: ularni ro'yxatdan ko'ring yoki elektron doskaga chiqaring</p>
<div id="app"></div>
</div>

<!--
  SUHBAT SAVOLLARINI QO'SHISH: pastdagi blokka shu shaklda yozing.
  MAVZU: mavzu nomi            (savollar mavzular bo'yicha guruhlanadi)
  SAVOL: savol matni
  JAVOB: javob yoki namuna javob (bir necha qator bo'lishi mumkin — keyingi qatorlar shu javobga qo'shiladi)
  Har bir yangi savol "SAVOL:" so'zidan boshlanadi.
-->
<script type="text/plain" class="suhbat-data">
MAVZU: Odob-axloq
SAVOL: Sizningcha, yaxshi o'qituvchi qanday fazilatlarga ega bo'lishi kerak?
JAVOB: Namuna javob: bilimdon, adolatli, o'quvchiga hurmat bilan munosabatda bo'luvchi, o'z fanini sevadigan va o'quvchida qiziqish uyg'ota oladigan bo'lishi kerak. Bunday javobni o'z fikringiz va misolingiz bilan to'ldiring.

MAVZU: Oila va jamiyat
SAVOL: Mahallaning jamiyatdagi o'rni haqida nima deya olasiz?
JAVOB: Namuna javob: mahalla o'zini o'zi boshqarish institutidir; qo'shnichilik, o'zaro yordam va yoshlar tarbiyasida muhim o'rin tutadi.
</script>

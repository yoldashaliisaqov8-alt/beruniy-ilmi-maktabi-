MAVZU: 7-sinf · 43-44-mavzular: Aql-zakovat bilan bunyod etilgan boy ma'naviyat. (151-160-betlar)
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Imom Buxoriy) haqida ma'lumot bering.
JAVOB: Yashagan yillari: 810-870-yillar.
To'liq ismi: Muhammad ibn Ismoil al-Buxoriy.
Yurtimiz allomalari diniy bilimlar bo'yicha ham yuksak darajaga erishganlar.
Ibn Sino, Mahmud Zamaxshariy, Forobiy, Beruniylar Qur'oni karim, hadis, islom tarixi va huquqshunosligi bo'yicha ham asarlar yozganlar.
Musulmon olamidagi dastlabki o'quv dargohlari — madrasalar VIII asrning oxirlarida o'sha davrdagi ilmiy-madaniy markazlar hisoblangan Buxoro, Samarqand, Nasaf, Termiz, Xiva, Shosh, Marg'ilon kabi qadimiy shaharlarda faoliyat ko'rsata boshlagan.
Bunday ilm dargohlari o'zining natijasini ko'rsatib, yurtimizdan buyuk mufassirlar (Qur'onni tafsir qiluvchilar) va muhaddislar (hadis to'plovchilar) yetishib chiqqan. Muhammad (s.a.v.)ning olti yuz mingga yaqin hadislarini yodida saqlagan buyuk alloma Imom Buxoriy «Hadis ilmining sultoni» degan sharafli unvonga sazovor bo'lgan.
Buyuk muhaddisning «al-Jome as-sahih» (Sahih, ishonchli to'plam) asari Qur'oni karimdan keyingi o'rinda turadigan ikkinchi muhim manba sifatida islom olamida yuqori bahoga sazovor bo'lib kelmoqda.
Imom Buxoriy hadis ilmi olimlaridan biri Is'hoq Rohuvaihning huzurida bo'lgan. U ba'zi shogirdlariga: «Koshki sizlar Nabii sollallohu alayhi vasallamning sunnatlarini jamlagan muxtasar, sahih kitob jam qilsangiz edi!» – dedi. Bu Imom Buxoriyning qalbiga o'rnashib qoldi va u hadislarni jamlashni boshladi. Bu hadislarni 600 000 ta hadisdan chiqarib olib, kitobiga faqat sahih hadislarni jamladi.
Hadislarning roviysi (yetkazuvchi, rivoyat qiluvchi, aytuvchi) haqidagi ma'lumotlarni ham berish ularning ishonchliligini ta'minlash uchun asos bo'lgan.
Har bir roviyning tarjimayi holini yozar, har bir hadisni yozishdan oldin poklanib, ibodat va duolar qilar edi.
Imom Buxoriy hadislarni qabul qilishi uchun hadis qator talablarga javob berishi zarur bo'lgan.
Hadis aytuvchining musulmon bo'lishi, yoshi, ya'ni voyaga yetganligi, aqlining rasoligi, gunoh ishlardan saqlanganligi, ilmga amal qilishi, eshitgan xabarining rostligini aniqlab keyin birovga aytadigan odam bo'lishi, shu bilan birga, xotirasining kuchliligiga, yolg'ondan uzoq bo'lishi kabi talablarga amal qilgan.
«Al-Jome as-sahih» 16 yil mobaynida yozib tugatildi.
Manbalarda aytilishicha, Imom Buxoriyning sahih to'plamiga kiritilgan ishonchli hadislarning soni takrorlanadiganlari bilan birga 7 275 ta bo'lib, takrorlanmaydigan holda esa 4 000 hadisdan iborat bo'lgan.
707-yili musulmonlar tomonidan dunyodagi birinchi shifoxona tashkil qilindi. Shu shifoxonaning o'zida hamshiralar xizmat ko'rsatishi yo'lga qo'yildi va tibbiyot oliygohlari faoliyat ko'rsata boshladi. Ko'p asrlar mobaynida aynan musulmon shifokorlari ko'z kasalliklarini tekshirish va davolash bo'yicha mutaxassislar hisoblanishgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Imom Buxoriyning imtihon qilinishi haqida ma'lumot bering.
JAVOB: Bir kuni Imom Buxoriyning Bag'dodga kelganini eshitgan olimlar u kishini imtihon qilib ko'rmoqchi bo'ldilar.
Bag'dod muhaddislari yuzta hadisni tanlab olib, ularning matn va isnodlarini o'zgartirdilar (ya'ni, bir isnod matnini ikkinchi bir isnod matni bilan va bir matn isnodini boshqa matn isnodi bilan almashtirib qo'ydilar).
So'ng ularni o'n kishiga o'ntadan bo'lib berdilar-da, yig'in vaqtida Imom Buxoriyga aytishni tayinladilar. Yig'inga minglab xurosonlik, bag'dodlik va boshqa olimlar kelishdi. Boyagi kishilar o'zlariga topshirilgan hadislarni Imom Buxoriyga aytib, ular xususida so'radilar.
Shunda Imom Buxoriy ularning har biriga: «Bunday hadisni bilmayman», — deb javob berdi. Savollar tugaganidan so'ng birinchi bo'lib savol bergan kishiga o'girildi-da: «Ammo, sen aytgan birinchi hadisning matni boshqa bir hadis isnodiga taalluqli bo'lib, to'g'risi mana bunday, ikkinchisining isnodi esa bo'lak hadis matniga tegishli bo'lib, to'g'risi mana bunday...» — deya savol bergan 10 kishiga javob berdi.
Barcha hadislarning isnod-u matnlarini joy-joyiga qo'yganiga qoyil qolgan odamlar u kishining xotirasi, aql-u zakovatiga tan berib, chuqur izzat-ehtirom bildirdilar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Imom Termiziy) haqida ma'lumot bering.
JAVOB: Abu Iso Muhammad Termiziy (824-892-yil, Termiz) Bug' qishlog'i (hozirgi Sherobod tumani) da tavallud topgan buyuk o'zbek muhaddisidir.
Termiziy Imom Buxoriy bilan uchrashganida (bu uchrashuv Nishopurda bo'lgan va ikki alloma 5 yil birgalikda yashashgan) hadisning matninigina emas, uning hikmati va falsafasini tushunib yetganini e'tirof etadi.
O'z navbatida, Imom Buxoriy o'z shogirdini maqtab, kamtarinlik bilan: «Sen mendan bahra topganingdan ko'ra, men sendan ko'proq bahra topdim», – deydi. Bu Termiziyga berilgan juda katta baho edi.
868-yilda u o'z tug'ilgan yurtiga qaytgan.
Termiziy ilmiy-ijodiy ish, shogirdlar tayyorlash bilan mashg'ul bo'ldi va yirik muhaddis olim, imom sifatida shuhrat qozondi.
Termiziy qalamiga mansub asarlarning aksariyati: «Al-Jome' as-sahih» («Ishonarli to'plam»), «Ash-Shamoil an-nabaviya» («Payg'ambar alayhissalomning shakl va sifatlari»), «Al-Ilal fil-hadis» («Hadislardagi illatlar»), «at-Ta'rix» («Tarix») va boshqalar bizgacha yetib kelgan.
Uning asarlari ichida eng mashhuri, shubhasiz «Al-Jome' as-sahih» bo'lib, u 6 ta ishonchli hadislar to'plamidan biridir.
Abu Iso Muhammad Termiziy Makkaga hajga borayotganlarida yo'l-yo'lakay ko'plab mashhur
muhaddislar bilan uchrashib, ularning biridan hadis ilmidan saboq bermog'ini iltimos qilgan. Shunda u kishi: «Mayli, qo'lingizga qog'oz-qalam olingiz!» — degan. Aksiga olib, shu payt Termiziy qalam topa olmagan, olim ro'parasida o'ltirib eshitgan.
Olim esa hech qanday yozuv yo'qligini ko'rib, jahli chiqib: «Nima, sen meni bekorchi deb o'yladingmi?» — deb koyigan. Imom Termiziy uzr aytib: «Siz aytgan hadislarni yodlab oldim, ularni aytib beraymi?» — deb eshitgan hadislarining hammasini birin-ketin aynan aytib bergan.
So'ng u olim yana qirqta hadis aytgan. Imom Termiziy ularni ham birma-bir xatosiz aytib bergan. Shunda olim Imom Termiziyning xotirasi bag'oyat kuchli ekanidan hayratlangan.
1990-yili yurtimizda Termiziy tavalludining 1200 yilligi keng nishonlandi.
Mustaqillik yillarida Termiziyning yodgorlik majmuasi qaytadan ta'mirlanib, qutlug' ziyoratgohga aylantirildi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Zamaxshariy) haqida ma'lumot bering.
JAVOB: Abul Qosim Mahmud ibn Umar ibn Muhammad (1075-1144) – tilshunos, shoir, faqih.
«Jorulloh» – «Allohning qo'shnisi», «Arab va g'ayri arablar ustozi», «Xorazm faxri» nomlari bilan ulug'langan.
Xorazmning Zamaxshar qishlog'ida tug'ilgan. Otasi rahbarligida savod chiqarib, keyinroq Gurganjda, Buxoroda ilm olgan. Bir necha yil xorazmshohlar saroyida xizmat qilgan.
1118-yildan e'tiboran butun umrini ilm-fanga bag'ishlaydi. Ikki marta haj safarida bo'lgan.
Ko'hna Urganchda vafot etgan.
Zamaxshariy arab tili, adabiyot, geografiya, tafsir, hadis va fiqhga oid ko'plab asarlar yaratgan.
Arab tili grammatikasiga oid «Al-Mufassal» nomli asarini u Makkada yashagan paytida, bir yarim yil davomida yozgan.
Uning Qur'on tafsiriga bag'ishlangan «Qur'on haqiqatlari va uni sharhlash orqali so'zlar ko'zlarini ochish» («Al-Kashshof an haqoiq it-tanziyl va uyun-il-aqoviyl fi vujuh it-ta'viyl») asari mashhurdir.
Makkada yozilgan bu kitob qisqacha «Kashshof» deb ataladi.
Zamaxshariyning fiqhga oid «Turli masalalarning muhimi», «Vorislik huquqi ilmi bo'yicha mashq», din asoslari haqidagi «Usuldagi tartibotlar», hadislarga bag'ishlangan «G'arib hadislar haqida ajoyib asar».
Buyuk bobomiz Alisher Navoiy "Sab'ai sayyor" dostonining ustozi Abdurahmon Jomiy ta'rifiga bag'ishlangan bobida Zamahshariyni eslab o'tadi: Arabiyatda dars aning virdi. Ibni Hojib kamina shogirdi. Ibni Hojib demayki, Jorulloh, Oncha tafsir ishinda yo'q ogoh.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Burhoniddin Marg'inoniy) haqida ma'lumot bering.
JAVOB: Imom Burhoniddin Abulhasan Ali ibn Abubakr ibn Abduljalil Farg'oniy Marg'inoniyning nasabi xalifa Abu Bakr Siddiq (r.a.) ga borib taqaladi.
Imom Burhoniddin Marg'inoniy 1123-yilda Rishton tumanida tug'ilgan. U ilm-ma'rifatli oilada ulg'aygan bo'lib, avvalo o'z otasidan ta'lim oladi.
«Shayx ul-islom» degan ulug' martabaga sazovor bo'ladi.
Burhoniddin Marg'inoniyning yuzga yaqin asarlar yozganligi manbalarda qayd qilingan.
Uning shoh asari «Hidoya» hisoblanadi. Mazkur asar 57 bobdan iborat bo'lib, islom huquqshunosligining barcha sohalarini o'zida ifoda etgan noyob manba hisoblanadi.
Marg'inoniyning butun islom olamida mashhur bo'lgan «Hidoya» asari 1178-yili Samarqandda yozildi.
«Hidoya» asari yaratilgan davridan to hozirgacha Sharq va G'arbning o'quv yurtlarida islom shariatini o'rganishda asosiy manbalardan biri sifatida foydalaniladi.
Alloma 1197-yilda vafot etgan.
2000-yilning noyabrida Marg'ilonda Burhoniddin al-Marg'inoniyning 910-yilligi keng nishonlandi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Hakim Termiziy) haqida ma'lumot bering.
JAVOB: To'liq ismi Abu Abdulloh Muhammad ibn Ali ibn Hasan ibn Bashir Hakim Termiziy bo'lib, tarjimayi holiga oid ma'lumotlar o'rta asrlarda arab tilida ijod qilgan mualliflardan Tojuddin Subkiy, Xatib Bag'dodiy Ibn Hojar Asqaloniy va Sullamiy asarlarida, shuningdek, o'zining qalamiga mansub «Bad'u sha'ni Abu Abdulloh» («Abu Abdulloh ishining boshlanishi») nomli avtobiografik risolasida keltirilgan.
Mashhur mutasavvuf, muhaddis, «hofiz ul-Qur'on» va olim bo'lib, aqida, tafsir, hadis ilmlari to'g'risida asarlar yozgan.
Hakim Termiziy taxminan 750/760-yillarda Termiz shahrida tavallud topgan. Umrining oxiriga qadar (taxminan 869-yil) to'rt yuzga yaqin asar yozgan.
Shundan oltmishga yaqini bizgacha yetib kelgan.
Termiziy bu dunyo uchun yaratilgan barcha ne'matlarning, jumladan, tevarak-atrof, bizni o'rab turgan dunyoning hikmatini anglashdagi harakatlari uchun o'z davrida alloma «al-Hakim», ya'ni «(borliqdagi) hikmatni anglagan zot» nomiga musharraf bo'lgan.
Allomaning payg'ambar Muhammad layhissalomning hadislariga bag'ishlangan «Navodir al-usul fi ma'rifat axbor Rasul» («Rasululloh xabarlarini bilishga oid usullar») asari mashhur.
Uning bir qo'lyozma nusxasi O'zbekiston musulmonlar idorasi kutubxonasida saqlanmoqda.
Hakim Termiziyning bizgacha yetib kelgan muhim asarlaridan yana biri «Xatm ul-avliyo» (ba'zi manbalarda «Xatm ul-valoyat») bo'lib, unda allomaning valiylik haqidagi qarashlari keng bayon etiladi.
Bundan tashqari, uning tasavvufga oid «Kitob haqiqat al-odamiya» («Insoniyat haqiqati to'g'risida kitob»), «Adab al-nafs» («Nafs odobi») va boshqa bir qancha qo'lyozma asarlari bugungi kungacha yetib kelgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar
SAVOL: Aql-zakovat bilan bunyod etilgan boy ma'naviyat (Narshaxiy) haqida ma'lumot bering.
JAVOB: Abu Bakr Muhammad ibn Ja'far Zakariyya al-Xattob ibn Sharik Narshaxiy (899-959) — tarixchi olim.
Buxoroning Narshax qishlog'ida tug'ilgan.
Somoniylar saroyida kotiblik qilgan.
Narshaxiy 943-944-yillarda somoniylar amiri Nuh ibn Nasrga bag'ishlagan «Tahqiqi viloyati Buxoro» («Buxoro tarixi») nomli asarini arab tilida yozdi.
Narshaxiy yozgan «Buxoro tarixi» kitobining bir necha bobi Buxoroning barpo etilishi, qadimiy nomlari, qadimgi podshohlariga bag'ishlangan.
Asarning maxsus bir bobi Buxoro atrofidagi Karmana, Nur, Tavois, Iskajkat, Sharg', Zandana, Vardona, Afshona, Barkat, Romitan, Varaxsha, Baykand (Poykend), Forob va boshqalar haqida ma'lumot beradi.
«Buxoro tarixi»da IX asrda Turonning arab xalifaligidan ajralib chiqishi, Movarounnahr va Xurosonda somoniylar hukmronligining o'rnatilishi hamda Buxoroning iqtisodiy va madaniy hayoti tasvirlangan.
Asarda Buxoro shahrining darvozalari, ichki va tashqi devorlarining qurilishi, ark va shahristonning bino qilinishi kabi shaharning tarixiy topografiyasiga oid ma'lumotlar bo'lib, ular mohirona hikoya qilinadi.
«Buxoro tarixi»ning arab tilida yozilgan asl nusxasi bizgacha yetib kelmagan.
Kitobning fors tiliga tarjima qilinib, qariyb uch asr davomida bir necha bor tahrir, qisqartirish va qo'shimchalarni boshidan kechirgan nusxasi saqlanib qolgan, xolos.
«Buxoro tarixi» Parijda fransuz, Buxoro va Tehronda fors, Kembrijda ingliz, Toshkentda rus va o'zbek tilida, Dushanbeda tojik tilida nashr etilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 43-44-mavzular, 151-160-betlar

MAVZU: 7-sinf · 45-46-mavzular: IX-XII asrlarda ilm-fan va madaniyatning yuksalishi. (161-166-betlar)
SAVOL: IX-XII asrlarda ilm-fan va madaniyatning yuksalishi haqida ma'lumot bering.
JAVOB: Turon hududi jahon madaniyatining ko'hna o'choqlaridan biri bo'lgan. Islom dini kirib kelishidan avval ham bu yerda yashagan xalqlar boy me'morchilik va hunarmandchilik an'analariga ega edilar.
Mintaqaga islom dini kirib kelgach, mahalliy an'analar islom madaniyati bilan uyg'unlashib, yanada yuksalish pallasiga kirdi.
Ilm-fan, savdo-sotiq, qurilish va qishloq xo'jaligi misli ko'rilmagan darajada taraqqiy etdi.
Hozirgi geologiya, mineralogiya, fizika va kimyo sohalari uchun nihoyatda muhim va ishonchli bo'lgan moddalar tahlili (diagnostikasi)ning usuli, ya'ni moddalar solishtirma og'irligini aniqlash ilk bor Xorazmda Ma'mun akademiyasida Beruniy tomonidan kashf etilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 45-46-mavzular, 161-166-betlar
SAVOL: IX-XII asrlarda Turonda me'morchilik haqida ma'lumot bering.
JAVOB: IX-X asrlarda me'morchilikning ajoyib yutuqlari masjid va madrasalar qurilishida ko'proq namoyon bo'ldi.
O'sha davrlarda diyorimizga kelib-ketgan sayyoh va olimlar shaharlarga ta'rif bera turib, asosiy binolar sifatida masjid va madrasalarni tilga olganliklari shundan dalolatdir.
Masjid binolari yonida hashamatli va ulug'vor minora, honaqoh, ulamo-yu avliyolarning mozorlari ustiga maqbaralar qurildi. Bunday joylarni ziyorat etuvchilarning soni ko'p bo'lganligidan maxsus hujralar ham bino etila boshladi.
Iqtisodiy ahvolning yaxshilanishi, shaharlar ahamiyatining ortib borishi natijasida IX asrga qadar asosan loy va xom g'ishtdan qurib kelingan binolar o'rniga endi pishiq g'ishtlar ham ishlatila boshladi.
Qoraxoniylar, g'aznaviylar, saljuqiylar, anushteginiylar davrida iqtisodiy va madaniy taraqqiyot yuksalgan. XI-XII asrlarda pishiq g'ishtdan binolar qurish mahorati yuksak darajaga yetgan.
Imoratlarni sakkiz burchakli peshtoqlari baland ko'tarilgan va hashamatli gumbazlar bilan yopilgan holda qurish odat tusiga kirgan, naqshinkor g'isht terish san'ati rivojlangan, g'ishtlarga o'yma naqshlar berilgan.
Aholi orasida «musulmon g'isht» deb yuritiladigan qurilish ashyosi, sariq loydan tayyorlanib, maxsus xumdonlarda pishirilgan. Har bir shahar va viloyatda o'ziga xos me'moriy uslublar rivojlangan. Bular algebra va geometriya fanlarining rivojlanganligidan ham dalolat beradi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 45-46-mavzular, 161-166-betlar
SAVOL: Saljuqiylar davrida Turonda fan va madaniyat taraqqiyoti haqida ma'lumot bering.
JAVOB: Saljuqiylar davrida fan va madaniyat taraqqiyoti uchun barcha shart-sharoit yaratib berilgan.
Ushbu xonadonga mansub oliy hukmdormi, shahzodami yoki malikami, hammalari biror-bir shaharda bir yoki bir nechta madrasa qurishni o'z vazifalari deb bilganlar. Ulardan vazirlar, amirlar, mahalliy hokimlar ham o'rnak olib ish tutganlar.
Mashhur vazir Nizomulmulk o'z davrida ko'plab madrasalar qurdirgan.
Ilm toliblari ham diniy, ham dunyoviy sohalarda bilim olganlar. O'quvchilarga oylik nafaqa berilgan, joy bilan ta'minlangan. Ularni o'z davrining yetuk olimlari o'qitgan.
Nizomulmulk tomonidan asos solingan Bag'doddagi «Nizomiya» madrasalaridan birida olti ming talaba yashab, ta'lim olgani ma'lum.
Har bir madrasa qoshida kutubxona, ayrimlarida shifoxona ham mavjud bo'lgan.
Nishopurda asos solingan madrasaga shifoxona ham biriktirilgan.
Madrasada astronomlar, matematiklar, falakiyotshunoslar, riyoziyotchilar, tabiblar, kimyogarlar, yirik shoirlar faoliyat ko'rsatganlar.
Marv noibi Ma'mun 813-yilda Bag'dod xalifaligi taxtiga o'tiradi. U Xuroson, Movarounnahr va Xorazmdagi ilm ahlini Bag'dodga olib ketadi. Ular orasida tarixda mashhur Muhammad Muso Xorazmiy ham bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 45-46-mavzular, 161-166-betlar
SAVOL: Xorazmshoh Abul Hasan Ali ibn Ma'mun haqida ma'lumot bering.
JAVOB: Xorazmshohlardan Abul Hasan Ali ibn Ma'mun ilmga katta e'tibor ko'rsatib, o'z saroyiga olimlarni taklif qiladi.
Gurganchda 1004-yilda akademiyaga asos soladi. Bu tarixda Ma'mun akademiyasi nomi bilan qoladi.
Mazkur akademiyada Abu Rayhon Beruniy ilm ahliga boshchilik qiladi.
Unda Abu Ali ibn Sino ham faoliyat yuritgan.
Akademiyada diniy bilimlar bilan bir qatorda olimlar dunyoviy va tabiiy fanlar bilan, xususan, astronomiya, matematika, fizika, kimyo, mineralogiya, kartografiya, geografiya, geometriya, tabiatshunoslik, tibbiyot, falsafa, tarix, arab tili, mantiq, adabiyot, islom huquqshunosligi va boshqa ilmlar sohasida chuqur tadqiqotlar olib borishgan.
Ular arab, fors, hind, lotin, yunon va turkiy tillarni mukammal bilganlar.
Yunon olimlaridan Platon, Aristotel, Ptolemey, Yevklid, Pifagor va Galen asarlarini chuqur tahlil qilib, ularga bag'ishlab sharhlar bitganlar.
Akademiyada Beruniyning astronomiya, Abu Nasrning matematika, Abul Xayr Hammorning kimyo maktablarida ham yoshlarga chuqur bilim berildi.
Ma'mun akademiyasida yig'ilgan olimlarning aksariyati Muhammad Muso Xorazmiy asarlarining sharhlovchilari yoki bu olimning biror fan sohasidagi ilmiy an'analari davomchilari bo'lgan.
Manbalarda aytilishicha, xorazmshoh Ma'munning Abu Husayn Suhayliy ismli vaziri bo'lib, u zukko ma'rifatparvar va faylasuf bo'lgan.
2006-yilda mamlakatimizda Xorazm Ma'mun akademiyasining 1000 yilligi nishonlangan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 45-46-mavzular, 161-166-betlar

MAVZU: 7-sinf · 47-48-mavzular: Muhammad ibn Muso al-Xorazmiy. (167-171-betlar)
SAVOL: Muhammad ibn Muso al-Xorazmiy haqida ma'lumot bering.
JAVOB: Buyuk matematik, astronom va geograf olim Abu Ja'far (Abu Abdulloh) Muhammad ibn Muso al-Xorazmiy Xivada (783-850) tug'ilgan.
U algebra fanining asoschisi sifatida ilm-fan tarixida yuksak nom qozondi.
«Algebra» so'zining o'zi uning «Aljabr val-muqobala» nomli risolasidan olingan.
Olimning «al-Xorazmiy» nomi esa, «algoritm» shaklida fanda abadiy o'rnashib qoldi.
Xorazmiyning aytishicha, algebrada uch xil son bilan ish ko'riladi: ildiz (jizr) yoki narsa (shay), kvadrat (mol) va oddiy son yoki dirham (pul birligi).
Xorazmiy qalamiga mansub 20 dan ortiq asarning 10 tasi bizgacha yetib kelgan.
«Al-jabr val-muqobala», «Hind hisobi haqida kitob», «Qo'shish va ayirish haqida kitob» (arifmetik asarlar), «Kitob surat-al-arz» (geografiyaga oid asar) shular jumlasidandir.
Shuningdek, allomaning «Zij», «Usturlob bilan ishlash haqida kitob», «Usturlob yasash haqida kitob», «Usturlob yordamida azimutni aniqlash haqida», «Kitob ar-ruhoma», «Kitob at-tarix» kabi asarlari ilm-fan rivojida katta ahamiyat kasb etadi.
Xorazmiy matematikaga oid asarlaridan tashqari, geografiyada ham muhim qadamlar qo'ygan. U xalifa
Ma'mun (813-833) uchun jahon xaritasini yaratishga yordam berdi va Yer atrofini topish uchun loyihada ishtirok etdi, Suriyadagi Sinjor tekisligida yer meridian darajasini o'lchadi.
Hali G'arbda ko'pchilik yer tekislikdan iborat, deb ishonib yurgan bir paytda, Xorazmiy sayyoramiz yumaloq shaklda ekanini isbotlagan.
Alloma Xorazmiy ko'plab hind qo'lyozma asarlarini o'rganib chiqdi. 1 dan 9 gacha sanoq tizimini tuzgan va 0 g'oyasi ustida bosh qotirgan hind matematigi izlanishlari ulug' alloma Xorazmiyga yaxshigina turtki bo'ldi. Lekin 0 sonini son sifatida e'tirof etgan va hind sanoq tizimidan foydalanib, arab sanoq tizimiga asos slogan shaxs aynan ulug' alloma Muhammad ibn Muso al-Xorazmiy edi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 47-48-mavzular, 167-171-betlar
SAVOL: Dunyo olimlarining al-Xorazmiy haqidagi fikrlari haqida ma'lumot bering.
JAVOB: Yevropalik olimlar bir necha asrlar davomida barcha hisob-kitoblarning tagiga «diksit Algoritmi», ya'ni «Al-Xorazmiy shunday deydi», deb qo'shib ketishni o'zlariga sharaf deb bilishgan. Bu olimlarning hisob-kitoblarni aynan ulug' alloma Xorazmiy ko'rsatmalari asosida o'tkazganini bildiradi.
«Har gal mobil telefoningni qo'lga olganda, unutma, uning «ichida» musulmon o'zbek otaxon yashirin o'tiradi!». Atoqli Britan jurnalisti Endryu Marr jahon tarixi haqida BBС telekanali uchun tayyorlagan teleko'rsatuvlardan birida Muhammad ibn Muso al-Xorazmiy haqida gapirib, xuddi ana shunday xitob qiladi, deya xabar beriladi xalqaro ommaviy axborot vositalarida.
Muhammad ibn Muso al-Xorazmiyning qilgan buyuk xizmatlariga e'tirof o'laroq 1976-yili Sayyoralar tizimini nomlash ishchi guruhi Oyning kraterini Muso Xorazmiy nomi bilan atagan.
«Xorazmiy o'z davrining eng buyuk matematigi va agar barcha shart-sharoitlar nazarga olinsa, hamma davrlarning ham eng buyuklaridan biri». J. Sarton, amerikalik tarixchi
MANBA: 7-sinf O'zbekiston tarixi darsligi, 47-48-mavzular, 167-171-betlar

MAVZU: 7-sinf · 49-50-mavzular: Ahmad Farg'oniy. (172-175-betlar)
SAVOL: Ahmad Farg'oniy haqida ma'lumot bering.
JAVOB: Olimning to'liq ismi Abul Abbos Ahmad ibn Muhammad ibn Kasir al-Farg'oniydir.
Ahmad Farg'oniy (797-865-yillar) Farg'ona vodiysining Qubo (Quva) qishlog'ida tug'ilgan.
U avval Bag'doddagi rasadxonada ish olib bordi, so'ngra Damashqdagi rasadxonada osmon jismlari harakati va o'rnini aniqlash, yangicha «Zij» yaratish ishlariga rahbarlik qildi.
Farg'oniy yunon astronomlari, jumladan, Ptolemeyning «Yulduzlar jadvali» asarida berilgan ma'lumotlarni ko'rib chiqish hamda o'sha davrdagi barcha asosiy joylarning geografik koordinatalarini yangidan aniqlash yuzasidan olib borilgan muhim tadqiqotlarda faol ishtirok etdi.
Ahmad Farg'oniyning «Astronomiya asoslari haqidagi kitob» asari o'rta asr musulmon Sharqi mamlakatlarida, so'ng Ispaniya orqali Yevropa mamlakatlarida astronomiya ilmining rivojini boshlab berdi.
Farg'oniyning «Samoviy harakatlar va umumiy ilmi nujum» deb atalgan asari «Astronomiya asoslari haqidagi kitob» nomi bilan mashhurdir.
Asar XII asrda ikki marta lotin tiliga tarjima qilingan.
XIII asrda boshqa Yevropa tillariga tarjima qilinganidan so'ng, al-Farg'oniyning nomi «Alfraganus» tarzida dunyoga tanildi.
Farg'oniyning yuqorida nomi keltirilgan asaridan tashqari «Usturlob yasash haqida kitob», «Al-Farg'oniy jadvallari», «Yetti iqlimni hisoblash haqida» kabi asarlari, «Oyning Yer ostida va ustida bo'lish vaqtlarini aniqlash haqida risola» qo'lyozmasi turli mamlakatlar kutubxonalarida saqlanmoqda.
Al-Farg'oniy 861-yilda Qohira yaqinidagi Ravzo orolida «nilometr», ya'ni suv sathini belgilovchi uskuna yasagan. Uskuna ilk bor Nil daryosida sinab ko'rilgani uchun shunday nom olgan.
Olimning Nil daryosi orollaridan biri — Roud «burni»ga qurgan «Miqyosi Nil» uskunasi Misrda yangicha soliq miqdoriga asos soldi.
1998-yilda allomaning 1200 yillik tavallud sanasi katta tantanalar bilan nishonlandi. 2007-yilda Misr poytaxti Qohirada allomaga haykal o'rnatildi.
Yevropa Uyg'onish davrining mashhur olimi Regiomontan XV asrda Avstriya va Italiya universitetlarida astronomiyaga doir ma'ruzalarini Farg'oniy asarlari asosida o'qigan.
Farg'oniy nomi Dante (XIV asr) va Shiller (XVIII asr) tomonidan tilga olinadi.
Atoqli astronom Yan Geveliy 1647-yili nashr qilingan «Selenografiya» kitobida oydagi kraterlardan birini buyuk vatandoshimiz Ahmad Farg'oniy nomi bilan ataydi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 49-50-mavzular, 172-175-betlar
SAVOL: Muhammadjon Obidov "Miqyosi Nil" haqida ma'lumot bering.
JAVOB: 35-40 metrlar keladigan ko'prikdan o'tsangiz temir yog'och (Hindistondan keltirilgan buk daraxtidan) qoplangan sakkiz burchakli, usti doirasimon qubbali oddiy bir binoga duch kelasiz.
Chapda kanalsimon oqim, o'ngda salkam bir chaqirimcha yastanib oqayotgan hayot daryosi.
Har qanday holatda ham suv «Miqyosi Nil» qurilmasiga ochilgan tuynukdan kirib-chiqib turadi.
Ichkariga kirsangiz o'zingizni go'yo bugun O'zbekiston deb atalmish mamalakatga kelib qolgandek his qilasiz. O'rtada marmar ustun. Unga suv sathi o'lchov chiziqlari tortilgan.
Atrof esa yog'och o'ymakorligi hamda sharqona miniatura bezaklari bilan qoplangan.
Qohirada, Roud orolida, «Miqyosi Nil» inshooti poyiga Ahmad al-Farg'oniyning g'oyat ko'rkam va nafis ishlangan haykali qo'yildi. Bu Misr xalqidan insoniyatning buyuk ajdodi Ahmad al-Farg'oniyga minnatdorchilik ramzidir.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 49-50-mavzular, 172-175-betlar

MAVZU: 7-sinf · 51-52-mavzular: Abu Nasr Farobiy. (176-179-betlar)
SAVOL: Abu Nasr Farobiy haqida ma'lumot bering.
JAVOB: Abu Nasr Forobiyning (873-950) to'liq ismi Abu Nasr Muhammad ibn Muhammad ibn Uzlug' Tarxon Forobiydir.
Forobiy 873-yilda turkiy qabilalardan bo'lgan harbiy xizmatchi oilasida, Sirdaryoning o'ng qirg'og'idagi Forob (O'tror) shahrida tug'ilgan.
Forobiy o'z zamonasining barcha ilmlarini mukammal egallagani hamda bu ilmlar rivojiga katta hissa qo'shgani uchun Sharq mamlakatlarida «Almuallim as-Soniy» – «Ikkinchi muallim» (Aristoteldan keyin), «Sharq Arastusi» degan unvonlarga sazovor bo'lgan.
Ayrim ma'lumotlarda qayd etilishicha, u 70 dan ortiq tilni bilgan.
Forobiy o'rta asrlarda ma'lum bo'lgan tabiiy va ijtimoiy sohalarda 160 dan ortiq asar yaratgan.
Asarlari, «Baxt-saodatga erishuv yo'llari» («Risola fi-t tanbeh ola asbob as-saodat»), «Shaharni boshqarish» («As-siyosat an-madaniya»), «Urush va tinch turmush haqida kitob» («Kitob fitoyii val xurub»), «Fazilatli xulqlar» («Asashrat al-Fazila») va boshqalar kiradi.
Olimning «Fozil odamlar shahri» risolasida jamiyatning kelib chiqishi, maqsad va vazifalari izchil yoritilgan.
Forobiy musiqani inson tarbiyasiga ta'sir qiluvchi omillardan biri deb bildi.
Mutafakkir «Musiqa haqida katta kitob» nomli ko'p jildli asarida musiqa nazariyasi va tarixi, turli musiqa asboblari, kuylar va ularning ichki tuzilishi, tovushlar, ritmlar, ohanglar haqida ma'lumot berdi.
O'rta asr mutafakkirlari Ibn Sino, Umar Xayyom, Beruniy va boshqalar Forobiyning ta'limotini chuqur o'rganib, uni yangi g'oyalar bilan boyitganlar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 51-52-mavzular, 176-179-betlar
SAVOL: Forobiy – G'arb faylasuflari asarlari sharhlovchisi haqida ma'lumot bering.
JAVOB: Forobiy turli bilimlarning nazariy tomonlari, falsafiy mazmuni bilan ko'proq qiziqqanligi uchun uning asarlarini 2 guruhga ajratish mumkin:
yunon faylasuflari, tabiatshunoslarining ilmiy merosini izohlash, targ'ib qilish va o'rganishga bag'ishlangan asarlar; 2) fanning turli sohalariga oid mavzulardagi asarlar.
Forobiy qadimgi yunon mutafakkirlari: Platon, Aristotel, Yevklid, Ptolemey, Porfiriylarning asarlariga sharhlar yozgan.
Ayniqsa, Aristotel asarlari («Metafizika», «Etika», «Ritorika», «Sofistika» va b.)ni batafsil izohlab, qiyin joylarini tushuntirib bera olgan, kamchiliklarini ko'rsatgan, ayni vaqtda bu asarlarning umumiy mazmunini ochib beruvchi maxsus asarlar yaratgan.
Forobiyning «Aristotel "Metafizika" kitobining maqsadi to'g'risida» risolasi ayniqsa mashhur bo'lib, uning ahamiyati haqida Abu Ali Ibn Sino shunday hikoya qiladi: «Aristotelning «Mo ba'da at-tabia» («Metafizika» – tabiatdan tashqari narsalar) asarini tushunish o'ta qiyin bo'ldi. Bu kitobni yozgan kishining maqsadi menga noma'lum edi. Hatto uni qirq bor qayta o'qidim, men uni va uning maqsadlarini tushuna olmadim. Undan umidimni uzib, bu tushunib bo'lmaydigan ekan, degan xulosaga kelgan edim. Bir kuni kitob bozoridan arzimagan pulga Abu Nasr Forobiyning «Aristotel "Metafizika" kitobining maqsadi to'g'risida» kitobini sotib oldim. Bunday kitob topganimdan xursand bo'lib, xudoga shukur qilib, ataylab ro'za tutdim, faqirlarga sadaqa ulashdim».
Metafizika – lug'aviy ma'nosi «fizikadan so'ng» demakdir. Fizika fani doirasidan tashqari bo'lgan, inson his-tuyg'ulari bilan bog'liq fanlar turkumi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 51-52-mavzular, 176-179-betlar

MAVZU: 7-sinf · 53-54-mavzular: Abu Rayhon Beruniy. (180-185-betlar)
SAVOL: Abu Rayhon Beruniy haqida ma'lumot bering.
JAVOB: Abu Rayhon Muhammad ibn Ahmad Beruniy (973-yil, qadimgi Kot shahri – 1048-yil, G'azna).
Beruniy ismidagi «Abu Rayhon» qismi – Rayhonning otasi (rayhonning eng yaxshisi, a'losi ma'nosida), «Muhammad» – mutafakkirning o'z ismi, «ibn Ahmad» – Ahmadning o'g'li ekanini anglatadi.
Beruniy Kot (Kat) shahrining tashqarisida tug'ilganligi uchun «Beruniy», ya'ni «tashqarilik» degan taxallus bilan atalgan.
Uning ilk ustozi Abu Nasr ibn Iroq bo'lib, Beruniy undan astronomiya, algebra va geometriyaga oid bilimlarni o'rgangan.
Abu Nasr ibn Iroq Beruniyga mehri balandligidan 12 ta asarini mazkur sevimli shogirdiga bag'ishlagan.
Beruniyning ikkinchi ustozi Abu Sahl Iso al-Masihiy bilan Jurjondagi paytida tanishgan. Beruniy undan tibbiy, astronomiya va falsafaga oid bilimlarni o'rgangan.
O'z zаmоnаsining hаmmа fаnlаrini, birinchi nаvbаtdа, fаlаkiyot (аstrоnоmiya), fizikа, riyoziyot (mаtematika), ilоhiyot, ma'dаnshunоslik fаnlаrini puхtа egаllаgаn.
Beruniy 150 dan ortiq asarlar yaratgan. Uning «Qadimgi xalqlardan qolgan yodgorliklar», «Hindiston», «Mineralogiya», «Geodeziya» kabi asarlari shular jumlasidandir.
«Kitob al-tafhim» Abu Rayhon Beruniyning X-XI asrlarda yozgan astronomiya, fizika, matematika, geometriya va geografiya fanlari bo'yicha yirik ilmiy asari. XIII asrda ko'chirilgan nusxa.
Abu Rayhon Beruniyning kashfiyotlari, ayniqsa, uning «Qadimgi xalqlardan qolgan yodgorliklar», «Hindiston», «Mineralogiya», «Saydana» kabi asarlari o'z zamonasidayoq unga shuhrat keltirdi.
«Qadimgi xalqlardan qolgan yodgorliklar» asari Beruniyning ko'p qirrali olim ekanini namoyish etdi.
Beruniy yerning dumaloq shaklda ekanligini asoslab berdi.
U 1029 ta yulduzning koordinatalari va yulduz kattaliklari qayd etilgan yulduzlar jadvalini hamda dunyoning geografik xaritasini tuzgan.
Beruniy o'zining falakiyotga oid asarlarida Yerning Quyosh atrofida aylanishi haqidagi fikrni birinchi bo'lib ilgari surdi. U shu paytgacha noma'lum bo'lgan Amerika qit'asi mavjudligini taxmin qilib, o'z asarlarida bu haqda bir necha bor yozgan.
Xorazmdagi siyosiy ziddiyatlar va notinchlik sabab Beruniy 22 yoshida ona shahrini tark etib, Kaspiy dengizi janubidagi Jurjon va Ray shaharlarida nihoyatda faqirlikda kun kechirgan. Hatto ilmiy munozaralarda ham puldor olimlar uning muhtojligi ustidan kulishgan.
Beruniy o'zining birinchi astronomik tajribalarini 16 yoshda Kat shahrida boshlagan.
Alloma, nafaqat astronomiya va boshqa tabiiy fanlar bilan shug'ullandi, balki tarix, xususan, din tarixi bilan ham qiziqdi. Olim muhim asarlaridan biri bo'lgan «Qadimgi xalqlardan qolgan yodgorliklar»ni 1000-yili tugallagan.
Beruniy tibbiyotga bag'ishlangan «Saydana» asarida mingdan ortiq dorivor moddalar nomini 30 tilda yozib chiqqan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 53-54-mavzular, 180-185-betlar
SAVOL: Beruniy G'aznada haqida ma'lumot bering.
JAVOB: Xorazm 1017-yil Mahmud G'aznaviy tomonidan zabt etilgach, ko'pchilik olimlar qatori Beruniy ham G'aznaga olib ketiladi.
Mahmud G'aznaviy Xorazm hukmdori Ma'munning sadoqatli odamlari sifatida qarab, Beruniy va ba'zi olimlarga dastlab yaxshi munosabatda bo'lmagan. Ammo keyinchalik vaziyat o'zgardi.
Sulton Mahmud o'zining Hindistonga qilgan bir nechta yurishlarida hatto Beruniyni munajjim sifatida yonida olib yurgan. Bu yurishlar davrida to'plangan ma'lumotlar asosida olim o'zining mashhur «Hindiston» asarini yozgan.
Beruniyning ilmiy faoliyati Sulton Mahmudning o'g'li Mas'ud G'aznaviy (1030-1041) davrida yanada yuksaldi. U Mas'udning arab tilini o'rganishiga, astronomiyadan xabardor bo'lishiga ko'maklashdi.
Sulton Mas'udning homiyligidan minnatdor bo'lgan Beruniy unga bag'ishlab «Qonuni Mas'udiy» asarini yaratgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 53-54-mavzular, 180-185-betlar
SAVOL: Beruniy ilmiy merosining jahonda va O'zbekistondagi e'tirofi haqida ma'lumot bering.
JAVOB: 2009-yil iyun oyida Eron hukumati tomonidan Venadagi Birlashgan Millatlar Tashkilotining bo'limiga to'rt mashhur olim: Ibn Sino, Beruniy, Zokiriy Roziy (Reyz) hamda Umar Xayyomni o'z ichiga olgan pavilyonni taqdim etiladi. Hozirda u Vena xalqaro markazi Memorial maydonidan joy olgan.
1957-yilda olim yashagan shahar Beruniy nomini oldi. Toshkentdagi metro bekatiga Beruniy nomi berildi
1973-yilda olim tavalludining 1000 yilligi O'zbekistonda keng ko'lamda nishonlandi.
Toshkent hamda Xorazmda Beruniy haykallari bor O'zbekiston Fanlar aka demiyasi Sharqshunoslik institutiga Abu Rayhon Beruniy nomi berildi Oydagi vulqon hamda asteroid Beruniy sharafiga nomlangan.
"Beruniyning qiziqqan ilm sohalaridan ko'ra, qiziqmagan sohalarini sanab o'tish osondir". Sharqshunos olim I.Y.Krachkovskiy.
Beruniy faoliyatiga haqqoniy baho bergan amerikalik tarixchi Jorj Sarton XI asrni «Beruniy asri» deb ta'rifladi.
Bu asarning tarixiy ahamiyati va qimmati har bir davr jahon allomalari tomonidan e'tirof etilgan. «О'rta asr va yangi zamon mualliflaridan hech biri hind madaniyatining chigal masalalarini chuqur ilmiy ruhda tushunishda Abu Rayhon Muhammad ibn Ahmad Beruniy erishgan yutuqlarga erisha olmadi. Beruniyning «Hindiston» asari klassik namuna bo'lib qolishi bilan birga, o'z muallifining qadimgi hind madaniyati va faniga qilgan tortig'idan iboratdir», — degan edi Hindiston olimi Hamid Rizo.
"Beruniy geologiya va mineralogiya fanlarining nazariyotchisi va asoschisidir». H.Abdullayev, akademik
U arab adabiyoti okeanida yagona qoyadir. Hindshunoslikda Beruniyga teng keladigan kishini na ilgari va na so'nggi vaqtlarda o'tganini bilmaymiz. Zaxau, XIX asr, nemis sharqshunosi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 53-54-mavzular, 180-185-betlar

MAVZU: 7-sinf · 55-56-mavzular: Abu Ali Ibn Sino. (186-188-betlar)
SAVOL: Abu Ali ibn Sino haqida ma'lumot bering.
JAVOB: Abu Ali al-Husayn ibn Abdulloh ibn al-Hasan ibn Ali (980-yil, Afshоna qishlog'i, O'zbekiston – 1037-yil, Hamadоn shahri, Erоn).
Sharqda «Shayx ar-rais» (donishmandlar sardori, allomalar boshlig'i); «Sharaf al-mulk» (o'lka, mamlakatning obro'si, sharafi); «Hakim al-vazir» (vazirlar donishmandi) deb atalgan bo'lsa, G'arbda Avitsеnna nоmi bilan mashhur.
Uning tibbiyotga doir asarlarida kasalliklarning kelib chiqish sabablari va manbalari, tashxis, muolaja usullari, dorivor o'simliklar va dori-darmonlarning xususiyatlari, parhez, inson salomatligi uchun jismoniy tarbiyaning ahamiyati kabi tabobatning ko'pgina g'oyat muhim masalalari yoritilgan.
Jahon fani tarixida ibn Sino qomusiy olim sifatida tan olingan. Chunki, o'z davridagi mavjud fanlarning qariyb barchasi bilan shug'ullangan va ularga oid asarlar yozgan.
Ibn Sinoning «Al-qonun fit-tib» asari XII asrdayoq lotinchaga tarjima qilinib, to XVII asrgacha Yevropa tabobatida asosiy qo'llanma sifatida foydalanilgan.
Uni «Avitsenna» sifatida G'arbda mashhur qilgan asar allomaning tibbiy merosi – «Tib qonunlari» bo'lsa-da, «Shayx ar-rais» nomi, eng avvalo, uning buyuk faylasufligiga ishoradir.
Aytishlariga qaraganda, hakimlar aslida 4 ta bo'lgan, ular G'arbda Arastu va Iskandar, Sharqda esa Abu Nasr Forobiy bilan Abu Ali ibn Sinodir.
Ibn Sino ilmiy merosini o'rganish ishlari XIII asrga kelib jadal tus oldi.
«Tib qonunlari» lotincha tarjimasi to'liq holda 40 marta nashr qilindi.
XVIII asrda yashagan mashhur shved botanigi Karl Linney doimo yashil bo'lib turuvchi bir tropik daraxtni Ibn Sino sharafiga Avitsenniya deb atadi.
Buxoro shahri va Afshona qishlog'ida allomaga haykal o'rnatildi,
Belgiyaning Kortreyk shahrida ham Ibn Sinoga haykal qo'yilgan (2000).
Afshonada buyuk allomaning muzeyi ochildi.
O'zbekistonda Ibn Sino xalqaro jamg'armasi tuzildi (1999), shuningdek, «Ibn Sino» va «Sino» nomli xalqaro jurnallar nashr qilinmoqda.
Ibn Sino tibbiyot tarixida birinchi bo'lib vabo bilan ofatni farqlagan, yuqumli kasalliklar bilan og'rigan bemorlarni boshqalardan ajratgan holda saqlashni ta'kidlagan.
Bemorlarni davolashda olim 3 narsaga: ovqatlanish tartibi (parhez), dorilar bilan davolash va turli tibbiy tadbirlarni qo'llash (qon olish, zuluk yoki banka qo'yish va boshqalar)ga ahamiyat berish kerakligini aytadi.
U kasallikni davolashda shaxsiy gigiyena, uyqu va jismoniy mashqlarning ahamiyati kattaligini uqtiradi.
Abu Ali ibn Sino 10 yoshida Qur'oni Karimni to'liq yod olgan.
13 yoshidan boshlang'ich matematika, mantiq, fiqh, falsafa ilmlari bilan shug'ullana boshlagan.
U 16-17 yoshidayoq mashhur tabib — hakim bo'lib tanildi.
Abu Ali ibn Sinoning tabobat sohasiga bag'ishlagan mashhur «Tib qonunlari» kitobini yozgan. Asarning
hoshiyalarida ko'plab sharhlar keltirilgan. 1601-yilda nodir nusxasi ko'chirilgan.
Abu Ali ibn Sino «Risolatun fi taqsim al-mavjudot» kitobida «Aql tarozisida o'lchanmagan har qanday bilim, chin bo'lolmaydi, demak, u haqiqiy bilim emas», deb aytadi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 55-56-mavzular, 186-188-betlar</script>

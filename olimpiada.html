<style>
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
  .mode{padding:26px;cursor:pointer;text-align:left;font-family:var(--font);color:var(--ink);border:1.5px solid var(--line);background:#fff;border-radius:24px;}
  .mode:hover{border-color:var(--blue);background:#f4f8ff;}
  .mode h3{margin:0 0 6px;font-size:24px;font-weight:800;}
  .mode p{margin:0;color:var(--ink-soft);font-weight:600;font-size:16px;}
  .qhead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .qhead .tm{margin-left:auto;font-size:28px;font-weight:800;color:var(--blue);}
  .qhead .tm.low{color:var(--red);}
  .track{flex:1;min-width:140px;height:10px;border-radius:5px;background:#dde6f0;overflow:hidden;}
  .fill{height:100%;background:var(--blue);width:0;transition:width .3s;}
  .opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 22px;margin-bottom:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;font-family:var(--font);font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;}
  .opt:hover{border-color:var(--blue);background:#f4f8ff;}
  .opt .k{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-soft);}
  .opt.sel{border-color:var(--blue);background:#eaf2ff;}
  .opt.sel .k{background:var(--blue);border-color:var(--blue);color:#fff;}
  .opt.ok{border-color:var(--green);background:rgba(47,154,95,.12);}
  .opt.ok .k{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.no{border-color:var(--red);background:rgba(229,72,77,.08);}
  .opt.no .k{background:var(--red);border-color:var(--red);color:#fff;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;}
  .nav button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:var(--font);font-weight:800;cursor:pointer;color:var(--ink-soft);}
  .nav button.done{background:#dbe9ff;border-color:#9ec2ff;color:var(--blue-dark);}
  .nav button.cur{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset;color:var(--blue);}
  .rv{padding:18px 22px;margin-bottom:12px;border-radius:18px;border:1.5px solid var(--line);background:#fff;}
  .rv.bad{border-color:var(--red);} .rv.good{border-color:var(--green);}
  .rv b{font-weight:800;} .rv p{margin:6px 0 0;font-weight:600;color:var(--ink-soft);}
  .warn{background:rgba(229,72,77,.08);border:1px solid var(--red);color:#9a3a30;padding:14px 18px;border-radius:14px;margin-bottom:14px;font-weight:600;}
  @media (max-width:700px){.modes{grid-template-columns:1fr;}.opt{font-size:18px;padding:14px;}}
  @media (min-width:1000px){.opt{font-size:24px;padding:20px 26px;}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="icon" href="rasmlar/icon-192.png"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script><script src="bonus.js" defer></script><script src="shrift.js"></script></head>

<script type="text/plain" class="set" data-title="Olimpiada Tarix 6–11-sinf — 1-variant" data-desc="30 ta savol: 6–11-sinf darsliklari asosida, javoblar va manba (bet) bilan" data-time="60">
Mil. avv. 480-yilda Fermopil darasida forslarga qarshi yunonlar qo'shiniga kim boshchilik qilgan?
A) Afina strategi Perikl
B) Sparta podshosi Leonid
C) Sparta podshosi Kserks
D) Afinalik sarkarda Miltiad
JAVOB: B
IZOH: Manba: 6-sinf, 99-b.

Spartak qaysi shahardagi gladiatorlar maktabidan qochib, qo'zg'olon boshlagan?
A) Rim
B) Kapuya
C) Sirakuza
D) Neapol
JAVOB: B
IZOH: Manba: 6-sinf, 164-b.

Kushon podsholigi qaysi podsho davrida o'z taraqqiyotining cho'qqisiga erishgan?
A) Vima Kadfiz
B) Kudzula Kadfiz
C) Kanishka
D) Gerey
JAVOB: C
IZOH: Manba: 6-sinf, 143–144-b.

Papa Urban II 1095-yilda qaysi shahardagi cherkov yig'inida Quddusga yurishga da'vat etgan?
A) Avinyon
B) Lion
C) Klermon
D) Klyuni
JAVOB: C
IZOH: Manba: 7-sinf Jahon, 108-b.

Normandiya gersogi Vilgelm anglosakslarni Gastings jangida qaysi yili yenggan?
A) 1054-yil
B) 1095-yil
C) 1019-yil
D) 1066-yil
JAVOB: D
IZOH: Manba: 7-sinf Jahon, 28–29-b.

«Muqanna» («niqobdor») laqabi bilan tanilgan qo'zg'olon rahbarining asl ismi?
A) Ya'qub ibn Lays
B) Rofe ibn Lays
C) Abu Muslim
D) Hoshim ibn Hakim
JAVOB: D
IZOH: Manba: 7-sinf O'zb., 76-b.

Amir Temurning «besh yillik» yurishi qaysi yillarda bo'lgan?
A) 1399–1405-yillar
B) 1392–1396-yillar
C) 1386–1388-yillar
D) 1370–1375-yillar
JAVOB: B
IZOH: Manba: 8-sinf O'zb., 97-b.

Angliyada parlament qirol Karl I ni qaysi yili qatl ettirgan?
A) 1640-yil
B) 1653-yil
C) 1688-yil
D) 1649-yil
JAVOB: D
IZOH: Manba: 9-sinf Jahon, 28-b.

1709-yilda Farg'onada mustaqil hokimiyat o'rnatib, Qo'qon xonligiga asos solgan shaxs?
A) Olimxon
B) Abdurahimxon
C) Muhammad Rahimbiy
D) Shohruxbiy
JAVOB: D
IZOH: Manba: 9-sinf O'zb., 142-b.

Qirol Viktor Emmanuil III Benito Mussolinini qachon hukumat boshlig'i etib tayinlagan?
A) 1921-yil noyabrda
B) 1919-yil martda
C) 1933-yil yanvarda
D) 1922-yil oktyabrda
JAVOB: D
IZOH: Manba: 10-sinf Jahon, 64-b.

Atamalar va ularning ma'nolarini moslashtiring. 1) vasilevs; 2) hijrat; 3) muqanna; 4) veche. a) «podsho» (yunoncha); b) «ko'chib o'tish»; c) «niqobdor»; d) «kengash».
A) 1-a, 2-b, 3-c, 4-d
B) 1-b, 2-a, 3-c, 4-d
C) 1-d, 2-b, 3-c, 4-a
D) 1-a, 2-b, 3-d, 4-c
JAVOB: A
IZOH: Manba: 7-sinf Jahon, 38, 54-b.; 7-sinf O'zb., 76-b.; 8-sinf Jahon, 57-b.

Voqealarni xronologik tartibda joylashtiring. 1) Dandanaqon jangi; 2) Muhammad (s.a.v.)ning Yasribga hijrati; 3) cherkovning katolik va pravoslav cherkovlariga bo'linishi; 4) Gastings jangi.
A) 2-1-4-3
B) 2-1-3-4
C) 1-2-3-4
D) 2-3-1-4
JAVOB: B
IZOH: Manba: 7-sinf Jahon, 28, 54, 102-b.; 7-sinf O'zb., 119-b.

Amir Temurga oid to'g'ri ma'lumotlarni aniqlang. 1) 1336-yil 9-aprelda Xo'ja Ilg'or qishlog'ida tug'ilgan; 2) otasi Tarag'ay bahodir bo'lgan; 3) 1405-yil 18-fevralda O'trorda vafot etgan; 4) «uch yillik» yurish 1392–1396-yillarda bo'lgan; 5) «yetti yillik» yurish 1399–1405-yillarda bo'lgan.
A) 2, 3, 4
B) 1, 3, 4, 5
C) 1, 2, 3, 5
D) 1, 2, 4, 5
JAVOB: C
IZOH: Manba: 8-sinf O'zb., 78–79, 97-b.

Sanalar va voqealarni moslashtiring. 1) 1776-yil 4-iyul; 2) 1789-yil 14-iyul; 3) 1804-yil; 4) 1815-yil. a) Bastiliyaning olinishi; b) Mustaqillik deklaratsiyasining qabul qilinishi; c) senat Napoleonni «fransuzlar imperatori» deb e'lon qildi; d) Vaterloo jangi.
A) 1-b, 2-a, 3-d, 4-c
B) 1-b, 2-a, 3-c, 4-d
C) 1-a, 2-b, 3-c, 4-d
D) 1-c, 2-a, 3-b, 4-d
JAVOB: B
IZOH: Manba: 9-sinf Jahon, 41, 60, 120, 122-b.

Qadimgi dunyo tarixiga oid noto'g'ri ma'lumotni toping.
A) Marafondan Afinaga xabar yetkazgan jangchi 42 km yo'l bosgan
B) Perikl mil. avv. 443–429-yillarda 15 marta strateg etib saylangan
C) Ossuriya qo'shinlari mil. avv. 605-yilda Misr va Forslar tomonidan tor-mor etilgan
D) Bobil podshosi Xammurapi mil. avv. XVIII asrda Mesopotamiyani birlashtirgan
JAVOB: C
IZOH: Manba: 6-sinf, 48, 52, 98–99-b.

Xiva va Buxoro xonliklariga oid to'g'ri ma'lumotlarni aniqlang. 1) Muhammad Rahimxon I davrida davlat lavozimlari 360 tadan 100 taga qisqartirilgan; 2) Munis «Firdavs ul-iqbol» asarini Eltuzarxonning taklifi bilan yozgan; 3) Munis boshlagan asarni Ogahiy yakunlagan; 4) mang'itlar Buxoroni 1756–1920-yillarda idora qilgan; 5) Muhammad Rahimbiy 1756-yilda o'zini xon deb e'lon qilgan.
A) 2, 3, 5
B) 1, 2, 3, 4
C) 1, 3, 4, 5
D) 1, 2, 4, 5
JAVOB: B
IZOH: Manba: 9-sinf O'zb., 68, 94, 108-b.

Yillar va voqealarni moslashtiring. 1) 1867-yil; 2) 1876-yil fevral; 3) 1886-yil; 4) 1898-yil. a) Turkiston general-gubernatorligi tashkil etildi; b) Qo'qon xonligi tugatilganligi to'g'risidagi farmon e'lon qilindi; c) Aleksandr III yangi «Turkiston o'lkasini boshqarish haqidagi nizom»ni tasdiqladi; d) Andijon qo'zg'oloni boshlandi.
A) 1-a, 2-b, 3-d, 4-c
B) 1-b, 2-a, 3-c, 4-d
C) 1-a, 2-c, 3-b, 4-d
D) 1-a, 2-b, 3-c, 4-d
JAVOB: D
IZOH: Manba: 10-sinf O'zb., 25, 30, 36, 44-b.

Voqealarni xronologik tartibda joylashtiring. 1) Gitlerning reyxskansler lavozimiga tayinlanishi; 2) fashistlarning «Rimga yurishi»; 3) Nyu-York fond birjasidagi inqiroz; 4) Millatlar ligasining tashkil qilinishi.
A) 4-2-3-1
B) 4-3-2-1
C) 4-2-1-3
D) 2-4-3-1
JAVOB: A
IZOH: Manba: 10-sinf Jahon, 57–58, 64–65-b.

Shaxslar va ularga oid ma'lumotlarni moslashtiring. 1) Munis; 2) Ogahiy; 3) Shohruxbiy; 4) Muhammad Rahimbiy. a) «Firdavs ul-iqbol»ni yozishni boshlagan; b) Munis asarini yakunlagan; c) Qo'qon xonligiga asos solgan; d) chingiziy bo'lmagani uchun o'zini «amir» deb e'lon qilgan.
A) 1-a, 2-c, 3-b, 4-d
B) 1-b, 2-a, 3-c, 4-d
C) 1-a, 2-b, 3-d, 4-c
D) 1-a, 2-b, 3-c, 4-d
JAVOB: D
IZOH: Manba: 9-sinf O'zb., 68, 108, 142-b.

Yevrointegratsiya bosqichlarini yillar bilan moslashtiring. 1) 1951-yil; 2) 1957-yil; 3) 1985-yil; 4) 1992-yil. a) Yevropa ko'mir va po'lat birlashmasi to'g'risidagi Parij shartnomasi; b) YIH va Yevratomni tashkil etish to'g'risidagi Rim shartnomasi; c) Shengen shartnomasi; d) Yevropa Ittifoqini tashkil etish to'g'risidagi Maastrixt shartnomasi imzolanishi.
A) 1-a, 2-b, 3-c, 4-d
B) 1-b, 2-a, 3-c, 4-d
C) 1-a, 2-c, 3-b, 4-d
D) 1-a, 2-b, 3-d, 4-c
JAVOB: A
IZOH: Manba: 11-sinf Jahon, 39-b.

Yaroslav Donishmandning Kiyev Rusidagi hukmronligi yillari oralig'ida sodir bo'lgan voqeani toping.
A) Samarqand, Jizzax va Kattaqo'rg'onning Abdurahimxon tomonidan egallanishi
B) Klermondagi cherkov yig'ini
C) Saljuqiylar va g'aznaviylar o'rtasidagi Dandanaqon jangi
D) Gastings jangi
JAVOB: C
IZOH: Manba: 7-sinf Jahon, 47-b. (1019–1054); 7-sinf O'zb., 119-b.

Buxoroda mang'itlar hokimiyatni to'la egallagan yildan keyin, ammo Bastiliya olinishidan oldin sodir bo'lgan voqeani toping.
A) Napoleonning imperator deb e'lon qilinishi
B) Farg'onada Shohruxbiyning mustaqil hokimiyat o'rnatishi
C) Angliyaning respublika deb e'lon qilinishi
D) AQShda Mustaqillik deklaratsiyasining qabul qilinishi
JAVOB: D
IZOH: Manba: 9-sinf O'zb., 68-b.; 9-sinf Jahon, 41, 60-b.

Yangi davr tarixiga oid noto'g'ri ma'lumotni aniqlang.
A) Bastiliya 1791-yilda butunlay vayron qilingan
B) Fransiyada konsullik 1799–1804-yillarda amal qilgan
C) Mustaqillik deklaratsiyasi asosan Benjamin Franklin zakovatining mahsuli bo'lgan
D) Angliya 1649-yil 19-mayda respublika deb e'lon qilingan
JAVOB: C
IZOH: Manba: 9-sinf Jahon, 29, 42, 45, 60-b.

Qadimgi dunyo tarixiga oid to'g'ri ma'lumotlarni aniqlang. 1) Kserks Doro I ning o'g'li bo'lgan; 2) Spartak frakiyalik qul bo'lgan; 3) Spartak qo'zg'oloni mil. avv. 74-yilda boshlangan; 4) birinchi kushon hukmdori Kudzula Kadfiz bo'lgan; 5) Xammurapi mil. avv. XVI asrda Bobil podshosi bo'lgan; 6) Ossuriya podsholigining dastlabki poytaxti Nineviya shahri bo'lgan.
A) 1, 2, 3, 4
B) 1, 3, 5, 6
C) 1, 2, 5, 6
D) 2, 3, 4, 5
JAVOB: A
IZOH: Manba: 6-sinf, 48, 52, 99, 143, 164-b.

Amir Temur va temuriylarga oid noto'g'ri ma'lumotni toping.
A) Amir Temur 1336-yil 9-aprelda tug'ilgan
B) «Uch yillik» yurish davrida Amir Temur Hindistonni bo'ysundirgan
C) Shohrux 1447-yil 12-martda Ray viloyatida vafot etgan
D) Amir Husayn Amir Qazag'onning nevarasi bo'lgan
JAVOB: B
IZOH: Manba: 8-sinf O'zb., 79, 81, 97, 150-b.

Turkiston general-gubernatorligiga oid noto'g'ri ma'lumotni aniqlang.
A) Mahmudxo'ja Behbudiy (1875–1919) jadidchilik harakatining asoschisi bo'lgan
B) Fon Kaufman bir vaqtning o'zida Turkiston harbiy okrugining qo'mondoni ham bo'lgan
C) Andijon qo'zg'oloniga Dukchi eshon (Muhammad Ali) rahbarlik qilgan
D) 1868-yilda Kaufman Qo'qon xoni Xudoyorxonni chegaraga bostirib kirishga tayyorgarlik ko'rishda aybladi
JAVOB: D
IZOH: Manba: 10-sinf O'zb., 25, 27, 44, 74-b.

XX asrning birinchi yarmiga oid to'g'ri ma'lumotlarni aniqlang. 1) Millatlar ligasi 1919-yilda tashkil qilingan; 2) Parij tinchlik konferensiyasi 1919-yil 18-yanvardan 1920-yil 21-yanvargacha davom etgan; 3) Mussolini boshchiligidagi fashistlar partiyasi 1919-yilda tuzilgan; 4) «Rimga yurish»dan so'ng Mussolinini qirol Viktor Emmanuil II tayinlagan; 5) «yangi kurs»ni imperator Vilgelm II e'lon qilgan; 6) 1929-yilgi inqiroz London fond birjasida boshlangan.
A) 2, 3, 5, 6
B) 1, 2, 3, 5
C) 1, 3, 4, 5
D) 1, 2, 4, 6
JAVOB: B
IZOH: Manba: 10-sinf Jahon, 20, 57–58, 64-b.

Sanalar va voqealarni moslashtiring. 1) 1991-yil 18-noyabr; 2) 1992-yil 2-iyul; 3) 1992-yil 8-dekabr; 4) 1994-yil 1-iyul. a) O'zbekiston Respublikasining davlat bayrog'i to'g'risidagi qonun qabul qilindi; b) davlat gerbi qabul qilindi; c) Konstitutsiya qabul qilindi; d) milliy valyuta — so'm muomalaga kiritildi.
A) 1-a, 2-b, 3-d, 4-c
B) 1-b, 2-a, 3-c, 4-d
C) 1-a, 2-b, 3-c, 4-d
D) 1-a, 2-c, 3-b, 4-d
JAVOB: C
IZOH: Manba: 11-sinf O'zb., 6, 9, 37-b.

XX asr oxiri – XXI asr boshlaridagi xalqaro munosabatlarga oid noto'g'ri ma'lumotni aniqlang.
A) BRIKS 2009-yilda tashkil topgan
B) Yagona Yevropa fuqaroligini ta'minlagan Maastrixt shartnomasi 1985-yilda kuchga kirgan
C) Shanxay hamkorlik tashkiloti (ShHT) 2001-yilda tuzilgan
D) 2006-yilgi referendum natijasiga ko'ra Chernogoriya Serbiyadan ajralib chiqqan
JAVOB: B
IZOH: Manba: 11-sinf Jahon, 7, 11, 36-b.

O'zbekiston Respublikasi Konstitutsiyasi qabul qilingan yilda sodir bo'lgan voqeani toping.
A) Shanxay hamkorlik tashkilotining tuzilishi
B) Chernogoriyaning Serbiyadan ajralib chiqishi
C) Maastrixt shartnomasining imzolanishi
D) So'mning muomalaga kiritilishi
JAVOB: C
IZOH: Manba: 11-sinf O'zb., 9-b.; 11-sinf Jahon, 39-b.
</script>

<script type="text/plain" class="set" data-title="Olimpiada Tarix 6–11-sinf — 2-variant" data-desc="30 ta savol: 6–11-sinf darsliklari asosida, javoblar va manba (bet) bilan" data-time="60">
Maqbarasidagi tasavvurga sig'maydigan boyliklar bizgacha yetib kelgan eng mashhur maqbara qaysi fir'avnga tegishli?
A) Ramzes II
B) Menes
C) Tutanxamon
D) Xeops
JAVOB: C
IZOH: Manba: 6-sinf, 38-b.

Rivoyatga ko'ra, fors qo'shinlarini so'qmoq orqali adashtirgan sak cho'poni kim edi?
A) Diodot
B) Spitamen
C) Shiroq
D) To'maris
JAVOB: C
IZOH: Manba: 6-sinf, 115-b.

Parfiyada hokimiyat qaysi hukmdor qo'liga o'tgach, u Baqtriyaga harbiy tazyiqni kuchaytirgan?
A) Antiox
B) Diodot
C) Salavk
D) Mitridat I
JAVOB: D
IZOH: Manba: 6-sinf, 130-b.

Otton I Rim papasi Ioann XII tomonidan qaysi yili imperator deb e'lon qilingan?
A) 919-yil
B) 962-yil

<script>
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  // ---- o'qish ----
  var sets=[], warns=[];
  document.querySelectorAll('script.set').forEach(function(sc){
    var set={title:sc.dataset.title||'To\'plam',desc:sc.dataset.desc||'',time:+sc.dataset.time||0,qs:[]};
    sc.textContent.trim().split(/\n\s*\n/).forEach(function(block,bi){
      var q={text:[],opts:[],ans:-1,izoh:'',img:[]}, m;
      block.split('\n').forEach(function(l){l=l.trim();if(!l)return;
        if(m=l.match(/^([A-D])\)\s*(.+)$/))q.opts.push(m[2]);
        else if(m=l.match(/^JAVOB:\s*([A-D])/i))q.ans='ABCD'.indexOf(m[1].toUpperCase());
        else if(m=l.match(/^IZOH:\s*(.+)/i))q.izoh=m[1];
        else if(m=l.match(/^RASM:\s*(.+)/i))q.img.push(m[1]);
        else q.text.push(l);});
      if(q.text.length&&q.opts.length>=2&&q.ans>=0&&q.ans<q.opts.length){q.text=q.text.join('\n');set.qs.push(q);}
      else warns.push('"'+set.title+'": '+(bi+1)+'-blok o\'tkazib yuborildi (savol, kamida 2 variant va JAVOB: kerak).');
    });
    if(!set.time)set.time=Math.max(1,set.qs.length);
    sets.push(set);
  });
  if(warns.length)document.getElementById('warn').innerHTML='<div class="warn">'+warns.map(esc).join('<br>')+'</div>';
  var list=document.getElementById('list');
  sets.forEach(function(s,i){
    var d=document.createElement('div');d.className='card row';
    d.innerHTML='<div>'+esc(s.title)+'<small>'+esc(s.desc)+' · '+s.qs.length+' savol · '+s.time+' daqiqa</small></div><span class="arrow">›</span>';
    d.onclick=function(){pick(i);};list.appendChild(d);
  });

  // ---- statistika ----
  function rec(ok){try{var st;try{st=JSON.parse(localStorage.getItem('tm_stats'));}catch(e){}
    if(!st||!st.days)st={total:0,correct:0,wrong:0,best:0,days:{}};
    function k(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    var d=new Date(),key=k(d);st.days[key]=(st.days[key]||0)+1;st.total++;if(ok)st.correct++;else st.wrong++;
    var n=0,c=new Date();while(st.days[k(c)]){n++;c.setDate(c.getDate()-1);}if(n>(st.best||0))st.best=n;
    localStorage.setItem('tm_stats',JSON.stringify(st));}catch(e){}}

  // ---- holat ----
  var S=null, Q=[], picked=[], cur=0, mode='', tmr=null, left=0, finished=false, shown=[];
  function screen(id){['sList','sMode','sQuiz','sRes'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==id);});window.scrollTo(0,0);}
  function pick(i){S=sets[i];document.getElementById('mTitle').textContent=S.title;document.getElementById('mDesc').textContent=S.qs.length+' savol · imtihon vaqti: '+S.time+' daqiqa';screen('sMode');}
  document.getElementById('mBack').onclick=function(){screen('sList');};
  document.getElementById('modeP').onclick=function(){begin('P');};
  document.getElementById('modeE').onclick=function(){begin('E');};
  function begin(m){
    mode=m;finished=false;cur=0;
    // savollar va variantlar aralashtiriladi
    Q=shuffle(S.qs).map(function(q){
      var idx=shuffle(q.opts.map(function(_,i){return i;}));
      return {text:q.text,img:q.img,izoh:q.izoh,opts:idx.map(function(i){return q.opts[i];}),ans:idx.indexOf(q.ans)};
    });
    picked=Q.map(function(){return -1;});shown=Q.map(function(){return false;});
    screen('sQuiz');
    clearInterval(tmr);
    var tmEl=document.getElementById('tm');
    if(m==='E'){left=S.time*60;drawT();tmr=setInterval(function(){left--;drawT();if(left<=0){clearInterval(tmr);finish();}},1000);}
    else tmEl.textContent='';
    render();
  }
  function drawT(){var t=document.getElementById('tm');var mm=Math.floor(left/60),ss=left%60;t.textContent=mm+':'+String(ss).padStart(2,'0');t.className='tm'+(left<=60?' low':'');}
  function render(){
    var q=Q[cur];
    document.getElementById('qcount').textContent=(cur+1)+' / '+Q.length;
    document.getElementById('fill').style.width=(picked.filter(function(x){return x>=0;}).length/Q.length*100)+'%';
    document.getElementById('media').innerHTML=q.img.map(function(s){return '<img src="'+esc(s)+'" alt="" style="max-width:100%;border-radius:14px;margin-bottom:14px">';}).join('');
    var qt=document.getElementById('qtext');qt.className='qtext'+(q.text.length>170?' sm':'');qt.innerHTML=esc(q.text).split('\n').join('<br>');
    var o=document.getElementById('opts');o.innerHTML='';
    q.opts.forEach(function(t,i){
      var b=document.createElement('button');b.className='opt';
      var cls='';
      if(mode==='P'&&shown[cur]){cls=i===q.ans?' ok':(i===picked[cur]?' no':'');}
      else if(picked[cur]===i)cls=' sel';
      b.className+=cls;b.disabled=(mode==='P'&&shown[cur]);
      b.innerHTML='<span class="k">'+'ABCD'[i]+'</span><span>'+esc(t)+'</span>';
      b.onclick=function(){choose(i);};o.appendChild(b);
    });
    document.getElementById('exp').innerHTML=(mode==='P'&&shown[cur]&&q.izoh)?'<div class="ans">Izoh: '+esc(q.izoh)+'</div>':'';
    var bt=document.getElementById('qbtns');bt.innerHTML='';
    if(mode==='E'){
      var p=document.createElement('button');p.className='btn ghost';p.textContent='← Oldingi';p.disabled=cur===0;p.onclick=function(){go(-1);};bt.appendChild(p);
      var n=document.createElement('button');n.className='btn ghost';n.textContent='Keyingi →';n.disabled=cur===Q.length-1;n.onclick=function(){go(1);};bt.appendChild(n);
      var f=document.createElement('button');f.className='btn good';f.textContent='Tugatish';f.onclick=function(){
        var un=picked.filter(function(x){return x<0;}).length;
        if(un&&!confirm(un+' ta savolga javob berilmagan. Baribir tugatilsinmi?'))return;finish();};bt.appendChild(f);
    } else if(shown[cur]){
      var nx=document.createElement('button');nx.className='btn';nx.textContent=cur===Q.length-1?'Natijani ko\'rish':'Keyingi →';nx.onclick=function(){if(cur===Q.length-1)finish();else go(1);};bt.appendChild(nx);
    }
    var nv=document.getElementById('nav');nv.innerHTML='';
    Q.forEach(function(_,i){var b=document.createElement('button');b.textContent=i+1;
      b.className=(i===cur?'cur ':'')+(picked[i]>=0?'done':'');
      b.onclick=function(){if(mode==='E'){cur=i;render();}};nv.appendChild(b);});
    nv.style.display=mode==='E'?'flex':'none';
    document.getElementById('hint').style.display='block';
  }
  function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();}}
  function choose(i){
    if(finished)return;
    if(mode==='P'){if(shown[cur])return;picked[cur]=i;shown[cur]=true;rec(i===Q[cur].ans);}
    else picked[cur]=i;
    render();
  }
  function finish(){
    if(finished)return;finished=true;clearInterval(tmr);
    var ok=0;Q.forEach(function(q,i){if(picked[i]===q.ans)ok++;if(mode==='E'&&picked[i]>=0)rec(picked[i]===q.ans);});
    var pct=Math.round(ok/Q.length*100);
    document.getElementById('rScore').textContent=ok+' / '+Q.length;
    document.getElementById('rPct').textContent=pct+'%';
    document.getElementById('rMsg').textContent=pct>=86?'Ajoyib natija! Olimpiadaga tayyorsiz.':pct>=60?'Yaxshi, lekin xatolar ustida ishlang.':'Mavzularni takrorlab, yana urinib ko\'ring.';
    var rv=document.getElementById('review');rv.innerHTML='';
    Q.forEach(function(q,i){
      var good=picked[i]===q.ans;
      var d=document.createElement('div');d.className='rv '+(good?'good':'bad');
      d.innerHTML='<b>'+(i+1)+'. '+esc(q.text)+'</b><p>Sizning javobingiz: '+(picked[i]>=0?'ABCD'[picked[i]]+') '+esc(q.opts[picked[i]]):'javob berilmagan')+'</p>'+
        (good?'':'<p>To\'g\'ri javob: <b>'+'ABCD'[q.ans]+') '+esc(q.opts[q.ans])+'</b></p>')+(q.izoh?'<p>Izoh: '+esc(q.izoh)+'</p>':'');
      rv.appendChild(d);
    });
    screen('sRes');
  }
  document.getElementById('rAgain').onclick=function(){screen('sMode');};
  document.getElementById('rList').onclick=function(){screen('sList');};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('sQuiz').classList.contains('hidden'))return;
    var k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
    if(map[k]!==undefined&&map[k]<Q[cur].opts.length){e.preventDefault();choose(map[k]);}
    else if(e.key==='ArrowRight'&&mode==='E')go(1);
    else if(e.key==='ArrowLeft'&&mode==='E')go(-1);
    else if((e.key==='Enter'||e.key===' ')&&mode==='P'&&shown[cur]){e.preventDefault();if(cur===Q.length-1)finish();else go(1);}
  });
</script></body></html>

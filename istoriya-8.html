back.onclick=function(e){if(mode!=='list'){e.preventDefault();list()}};
function list(){mode='list';back.setAttribute('href','istoriya.html');H.textContent='8-й класс: Всемирная история';SUB.textContent='Выберите тему · '+D.length+' тем';
 var b=best(),h='<div class="list">';
 D.forEach(function(t,i){h+='<div class="card row" data-i="'+i+'"><div>'+esc(t[0])+'<small>'+t[1].length+' вопросов'+(b[i]!=null?' · лучший результат: '+b[i]+'/'+t[1].length:'')+'</small></div><span class="arrow">›</span></div>'});
 app.innerHTML=h+'</div>';
 [].forEach.call(app.querySelectorAll('.row'),function(r){r.onclick=function(){start(+r.dataset.i)}});window.scrollTo(0,0)}
function start(i){cur=i;qi=0;score=0;mode='quiz';order=D[i][1].map(function(_,k){return k});show()}
function show(){var t=D[cur],q=t[1][order[qi]],n=t[1].length;H.textContent=t[0];SUB.textContent='Вопрос '+(qi+1)+' из '+n;
 var h='<div class="meta"><span>'+(qi+1)+' / '+n+'</span><span>Верно: '+score+'</span></div><div class="prog"><i style="width:'+(qi/n*100)+'%"></i></div><div class="card qbox"><p class="qt">'+esc(q[0])+'</p>';
 q[1].forEach(function(o,k){h+='<button class="op" data-k="'+k+'"><b>'+'ABCD'[k]+')</b> '+esc(o)+'</button>'});
 h+='</div><div class="btnrow"><button class="btn" id="nx" style="display:none">'+(qi+1<n?'Далее →':'Результат')+'</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 [].forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){var k=+b.dataset.k;
  [].forEach.call(app.querySelectorAll('.op'),function(x){x.disabled=true;if(+x.dataset.k===q[2])x.classList.add('ok')});
  if(k===q[2])score++;else b.classList.add('no');document.getElementById('nx').style.display='';}});
 document.getElementById('nx').onclick=function(){qi++;qi<n?show():fin()}}
function fin(){var n=D[cur][1].length;save(cur,score);window.Bonus&&Bonus.done(score,n,location.pathname+'#'+cur);mode='res';SUB.textContent='Результат';
 var p=Math.round(score/n*100);
 app.innerHTML='<div class="card qbox"><div class="big">'+score+' / '+n+'</div><p class="qt">'+p+'% правильных ответов</p></div><div class="btnrow"><button class="btn" id="re">Пройти заново</button><button class="btn ghost" id="ls">К списку тем</button></div>';
 document.getElementById('re').onclick=function(){start(cur)};document.getElementById('ls').onclick=list}
list();
</script></body></html>

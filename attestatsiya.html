a) Tegishli o'quv, namoyish va tarqatma materiallardan foydalanishni rejalashtirish
b) O'quvchilar erishgan yutuqlarni natijalarini tahlil qilish
c) Ziddiyatlarni hal qilish, sinfda va undan tashqarida muloqot qilish uchun ijobiy muhit yaratishda muloqot o'tkazish
A) 1-a, 2-b
B) 1-b, 2-a
C) 1-c, 2-b
D) 1-a, 2-c
JAVOB: A

Sinf rahbari «Ochiq eshiklar kuni» o'tkazib, ota-onalarni darslarni kuzatishga taklif qildi, ular bilan birgalikda sinf kechasini tayyorladi va maktab hovlisini obodonlashtirish ishlariga jalb etdi. Bu vaziyatda o'qituvchi «Hamkasblar va ta'lim oluvchilarning ota-onalari bilan hamkorlik» mehnat vazifasining qaysi mehnat harakatini bajargan?
A) O'quvchilarning ota-onalarini (ularning o'rnini bosuvchi shaxslarni) sinf va maktab hayotiga jalb qilish
B) O'quvchining individual ta'lim trayektoriyasini loyihalashtirish va to'g'rilash uchun o'qituvchilar va boshqa mutaxassislar bilan o'zaro aloqada bo'lish
C) Tarbiyaviy muammolarni hal qilishda boshqa pedagogik xodimlar va mutaxassislar, jamoat tashkilotlari bilan hamkorlik qilish
D) O'quvchilarning ota-onalarini (ularning o'rnini bosuvchi shaxslarni) o'quvchilarni rivojlanishi va ta'lim muhiti to'g'risida qaror qabul qilishda ishtirok etishga jalb qilish | 5
JAVOB: A

«Buyuk Ipak yo'li» mavzusini o'tishda o'qituvchi o'quvchilarga bugungi kunda O'zbekiston orqali o'tayotgan xalqaro transport yo'laklari, mahalliy bozordagi import mahsulotlari misolida savdo yo'llarining ahamiyatini ko'rsatib berdi. O'qituvchi «Ta'lim samaradorligini ta'minlash» mehnat vazifasining qaysi mehnat harakatini bajargan?
A) Dars maqsadlari asosida o'quvchilar uchun erishimli vazifalarni belgilash
B) O'quvchilarning ta'limiy maqsadlari va yosh xususiyatlariga mos keladigan o'qitish usullari va yondashuvlarini tanlash
C) Dars mavzusiga mos keladigan namoyish va tarqatma materiallardan foydalanish
D) Dars mavzusini amaliyot bilan (hayotdagi misollar yordamida) bog'lash
JAVOB: D

«Xavfsiz rivojlantiruvchi ta'lim muhitini yaratish va ta'minlash» mehnat vazifasiga kiruvchi mehnat harakatlarini aniqlang: 1. O'quvchilar erkin rivojlanishlari va o'zlarini namoyon eta olishlari uchun o'zaro hurmat muhitini yaratish 2. Nizoli vaziyatlarni yetarli darajada hal qilish 3. Muntazam malaka oshirish kurslaridan o'tish 4. Dars mavzusiga mos keladigan namoyish va tarqatma materiallardan foydalanish

C) 1, 3

Mehnat vazifalari va ularning zarur ko'nikmalarini moslashtiring.

b) Turli xil muhitda har xil emotsional holatlardagi odamlar bilan aloqa qila bilish

A) 1-a, 2-c

Tadqiqotchi tanlangan muammoning falsafiy, psixologik va pedagogik adabiyotlarda qay darajada o'rganilganini aniqladi va ilgari surayotgan g'oyasining nazariy jihatdan to'g'riligini asosladi. N. Mavlonova qo'llanmasiga ko'ra tadqiqotning qaysi metodidan foydalanilgan?

O'qituvchi sinfdagi tartibsizliklarga e'tibor bermaydi, jazolash zarur bo'lgan holatlarda ham indamaydi, o'quvchilar hayoti bilan qiziqmaydi va bir-biriga zid fikrlarni birdek ma'qullayveradi. O'qituvchi pedagogik muloqotning qaysi uslubini qo'llamoqda?

Sinfda bilim darajasi turlicha bo'lgan o'quvchilar bor. O'qituvchi murakkab mavzuni barchaga tushunarli bo'lishi uchun sodda tilda, hammabop misollar bilan bayon qildi. O'qituvchi ta'limning qaysi tamoyiliga amal qilgan?

O'qituvchi darsning asosiy vaqtini o'quvchilarni ular ilk bor o'rganayotgan «Uyg'onish davri» mavzusi bilan tanishtirishga sarfladi: yangi tushunchalarni tushuntirdi, asosiy faktlarni bayon qildi. O'qituvchi darsning qaysi turidan foydalangan?

Quyidagi vaziyatlarni tarbiya metodlari bilan moslashtiring.
1. O'qituvchi o'quvchilarga darsga telefon olib kirmaslik haqida aniq, qat'iy va tushunarli ko'rsatma berdi va uning bajarilishini nazorat qildi.
2. O'qituvchi halollik fazilatining afzalligini dalillar keltirib, isbotlab tushuntirdi va o'quvchilar ongiga singdirishga erishdi.

O'qituvchi o'quvchilarning bilim darajasini aniqlash uchun javob variantlari berilgan savollardan iborat topshiriqlar tayyorladi; javoblarni aniq mezonlar bo'yicha qisqa vaqtda tahlil qildi, biroq o'quvchilar o'z fikrini batafsil bayon eta olmadi. N. Mavlonova qo'llanmasiga ko'ra tadqiqotning qaysi metodi qo'llanilgan?

O'quvchi darsda yo'l qo'ygan xatosi uchun o'qituvchi bir og'iz ham gapirmadi, faqat qoshlarini chimirib, yuz ifodasi orqali o'z noroziligini bildirdi. Pedagogik texnikaning qaysi unsuridan foydalanilgan?

Yarim yil yakunida maktabda o'quvchilarning o'quv maqsadlariga qay darajada erishganligi va o'qitishning natijadorligini aniqlash uchun rasmiy yozma nazorat o'tkazildi. Baholashning qaysi turi qo'llanilgan?

<script type="text/plain" class="set" data-title="Attestatsiya — namuna to'plam" data-desc="Namuna savollar (o'zingizniki bilan almashtiring), 6 ta savol" data-time="6">

<script>
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  // ---- o'qish ----
  var sets=[], warns=[];
  document.querySelectorAll('script.set').forEach(function(sc){
    var set={title:sc.dataset.title||'To\'plam',desc:sc.dataset.desc||'',time:+sc.dataset.time||0,qs:[],secs:(sc.dataset.sections||'').split(',').map(function(x){var p=x.split(':');return p.length==2?{name:p[0].trim(),n:+p[1]}:null;}).filter(Boolean)};
    sc.textContent.trim().split(/\n\s*\n/).forEach(function(block,bi){
      var q={text:[],opts:[],ans:-1,izoh:'',img:[],tbl:null}, m, inT=false;
      block.split('\n').forEach(function(l){l=l.trim();if(!l)return;
        if(m=l.match(/^([A-D])\)\s*(.+)$/))q.opts.push(m[2]);
        else if(m=l.match(/^JAVOB:\s*([A-D])/i))q.ans='ABCD'.indexOf(m[1].toUpperCase());
        else if(m=l.match(/^IZOH:\s*(.+)/i))q.izoh=m[1];
        else if(m=l.match(/^RASM:\s*(.+)/i))q.img.push(m[1]);
        else if(m=l.match(/^JADVAL(0?):?$/i)){q.tbl={head:m[1]!=='0',rows:[]};inT=true;}
        else if(inT&&l.indexOf('|')>=0)q.tbl.rows.push(l.split('|').map(function(c){return c.trim();}));
        else{inT=false;q.text.push(l);}});
      if(q.text.length&&q.opts.length>=2&&q.ans>=0&&q.ans<q.opts.length){q.text=q.text.join('\n');set.qs.push(q);}
      else warns.push('"'+set.title+'": '+(bi+1)+'-blok o\'tkazib yuborildi (savol, kamida 2 variant va JAVOB: kerak).');
    });
    if(!set.time)set.time=Math.max(1,set.qs.length);
    sets.push(set);
  });
  if(warns.length)document.getElementById('warn').innerHTML='<div class="warn">'+warns.map(esc).join('<br>')+'</div>';
  var list=document.getElementById('list');
  sets.forEach(function(s,i){
    var d=document.createElement('div');d.className='card row';
    d.innerHTML='<div>'+esc(s.title)+'<small>'+esc(s.desc)+' · '+s.qs.length+' savol · '+s.time+' daqiqa</small></div><span class="arrow">›</span>';
    d.onclick=function(){pick(i);};list.appendChild(d);
  });

  // ---- statistika ----
  function rec(ok){try{var st;try{st=JSON.parse(localStorage.getItem('tm_stats'));}catch(e){}
    if(!st||!st.days)st={total:0,correct:0,wrong:0,best:0,days:{}};
    function k(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    var d=new Date(),key=k(d);st.days[key]=(st.days[key]||0)+1;st.total++;if(ok)st.correct++;else st.wrong++;
    var n=0,c=new Date();while(st.days[k(c)]){n++;c.setDate(c.getDate()-1);}if(n>(st.best||0))st.best=n;
    localStorage.setItem('tm_stats',JSON.stringify(st));}catch(e){}}

  // ---- holat ----
  var S=null, Q=[], picked=[], cur=0, mode='', tmr=null, left=0, finished=false, shown=[], flags=[], paused=false;
  function screen(id){['sList','sMode','sQuiz','sRes'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==id);});window.scrollTo(0,0);}
  function pick(i){S=sets[i];document.getElementById('mTitle').textContent=S.title;document.getElementById('mDesc').textContent=S.qs.length+' savol · imtihon vaqti: '+S.time+' daqiqa';screen('sMode');}
  document.getElementById('mBack').onclick=function(){screen('sList');};
  document.getElementById('modeP').onclick=function(){begin('P');};
  document.getElementById('modeE').onclick=function(){begin('E');};
  function secOf(i){var c=0,sc=S.secs&&S.secs.length?S.secs:[{name:S.title,n:1e9}];for(var k=0;k<sc.length;k++){if(i<c+sc[k].n)return {name:sc[k].name,start:c,k:k};c+=sc[k].n;}return {name:sc[sc.length-1].name,start:0,k:0};}
  function begin(m){
    mode=m;finished=false;cur=0;paused=false;
    var fixed=(m==='E');
    var base=fixed?S.qs:shuffle(S.qs);
    Q=base.map(function(q){
      var idx=fixed?q.opts.map(function(_,i){return i;}):shuffle(q.opts.map(function(_,i){return i;}));
      return {text:q.text,img:q.img,tbl:q.tbl,izoh:q.izoh,opts:idx.map(function(i){return q.opts[i];}),ans:idx.indexOf(q.ans)};
    });
    picked=Q.map(function(){return -1;});shown=Q.map(function(){return false;});flags=Q.map(function(){return false;});
    screen('sQuiz');document.getElementById('lang').innerHTML='<option>'+(/rus tilida/i.test(S.title)?'Русский':"O'zbekcha")+'</option>';
    clearInterval(tmr);document.getElementById('veil').classList.remove('on');
    var tmEl=document.getElementById('tm');
    document.getElementById('pauseB').style.display=(m==='E')?'':'none';
    document.getElementById('tmlab').style.display=(m==='E')?'':'none';
    if(m==='E'){left=S.time*60;drawT();tmr=setInterval(function(){if(paused)return;left--;drawT();if(left<=0){clearInterval(tmr);finish();}},1000);}
    else tmEl.textContent='';
    render();
  }
  function drawT(){var t=document.getElementById('tm');var h=Math.floor(left/3600),mm=Math.floor(left%3600/60),ss=left%60,p=function(n){return String(n).padStart(2,'0');};t.textContent='🕒 '+p(h)+':'+p(mm)+':'+p(ss);t.className='tm'+(left<=300?' low':'');}
  function render(){
    var q=Q[cur];
    document.getElementById('secName').textContent=secOf(cur).name;
    var ob=document.getElementById('objb');ob.classList.toggle('on',!!flags[cur]);ob.textContent=flags[cur]?'ⓘ E\'tiroz belgilandi':'ⓘ E\'tiroz';
    document.getElementById('media').innerHTML=q.img.map(function(s){return '<img src="'+esc(s)+'" alt="" style="max-width:100%;border-radius:14px;margin-bottom:14px">';}).join('')+(q.tbl?'<table class="qtbl">'+q.tbl.rows.map(function(r,ri){var tg=(q.tbl.head&&ri===0)?'th':'td';return '<tr>'+r.map(function(c){return '<'+tg+'>'+esc(c)+'</'+tg+'>';}).join('')+'</tr>';}).join('')+'</table>':'');
    var qt=document.getElementById('qtext');qt.className='qtext'+(q.text.length>170?' sm':'');qt.innerHTML='<b style="margin-right:6px">'+(cur+1)+'.</b>'+esc(q.text).split('\n').join('<br>');
    var o=document.getElementById('opts');o.innerHTML='';
    q.opts.forEach(function(t,i){
      var b=document.createElement('button');b.className='opt';
      var cls='';
      if(mode==='P'&&shown[cur]){cls=i===q.ans?' ok':(i===picked[cur]?' no':'');}
      else if(picked[cur]===i)cls=' sel';
      b.className+=cls;b.disabled=(mode==='P'&&shown[cur]);
      b.innerHTML='<span class="k"></span><span>'+esc(t)+'</span>';
      b.onclick=function(){choose(i);};o.appendChild(b);
    });
    document.getElementById('exp').innerHTML=(mode==='P'&&shown[cur]&&q.izoh)?'<div class="ans">Izoh: '+esc(q.izoh)+'</div>':'';
    var pv=document.getElementById('prevB'),nx=document.getElementById('nextB');
    pv.disabled=(mode!=='E')||cur===0;
    nx.disabled=(mode==='E')?cur===Q.length-1:!shown[cur];
    nx.textContent=(mode==='P'&&cur===Q.length-1)?'Natijani ko\'rish':'Keyingi ›';
    var nv=document.getElementById('nav');nv.innerHTML='';
    var secs=S.secs&&S.secs.length?S.secs:[{name:S.title,n:Q.length}],c=0;
    secs.forEach(function(sc){
      var lab=document.createElement('div');lab.className='glab';lab.textContent=sc.name;nv.appendChild(lab);
      var g=document.createElement('div');g.className='pnav';
      for(var i=c;i<Math.min(c+sc.n,Q.length);i++)(function(i){var b=document.createElement('button');b.textContent=i+1;
        b.className=(i===cur?'cur ':'')+(picked[i]>=0?'done ':'')+(flags[i]?'flag':'');
        b.onclick=function(){if(mode==='E'){cur=i;render();}};g.appendChild(b);})(i);
      nv.appendChild(g);c+=sc.n;
    });
    document.getElementById('hint').style.display='block';
  }
  document.getElementById('objb').onclick=function(){flags[cur]=!flags[cur];render();};
  document.getElementById('prevB').onclick=function(){go(-1);};
  document.getElementById('nextB').onclick=function(){if(mode==='P'&&cur===Q.length-1)finish();else go(1);};
  document.getElementById('pauseB').onclick=function(){if(mode!=='E'||finished)return;paused=true;document.getElementById('veil').classList.add('on');};
  document.getElementById('resume').onclick=function(){paused=false;document.getElementById('veil').classList.remove('on');};
  document.getElementById('endB').onclick=function(){var un=picked.filter(function(x){return x<0;}).length;
    if(un&&!confirm(un+' ta savolga javob berilmagan. Baribir yakunlansinmi?'))return;finish();};
  function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();}}
  function choose(i){
    if(finished)return;
    if(mode==='P'){if(shown[cur])return;picked[cur]=i;shown[cur]=true;rec(i===Q[cur].ans);}
    else picked[cur]=i;
    render();
  }
  function finish(){
    if(finished)return;finished=true;clearInterval(tmr);
    var ok=0;Q.forEach(function(q,i){if(picked[i]===q.ans)ok++;if(mode==='E'&&picked[i]>=0)rec(picked[i]===q.ans);});
    var pct=Math.round(ok/Q.length*100);
    document.getElementById('rScore').textContent=ok+' / '+Q.length;var rc=document.getElementById('rCert'),lv=window.certLevel?certLevel(ok,Q.length):null;rc.style.display=lv?'':'none';if(lv)rc.textContent='🏅 Sertifikat ('+lv+')';
    document.getElementById('rPct').textContent=pct+'%';
    document.getElementById('rMsg').textContent=pct>=86?'Ajoyib natija! Attestatsiyaga tayyorsiz.':pct>=60?'Yaxshi, lekin xatolar ustida ishlang.':'Mavzularni takrorlab, yana urinib ko\'ring.';
    var rv=document.getElementById('review');rv.innerHTML='';
    Q.forEach(function(q,i){
      var good=picked[i]===q.ans;
      var d=document.createElement('div');d.className='rv '+(good?'good':'bad');
      d.innerHTML='<b>'+(i+1)+'. '+esc(q.text)+'</b>'+(flags[i]?'<p style="color:#e5484d">ⓘ E\'tiroz belgilangan</p>':'')+'<p>Sizning javobingiz: '+(picked[i]>=0?'ABCD'[picked[i]]+') '+esc(q.opts[picked[i]]):'javob berilmagan')+'</p>'+
        (good?'':'<p>To\'g\'ri javob: <b>'+'ABCD'[q.ans]+') '+esc(q.opts[q.ans])+'</b></p>')+(q.izoh?'<p>Izoh: '+esc(q.izoh)+'</p>':'');
      rv.appendChild(d);
    });
    screen('sRes');
  }
  document.getElementById('rCert').onclick=function(){var n=(prompt('Ism va familiyangiz:')||'').trim();if(n.length<3)return;var ok=0;Q.forEach(function(q,i){if(picked[i]===q.ans)ok++});makeCert({name:n,test:S.title,score:ok,total:Q.length})};
  document.getElementById('rAgain').onclick=function(){screen('sMode');};
  document.getElementById('rList').onclick=function(){screen('sList');};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('sQuiz').classList.contains('hidden'))return;
    var k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
    if(map[k]!==undefined&&map[k]<Q[cur].opts.length){e.preventDefault();choose(map[k]);}
    else if(e.key==='ArrowRight'&&mode==='E')go(1);
    else if(e.key==='ArrowLeft'&&mode==='E')go(-1);
    else if((e.key==='Enter'||e.key===' ')&&mode==='P'&&shown[cur]){e.preventDefault();if(cur===Q.length-1)finish();else go(1);}
  });
  (function(){try{var s=new URLSearchParams(location.search).get('set');if(s!==null&&sets[+s])pick(+s)}catch(e){}})();
</script></body></html>

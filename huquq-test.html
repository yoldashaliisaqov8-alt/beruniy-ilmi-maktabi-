<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huquqshunoslik testlari — Beruniy ilmi maktabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f9fb;
    --paper-light: #ffffff;
    --ink: #10223d;
    --ink-soft: #5b6b82;
    --wine: #1a6ee8;
    --wine-dark: #1457c0;
    --gold: #ffc928;
    --green: #2f9a5f;
    --bad: #d4574a;
    --line: #e6ecf2;
    --serif: 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  a{color:var(--ink-soft); text-decoration:none; font-size:16px;}
  .wrap{max-width:840px; margin:0 auto; padding:0 24px;}

  header{padding:26px 0;}
  .brand{font-family:var(--serif); font-size:24px; font-weight:600;}
  .brand span{color:var(--wine);}

  .test-head{padding:10px 0 34px;}
  .test-head .eyebrow{
    font-family:var(--serif); font-style:italic; color:var(--wine); font-size:17px; margin-bottom:10px;
  }
  .test-head h1{
    font-family:var(--serif); font-size:42px; font-weight:600; margin:0 0 12px;
  }
  .test-head p.sub{color:var(--ink-soft); font-size:18px; margin:0;}
  .progress-track{
    height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:22px;
  }
  .progress-fill{
    height:100%; background:var(--wine); width:0%; transition:width 0.3s ease;
  }
  .progress-text{font-size:16px; color:var(--ink-soft); margin-top:10px;}

  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    padding:44px 40px;
    margin-bottom:26px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:32px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 32px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:22px 24px;
    margin-bottom:14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:22px;
    color:var(--ink);
    cursor:pointer;
  }
  .option:hover{border-color:var(--ink-soft);}
  .option.correct{
    background:rgba(47,154,95,0.14);
    border-color:var(--green);
    font-weight:600;
  }
  .option.wrong{
    background:rgba(212,87,74,0.1);
    border-color:var(--bad);
  }
  .option:disabled{cursor:default;}

  .btn{
    display:inline-block;
    font-family:var(--sans);
    font-weight:600;
    font-size:18px;
    padding:16px 30px;
    border-radius:4px;
    border:none;
    background:var(--wine);
    color:var(--paper-light);
    cursor:pointer;
  }
  .btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}

  .result{
    text-align:center;
    padding:60px 20px;
  }
  .result .score{
    font-family:var(--serif);
    font-size:72px;
    font-weight:700;
    color:var(--wine);
    margin:0 0 10px;
  }
  .result p{color:var(--ink-soft); margin:0 0 32px; font-size:18px;}
  .hidden{display:none;}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .topic-card{
    background:var(--paper-light);
    padding:28px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-family:var(--sans);
  }
  .topic-card:hover{background:var(--paper);}
  .group-head{background:#eaf2ff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--wine-dark);}
  .group-head span{font-weight:700;font-size:15px;color:var(--ink-soft);}
  @media (max-width:600px){.group-head{padding:12px 18px;font-size:16px;}.topic-card{padding:20px 18px !important;}}
  .topic-info h3{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .topic-info p{
    margin:0;
    font-size:16px;
    color:var(--ink-soft);
  }
  .topic-arrow{
    font-family:var(--serif);
    font-style:italic;
    color:var(--wine);
    font-size:18px;
    flex-shrink:0;
  }
  .q-image{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:4px;
    margin:0 0 26px;
  }
  .q-table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 26px;
    font-family:var(--sans);
    font-size:17px;
  }
  .q-table td{
    border:1px solid var(--line);
    padding:10px 14px;
  }
  .q-table.nohead tr:first-child td{background:none;font-weight:inherit;font-family:inherit}
  .q-table tr:first-child td{
    background:var(--paper);
    font-weight:600;
    font-family:var(--serif);
  }

  .error-box{
    background:rgba(212,87,74,0.1);
    border:1px solid var(--wine);
    color:#9a3a30;
    padding:18px 20px;
    margin-bottom:20px;
    font-size:15px;
    border-radius:4px;
  }


  /* Variant harfi belgisi */
  .option{display:flex; align-items:center; gap:18px;}
  .opt-key{
    flex-shrink:0; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink-soft); border-radius:4px; font-weight:600; font-size:18px;
    font-family:var(--serif); color:var(--ink-soft); background:var(--paper-light);
  }
  .option.correct .opt-key{background:var(--green); border-color:var(--green); color:#fff;}
  .option.wrong .opt-key{background:var(--bad); border-color:var(--bad); color:#fff;}
  .kbd-hint{display:none; font-size:15px; color:var(--ink-soft); margin-top:6px;}

  /* KOMPYUTER UCHUN: kengroq maket */
  @media (min-width:1000px){
    .wrap{max-width:1080px; padding:0 40px;}
    .test-head h1{font-size:50px;}
    .test-head p.sub{font-size:20px;}
    .card{padding:56px 64px;}
    .q-text{font-size:38px; margin-bottom:40px;}
    .option{font-size:24px; padding:24px 28px;}
    .opt-key{width:42px; height:42px; font-size:20px;}
    .q-table{font-size:20px;}
    .q-image{max-height:460px; margin-left:auto; margin-right:auto;}
    .kbd-hint{display:block;}
    .option:hover{background:var(--paper-light); border-color:var(--wine);}
  }
  @media (min-width:1500px){
    .wrap{max-width:1240px;}
    .q-text{font-size:42px;}
    .option{font-size:26px;}
  }

  @media (max-width:600px){
    .q-text{font-size:24px;}
    .option{font-size:18px; padding:18px 18px;}
    .test-head h1{font-size:32px;}
    .card{padding:28px 24px;}
    .topic-info h3{font-size:21px;}
  }

  body{
    background-color:var(--paper);
    background-image:radial-gradient(circle at 12% 0%, #e8f1ff 0, transparent 38%), radial-gradient(circle at 100% 100%, #fff3da 0, transparent 34%);
    background-attachment:fixed;
  }
  .card{border-radius:30px; box-shadow:0 8px 24px -16px rgba(16,34,61,.25);}
  .option{border-radius:18px;}
  .btn{border-radius:16px;}
  .progress-track,.progress-fill{border-radius:6px;}
  .brand{font-weight:800; letter-spacing:.5px;}
  .q-text,.test-head h1{font-weight:800;}
</style>

</main>

<script type="text/plain" class="question-data"
        data-key="h8-00" data-group="8-sinf · Davlat va huquq asoslari" data-title="Kirish" data-desc="7 ta savol">
“Ta'lim faqat so'z va o'rgatish bilan bo'ladi. Tarbiya esa amaliy ish, tajriba bilan bo'ladi” — ushbu hikmatli so'z muallifi kim?
A) Arastu (Aristotel)
B) Umar Hayyom
C) Abu Nasr Forobiy
D) Alisher Navoiy
JAVOB: B

Davlat va huquq jamiyat hayotining qaysi munosabatlarini tartibga soluvchi muhim tarkibiy qismidir?
A) Faqat davlat organlari o'rtasidagi munosabatlarni
B) Faqat oilaviy va mulkiy munosabatlarni
C) Odamlar, tashkilotlar va ijtimoiy institutlar o'rtasidagi munosabatlarni
D) Faqat fuqarolar va chet el fuqarolari o'rtasidagi munosabatlarni
JAVOB: C

Davlatning huquqiy tizimi va tuzilishi asoslarini tushunish fuqarolarga nimada yordam beradi?
A) O'z huquq va majburiyatlarini anglashga hamda mamlakat hayotida faol ishtirok etishga
B) Soliq va to'lovlardan ozod bo'lishga
C) Faqat davlat xizmatiga ishga kirishga
D) Faqat saylovlarda ovoz berishga
JAVOB: A

Huquqiy bilim va madaniyat, qonunga va boshqa odamlarning huquqlariga hurmat, o'z burch va majburiyatlarini anglash ko'nikmasi nimaning asosi hisoblanadi?
A) Kuchli armiyaning
B) Uyg'un va barqaror jamiyatning
C) Markazlashgan davlat boshqaruvining
D) Iqtisodiy o'sishning
JAVOB: B

Davlat va huquq asoslari fanini o'rganishda yaqindan yordam beradigan fanlar qatorida darslikda tilga olinMAGAN fanlarni aniqlang!
A) Tarix va tarbiya
B) Geografiya, biologiya va matematika
C) Kimyo va fizika
D) Ona tili va adabiyot, iqtisodiy bilim asoslari
JAVOB: C

Davlat va huquq asoslari fanini o'rganish jarayonida shakllanadigan xususiyatlar TO'G'RI berilgan javobni aniqlang!
I. Huquqiy madaniyatli bo'lish; II. Huquqbuzarliklarga nisbatan murosasizlik; III. Siyosiy partiyaga a'zo bo'lish; IV. O'zgalar huquqlarini hurmat qilish; V. Huquqiy bilim va huquqiy ong; VI. Harbiy tayyorgarlik.
A) I, II, IV va V
B) III, IV, V va VI
C) II, III, IV va VI
D) I, III, V va VI
JAVOB: A

Markazda ko'rsatilgan ma'lumotga MOS KELMAYDIGAN javobni aniqlang!
RASM: rasmlar/h8-00-07.webp
A) 1
B) 2
C) 3
D) 4
JAVOB: D

</script>
<script type="text/plain" class="question-data"
        data-key="h8-01" data-group="8-sinf · Davlat va huquq asoslari" data-title="1–2-dars. Shaxs" data-desc="38 ta savol">
“Odamiy ersang, demagil odami, Onikim, yo'q xalq g'amidin g'ami” — ushbu misralar muallifi kim?
A) Umar Hayyom
B) Amir Temur
C) Abu Nasr Forobiy
D) Alisher Navoiy
JAVOB: D

“Odam” tushunchasi qanday tushuncha hisoblanadi?
A) Biologik tushuncha bo'lib, unga jonli tabiatning bir elementi sifatida qaraladi
B) Siyosiy tushuncha bo'lib, davlat fuqarosini bildiradi
C) Ijtimoiy tushuncha bo'lib, kundalik so'zlashuvda keng qo'llaniladi
D) Huquqiy tushuncha bo'lib, huquqiy munosabatlar ishtirokchisini bildiradi
JAVOB: A

“Inson” tushunchasi qanday tushuncha bo'lib, undan qayerda keng foydalaniladi?
A) Huquqiy tushuncha; qonun hujjatlarida
B) Ijtimoiy tushuncha; kundalik so'zlashuvda
C) Falsafiy tushuncha; faqat ilmiy asarlarda
D) Biologik tushuncha; yuridik adabiyotlarda
JAVOB: B

Huquqshunoslik fanida hamda yuridik adabiyotlarda aynan qaysi tushunchadan foydalaniladi?
A) Shaxs
B) Odam
C) Kishi
D) Kimsa
JAVOB: A

Qaysi tushuncha “inson” tushunchasining yuksak ko'rinishi, oliy maqomi hisoblanadi?
A) Odam
B) Shaxs
C) Individ
D) Kishi
JAVOB: B

Quyidagi fikrlardan qaysi biri TO'G'RI?
A) “Kimsa” va “kishi” so'zlari yuridik adabiyotlarda asosiy tushuncha sifatida qo'llaniladi
B) “Odam” yoki “inson” tushunchalariga huquqiy munosabatlarning ishtirokchisi sifatida qaralmaydi
C) “Shaxs” tushunchasi biologik tushuncha hisoblanadi
D) “Odam” va “inson” shaxs maqomisiz ham huquqiy munosabatlarning to'la ishtirokchisi bo'ladi
JAVOB: B

“Ongli ravishda o'z faoliyatini boshqarish imkoniyatiga ega bo'lgan, huquqiy munosabat ishtirokchisi sifatida muayyan huquq va majburiyatlarga ega inson” — ushbu ta'rif qaysi tushunchaga tegishli?
A) Odam
B) Individ
C) Inson
D) Shaxs
JAVOB: D

Tushunchalarni ularning ta'riflari bilan TO'G'RI moslashtiring!
JADVAL0:
1 | Umumijtimoiy tushuncha bo'lib, muayyan jamiyatda insoniy fazilatlarga ega ekanlikni ifoda etadi | a | Odam
2 | Biologik jihatdan fikrlash, so'zlash qobiliyatiga ega bo'lgan, shu tufayli jonli tabiatning boshqa hamma jonzotlardan ustun turuvchi bir qismi | b | Shaxs
3 | Huquqiy munosabatlarning alohida ishtirokchisi bo'lib, inson tushunchasining yuksak ko'rinishidir | c | Inson
A) 1-c, 2-b, 3-a
B) 1-b, 2-a, 3-c
C) 1-c, 2-a, 3-b
D) 1-a, 2-c, 3-b
JAVOB: C

Shaxs uchun muhim bo'lgan qadriyatlar juftligi XATO berilgan javobni aniqlang!
A) Ishxonasi — sinfdoshlari
B) Mahallasi — qo'ni-qo'shnisi
C) Uyi — oilasi
D) Mamlakati — vatani
JAVOB: A

Shaxs uchun muhim qadriyatlarga erishish, ularni saqlash va e'zozlash nima bo'lib xizmat qiladi?
A) Uning hayotining maqsadi, mazmuni
B) Faqat moddiy farovonlik manbai
C) Davlat oldidagi yagona burchi
D) Faqat shaxsiy ehtiyojlarini qondirish vositasi
JAVOB: A

Darslikka ko'ra insonning shaxs sifatida shakllanishida kimlarning ta'siri katta?
A) Faqat do'stlar va mahallaning
B) Davlat organlari va sudning
C) Oila, maktab, qo'ni-qo'shni, mahalla va do'stlarning
D) Faqat oila va maktabning
JAVOB: C

Darslikda buyuk shaxslar sifatida tilga olinMAGAN ajdodimizni aniqlang!
A) Mirzo Ulug'bek
B) Abu Nasr Forobiy
C) Burhoniddin Marg'inoniy
D) Jaloliddin Manguberdi
JAVOB: A

“Har bir inson tabiatan shunday tuzilganki, u yashash va oliy darajadagi yetuklikka erishmoq uchun ko'p narsalarga muhtoj bo'ladi... ularga ega bo'lish uchun insonlar jamoasiga ehtiyoj tug'iladi” — ushbu fikr muallifi va asarini aniqlang!
A) Alisher Navoiy, “Majolis un-nafois”
B) Yusuf Xos Hojib, “Qutadg'u bilig”
C) Burhoniddin Marg'inoniy, “Hidoya”
D) Abu Nasr Forobiy, “Fozil odamlar shahri”
JAVOB: D

Alisher Navoiy qaysi yillarda Samarqandda bo'lgan paytida fiqh (huquq) ilmidan dars olgan?
A) 1483–1489-yillarda
B) 1469–1475-yillarda
C) 1464–1469-yillarda
D) 1456–1464-yillarda
JAVOB: C

Alisher Navoiy Samarqandda qaysi mashhur faqih huzurida fiqh ilmidan dars olgan?
A) Abdurahmon Jomiy
B) Xoja Fazlulloh Abullays
C) Burhoniddin Marg'inoniy
D) Xoja Ahror Vali
JAVOB: B

Darslikdagi “faqih” so'zi qanday ma'noni anglatadi?
A) Tarixchi
B) Shoir
C) Huquqshunos
D) Faylasuf
JAVOB: C

“Faqir ikki yil alarning qoshida saboq o'qub erdim, ancha iltifotlari bor erdikim, “farzand” der erdilar” — Alisher Navoiy bu haqda qaysi asarida yozgan?
A) “Mahbub ul-qulub”
B) “Muhokamat ul-lug'atayn”
C) “Majolis un-nafois”
D) “Xamsa”
JAVOB: C

Burhoniddin Marg'inoniyning “Kitob al-Hidoya” asari qisqacha nomi “Hidoya” qanday ma'noni bildiradi?
A) Hikmatlar kitobi
B) Adolat yo'li
C) Qonunlar to'plami
D) To'g'ri yo'l
JAVOB: D

“Kitob al-Hidoya” asari haqidagi TO'G'RI ma'lumotlarni aniqlang!
I. Muallifi — Burhoniddin Marg'inoniy; II. Fiqh ilmi bo'yicha eng aniq, izchil, mukammal asar; III. Faqat oilaviy munosabatlarga bag'ishlangan; IV. Bugungi kunda ham islom huquqshunosligi bo'yicha nufuzli huquqiy manba sifatida foydalaniladi; V. Muallifi — Abu Nasr Forobiy.
A) II, III va V
B) I, II va IV
C) III, IV va V
D) I, III va IV
JAVOB: B

Darslikka ko'ra jamiyat va shaxs o'zaro qanday munosabatlarga kirishishi mumkin?
A) Ijtimoiy-iqtisodiy, ma'naviy, siyosiy va huquqiy
B) Faqat ijtimoiy-iqtisodiy
C) Faqat siyosiy va huquqiy
D) Harbiy, diniy va siyosiy
JAVOB: A

Mehnat munosabatlari va mulkiy munosabatlar shaxs va jamiyat o'rtasidagi qaysi munosabatlar turiga kiradi?
A) Ma'naviy munosabatlar
B) Siyosiy munosabatlar
C) Huquqiy munosabatlar
D) Ijtimoiy-iqtisodiy munosabatlar
JAVOB: D

Bilim olishga oid munosabatlar hamda tarixiy meros, ilmiy va texnik yutuqlardan foydalanish munosabatlari qaysi turga kiradi?
A) Ma'naviy munosabatlar
B) Siyosiy munosabatlar
C) Huquqiy munosabatlar

</script>

<script>
  // =====================================================================
  // BU YERDAN PASTGA TEGISHNING HOJATI YO'Q — bu qism yuqoridagi oddiy
  // matnni avtomatik o'qib, testga aylantiradi.
  // =====================================================================

  // 1) Bitta mavzu matnini savollar ro'yxatiga aylantiruvchi funksiya
  function parseTopicText(rawText) {
    const blocks = rawText.trim().split(/\n\s*\n/); // bo'sh qatordan bo'lib olamiz
    const result = [];
    const warnings = [];

    blocks.forEach((block, blockIndex) => {
      const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const questionLines = [lines[0]];
      const images = [];
      const tableRows = [];
      let tableNoHead = false;
      const options = [];
      let correctLetter = null;
      let mode = 'question'; // 'question' | 'table'

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];

        const imgMatch = line.match(/^RASM:\s*(.+)$/i);
        if (imgMatch) { images.push(imgMatch[1].trim()); mode = 'question'; continue; }

        if (/^JADVAL0?:?$/i.test(line)) { mode = 'table'; if (/^JADVAL0/i.test(line)) tableNoHead = true; continue; }

        const optMatch = line.match(/^([A-D])\)\s*(.+)$/);
        if (optMatch) { options.push(optMatch[2]); mode = 'options'; continue; }

        const ansMatch = line.match(/^JAVOB:\s*([A-D])/i);
        if (ansMatch) { correctLetter = ansMatch[1].toUpperCase(); continue; }

        if (mode === 'table' && line.includes('|')) {
          tableRows.push(line.split('|').map(cell => cell.trim()));
          continue;
        }

        if (mode === 'question') {
          questionLines.push(line); // savol matni bir necha qatorli bo'lishi mumkin
        }
      }

      if (options.length < 2 || options.length > 4 || !correctLetter || "ABCD".indexOf(correctLetter) >= options.length) {
        warnings.push(`${blockIndex + 1}-savolda xatolik bor (variantlar yoki JAVOB qatori to'liq emas): "${questionLines[0].slice(0, 40)}..."`);
        return;
      }

      result.push({
        text: questionLines.join('\n'),
        images: images,
        table: tableRows,
        tableNoHead: tableNoHead,
        options: options,
        correct: "ABCD".indexOf(correctLetter)
      });
    });

    return { questions: result, warnings: warnings };
  }

  // 2) Sahifadagi barcha mavzu bloklarini o'qib, questionSets ni yasaymiz
  const questionSets = {};
  const allWarnings = [];

  document.querySelectorAll('script.question-data').forEach(block => {
    const key = block.dataset.key;
    const parsed = parseTopicText(block.textContent);
    questionSets[key] = {
      title: block.dataset.title,
      group: block.dataset.group || '',
      desc: block.dataset.desc,
      questions: parsed.questions
    };
    parsed.warnings.forEach(w => allWarnings.push(`«${block.dataset.title}» mavzusida — ${w}`));
  });

  // Agar formatlashda xato bo'lsa, o'chirib tashlamay, o'qituvchiga ko'rsatamiz
  if (allWarnings.length > 0) {
    document.getElementById('errorArea').innerHTML =
      '<div class="error-box"><strong>Diqqat, quyidagi savollarni tekshiring:</strong><br>' +
      allWarnings.join('<br>') + '</div>';
  }

  let questions = [];
  let currentTopicKey = "";
  let current = 0;
  let score = 0;

  function renderTopicList() {
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    let lastGroup = null;
    for (const key in questionSets) {
      const set = questionSets[key];
      if (set.questions.length === 0) continue; // savoli yo'q mavzuni ko'rsatmaymiz
      if (set.group && set.group !== lastGroup) {
        lastGroup = set.group;
        const total = Object.values(questionSets).filter(x => x.group === set.group).reduce((a, x) => a + x.questions.length, 0);
        const h = document.createElement('div');
        h.className = 'group-head';
        h.innerHTML = `<b>${set.group}</b><span>${total} ta savol</span>`;
        list.appendChild(h);
        const mix = document.createElement('button');
        mix.className = 'topic-card';
        mix.innerHTML = `
          <div class="topic-info">
            <h3>Aralash test — ${set.group.split(' · ')[0]}</h3>
            <p>Hamma mavzulardan 30 ta tasodifiy savol</p>
          </div>
          <div class="topic-arrow">Boshlash →</div>`;
        mix.onclick = () => startMix(set.group);
        list.appendChild(mix);
      }
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `
        <div class="topic-info">
          <h3>${set.title}</h3>
          <p>${set.questions.length} ta savol</p>
        </div>
        <div class="topic-arrow">Boshlash →</div>
      `;
      card.onclick = () => startQuiz(key);
      list.appendChild(card);
    }
  }

  function startMix(group) {
    const all = [];
    Object.values(questionSets).forEach(x => { if (x.group === group) x.questions.forEach(q => all.push(q)); });
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    questionSets['__mix'] = { title: 'Aralash test — ' + group.split(' · ')[0], desc: '', group: '__mix', questions: all.slice(0, 30) };
    startQuiz('__mix');
  }

  function startQuiz(key) {
    currentTopicKey = key;
    questions = questionSets[key].questions;
    current = 0;
    score = 0;

    document.getElementById('testTitle').textContent = questionSets[key].title;
    document.getElementById('topicScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    const quizArea = document.getElementById('quizArea');

    let mediaHtml = '';
    (q.images || []).forEach(src => {
      mediaHtml += `<img class="q-image" src="${src}" alt="Savolga tegishli rasm">`;
    });
    if (q.table && q.table.length > 0) {
      mediaHtml += '<table class="q-table' + (q.tableNoHead ? ' nohead' : '') + '">';
      q.table.forEach(row => {
        mediaHtml += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      mediaHtml += '</table>';
    }

    let optionsHtml = '';
    q.options.forEach((opt, i) => {
      optionsHtml += `<button class="option" onclick="checkAnswer(${i})"><span class="opt-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    });

    const questionTextHtml = q.text.split('\n').join('<br>');

    quizArea.innerHTML = `
      <div class="card">
        <div class="q-text">${questionTextHtml}</div>
        ${mediaHtml}
        ${optionsHtml}
        <div class="kbd-hint">Klaviatura: A, B, C, D tugmalari bilan javob bering</div>
      </div>
    `;
    answered = false;

    document.getElementById('progressText').textContent = `${current + 1} / ${questions.length} savol`;
    document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
  }

  let answered = false;

  // Bosh sahifadagi statistika uchun (brauzer xotirasi)
  function recordAnswer(isCorrect){
    try {
      var st; try { st = JSON.parse(localStorage.getItem('tm_stats')); } catch(e){}
      if (!st || !st.days) st = {total:0, correct:0, wrong:0, best:0, days:{}};
      var d = new Date(), k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      st.days[k] = (st.days[k]||0) + 1;
      st.total++; if (isCorrect) st.correct++; else st.wrong++;
      var n=0, c=new Date(); while(st.days[c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0')]){n++; c.setDate(c.getDate()-1);}
      if (n > (st.best||0)) st.best = n;
      localStorage.setItem('tm_stats', JSON.stringify(st));
    } catch(e){}
  }

  function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const buttons = document.querySelectorAll('.option');

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      if (i === selectedIndex && selectedIndex !== q.correct) btn.classList.add('wrong');
    });

    if (selectedIndex === q.correct) score++;
    recordAnswer(selectedIndex === q.correct);

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    startQuiz(currentTopicKey);
  }

  function showTopicScreen() {
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('topicScreen').classList.remove('hidden');
  }

  // Klaviatura: A/B/C/D yoki 1/2/3/4
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const quiz = document.getElementById('quizScreen');
    if (!quiz || quiz.classList.contains('hidden')) return;
    const keys = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
    const idx = keys[e.key.toLowerCase()];
    if (idx === undefined) return;
    const btns = document.querySelectorAll('#quizArea .option');
    if (idx < btns.length) { e.preventDefault(); checkAnswer(idx); }
  });

  renderTopicList();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breyn-ring — Beruniy ilmi maktabi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
  .buzz{display:flex;gap:14px;margin:6px 0 4px;}
  .buzz button{flex:1;font-family:var(--font);font-size:22px;font-weight:800;padding:20px 10px;border-radius:20px;border:none;color:#fff;cursor:pointer;}
  .buzz .a{background:var(--blue);} .buzz .b{background:#8b4fd9;}
  .buzz button:disabled{background:#cfd8e3;cursor:not-allowed;}
  .buzz small{display:block;font-size:14px;font-weight:600;opacity:.9;}
  .status{font-size:22px;font-weight:800;text-align:center;margin:10px 0;min-height:30px;}
</style></head>
<body><div class="wrap">
<div class="top"><a class="back" href="zakovat.html" aria-label="Orqaga">←</a><span class="brand">BREYN-RING</span></div>

<div id="setup">
  <h1>Breyn-ring</h1>
  <p class="sub">Ikki jamoa. Savol o'qiladi, 60 soniya o'ylash vaqti. Birinchi bo'lib tugmani bosgan jamoa javob beradi.</p>
  <div class="card" style="padding:26px">
    <div class="field"><label>1-jamoa:</label><input class="txt" id="n1" value="1-jamoa"> <span style="color:var(--ink-soft);font-weight:600">tugma: Q</span></div>
    <div class="field"><label>2-jamoa:</label><input class="txt" id="n2" value="2-jamoa"> <span style="color:var(--ink-soft);font-weight:600">tugma: P</span></div>
    <button class="btn" id="go">Boshlash</button>
  </div>
</div>

<div id="play" class="hidden">
  <div class="score" id="score"></div>
  <div class="qbox card">
    <div class="qmeta" id="meta"></div>
    <div class="timer" id="tm">60</div>
    <p class="qtext" id="qt" style="margin-top:14px"></p>
    <div class="status" id="st"></div>
    <div class="buzz"><button class="a" id="b1"></button><button class="b" id="b2"></button></div>
    <div id="ab"></div>
    <div class="btnrow" id="host"></div>
  </div>
</div>

<div id="result" class="hidden"><div class="card" style="padding:40px;text-align:center">
  <h1 style="margin:0">O'yin tugadi</h1><p style="font-size:34px;font-weight:800;margin:14px 0" id="rt"></p>
  <div class="btnrow" style="justify-content:center"><button class="btn" id="again">Qayta o'ynash</button><a class="btn ghost" href="zakovat.html" style="display:inline-block">Zakovat bo'limi</a></div>
</div></div>
</div>

<!--
  YANGI SAVOL: SAVOL: ..., JAVOB: ..., IZOH: ... (ixtiyoriy) shaklida yozing.
-->
<script type="text/plain" id="data">
SAVOL: Qadimgi Misrda hukmdorlar qanday nom bilan atalgan?
JAVOB: Fir'avn
SAVOL: Rim imperiyasi 395-yilda nechta qismga bo'linib ketgan?
JAVOB: Ikkita (G'arbiy va Sharqiy)
SAVOL: 1215-yilda ingliz qiroli Ioann Yerlas imzolagan, qirol hokimiyatini cheklagan hujjat qanday nomlanadi?
JAVOB: Magna Karta
SAVOL: AQShning Mustaqillik deklaratsiyasi qaysi yilda qabul qilingan?
JAVOB: 1776-yil
SAVOL: Qadimgi Olimpiya o'yinlari qaysi mamlakatda o'tkazilgan?
JAVOB: Yunoniston
IZOH: O'yinlar Olimpiya shahrida o'tkazilgan.
SAVOL: Ulug'bek rasadxonasi qaysi shaharda qurilgan?
JAVOB: Samarqand
</script>

<script>
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  var qs=[],c=null,m;
  document.getElementById('data').textContent.split('\n').forEach(function(l){l=l.trim();if(!l)return;
    if(m=l.match(/^SAVOL:\s*(.+)/i)){c={q:m[1],a:'',izoh:''};qs.push(c);}
    else if(c&&(m=l.match(/^JAVOB:\s*(.+)/i)))c.a=m[1];
    else if(c&&(m=l.match(/^IZOH:\s*(.+)/i)))c.izoh=m[1];});
  var T=[{n:'',s:0},{n:'',s:0}], i=0, left=60, tmr=null, phase='think', locked=[false,false], buzzer=-1;
  function show(id){['setup','play','result'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==id);});}
  function drawScore(){
    document.getElementById('score').innerHTML=T.map(function(t,k){return '<div class="pl'+(buzzer===k?' act':'')+'"><span style="font-weight:800">'+esc(t.n)+'</span><b>'+t.s+'</b></div>';}).join('');
    document.getElementById('b1').innerHTML=esc(T[0].n)+'<small>tugma: Q</small>';
    document.getElementById('b2').innerHTML=esc(T[1].n)+'<small>tugma: P</small>';
    document.getElementById('b1').disabled=(phase!=='think'||locked[0]);
    document.getElementById('b2').disabled=(phase!=='think'||locked[1]);
  }
  function drawT(){var t=document.getElementById('tm');t.textContent=left;t.className='timer'+(left<=10?' low':'');}
  function runTimer(){clearInterval(tmr);drawT();tmr=setInterval(function(){left--;drawT();if(left<=0){clearInterval(tmr);reveal('Vaqt tugadi');}},1000);}
  function startQ(){
    if(i>=qs.length){clearInterval(tmr);var w=T[0].s===T[1].s?'Durang!':(T[0].s>T[1].s?T[0].n:T[1].n)+' g\'olib!';
      document.getElementById('rt').textContent=T[0].n+' '+T[0].s+' : '+T[1].s+' '+T[1].n+' — '+w;show('result');return;}
    phase='think';locked=[false,false];buzzer=-1;left=60;
    document.getElementById('meta').textContent='Savol '+(i+1)+' / '+qs.length;
    document.getElementById('qt').textContent=qs[i].q;
    document.getElementById('ab').innerHTML='';document.getElementById('st').textContent='O\'ylash vaqti...';
    document.getElementById('host').innerHTML='<button class="btn ghost" id="rv">Javobni ko\'rsatish</button>';
    document.getElementById('rv').onclick=function(){reveal('');};
    drawScore();runTimer();
  }
  function buzz(k){
    if(phase!=='think'||locked[k])return;
    clearInterval(tmr);phase='answering';buzzer=k;
    document.getElementById('st').textContent=T[k].n+' javob beryapti...';
    document.getElementById('host').innerHTML='<button class="btn good" id="ok">To\'g\'ri (+1)</button><button class="btn bad" id="no">Noto\'g\'ri</button>';
    document.getElementById('ok').onclick=function(){T[k].s++;reveal(T[k].n+' to\'g\'ri javob berdi!');};
    document.getElementById('no').onclick=function(){
      locked[k]=true;buzzer=-1;
      if(locked[0]&&locked[1]){reveal('Ikkala jamoa ham topolmadi');return;}
      phase='think';document.getElementById('st').textContent=T[k].n+' xato qildi. '+T[1-k].n+', davom eting!';
      document.getElementById('host').innerHTML='<button class="btn ghost" id="rv">Javobni ko\'rsatish</button>';
      document.getElementById('rv').onclick=function(){reveal('');};
      drawScore();runTimer();
    };
    drawScore();
  }
  function reveal(msg){
    clearInterval(tmr);phase='done';buzzer=-1;var q=qs[i];
    document.getElementById('st').textContent=msg;
    document.getElementById('ab').innerHTML='<div class="ans">Javob: '+esc(q.a)+(q.izoh?'<small>Izoh: '+esc(q.izoh)+'</small>':'')+'</div>';
    document.getElementById('host').innerHTML='<button class="btn" id="nx">'+(i+1>=qs.length?'Natijani ko\'rish':'Keyingi savol →')+'</button>';
    document.getElementById('nx').onclick=function(){i++;startQ();};
    drawScore();
  }
  document.getElementById('go').onclick=function(){
    T[0].n=document.getElementById('n1').value||'1-jamoa';T[1].n=document.getElementById('n2').value||'2-jamoa';
    T[0].s=0;T[1].s=0;i=0;show('play');startQ();
  };
  document.getElementById('b1').onclick=function(){buzz(0);};
  document.getElementById('b2').onclick=function(){buzz(1);};
  document.getElementById('again').onclick=function(){show('setup');};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('play').classList.contains('hidden')||e.target.tagName==='INPUT')return;
    var k=e.key.toLowerCase(); if(k==='q')buzz(0); else if(k==='p')buzz(1);
  });
</script></body></html>

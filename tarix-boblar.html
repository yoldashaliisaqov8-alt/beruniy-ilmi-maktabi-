var app=document.getElementById('app'),H=document.getElementById('h'),SUB=document.getElementById('sub'),back=document.getElementById('back');
function best(){try{return JSON.parse(localStorage.getItem('boblar_best')||'{}')}catch(e){return{}}}
function save(i,s){try{var b=best();if(!(b[i]>=s)){b[i]=s;localStorage.setItem('boblar_best',JSON.stringify(b))}}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var cur=0,qi=0,score=0,Q=[],mode='list';
back.onclick=function(e){if(mode!=='list'){e.preventDefault();list()}};
function list(){mode='list';back.setAttribute('href','fanlar.html');H.textContent='Boblashgan tarix';SUB.textContent='To\'plamni tanlang';
 var b=best(),h='<div class="list">';
 SETS.forEach(function(t,i){h+='<div class="card row" data-i="'+i+'"><div>'+esc(t.title)+'<small>'+esc(t.desc)+(b[t.id]!=null?' · eng yaxshi natija: '+b[t.id]+'/'+t.n:'')+'</small></div><span class="arrow">›</span></div>'});
 app.innerHTML=h+'</div>';
 [].forEach.call(app.querySelectorAll('.row'),function(r){r.onclick=function(){start(+r.dataset.i)}});window.scrollTo(0,0)}
function start(i){cur=i;qi=0;score=0;mode='quiz';var S=SETS[i];
 Q=shuf(S.q).slice(0,S.n).map(function(q){var idx=shuf([0,1,2,3]);return{t:q.t,img:q.img,m:q.m,o:idx.map(function(k){return q.o[k]}),a:idx.indexOf(q.a)}});show()}
function show(){var S=SETS[cur],q=Q[qi],n=Q.length;H.textContent=S.title;SUB.textContent='Savol '+(qi+1)+' / '+n;
 var h='<div class="meta"><span>'+(qi+1)+' / '+n+'</span><span>To\'g\'ri: '+score+'</span></div><div class="prog"><i style="width:'+(qi/n*100)+'%"></i></div><div class="card qbox"><p class="qt">'+esc(q.t)+'</p>'+(q.img?'<img class="qi" src="'+q.img+'" alt="">':'');
 q.o.forEach(function(o,k){h+='<button class="op" data-k="'+k+'"><b>'+'ABCD'[k]+')</b> '+esc(o)+'</button>'});
 h+='<div class="tg" id="tg" style="display:none">'+esc(q.m)+'</div></div><div class="btnrow"><button class="btn" id="nx" style="display:none">'+(qi+1<n?'Keyingisi →':'Natija')+'</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 [].forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){var k=+b.dataset.k;
  [].forEach.call(app.querySelectorAll('.op'),function(x){x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});
  if(k===q.a)score++;else b.classList.add('no');document.getElementById('nx').style.display='';document.getElementById('tg').style.display='';}});
 document.getElementById('nx').onclick=function(){qi++;qi<n?show():fin()}}
function fin(){var n=Q.length;save(SETS[cur].id,score);mode='res';SUB.textContent='Natija';
 app.innerHTML='<div class="card qbox"><div class="big">'+score+' / '+n+'</div><p class="qt">'+Math.round(score/n*100)+'% to\'g\'ri javob</p></div><div class="btnrow"><button class="btn" id="re">Yangi 30 ta test</button><button class="btn ghost" id="ls">Ro\'yxatga</button></div>';
 document.getElementById('re').onclick=function(){start(cur)};document.getElementById('ls').onclick=list}
list();
</script></body></html>

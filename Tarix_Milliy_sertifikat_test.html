<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarix – Milliy sertifikat (o'ta qiyin variant)</title>
<style>
  :root{
    --blue:#2f8fdb; --blue-d:#1f6fb3; --navy:#1e3d78; --navy2:#2a5298;
    --bg:#eef1f5; --card:#fff; --line:#dfe3e8; --text:#1f2937; --muted:#6b7280;
    --green:#16a34a; --green-bg:#e8f7ee; --red:#dc2626; --red-bg:#fdecec; --gold:#f5c542;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .topbar{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:12px 16px;font-weight:600;font-size:17px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
  .topbar a{background:rgba(255,255,255,.14);color:var(--gold);text-decoration:none;padding:6px 14px;border-radius:6px;font-weight:700}
  .topbar a:hover{background:rgba(255,255,255,.25)}
  main{flex:1;width:100%;max-width:1520px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
  .card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:relative;overflow:hidden}
  .qcard{padding:28px 36px;min-height:640px;display:flex;flex-direction:column}

  .qcard>*{position:relative}
  .qhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .qnum{color:#4b5563;font-size:18px}
  .timer{background:var(--red-bg);color:var(--red);font-weight:700;font-size:22px;padding:7px 18px;border-radius:24px;font-variant-numeric:tabular-nums}
  .timer.warn{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .section-tag{display:inline-block;margin-top:18px;background:#fff6d6;color:#8a6300;font-size:13px;font-weight:700;padding:3px 10px;border-radius:5px}
  .qtext{font-size:21px;font-weight:600;margin:18px 0 12px;line-height:1.45}
  .qbody{font-size:16.5px;line-height:1.65;margin-bottom:14px;color:#374151}
  .qbody .gap{height:8px}
  .opt{display:flex;align-items:flex-start;gap:14px;border:2px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:13px;cursor:pointer;font-size:17px;line-height:1.45;background:rgba(255,255,255,.88);transition:.15s}
  .opt:hover{border-color:#a9cdee;background:#f6fbff}
  .opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--blue);flex-shrink:0}
  .opt.sel{border-color:var(--blue);background:#eaf4fd}
  .wpart{margin:14px 0 6px;font-size:17px;line-height:1.5}
  .wpart b{color:var(--navy)}
  .winput{width:100%;font-size:17px;padding:12px 16px;border:2px solid var(--line);border-radius:8px;background:rgba(255,255,255,.92);outline:none}
  .winput:focus{border-color:var(--blue)}
  .qfoot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
  .btn{border:none;border-radius:7px;padding:13px 28px;font-size:18px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;transition:.15s}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#e5e7eb;color:#374151}
  .btn.ghost:hover{background:#d1d5db}
  .btn.finish{background:var(--green);margin-left:auto}
  .btn.finish:hover{background:#12813b}
  .btn:disabled{opacity:.45;cursor:default}
  .side{padding:22px 24px}
  .side h3{text-align:center;font-size:19px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:640px;overflow-y:auto;padding-right:6px}
  .grid button{aspect-ratio:1/0.98;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:17px;font-weight:600;cursor:pointer;color:#111}
  .grid button:hover{border-color:var(--blue)}
  .grid button.done{background:#dbeafe;border-color:#93c5fd}
  .grid button.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
  .grid button.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .grid button.bad{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .grid .lbl{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
  .legend{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  footer{text-align:center;padding:16px;border-top:1px solid var(--line);background:#fff;color:#4b5563;font-size:16px}
  footer b{color:#111}
  footer a{color:var(--blue-d);font-weight:600;text-decoration:none}
  /* start & result */
  .center{grid-column:1/-1;max-width:760px;width:100%;margin:0 auto;padding:40px 44px;text-align:center}
  .center h1{font-size:28px;color:var(--navy);margin-bottom:8px}
  .center .sub{color:var(--muted);margin-bottom:26px;font-size:17px}
  .info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
  .info div{background:#f3f6fb;border-radius:10px;padding:14px}
  .info b{display:block;font-size:24px;color:var(--navy)}
  .info span{font-size:14px;color:var(--muted)}
  .center input{width:100%;font-size:18px;padding:13px 16px;border:2px solid var(--line);border-radius:8px;margin-bottom:18px;text-align:center}
  .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center center;border:4px solid #e3ebf7;margin-bottom:14px}
  .score{font-size:56px;font-weight:800;color:var(--navy);margin:10px 0 4px}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
  .rgrid div{border-radius:10px;padding:14px;background:#f3f6fb}
  .rgrid b{display:block;font-size:22px}
  .review{grid-column:1/-1;padding:28px 36px}
  .review h2{font-size:21px;margin-bottom:16px;color:var(--navy)}

const TIME_MIN = 90;
const L = ["A","B","C","D"];
const N = TESTS.length + WRITTEN.length;
let cur = 0, timeLeft = TIME_MIN*60, timerId = null, finished = false, name = "";
const ans = Array(TESTS.length).fill(null);
const wans = WRITTEN.map(()=>["",""]);

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase()
  .replace(/[ʻʼ’‘`'´"«»“”]/g,"")
  .replace(/[.,;:!?()\-–—\/]/g," ")
  .replace(/\s+/g," ").trim();

function startTest(){
  name = document.getElementById("fio").value.trim();
  if(!name){ document.getElementById("fio").focus(); document.getElementById("fio").style.borderColor="var(--red)"; return; }
  document.getElementById("start").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("side").classList.remove("hidden");
  buildGrid(); go(0); tick(); timerId = setInterval(tick,1000);
}

function tick(){
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const t = document.getElementById("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", timeLeft<=300);
  if(timeLeft<=0){ finish(); return; }
  timeLeft--;
}

function buildGrid(){
  const g = document.getElementById("grid"); g.innerHTML="";
  for(let i=0;i<N;i++){
    if(i===0) g.insertAdjacentHTML("beforeend",'<div class="lbl">Test topshiriqlari</div>');
    if(i===TESTS.length) g.insertAdjacentHTML("beforeend",'<div class="lbl">Yozma ish</div>');
    const b=document.createElement("button"); b.textContent=i+1; b.onclick=()=>go(i); b.id="g"+i; g.appendChild(b);
  }
}

function isDone(i){
  if(i<TESTS.length) return ans[i]!==null;
  const w=wans[i-TESTS.length]; return w[0].trim()!=="" || w[1].trim()!=="";
}

function paintGrid(){
  for(let i=0;i<N;i++){
    const b=document.getElementById("g"+i); b.className="";
    if(finished){ b.classList.add(scoreOf(i)===maxOf(i)?"ok":"bad"); if(i===cur) b.style.outline="3px solid var(--blue)"; else b.style.outline=""; continue; }
    if(i===cur) b.classList.add("cur"); else if(isDone(i)) b.classList.add("done");
  }
}

function go(i){
  if(i<0||i>=N) return;
  cur=i;
  document.getElementById("qnum").textContent=(i+1)+"-savol / "+N;
  const w=document.getElementById("qwrap");
  if(i<TESTS.length){
    const q=TESTS[i];
    let h='<div class="qtext">'+(i+1)+". "+esc(q.q)+'</div>';
    if(q.b) h+='<div class="qbody">'+q.b.map(l=>l===""?'<div class="gap"></div>':'<div>'+esc(l)+'</div>').join("")+'</div>';
    q.o.forEach((o,k)=>{
      h+='<label class="opt'+(ans[i]===k?" sel":"")+'"><input type="radio" name="o" '+(ans[i]===k?"checked":"")+' onchange="pick('+k+')"><span>'+L[k]+") "+esc(o)+'</span></label>';
    });
    w.innerHTML=h;
  } else {
    const k=i-TESTS.length, W=WRITTEN[k];
    let h='<span class="section-tag">YOZMA ISH</span><div class="qtext">'+(i+1)+'-topshiriq</div>';
    ["a","b"].forEach((p,j)=>{
      h+='<div class="wpart"><b>'+p+')</b> '+esc(W[j].q)+'</div><input class="winput" value="'+esc(wans[k][j])+'" placeholder="Javobingizni yozing" oninput="wtype('+k+','+j+',this.value)">';
    });
    w.innerHTML=h;
  }
  document.getElementById("prev").disabled = i===0;
  document.getElementById("next").disabled = i===N-1;
  paintGrid();
  window.scrollTo({top:0,behavior:"smooth"});
}

function pick(k){ ans[cur]=k; go(cur); }
function wtype(k,j,v){ wans[k][j]=v; paintGrid(); }

function askFinish(){
  const left = [...Array(N).keys()].filter(i=>!isDone(i)).length;
  if(confirm(left? left+" ta savolga javob berilmagan. Testni yakunlaysizmi?" : "Testni yakunlaysizmi?")) finish();
}

function wOk(k,j){ const u=norm(wans[k][j]); return u!=="" && WRITTEN[k][j].ok.map(norm).includes(u); }
function scoreOf(i){ if(i<TESTS.length) return ans[i]===TESTS[i].a?1:0; const k=i-TESTS.length; return (wOk(k,0)?1:0)+(wOk(k,1)?1:0); }
function maxOf(i){ return i<TESTS.length?1:2; }

function finish(){
  if(finished) return; finished=true; clearInterval(timerId);
  let t=0,w=0; for(let i=0;i<TESTS.length;i++) t+=scoreOf(i); for(let i=TESTS.length;i<N;i++) w+=scoreOf(i);
  const total=TESTS.length+WRITTEN.length*2, got=t+w, pct=Math.round(got/total*100);
  const used=TIME_MIN*60-Math.max(timeLeft,0);
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("legend").classList.add("hidden");
  const r=document.getElementById("result"); r.classList.remove("hidden");
  r.innerHTML='<h1>Natija</h1><div class="sub">'+esc(name)+'</div><div class="score">'+pct+'%</div><div class="sub">'+got+' / '+total+' ball</div>'+
    '<div class="rgrid"><div><b style="color:var(--green)">'+t+' / '+TESTS.length+'</b>Test</div><div><b style="color:var(--navy)">'+w+' / '+WRITTEN.length*2+'</b>Yozma ish</div><div><b>'+Math.floor(used/60)+' daq '+(used%60)+' s</b>Sarflangan vaqt</div></div>'+
    '<button class="btn" onclick="location.reload()">Qaytadan ishlash</button>';
  let h='<h2>Javoblar tahlili</h2>';
  TESTS.forEach((q,i)=>{
    const ok=ans[i]===q.a;
    h+='<div class="ritem '+(ok?"ok":"bad")+'" id="r'+i+'"><div class="t">'+(i+1)+'. '+esc(q.q)+'</div>'+
       '<div class="u">Sizning javobingiz: '+(ans[i]===null?"— javob berilmagan":L[ans[i]]+") "+esc(q.o[ans[i]]))+'</div>'+
       (ok?'':'<div class="c">To\'g\'ri javob: '+L[q.a]+') '+esc(q.o[q.a])+'</div>')+'</div>';
  });
  WRITTEN.forEach((W,k)=>{
    const i=TESTS.length+k;
    h+='<div class="ritem '+(scoreOf(i)===2?"ok":"bad")+'" id="r'+i+'"><div class="t">'+(i+1)+'-topshiriq (yozma)</div>';
    ["a","b"].forEach((p,j)=>{
      const ok=wOk(k,j);
      h+='<div style="margin-top:6px"><b>'+p+')</b> '+esc(W[j].q)+'</div><div class="u" style="color:'+(ok?"var(--green)":"var(--red)")+'">Sizning javobingiz: '+(wans[k][j].trim()?esc(wans[k][j]):"— javob berilmagan")+'</div>'+
         (ok?'':'<div class="c">To\'g\'ri javob: '+esc(W[j].show)+'</div>');
    });
    h+='</div>';
  });
  const rv=document.getElementById("review"); rv.innerHTML=h; rv.classList.remove("hidden");
  // grid -> jump to review item
  for(let i=0;i<N;i++){ const b=document.getElementById("g"+i); b.onclick=()=>document.getElementById("r"+i).scrollIntoView({behavior:"smooth",block:"center"}); }
  cur=-1; paintGrid();
  window.scrollTo({top:0,behavior:"smooth"});
}

window.addEventListener("beforeunload",e=>{ if(timerId && !finished){ e.preventDefault(); e.returnValue=""; } });
document.getElementById("fio").addEventListener("keydown",e=>{ if(e.key==="Enter") startTest(); });
</script>
</body>
</html>

<h1>Huquqshunoslik</h1>
<p class="sub">Suhbat savollari: ularni ro'yxatdan ko'ring yoki elektron doskaga chiqaring</p>
<div id="app"></div>
</div>

<!--
  SUHBAT SAVOLLARINI QO'SHISH: pastdagi blokka shu shaklda yozing.
  MAVZU: mavzu nomi            (savollar mavzular bo'yicha guruhlanadi)
  SAVOL: savol matni
  JAVOB: javob yoki namuna javob (bir necha qator bo'lishi mumkin — keyingi qatorlar shu javobga qo'shiladi)
  Har bir yangi savol "SAVOL:" so'zidan boshlanadi.
-->
<script type="text/plain" class="suhbat-data">
MAVZU: Konstitutsiya
SAVOL: O'zbekiston Respublikasi Konstitutsiyasi qachon qabul qilingan?
JAVOB: 1992-yil 8-dekabrda.
SAVOL: Davlat hokimiyati qanday tarmoqlarga bo'linadi?
JAVOB: Qonun chiqaruvchi, ijro etuvchi va sud hokimiyatiga (hokimiyatlar bo'linishi prinsipi).

MAVZU: Huquq asoslari
SAVOL: Huquq va qonun tushunchalarining farqi nimada?
JAVOB: Namuna javob: qonun — davlat organi qabul qilgan rasmiy hujjat; huquq esa jamiyatda tan olingan umumiy qoidalar va erkinliklar tizimi. Qonun huquqni ifodalaydi, lekin ular aynan bir narsa emas.
</script>

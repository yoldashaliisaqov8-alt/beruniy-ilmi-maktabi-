SAVOL: O'rta Osiyo Salavkiylar davlati tarkibida haqida ma'lumot bering.
JAVOB: Mil. avv. 323-yil 13-iyunda Makedoniyalik Aleksandr vafot etadi. U barpo etgan davlat uch qismga: Makedoniya, Misr va Suriyaga bo'linib ketadi. Bu davlatlar Aleksandrning eng yaqin lashkarboshilari tomonidan boshqarilgan.Uzoq davom etgan o'zaro urushlardan so'ng mil. avv. 312-yilda Makedoniyalik Aleksandrning lashkarboshilaridan biri Salavk Bobil (Suriya davlati) hukmdori bo'ldi. Salavkiylar davlati tarkibiga Mesopotamiya, Eron, Parfiya, Baqtriya, Sug'diyona va Marg'iyona kirar edi. Salavk o'z davlati tarkibiga kirgan O'rta Osiyo viloyatlarini satrapiyalarga ajratadi. Davlat mudofaasi va qo'shinlarni tashkil etish bilan sobiq lashkarboshilardan tayinlangan strateglar shug'ullanar edi.Salavk o'g'li Antioxni Sharqiy viloyatlar – Parfiya, Marg'iyona, Baqtriya va Sug'diyonaga noib etib tayinladi. Salavkning vafotidan so'ng Antiox ulkan davlat boshida turib, uni 20 yilga yaqin boshqardi. Asta-sekinlik bilan Sug'diyona, Baqtriya va Marg'iyonada tinch hayot tiklana boshladi. Bu yerlarda yangi qal'alar va shaharlar bunyod etiladi, savdo-sotiq, dehqonchilik va hunarmandchilik rivojlana boshladi. Baqtra, Maroqanda, Marg'iyona Antioxiyasi (Marv), Termiz yirik shahar va madaniyat markazlariga aylanadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Salavkiylar bo'yicha haqida ma'lumot bering.
JAVOB: Podsho Antiox Salavk va Apama – Spitaman qizining farzandi edi. Malika Apama Salavkiylar davlatida mashhur bo'lgan. Vayronalari bugungi Suriya hududida joylashgan shahar uning sharafiga Apameya deb nomlangan. Bolalik davrida Antiox Sug'diyona haqida onasi aytib bergan hikoyalarni tinglagan. Ona tomonidan Sug'd uning ajdodlari zamini bo'lgan. Makedoniyalik Aleksandrga qarshi kurashgan Antioxning mashhur bobosi Spitamanning nomi va atoqli qavmi Sug'diyonada eng qadimgilaridan biri hisoblangan. Shu bilan birga, Spitama Sharqda qadimiy zardushtiylik diniga asos solgan Zaratushtra qavmining ham nomidir. Sug'diycha "Spitamana" nomining ildizlari avesto tilida "Spentamana" – "Muqaddas ruh" ma'nosini anglatgan. Savdo yo'llari bo'ylab joylashgan qal'alar katta ahamiyatga ega bo'lgan. Termiz yaqinidagi Amudaryoning o'ng qirg'og'ida joylashgan Kampirtepa qal'asi shular jumlasidandir.Arxeologlarning aytishicha, qal'a Makedoniyalik Aleksandrning Sug'diyonaga yurishlari davrida Oks – Amudaryodan o'tish joyida qurilgan. Qo'rg'on ichida savdo karvonlariga xizmat ko'rsatish uchun mo'ljallangan g'alla ombori bo'lgan.Boysun tog'larida Uzundara qal'asi joylashgan.U toshdan qurilgan mudofaa devorlari bilan o'ralgan.Bu yerda Baqtriya va Sug'diyonani bog'lab turgan muhim tog' yo'lini qo'riqlagan yunon-makedon jangchilarning garnizoni joylashgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Yunon-Baqtriya davlati haqida ma'lumot bering.
JAVOB: Mil. avv. 250-yilda Baqtriya Salavkiylar davlati tarkibidan ajralib chiqadi.Antik davr tarixchilarining xabar berishicha, bir qancha Baqtriya shaharlari hukmdori bo'lmish Diodot o'zini podsho deb e'lon qiladi. Shu voqeadan boshlab Yunon-Baqtriya davlati tarixi boshlanadi. Mil. avv.250-yilda Salavkiylar davlati tarkibidan ajralib chiqqan Parfiya Baqtriyaning raqibiga aylanadi. Baqtriyadan tashqari, Yunon-Baqtriya podsholigi tarkibiga Sug'diyona va Marg'iyona ham kirgan. Diodotdan keyin Yunon-Baqtriyada hukmronlik davlat tarixida sezilarli iz qoldirmagan Yevtidemga o'tadi. Yevtidemning o'g'li Demetriy hukmronligi davrida Yunon-Baqtriya podsholigi eng katta sarhadlarga ega bo'ldi. Hindistonning bir qismi bu davlatga qo'shib olindi.Parfiyada hokimiyat Mitridat I qo'liga o'tishi bilan u Baqtriyaga harbiy tazyiqni kuchaytiradi. Yunon-Baqtriya davlati tinimsiz urushlar olib borishga majbur bo'ldi va bu hol uning kuchsizlanishiga sabab bo'ldi. Bundan foydalangan ko'chmanchi yuechji qabilalari mil. avv. 140–130-yillar oralig'ida Yunon-Baqtriya davlatini bosib oladi.Yunon-Baqtriya davlati 120 yil taraqqiy etgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Qadimgi Xorazm haqida ma'lumot bering.
JAVOB: Qadimgi yunon tarixchisi Arrianning yozishicha, bu davrda Xorazmda Farasman podsholik qilgan.Mil. avv. IV–III asrlarda Xorazm O'rta Osiyoda shaharsozlik va me'morchilik keng rivojlangan muhim markazga aylanadi. Davlat chegaralarida hamda savdo yo'llari bo'ylab qal'alar quriladi. Xorazm-ning Xiva, Jonbosqal'a, Bozorqal'a va boshqa shaharlarida ulug'vor va muhtasham binokorlik ishlari amalga oshiriladi. Ushbu o'lka aholisi xo'jaligining asosini sun'iy sug'orma dehqonchilik va chorvachilik tashkil etgan. Shaharlar va dehqonchilik uy-qo'rg'onlarining atroflarini dalalar, bog'lar va tokzorlar o'rab turgan. Amudaryodan uzunligi 40–50 kilometrga yetadigan keng sug'orish kanallari chiqarilgan. Xorazmliklar bug'doy, arpa va tariq ekishgan.Alohida qal'alarda g'alla saqlash uchun mo'ljallangan katta omborlar joylashgan. Amudaryoning o'ng qirg'og'idagi Oqchaxon qal'asida (mil. avv. II–I asrlar) saroy va ibodatxona joylashgan. Ibodatxona yo'laklarining devorlari odamlar, otlar va otliqlar tasviri tushirilgan rang-barang rasmlar bilan qoplangan. Ayniqsa,30 ta qahramon portreti alohida ajralib turadi, ularning aksariyati qush shaklidagi toj kiydirilgan holda tasvirlangan.Ushbu binolarni qurish uchun davlatning barcha hududlarida ishlab chiqarilgan xom g'ishtlar katta miqdorda ishlatilgan. Qurilishda me'morlar, rassomlar va haykaltaroshlar ishtirok etgan.Milodiy II–III asrlarda shohona shahar – Xorazm hukmdorlarining qarorgohi Tuproqqal'a bunyod etilgan. Uning shimoliy qismida katta saroy va ibodatxonalar joylashgan.Saroy xonalari qadimgi ma'budlar, shohlar, jangchilar,musiqachilar, hayvonlar tasvirlari bilan bezatilgan. Zallardan birida devor bo'ylab supada bo'yalgan loy haykallar o'rnatilgan. Ularning umumiy soni 115 ta bo'lgan. O'rta Osiyodagi eng qadimgi yozuv Xorazm hududidan topilgan. Oybo'yirqal'a (mil. avv. V–IV asrlar) yodgorligidan topilgan, xum sirtiga bitilgan yozuv namunasi shular jumlasidandir. Aramey alifbosiga asoslangan qadimgi Xorazm yozuvi 20 ta harfdan tashkil topgan. Mil. avv. III asrda Xorazmda mustahkam istehkom – Qo'yqirilganqal'a qurilgan. Qal'a ibodatxonasidan kohinlar osmon jismlarining harakatlarini kuzatgan. Xorazm vohasida zardushtiylik ta'limoti keng yoyilgan. O'rta Osiyoda zardushtiylik dafn marosimlari bilan bog'liq eng qadimgi ossuariylar – suyakdonlar Xorazmdan topilgan. Xorazmliklar yer, suv va
olovga sajda qilib, mazkur muqaddas unsurlarni qadrlagan. Milodiy I asrda Xorazmda ishlab chiqilgan mahalliy taqvimdan xorazmliklar VIII asrga qadar foydalangan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: QANG' DAVLATI haqida ma'lumot bering.
JAVOB: Xitoy manbalarida Qang'xa (Qang') davlati Qang'yuy deb atalgan. Unga mil.avv. III asrda saklar asos solgan. Arxeologlarning aniqlashicha, Toshkent vohasining Oqqo'rg'on tumanida mil. avv. III asrda bunyod etilgan Qanqa shahar-qal'asi saklarning sobiq poytaxti – Qang'diz bo'lgan. Xitoy manbalarida bu shahar Bityan deb atalgan. Mil. avv. II asr oxirida Qang' qudratli davlat birlashmasiga aylanadi. Uning hukmdorlari o'z tangalarini zarb qildirgan. Davlatning madaniy markazlaridan biri Toshkent vohasi edi. Ayni shu hududda o'troq ziroatchilik va chorvachilik madaniyati rivoj topgan. Qang'liklar olov va quyoshga sig'ingan. Mil.avv. II asrda Shoshtepada doira shaklidagi olov ibodatxonasi qurilgan. Dumaloq shakl quyosh ramzi hisoblangan. Qang' hududidan Buyuk ipak yo'lining shimoliy
tarmog'i o'tganligi mamlakat iqtisodi va savdo-sotiq rivojiga imkon yaratdi. Milodiy III asrga kelib Qang' davlati mayda mulklarga parchalanib ketadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: DAVAN DAVLATI haqida ma'lumot bering.
JAVOB: Davan davlati (Xitoy manba-larida bu o'lka shu nom bilan tilga olinadi) taxminan mil. avv. III asrda paydo bo'lib, Farg'ona vodiysida joylashgan. Davan haqidagi ma'lumotlar xitoy manbalarida kengroq yoritilgan. Bu yerga tashrif buyurgan Xitoy elchisi Chjan Szyan shunday yozgan: "Davanda 70 ta katta-kichik shahar bor, uning aholisi bir necha yuz ming kishidan iborat". Xitoy hukmdorlari bu davlatni bosib olmoqchi bo'ldi. Harbiy yurishlarning birida ular Davan davlatining poytaxti Ershini qo'lga kiritdi, biroq aholisining tovon to'lashi evaziga uni tashlab chiqishga majbur bo'ldi. Otlar naslining biriga hatto ular "samoviy" deb nom bergan. "Samoviy otlar" baquvvat va chopqir bo'lgan. Ko'p sonli aholiga, yaxshi qurollangan va mashq ko'rgan qo'shinlarga ega bo'lgan Davan mil. avv. II–I asrlarda yuksak taraqqiy etgan davlatga aylangan. Qadimgi Farg'onada dehqonchilik madaniyati yuqori darajada rivojlangan. Farg'ona vodiysida Sho'rabashot, Axsikent, Uchqo'rg'on kabi shahar xarobalari o'rganilgan. Olimlarning aniqlashicha, milodiy III asrda Davan davlati barham topgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: "Samoviy otlar" tufayli bo'lgan urushlar haqida ma'lumot bering.
JAVOB: Xitoy lashkarining Davanga birinchi yurishi mag'lubiyat bilan yakun topdi. Ikkinchi yurishda Xitoy hukmdorining qo'shinlari 60 ming nafar edi. Bu lashkarning qator-qator qurol va ozuqa ortgan ta'minotchi karvonlari bor edi. Yilnomachi "butun saltanat harakatga kelgan edi" deb yozadi. Davan sari 50 nafar sarkarda qo'shinlari bilan jo'nadi. Davanliklarni kutilmaganda bosish uchun ular jadal sur'at bilan jilishdi. Ular Ershi shahrini qamal qildi. Shaharga keladigan suv yo'lini to'sdi va qamalning qirqinchi kunida shaharning tashqi devorini buzdi. Davan hukmdori qal'aga berkinib oldi va sulh to'g'risida muzokaralar boshladi. Xitoyliklarga arg'umoqlardan berishga rozilik bildirdi. Aks holda, barcha arg'umoqlarni qirg'in qilmoqchi bo'ldilar. Qang' davlatidan madad yetib kelishidan cho'chib, xitoyliklar sulhga rozi bo'ldi.Xitoy lashkari Ershiga bostirib kirmasdan, zarur miqdordagi otlardan tovon sifatida olib, o'z vataniga qaytdi. "Samoviy otlar" uchun bo'lib o'tgan to'rt yillik urush shu bilan tugadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Kushon davlati haqida ma'lumot bering.
JAVOB: Milodiy I asrda yuechjilar orasida Kushon xonadoni yuksalib, Kushon davlatiga asos solinadi. Yuechji qabilalarining mulklarini birlashtirgan birinchi kushon hukmdori Kudzula Kadfiz bo'lgan. Bu davrda Afg'oniston va Hindiston viloyati – Kashmir Kushon davlatiga qo'shib olingan. Vima Kadfiz hukmronligi paytida davlat yanada kengayib, podsho Kanishka davrida ulkan imperiyaga aylandi. Uning hududiga Hindiston, Afg'oniston va O'zbekistonning janubigacha bo'lgan yerlar kirgan. Rim, Parfiya, Xitoy davlatlari qatori Kushon podsholigi ham ulkan imperiyalardan biri bo'lgan. Ammo to'xtovsiz urushlar oqibatida Kushon davlati inqirozga yuz tutadi va milodiy III asrda parchalanib ketadi. Vima Kadfiz davrida Kushon podsholigida hukmdor nomi bitilgan tanga zarb qilish boshlanib, pul islohoti amalga oshiriladi. Kanishka hukmronligi davrida Kushon podsholigi o'z taraqqiyotining cho'qqisiga erishadi. Kushon davlati xo'jaligining asosini sug'orma dehqonchilik, savdo-sotiq va hunarmandchilik tashkil qilgan. Bug'doy, arpa va sholi yetishtirilgan. Kushonlar davrida suv tegirmoni, chig'ir turlaridan keng foydalanildi. Hunarmandchilik ham yuksak darajada taraqqiy etgan. Kushon davlati yodgorliklari bo'lmish Xolchayon,Dalvarzintepa, qadimiy Termiz, Zartepa, Kampirtepa va boshqalarni o'rganish jarayonida aniqlangan topilmalar ham buni tasdiqlaydi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: KUSHON DAVLATI YOZUVI haqida ma'lumot bering.
JAVOB: Qadimgi Termiz yodgorliklarini o'rganish natijasida aramey yozuvi asosidagi kushon-baqtriya alifbosidagi yozuv namunalari topilgan. Kushon mamlakatida yana bir yozuv – kushon shaklli yozuvi mavjud bo'lgan, bunda harflar burchakli va aylana shaklida yozilgan. Kushon podsholigida yana bir yozuv tizimi mavjudligini Surxko'tal (Afg'onistondagi Qunduz shahri yaqinida) va Kampirtepa (Termiz yaqinida) yodgorligidan topilgan yunon alifbosidagi kushon bitiklari tasdiqlaydi. Amudaryoning quyi oqimi zaminida, Zarafshon va Qashqadaryo vohalarida aramey alifbosi asosidagi xorazmiy va sug'diy yozuvlar ham keng tarqalgan edi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: KUSHON DAVLATI MADANIYATI haqida ma'lumot bering.
JAVOB: Kushon davlati tashkil topayotganda Baqtriya, Sug'diyonaning asosiy aholisi zardushtiylik dinida edi. Kushon podsholigi tarkibiga Hindistonning shimoliy qismi qo'shib olinganidan keyin hozirgi O'zbekistonning janubiy hududlari bilan yaqindan aloqalar o'rnatilgach, Kushon davlati hududiga buddaviylik dini kirib kela boshlagan. Surxon vohasidagi Eski Termiz, Ayritom va Dalvarzintepada katta buddaviylik ibodatxonalari mavjud bo'lgan. Buddaviylik dini zardushtiylik bilan birga milodiy VIII asrgacha O'rta Osiyoda saqlanib qoladi. Dalvarzintepa va Eski Termiz singari shaharlar xom g'ishtdan qurilgan mustahkam mudofaa devorlari bilan o'ralgan edi. Xolchayondagi Kushon hukmdorlari saroyi, Eski Termiz (Qoratepa, Fayoztepa) va Dalvarzintepadagi buddaviylik ibodatxonalarida o'sha davr devoriy tasvirlari va haykaltaroshlikning yuksak san'atkorona namunalari o'rganilgan. Kandakorlik yuqori darajada rivojlangan. Dalvarzintepadan fil suyagidan yasalgan shaxmat donalari topilgan. Kushon san'atida mahalliy an'analar, Qadimgi Sharq va Qadimgi Yunoniston ellinistik san'ati uslublari muvofiqlashgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Buyuk ipak yo'li haqida ma'lumot bering.
JAVOB: XVI asrga qadar Sharq va G'arb o'rtasidagi madaniy aloqalar va savdo munosabatlari taraqqiyotida qadimgi dunyoda mashhur bo'lgan Buyuk ipak yo'li muhim o'rin tutgan edi. Bu yo'l mil. avv. II asrda vujudga kelgan. Bu yo'lga "Ipak yo'li" degan nom 1877-yilda nemis geografi F. Rixtgofen tomonidan berilgan. Buyuk ipak yo'lining uzunligi 12 ming kilometrni tashkil etgan. U Sariq dengiz qirg'og'idan boshlanib, O'rta Yer dengizi sohillarigacha borgan. Bu yo'lda qadimiy shaharlar joylashgan. Sug'diyonadan Xitoyga junli matolar, gilamlar, zeb-ziynat buyumlari va qimmatbaho toshlar; Baqtriyadan tuyalar, Farg'onadan zotli otlar, Badaxshondan lojuvard olib borilgan; Hindistondan O'rta Osiyo viloyatlariga paxtadan tayyorlangan matolar va chigit ortilgan karvonlar kelgan; Xitoydan guruch keltirilgan; O'rta Osiyodan Xitoyga uzum, yong'oq, anor va boshqa dehqonchilik mahsulotlari yetkazilgan. Xitoy imperatori U-Di Xitoyning shimoliy qismini vayron
qilgan ko'chmanchi hun qabilalariga qarshi kurashda ittifoqchi va hamkorlar topish uchun elchi Chjan Szyanni yuboradi. Elchi hunlar qo'liga asir tushadi va o'n yilcha hibsda yotadi. U asirlikdan qochib, Markaziy Tyanshan dovonlari orqali Issiqko'lga chiqadi. Norin daryosi bo'ylab Farg'ona vodiysiga keladi. Chjan Szyan Oloy vodiysidan o'tib vataniga qaytadi. Elchi Xitoy imperatoriga ko'rgan-bilganlarini so'zlab beradi. U Xitoyga Farg'ona otlaridan birini va beda urug'idan olib kelgan edi. Bu otni xitoyliklar "samoviy" deb atagan. Imperator U-Di o'z saroyi yaqinida beda ektiradi. Keyinchalik u Xitoyning butun shimoli bo'ylab ekiladigan bo'ldi. Chjan Szyan yurgan yo'l bo'ylab Xitoy mamlakatini Markaziy va G'arbiy Osiyo bilan bog'lovchi jahon ahamiyatiga ega Buyuk ipak yo'li deb ataluvchi karvon yo'li o'tadigan bo'ldi.
MANBA: 6-sinf O'zbekiston tarixi darsligi

MAVZU: 7-sinf · 1-mavzu: Ajdodlarimizning ma'naviy qadriyatlari – jahon sivilizatsiyasi asoslaridan biri. (3-7-betlar)
SAVOL: Ajdodlarimizning ma'naviy qadriyatlari – jahon sivilizatsiyasi asoslaridan biri haqida ma'lumot bering.
JAVOB: Yangi 7-sinf O'zbekiston tarixi darsligida IV asrdan XIII asr boshlarigacha bo'lgan Vatanimizning o'rta asrlar tarixi bilan tanishasiz.
Bunda "o'zbiy" va "o'zbek" atamalari bilan ulug'langan o'zbek xalqi shakllanganligi haqidagi ma'lumotlar ham o'rin olgan.
"O'rta asrlar" tushunchasi tarix faniga Italyan tarixchilari tomonidan olib kirilgan. Bu tushuncha xususiy mulkchilik shakli o'zgarishi davrlari bilan bevosita bog'liq. Sharq mamlakatlarida yer-mulk munosabatlari azaldan Jamoaviy asoslarda rivojlanib kelgan. Shu sababli "o'rta asrlar" tushunchasi tariximizda shartli ravishda ishlatib kelinadi. Aslida o'rta asrlarning Yevropa uchun amal qiluvchi davriy chegaralari Sharq, xususan, Turon tarixidagi davr bilan farqlanadi.
Yevropada o'rta asrlarning boshlanishi Rim imperiyasining qulashi (476-y.), V asr oxirlari voqealariga to'g'ri keladi. Bizning tariximizda esa, "o'rta asrlar" deb atalayotgan davr IV asr oxirlari hamda V asr o'rtalaridan siyosiy maydonda kidariylar, xioniylar, eftaliylar kabi etnik atamalar ostida tushuniladigan qabila uyushmalari paydo bo'lgan davrdan boshlangan.
Bizning tariximizda o'rta asrlar, o'z navbatida, Ilk, rivojlangan va so'nggi o'rta asrlarga bo'linadi. Mazkur davrda Xorazm, xioniylar, kidariylar, eftaliylar, Turk xoqonligi, keyinchalik somoniylar, qoraxoniylar, xorazmshohlar, Amir Temur va temuriylar hukmronlik qilgan yirik davlatlar mavjud bo'lgan.
Ilk o'rta asrlarda «qishloq hokimlari» deb atalgan katta yer egalari – dehqonlar va ularning ekinzorlarida ishlovchi yersiz kadivarlar shakllandi.
VIII asr boshlariga kelib mamlakatimiz hududida arab xalifaligi hukmronligi o'rnatildi hamda o'lkamiz madaniyatiga islom dinining ta'siri kuchaydi. Xalifalik hukmronligidan keyingi asrlarda ilm-ma'rifatning rivoji uchun sharoit yuzaga keldi. Yurtimizdan jahon ilm-fan taraqqiyotiga hissa qo'shgan Muhammad ibn Muso Xorazmiy, Ahmad Farg'oniy, Abu Ray hon Beruniy, Abu Ali ibn Sino kabi buyuk mutafakkirlar yeti shib chiqdi.
Qadimdan «Turon» deb atalib kelingan yurtimiz va unga tutash hududlar arablar davridan «Movarounnahr» va «Xuroson» deb, XVIII-XIX asr g'arb olimlari va sayyohlari tomonidan «O'rta Osiyo» yoki «Markaziy Osiyo» deb nomlangan.
O'rta asrlar quyidagi 3 davrga bo'linadi: birinchisi, Ilk o'rta asrlar (IV-VIII), ikkinchisi, Rivojlangan o'rta asrlar (IX-XV), uchinchisi, So'nggi o'rta asrlar (XVI-XIX).
IX-XII asrlarda zaminimizda tug'ilib, voyaga yetgan Imom Buxoriy, Imom Termiziy, Mahmud Zamahshariy, Ahmad Yassaviy, Najmiddin Kubro singari mashhur ulamolarning islom dini va ta'limotiga oid asarlari bugungi kunda ham o'z ahamiyatini yo'qotmagan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 1-mavzu, 3-7-betlar

MAVZU: 7-sinf · 2-mavzu: IV-VII asrlarda mamlakatimiz xalqlarining turmush tarzi. (8-9-betlar)
SAVOL: IV-VII asrlarda mamlakatimiz xalqlarining turmush tarzi haqida ma'lumot bering.
JAVOB: Vatanimiz turli davrlarda Turon, Turkiston, Movarounnahr nomlari bilan shuhrat topgan.
Ilk o'rta asrlarda suv tegirmoni, chig'ir va charxpalak kabi suv inshootlari kashf etilishi qishloq xo'jalik ishlarining rivojiga ta'sir ko'rsatdi. Shaharlar hunarmandchilik, savdo-sotiq va madaniy hayotning markaziga aylandi.
Ilk o'rta asrlarda Turonda shakllangan tabaqalar: Dehqon (qishloq hokimi) – ilk o'rta asrlarda mulkdor tabaqa. Dehqonlarning shaharda hunarmandchilik rastalari, uylari bo'lgan. Ularning xo'jaligida ko'plab odamlar mehnat qilganlar. Kashovarz – ziroatchi oddiy qo'shchilar. Kadivar – qishloqning dehqonlarga qaram aholisi. Chokar – dehqon mulkini qo'riqlovchi, harbiy posbon.
VI asrda unumdor yerlar hamda suv taqsimoti qabila boshliqlari va ishboshilarning nazoratiga o'tdi. Bu esa, ularning qishloq aholisiga o'z ta'sirlarini o'tkazish, ziroatchi aholiga hukmronlik qilish imkoniyatini berdi.
So'nggi antik davr (milodiy II-IV asrlar) dan boshlangan tub o'zgarishlar shu qadar tez kechdiki, oqibatda, bir tomondan, O'rta Osiyoning dehqonchilik viloyatlarida (Sug'diyona, Marg'iyona, Toxariston, Xorazm, Choch, Farg'ona va boshqalar) o'nlab mahalliy hokimliklar tashkil topib, ikkinchi tomondan, ularning yiriklashish jarayoni ham jadal kechdi. Ahmadali Asqarov, «O'zbek xalqining etnogenezi va etnik tarixi».
MANBA: 7-sinf O'zbekiston tarixi darsligi, 2-mavzu, 8-9-betlar

MAVZU: 7-sinf · 3-4-mavzu: IV-VII asrlarda Xorazm.(10-14-betlar)
SAVOL: IV-VII asrlarda Xorazm (Afrig'iylar sulolasining hokimiyat tepasiga kelishi) haqida ma'lumot bering.
JAVOB: Ilk o'rta asrlarda Xorazmni boshqargan sulola: Afrig'iylar. (III-X asrlarda).
Hukmdorlari: Afrig', Shovshar, Jamshid.
Poytaxtlari: Toproqqal'a, Kat.
Hududi: Xorazm.
Ilk o'rta asrlarda Xorazmning siyosiy hayoti: Zaiflashib borayotgan Qang' davlati tarkibidan dastlab Xorazm ajralib chiqdi. Uni mahalliy Afrig'iylar sulolasiga mansub xorazmshohlar idora qilishgan. Milodiy 305-yilda xorazmshoh Afrig' o'z qarorgohini Xorazmning qadimgi poytaxti Kat shahriga ko'chirdi. Kat qayta tiklanib, uning yonida joylashgan Alfir qasri ichida shoh o'ziga yangi saroy qurdirdi. Xuddi shu paytdan boshlab Xorazmning Afrig'iy podshohlari oldi tomoniga shoh, orqa tomoniga suvoriy tasvirlari tushirilgan kumush tangalar zarb etib, mamlakatning ichki va tashqi savdo munosabatlarida mustaqil bo'lib olganlar.
Ilk o'rta asrlarda Xorazmning ijtimoiy hayoti: Xorazm diyorida sug'orma dehqonchilik, hunarmandchilik, chorvachilik va savdo-sotiq, ilm-fan, san'at, xususan, haykaltaroshlik yuqori darajada rivoj topgan. Aholi chorvachilik va baliq ovlash bilan shug'ullangan. Ularning xo'jalik turmushida, asosan, baliq, qovun, qovoq, yovvoyi jiyda va tut alohida o'rin tutgan. Xorazm hunarmandlari tomonidan juda chiroyli qilib yasalgan sopol idishlar saroylarni bezab turgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 3-4-mavzu, 10-14-betlar
SAVOL: Ilk o'rta asrlarda Xorazmning poytaxtlari haqida ma'lumot bering.
JAVOB: Xorazm davlatining poytaxti dastlab Qoraqalpog'istonning hozirgi Ellikqal'a tumanida joylashgan qadimgi Tuproqqal'a shahar xarobasining o'rnida bo'lgan. Abu Rayhon Beruniy. Mudofaa jihatidan poytaxt (Tuproqqal'a) nihoyatda mustahkam qilib qurilgan bo'lib, shahar devorining o'rtasida darvozaxona bo'lgan. Darvoza qarshisida shahar markazidan kesib o'tkazilgan ko'chaning har ikki tomonlari bo'ylab shaharliklarning turar joylari joylashgan. Shahar markazidan yuqoriroqda ibodatxona majmuasi joylashgan bo'lib, uning burchak qismida esa balandligi 25 metr bo'lgan ko'p minorali xorazmshohlar qasri qad ko'targan. Qasr imoratlari — ikki qavatli shoh saroyi va koshona turar joylarining devor tokchalari turli mazmundagi rangdor tasvirlar, bo'rtma ganchkor naqshlar hamda haykallar bilan bezatilgan. Xorazm poytaxti hisoblangan shaharning umumiy maydoni 25 gektarni tashkil etgan. Bu davrda Xorazmda atrofi mustahkam devorlar bilan o'ralgan shaharlar, istehkomli qishloqlar juda ko'p bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 3-4-mavzu, 10-14-betlar
SAVOL: Ilk o'rta asrlarda Xorazmda din haqida ma'lumot bering.
JAVOB: Xorazmda VIII asrgacha zardushtiylik dinining ta'siri kuchli bo'lgan. Zardushtiylik ibodatxonalarida ruho-niylar – mobadlar (diniy marosimlarni bajaruvchilar) diniy marosimlarni avloddan avlodga saqlab qolish mas'uliyatini olganlar. Bu ham o'ziga xos ta'lim-tarbiya jarayoni edi. Mobadlar tarbiyalanuvchilarga zardushtiylikning o'git-pandlari, ma'rifati hamda tarbiyasi hayotning eng muhim tayanchi ekanligini uqtirishgan. Ta'lim maskanlarida bolalarga, asosan, o'qish, yozish va jang san'atidan saboq berilgan. Shuningdek, ularga faqat rost so'zlashlari zarurligi uqtirilgan. Yolg'on gapirish katta jinoyat hisoblangan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 3-4-mavzu, 10-14-betlar
SAVOL: Hubbi haqida afsona. Ma'lumot bering.
JAVOB: Xorazmda Amudaryo bilan bog'liq ko'plab afsonalar uchraydi. Ulardan biri suv ilohi Xubbi haqida. Afsonaga ko'ra, Xubbi baliqni bir qo'li bilan tutib quyoshga uzatar va uni quyosh shulasida qovurib yer ekan. Xubbi suvga cho'kkanlarni qutqargan. So'yilgan ho'kizlarga jon bag'ishlagan. Jamshid ismli hukmdor taxtga o'tirgan vaqtda Xubbi dom-daraksiz g'oyib bo'ladi. Uni dengiz malikasi o'g'irlab ketgan. Xubbining onasi esa o'g'lini Amudaryodan yig'lab qidirgan. Xubbining onasi o'z xalqini daryoda urishishga o'rgatadi. Shundan buyon Xorazmda qayiqlarning burnida shu ayolning haykali o'rnatilgan. Xorazm diniy qarashlarida suv muqaddas hisoblangan, Xubbi esa suvning saqlovchisi sifatida qadrlangan. Bu an'ana Xorazmda islom dini kirib kelgunga qadar amalda bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 3-4-mavzu, 10-14-betlar

MAVZU: 7-sinf · 5-mavzu: IV-V asrlarda Xiyoniylar va kidariylar.(15-17-betlar)
SAVOL: IV-V asrlarda Xiyoniylar va kidariylar haqida ma'lumot bering.
JAVOB: IV asrda turkiy qabilalardan xioniylar dastlab Zarafshon vohasini egallashgan, janub tomonga yurib, Kushon podsholigi hududida hukmronlik qilishgan. Ular markazi Toxariston bo'lgan Shimoliy Hindiston, Afg'oniston, Xurosonning bir qismini ham o'z ichiga olgan katta davlat tuzishgan.
Tarixda xioniylar nomi bilan mashhur bo'lgan qabilalarning asli vatanini ayrim tadqiqotchilar Orol dengizi bo'yida deb hisoblaydilar. G'arb tarixchilari esa, xioniylarni xunnlarga qarindosh hisoblab, ularni «oq xunnlar» deb ataydilar. Ular bu hududda 120 yildan ortiq hukm ronlik qilishgan.
V asrning 20-yillarida sharqdan Sirdaryo va Orol bo'ylari orqali Xorazm hamda Amudaryo havzasiga yana bir ko'chmanchi chorvador aholi – toxarlar kirib kelgan. Toxariylar kushonlarning avlodlari bo'lgan. Ularga Kidar ismli hukmdor boshchilik qilganligi uchun ularni kidariylar deb ham atashadi.
Balx shahri bu yangi davlatning poytaxtiga aylan tirilgan. Manbalarda aytilishicha, kidariylar dastlab Sharqiy Turkiston hududida yashaganlar.
Turonda kidariylar va еftaliylar hukmronligi o'rnatilgach, xioniylarning siyosiy ahvoli o'zgaradi va ular еftaliylarga tobe bo'lib qoladi.
456-yilda kidariylar va sosoniylar o'rtasida to'qnashuv bo'lib o'tadi. Bu to'qnashuvda kidariylar sosoniylardan yengiladi. Keyinchalik kidariylar ham ko'chmanchi chorvador aholi – eftaliylar bilan to'qnashadilar. Natijada, ular Shimoliy Hindistonga chekinadilar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 5-mavzu, 15-17-betlar

MAVZU: 7-sinf · 6-7-mavzular: Eftaliylar. (18-23-betlar)
SAVOL: Eftaliylar davlatining tashkil topishi va boshqaruvi haqida ma'lumot bering.
JAVOB: Hukmronlik yillari: V-VI asrlar.
Asoschisi: Eftalon (Vaxshunvar).
Hukmdorlari: Eftalon (Vaxshunvar).
Poytaxtlari: Buxoro yaqinidagi Poykent va Varaxsha shaharlari.
Hududi: O'rta Osiyodan tashqari, Sharqiy Turkiston, Afg'oniston, Shimoliy Hindiston va hozirgi Pokiston hududlari ham kirgan.
V-VI asrlarda Eftalon sulolasiga mansub qabila Turon hududida hukmronlik qilgan. Manbalarda eftaliylar, eftallar, eftalitlar, xaytallar kabi turli nomlar bilan atalgan eftaliylar qabilalari ittifoqiga asos solgan. Bu nom aslida «Eftalon» degan shoh ismidan olingan. Uni Vaxshunvar deb ham ataganlar.
Firdavsiyning «Shohnoma» asarida Vaxshunvor va Peruz davri voqealari ham o'z aksini topgan.
Eftaliylar V asr boshlarida mamlakatimiz hududiga Sharqdan kirib kelganlar.
Eftaliylar davrida saltanat yakka hukmdor tomonidan boshqarilgan. Taxt avloddan avlodga o'tmay, shu suloladan kim loyiq deb topilsa, o'sha taxtga o'tirgan. Nomzodni aniqlab, taqdim etadigan kengash ham mavjud bo'lgan. Bu kengash sulolaning mo'tabar kishilari hamda saltanatning obro'li a'yonlaridan tarkib topgan.
Sosoniylar shohi Pero'zning 484-yilda eftaliylarga qarshi urushi uning halokati bilan tugaydi. Xitoy, Hindiston, Eron va Vizantiya bilan bo'lgan xalqaro savdoda faol qatnashgan.
Eftaliylar davrida Turonda shishasozlik rivojlangan. Shishalar rangdorligi, yarqiroqligi va tiniqligi jihatidan Vizantiya shishasidan ustun turgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 6-7-mavzular, 18-23-betlar
SAVOL: Eftaliylar davrida Turonda madaniy hayot haqida ma'lumot bering.
JAVOB: Eftaliylar davrida Turon aholisining bir qismi sug'd tilida, ikkinchi qismi esa turkiy tilda so'zlashgan. Bu davrda sug'd tili xalqaro savdo tili sifatida Yettisuv, Farg'ona, Sharqiy Turkiston va Xitoy hududlarida muomalada bo'lgan.
Eftaliylar alifbosi Baqtriya yozuvi asosida shakllangan. Mazkur alifbo 25 harfdan iborat bo'lgan.
Eftaliylar davrida ham bolalarga yoshligidan ta'lim va tarbiya berilgan. Ayniqsa, harbiy soha bilan faqat o'smir o'g'il bolalargina shug'ullanmagan. Qizlar ham otda yurishga, kamondan o'q otish kabi jismoniy mashqlarga jalb qilingan.
Eftaliylar, asosan, zardushtiylikka e'tiqod qilishgan. Shuningdek, davlatda tangrichilik, buddaviylik, moniylik, mazdakiylik e'tiqodlari ham tarqalgan. Shaharlarda nestorianlar va yahudiylar jamoalari ham bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 6-7-mavzular, 18-23-betlar
SAVOL: Eftaliylar davrida Turonda shaharsozlik haqida ma'lumot bering.
JAVOB: 568-569-yillarda Vizantiya imperatori huzurida bo'lgan turk elchisi imperatorning: «Eftaliylar shaharlarda yashaydilarmi yoki qishloqlarda-mi?» – degan savoliga: «Ular shaharlik sulolalar, oliy hazratlari», – deb javob bergan.
V asrda Panjikentda nisbatan qadimiyroq bo'lgan qishloq o'rniga umumiy maydoni 18 gektar bo'lgan yangi shahar barpo etiladi.
Sug'd shaharlaridan yana biri Poykand edi. Poykand bu davrda arab manbalarida ta'riflanganidek, «Madina at-tujjor» – «Savdogarlar shahri» bo'lgan.
IV-V asrlardagi ijtimoiy-iqtisodiy hayotda muhim ahamiyatga ega bo'lgan yirik markazlardan (ehtimol, poytaxt shaharlardan) biri Buxoro edi. To'g'ri to'rtburchak shakldagi ushbu shaharning asosi 21 gektar bo'lgan. Bu davrda shaharning yettita darvozasi bo'lib, mazkur holat uning muhim savdo-tranzit yo'li ustida joylashganligidan dalolat beradi.
Eftaliylar davrida Termiz va uning atroflarida ham shaharsozlik madaniyatining jadallik bilan rivojlanganligini kuzatish mumkin. Termiz atrofidagi Zartepa shahri ana shunday shaharlardan biridir.
Zartepa IV-V asrlarga kelib maydoni 17 gektar bo'lgan yirik shaharga aylandi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 6-7-mavzular, 18-23-betlar

MAVZU: 7-sinf · 8-9-mavzular: Turk xoqonligi. (24-31-betlar)
SAVOL: Turk xoqonligining tashkil topishi haqida ma'lumot bering.
JAVOB: Humronlik yillari: VI asr o'rtalaridan – VII asr o'rtalarigacha.
Asoschisi: Bumin.
Hukmdorlari: Bumin, Istami, Qoracho'rin, Sheri Kishvar (Elarslon), To'ng Yabg'u (618-630. G'arbiy Turk xoqonligida).
Poytaxtlari: Oltoy, O'tukan vosiysi (Mo'g'uliston. Sharqiy Turk xoqonligi), Yettisuv (G'arbiy Turk xoqonligi).
Hududi: Oloy tog'lari sharqidan to Uzoq Sharqqacha, ya'ni Janubiy Sibir, Urxun havzasi (Mo'g'uliston), Shimoliy Xitoy (Sharqiy turk xoqonligi), Oloy tog'larining g'arbi – Yettisuv, Sharqiy Turkiston, Sirdaryo va Amudaryo oralig'i (G'arbiy turk xoqonligi).
VI asr o'rtalarida Oltoy va Janubiy Sibirda yashagan turkiy qabilalarni birlashtirgan yangi davlat vujudga keldi. Bu davlat tarixga Turk xoqonligi nomi bilan kirgan. Oltoy xoqonlikning markazi qilib belgilanadi. Uning asoschisi Bumin edi. Unga «Yabg'u xoqon» degan unvon beriladi.
Xoqonlik eng kuchaygan davrda Oxota dengizidan Qrim yarimoroligacha, Sibirdan Hindistongacha hududni egallagan.
Turk, turkiylar — eng qadimiy va yirik etnoslardan birining nomi. Turk so'zi baquvvat, barkamol, odillik kabi ma'nolarni anglatadi.
Turk xoqonligi VI asrning 80-yillari oxirlarida ikkiga: Sharqiy turk xoqonligi va G'arbiy turk xoqonligiga bo'li-nib ketadi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 8-9-mavzular, 24-31-betlar
SAVOL: Turk xoqonligining boshqaruv mafkurasi haqida ma'lumot bering.
JAVOB: Xoqonlik o'z davlat mafkurasiga ko'ra, «el» deb atalib, qadimgi tarixda u bilan bog'liq «mangu el», «Tangri (ilohiy) el», «turk eli» kabi iboralar shakllangan.
El va xoqon hokimiyatining Tangri tomonidan Ashina xonadoniga «Turk budun (xalqi)»ga in'om qilinganiga ishonilgan. Qadimgi turk jamiyati xoqon Bumin mansub bo'lgan Ashina xonadoni vakillariga hukmdor sifatida qaraganlar. Chunki turkiylar orasida bunday siyosiy iqtidor (ne'mat) Tangri tomonidan faqat Ashina xonadoniga in'om etilgan, degan tasavvur hukmron edi. Shu bois, Ashina xonadoni hokimiyati ilohiylashtirilgan.
Agar Tangri bergan siyosiy hokimiyat ishonchni oqlamasa, ya'ni o'z iqtidorini ko'rsata olmasa, unday hukmdor hokimiyatdan uzoqlashtirilib, «Tangri bergan siyosiy hokimiyat yana Tangri tomonidan qaytarib olinadi», deb tushunilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 8-9-mavzular, 24-31-betlar
SAVOL: Turk xoqonligining boshqaruv tartibi haqida ma'lumot bering.
JAVOB: Turk xoqonligida O'n ming suvoriyga ega bo'lgan tuman boshi «shod» deb yuritilgan. O'n o'q el sardori bir tuman (ya'ni, o'n ming) suvoriyga ega bo'lgan. Ko'chmanchi chorvador aholi «budun» yoki «qora budun» nomlari bilan yuritilgan.
Hokimiyat urug'-aymoqchilik udumlariga tayangan harbiy-ma'muriy boshqaruvga asoslangan. Yabg'u darajasiga faqat xoqon urug'iga qon-qarindosh bo'lganlargina ko'tarilgan.
O'n o'q budun yoki elning hokimi «yabg'u» yoki «jabg'u» nomi bilan atalardi.
Turk xoqonligida davlat faqat urf-odatlar bilan emas, balki yozma qonunchilik hujjatlari bilan ham boshqarilgan. Shu davrda Samarqandda «Turk qonunnomasi» amalda bo'lib, u ibodatxonada saqlangan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 8-9-mavzular, 24-31-betlar
SAVOL: Turk xoqonligi davrida diniy e'tiqod haqida ma'lumot bering.
JAVOB: Farg'ona vodiysidagi Quvadan hamda Qo'rg'ontepa yaqinidagi Ajinatepadan buddaning haykallari topilib, o'rganildi.
Ajinatepa buddasi haykalining bo'yi 12 metrga boradi. Hozirgi kunda u Dushanbe shahridagi Milliy arxeologiya muzeyida saqlanadi.
Tangrichilik - Bu davrga oid Urxun-Yenisey yodgorliklari bitiklarida Tangri yagona, azaliy, abadiy, hayot beruvchi, yaratuvchi, o'ldiruvchi, hukm qiluvchi, yordam beruvchi, jazolovchi, bandaning duosini qabul qiluvchi, himoya qiluvchi, marhamatiga oluvchi, hamma narsani biluvchi, insonlarga ilm beruvchi va yo'l ko'rsatuvchi kabi sifatlar bilan maqtalgan. Tangrichilikda diniy ramz to'rt tomoni teng bo'lgan salb – «adji» hisoblangan.
Zardushtiylik - Ezgu amal, ezgu fikr, ezgu so'z,
Moniylik - Olamning ibtidosi ikki qarama-qarshi yaratuvchi – yorug'lik va ezgulik hamda zulmat va yovuzlikdan iborat, deb hisoblangan. Ibodat, ro'za, sadaqa moniy dinining arkoni hisoblangan.
Shomoniylik - Bu din jon va ruhlarga, ota-bobolar ruhiga sig'inish e'tiqodini tarbiyalagan. Qadimgi turklarda «shomon» so'zi bo'lmagani sababli o'z dinini «qam» deb yuritganlar.
Turkiylarda qadimda bo'ri ilohiylashtirilgan va ko'plab nishonlarida bo'ri tasviri mavjud bo'lgan.
Turkiylar mutlaq o'limga ishonmaganlar. Hayot ma'lum doira ichida butun fazo bo'ylab aylanib yuradi, deb e'tiqod qilganlar. Shundan kelib chiqib, ular insonning jismoniy o'limidan qo'rqmaganlar va bu hayotning tabiiy davom etishi, deb qaraganlar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 8-9-mavzular, 24-31-betlar

MAVZU: 7-sinf · 10-11-mavzular: G'arbiy Turk xoqonligi. (32-38-betlar)
SAVOL: G'arbiy Turk xoqonligining siyosiy tartibi va savdo aloqalari haqida ma'lumot bering.
JAVOB: G'arbiy xoqonlik aholisining kattagina qismi o'troq dehqonchilik, hunarmandchilik va savdo-sotiq bilan mashg'ul edi.
VII asrning birinchi choragiga kelib G'arbiy xoqonlik taraqqiy etadi.
Xoqon To'n yabg'u hukmronlik qilgan davrda boshqaruv tartiblari isloh qilinadi.
Viloyat hokimlarini xoqonlik ma'muriyati bilan bevosita bog'lash va ularning ustidan nazoratni kuchaytirish maqsadida mahalliy hukmdorlarga xoqonlikning «yabg'u» unvoni beriladi.
Xoqon o'z noiblari – tudunlar yordamida mustaqil hokimliklar ustidan nazoratni kuchaytirgan.
G'arbiy Turk xoqonligining Suyab (Oq Bishim), Beshbaliq (Turfan), Ek-tog' (Sharqiy Turkiston) kabi shaharlari xoqonlikda qarorgoh vazifasini bajargan.
Davlat boshqaruvida xoqonlikning barcha bog'inlarida lavozim egalari harbiy unvonga ega bo'lishi shart hisoblangan.
G'arbiy turk xoqonligida Sug'd va Farg'onada oliy hukmdor – «ixshid», Toxaristonda – «malikshoh», Xorazmda – «xorazmshoh», Keshda – «ixrid», Buxoroda – «xudot», Ustrushonada – «afshin», Chochda – «tudun» deb atalgan.
G'arbiy turk xoqonligida ko'chmanchilarning asosiy mashg'uloti chorvachilik edi. Shahar aholisi hunarmandchilik va savdo-sotiq bilan shug'ullangan.
Savdogarlar orasida Sug'd savdogarlarining mavqeyi baland bo'lgan.
VII asrning birinchi yarmida G'arbiy Turk xoqonligi bilan Xitoy o'rtasida, ayniqsa, iqtisodiy aloqalar faollashdi.
Bu davrda Xitoyga to'qqiz marotaba savdo elchiligi yuboriladi.
Bir yilning o'zida Buxoro, Samarqand, Ishtixon va Ustrushona (Jizzax va O'ratepa viloyatlari) dan birlashgan juda katta savdo karvoni Xitoyga yetib boradi.
G'arbiy Turk xoqonligi davrida Turon zaminida turkiy yozuv bilan bir qatorda Sug'd va Xorazm yozuvlari ham keng qo'llanilgan.
Sug'd yozuvi chapdan o'ngga qarab yozilgan. Shaharlarda so'g'd-turk ikki tilliligi rasmiy odat bo'lganligi haqida Mahmud Qoshg'ariyning «Devonu lug'otit-turk» (XI asr) asarida ham qayd etib o'tilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 10-11-mavzular, 32-38-betlar
SAVOL: G'arbiy Turk xoqonligida xalq norozlik harakatlari haqida ma'lumot bering.
JAVOB: G'arbiy Turk xoqonligida qashshoqlik, jabr-zulm va dehqonlar asoratiga qarshi aholi bosh ko'tarishga majbur bo'ladi. Shunday xalq qo'zg'olonlaridan biri Buxoroda yuz beradi.
Qo'zg'olonga xoqon xonadoniga mansub Abruy boshchilik qiladi. Qo'zg'olondan vahimaga tushgan mulkdor dehqonlar va boy savdogarlar Buxoro viloyatini tark etib, Turkiston va Taroz atrofiga borib o'rnashadilar.
Turk xoqoni Qoracho'rin o'g'li Sheri Kishvar (El Arslon) boshliq qo'shin yuboradi. Abruy o'ldirilib, qo'zg'olon bostiriladi. Kadivar va xizmatkorlar o'z xo'jayinlari – dehqonlarga qaytariladi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 10-11-mavzular, 32-38-betlar
SAVOL: Abu Bakr Narshaxiyning "Buxoro tarixi" kitobida Abruy qo'zg'aloni haqida ma'lumot bering.
JAVOB: Buxorodan qochib ketgan toifaning raisi bo'lmish bir katta dehqonning nomi Hamuk edi.
«Hamuk» deb, Buxoro tilida gavharga aytiladi, «ket» esa — shahar, ya'ni Hamuket «Hamuk — gavharning shahari» demakdir.
Buxoro tilida katta odamni «hamuk», ya'ni falonchi gavhar deydilar.
Sarkardalar va dehqonlar turklar podshohining oldiga bordilar — u podshohning nomi Qarojurin turk bo'lib, ulug'ligi sababli unga Biyog'u deb laqab bergan edilar
Biyog'u Sheri kishvar ismli o'z o'g'lini ko'p lashkar bilan yubordi.
Sheri kishvar Buxoroga kelgach, Baykandda Abruyni tutib bandi qildi... Sheri kishvarga bu viloyat yoqib qolib, otasiga xat yubordi va undan bu viloyatni talab qilib, Buxoroda turishi uchun ruxsat berishini iltimos qildi. Biyog'udan: «U viloyatni senga bag'ishla-dim», — degan javob kelgach, Sheri kishvar Hamuketga odam yuborib, Buxorodan qochib ketgan kishilarni xotin va bola-chaqalari bilan Buxoroga oldirib keldi...
Sheri kishvar yigirma yil podshoh bo'lib turdi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 10-11-mavzular, 32-38-betlar
SAVOL: G'arbiy Turk xoqonligida qonunchilik tartibi haqida ma'lumot bering.
JAVOB: Turk xoqonligida ishlab chiqilgan jinoyatchilikka qarshi qonun hujjatlariga amal qilingan.
Sodir etilgan jinoyat uchun jazoning asosiy turlari – qatl еtish, odam a'zolarini kesib tashlash, zararni to'lash, mol-mulk tarzida tovon to'lashdan iborat edi.
Manbalarning ma'lumot berishicha, o'lim jazosi davlatga qarshi jinoyatlar uchun (isyon ko'tarish, sotqinlik) hamda nohaq yoki qasddan odam o'ldirganlik uchun berilgan.
O'g'rilik yoki buzuqlik qilgan shaxsning qo'li yoki oyog'i kesilgan.
Shaxsga qarshi qaratilgan boshqa jinoyatlar uchun yetkazilgan zararni o'n barobar qilib to'lash.
Jarohat yetkazgani yoxud mayib qilgani uchun mol-mulki bilan tovon to'lashga majbur etilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 10-11-mavzular, 32-38-betlar
SAVOL: Samarqandning qadimiy xarobasi Afrosiyob haqida ma'lumot bering.
JAVOB: XX asr 60-yillarida Samarqandda avtomobil yo'li qurilishi jarayonida buldozer yer tekislash ishlarini olib borayotganida yer ostidan bir necha katta rangli devor bo'laklarini surib chiqaradi. Ularning nimaligini aniqlash uchun mutaxassislar taklif qilinadi. Mutaxassislar bu topilmalarni ko'zdan-kechirganlaridan so'ng qurilish ishlari to'xtatilib, arxeologik qazishmalar boshlanadi.
Natijada Afrosiyob (Qadimgi Samarqand) shahri xarobalari joyi aniqlandi. Bir necha xonalar xarobalaridan ba'zilarining devorlarida rangli bo'yoqlar – tempera (tuxum sarig'iga rangdor mineral upasi aralashtirib tayyorlanadi) bilan ishlangan devoriy rasmlar topildi.
Devorlar, supa xom g'isht va paxsadan bunyod etilgan.
Xona devorlaridagi rasmlarda shoh a'yonlari, Chag'oniyon, Toxariston, Sharqiy Turkiston, Choch, Chinu Mochin, Hindiston va boshqa mamlakatlardan kelgan elchilar, olib kelingan ot-ulov, sovg'alar va ov sahnasi ifodalangan.
«Bu ko'hna shahar dunyo ahamiyatiga ega bo'lgani uchun YUNESKOning Butunjahon madaniy merosi ro'yxa-tiga kiritilgan va unda: «Samarqand – madaniyatlar uchrashadigan makon», – degan so'zlar yozib qo'yilgan». Xubert Gizen, YUNESKO bosh direktori o'rinbosari, 2016-yil.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 10-11-mavzular, 32-38-betlar

MAVZU: 7-sinf · 12-13-mavzular: Mahalliy hokimliklarning tashkil etilishi. (39-47-betlar)
SAVOL: Mahalliy hokimliklarning tashkil etilishi (Toxariston) haqida ma'lumot bering.
JAVOB: V-VII asrlarda Turk xoqonligi bir qancha hokimliklarga bo'linib, 15 dan ortiq mustaqil hokimliklar tashkil topdi.
Toxaristonda 27 ta tog' va tog'oldi vilo yatlaridan iborat mustaqil hokimliklar bo'lgan. Uning poytaxti Balx shahri edi.
Hukmdorlari dastlab "malikshoh", keyinchalik "yabg'u" deb yuritilgan.
Hozirgi Janubiy O'zbekiston va Janubiy Tojikiston, Shimoliy Afg'onistonni o'z ichiga olgan bu tarixiy viloyat shimolda Hisor tog'lari, janubda Hindikush, g'arbda Murg'ob va Xerirud vodiysi, sharqda Pomir bilan chegaralangan.
Toxariston aholisining asosiy qismi o'troq dehqonchilik bilan shug'ullangan.
Hunarmandchilikda, ayniqsa, qurolsozlik, shishasozlik, to'qimachilik yuksalgan. Toxariston Hindiston, Yaqin va Uzoq Sharq mamlakatlari bilan savdo-madaniy aloqalar o'rnatgan
MANBA: 7-sinf O'zbekiston tarixi darsligi, 12-13-mavzular, 39-47-betlar
SAVOL: Mahalliy hokimliklarning tashkil etilishi (So'g'd) haqida ma'lumot bering.
JAVOB: Mustaqil hokimliklar orasida eng yirigi Sug'd ixshidlari – voha hukmdorlari edi.
VI-VII asrlarda davlatlar birlashmasi ittifoqida Sug'd ixshidlari katta siyosiy nufuzga ega bo'lgan.
Zarafshon vodiylarida joylashgan Samarqand, Buxoro va Qashqadaryo vohasidagi Kesh viloyatining o'n bitta yirik mulklari birlashgan
Sug'dda aholi gavjum bo'lib, sug'diylar dehqonchilik va bog'dorchilik bilan shug'ullanishgan.
Chorvachilikda Sug'dning hisori qo'ylari va tulporlari juda mashhur bo'lgan.
Samarqandni poytaxt qilgan Sug'd Qang' davlati tanazzulidan keyin mustaqil davlatga aylangan.
Chjou xonadoni va «o'n o'q» sulolasi vakillari Sug'dda davlatni podsho orqali emas, balki yirik dehqon, savdogar va shahar amaldorlaridan iborat Oqsoqollar Kengashi oliy organ orqali boshqarganlar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 12-13-mavzular, 39-47-betlar
SAVOL: Mahalliy hokimliklarning tashkil etilishi (Farg'ona) haqida ma'lumot bering.
JAVOB: Farg'ona hukmdorlari ixshid deb atalgan.
Farg'ona yerlari juda hosildor bo'lib, aholisi dehqonchilik bilan kun kechirgan, paxta va sholi ekkan.
Koson, Axsikat (Xushkat) va Quva (Qubo) kabi yirik markaziy shaharlarida hunarmandchilikning turli sohalari rivoj topib, ularning mahsulotlari ichki va tashqi bozorlarda juda xaridorgir bo'lgan.
Qo'shni mam lakatlarga bo'yoq, rangli shisha buyumlar va dori-darmonlar chiqarilgan.
Qurama va Qoramozor tog'lari yonbag'irlarida qadimdan yilqichilik bilan shug'ullanilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 12-13-mavzular, 39-47-betlar
SAVOL: Mahalliy hokimliklarning tashkil etilishi (Choch) haqida ma'lumot bering.
JAVOB: Choch (Toshkent vohasi) Chirchiq va Ohangaron havzalaridagi dehqonchilik va ko'chmanchi chorvadorlarning hududlari kesishgan mintaqada joylashgan.
Choch Ipak yo'lining shimoli-sharqiy yo'nalishida strategik ahamiyatga ega bo'lgan hudud hisoblangan. Ilgari Chochda o'troq mahalliy aholining manzilgohlari paydo bo'lgan bo'lsa, VI-VIII asr boshlarida ularning soni nihoyatda oshgan.
VI asr ikkinchi yarmidan Chochda Turk xoqonligi hukmronligi o'rnatilib, voha aholisi etnik tarkibida turkiylar salmog'i keskin oshdi. Mahalliy turkiy tilli aholi xoqonlik vakillari kabi «turk» deb ataladi.
Turk xoqoni Chochga hokim etib Tegin Tyanchjini tayinlaydi. Tegin Tyanchji G'arbiy Turk xoqonligi yaratgan iqtisodiy va siyosiy erkinlikdan foydalanib, Xitoy bilan diplomatik aloqa o'rnatdi. Teginlar sulolasi Chochni boshqardi.
Choch ma'muriy boshqaruvida tegindan (shahzoda, taxt vorisi) keyin soliq yig'ish bo'yicha nozirlar – tudunlar (soliq yig'imlari nozirlari) turgan.
Davlat tash qisavdoda Lashkarak kumushlarini, Tunkat va To'qkat metallini, moviy feruzalarini chetga chiqardi.
Choch savdogarlari sug'diy tujjor (savdogar)lar bilan chetga mahsulot olib chiqib, xorijdagi manzilgohlarida bir jamoa bo'lib yashashgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 12-13-mavzular, 39-47-betlar
SAVOL: V-VII asrlarda Turonda ijtimoiy-iqtisodiy hayot haqida ma'lumot bering.
JAVOB: V-VII asrlarda Turonda, bir tomondan, yerga egalik qilish munosabatlari o'rnatildi va mustahkamlanib bordi. Ikkinchi tomondan, ko'chmanchi chorvadorlarning beto'xtov shiddat bilan kirib kelishi hamda ularning o'troqlashuvi kuzatildi. Mazkur omillar shahar va qishloqlarning qiyofasi hamda aholisining turmush tarziyu ijtimoiy ahvoliga jiddiy ta'sir ko'rsatdi.
V-VII asrlarda Turon qishloqlarida «ko'shk», «qasr», «qo'r g'on» va «qo'rg'oncha» nomlari bilan shuhrat topgan istehkomli turar joylar qad ko'tardi. Istehkomli qasr, qo'rg'on va ko'shklar asosan tashqi dushman hujumiga qarshi mudofaa inshooti, chokarlar to'planadigan joy, ma'muriy markaz hamda oziq-ovqat va qurol-yarog' saqlanadigan ombor vazifasini o'tagan.
O'rta asrlarda shaharlar uch qismdan iborat bo'lgan. Ular «ko'handiz», «shahriston», «rabod» deb yuritilgan. Shaharlarning uchala qismi ham alohida-alohida devorlar bilan o'rab olingan. Ularning bir nechta darvozalari bo'lgan. Shahar devorlari bo'ylab oqib o'tgan anhor xandaq vazifasini bajargan.
X asrda yashagan arab mualliflari (Ibn Xavqal va Ishtaxriy) ning qayd etishicha, birgina Binkat (Toshkent)ning yigirma ikkita darvozasi bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 12-13-mavzular, 39-47-betlar

MAVZU: 7-sinf · 14-15-mavzular: Turon xalqlarining harbiy san'ati. (48-53-betlar)
SAVOL: "Turon" atamasining kelib chiqishi va uning hududiy chegaralari haqida ma'lumot bering.
JAVOB: «Turon» atamasi dastlab «Avesto»da tilga olingan. Tarixchilar fikricha, turlar (turklar) oriy xalqlarning tarmog'i hisoblangan.
VI asrda O'rta Osiyo hududi Turk xoqonligiga o'tishi bilan bu ikki atama uyg'unlashib, Turon nomi turklar-ga nisbatan beriladigan bo'ldi.
«Turon» yoki «Turkiston» deyilganda, Amudaryo va Sirdaryodan shimolda, to Sharqdagi Buyuk Xitoy devorigacha bo'lgan turkiylar mamlakatlari tushuniladi.
Bu yer (Movarounnahr) ahlining e'tiqodicha, Jayhun orqasidan Sharqqa qarab cho'zilgan yerlar Turon, G'arbga tomon cho'zilgan yerlar esa Eron deb ataladi. Kaykovus va Afrosiyob bu mamalakatlarni o'zaro taqsim qilganlarida Turon Afrosiyobga, Eron esa Kaykabod o'g'li Kaykovusga tekkan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 14-15-mavzular, 48-53-betlar
SAVOL: Arab adibi Johiz hamda Turkiyalik olim Usmon Turonning Turon xalqlarining harbiy san'ati haqidagi qarashlari haqida ma'lumot bering.
JAVOB: Jahon harbiy san'ati taraqqiyotida turkiy xalqlar o'ziga xos o'rinni egallaydi.
Arab adibi Johiz turkiy xalqlarning xislatlari haqida bitilgan «Manoqib al-atrok» asarida: «Sosoniy-forslar barcha xalqlardan davlatni boshqarish sohasida, xitoyliklar — hunarmandchilikda, yunonlar — ilm-fanda, turklar — harbiy ishda ustundirlar», — deb yozadi.
Turkiyalik olim Usmon Turonning «Turkiy xalqlar mafkurasi» nomli kitobida keltirilishicha, turkiylar: Birinchi bo'lib otdan jang vositasi sifatida foydalanganlar.
Egar-jabduq, uzangi va tizgin kabi anjomlarni kashf etganlar.
Chinliklar turklardan otga minishni, uzun qilichdan foydalanishni va jangovar kiyim yasashni o'rganib olganlar.
Chodir-hammom va kasalxonalar kashf etib, ularni qo'shin bilan birga otda olib yurishgan. Turklar umrlarini ot ustida kechirganlar: ular ot ustida ovqatlanishar, mashvarat o'tkazishar, nihoyat jang-u jadal qilishardi. Dovuldek paydo bo'lib, qush kabi bir zumda ko'zdan yo'qoladi, deya tasvirlangan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 14-15-mavzular, 48-53-betlar
SAVOL: Eftaliylar hokmronligi davrida Turonda harbiy san'at haqida ma'lumot bering.
JAVOB: Turon hududi milodiy V asrda eftaliylar tarkibiga kirgan. Eftaliylar mamlakatda kushonlar siyosatini davom ettirib, O'rta Osiyo, Sharqiy Eron, Shimoliy Hindiston va Sharqiy Turkiston xalqlarini yagona davlatga birlashtirgan.
Eftaliylarning aksariyati otliqlardan iborat kuchli qo'shinga ega bo'lishgan.
Eftaliylar jangda asosan gurzilardan foy dalanishgan. Shuningdek, kamon va shamshirlar ham qo'llanilgan.
Demak, mamlakatimiz xalqlari harbiy siyosat yuritish, qo'shinning jangovarligini oshirish, qurol-yarog'lar yasash va ulardan foydalanish, mudofaa inshootlarini qurish kabi sohalarni muntazam takomillashtirib borishgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 14-15-mavzular, 48-53-betlar
SAVOL: Turk xoqonligi davrida Turonda harbiy san'at haqida ma'lumot bering.
JAVOB: Turk xoqonligi davrida harbiy san'at yanada rivojlangan.
Har bir ibodatxona qoshida tashkil etilgan ta'lim dargohlarida yigitlarga otda erkin yura olish, qilichbozlik, kamondan o'q otish, gurzi ishlatish, kurash tushish, palaxmon otish kabilar o'rgatilgan.
Bu davrda nafaqat yigitlar, balki qizlarda ham chavandozlik, kamonbozlik kabi ko'nikmalar shakllantirilgan.
Xoqonlik qo'shinining asosiy qismi otliq jangchilardan va qisman piyoda askarlardan tashkil topgan.
Jangchilar parchinlar qoplangan jang liboslari, sovutlar kiyishgan. Ular qalqon, uzun va ingichka nayza, jangovar bolta hamda kamon bilan qurollanishgan. Bu davrda chopuvchi qurolning yangi turi – qilich va dudama, uzun va og'ir qilich – palash paydo bo'lgan.
Har bir otliq jangchi o'zi bilan kamida ikki yoki uchta otni olib yurgan. Bu horigan otlarni charchamagan otlarga almashtirish imkoniyatini bergan. Ot ham zirhli abzal bilan himoyalangan.
Turk xoqonligi armiyasi turli bo'linmalar – o'nlik, yuzlik, minglik, o'n minglik – tumanlardan tashkil topgan.
Bu davrda Sug'diyona, Toxariston, Farg'ona, Xorazm va Choch kabi mustaqil hokimliklar ham o'z harbiy qo'shiniga ega edilar.
Har bir tuman o'zining tug'i (nishoni) ga ega bo'lgan. Mazkur nishon uzun nayzaga bo'ri yoki boshqa biror hayvonning tilla suvi yuritilgan boshi va otning yoli bilan birga o'rnatilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 14-15-mavzular, 48-53-betlar
SAVOL: Turon xalqarining jang taktikalari hamda qurol-yarog'lari haqida ma'lumot bering.
JAVOB: Turk jangchilari qat'iy intizomga rioya qilganlar va ular o'z davri uchun yengilmas kuch hisoblangan.
Hujum odatda kutilmaganda boshlangan.
Jangdagi aniqlik, abjirlik hamda tezkor harakatlar g'alabani ta'minlagan.
Ular yolg'ondan chekinish kabi harbiy taktika usulidan keng foydalanishgan.
Himoyalanish chog'ida aylana usulini qo'llashgan.
Jang taktikasida dushmanning asosiy kuchlarini ikki yoki bir necha qismlarga ajratib yakson qilishgan.
Turon harbiy san'atida og'ir qurollangan suvoriylar – otliq askarlar va ularga xos jang olib borish usullari V-VI asrlarda ham hal qiluvchi ahamiyatga ega edi.
Turkiy suvoriylar tomonidan uzangining kashf etilishi otliq askarlarga ot ustida mustahkam o'tira olish va og'ir aslahalar bilan qurollanish imkonini bergan.
Qurolsozlar yasagan himoyalovchi yarog'lar jangchini boshidan oyog'igacha muhofaza qilgan.
Jangchilarning ustunligi ikkiyoqlama o'tkir tig'li qilichlarida bo'lgan. Sovutlari ham uzun bo'lib, askarlarning oldi va orqasini kesiklari bo'lgan charm bo'laklari muhofaza qilgan.
Oyoq va qo'llarini himoyalash maqsadida maxsus metall parchalaridan tayyorlangan sovut kiyishgan. Himoya vositalaridan biri bo'lgan dubulg'a temirdan yasalgan.
Dubulg'a yelkada osilgan zirhli yelkapo'sh bilan bir bo'lgan. Bu davrda shaharlar, qal'alar va boshqa binolar mudofaa maqsadlariga mos tarzda barpo etilgan.
Turon xalqlari o'z shahar-qal'alarini tadbirkorlik bilan mudofaa etganlar. Yirik dehqonlarning Xorazm, Sug'd va Toxaristondan topilgan uy-qo'rg'onlari burjli mudofaa devorlari va kamondan o'q otishga mo'ljallangan shinaklariga ega bo'lgan. Qo'rg'onga kirish joyining ro'parasida xabar beruvchi qo'riqlov minorasi qad rostlagan.
Shahar atrofidagi xandaq suv bilan to'ldirilib, unga ko'tarma ko'prik orqaligina o'tish mumkin bo'lgan. Qo'rg'onlarni nayza bilan qurollangan jangchilar qo'riqlab turgan.
Tahlikali xabar bo'lganda jangchilar devor va burjlardagi o'z o'rinlariga shoshilganlar. Dushmanlar qasrga kirish uchun xandaqni ko'mishlari, darvozani buzishlari lozim bo'lgan. Qasr himoyachilari devordan turib ularning boshiga tosh uloqtirganlar, qaynoq suv quyganlar, nayza, yoy o'qlarini yog'dirganlar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 14-15-mavzular, 48-53-betlar

MAVZU: 7-sinf · 16-17-mavzular: VI-VII asrlarda Turon xalqlari madaniy hayoti. (54-61-betlar)
SAVOL: VI-VII asrlarda "Turon"da yozuvning paydo bo'lishi haqida ma'lumot bering.
JAVOB: Mamlakatimiz tarixida ta'lim tizimining rivojlanishi uzoq tarixiy jarayon bo'lib, yozuvning paydo bo'lishi bilan bu jarayon yanada jadallashgan.
Qadimgi tosh bitiklar, teri, sopol, yog'och (taxta) va keyinchalik qog'ozlarga tushirilgan ma'lumotlar ta'lim tarixidan so'zlovchi manba hisoblanadi.
Tariximizdan darak beruvchi eng qadimgi yozma manba «Avesto»da nafaqat diniy balki, dunyoviy bilimlar, tarixiy voqealar hamda ma'naviy-ma'rifiy qarashlar haqidagi ma'lumotlar to'plangan.
Xorazmdagi Jonbosqal'a va Tuproqqal'adan topilgan zardushtiylarning ibodatxonasi diqqatga sazovor inshootlarning o'rtasida qo'sh devorlar bilan qurshalgan va ichkariga aylanma yo'lagi orqali kiriladigan to'g'ri burchakli bino bo'lgan.
Xonalardan teriga va yog'ochga yozilgan turli mazmundagi hujjatlar hamda katta-kichik haykalchalar topilgan. Bu esa, ibodatxonaga tutash binolarda ta'lim maskanlari, huquq idoralari, ma'muriy-xo'jalik ishlari bilan shug'ullanadigan joylar bo'lganidan dalolat beradi.
Xorazmda o'g'il bolalarga o'qish, yozish, hisob-kitob o'rgatilgan. Shuningdek, ularga geografiya, zoo-logiya, botanika, astronomiya, muhandislik, tibbiyot va me'morchilik kabi turli fanlardan bilimlar berilgan.
Turk xoqonligida madaniyat va san'at ham rivoj topgan. Xoqonlikda o'ziga xos yozuv ham mavjud bo'lgan. Turklarning turkiy run (ko'k-turk) xati biri ikkinchisiga tutashib ketadigan 38-40 ta harfdan iborat edi.
U tosh va yog'ochlarga o'yib yozishga nihoyatda qulay bo'lgan. Qadimgi ko'kturk (Kultegin va Bilga xoqon) bitiklari Oltoy va Sharqiy Turkistondan tashqari, Yettisuv, Farg'ona va Zarafshon vodiylaridan topilgan qabrtoshlari, sopol va metall buyumlar, yog'och hamda tanga pullarda saqlanib qolgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 16-17-mavzular, 54-61-betlar
SAVOL: VI-VII asrlarda Turon xalqlari diniy e'tiqodlari haqida ma'lumot bering.
JAVOB: Mamlakatimiz hududida yashagan xalqlar tangrichilik, zardushtiylik, buddaviylik, xristianlik va boshqa dinlarga e'tiqod qilishgan. Mazkur dinlarning ibodatxonalarida maxsus maktablar bo'lib, ta'lim oluvchilarga dinning asoslari o'rgatilgan. Xat-savodi chiqarilgan.
Buddaviylik ta'limoti bilan bog'liq an'analar o'rganilganida, har bir ibodatxonada rohiblar tayyorlaydigan ta'lim muassasalari bo'lganligi aniqlangan. O'quv maskanlari – viharalarda asosiy fan sifatida Daxarma, ya'ni diniy qonun-qoidalar va Xudoning mohiyati hamda irodasi (xudojo'ylik) haqida ta'lim berilgan.
Yahudiylar Ossuriya quvg'inlaridan Eronga, Samarqand va Buxoroga ko'chib keladilar.
Yahudiy jamoalari bilan birga qadimgi Mesopotamiyaning madaniyati ham kirib keladi. Yahudiylar ibodatxonalari qoshida diniy ta'lim o'rgatiladigan maktablar tashkil qilingan.
Turon hududidan o'tgan savdo yo'llarida eng qimmatbaho tovar bu yozuv materiallari va kitoblar hisoblangan.
V asrda Samarqand va Buxoroda xristianlik tarqalib, diniy muassasalar tashkil qilingan.
Sug'ddagi katta nestoriyan jamoalarining hujjatlari sug'd tilida yozilgan.
Surxon vohasida Bolaliktepa va Zarafshon vodiysida Panjikent, Varaxsha va Afrosiyob, Farg'ona vodiysida Quva xarobalaridan topilgan yodgorliklar – devoriy suratlar, haykallar va ganchkor naqshlar o'sha davrning yuksak san'at namunalaridan hisoblanadi.
Haykaltaroshlik rivojiga, ayniqsa, buddaviylik dini kuchli ta'sir ko'rsatgan.
Afrosiyob, Varaxsha, Panjikentdagi qazilmalardan topilgan buyumlar Turon aholisi madaniyatidan darak beradi.
Saroy va ibodatxona, turar joy binolari, devorlardagi naqshlar, turli suratlar, haykallar, yog'och o'ymakorligi buyumlari, Mug' tog'i va Afrosiyobda topilgan sug'd yozuvlari shular jumlasidandir.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 16-17-mavzular, 54-61-betlar
SAVOL: VI-VII asrlarda Turon xalqlari ijtimoiy-iqtisodiy hayoti haqida ma'lumot bering.
JAVOB: VI-VII asrlarda to'qimachilik yuqori darajaga erishgan. Tog'li va tog'oldi hududlarda jun, vodiylarda ipak va ip matolardan foydalanilgan.
Kiyimlarda bir yoki ko'p rangli ipaklar, sidirg'a yoki naqshli ip-gazmollar, zar qo'shib to'qilgan matolar qo'llanardi.
Naqshlardagi hayoliy va geometrik shakllar, o'simlik va hayvonlar suratlari ikki-uch yoki to'rt rangli bo'lgan.
Asosan qizil, sariq, yashil, oq, qora ranglardan foydalanilgan.
Turon gazmol markazlarida «zandanachi» kabi ko'k rangli ipak va boshqa matolarning ishlab chiqarilishi yopishtirma yassi, g'ilof kiyimlarning paydo bo'lishiga olib keldi.
Erkaklarining kiyimi otga minib yurishga qulay bo'lib, kalta kaftan va ko'ylaklar, keng va baland qo'njli etiklardan iborat edi.
Ayollarning kiyimi erkaklar kiyimiga o'xshash bo'lib, ko'ylaklar, kaftanlar, bir tomonlama qaytarmali yopinchiqlar ko'rinishida edi. Ulardan tashqari shleyfli uzun ko'ylak, kofta, yubka va po'stinlar ham kiyishardi.
Ustki kiyimlarining (kaftan, yopinchiq va po'stin) uzunligi tizzagacha bo'lgan.
Kiyimning yoqasi, etagi, oldi, yengining uchi boshqa rangli matodan qilingan hoshiya bilan bezatilardi. Ayollarning kiyim ansamblida nimchalar, koftalar, to'g'ri shaklli yubkalar va uzun ko'ylaklar bo'lgan.
Turonda tanaga yopishib turishga qulay o'tkazma yengli kiyimlar paydo bo'lgan. Kaftan va yopinchiqlarning bezagida kushonlar tunikasimon ko'ylagi bezaklarining ta'siri sezilardi.
Yopinchoqlarda rang-barang matodan qilingan hoshiyali qiyiqlar bo'lgan. Erkaklar va ayollar kastumida taqinchoqlar muhim rol o'ynagan. Ular shaxsning ijtimoiy holatini ko'rsatardi.
Ayol va erkaklar zirak, qo'l va oyoq bilaguzuklari, marjonlar, kamarlar taqishgan. Toxaristonda faqat erkak va ayol xizmatchilar belbog' taqishardi, aslzoda ayollar esa belini bog'lashmagan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 16-17-mavzular, 54-61-betlar

MAVZU: 7-sinf · 18-19-mavzular: VII-VIII asrlarda boshlarida Turonda siyosiy vaziyat. (62-71-betlar)
SAVOL: Arablar bosqini arafasida Turonda siyosiy vaziyat haqida ma'lumot bering.
JAVOB: Sosoniylarning o'zaro ichki nizolari, eftaliylar, vizantiyaliklar va turkiylar bilan bo'lgan tinimsiz to'qnashuvlari Eron xalqining tinkasini quritgan edi.
Mahalliy hukmdorlar ham arablarga qarshi kurashda markazga yordam berishdan bosh tortgan.
O'z davrining qudratli davlatlaridan biri sanalgan Sosoniylar Eroni Arab xalifaligi qo'shinlari tomonidan zabt etilgach, istilochilarga Movarounnahr tomon yo'l ochildi.
Arab istilochilari katta o'ljalar ilinjida Amudaryoning narigi tomoni — Movarounnahr tomon shoshildilar.
Arablar bosqiniga arafasida O'rta Osiyo hududidagi mahalliy hokimliklar G'arbiy Turk xoqonligi vassali bo'lsa-da, mustaqil ichki siyosat yurgizish imtiyoziga ega edi. Kuchli markazlashgan hokimiyat yo'q bo'lib, o'lka bir necha mulklardan tashkil topgan konfederatsiyaga birlashib turardi.
Arablar bosqiniga arafasida Sug'd va Toxariston mulklarga, Choch va Iloq xoqonlik vassalligidagi yarim mustaqil mulklarga, Farg'ona hokimliklarga bo'linib ketgan edi. Ustrushona, Chag'oniyon, Kabodiyon, Xut-talon, Rasht, Darvoz, Badaxshon kabi o'lkalar ham yarim mustaqil mulklar sifatida o'z hokimlari tomonidan boshqarilardi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Arablarning Turon hududidagi harbiy harakatlari haqida ma'lumot bering.
JAVOB: Arab qo'shinlari turkiy sulola boshqarayotgan Toxariston chegaralariga chiqdi. Arablarga qarshi fors, turk va sug'd qo'shinlari ittifoqi harakat qilib, Balxni qaytarib oldilar.
Marv Turon (Xuroson) shaharlari orasida birinchi bo'lib arab istilochilari tomonidan egallangan shahar edi.
651-yili arablar Marv shahrini, so'ngra hozirgi Afg'onistonning shimoliy, Eronning shimoli-sharqiy qismi hamda Janubiy Turkmanistondan to Amudaryogacha bo' lgan hududlarni istilo qiladi. Arablar bu hududlarni Xuroson deb ataganlar. Uning markazi Marv shahri edi. Bu viloyatni boshqarish uchun maxsus noib tayinlanib, uning qarorgohi Marvda edi.
Arablar Amudaryodan shimolda joylashgan boy viloyatlarni Movarounnahr, ya'ni «daryoning narigi tomoni» deb atadilar.
Arablar 654-yildagina Amudaryo o'ng sohiliga bosqinchilik yurishlarini boshladilar.
Arablar tomonidan Movarounnahrga ilk bor hujumlar 654-yilda Maymurg' va 667-yilda Chag'oniyondan boshlanadi.
673-yilning kuzida arab qo'shinlari Amudaryodan kechib o'tib, Buxoro hududiga bostirib kiradi. Poykand va Romitanni egallab, Marvga qaytadilar. Yo'l-yo'lakay Termiz shahri ham egallanadi.
VIII asr boshlarida arablar Movarounnahr hududini to'liq bosib olishga kirishadilar. Xuroson noibi Qutayba ibn Muslim 705-715-yillar davomida Chag'oniyon, Poykand, Buxoro, Naxshab, Kesh, Xorazm, Samarqand, Choch va Farg'onani bosib oladi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Abu Bakr Narshaxiy "Buxoro tarixi" asarida arablarning Buxoroga yurishi haqida ma'lumot bering.
JAVOB: Muhammad ibn Ja'farning bayon qilishicha, Ubaydulloh ibn Ziyod xalifa Muoviya I tomonidan Xurosonga yuborilib, u Jayhun (Amudaryo) daryosidan o'tib Buxoroga kelgan vaqtida Buxoro podshohi, o'g'li Tag'shoda kichik yoshli bo'lgani tufayli, bir xotin kishi edi.
Ubaydulloh ibn Ziyod Poykand va Romitanni olib ko'p kishilarni asir qildi. To'rt ming buxorolik asirni shaxsan o'ziga oldi.
U Buxoro shahriga yetgach, askarlarini saf qilib, palahmonlarni shaharga to'g'rilab qo'ydi. Xotin turklarga odam yuborib, ulardan yordam so'radi hamda Ubaydulloh ibn Ziyodga ham odam yuborib yetti kun muhlat talab qildi va: «Men sening itoatingdaman», — deb, ko'p hadyalar yubordi. Shu yetti kunda turklardan yordam kelmagach, Ubaydulloh ibn Ziyodga qaytadan odam yuborib, yana yetti kun muhlat so'radi. (Nihoyat) turk lashkari yetib keldi va boshqalar ham yig'ilishib lashkar ko'paydi; ko'p urushlar qildilar va yengilib qochdilar, musulmonlar ularning orqalaridan borib ko'plarini o'ldirdilar.
Xotin qal'aga kirdi, u (yig'ilib kelgan) lashkarlar o'z viloyatlariga qaytdilar. Musulmonlar qurol, kiyim-kechak, tilla va kumushdan ishlangan narsalar va asirlardan iborat ko'p o'lja qo'lga kiritdilar. Ular xotinning bir poy etigini ham paypog'i bilan topib oldilar. Etik va paypoq tilla (ishlatilib tikilgan va) qimmatbaho toshlar bilan bezatilgan edi, baho qilganlarida ikki yuz ming dirham turdi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Arab istilochilariga Xuroson va Movarounnahrni istilo qilishlarida yordam bergan omillari haqida ma'lumot bering.
JAVOB: Arab istilosi turk-sug'd munosabatlarini yana bir sinovdan o'tkazdi.
Arablar G'arbiy Turk xoqonligi tasarrufidagi hududlarga hujum qilib, o'lkadagi yirik va mayda mulkliklar o'rtasidagi siyosiy tarqoqlikdan unumli foydalandi.
Turk xoqonlari va Sug'd hokimliklar o'rtasiga nifoq solib, o'zaro ishonchsizlik uyg'otdi.
Sharqiy va G'arbiy Turk xoqonliklari, Sug'd, Choch, Farg'ona ittifoqining barqaror emasligi ham arab istilochilariga qo'l keldi.
Ayrim hokimliklarning (Kesh, Nasaf, Xorazm) arab qo'shinlarini qo'llab-quvvatlashi istilo muvaffaqiyatini ta'minladi.
Qutaybaning siyosiy va harbiy tadbirkorligi o'z samarasini berdi.
Istiloning hal qiluvchi ikkinchi bosqichi mahalliy aholining istiloga qarshi turkiy davlatlar (G'arbiy Turk, Sharqiy Turk va Turkash xoqonliklari) boshchiligidagi kurashi va Sug'ddagi qo'zg'olonlar bilan kechsa-da, Movarounnahrni islomlashtirish jarayoni davom ettirildi.
Bu kurashda Sug'd ixshidlari, Buxoro buxorxudotlari, Kesh va Nasaf hokimlari, Choch tudunlari, Farg'ona hukmdor (ixshid)lari va Toxariston yabg'ulari yagona maqsad yo'lida birlashdilar. Ayniqsa, turk-sug'd ittifoqining kuchayishiga G'arbiy Turk xoqonligi vorisi bo'lgan Turkash xoqonligi hukmdori Suluxonning turonliklarga yordam berishi sabab bo'ldi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Xuroson va Movarounnahr hududlariga islom dinining kirib kelishi haqida ma'lumot bering.
JAVOB: Islom dinining Turonga kirib kelishi va tarqalishi bevosita arab istilolari va arablarning ko'p asrlik hukmronligi bilan bog'liq.
Turonga arab xalifaligi yurishlari VII asrda boshlangan bo'lsa ham, o'lkani uzil-kesil bosib olishga uzoq davrli kurashdan so'ng faqat arab qo'mondoni Qutayba ibn Muslim erishdi. Mintaqada yangi siyosiy kuchning paydo bo'lishi oqibatida Turon hududi ikki qismga bo'lindi: 1) Movarounnahr («Daryoning narigi tomoni») va 2) Arodi at-turk («Turklar yerlari», ya'ni arablarga bo'ysunmagan hukmdorlar yerlari). Mazkur ikki hududda islomlashuv jarayonlari turli xilda kecha boshladi.
Islom dini Turonga kirib kelishidan avval hukmdorlik qilgan (ixshid, buxorxudot va boshqa)lar o'z mavqelarini saqlab turdilar.
Umaviy hukmdorlari (arab xalifalari) mamlakat ichki ishlariga bevosita aralashmasdan, mahalliy sulola-lardan o'lpon olish bilan cheklanardilar. Ba'zida bu o'lpon mahalliy aholidan yig'ilgan jiz'ya (boshqa din vakillaridan yig'iladigan soliq) sifatida qabul qilinar edi.
Umaviylar davrida arablarning mahalliy aholi tarafidan islom dinining qabul qilinishiga monelik qilishi kuzatildi. Chunki arablar ilk davrda talay imtiyozlarga ega edilar. Bu davr qoidalariga ko'ra, islom dinini qabul qilgan kishi jamiyatda arablar kabi imtiyozlarga ega bo'lardi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Xuroson noibi Qutayba ibn Muslim haqida ma'lumot bering.
JAVOB: Qutayba ibn Muslim arab lashkarboshchisi bo'lib, 704-yili uni arab xalifasi Abdurahmon ibn Marvon Xurosonga noib etib yuboradi.
IX asr muarrixi Muhammad Narshaxiyning yozishicha, Qutayba ibn Muslim Shomning Boxila degan joyida tavallud topgan.
Uning zimmasiga Xurosonda davlat ishlari bilan birga, mahalliy aholini Islomga da'vat qilish, masjid va madrasalar barpo ettirish yuklangan.
Xitoy va arab tilidagi solnomalarga ko'ra, Qutayba ibn Muslim g'ayratli va uddaburon lashkarboshi, adolatli hukmdor, xiyonatni yoqtirmaydigan, o'jar tabiatli, ilmli va she'riyatni qadrlovchi inson sifatida gavdalanadi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Arablar tomonidan Xuroson va Movarounnahrda amalga oshirilgan islohotlar va ularga qarshi norozilik harakatlari haqida ma'lumot bering.
JAVOB: Arablar Turon zaminiga o'z madaniyatlari, urf-odatlari bilan bir qatorda mafkuraviy, diniy qarashlarini ham olib keldilar. Ular bu o'lkada o'zlarining siyosiy mavqelarini mustahkamlash va uning barqarorligini ta' minlashga alohida e'tibor berdilar.
Arab xalifaligi ma'muriyati xristianlik dinidan tashqari barcha dinlar (zardushtiylik, shomonlik va moniylik dinlari)ni soxta dinlar deb e'lon qildi.
Movarounnahrda mavjud bo'lgan ibodatxonalar buzib tashlandi. Islom dinini qabul qilib, musulmon bo'lgan mahalliy aholi vakillari dastlabki yillarda xiroj va jiz'ya soliqlaridan ozod etildi. Islomni qabul qilma ganlar esa jon solig'i – jiz'ya to'laganlar. Shunday bo'lsa-da, islomni qabul qilgan aholining ko'pchiligi nomigagina musulmon bo'lib, uzoq vaqtlargacha pinhona o'z dini va e'tiqodlarida qolavergan. Natijada islom dinini qabul qilishning yangi shartlari belgilab chiqildi. Unga ko'ra, musulmon bo'lganlar Qur'on suralarini yod olishlari shart edi.
Arab tili, yozuvi va xalifalik qonun-qoidalarining joriy etilishi mahalliy xalq orasida noroziliklarga sabab bo'ldi.
720-yilda Sug'd ixshidi G'urak va Panjikent hokimi Divashtich boshchiligida arablarga qarshi harbiy harakatlar boshlandi.
Sug'dliklarga yordam berish uchun Yettisuvdan turk lashkarlari ham yetib kelgan. Ular arablarga qattiq zarba beradilar.
Movarounnahr aholisini tinchlantirish va arablar hokimiyatini mustahkamlash maqsadida Xuroson noibi Ashros islom dinini qabul qilganlardan xiroj va jiz'ya soliqlarini olmaslikka qaror qiladi.
Oliy martabali arab lashkarboshilari bilan mulkdor dehqonlar o'rtasidagi qon-qarindoshlik (quda-anda-chilik) aloqalari o'rnatiladi. Bunday siyosat natijasida arablar bilan mahalliy zodagonlar o'rtasida ma'lum da-rajada ittifoq yuzaga kela boshladi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 18-19-mavzular, 62-71-betlar
SAVOL: Arab istilochilariga Xuroson va Movarounnahrni istilo qilishga yordam bergan omillar haqida ma'lumot bering.
JAVOB: Arab istilochilari Movarounnahrni osonlikcha egallay olmaganlar. Istilochilar deyarli yuz yil davomida uni juda katta kuch, mablag' va talafotlar evaziga qo'lga kiritdilar.
Aslida arab istilochilarining Movarounnahrdagi g'alabasi xalifalik qudrati natijasi emas, balki Turon aholisining o'z vaqtida dushmanga qarshi birlasha olmaganligi, mayda mulklarning o'zini oqlamagan «mustaqil siyosati» va ularni birlashtiruvchi kuchlarning o'z muammolari bilan band bo'lib qolganligida edi.
Arablar istilosi davrida butun Turon mintaqasidagi siyosiy ahvol murakkab edi.
Mintaqaning yetakchi kuchlari — Sharqiy va G'arbiy Turk xoqonliklarining ijtimoiy-siyosiy ahvoli VI asr oxiri – VII boshlaridagidek barqaror emasdi. Bu, avvalo, turkiy davlatlar (Sharqiy Turk xoqonligi, G'arbiy Turk xoqonligi va Turkash xoqonligi) o'rtasida birlikning yo'qligi hamda ularning Turon aholisiga dushmanga qarshilik ko'rsatishida yordam berishlarida umumiy safarbarlik tashkil etmaganligi bilan izohlanadi.
Qudratli turk xoqonliklari tanazzuli nafaqat arab istilochilari uchun qo'l keldi, balki azaliy raqib bo'lgan Tan imperiyasi uchun ham ayni muddao bo'ldi.
Xitoy hurujlari bilan band bo'lib qolgan Sharqiy va G'arbiy turklar arab istilosiga qarshi kurashda o'z ittifoqchilariga yetarli yordam berolmadilar.
Arablar qiyinchilik bilan mintaqadagi ozodlik harakatlarini sindirdi, mahalliy hukmdor va asl zodalarni o'z tarafiga og'dirib oldi va shu yo'l bilan Turonni egallab, o'lka aholisini islomlashtirishga erishdi.
Istilo jarayonida Arab xalifaligi: birinchidan, qo'lga kiritilgan o'ljalar hisobiga o'z xazinasini to'ldirdi, asirlar va garov olinganlar hisobiga harbiy yo'qotishlarni qopladi;

MAVZU: 7-sinf · 20-21-mavzular: VIII asrda Xuroson va Movorounnahr. (72-79-betlar)
SAVOL: VIII asrning 40-yillarida Arab xalifaligida siyosiy vaziyat va abbosiylarning hokimiyatga kelishi haqida ma'lumot bering.
JAVOB: VIII asrning 40-yillarida xalifalikda toj-u taxt uchun kurash kuchayadi.
Bu davrda hukmronlik qilgan umaviylarga qarshi umumiy norozilik, ayniqsa, xalifa Marvon Muhammad hukmronlik qilgan davrda nihoyatda kuchaydi.
Bunga xiroj solig'i miqdorining oshirib yuborilgani hamda aholining muttasil hasharlarga majburan jalb etilishi sabab bo'ldi.
Umaviylarga qarshi kurashga da'vat qilish uchun abbosiylar turli viloyatlarga ko'plab targ'ibotchilarni yuboradi. Shunday targ'ibotchilardan biri kufalik Abu Muslim edi.
Dastlab arab zodagonlari, so'ngra mahalliy dehqonlar Abu Muslimni qo'llab-quvvatlaydilar.
Umaviylarga qarshi tashviqotning sadosi tez orada Xuroson va Movarounnahr viloyatlariga keng tarqaladi.
Abu Muslim tarafdorlarining deyarli barchasi qora libos kiyib olgan edilar. Avvalo, qora kiyim motam ramzi, qolaversa, zabardast kuch bayrog'i hamda shiddatli janglarda qo'zg'olonchilarni umaviy harbiylardan ajratib turadigan belgini anglatgan.
Tez orada Abu Muslim Xurosonning markazi Marv shahrini egallaydi.
Abu Muslim boshliq qo'shinlar xalifa-likning markaziy viloyatlari tomon yo'l oladi va xalifalikning poytaxti Damashq shahrini qo'lga kiritadi. Taxtga abbosiylar xonadonidan bo'lgan Abul Abbos Saffoh ko'tariladi.
Abu Muslim — lug'aviy ma'nosi «Muslimning otasi» deb tarjima qilinsada, mohiyati «eng yaxshi musulmon» demakdir.

Choch hokimi qatl qilingach, uning o'g'li arablardan yordam so'ragan.
751-yil iyul oyida arablarning Ziyod ibn Solih qo'mondonligi ostidagi qo'shini Gao Syanchjining xitoylar, farg'onaliklar, qashqarliklar, kucharliklar hamda qarluqlardan iborat yirik qo'shini bilan Talas daryosi bo'yida to'qnashgan.
Talas jangi 5 kun davom etgan.
To'qnashuv jarayonida Tan armiyasi tarkibidagi qarluqlar arablarga qarshi kurashdan bosh tortgan va xitoyliklar qo'shinining ort qismiga zarba berganlar. Xitoy qo'shini butunlay yakson qilingan.

Talas jangi Markaziy Osiyo xalqlari tarixida o'ta muhim rol o'ynaydi. U Tan imperiyasining O'rta Osiyo hududini egallash yo'lidagi tajovuzkorona siyosatiga uzil-kesil chek qo'ygan.

SAVOL: Samarqand qog'ozi haqida ma'lumot bering.
JAVOB: Talas jangida asirga tushgan Xitoy jangchilari orasidan tanlab olingan hunarmandlar Samarqandga keltirilgan. Ular Samarqandda qog'oz ishlab chiqarish sanoatining yanada rivojlanishiga munosib hissa qo'shgan.
Xitoylik hunarmandlar hatto Mesopotamiya shaharlariga ham keltirilgan.
751-yilda Talas yaqinidagi jangda asir tushgan xitoylik jangchilar hunarmandchilikdan xabardor bo'lib, o'z hayotlarini saqlab qolish niyatida mahalliy hunarmandlarga qog'oz ishlab chiqarish sir-sinoatlarini o'rgatishdi. IX asrga kelib, qog'oz ishlab chiqarish shahar hunarmandchiligining eng muhim jabhalaridan biriga aylandi. Asta-sekin Samarqand qog'ozi butun Sharq va G'arb bozorlarini ham egalladi.
Qog'oz asosan tut daraxtining po'stlog'idan tayyorlangan.
Oq rangli «Samarqand sulton qog'ozi» o'zining yupqaligi, silliqligi va yumshoqligi bilan boshqa qog'oz navlaridan ajralib tursa.
«Samarqand shoyi qog'ozi» sifat jihatdan undan qolishmaydi, rangi och sariq — novvot rangda bo'ladi.
«Miri Ibrohimiy» qog'oz turi yuzi oq rangdagi dumaloq suv tomchi izlari bilan qoplangan bo'ladi.
«Nimkanop» turi esa ipak qoldiqlari hamda po'stloq tolalari bilan qorishtirib tayyorlangani uchun dolchin rangda bo'ladi. Ushbu qog'oz turlarini yaratishda xomashyo sifatida paxta, ipak va tut daraxti po'stlog'idan keng foydalaniladi.

SAVOL: "Oq ki-yimlilar" qo'zg'aloni haqida gapirib bering.
JAVOB: VIII asr oxirlarida Movarounnahrda bo'lib o'tgan qo'zg 'olon «Oq ki-yimlilar» qo'zg'oloni nomi bilan tilga olinadi.
Bu harakatning rahbari Hoshim ibn Hakim ismli hunarmand bo'lgan. U boshi va yuziga ko'k parda tutib yurgan. Shuning uchun ham uni «Muqanna», ya'ni «Niqobdor» laqabi bilan atashgan.
Muqanna Xurosonda sarxanglik (kichik lashkar boshi)dan vazirlik darajasigacha ko'tarilgan.
U Mazdak g'oyalariga asoslangan ijtimoiy tenglik va erkin hayotga da'vat etuvchi ta'limotni targ'ib etgan.
Muqanna o'z yaqinlari bilan Kesh vohasidagi Som qal'asini o'z qarorgohiga aylantiradi.
Bu yerda «Oq kiyimlilar» harakati kengayib, katta xalq qo'zg'oloniga aylanadi. U ayniqsa Sug'dda avj olib, Iloq (Ohangaron) vodiysi va Shoshga ham o'zining ta'sirini o'tkazadi. Qo'zg'olonda turli tabaqalar qatnashadi.
Muqanna qo'zg'oloni 783-yilgacha davom etdi. Narshax va Samarqandda «Oq kiyimlilar» yengilgach, mahalliy mulkdor tabaqa vakillari arablarga yordam bera boshlaydilar.
783-yilda Muqannaning Som qal'asidagi qarorgohi qamalga olinadi. Uzoq davom etgan qamaldan so'ng qo'zg'olonchilar taslim bo'ladilar. Istilochilarga taslim bo'lishni istamagan Muqanna o'z joniga qasd qiladi.

JAVOB: 806-yilda Rofe ibn Lays boshchiligida xalifalikka qarshi yana qo'zg'olon ko'tariladi.
Qo'zg'olon Samarqanddan boshlanib Shosh, Farg'ona, Buxoro, Naxshab va Xorazm viloyatlariga tarqalgan. Tez orada mazkur viloyatlar xalifalik qo'lidan ketadi.
Xuroson noibi Ma'mun dehqonlardan bo'lgan Somonxudotning nabiralari: Nuh, Ahmad va Yahyolardan iltimos qilib, ulardan yordam so'raydi. Ular Rofe ibn Laysni qo'lga olib, uni xalifaga taslim bo'lishga majbur qiladilar.
Shu tariqa navbatdagi xalq harakati ham bostiriladi. Biroq, mahalliy xalqlarning istilochilarga qarshi kurashlari behuda ketmadi. Asta-sekin xalifalikning hukmronligi zaiflasha bordi. Bu hol Movarounnahr aholisining ozodlikka erishuvini tezlashtirdi.

SAVOL: Abu Bakr Narshaxiyning "Buxoro tarixi" asarida Muqanna haqida ma'lumot bering.
JAVOB: Muqanna Marv atrofi aholisidan, Koza deb atalgan qishloqdan bo'lib, nomi Hoshim ibn Hakim edi. U ilgari kudungarlik (matolarni bo'yash) qilar edi, keyin esa ilm o'rganishga mashg'ul bo'ldi va har xil ilmlarni: ko'zbo'yamachilik, sehr va tilsim ilmlarini o'rgandi. Ko'zbo'yamachilikni yaxshi bilib oldi.
Muqanna ko'zbo'yamachilikni o'rgangan va g'oyatda ziyrak bo'lib qadimgi (olimlar) ilmlariga oid ko'p kitoblarni o'qigan va jodugarlikda ustoz bo'lgan edi.
Uning otasining nomi Hakim bo'lib, u Abu Ja'far Davonaqiy davridagi Xuroson amiri lashkarboshilaridan biri edi. U Balxdan chiqqan edi.
Hoshim ibn Hakimni Muqanna deyishlariga sabab shu ediki, u juda xunuk, boshi kal va bir ko'zi ko'r bo'lganidan hamisha boshi va yuziga ko'k parda tutib yurar edi.
Muqanna Abbosiylar da'vatchisi Abu Muslim zamonida Xuroson lashkarboshilaridan biri bo'lib, vazir bo'ldi va payg'ambarlik da'vosini qildi va bir qancha vaqt shu da'voda turdi. Abu Ja'far Davonaqiy odam yuborib, uni Marvdan Bag'dodga oldirib keldi va bir necha yil davomida zindonda tutdi.
Shundan keyin u zindondan qutulib, yana Marvga qaytib keldi va odamlarni yig'ib: «Mening kim ekanimni bilasizmi?» — deb so'radi. Odamlar: «Sen Hoshim ibn Hakimsan», — dedilar. U: «Yanglishdingiz, men sizning va butun olamning xudosiman»... va yana: «O'zimni qanday nom bilan atashni istasam atay beraman», — dedi hamda: «Men xalqqa o'zimni Odam (Ato) suratida, keyin Nuh suratida, keyin Ibrohim suratida, keyin Muso suratida, so'ng Iso suratida, keyin Muhammad mustafo (s.a.v.) suratida, keyin Abu Muslim suratida ko'rsatgan zotman, endi esa mana o'zingiz ko'rib turgan suratdaman», — dedi. Odamlar: «Boshqalar payg'ambarlik da'vosini qilgan edilar, sen esa xudolik da'vosini qilayapsan», — dedilar. Muqanna: «Ular nafsoniy edilar, men esa ruhoniyman va ularning (badanlari) ichida edim, menda shunday qudrat borki, o'zimni qanday suratda ko'rsatishni istasam, shunday suratda ko'rsata beraman», — dedi.

JAVOB: Qadimda Oltoyning g'arbida, so'ngra Irtish daryosining o'rta oqimida yashagan qarluqlar turkiy qabilalardan hisoblangan.
VI-VII asrlarda ular Turk xoqonligi tarkibiga kirgan. VIII asr o'rtalarida Yettisuv o'lkasida Qarluqlar davlati tashkil topdi. Bu davlatning poytaxti Chu daryosidan shimolroqda joylashgan Suyob shahri edi.
Qarluqlar davlati hukmdori «yabg'u» yoki «jabg'u» deb yuritilgan.
Qarluqlar yurtida poytaxtdan tashqari Jo'l, Navkat, Karmankat, Yor kabi shaharlar va qator qishloqlar qad ko'targan.

Aholi chorvachilik, tog' jilg'alari bo'ylarida esa dehqonchilik bilan shug'ullangan.
Sharqiy Turkiston va Movarounnahr bilan savdo-sotiq olib borgan.

JAVOB: G'arbiy Turk xoqonliging tanazzulidan keyin tashkil topgan yirik etnik uyushmalardan biri o'g'uz (arab-fors manbalarida guz) etnosi bo'lgan. Turk xoqonligi hukmronligi davrida o'g'uzlar uning tarkibida bo'lgan. Turk xoqonligi yemirilgach, o'g'uzlarning kattagina qismi Sirdaryo havzasi hamda Orol dengizi bo'yida muqim o'rnashib olganlar.
Ular IX asr oxiri va X asr boshida O'g'uzlar davlatiga asos soladilar.

Xalifa Mu'tazid safforiylar hukmdori Amr ibn Laysga Xuroson bilan birga Movarounnahr ustidan ham hukm yuritish huquqi berilgani haqida farmon chiqaradi. Bu bilan uni Ismoilga qarshi gijgijlaydi. Natijada ular o'rtasida urush boshlanadi. Urush Ismoilning g'alabasi bilan tugaydi. Butun Xuroson somoniylar qo'l ostiga o'tadi. Noilojlikdan xalifa Ismoilga hukmdorlik yorlig'ini yuborishga majbur bo'ladi. Ismoil Somoniy butun Movarounnahr va Xurosonni o'z qo'l ostida birlashtirdi. Buxoro shahri bu davlatning poytaxtiga aylandi.

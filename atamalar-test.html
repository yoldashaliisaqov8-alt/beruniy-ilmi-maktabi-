a cheklangan deb biluvchi falsafiy konsepsiya.\ne) Xarid qilish qobiliyati pariteti: turli mamlakatlar valyutalarining ma'lum tovar yoki xizmatga nisbatan sotib olish qobiliyatini hisobga oluvchi o'zaro nisbati.",["I-a, II-e, III-b, IV-d","I-a, II-e, III-b, IV-c","I-c, II-d, III-b, IV-a","I-e, II-c, III-b, IV-d"],0]]],["11-sinf O'zbekiston tarixi atamalari (lug'at)",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Magistral\nII. Sammit\nIII. Yurisdiksiya\nIV. Dotatsiya\na) Huquqiy masalalarni hal qilish, sudlov ishlarini olib borish huquqi. Muayyan davlat organi vakolatlari doirasidagi huquq sohasi.\nb) Asosiy yo'l. Qatnov yo'li, umuman, tarmoqlangan sistemalarning asosiy qismi.\nc) Yangilanish, zamonaviy; davlat, jamiyat, iqtisodiyot, texnologiya va boshqa sohalarning yangilanishi, yangi uslublar, ixtirolarning qo'llanishi asosidagi o'zgarishlar.\nd) Ma'lum harajatlarni qoplash uchun iqtisodiyotning bir sub'yekta tomonidan ikkinchisiga qaytarib bermaslik sharti bilan pul mablag'i berilishi.\ne) Ikki yoki bir necha davlat boshliqlarining muhim xalqaro masalalar bo'yicha uchrashuvi; oliy darajadagi kengash.",["I-b, II-a, III-e, IV-d","I-b, II-e, III-a, IV-d","I-c, II-e, III-b, IV-d","I-d, II-c, III-a, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Magistr\nII. Mentalitet\nIII. Referendum\nIV. Transchegaraviy\na) Davlat ahamiyatiga ega bo'lgan muhim masalalar bo'yicha o'tkaziladigan va ba'zan qonun qabul qilish uchun asos bo'lib xizmat qiladigan umumxalq so'rovi, ovoz berish yo'li bilan xalq fikrini aniqlash.\nb) Ayrim mamlakatlarda bakalavr va fan doktori o'rtasidagi ilmiy daraja. Tayanch oliy ta'lim kursidan so'ng qo'shimcha dastur bajargan, maxsus imtihonlarni topshirgan va muayyan ilmiy ishni himoya qilgan shaxslarga beriladi.\nc) Huquqshunoslikda huquqbuzarga nisbatan qo'llaniladigan va uning uchun muayyan oqibatlar keltiruvchi chora.\nd) Jamiyat, millat, jamoa yoki alohida shaxsning tarixiy tarkib topgan tafakkur darajasi. Jamiyat, millat yoki shaxsning mentaliteti ularning o'ziga xos an'analari, rasm-rusumlari, urfodatlari, diniy e'tiqod va irimlarini qamrab oladi.\ne) Chegaralararo, bir necha davlat hududidan o'tuvchi. Daryolar va yo'larga nisbatan qo'llaniladi.",["I-c, II-b, III-d, IV-e","I-b, II-a, III-d, IV-e","I-d, II-c, III-a, IV-e","I-b, II-d, III-a, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Immunologiya\nII. Deputat\nIII. Logistika\nIV. Seminariya\na) Organizmning kimyoviy xususiyatlari, uning immuniteti haqidagi fan.\nb) Inson faoliyatining u yoki bu sohasini moddiy-texnik ta'minlashni boshqarish tizimi.\nc) San'atning musiqa, kino, teatr va boshqa sohalarida erishilgan eng yaxshi yutuqlar bo'yicha o'tkaziladigan tanlov, ko'rikdan iborat ommaviy bayram, tantana, sayil.\nd) Vakolatli davlat organiga saylangan kishi, vakil.\ne) 1) Boshlang'ich maktab o'qituvchilari tayyorlaydigan maxsus o'quv yurti; 2) xristian cherkovlari uchun ruhoniylar tayyorlaydigan o'quv yurti.",["I-c, II-d, III-a, IV-b","I-e, II-a, III-b, IV-d","I-a, II-d, III-b, IV-e","I-b, II-d, III-e, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Partiya\nII. Sessiya\nIII. Diversifikatsiya\nIV. Aeronavigatsiya\na) 1) Boshlang'ich maktab o'qituvchilari tayyorlaydigan maxsus o'quv yurti; 2) xristian cherkovlari uchun ruhoniylar tayyorlaydigan o'quv yurti.\nb) G'oyaviy jihatdan maslakdosh, manfaatlari bir bo'lgan kishilar guruhidan iborat, muayyan ijtimoiy guruh yoki qatlamlarning manfaatlarini himoya qiluvchi siyosiy tashkilot.\nc) Ish, mashg'uloti davriy ravishda amalga oshiriladigan vakolatli organlarning, sud yoki jamiyatlarning ish, yig'ilish o'tkazadigan davri.\nd) Uchish apparatlarini tegishli asbob va vositalar yordamida belgilangan yo'ldan olib borish haqidagi fan; havo navigatsiyasi.\ne) Ishlab chiqarish samaradorligini oshirish, iqtisodiy bankrotlikni oldini olish maqsadida ishlab chiqariladigan mahsulot assortimentining kengaytirilishi, mahsulot sotiladigan bozorlarni o'zgartirish yoki yangi mahsulot turlarini ishlab chiqarishga ixtisoslashish.",["I-b, II-c, III-e, IV-d","I-b, II-e, III-d, IV-c","I-d, II-b, III-e, IV-a","I-d, II-a, III-e, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Afv etish\nII. Skrining\nIII. Galereya\nIV. Prozelitizm\na) Binoning ikki qismini birlashtiruvchi usti yopiq uzun yo'lak; tomosha zalida eng yuqorigi yarus.\nb) Bir diniy konfessiyadagi dindorlarni boshqasiga kiritishga qaratilgan xatti-harakatlar.\nc) Sud hukmi bilan jazo tayinlangan biror shaxsni jinoiy javobgarlikdan ozod qilish yoki berilgan jazoni yengillashtirish. Odatda afv davlat boshlig'ining qarori bilan amalga oshiriladi.\nd) Maxsus usullar yordamida kasallikni erta va tez aniqlash uchun aholini ommaviy tekshirishdan o'tkazish.\ne) Huquqshunoslikda huquqbuzarga nisbatan qo'llaniladigan va uning uchun muayyan oqibatlar keltiruvchi chora.",["I-d, II-a, III-c, IV-b","I-c, II-b, III-d, IV-a","I-c, II-d, III-a, IV-b","I-c, II-b, III-e, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Simpozium\nII. Strategiya\nIII. Sanksiya\nIV. Bakalavr\na) Huquqshunoslikda huquqbuzarga nisbatan qo'llaniladigan va uning uchun muayyan oqibatlar keltiruvchi chora.\nb) Uzoqqa boruvchi ta'sir vositalari va uslublari; maqsadni istiqbolli dinamik aniqlab olish.\nc) Biror ilmiy masala bo'yicha o'tkaziladigan xalqaro ilmiy kengash; ilmiy anjuman.\nd) Oliy ta'lim dasturining birinchi bosqichini tugallagan talabalarning ilmiy darajasi.\ne) Davlat chegaralarini tuzilgan shartnomaga muvofiq tavsiflash va xaritalashtirish asosida belgilash; belgilangan chegaralarni qayta ko'rib chiqish.",["I-a, II-b, III-e, IV-d","I-c, II-b, III-a, IV-d","I-d, II-b, III-c, IV-a","I-c, II-e, III-a, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Festival\nII. Konsepsiya\nIII. Baynalmilal\nIV. Shafe\na) Organizmning kimyoviy xususiyatlari, uning immuniteti haqidagi fan.\nb) Birovga yon bosuvchi, homiylik qiluvchi; homiy.\nc) San'atning musiqa, kino, teatr va boshqa sohalarida erishilgan eng yaxshi yutuqlar bo'yicha o'tkaziladigan tanlov, ko'rikdan iborat ommaviy bayram, tantana, sayil.\nd) Biror sohani rivojlantirishga qaratilgan keng qamrovli loyiha yoki qarashlar majmui.\ne) Xalqaro, umuminsoniy, umumxalqiy mazmunlarida qo'llaniladi.",["I-c, II-d, III-e, IV-b","I-c, II-d, III-b, IV-a","I-a, II-d, III-b, IV-e","I-e, II-d, III-c, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Doktrina\nII. Modernizatsiya\nIII. Konvertatsiya\nIV. Infratuzilma\na) Ilmiy yoki falsafiy ta'limot, nazariya; asosiy nazariy yoki siyosiy nuqtayi nazar.\nb) Milliy valyutaning amaldagi kurs bo'yicha boshqa xorijiy valyutalarga erkin va cheklanmagan miqdorda almashtirilishi.\nc) O'zgalarning fikr-g'oyalari, e'tiqodi, his-tuyg'ulari, turmush tarzi va xulq-atvoriga nisbatan sabr-toqatli bo'lish, beparvo qarash; bag'rikenglik.\nd) Yangilanish, zamonaviy; davlat, jamiyat, iqtisodiyot, texnologiya va boshqa sohalarning yangilanishi, yangi uslublar, ixtirolarning qo'llanishi asosidagi o'zgarishlar.\ne) Ishlab chiqarishga xizmat qiluvchi va jamiyat hayoti uchun zarur bo'lgan me'yoriy sharoitni ta'minlashga xizmat qiladigan turli-tuman yordamchi xizmat ko'rsatuvchi sohalar majmui.",["I-a, II-c, III-d, IV-e","I-a, II-d, III-b, IV-e","I-c, II-d, III-e, IV-b","I-b, II-a, III-c, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Innovatsiya\nII. Delimitatsiya\nIII. Tolerantlik\nIV. Immunologiya\na) Jamiyat, millat, jamoa yoki alohida shaxsning tarixiy tarkib topgan tafakkur darajasi. Jamiyat, millat yoki shaxsning mentaliteti ularning o'ziga xos an'analari, rasm-rusumlari, urfodatlari, diniy e'tiqod va irimlarini qamrab o b chiqarish samaradorligini oshirish, iqtisodiy bankrotlikni oldini olish maqsadida ishlab chiqariladigan mahsulot assortimentining kengaytirilishi, mahsulot sotiladigan bozorlarni o'zgartirish yoki yangi mahsulot turlarini ishlab chiqarishga ixtisoslashish.\ne) Birovga yon bosuvchi, homiylik qiluvchi; homiy.",["I-d, II-e, III-a, IV-b","I-c, II-e, III-b, IV-a","I-e, II-d, III-a, IV-b","I-a, II-e, III-c, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Bakalavr\nII. Festival\nIII. Dotatsiya\nIV. Modernizatsiya\na) San'atning musiqa, kino, teatr va boshqa sohalarida erishilgan eng yaxshi yutuqlar bo'yicha o'tkaziladigan tanlov, ko'rikdan iborat ommaviy bayram, tantana, sayil.\nb) Ma'lum harajatlarni qoplash uchun iqtisodiyotning bir sub'yekta tomonidan ikkinchisiga qaytarib bermaslik sharti bilan pul mablag'i berilishi.\nc) Huquqiy masalalarni hal qilish, sudlov ishlarini olib borish huquqi. Muayyan davlat organi vakolatlari doirasidagi huquq sohasi.\nd) Yangilanish, zamonaviy; davlat, jamiyat, iqtisodiyot, texnologiya va boshqa sohalarning yangilanishi, yangi uslublar, ixtirolarning qo'llanishi asosidagi o'zgarishlar.\ne) Oliy ta'lim dasturining birinchi bosqichini tugallagan talabalarning ilmiy darajasi.",["I-d, II-c, III-b, IV-e","I-b, II-a, III-e, IV-c","I-e, II-a, III-b, IV-d","I-b, II-c, III-a, IV-d"],2]]],["11-sinf O'zbekiston tarixi qo'llanma atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Allogen transplantatsiya\nII. Referendum\nIII. Parlament respublikasi\nIV. Yarashuv instituti\na) Donordan olingan suyak ko'migi hujayralarini ko'chirish.\nb) Siyosiy qarorlarni parlament va bosh vazir qabul qiladigan boshqaruv shakli (Germaniya, Italiya).\nc) Hududni jadal ijtimoiy-iqtisodiy rivojlantirish uchun chet el investitsiyalari va mahalliy sarmoyalarni, yuqori texnologiyalar hamda boshqaruv tajribasini jalb etish maqsadida ajratilgan, belgilangan chegara va maxsus ng.\nI. Sinantrop\nII. Agora\nIII. Animizm\nIV. Imperator\na) Insonni qurshab turgan muhitda jonlar va ruhlarning mavjudligiga ishonch. Lotincha, «jon», «ruh» tushunchalarini anglatadi.\nb) Lotincha «hukmdor», Rimda dastlab – faxriy harbiy unvon, keyinchalik mutlaq hukmdorga tegishli nom\nc) Qadimgi Yunoniston va Qadimgi Rim davri tarixining nomi.\nd) «Xitoy odami» ma'nosini anglatadi. Ilk paleolit davrida yashagan ibtidoiy odam\ne) Qadimgi Yunoniston shaharlarida xalq yig'ilish joyi, markaziy maydon",["I-c, II-a, III-d, IV-b","I-d, II-b, III-e, IV-a","I-a, II-e, III-d, IV-c","I-d, II-e, III-a, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Neandertal\nII. Goplit\nIII. Etnografiya\nIV. Plebeylar\na) Rimga ko'chib kelgan odamlar va ularning avlodlari\nb) Qadimgi Yunoniston va Yunoniston-Makedoniya armiyalarining og'ir qurollangan piyoda jangchisi\nc) Miloddan avvalgi VI asrda Hindistonda Siddhartha Gautama tomonidan asos solingan diniy ta'limot\nd) O'rta paleolit davrida yashagan ibtidoiy odam. Uning suyak qoldiqlari dastlab Germaniyadan topilgan\ne) Yunoncha atama bo'lib, «xalqlar tavsifi » ma'nosini anglatadi",["I-b, II-c, III-e, IV-a","I-d, II-b, III-e, IV-a","I-c, II-b, III-e, IV-a","I-d, II-a, III-e, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Zinjantrop\nII. Havoriylar\nIII. Ibodatxona\nIV. Buddaviylik\na) Iso Masih shogirdlari. Ular o'n ikki nafar bo'lib Falastin bo'ylab sayohat qilib, Xudo oyatlari haqida hikoya qilib beradi va ularni amalda ko'rsatadilar o'liklarni tiriltiradi, yashashdan umidini uzgan, tuzalmas xastalarni davolaydilar\nb) Miloddan avvalgi VI asrda Hindistonda Siddhartha Gautama tomonidan asos solingan diniy ta'limot\nc) Ibtidoiy odam, bu odamning nomi uning suyak qoldiqlari topilgan joy — Sharqiy Afrikadagi vodiy nomidan olingan\nd) Odamlar xudolarga sig'ingan muqaddas bino yoki joy\ne) Yunoncha so'zlaridan iborat bo'lib, «odam haqidagi fan» ma'nosini anglatadi",["I-c, II-d, III-a, IV-b","I-d, II-a, III-c, IV-e","I-c, II-a, III-d, IV-b","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Termalar\nII. Gilgamish\nIII. Antik tarix\nIV. Koloniya\na) Gavdasi sherniki va boshi insonniki bo'lgan, piramidalarni qo'riqlovchi ulkan haykal – afsonaviy mavjudot\nb) Qadimgi Rim shahridagi jamoat hammomlari\nc) Qadimgi davrlarda o'z yurtini tark etgan odamlar tomonidan yangi yerlarda asos solingan manzilgoh va shaharlar\nd) Qadimgi Yunoniston va Qadimgi Rim davri tarixining nomi.\ne) Mesopotamiyaning afsonaviy qahramoni, tarixiy shaxs, Uruk shahri podshosi",["I-b, II-c, III-a, IV-e","I-b, II-a, III-d, IV-c","I-b, II-e, III-d, IV-c","I-b, II-a, III-e, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Argonavtlar\nII. Altamir\nIII. Polis\nIV. Konsul\na) Yunoncha «shahar» ma'nosini bildiruvchi so'z\nb) Oltin mo'ynani (sehrli qo'chqor terisini) izlab, «Argo» degan ko'p eshkakli kemada dengiz sayohatiga chiqqan Ellada qahramonlari\nc) Ispaniyadagi so'nggi paleolitga oid qoyatosh rasmlari topilgan g'or\nd) Respublika davrida Rimdagi oliy siyosiy lavozim; har yili saylangan ikki nafar shunday mansabdor Senat va armiyaga rahbarlik qilgan.\ne) Yunoncha «viloyat» tushunchasini anglatadi. Misrdagi ilk davlat",["I-b, II-c, III-a, IV-e","I-b, II-c, III-a, IV-d","I-c, II-e, III-a, IV-d","I-a, II-b, III-e, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Forum\nII. N'om\nIII. Budda\nIV. Senat\na) Siddhartha Gautamaning ikkinchi ismi, laqabi; «ma'rifatlangan» tarzida tarjima qilinadi\nb) Yunoncha so'zlaridan iborat bo'lib, «odam haqidagi fan» ma'nosini anglatadi\nc) Yunoncha «viloyat» tushunchasini anglatadi. Misrdagi ilk davlat\nd) Rimda yig'ilish joyi va savdo-sotiq maydoni bo'lib xizmat qilgan shahar markazi\ne) «Oqsoqollar kengashi» ma'nosini anglatadigan so'

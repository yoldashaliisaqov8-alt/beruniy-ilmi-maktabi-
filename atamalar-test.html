<h1 id="h">Tarix atamalari</h1>
<p class="sub" id="sub">Atama va izohni moslashtiring · javob darhol ko'rsatiladi</p>
<div id="app"></div>
</div>
<script>
var D=[["10-sinf Jahon tarixi atamalar",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Industrial sivilizatsiya\nII. Postindustrial sivilizatsiya\nIII. Konferensiya\nIV. Millatlar Ligasi\na) sanoat va fan-texnika taraqqiyotiga asoslangan sivilizatsiya.\nb) iqtisodiyotda sanoatning yuqori unumdor innovatsion sektori, yalpi ichki mahsulotda fan yutuqlari va axborot texnologiyalari, iqtisodiy va boshqa faoliyat sohalarida raqobat ustuvor bo'lgan jamiyat. Bu sivilizatsiyaga nisbatan axborot jamiyati atamasi ham qo'llaniladi.\nc) davlat yoki partiya, jamoat va olimlar vakillarining muayyan masalani muhokama etish uchun yig'ilishi.\nd) Birinchi jahon urushidan keyin tuzilgan xalqlarning tinchlik va xavfsizlik yo'lidagi hamkorligini amalga oshiruvchi xalqaro tashkilot.\ne) bu suveren davlatlar o'rtasida tovarlar, xizmatlar, moliya, investitsiya, ishchi kuchi erkin harakatlanadigan iqtisodiy kenglikni tashkil qilish maqsadida birlashish jarayoni.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-c, IV-e","I-b, II-c, III-d, IV-e","I-a, II-c, III-d, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Fashizm\nII. Shovinizm\nIII. O'nglar\nIV. So'llar\na) sanoat va fan-texnika taraqqiyotiga asoslangan sivilizatsiya.\nb) Italiyada paydo bo'lgan siyosiy oqim. Hokimiyat tepasiga kelgach, fashistlar zo'ravonlikning ashaddiy shakllarini qo'llovchi va jamiyat ustidan yalpi nazorat o'rnatuvchi terroristik diktaturani barpo etdilar.\nc) bir irqning boshqalardan ustunligini da'vo qiluvchi, millatlar o'rtasida nizo urug'ini sochuvchi o'ta o'ng, ashaddiy millatchilik.\nd) mavjud tuzumni keskin o'zgartirmaslik, uni konstitutsiya doirasida rivojlantirish tarafdorlari.\ne) mavjud tuzumni o'zgartirish, keskin islohotlar tarafdorlari.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-c, IV-e","I-b, II-c, III-d, IV-e","I-a, II-c, III-d, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Patefon\nII. Individualizm\nIII. Liberalizm\nIV. Neytralitet\nV. Izolatsionizm\na) plastinkaga yozib olingan musiqa va qo'shiqni qayta eshittiruvchi qurilma.\nb) davlatlar o'rtasida olib borilayotgan urushga qo'shilmaslik imkonini ta'minlovchi huquqiy maqom.\nc) alohida shaxs manfaatlarini jamiyat manfaatlaridan ustun qo'yishga qaratilgan nazariya\nd) parlamentarizm, demokratik erkinliklar va xususiy tadbirkorlik tarafdorlarini birlashtirgan ijtimoiy-siyosiy oqim.\ne) mavjud tuzumni o'zgartirish, keskin islohotlar tarafdorlari.\nf) biron-bir davlatning xalqaro muammolarni hal qilishda ishtirok etishdan bosh tortish siyosati. Ko'pincha, AQSHning ikkinchi jahon urushigacha bo'lgan siyosatiga nisbatan qo'llaniladi.",["I-a, II-b, III-c, IV-d, V-f","I-a, II-b, III-c, IV-e, V-f","I-b, II-c, III-d, IV-e, V-f","I-a, II-c, III-d, IV-b, V-f"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Fraksiya\nII. Totalitarizm\nIII. Anshlyus\nIV. Radikal\na) qo'shib olish, ittifoq. Tarixda, asosan, 1938-yili Germaniyaning Avstriyani qo'shib olishiga nisbatan\nb) (umumiy, yalpi) – XX asr hodisasi bo'lib, butun siyosiy tizimning davlatga bo'ysunishini, jamiyat hayoti va fuqarolar ustidan to'liq davlat nazorati o'rnatilishini nazarda tutadi.\nc) biror-bir partiyaning parlamentdagi a'zolari yoki siyosiy partiya ichidagi alohida guruh.\nd) mavjud tuzumni keskin o'zgartirmaslik, uni konstitutsiya doirasida rivojlantirish tarafdorlari.\ne) keskin choralar va harakatlarga intilish tarafdorlari.",["I-a, II-b, III-c, IV-d","I-c, II-b, III-a, IV-e","I-b, II-c, III-d, IV-e","I-a, II-c, III-d, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Intervensiya\nII. «Harbiy kommunizm»\nIII. Natsionalizatsiya\nIV. Katolitsizm\na) xristian dinining asosiy mazhablaridan biri.qo'llaniladi.\nb) xususiy mulkning, yirik korxonalar, yer, xalq xo'jaligi sohalarining davlat mulkiga aylantirilishi.\nc) Sovet davlatining fuqarolar urushi sharoitidagi ijtimoiy-iqtisodiy siyosati. Unda tijorat taqiqlanadi, qishloq xo'jalik mahsulotlarining ortiqchasini davlatga\nd) bir yoki bir necha davlatning boshqa davlat ichki ishlariga zo'ravonlik bilan aralashuvi, uning suverenitetini buzishi.\ne) keskin choralar va harakatlarga intilish tarafdorlari.",["I-a, II-b, III-c, IV-d","I-c, II-b, III-a, IV-e","I-b, II-c, III-d, IV-e","I-d, II-c, III-b, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dekret\nII. Plantatsiya\nIII. Avtoritarizm\nIV. Kortes\na) maxsus qishloq xo'jalik ekinlari yetishtiriladigan katta xo'jalik.\nb) (decretum – qaror, decernere – qaror qilish) – davlat organi yoki lavozimdagi shaxsning huquqiy akti, qarori.\nc) Ispaniya va Portugaliyada parlamentning nomlanishi.\nd) bir yoki bir necha davlatning boshqa davlat ichki ishlariga zo'ravonlik bilan aralashuvi, uning suverenitetini buzishi.\ne) siyosiy rejim, unda jamiyat davlat va uning boshlig'iga bo'ysundiriladi, hokimiyat tepasida turgan shaxs o'zini o'zi shu hokimiyatga haqli deb e'lon qiladi.",["I-e, II-c, III-b, IV-a","I-c, II-b, III-a, IV-e","I-b, II-c, III-d, IV-e","I-d, II-c, III-b, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Diktatura\nII. Ekspansiya\nIII. Militarizatsiya\nIV. Byurokratiya\nV. Pakt\na) hech qanday cheklovlarsiz, hukmron sinfning kuchiga tayanib ish yurituvchi hokimiyat.\nb) bir davlatning o'zga mamlakatlar hududi va bozorini egallab olish maqsadida o'z siyosiy va iqtisodiy ta'sirini yoyishga qaratilgan siyosati.\nc) jamiyatning iqtisodiy, siyosiy va ijtimoiy hayotini harbiy maqsadlarga bo'ysundirish.\nd) xalqdan ajralib qolgan, hukmron guruh manfaatlarini himoya qiluvchi ma'muriyatchilik boshqaruv tizimi.\ne) mavjud tuzumni o'zgartirish, keskin islohotlar tarafdorlari.\nf) xalqaro kelishuv, xalqaro shartnoma turi.",["I-a, II-b, III-c, IV-d, V-f","I-a, II-b, III-c, IV-e, V-f","I-b, II-c, III-d, IV-e, V-f","I-a, II-c, III-d, IV-b, V-f"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Suverenitet\nII. Provinsiya\nIII. Konservatizm\nIV. Anneksiya\na) maxsus qishloq xo'jalik ekinlari yetishtiriladigan katta xo'jalik.\nb) davlatning ichki ishlar va tashqi siyosatdagi to'liq mustaqilligi.\nc) ba'zi davlatlarda ma'muriy birlik, viloyat.\nd) an'anaviy qadriyatlar, urf-odatlar, ijtimoiy va diniy tartiblar tarafdori bo'lgan siyosiy oqim.\ne) bir davlat hududining yoki bir qismining boshqa davlatga zo'rlik bilan qo'shib olinishi.",["I-e, II-c, III-b, IV-a","I-c, II-b, III-a, IV-e","I-b, II-c, III-d, IV-e","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Modernizatsiya\nII. Infratuzilma\nIII. Chodra\nIV. Sektor\nV. Litsenziya\na) bir qator musulmon mamlakatlarida ayollar yopinib yuradigan diniy libos.\nb) iqtisodiyotning umumiy tavsifi, maqsadlari va vazifalari bir-biriga yaqin sohalardan iborat bo'lgan yirik qismi.\nc) jamiyatning iqtisodiy, siyosiy va ijtimoiy hayotini harbiy maqsadlarga bo'ysundirish.\nd) ishlab chiqarish, texnika, texnologik jarayon kabilarni zamonaviy talablarga moslashtirish, yangilash jarayoni.\ne) ma'lum muddatga belgilangan faoliyat turi bilan shug'ullanish uchun beriladigan huquqni tasdiqlovchi rasmiy hujjat.\nf) jamiyat yoki uning biron-bir sohasi faoliyatini ta'minlovchi muassasa, boshqaruv tizimi, aloqa vositalari va shu kabilar majmuyi.",["I-a, II-b, III-c, IV-d, V-f","I-d, II-f, III-a, IV-b, V-e","I-b, II-c, III-d, IV-e, V-f","I-a, II-c, III-d, IV-b, V-f"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sivilizatsiya\nII. Konvensiya\nIII. Missionerlik\nIV. Iyerarxiya\na) maxsus qishloq xo'jalik ekinlari yetishtiriladigan katta xo'jalik.\nb) o'zga din vakillari orasida xristian dinini targ'ib qilishga yo'naltirilgan faoliyat.\nc) alohida masala bo'yicha xalqaro kelishuv, xalqaro shartnoma turi.\nd) an'anaviy qadriyatlar, urf-odatlar, ijtimoiy va diniy tartiblar tarafdori bo'lgan siyosiy oqim.\ne) pastdan yuqoriga qarab amal pillapoyasi bo'yicha bo'ysunish tartibi.",["I-e, II-c, III-b, IV-a","I-c, II-b, III-a, IV-e","I-b, II-c, III-d, IV-e","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kapitulatsiya\nII. Koalitsiya\nIII. Xartiya\nIV. Deklaratsiya\nV. Evakuatsiya\na) majburiy kuchga ega bo'lmagan xalqaro aktning umumiy qoidalari va maqsadlarini ifodalaydigan hujjat.\nb) qandaydir muhim ma'lumotlar bayon qilingan ayrim rasmiy hujjatlarning nomlanishi.\nc) jamiyatning iqtisodiy, siyosiy va ijtimoiy hayotini harbiy maqsadlarga bo'ysundirish.\nd) urushayotgan tomonlardan birining urush harakatlarini, qurolli qarshilik ko'rsatishni davom ettirishdan voz kechishi.\ne) urush harakatlari bo'layotgan hududdan odamlar, muassasalar, korxonalar va boshqalarning urush bo'lmayotgan\nf) umumiy maqsadga erishish uchun ayrim shaxslar, siyosiy partiyalar, davlatlar o'rtasida tuziladigan ittifoq.",["I-a, II-b, III-c, IV-d, V-f","I-d, II-f, III-a, IV-b, V-e","I-b, II-c, III-d, IV-e, V-f","I-a, II-c, III-d, IV-b, V-f"],1]]],["11-sinf atamalar",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Globallashuv\nII. Modernizatsiya\nIII. Totalitar mafkura\nIV. Ko'pqutbli dunyo\na) jahon mamlakatlarining iqtisodiy, siyosiy, madaniy va diniy jihatdan birlashishi yoki yaqinlashish jarayoni.\nb) ijtimoiy tizimni jadal rivojlantirish maqsadida uni to'liq yoki qisman yangilash, an'anaviy jamiyatdan yangilangan jamiyatga, agrar sivilizatsiyadan industrial sivilizatsiyaga o'tish jarayoni.\nc) mafkuraviy rejim shakli bo'lib, totalitar jamiyatda aholini keng miqyosda ommaviy ravishda mafkuraviy qayta tarbiyalash vositasidir.\nd) jahonda bir-biridan ustun bo'lmagan bir nechta siyosiy, iqtisodiy, harbiy va madaniy markazlarning (qutblarning) mavjudlik holati.\ne) bu suveren davlatlar o'rtasida tovarlar, xizmatlar, moliya, investitsiya, ishchi kuchi erkin harakatlanadigan iqtisodiy kenglikni tashkil qilish maqsadida birlashish jarayoni.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-c, IV-e","I-b, II-c, III-d, IV-e","I-a, II-c, III-d, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Integratsiya\nII. Etnik mojaro\nIII. «Rangli inqilob»\nIV. Korrupsiya\na) jahon mamlakatlarining iqtisodiy, siyosiy, madaniy va diniy jihatdan birlashishi yoki yaqinlashish jarayoni.\nb) odatda, bir-biri bilan qo'shni yashaydigan turli etnik guruhga mansub jamoalar o'rtasidagi to'qnashuv.\nc) XX asr oxiri — XXI asr boshlaridagi norozilik namoyishlari va ular natijasida yuz bergan hokimiyat\nd) amaldor shaxs tomonidan o'z vakolatlarini va unga ishonib topshirilgan huquqlarni, shuningdek, rasmiy lavozim bilan bog'liq obro'yi va aloqalarini qonunga va axloq\ne) bu suveren davlatlar o'rtasida tovarlar, xizmatlar, moliya, investitsiya, ishchi kuchi erkin harakatlanadigan iqtisodiy kenglikni tashkil qilish maqsadida birlashish jarayoni.",["I-e, II-b, III-c, IV-d","I-a, II-b, III-c, IV-e","I-b, II-c, III-d, IV-e","I-a, II-c, III-d, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Demografiya\nII. Logistika\nIII. Transmilliy korporatsiya\nIV. Siyosiy texnologiya\na) aholi va uning ko'payish qonuniyatlari to'g'risidagi fan. U aholining son jihatidan\nb) siyosiy faoliyatning ma'lum usullari bo'lib, ulardan jamiyatning ongiga ta'sir o'tkazish orqali ma'lum bir siyosiy maqsadga erishish\nc) tovarlar, yuklar va shu kabilarni bir hududdan boshqasiga yetkazib berishning tizimini tashkil qilish.\nd) bir nechta mamlakatlarda ishlab chiqarish bo'limlariga ega bo'lgan va faoliyatining asosini xalqaro biznes tashkil qiladigan kompaniya.\ne) bu suveren davlatlar o'rtasida tovarlar, xizmatlar, moliya, investitsiya, ishchi kuchi erkin harakatlanadigan iqtisodiy kenglikni tashkil qil I-d, II-b, III-c, IV-a","I-a, II-e, III-d, IV-c","I-a, II-b, III-c, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Domen\nII. Tungin\nIII. Kollegiya\nIV. Xanke\na) mahalliy boshqaruv asosini erkin franklarning yuzlik yig'inlari tashkil etib, uning boshlig'i, yuzboshisi – … deb nomlangan\nb) (lotincha, «qidiruv») yeretiklarga qarshi kurashish uchun tuziladi\nc) omadli talabalar hozirgi yotoqxonalarga o'xshash … joylashishga muvaffaq bo'lishgan\nd) yaponiyada yirik yer egalari ma'lum toifalarga bo'lingan. Ulardan eng nufuzlilari – … deb nomlangan. Ularning vassallari ryokalar bo'lgan\ne) (lotincha, dominium – mulk) – qirol, gersog, graf va baronlarning qaram dehqonlar mehnati bilan ishlanadigan yer-mulklari",["I-d, II-b, III-c, IV-a","I-e, II-c, III-b, IV-d","I-a, II-c, III-b, IV-d","I-e, II-a, III-c, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Mikado\nII. Shimoliysavdo yo'li\nIII. Yarmarka\nIV. Cherkov yig'inlari\na) ulgurji savdo bo'ladigan, turli mamlakat savdogarlari qatnashadigan, mol sotish va ayirboshlash joyi nomi bo'lgan\nb) shimolda Boltiq dengizi orqali London, Bryugge, Lyubek, Novgorod shaharlarini o'zaro bog'lash uchun\nc) III asrdan xristian cherkovi oliy ruhoniylarining cherkovni nazariy, amaliy boshqarish muammolarini hal etish uchun chaqiradigan qurultoyi\nd) yaponiyani XII asrdan … – imperator boshqargan.\ne) g'arbiy Yevropa san'atida X asrdan XII–XIII asrlargacha hukm surgan badiiy uslub. Unda Qadimgi Rim me'morchiligi uslub va unsurlaridan keng foydalanilgan",["I-e, II-b, III-c, IV-a","I-d, II-e, III-c, IV-a","I-c, II-e, III-a, IV-b","I-d, II-b, III-a, IV-c"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kommuna\nII. Shkolyarlar\nIII. Gospitalyerlar ordeni\nIV. Konung\na) universitet o'quvchilari\nb) qabila boshlig'i, zodagonlarning oliy vakili. Normann qabilalarida – harbiy yo'lboshchi\nc) uni ba'zida ioanniylar ordeni ham deyishadi. Musulmonlar Falastinni qayta egallaganidan so'ng orden dastlab Rodos oroliga, bir necha asr o'tib Maltaga ko'chib joylashadi.\nd) erkinlik huquqi\ne) kelt qabilalaridan bo'lib, Britaniyaning asosiy aholisi hisoblangan",["I-d, II-a, III-c, IV-e","I-d, II-a, III-c, IV-b","I-d, II-b, III-e, IV-c","I-e, II-d, III-c, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Graf\nII. Shomonlik\nIII. Markalar\nIV. Autodafe\na) qirol tayinlagan o'z hududlarini qirol nomidan boshqarib, aholidan soliqlarni yig'ib olish, harbiy qo'shinga boshchilik qilish, sud qilish kabi ishlarni bajargan\nb) buyuk Karl o'z davlati chegaralarini mustahkamlash maqsadida … (nemischa, chegara harbiy viloyati) tuzib, ularni markgraflar (nemischa, chegara viloyati hokimi) boshqargan\nc) yovuz va ezgu ruhlarga, ularning inson hayotiga ta'sir ko'rsatishiga ishonish … asosini tashkil etadi\nd) mamlakat barcha hududining yagona qirol hokimiyatiga itoat etishi\ne) portugalcha, e'tiqod yoki din ishi",["I-e, II-c, III-b, IV-d","I-c, II-a, III-d, IV-e","I-d, II-c, III-e, IV-b","I-a, II-c, III-b, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Nemis ordeni\nII. Levant savdo yo'li\nIII. Piktografik yozuv\nIV. Magistrlar\na) qattiq, qatronli (smolali) va tiniq sariq rangli ma'dan\nb) asteklarda (lotincha pictus – rasmli va yunoncha grapho – yozaman, rasmli yozuv) – ma'lumotning umumiy mazmunini rasm orqali yoki rasmlarni ketma-ketligi orqali eslab qolish maqsadida tasvirlash\nc) ispaniya, Italiya, Janubiy Fransiyani dengiz orqali Vizantiya hamda Osiyo mamlakatlari bilan bog'lash uchun\nd) (lotincha Tevton) Muqaddas Bibi Maryamga bag'ishlangan\ne) universitet o'qituvchilari",["I-d, II-e, III-b, IV-a","I-a, II-d, III-b, IV-e","I-d, II-c, III-b, IV-e","I-a, II-c, III-e, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Ritorika\nII. Viloyatlar o'rtasidagi mehnat taqsimoti\nIII. Sinagoga\nIV. Inkvizitsiya\na) (lotincha, «qidiruv») yeretiklarga qarshi kurashish uchun tuziladi\nb) yahudiylar ibodatxonasi\nc) (fransuzcha, mosaique – muzalarga bag'ishlangan) – bir xil yoki turli xomashyo (koshin, tosh, yog'och, marmar va metall) bo'laklaridan ishlangan tasvir, naqshinkor mahobatli (monumental) bezak san'atining asosiy turlaridan\nd) she'r, badiiy asarlar yozishni, notiqlik san'atini, huquq asoslarini o'rgatgan\ne) har bir viloyatning ishlab chiqarishning u yoki bu sohasiga ixtisoslashuvidir",["I-c, II-e, III-d, IV-a","I-e, II-d, III-b, IV-a","I-e, II-b, III-c, IV-a","I-d, II-e, III-b, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Panno\nII. Vassallik\nIII. Brittlar\nIV. Sherif\na) g'arbiy Yevropa mamlakatlarida bir feodalning boshqa feodalga bo'ysunish tartibi\nb) gotika XII asr o'rtalarida Shimoliy Fransiyada yuzaga keldi. XIII asr 1yarmida yuksak darajada rivojlandi\nc) kelt qabilalaridan bo'lib, Britaniyaning asosiy aholisi hisoblangan\nd) XII asrda ipakdan shoyi so'zana – … to'qish ixtiro qilinib, keng tarqalgan.\ne) angilyada mamlakat grafliklarga bo'linib, ularning har biriga qirol vakili tayinlanadi",["I-d, II-a, III-c, IV-e","I-a, II-e, III-c, IV-d","I-a, II-b, III-c, IV-d","I-e, II-b, III-c, IV-d"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Miniatyura\nII. Benefitsiy\nIII. Yeretiklar\nIV. Grek olovi\na) uloqtiriladigan yonuvchi modda bo'lib, uni neft, oltingugurt, selitra, turli qatronlar aralashmasidan tayyorlashgan. Vizantiya harbiy kemalarida foydalanilgan.\nb) (fransuzcha, miniature; lotincha, minium – qizil bo'yoq) – badiiy usullari o'ta nafis bo'lgan kichik hajmli tasviriy san'at asarlari. O'rta asr qo'lyozmalarini ziynatlash uchun yaratilgan nafis, mo'jaz rasmlar\nc) (lotincha) – senyorning o'z vassaliga harbiy xizmati evaziga in'om etgan yer-mulk. Sharqda u iqto' deb nomlangan\nd) gotika XII asr o'rtalarida Shimoliy Fransiyada yuzaga keldi. XIII asr 1yarmida yuksak darajada rivojlandi\ne) (yunoncha, «dahriylar») cherkov va uning ta'limotiga qarshi kishilar",["I-e, II-c, III-b, IV-a","I-b, II-c, III-e, IV-a","I-d, II-b, III-e, IV-a","I-d, II-c, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Talab\nII. Choson\nIII. Suyurg'ol\nIV. Kahrabo\na) (fransuzcha, mosaique – muzalarga bag'ishlangan) – bir xil yoki turli xomashyo (koshin, tosh, yog'och, marmar va metall) bo'laklaridan ishlangan tasvir, naqshinkor mahobatli (monumental) bezak san'atining asosiy turlaridan\nb) (koreyscha, «Tonggi tarovat») ilk koreys davlati\nc) (mo'g'ulcha – in'om, sovg'a) – hukmdor tomonidan davlat oldida alohida xizmat ko'rsatgan yirik amaldorlar yoki sarkardalarga berilgan molmulk, yer-suv. … beriladigan yer nasldan naslga meros bo'lib o'tgan\nd) qattiq, qatronli (smolali) va tiniq sariq rangli ma'dan\ne) mo'g'ullarda aholidan shoshilinch soliq – … ham yig'ilgan",["I-e, II-b, III-a, IV-d","I-c, II-b, III-e, IV-a","I-e, II-b, III-c, IV-d","I-c, II-b, III-a, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. General shtatlar\nII. Faktoriyalar\nIII. Dvoryanlar\nIV. Mayorat tizimi\na) (nomdor zodagonlar) – feodallar toifasining imtiyozli qismi. Imtiyozlar merosiy bo'lgan\nb) o'rta yer dengiz sohillari bo'ylab italiyalik savdogarlar o'zlarining savdo manzilgohlari\nc) (yalpi toifalar) – Fransiyadagi oliy tabaqaviy-vakillik muassasasi\nd) (nemischa – Zeche) so'zi xalfaning ustalikka bag'ishlov ziyofati, keyinchalik bu so'z kasb ustalari uyushmasiga nisbatan qo'llanilgan\ne) oilaning kichik o'g'illari emas, ya'ni meros katta o'g'ilga qoldirilgan",["I-e, II-b, III-c, IV-d","I-d, II-b, III-c, IV-a","I-a, II-b, III-c, IV-e","I-c, II-b, III-a, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tlatoani\nII. Roman uslubi\nIII. Seny an ikkinchi ritsarlik ordeni, Quddusdagi ritsarlar joylashgan tepalik nomi bilan atalgan\nc) (arabcha, itoat, tobelik) – jahonda keng tarqalgan dinlardan biridir. Unga e'tiqod qiluvchilar musulmonlar deb ataladi\nd) mo'g'ullarda XIII asrning o'rtalarida bo'lib, ro'yxatga olishning yakunida mamlakat aholisi «…» deb nomlangan katta to'lovga tortiladi\ne) tilshunoslik ilmi, bolalarni o'qishga o'rgatgan",["I-b, II-c, III-a, IV-e","I-e, II-c, III-a, IV-d","I-b, II-e, III-c, IV-d","I-d, II-c, III-b, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Parlament\nII. Universitetlar\nIII. Patta\nIV. Interdikt\na) («yorliq» yoki «yorliqqa olingan yer») o'z xonadoniga mansub bo'lmagan amaldorlarga rojalar yerni ma'lum muddatga foydalanishga bergan, alohida xizmat ko'rsatgan kishilarni taqdirlash uchun ham foydalanishgan\nb) mamlakatda ibodat va marosimlarning vaqtinchalik taqiqlanishi\nc) fransuzcha parle – «gapirmoq» so'zidan olingan\nd) chingizxon ixtiyorida «…» deb yuritilgan maxsus gvardiya ham tashkil etiladi\ne) (lotincha, universitas – majmua, umumiylik) – fanning turli yo'nalishlarida mutaxassislar tayyorlaydigan oliy o'quv yurtlari",["I-c, II-e, III-a, IV-b","I-b, II-e, III-c, IV-d","I-a, II-d, III-e, IV-b","I-c, II-d, III-a, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Markazlashgan qirol hokimiyati\nII. Ulus\nIII. Birja\nIV. Bosqoqlar\na) (mo'g'ulcha – in'om, sovg'a) – hukmdor tomonidan davlat oldida alohida xizmat ko'rsatgan yirik amaldorlar yoki sarkardalarga berilgan molmulk, yer-suv. … beriladigan yer nasldan naslga meros bo'lib o'tgan\nb) soliq va bojlarning to'lanishini maxsus tayinlangan mo'g'ul noiblari – … nazorat etishgan.\nc) (mo'g'ulcha – davlat, xalq, odamlar) – Chingizxon farzandlariga mulk sifatida bo'lib bergan mo'g'ullar bosib olgan hududlar\nd) mamlakat barcha hududining yagona qirol hokimiyatiga itoat etishi\ne) bryugge shahridagi «Burse» mehmonxon rning har biriga qirol vakili tayinlanadi\nb) davlat ixtiyoridagi yerlar bo'lib, undan olinadigan soliqlar xazinaga tushib, davlat xarajatlari va maxsus qo'shinni ta'minlash uchun ishlatilgan\nc) (fransuzcha, miniature; lotincha, minium – qizil bo'yoq) – badiiy usullari o'ta nafis bo'lgan kichik hajmli tasviriy san'at asarlari. O'rta asr qo'lyozmalarini ziynatlash uchun yaratilgan nafis, mo'jaz rasmlar\nd) o'rta yer dengiz sohillari bo'ylab italiyalik savdogarlar o'zlarining savdo manzilgohlari\ne) uni ba'zida ioanniylar ordeni ham deyishadi. Musulmonlar Falastinni qayta egallaganidan so'ng orden dastlab Rodos oroliga, bir necha asr o'tib Maltaga ko'chib joylashadi.",["I-b, II-c, III-e, IV-a","I-b, II-a, III-d, IV-e","I-b, II-a, III-e, IV-c","I-d, II-a, III-b, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Panno\nII. Bosqoqlar\nIII. Gotika uslubi\nIV. Grek olovi\na) uloqtiriladigan yonuvchi modda bo'lib, uni neft, oltingugurt, selitra, turli qatronlar aralashmasidan tayyorlashgan. Vizantiya harbiy kemalarida foydalanilgan.\nb) gotika XII asr o'rtalarida Shimoliy Fransiyada yuzaga keldi. XIII asr 1yarmida yuksak darajada rivojlandi\nc) fransuzcha parle – «gapirmoq» so'zidan olingan\nd) soliq va bojlarning to'lanishini maxsus tayinlangan mo'g'ul noiblari – … nazorat etishgan.\ne) XII asrda ipakdan shoyi so'zana – … to'qish ixtiro qilinib, keng tarqalgan.",["I-b, II-d, III-e, IV-c","I-a, II-d, III-e, IV-c","I-e, II-a, III-c, IV-d","I-e, II-d, III-b, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Talab\nII. Chiqim\nIII. Interdikt\nIV. Markazlashgan qirol hokimiyati\na) mo'g'ullarda XIII asrning o'rtalarida bo'lib, ro'yxatga olishning yakunida mamlakat aholisi «…» deb nomlangan katta to'lovga tortiladi\nb) mo'g'ullarda aholidan shoshilinch soliq – … ham yig'ilgan\nc) mahsulotlarni bozorda sotish yoki ayirboshlash uchun ishlab chiqaruvchi xo'jalikdir\nd) mamlakatda ibodat va marosimlarning vaqtinchalik taqiqlanishi\ne) mamlakat barcha hududining yagona qirol hokimiyatiga itoat etishi",["I-e, II-a, III-b, IV-c","I-b, II-a, III-d, IV-e","I-c, II-a, III-e, IV-b","I-c, II-d, III-b, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Faktoriyalar\nII. Konung\nIII. Kollegiya\nIV. Dialektika\na) (yalpi toifalar) – Fransiyadagi oliy tabaqaviy-vakillik muassasasi\nb) hozirgi mantiqqa o'xshash fan bo'lib, unda o'quvchilar munozara olib borishga, o'z fikrini isbotlashga o'rgatilgan\nc) omadli talabalar hozirgi yotoqxonalarga o'xshash … joylashishga muvaffaq bo'lishgan\nd) qabila boshlig'i, zodagonlarning oliy vakili. Normann qabilalarida – harbiy yo'lboshchi\ne) o'rta yer dengiz sohillari bo'ylab italiyalik savdogarlar o'zlarining savdo manzilgohlari",["I-b, II-d, III-e, IV-a","I-b, II-d, III-a, IV-c","I-e, II-d, III-c, IV-b","I-e, II-c, III-b, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Allod\nII. Autodafe\nIII. Sherif\nIV. Beklarbegi\na) erkinlik huquqi\nb) (yunoncha) – yerga to'la egalik qilish; G'arbiy Yevropa feodal jamiyatida avloddan-avlodga meros bo'lib o'tadigan yer-mulk\nc) oltin O'rdada ijro hokimiyati boshlig'i, Oltin O'rda qo'shinini … boshqargan. U ko'chmanchilar zodagonlari yetakchisi hisoblanib, ba'zida xondan ham ko'proq mavqega erishgan\nd) angilyada mamlakat grafliklarga bo'linib, ularning har biriga qirol vakili tayinlanadi\ne) portugalcha, e'tiqod yoki din ishi",["I-b, II-e, III-d, IV-c","I-b, II-d, III-c, IV-a","I-b, II-c, III-e, IV-d","I-e, II-a, III-d, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. General shtatlar\nII. Yarmarka\nIII. Faktoriyalar\nIV. Yeretiklar\na) o'rta yer dengiz sohillari bo'ylab italiyalik savdogarlar o'zlarining savdo manzilgohlari\nb) (yalpi toifalar) – Fransiyadagi oliy tabaqaviy-vakillik muassasasi\nc) buyuk Karl o'z davlati chegaralarini mustahkamlash maqsadida … (nemischa, chegara harbiy viloyati) tuzib, ularni markgraflar (nemischa, chegara viloyati hokimi) boshqargan\nd) ulgurji savdo bo'ladigan, turli mamlakat savdogarlari qatnashadigan, mol sotish va ayirboshlash joyi nomi bo'lgan\ne) (yunoncha, «dahriylar») cherkov va uning ta'limotiga qarshi kishilar",["I-e, II-d, III-b, IV-c","I-e, II-c, III-a, IV-b","I-b, II-d, III-a, IV-e","I-e, II-d, III-a, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Yarmarka\nII. Shimoliysavdo yo'li\nIII. Konung\nIV. Choson\na) qabila boshlig'i, zodagonlarning oliy vakili. Normann qabilalarida – harbiy yo'lboshchi\nb) o'rta yer dengiz sohillari bo'ylab italiyalik savdogarlar o'zlarining savdo manzilgohlari\nc) (koreyscha, «Tonggi tarovat») ilk koreys davlati\nd) ulgurji savdo bo'ladigan, turli mamlakat savdogarlari qatnashadigan, mol sotish va ayirboshlash joyi nomi bo'lgan\ne) shimolda Boltiq dengizi orqali London, Bryugge, Lyubek, Novgorod shaharlarini o'zaro bog'lash uchun",["I-d, II-b, III-e, IV-c","I-d, II-b, III-c, IV-a","I-d, II-e, III-a, IV-c","I-c, II-e, III-d, IV-b"],2]]],["8-sinf Jahon tarixi atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dofin\nII. Statir (ayrim manbalarda stater)\nIII. Rekonkista\nIV. Seym\na) O'rta asrlarda Chexiya va Polsha davlatlarida vakillik yig'inlari parlament shunday atalgan.\nb) Antik davrda pul birligi.\nc) XIV asrdan boshlab qirolning avlodidan bo'lgan taxt vo risi, rasman taxtga chiqish uchun toj kiyish marosimi o'tkazilgunga qadar vaqtinchalik qirol.\nd) Misrda asosan kavkazlik va turkiy xalqlar vakillaridan iborat o'smir qullardan tashkil qilingan harbiylar qatlami.\ne) Pireney yarimorolining arablardan qaytarib olinishi jarayoni tarixga shunday nom bilan kirgan. … VIII–XV asr larda davom etgan.",["I-c, II-e, III-a, IV-b","I-d, II-b, III-a, IV-c","I-c, II-b, III-e, IV-a","I-a, II-d, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Akr\nII. Suyurg'ol\nIII. Mashikuli\nIV. Irq\na) Qal'a devori va minoralarining yuqori qismida joylash gan, asosan vertikal o'q otish uchun mo'ljallangan ilmoqli bo'shliqdan iborat mudofaa inshooti.\nb) Germaniyada qirolni saylash vakolatiga ega bo'lgan 7 nafar imperiya knyazlari shunday nomlangan.\nc) (mo'g'ulcha – in'om, sovg'a) – oliy hukmdor tomo nidan harbiy yurishlar va tinch vaqtlarda davlat oldidagi muhim xizmatlari uchun mansabdor va qo'shin qo'mondonlariga sovg'a tariqasida in'om etilgan yersuv hamda molmulk.\nd) Yer o'lchov birligi. 1 akr 40 sotixga teng yer maydoni. O'rta asrlarda akr dastlab bir dehqonning bir ho'kiz bilan bir kunda hay dashi mumkin bo'lgan va ekin ekilgan yer maydonini bildirgan.\ne) Kishilarning tashqi qiyofasi, gavdasi, nasli, kelib chiqishi kabi irsiy belgilar orqali farq qiluvchi guruhi. Hozirda dunyo aholisi negroid, avstraloid, yevropeoid, mongoloid kabi to'rtta yirik irqqa bo'linadi.",["I-d, II-e, III-c, IV-b","I-d, II-c, III-a, IV-e","I-b, II-e, III-a, IV-d","I-d, II-c, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tayfun\nII. Doj\nIII. Dukat\nIV. Hindu\na) Qadimgi slavyan tilidan olingan bo'lib, kengash ma'nosini bildiradi. … X–XVI asrlarda slavyan davlatlarida xalq yig'ini vazi fasini bajargan.\nb) Dengizda katta to'lqinlarni yuzaga keltiruvchi kuchli shamol.\nc) (italyancha “ducato” – gersog ma'nosini bildiradi) – oltin va ku mush tangalar bo'lib, Italiya davlatlarining pul birligidir.\nd) (yunon tilida rahbar, graf ma'nosini bildiradi) – VIII–XVIII asrlarda Venetsiya respublikasining saylangan rahbari. Bu vaqtda Venetsiyada 120 ta dojlar rahbarlik qilishgan.\ne) Amerika tub aholisining umumiy nomi.",["I-c, II-d, III-b, IV-a","I-b, II-a, III-e, IV-d","I-b, II-c, III-e, IV-a","I-b, II-d, III-c, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kurfyurst\nII. Parlament\nIII. Pens yoki penni\nIV. Pekin shahri\na) Fransuz tilidan olingan bo'lib, gapirmoq, so'zlamoq ma'nosini bildiradi.\nb) (mo'g'ulcha – in'om, sovg'a) – oliy hukmdor tomo nidan harbiy yurishlar va tinch vaqtlarda davlat oldidagi muhim xizmatlari uchun mansabdor va qo'shin qo'mondonlariga sovg'a tariqasida in'om etilgan yersuv hamda molmulk.\nc) Angliyada pul birligi hisoblanib, asosan mayda tanga pullarga nisbatan ishlatilgan.\nd) mo'g'ullar bosqiniga qadar Xitoy shimolidagi Szin davlatining poytaxti bo'lib, bu davrda u Dasin (Chjundu) deb nomlangan.\ne) Germaniyada qirolni saylash vakolatiga ega bo'lgan 7 nafar imperiya knyazlari shunday nomlangan.",["I-a, II-e, III-c, IV-b","I-d, II-a, III-b, IV-e","I-e, II-a, III-c, IV-d","I-e, II-a, III-b, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Lord\nII. Mutlaq monarxiya\nIII. Barbakan\nIV. Bank\na) (ital. …) – sarrof peshtaxtasi, sarroflar almashish uchun tangalarni terib qo'yadigan stol.\nb) Misrda asosan kavkazlik va turkiy xalqlar vakillaridan iborat o'smir qullardan tashkil qilingan harbiylar qatlami.\nc) O'rta asrlarda G'arbiy Yevropada yirik mulkdorlar, zodagon lar, gersog va graflarga nisbatan hurmat ma'nosida ishlatilgan.\nd) Bu qal'a devoridan biroz bo'rtib chiqqan dumaloq shakl dagi minora bo'lib, qal'ani qurshab olgan dushmanga qarata har tomonlama o'q otishni ta'minlagan mudofaa inshooti.\ne) Davlatda hukmdorning yakka boshqaruv shakli. Bunda monarx cheklanmagan hokimiyat va vakolatlarga ega bo'ladi.",["I-c, II-e, III-a, IV-d","I-b, II-e, III-d, IV-c","I-e, II-a, III-d, IV-c","I-c, II-e, III-d, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Mansa\nII. Xartiya\nIII. Palam\nIV. Veksel\na) Amerika tub aholisining umumiy nomi.\nb) Lotincha so'zdan olingan bo'lib, qog'oz, yorliq ma'nosini bildiradi. U o'rta asrlarda ijtimoiysiyosiy, huquqiy ahamiyatga ega bo'l gan, jamiyatning ma'lum bir huquqlarini ifodalagan hujjatni anglatadi.\nc) (nemischa, almashtirish) – o'rta asrlarda valyuta ayirbosh lash jarayonida savdogar sarrofga ma'lum miqdordagi pulni topshir ganidan so'ng unga shu miqdordagi mablag'ni boshqa joydan olish uchun berilgan yozma hujjat.\nd) Mali hukmdorlarining unvoni bo'lib, hokimiyat boshqaru vining siyosiy va diniy jihatlarini birlashtirgan oliy maqom shunday nomlangan.\ne) Dehli yaqinidagi hozirgi markaziy aeroport joylashgan joy.",["I-a, II-b, III-d, IV-e","I-b, II-d, III-a, IV-c","I-d, II-b, III-e, IV-c","I-b, II-d, III-e, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Pan\nII. Sinyoriya\nIII. Yomen\nIV. Mamluk\na) Chexiya va Polsha davlatlarida feodal, yer egasi, xo'jayin, janob ma'nolarini bildiradi.\nb) (ispancha – bosqinchi) – Markaziy va Janubiy Amerika ni zabt etishga kirishgan ispan va portugal bosqinchilari.\nc) Angliyada ingliz dehqonlarining asosiy qismini tashkil qilgan erkin hisoblangan kichik yer egalari. Ular zodagonlardan farqli ravishda yerga ishlov berish bilan mustaqil shug'ullanishgan.\nd) Misrda asosan kavkazlik va turkiy xalqlar vakillaridan iborat o'smir qullardan tashkil qilingan harbiylar qatlami.\ne) XIII–XIV asrlarda Italiya shahardavlatlarida hokimiyat bosh qaruvi tizimi va idorasi.",["I-d, II-e, III-a, IV-c","I-a, II-d, III-b, IV-c","I-a, II-e, III-c, IV-d","I-b, II-e, III-a, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Angliya\nII. Rum eli (Rumeliya)\nIII. Sobor\nIV. Konkistador\na) Angliyada pul birligi hisoblanib, asosan mayda tanga pullarga nisbatan ishlatilgan.\nb) XIV–XV asrlarda Usmoniy turklar imperiyasi to monidan Bolqon yarimorolidagi bosib olingan yerlarning umumiy nomi.\nc) Xristianlikda oliy martabali ruhoniylar boshchilik qiladigan yirik ibodatxona.\nd) Qadimgi ingliz tilidagi “Eng land” so'zidan olingan bo'lib, “angllar yeri” ma'nosini bildiradi.\ne) (ispancha – bosqinchi) – Markaziy va Janubiy ofaa inshooti.",["I-e, II-a, III-b, IV-d","I-c, II-a, III-d, IV-b","I-c, II-d, III-b, IV-e","I-c, II-d, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Yomen\nII. Parlament\nIII. Mansa\nIV. “Oltin O'rda”\na) Mali hukmdorlarining unvoni bo'lib, hokimiyat boshqaru vining siyosiy va diniy jihatlarini birlashtirgan oliy maqom shunday nomlangan.\nb) “O'rda” atamasi qarorgoh, chodir ma'nosini anglatib, Oltin O'rda xon larining qarorgohi yoki chodiriga nisbatan ishlatilgan.\nc) Fransuz tilidan olingan bo'lib, gapirmoq, so'zlamoq ma'nosini bildiradi.\nd) Angliyada ingliz dehqonlarining asosiy qismini tashkil qilgan erkin hisoblangan kichik yer egalari. Ular zodagonlardan farqli ravishda yerga ishlov berish bilan mustaqil shug'ullanishgan.\ne) Bu qal'a devoridan biroz bo'rtib chiqqan dumaloq shakl dagi minora bo'lib, qal'ani qurshab olgan dushmanga qarata har tomonlama o'q otishni ta'minlagan mudofaa inshooti.",["I-e, II-b, III-a, IV-d","I-d, II-e, III-b, IV-c","I-d, II-c, III-a, IV-b","I-d, II-e, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dofin\nII. Rum eli (Rumeliya)\nIII. Hindu\nIV. Xartiya\na) XIV–XV asrlarda Usmoniy turklar imperiyasi to monidan Bolqon yarimorolidagi bosib olingan yerlarning umumiy nomi.\nb) XIV asrdan boshlab qirolning avlodidan bo'lgan taxt vo risi, rasman taxtga chiqish uchun toj kiyish marosimi o'tkazilgunga qadar vaqtinchalik qirol.\nc) Amerika tub aholisining umumiy nomi.\nd) Yer o'lchov birligi. 1 akr 40 sotixga teng yer maydoni. O'rta asrlarda akr dastlab bir dehqonning bir ho'kiz bilan bir kunda hay dashi mumkin bo'lgan va ekin ekilgan yer maydonini bildirgan.\ne) Lotincha so'zdan olingan bo'lib, qog'oz, yorliq ma'nosini bildiradi. U o'rta asrlarda ijtimoiysiyosiy, huquqiy ahamiyatga ega bo'l gan, jamiyatning ma'lum bir huquqlarini ifodalagan hujjatni anglatadi.",["I-b, II-c, III-e, IV-d","I-b, II-a, III-c, IV-e","I-b, II-e, III-d, IV-c","I-b, II-a, III-e, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Mansa\nII. Hindu\nIII. Veche\nIV. Mamluk\na) Qadimgi slavyan tilidan olingan bo'lib, kengash ma'nosini bildiradi. … X–XVI asrlarda slavyan davlatlarida xalq yig'ini vazi fasini bajargan.\nb) (ital. …) – sarrof peshtaxtasi, sarroflar almashish uchun tangalarni terib qo'yadigan stol.\nc) Amerika tub aholisining umumiy nomi.\nd) Misrda asosan kavkazlik va turkiy xalqlar vakillaridan iborat o'smir qullardan tashkil qilingan harbiylar qatlami.\ne) Mali hukmdorlarining unvoni bo'lib, hokimiyat boshqaru vining siyosiy va diniy jihatlarini birlashtirgan oliy maqom shunday nomlangan.",["I-a, II-b, III-e, IV-d","I-e, II-b, III-d, IV-c","I-e, II-c, III-a, IV-d","I-c, II-d, III-a, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Pan\nII. Dukat\nIII. Kortes\nIV. Yomen\na) Ispan tilida o'rin, joy ma'nosini bildiradi. O'rta asrlarda Ispaniyada vakillik yig'inlari shunday nomlangan. Birinchi … 1137yilda Kastiliyada paydo bo'lgan.\nb) (italyancha “ducato” – gersog ma'nosini bildiradi) – oltin va ku mush tangalar bo'lib, Italiya davlatlarining pul birligidir.\nc) Kishilarning tashqi qiyofasi, gavdasi, nasli, kelib chiqishi kabi irsiy belgilar orqali farq qiluvchi guruhi. Hozirda dunyo aholisi negroid, avstraloid, yevropeoid, mongoloid kabi to'rtta yirik irqqa bo'linadi.\nd) Chexiya va Polsha davlatlarida feodal, yer egasi, xo'jayin, janob ma'nolarini bildiradi.\ne) Angliyada ingliz dehqonlarining asosiy qismini tashkil qilgan erkin hisoblangan kichik yer egalari. Ular zodagonlardan farqli ravishda yerga ishlov berish bilan mustaqil shug'ullanishgan.",["I-d, II-e, III-c, IV-a","I-d, II-e, III-b, IV-c","I-e, II-d, III-a, IV-c","I-d, II-b, III-a, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Statir (ayrim manbalarda stater)\nII. Lord\nIII. Hindu\nIV. Kortes\na) O'rta asrlarda G'arbiy Yevropada yirik mulkdorlar, zodagon lar, gersog va graflarga nisbatan hurmat ma'nosida ishlatilgan.\nb) Amerika tub aholisining umumiy nomi.\nc) “O'rda” atamasi qarorgoh, chodir ma'nosini anglatib, Oltin O'rda xon larining qarorgohi yoki chodiriga nisbatan ishlatilgan.\nd) Antik davrda pul birligi.\ne) Ispan tilida o'rin, joy ma'nosini bildiradi. O'rta asrlarda Ispaniyada vakillik yig'inlari shunday nomlangan. Birinchi … 1137yilda Kastiliyada paydo bo'lgan.",["I-d, II-c, III-a, IV-e","I-c, II-b, III-d, IV-e","I-d, II-a, III-b, IV-e","I-d, II-a, III-c, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tayfun\nII. Mutlaq monarxiya\nIII. Rum eli (Rumeliya)\nIV. Bank\na) XIV–XV asrlarda Usmoniy turklar imperiyasi to monidan Bolqon yarimorolidagi bosib olingan yerlarning umumiy nomi.\nb) Dengizda katta to'lqinlarni yuzaga keltiruvchi kuchli shamol.\nc) Davlatda hukmdorning yakka boshqaruv shakli. Bunda monarx cheklanmagan hokimiyat va vakolatlarga ega bo'ladi.\nd) Bu qal'a devoridan biroz bo'rtib chiqqan dumaloq shakl dagi minora bo'lib, qal'ani qurshab olgan dushmanga qarata har tomonlama o'q otishni ta'minlagan mudofaa inshooti.\ne) (ital. …) – sarrof peshtaxtasi, sarroflar almashish uchun tangalarni terib qo'yadigan stol.",["I-b, II-a, III-c, IV-e","I-b, II-c, III-a, IV-e","I-b, II-e, III-d, IV-c","I-d, II-b, III-a, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Seym\nII. Tayfun\nIII. Rum eli (Rumeliya)\nIV. Pens yoki penni\na) “O'rda” atamasi qarorgoh, chodir ma'nosini anglatib, Oltin O'rda xon larining qarorgohi yoki chodiriga nisbatan ishlatilgan.\nb) XIV–XV asrlarda Usmoniy turklar imperiyasi to monidan Bolqon yarimorolidagi bosib olingan yerlarning umumiy nomi.\nc) Dengizda katta to'lqinlarni yuzaga keltiruvchi kuchli shamol.\nd) O'rta asrlarda Chexiya va Polsha davlatlarida vakillik yig'inlari parlament shunday atalgan.\ne) Angliyada pul birligi hisoblanib, asosan mayda tanga pullarga nisbatan ishlatilgan.",["I-d, II-c, III-b, IV-e","I-a, II-d, III-b, IV-c","I-b, II-d, III-c, IV-e","I-c, II-e, III-b, IV-a"],0]]],["8-sinf O'zbekiston tarixi atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Shulen\nII. Xolisa\nIII. Mamluklar\nIV. Ustoz\na) Boshlang'ich maktablar; arabcha «kataba» (yozmoq) fe'lidan olingan.\nb) Davlat xazinasi uchun yig'iladigan oziq-ovqat solig'i: har bir podadan ikki yashar qo'y, qimiz uchun har ming oydan bir biya.\nc) Jangchi qullar; 10 ming kishilik tansoqchilar (xaros) qismini tashkil etgan.\nd) Peshtoq-u ravoq va toqlarga parchin hamda girihlar qoplab, imoratga pardoz beruvchilar.\ne) Davlat daromadlari va yerlari bilan shug'ullanuvchi oliy mansabdorlardan iborat hay'at; soliqlardan ozod davlat yerlari.",["I-d, II-e, III-a, IV-c","I-e, II-d, III-c, IV-a","I-b, II-e, III-a, IV-c","I-b, II-e, III-c, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Begor\nII. Renesans\nIII. Kepaki\nIV. Dabbobat\na) Fransuzcha «qayta tug'ilish», «uyg'onish».\nb) Shariat talablariga asoslanib ish yurituvchi sudya.\nc) Kebekxon pullari; rus «kopeyka» nomi shu so'zning buzilgan shaklidir.\nd) Mahalliy aholiga yuklatilgan saroy, jamoat binolari, mudofaa va sug'orish inshootlari hamda yo'l qurilishida ommaviy ishlab berish majburiyati (hashar).\ne) Qamal mashinalari.",["I-d, II-a, III-e, IV-c","I-d, II-a, III-c, IV-e","I-a, II-d, III-b, IV-e","I-b, II-d, III-a, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Mulki devon\nII. Naqshi jahon\nIII. Qo'rchilar\nIV. Muhtasiblar\na) (arabcha, nazorat qiluvchilar) diniy marosimlar, urf-odatlar va shariat qonunlarining bajarilishi ustidan nazorat olib borganlar.\nb) Samarqand rasadxonasining xalq orasidagi nomi: ichida yer kurrasi va koinot tasvirlangan.\nc) Shahar ichida aholini qo'riqlab turgan posbonlar.\nd) Askarlarni jamlash, safar tartibini nazorat qilish va lashkargohga yetkazishni ta'minlagan shaxslar.\ne) Davlat tasarrufidagi, hukmdor va noiblarga qarashli yer.",["I-d, II-a, III-c, IV-e","I-a, II-e, III-c, IV-d","I-e, II-b, III-c, IV-a","I-a, II-b, III-c, IV-e"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Arzbegi\nII. Ahdos qozisi\nIII. Barot\nIV. Puryovaliy\na) Pahlavonlar boshlig'i nomi; po'stindo'z va telpakdo'z hunarmand pahlavon shunday nomlangan.\nb) Odat huquqi asosida ish ko'ruvchi sudya.\nc) Sipoh, raiyat arizasi va shikoyatlari hamda mamlakat obodonchiligini nazorat qilgan amaldor.\nd) Soliqlarni avvaldan bir yo'la yig'ib olish tartibi: soliqlar xonlar va ularning vakillari tomonidan ijara tarzida oldindan yig'ilib, markazga yuborilgan.\ne) «Mardlar shahri» deb yuritilgan shahar (Termiz).",["I-e, II-d, III-b, IV-a","I-d, II-c, III-b, IV-a","I-c, II-b, III-d, IV-a","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xiroj\nII. Miniatyura\nIII. Hazora\nIV. Devonbegi\na) Minglik bo'linma; uni mirihazora boshqargan.\nb) Yettita vazir unga bo'ysungan; muhim moliyaviy ishlarni vazirlar bilan birgalikda boshqargan va ularni nazorat qilgan amaldor.\nc) Nafis uslubda yaratiladigan kichik hajmli tasviriy san'at namunasi.\nd) Chingiz o'z farmoyishlaridan tuzgan kitob.\ne) Daryo va buloq suvlari bilan sug'oriladigan obikor yerlardan hosilning uchdan bir qismi (33%) miqdorida olingan soliq.",["I-e, II-a, III-c, IV-d","I-e, II-a, III-d, IV-c","I-e, II-c, III-a, IV-b","I-d, II-e, III-c, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sari shumoy (Jizya)\nII. Muftiy\nIII. Katapulta (manjaniq)\nIV. Jannat ad-dunyo\na) Harbiy yurishlar davrida mag'lub etilgan aholidan olingan soliq.\nb) Qozilarga barcha ishlar bo'yicha xulosa bergan shaxs.\nc) Tosh irg'ituvchi qamal quroli.\nd) Samarqand shahriga berilgan unvon («Dunyoning jannati»).\ne) Fransuzcha «qayta tug'ilish», «uyg'onish».",["I-e, II-b, III-d, IV-a","I-d, II-b, III-c, IV-a","I-a, II-b, III-c, IV-d","I-a, II-c, III-d, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Zakot\nII. Qorovul\nIII. Kattoblar\nIV. Ayl\na) Boshlang'ich maktablar; arabcha «kataba» (yozmoq) fe'lidan olingan.\nb) Fransuzcha «qayta tug'ilish», «uyg'onish».\nc) Jang oldida dastlab jangga kirgan razvedkachi suvoriylar.\nd) O'nlik bo'linma; uni aylboshi boshqargan.\ne) Chorva mollaridan qirqdan bir, ya'ni 2,5% miqdorida olingan soliq.",["I-a, II-c, III-b, IV-e","I-e, II-b, III-a, IV-d","I-c, II-e, III-a, IV-b","I-e, II-c, III-a, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Fulus\nII. Mataris\nIII. Savqul jaysh\nIV. Madrasa\na) Temur o'zini zaif ko'rsatib, dushmanni jangga tortgan harbiy hiyla.\nb) Qadimgi va o'rta asrlarda turkiylarda elchi, xabarchilarga nisbatan ishlatilgan atama.\nc) Odimlovchi minoralar.\nd) Misdan yasalgan mayda chaqa pul.\ne) Arabcha «darasa»dan olingan bo'lib, dars oladigan joy mazmunini anglatgan.",["I-b, II-d, III-c, IV-e","I-c, II-a, III-d, IV-e","I-d, II-e, III-b, IV-a","I-d, II-c, III-a, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Qopchur\nII. Qoraunas\nIII. Manglay\nIV. Banno\na) G'isht terib imorat qaddini bino qiluvchilar.\nb) Mo'g'ullar kelib chiqishi aralash (asl mo'g'ul bo'lmagan) odamlarni shunday atashgan (aralashgan, duragay).\nc) Qanot qismlaridan so'ng jangga kirgan asosiy ilg'or qism.\nd) Chorvadorlardan olinadigan, chorva mollari bosh sonining 2,5% miqdorida olinadigan soliq.\ne) Odat huquqi asosida ish ko'ruvchi sudya.",["I-a, II-b, III-c, IV-e","I-c, II-d, III-e, IV-a","I-d, II-b, III-c, IV-a","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Ushr\nII. Arg'ay o't\nIII. Yalavoch\nIV. Tuman\na) Arabcha «darasa»dan olingan bo'lib, dars oladigan joy mazmunini anglatgan.\nb) Mulk yerlarining bir qismidan hosilning o'ndan bir qismi (10%) miqdorida olingan soliq.\nc) Ulug'bek qo'llagan, qo'shinni ko'paytirib ko'rsatgan harbiy usul.\nd) O'n minglik askariy birikma; uni tuman og'asi boshqargan.\ne) Qadimgi va o'rta asrlarda turkiylarda elchi, xabarchilarga nisbatan ishlatilgan atama.",["I-d, II-c, III-b, IV-e","I-b, II-c, III-e, IV-d","I-d, II-c, III-a, IV-b","I-b, II-e, III-d, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tunkal\nII. Kalon\nIII. Mulk\nIV. Arkbegi\na) Devonbegi yonida turli rasmiy marosimlarni uyushtirgan va o'tkazgan amaldor.\nb) Yurish oldidan e'lon qilingan, qo'shin to'plashga qaratilgan maxsus farmon.\nc) Xususiy yerlar.\nd) Jangchi qullar; 10 ming kishilik tansoqchilar (xaros) qismini tashkil etgan.\ne) Ziroatchilardan olinadigan yer solig'i, hosilning 1/10 qismi hajmida olinadigan soliq.",["I-c, II-d, III-b, IV-a","I-d, II-c, III-b, IV-a","I-b, II-a, III-d, IV-c","I-b, II-e, III-c, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Avorizot\nII. Tavochilar\nIII. Jete\nIV. Sarbadorlar\na) Davlat xavf ostida qolib, harbiy safarbarlik e'lon qilingan paytlarda olingan favqulodda soliq.\nb) (qaroqchi, talonchi) Movarounnahrdagi mo'g'ullar Sharqiy Turkiston va Yettisuvda yashovchi mo'g'ullarni shunday atashgan.\nc) Yettita vazir unga bo'ysungan; muhim moliyaviy ishlarni vazirlar bilan birgalikda boshqargan va ularni nazorat qilgan amaldor.\nd) «Boshini dorga tikkanlar».\ne) Askarlarni jamlash, safar tartibini nazorat qilish va lashkargohga yetkazishni ta'minlagan shaxslar.",["I-a, II-e, III-b, IV-d","I-d, II-c, III-b, IV-e","I-a, II-b, III-c, IV-e","I-a, II-d, III-b, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kadivar\nII. Jamoluqot\nIII. Adolat devoni\nIV. Hisor\na) Zodagonlar yerl orat qilish va lashkargohga yetkazishni ta'minlagan shaxslar.\ne) «Mardlar shahri» deb yuritilgan shahar (Termiz).",["I-a, II-d, III-b, IV-c","I-a, II-e, III-c, IV-b","I-b, II-a, III-c, IV-e","I-c, II-a, III-e, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Jamoluqot\nII. Zakot\nIII. Yalavoch\nIV. Xolisa\na) Chorva mollaridan qirqdan bir, ya'ni 2,5% miqdorida olingan soliq.\nb) Davlat daromadlari va yerlari bilan shug'ullanuvchi oliy mansabdorlardan iborat hay'at; soliqlardan ozod davlat yerlari.\nc) Qadimgi va o'rta asrlarda turkiylarda elchi, xabarchilarga nisbatan ishlatilgan atama.\nd) Devorteshar mashinalar.\ne) Askarlarni jamlash, safar tartibini nazorat qilish va lashkargohga yetkazishni ta'minlagan shaxslar.",["I-b, II-a, III-d, IV-e","I-d, II-a, III-c, IV-b","I-a, II-e, III-c, IV-d","I-e, II-d, III-c, IV-b"],1]]],["9-sinf O'zbekiston tarixi atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tabarzin\nII. Tanobona\nIII. Tim (fors-toj.)\nIV. Registon\na) Haram xodimlari boshlig'i.\nb) «Qumloq joy» degan ma'noni anglatadi.\nc) Usti yopiq bozor, savdo rastasining baland tomi, gumbazi.\nd) Uzun dastali jang boltasi.\ne) Tanob puli va alaf pulining yagona nomi.",["I-d, II-b, III-c, IV-a","I-d, II-a, III-b, IV-c","I-a, II-e, III-c, IV-d","I-d, II-e, III-c, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Udaychi\nII. Xon yasovuli\nIII. Qozon (xo'jalik) solig'i\nIV. Qushbegi (Mang'itlar)\na) Harbiy xavf paytida xalqdan undirilgan soliq.\nb) Tungi qo'riqlash boshlig'i.\nc) Oliy hukmdor bilan shahzodalar o'rtasidagi aloqalarni yo'lga qo'ygan amaldor.\nd) Bosh vazir; oliy hukmdordan keyingi ikkinchi shaxs; poytaxt va viloyat hokimi ham sanalgan.\ne) Harbiy harakatlarda harbiylarni turiga qarab taqsimlovchi.",["I-a, II-c, III-d, IV-b","I-e, II-c, III-a, IV-d","I-e, II-a, III-c, IV-b","I-d, II-b, III-a, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Chorsu\nII. Beklarbegi\nIII. Devonbegi (Qo'qon)\nIV. Otaliq (Mang'itlar)\na) Harbiy vazir.\nb) Fors tilidan «to'rtta yo'l».\nc) Shahzodalar tarbiyasiga mas'ul; Samarqand–Buxoro oralig'idagi sug'orish ishlariga ham javobgar.\nd) 1831-yilda Muhammad Alixon Toshkent hokimiga bergan unvon.\ne) Xazina daromadi va sarfi, iqtisodiy masalalar uchun mas'ul.",["I-b, II-d, III-c, IV-e","I-a, II-c, III-e, IV-b","I-b, II-d, III-e, IV-c","I-c, II-b, III-e, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Qushbegi (Xiva)\nII. Lashkar to'pchiboshi\nIII. Otaliq\nIV. Dodxoh\na) Harbiy vazir.\nb) Soliqlar yig'imi, moliya va qo'shinning shay turishiga javobgar amaldor.\nc) Shahzodalar tarbiyasiga mas'ul amaldor; mahalliy boshqaruvda ham muhim rol o'ynagan.\nd) Qoraqalpoqlar yashagan o'tov; mahalliy aholi shunday atagan.\ne) Aholining arz-dodi va iltimoslarini qabul qilib javob qaytaruvchi, adolat tartiblariga rioya qilinishini nazorat qiluvchi amaldor; elchilarni qabul qilgan.",["I-b, II-a, III-c, IV-e","I-d, II-a, III-e, IV-c","I-c, II-a, III-d, IV-e","I-a, II-b, III-d, IV-e"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Nomuntazam qo'shin\nII. Devonbegi\nIII. Mirshab\nIV. Mingboshi\na) Bosh vazir; mamlakat moliyasi, soliq, yer-suv va mansabga tayinlash haqida xonga har kuni hisobot bergan.\nb) Qilquyruq, qora qozon, qora chechak, qoracherik; urush paytida yig'iladigan ko'ngilli lashkarlar.\nc) Aholining arz-dodi va iltimoslarini qabul qilib javob qaytaruvchi, adolat tartiblariga rioya qilinishini nazorat qiluvchi amaldor; elchilarni qabul qilgan.\nd) Umarxon davrida qushbegi o'rniga joriy etilgan bosh vazir lavozimi; lashkarboshilik vakolatiga ega.\ne) Tungi qo'riqlash boshlig'i.",["I-b, II-a, III-d, IV-c","I-b, II-a, III-e, IV-d","I-b, II-e, III-d, IV-c","I-c, II-b, III-a, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Jung'or (Oyrat)\nII. Devoni sarkorixossa\nIII. Ko'kaldosh\nIV. Suyurg'ol, tiul, iqto, tanho\na) Hukmdor sulolaning biror vakili bilan bir onani emgan, sulolaga eng yaqin shaxs.\nb) Hukmron sulolaga tegishli yer-suv, mol-mulk va soliq ishlarini yurituvchi maxsus tuzilma.\nc) Davlat yerlari amaldorlarga tortiq etiladigan yer berish shakllari.\nd) Eng kichik mis tanga.\ne) 1635-yilda Ili vodiysida tashkil topgan, 1758-yilda Xitoy tugatgan davlat.",["I-e, II-b, III-a, IV-c","I-d, II-b, III-a, IV-c","I-e, II-a, III-b, IV-c","I-c, II-b, III-e, IV-d"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Halqali ko'ylak\nII. Tog'ar\nIII. Eshik og'asi\nIV. Pul\na) Saroy xavfsizligi, tartibi va keldi-ketdidan xabardorlik uchun mas'ul.\nb) Eng kichik mis tanga.\nc) Qo'shin ta'minoti uchun undirilgan oziq-ovqat solig'i.\nd) Qurol-aslahaga mas'ul.\ne) Ola shoyidan tikilib, qo'shaloq chillak kashtali bayram ko'ylagi.",["I-b, II-e, III-a, IV-d","I-e, II-c, III-a, IV-b","I-d, II-e, III-c, IV-b","I-e, II-c, III-d, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xiroj (mol)\nII. Kichik o'roq\nIII. Ashrafiy\nIV. Shayxulislom, muftiy, qozi\na) Mamlakat miqyosidagi xavfsizlik xizmatini boshqargan.\nb) Shariat qonunlari bo'yicha intizom va tartibni saqlagan diniy-huquqiy mansabdorlar.\nc) Shayboniylar davridagi oltin tanga.\nd) Asosiy yer solig'i.\ne) Hukmdor va amaldorlarning xizmatchilarini nazorat qiluvchi.",["I-d, II-e, III-a, IV-b","I-d, II-e, III-b, IV-c","I-d, II-e, III-c, IV-b","I-d, II-c, III-e, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Ushur (qoraqalpoqlarda)\nII. Qoqra\nIII. Qora cherik\nIV. Suvli yer\na) Buxoro amirligidagi muntazam bo'lmagan qo'shin.\nb) Sun'iy sug'orishga asoslangan dehqonchilik olib borilgan yer.\nc) Loysuvoq uylar.\nd) Ruhoniylar uchun aholidan olingan soliq.\ne) Moliya vazirining yordamchisi.",["I-d, II-c, III-a, IV-b","I-d, II-b, III-e, IV-c","I-a, II-c, III-e, IV-b","I-c, II-e, III-a, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Otorqa\nII. Xususiy yerlar\nIII. Hukumat devonxonasi\nIV. Lalmi yer\na) Haram xodimlari boshlig'i.\nb) Yomg'ir suviga tayanib dehqonchilik qilinadigan yer.\nc) Xonning maxsus yorlig'i bilan harbiylarga berilgan yerlar.\nd) Egar yasash qolipi.\ne) Hukmdor saroyidagi devon.",["I-a, II-c, III-b, IV-d","I-e, II-c, III-a, IV-d","I-d, II-c, III-e, IV-b","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Devonbegi (Mang'itlar)\nII. Vaqf yerlari\nIII. Mir Arab madrasasi\nIV. O'rmak\na) Masjid, madrasa, maktabxona, xonaqoh, mozorlarga qarashli yerlar.\nb) Jun gazlama, sholcha va gilam to'qish moslamasi.\nc) Buxorodagi Minorayi kalon qarshisida joylashgan me'moriy yodgorlik.\nd) Uzun dastali jang boltasi.\ne) Moliya vaziri; quyi qushbegi; zakot yig'ishga mutasaddi.",["I-d, II-e, III-c, IV-a","I-e, II-a, III-c, IV-b","I-b, II-a, III-c, IV-d","I-b, II-e, III-c, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Qo'biz\nII. Mehtar\nIII. Qo'rchiboshi\nIV. Parvonachi\na) Qurol-aslahaga mas'ul.\nb) Sun'iy sug'orishga asoslangan dehqonchilik olib borilgan yer.\nc) Torli (kamonli) musiqa cholg'usi.\nd) Xivada bosh vazir (vaziri a'zam, dasturi mukarram, nizom ul-mulk).\ne) Oliy hukmdorning hukm va yorliqlarini ijrochilarga yetkazuvchi; harbiy harakatlarda qo'shinga qo'mondonlik qilgan.",["I-c, II-d, III-a, IV-e","I-c, II-b, III-d, IV-e","I-a, II-c, III-b, IV-e","I-c, II-b, III-d, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. To'qsabo\nII. Ko'kaldosh (Mang'itlar)\nIII. Ark\nIV. Dishan qal'a\na) Davlat bayrog'ining saqlanishiga mas'ul mansab.\nb) Mamlakat miqyosidagi xavfsizlik xizma

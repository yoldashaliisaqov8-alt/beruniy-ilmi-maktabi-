<script type="text/plain" class="suhbat-data">
MAVZU: 6-sinf
SAVOL: Qadimgi tarixni o'rganish haqida ma'lumot bering.
JAVOB: Yer yuzida odam paydo bo'lganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar tarix fanida Qadimgi dunyo tarixi deb ataladi. Bu tarix turli-tuman arxeologik va yozma manbalar asosida o'rganiladi.Insoniyatning qadimgi tarixini turli ixtisosdagi olimlar o'rganadilar.Arxeologlar qadim zamonlarda odamlar yashagan manzilgohlarda qazishma ishlarini amalga oshiradilar.Antropologlar qadimgi odamlarning suyak qoldiqlarini tekshirib, ularning tashqi qiyofasini tiklaydilar va rivojlanishini o'rganadilar.Etnografl ar qadimgi odamlarning ko'pgina udumlari, hozirda mavjud qabilalar va elatlarning qadimdan saqlab qolgan xo'jalik va madaniy an'analarini o'rganadilar. Qadimgi bitiklarni o'rganish bilan epigrafika, tangalarni o'rganish bilan esa numizmatika degan maxsus fanlar shug'ullanadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Qadimgi tarix bo'yicha manbalar haqida ma'lumot bering.
JAVOB: Qadimgi dunyo tarixi moddiy va yozma manbalar orqaki o'rganiladi.O'lkamiz qadimgi tarixining keng o'rganilgan manbalari arxeologlar tomonidan topilgan moddiy manbalardir. Mehnat qurollari, spool idishlar, qurol-aslahalar, zeb-ziynat buyumlari,xullas, qadimda inson qo'li bilan yaratilgan hamma narsalar shular jumlasiga kiradi. Yozma manbalar topilishi bilan olimlarga qadimgi ming yilliklar tarixini tiklash osonlashdi.O'rta Osiyo tarixi bo'yicha eng qadimgi yozma manba zardushtiylarning muqaddas kitobi «Avesto»dir. Unda yurtimizning qadimgi tarixiy viloyatlari – Baqtriya, So'g'd, Xorazm aholisi madaniyati to'g'risida hikoya qilinadi. Qadimgi davr tarixiga doir yana bir yozma manba Behistun qoyasidagi yozuvlardir. Behistun qoyalari Erondagi Kirmonshoh shahri yaqinida joylashgan. Fors shohi Doro I buyrug'i bilan qoyaga o'yib yozilgan yozuvlarda, Xorazm, So'g'd,Baqtriya sanab o'tiladi. Miloddan avvalgi V asrda qadimgi yunon tarixchisi Gerodot turli mamlakatlarga sayohat qilib to'qqiz kitobdan iborat «Tarix» asarini yozdi. Unda o'lkamizning qadimgi aholisi to'g'risida ham ma'lumotlar beriladi. Miloddan avvalgi I asr oxirlarida qadimgi yunon tarixchisi va geografi Strabon «Geografiya» nomli asarida O'rta Osiyo xalqlari madaniyati haqida ma'lumotlar keltiradi. Milodiy I asrda qadimgi Rim tarixchisi Kvint Kursiy Ruf «Makedoniyalik Aleksandr tarixi» nomli asarni yozib,makedoniyalik Aleksandrning O'rta Osiyoga harbiy yurishlari haqidagi ma'lumotlarni keltirgan. Milodiy II asrda yunon tarixchisi Arrian ham «Aleksandrning harbiy yurishlari» («Aleksandr anabasisi») deb nomlangan asar yozgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Eng qadimgi tuzumni davrlashtirish haqida ma'lumot bering.
JAVOB: Jahondagi barcha xalqlarning tarixi ibtidoiy jamoa tuzumidan boshlangan. Ibtidoiy jamoa tuzumi – insoniyat tarixining boshlang'ich davri bo'lib, bu paytda barcha mehnat qurollari umumiy bo'lgan va hamma birgalikda mehnat qilgan. Ibtidoiy to'da bu – turmush va mehnat umumiyligi negizida birlashgan eng qadimgi odamlar jamoasi. Urug' bu – birgalikda yashagan va mehnat qilgan, umumiy mehnat qurollari va qurol-yarog'larga ega bo'lgan qarindoshlar jamoasi. Dastlabki urug' jamoalari ayol kishi, ya'ni ona atrofi da jipslasha boshlagan. Insoniyat tarixidagi bu bosqich ona urug'i davri – matriarxat deb ataladi. Ancha keyinroq, mehnat qurollari va xo'jalik yuritish shakllari takomillashgani sayin jamoadagi yetakchilik mavqeyi asta-sekin erkak kishiga o'ta boshladi, endi u urug'ga sardor bo'lib qoldi. Olimlar insoniyat tarixidagi bu davrni patriarxat – ota urug'i davri – deb atashadi. Patriarxat bilan eng qadimgi urug'chilik tuzumi ham yakunlanadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Tosh davri haqida ma'lumot bering.
JAVOB: Eng qadimgi odamlar dastlabki mehnat qurollarini toshdan yasagani tufayli arxeologlar insoniyat tarixining boshlanishini «tosh davri» deb atashadi. Tosh davri ancha uzoq davom etgan, shuning uchun ham uni quyidagi bosqichlarga ajratishadi, jumladan: – qadimgi tosh davri – paleolit (yunoncha «paleos» – «qadimgi» va «litos» – «tosh» so'zlaridan);mil.avv. 1 mln- 12 ming yillik. – o'rta tosh davri – mezolit («mezos» – «o'rta»); mil.avv. 12-7ming yillik. – yangi tosh davri – neolit («neos» – «yangi»); mil.avv. 6-4 ming yillik. – mistosh davri – eneolit (lotincha «eneus» – «mis» va yunoncha «litos» –«tosh») mil.avv. 4-3 ming yillik. ilk → mil.avv. 1 mln. – 100 ming yil.o'rta → mil.avv. 100 – 40 ming yil. so'nggi → mil.avv. 40 –12 ming yil.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Eng qadimgi odamlar haqida ma'lumot bering.
JAVOB: Odam qanday paydo bo'lganligi haqida ilmiy, diniy, afsonaviy va dunyoviy naqllar mavjud bo'lib, biz bu masalani ilmiy asosda,antropologiya va arxeologiya ma'lumotlariga ta yangan holda o'rganamiz. Olimlar turli mintaqalardan o'ta sodda tosh mehnat qurollari ya sashni biladigan eng qadimgi odam suyaklari qoldiqlarini topib o'rganganlar, jumladan, Janubiy Afrikadan – avstralopitek, Sharqiy Afrikadagi Zinj vodiysidan – zinjantrop, Yava orolidan (Indoneziya) – pitekantrop, Xitoy hududidan – sinantrop, shuningdek, Germaniyadan – neandertal va Fransiyadagi Kromanyon g'oridan – hozirgi qiyofadagi odam – kromanyon suyaklari topilgan. Yangi kitob bo'yicha: Olimlar eng qadimgi odam suyaklari qoldiqlarini Sharqiy Afrikadan topib o'rganishgan. Mazkur odamning yoshi 2 million yildan oshadi. Olimlar uni "ishbilarmon odam" deb atashgan, negaki u toshdan o'ta sodda mehnat qurollari yasashni bilgan. Mingyilliklar davomida odamning tashqi qiyofasi, ko'nikmalari va miya hajmi o'zgarib borgan. Qadimgi tosh davrining navbatdagi bosqichida "tik yuruvchi odam" deb atalgan qadimgi inson vujudga kelgan. Uning tanasi ancha baquvvat bo'lgan. U turli tosh qurollarni yasash ko'nikmalariga ega bo'lib, chaqmoq zarbidan yong'in chiqqan o'rmondagi tabiiy olovdan foydalanishni ham bilib olgan. "Tik yuruvchi odamlar" yashash joylarini o'zgartirib, keng hududlarga tarqalganlar. Ularning makonlari va suyak qoldiqlari Afrikadan, shuningdek, Yevropa va Osiyoning ko'p joylaridan topilgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Muzliklar davri haqida ma'lumot bering.
JAVOB: Yer yuzida iqlim iliq bo'lgan davrlarda odam larning makonlari kichik daryolar yoki buloqlar yaqinidagi tepaliklarda joylashgan. Ilk paleolitning oxirlariga kelib Buyuk muzlik davri boshlandi. Ibtidoiy odamlar o'ta qattiq sinovga duch keldi. Bu hol odamlarni yangicha turmush sharoitiga moslashishga undadi. Bunday paytda kuchlilargina yashab qolgan. Yangi kitob bo'yicha: Muzliklar davri bo'yicha hikoya: Tobora kuchayib borayotgan sovuq oldida mutlaqo himoyasiz ekanliklarini tushunib, qadimgi odamlar issiqroq va pana joy izlab, olis makonlarga yo'l olishadi. Mana, ko'pdan beri yo'talayotgan keksa bir kishi orqada qola boshladi. U kasal edi va zo'rg'a qadam bosardi. Odamlar tez-tez to'xtash xatarli ekanligini, chunki shuni deb ko'pchilik o'lib ketishi mumkinligini yaxshi tushunishardi. Chol ortda qolib ketdi, biroq boshqalar uni kutmasdan yo'lda davom etishdi. U begona joylarda yolg'iz qolajagini tushundi va alam bilan ingradi. Cholning yolvorib chekayotgan faryodi anchagacha eshitilib turdi, keyin bora-bora pasayib, oxiri umuman o'chdi. Keyinroq shu yo'ldan o'tgan boshqa odamlar sovuqdan qaltirab yotgan kasal cholni ko'rdilar. Lekin bu odamlar ham unga yordam bermadilar. Qor bo'roni to'xtamay uvullardi. Dahshatli sovuq boshlangan. Oldinda odamlarni misli ko'rilmagan sinovlar kutardi. Bu olis, shafqatsiz ibtidoiy davr edi. Muzlik davrida baquvvat odamlargina omon qoldilar.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Enq qadimgi odamlarning mashg'ulotlari haqida ma'lumot bering.
JAVOB: O'rta Osiyoda toshdan yasalgan qadimiy mehnat qurollari Farg'ona vodiysidagi Selungur makonidan va Toshkent vohasidagi Ko'lbuloq manzilgohidan ham topilgan. Bular qo'pol tosh qurollar bo'lib, ularning bir tomoni urib o'tkirlangan. Arxeologiya fanida bu tosh qurollar chopperlar deb nomlangan. Mehnat qurollari odamlarga yegulik toppish uchun kerak bo'lgan. Dastlabki mehnat qurollari sodda edi. Uchi o'tkirlangan tosh va tayoq bilan qurollangan odam hayvonlarni ovlagan, uchi o'tkir tayoq yordamida o'simliklarning iste'molga yaroqli ildizlari va ildizmevalarini kovlab olgan. Tabiat insonga nimani in'om etsa, odam shuni olgan, topgan yeguligi bilan qanoatlangan.Shuning uchun ham kishilarning eng qadimiy mashg'uloti bo'lgan termachilik va ovchilik o'zlashtiruvchi xo'jalik deb ataladi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Teshiktosh yodgorligi haqida ma'lumot bering.
JAVOB: Boysun tog'laridan topilgan Teshiktosh g'ori o'rta paleolit davri madaniyatining jahonga mashhur yodgorligi hisoblanadi.Teshiktosh g'oridan tosh qurollari va ularning parchalari, tog' echkisi, kiyik, yovvoyi ot, qoplon, quyon, mayda kemiruvchilar,shuningdek, qushlarning suyaklari topilgan.Teshiktosh g'orida topib tekshirilgan, tosh asriga mansub 8 – 9 yashar neandertal bolaning suyak qoldiqlari eng mashhur topilmadir.Bola jasadi qabrga ko'milgan. Jasad atrofi ga tog' echkisi shoxlari qadab chiqilgan.Murdaning dafn etilishi dastlabki diniy e'tiqodlar bilan bog'liq bo'lgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Odamlarning guruh-guruh bo'lib yurishiga sabab hikoya haqida ma'lumot bering.
JAVOB: Gulxan atrofida to'plangan odamlar tomon g'or sheri pisib kela boshladi. U daraxt va butalar orasidan sezdirmay jilardi. Ammo kimdir uni ko'rib qolib, qo'rqqanidan qichqirib yubordi. Barcha cho'chib sher tomon o'girildi. Sher yaqinlashib qolgan bo'lsa ham, hech kim qochishni o'ylamasdi. Qochgan odamni sher bir sakrashda tutib olardi. Hamma sherdan ko'zlarini uzmay, yelkama-yelka turib qattiq qichqirib, qo'llarini silkitgancha yirtqich tomon bostirib bordi. Sher o'zini yo'qotib qo'ydi, ko'zlari ola-kula bo'la boshladi. Odamlar sher tomon yaqinlashib kelaverdilar. Bu ular uchun yagona qutulish yo'li edi. Ana, eng kuchli hayvonlarni yenggan va yon-atrofni dahshatga solgan g'or sheri ortga chekina boshladi. Odamlar esa yanada qattiq baqirib, sherga qo'rqmay yaqinlashaverdilar. Shundan so'ng odamlar guruh-guruh bo'lib yuradigan bo'ldilar. Endi ularga hech nima tahdid sololmasdi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Diniy e'tiqodlarning vujudga kelishi haqida ma'lumot bering.
JAVOB: Mehnat faoliyati, tevarak olam haqida to'plangan bilimlar asta-sekin insonning fi krlash qobiliyati va tafakkurini o'zgartirib bordi. Odamlar o'zlariga tushunarsiz bo'lgan hodisalar haqida o'ylay boshladilar: kun bilan tun, yil fasllari almashishi, vulqonlar otilishi,yer qimirlashi va boshqa tabiat hodisalari odam e'tiborini o'ziga tortgan. Ana shu hodisalarning sabablarini tushuna olmagan inson momaqaldiroq, yashin,shamol, yomg'ir kabi tabiat kuchlariga sig'ina boshladi. Ovchilik va termachilik rivojlangan davrda inson o'zini tabiiy muhitdan hamda o'rab olgan hayvonot va o'simliklar olamidan ajratmagan.U tabiatni jonli deb hisoblagan. Odamlar tabiatdagi turli hodisalar negizida g'ayritabiiy kuchlar yashiringan deb o'ylaganlar. Ular ana shu kuchlarga e'tiqod qilishgan. Odamlar guruhi jamoasining biror hayvon yoki o'simlik turi bilan qarindoshlik aloqasiga ishonish totemizm deb ataladi. Odamni o'rab turgan muhitda jonlar va ruhlarning mavjudligiga e'tiqod fanda animizm nomini olgan. Qadimgi odamlar u yoki bu buyumlar omad keltirishiga yoxud balo-qazoni bartaraf etishiga ham e'tiqod qilganlar. Bu e'tiqod fetishizm nomini olgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Ilk qoyatosh suratlar haqida ma'lumot bering.
JAVOB: So'nggi paleolit davriga oid g'orlar devorlarida topib tekshirilgan rasmlar ham qadimgi odamlarning diniy tasavvurlari to'g'risida hikoya qiladi. Bunday rasmlardan eng qadimiylari Ispaniyadagi Altamir, Fransiyadagi Lasko va Rossiya Boshqirdistondagi Kapova g'orlaridan topilgan. Odamlar mazkur rasmlar bo'lajak ovda u larga yordam beradi, deya ishonishgan.Ra smlar qarshisida hayvonlar harakatlariga taqlid qilib, raqsga tushishgan, ov manzaralarini tasavvurga keltirishgan, nayza uloqtirishni mashq qilishgan. Qadimgi rasmlar qimmatli tarixiy manbalardir.Ular inson nimalar haqida o'ylagani, tevarak dunyoni qay yo'sinda tasavvur etgani,qaysi hayvonlarni ovlagani, qanday mehnat qurollari va qurol-yarog'dan foydalanganini bilib olish va tushunishga yordam beradi. Odamning o'zini qurshab turgan tevarak olamni tushunishga intilishi eng qadimgi tasviriy san'at rivojlanishi uchun asos bo'lib xizmat qildi.O'zbekistondan topilgan eng qadimgi qoyatosh rasmlar mezolit davriga oid Zarautsoy darasidan topilgan. Yangi kitob bo'yicha: Qoyatosh suratlarini topilishi haqida hikoya. Dastlabki qoya tasvirlarini arxeologning qizalog'i kashf qilgan. O'shanda ular Ispaniyaning Altamira g'orida edilar. Ota ibtidoiy odamning mehnat qurollarini to'plash bilan band bo'lganida, qizaloq g'orni kezib yurib, to'satdan:
– Dada, qarang, ho'kiz! – dedi. – Qani? – Shiftga qarang!
Chiroq nuri shiftni yoritgach, qadimgi odam chekkan yovvoyi buqa, to'ng'iz va bug'ularning rasmlari qorong'ilik qa'ridan bir-bir ko'rina boshladi. Rasmlar qirmizi va boshqa ranglar bilan ishlangan. Buning siri hali-hanuz ochilgani yo'q.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: So'nggi paleolit davri (mil.avv. 40-12 ming yilliklar) haqida ma'lumot bering.
JAVOB: So'nggi paleolit davrida (mil. avv. 40–12-mingyilliklarda) ko'plab voqealar ro'y berdi. Bu davrda toshga ishlov berish texnikasi va mehnat qurollari yasash usullari o'zgardi. Odamning aqliy qobiliyati va tashqi qiyofasi ham o'zgarib bordi. Mazkur davrda zamonaviy qiyofaga ega kromanyon odami yashagan. So'nggi paleolit davri odami manzilgohlari Samarqand shahri hududidan, Toshkent viloyati Ohangaron daryosi vohasidagi Ko'lbuloq makonidan, shuningdek, Farg'ona vodiysidan topilgan. Shunday qilib, so'nggi paleolitda insoniyat o'z rivojida yana bir pog'onaga yuksaldi. Odamlar qarindoshlardan tarkib topgan ixcham guruhlar – urug' jamoalariga birlashdilar.Urug' a'zolari bitta manzilgohda yashagan. Bir joyda yashab turgan bir qancha urug'lar qabilani tashkil etgan. SO'NGGI PALEOLIT DAVRIDA ODAM: olov hosil qilishni; taqinchoqlar (munchoq, tumor, uzuk) yasashni; boshpana qurishni; kesuvchi va arralovchi mehnat qurollari yasashni o'rgandi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Mezolit davri haqida ma'lumot bering.
JAVOB: Mezolit – o'rta tosh davri mil.avv. 12–7-mingyilliklarni o'z ichiga oladi. Mezolit davri boshlanishi bilan muzlik davri poyoniga yetdi, bu narsa iqlim ancha ilishiga va odamlar turmushida o'zgarishlar bo'lishiga olib keldi. Mezolit davri oxirida Old Osiyoda xo'jalikning yangi tarmoqlari – ibtidoiy ziroatchilik va chorvachilik vujudga keldi.Bugungi kunda O'rta Osiyoda mezolit davriga oid yuzdan ziyod manzilgohlar ochilgan.Farg'ona vodiysining tog'oldi va tog'li tumanlarida, Toshkent vohasida hamda O'zbekistonning janubida bunday manzilgohlar ko'plab uchraydi. Obishir, Qo'shilish va Machay manzilgohlari, shuningdek, Zarautsoy darasidagi qoyatosh rasmlari ancha mufassal o'rganilgan. MEZOLIT DAVRIDA INSON: o'q-yoy yasashni o'rgandi; hayvonlarni qo'lga o'rgata boshladi;
ibtidoiy ziroatchilik va chorvachilik bilan shug'ullana boshladi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Itning qo'lga o'rgatilishi haqida ma'lumot bering.
JAVOB: Ovchilar itni qo'lga o'rgatdilar. Balki bu voqea shunday bo'lgandir: Bir kuni ertalab ikki bola g'ordan chiqib, kuchukni ko'rib qoladi. U g'or yoniga tashlangan suyaklarga yaqinlashib kelardi. Uning onasini yirtqich hayvonlar g'ajib tashlashgan. Shuning uchun yolg'iz qolib, ochiqqan edi. Ochlik uni odamlar manzilgohi sari undaydi. Uni ko'rgan bolalar shodon g'ujurlashib, u to mon chopadilar. Kuchuk qo'rqib, o'zini buta panasiga oladi.Kechqurun u yana g'or oldida paydo bo'ldi. O'sha kuni ov baroridan kelib, suyaklar, ovqat qoldiqlari g'or yonida har qachongidan ko'ra ko'proq edi. Odamlar ovozi tingach, kuchuk g'orga yaqinlashadi va bir suyakni g'ajiy boshlaydi.U g'or yoniga keyingi kuni ham keladi. G'or yaqinidagi pana joyda yashay boshlaydi. Odamlar suyak tashlasa, pisib kelib, olib qochadi. Bir kuni odamlar yashab turgan g'orga bizga tanish bo'lgan kuchuk vangillagancha o'qdek otilib kirdi. Uni bo'ri quvlab kelardi. Kuchuk odamlardan panoh istab ichkariga kirgan. Bu hol odamlarda ularga notanish bo'lgan rahm-shafqat hissini uyg'otdi. Bolalar unga jonli o'yinchoqqa qaragandek boqib turishardi. Qulog'i, dumidan tortishardi. Kunlar o'tdi. It ulg'ayib, odamlarga o'rganib qoldi. Bir kuni kechasi uning vovullashidan hamma uyg'onib ketdi. Tura solib itni urmoqchi bo'ldilar. Ammo qarasalar, g'or og'zida ikkita ayiq turardi. Ayiqlarni "hay-hay"lab quvib yuborishgach, odamlarning ba'zilari kelib, itni silab, minnatdorchilik bildirdilar. Chunki it ularni o'limdan saqlab qolgan edi. Shundan keyin it odamlarning doimiy hamrohiga aylandi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Neolit davri haqida ma'lumot bering.
JAVOB: Neolit – yangi tosh davrida inson qadimgi Sharqning turli hududlarida ishlab chiqaruvchi xo'jaliklar – ziroatchilik va chorvachilikka o'ta boshlaydi. O'rta Osiyoda neolit davri mil. avv. 6–4-mingyilliklarni o'z ichiga oladi. Arxeologlar neolit davri boshlanishini sopol idishlar yasashning kashf etilishi bilan belgilaydilar. Mezolit va neolit davrida odam toshdan mayda mehnat qurollari – mikrolitlar yasagan, toshga ishlov berishning oldin ma'lum bo'lmagan usullari – silliqlash va teshikchalar parmalashni qo'llay boshlagan. Loydan ishlangan va olovda pishirilgan idishlar yasash –kulolchilik, tolalar va jundan kiyim-kechak tayyorlash – to'quvchilik neolit davrining muhim kashfiyotlaridir. NEOLIT DAVRIDA ODAM:toshdan mikrolitlar, tolalardan to'qima, loydan sopol idishlar yasagan;doimiy turarjoylar qura boshlagan; o'troq tumush tarziga o'tgan. O'troq turmush tarzi va mehnat qurollarining yanada takomillashishi jamoalarning dehqonchilikka o'tib bori shiga imkon yaratgan. Dehqonchilik va chorvachilikning rivoj lanishi hunarmandchilikning shakllanishiga olib keldi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Eneolit davri haqida ma'lumot bering.
JAVOB: Neolit davrining oxirida odamlar misdan foydalanish va undan mehnat qurollari yasashni o'rganib oldilar. Bu, shubhasiz, o'sha davrning eng buyuk kashfiyotlaridan biri edi. Misdan yasalgan mehnat qurollarining tosh qurollar bilan birgalikda ishlatilish davri eneolit – mis-tosh asri deb ataladi. Bu davr mil. avv. 4–3-mingyilliklarning o'rtalariga to'g'ri keladi. Metallga ishlov berish kishilarning moddiy va ma'naviy madaniyatiga katta ta'sir ko'rsatdi. Mil. avv. 4-mingyillikda qadimgi Sharqda ilk shaharlar va davlatlar vujudga kela boshladi. O'rta Osiyo janubida sun'iy sug'orishga asoslangan dehqonchilik vujudga keldi, xom g'ishtdan ko'p xonali uylar qurila boshladi, idishlarni pishirish uchun kulolchilik o'choqlaridan foydalanishga kirishildi. Sopol idishlar hayvon va qushlarning tasvirlari va o'simlik naqshlari (yaproqlar, gullar) bilan bezatila boshladi. ENEOLIT DAVRIDA INSON: misdan ishlangan qurollarni; sun'iy sug'orish tizimini; xom g'ishtni; ko'p xonali uylarni; ilk shaharlar va davlatlarni yaratdi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Bronza davri haqida ma'lumot bering.
JAVOB: Odamlar misni qalay, qo'rg'oshin yoki rux bilan qo'shib eritib, bronza olishni o'rganganlar.Bronza misdan ko'ra ancha qattiqligi tufayli mil. avv. 3-mingyillik o'rtalaridan boshlab asta-sekin mehnat qurollari, qurol-yarog'lar va zeb-ziynatlar tayyorlashda ishlatiluvchi asosiy ashyoga aylanib qoldi. Bronza mehnat qurollariga ega bo'lgan odamlar endi dalalarga ancha yaxshi ishlov berish va ekin maydonlarini kengaytirish imkoniga ega bo'ldilar. Natijada ular ixtiyorida ortiqcha miqdorda qishloq xo'jalik mahsulotlari vujudga keldi. Bronza davrida odamlar kulolchilik charxi va g'ildirakni kashf etdilar. Shu tariqa dastlabki aravalar paydo bo'ldi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Patriarxatning boshlanishi haqida ma'lumot bering.
JAVOB: Omoch bilan yer haydash, ziroatchilik qilish, chorvachilik, hunarmandchilikning vujudga kelishi natijasida urug'ni yetarli mahsulotlar bilan ta'minlash erkaklar qo'liga o'tdi. Uy xo'jaligi yumushlari ayollar zimmasida qoldi.Endi urug'chilik oilasida erkaklar muhim o'rin tuta boshladilar. Qarindoshchilik erkak nomi bilan belgilanadigan bo'ldi va patriarxat davri boshlandi. Oila ota tomonidan yaqin qarindoshlarning bir necha avlodlaridan tashkil topadigan bo'ldi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Bronza davri dehqonlarining manzilgohlari haqida ma'lumot bering.
JAVOB: Mil. avv. 3-ming yillik oxirlari – 2 ming yillikka oid manzilgohlardan biri Zarafshon daryosi havzasidagi Zamonbobo ko'li yaqinidan topilgan (Buxoro viloyati,Qorako'l tumani). Xorazm vohasida ham bronza davriga oid manzilgohlar o'rganilgan.Arxeologlar Surxondaryo vohasidan qadimgi ziroatchilar manzilgohlaridan biri bo'l gan Sopollitepani topishdi (Muzrabod tumani). Qazishmalar davomida bu yerdan xom g'ishtdan qurilgan uy-joylar, spool buyumlar, bronzadan yasalgan mehnat qurollari va zeb-ziynatlar yasalgan ustaxona qoldiqlari, shuningdek, yirik xumlarda saqlangan bug'doy va arpa doni topilgan. Surxon vohasida (hozirgi Sheroboddan uncha uzoq bo'lmagan joy) Jarqo'ton manzilgohi vujudga kelgan. Jarqo'ton qurilishi tarixida ilk shahar alomatlari ko'zga tashlanadi.U ikki qismdan iborat bo'lgan: qal'a va uning atrofi da jamoa a'zolari bo'lmish hunarmand va dehqonlarning uylari joylashgan. Jarqo'tonda ibodatxona qoldiqlari topilgan. Bronza davri manzilgohlari aholisi har xil hunarmandchilik, to'quvchilik, kulolchilikni rivoj toptirishda, zeb-ziynat buyumlarini yasash, qurilish sohasida katta yutuqlarga erishgan. Yangi kitob bo'yicha: Bronza davrida O'rta Osiyo janubida dehqonchilik va hunarmandchilik rivojlanishi asosida ilk shaharlar va davlatlar vujudga kelgan. Taxminan 4 ming yil oldin hozirgi Sherobod yaqinida (Surxondaryo viloyati) ziroatkorlar yangi manzilgoh qurdilar. Uning xarobalari Jarqo'ton (jarlik ustidagi qo'ton) nomi bilan mashhur.Bu manzilgoh aslida qanday ko'rinishga ega edi? Keling, uning ko'chalarini kezib tomosha qilaylik. Jarqo'ton bronza davriga oid shahar ko'rinishiga ega qal'a bo'lib, uning ichi va atrofida jamoa a'zolari bo'lmish hunarmand va dehqonlarning uylari joylashgan. Qal'a ichidan jamoa sardorining saroy qoldiqlari topilgan.Jarqo'tonda olovga va suvga sig'inish e'tiqodi bilan bog'liq ibodatxona qoldiqlari arxeologlar tomonidan o'rganilgan. Bronza davrida yurtimizning qadimgi aholisi va qadimgi Sharq elatlari o'rtasida keng madaniy aloqalar boshlangan. Daryolar vohalari bo'ylab muhim savdo yo'llari o'tgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Sopollitepa manzilgohi haqida ma'lumot bering.
JAVOB: Biz Sopollitepa manzilgohining markaziy qismida turibmiz. Manzilgoh mudofaa devori bilan o'ralgan. Tashqi devorni buzib, manzilga kirmoqchi bo'lgan dushmanlar tuzoqqa tushardilar. Bu paytda qal'a himoyachilari ularning boshlariga o'q va toshlar yog'dirgan. Sopollitepaga yagona darvozadan kiritilgan. U juda mustahkam qo'riqlangan. Biz qal'aning sakkizta mavzesidan birida yo'limizni davom ettiramiz. Bu yerdagi barcha ko'chalar markaziy maydonga olib boradi. Maydonda savdo-sotiq avjida. Kulollar kulolchilik charxida yasalgan uzun guldonlar, ko'za va xumchalarini chiqarib sotishmoqda. Ayollar nodir toshlar va bronzadan yasalgan taqinchoqlar – sirg'a va munchoqlar, tumor va ko'zgularni tomosha qilmoqda.Tikuvchilar matolarni ko'z-ko'z qilishardi. Chekkaroqda ziroatkorlar va chorvadorlar o'zlari yetishtirgan bug'doy, arpa, hayvon terilaridan va charmdan yasalgan buyumlarini sotardilar.Ma'lum bo'ladiki, bronza davri aholisi hunar-mandchilik, to'quvchilik, kulolchilik, zargarlik va binokorlikda katta yutuqlarni qo'lga kiritgan. Ammo bronza davri odamlarining hayoti mashaqqatlarga to'la edi. Ular kun bo'yi mehnat qilardilar. Tabiat buning evaziga ularga o'z ne'matlarini in'om etardi. Yosh bolalarning tongi beg'ubor otardi xolos. Tong saharda cho'ponlar mollarini yaylov sari haydar, dehqonlar esa dala tomon shoshardilar. Ular bilan ovchilar ham chiqib, suv ichgani keladigan kiyikni buloq yo'lida poylardilar. Baliqchilar daryo sari jo'nardi. Kulol loy qorgan, uning shogirdlari o'choqlarga o't yoqishgan. Ularning yonidagi ma'dan eritish ustaxonasida bronza buyumlar uchun eritilgan ma'danlar qoliplarga quyilardi. Zargarlar bronzaga ishlov berib, bilaguzuk va oynalar tayyorlashardi. Ayollar bo'yra to'qir, don tuyishar, ovqat qilar, bolalarni tarbiyalashardi. Bu ishlar har kuni takrorlangan. Hayot shu zaylda davom etgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Temir davri haqida ma'lumot bering.
JAVOB: Odamlar mis va bronzaga ishlov bergan davrlardan ko'p asrlar o'tib, temirdan mehnat qu rollari ya sash imkoniyati paydo bo'ldi. Bu ja rayon ancha sermashaqqat bo'lgan, negaki temir misdan ko'ra ancha yuqori haroratda (1500°C) eriydi. Ammo temir mis va bronzaga nisbatan qattiqroq edi. Temirdan birinchi bo'lib Kichik Osiyodagi xettlar (mil. avv. XIV–XIII asrlar), so'ngra qo'shni mintaqalardagi (Mesopotamiya, Eron,Kavkazorti) xalqlar foydalana boshlaganlar.Temir buyumlarning tarqalishi sekinlik bilan borgan.Sof temir tabiatda kamyob metal bo'lgani uchun undan dastlab zeb-ziynat buyumlari yasashda foydalanishgan. Shunday buyumlar Misr fi r'avni Tutanxamon maqbarasidan va Kavkazdagi Maykop qo'rg'oni yodgorligidan topilgan.Mehnat qurollarining temirdan yasalishi eng avvalo, dehqonchilikning rivojiga ta'sir qildi. Temir omoch va boltalar paydo bo'ldi. Bu mehnat qurollari katta maydonlarda dehqonchilikning rivojlanishiga imkon yaratib berdi.Miloddan avvalgi IX-VIII asrlarda temirdan yasalgan ilk mehnat qurollari O'rta Osi yodan ham topilgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Temir davrida ijtimoiy tuzum haqida ma'lumot bering.
JAVOB: Temir qurollarning keng tarqalishi mehnat unumdorligini oshirdi. Bu esa ishlab chiqarishning yanada rivojlanishiga zamin yaratdi.Qabila-urug' oqsoqollarining ta'siri tobora kuchaya borgan. Doimiy harbiy to'qnashuvlar sharoitida qabilalar ittifoqlari paydo bo'ldi. Bu ittifoqlarga harbiy sardorlardan saylangan kishilar rahbarlik qilganlar, jamiyat esa harbiy demokratiya tamoyillari asosida yashay boshladi. Yangi kitob bo'yicha: Temir asri boshlarida O'rta Osiyoda aholi to'rtta guruhga bo'lindi: kohinlar, jangchilar,dehqonlar, hunarmandlar. O'rta Osiyo jamiyati asosini tashkil etgan «nmana» – katta patriarxal oilasi haqida «Avesto»dan bilamiz. Bir necha «nmana»lar urug' jamoasi – «vis»ni tashkil etgan. Hududiy qo'shnichilik jamoasi esa «varzana» deb nomlangan. Bunday jamoalar qabilaga –«zantu»ga birlashgan. O'z hududini himoya qilish uchun bir qancha qabilalar ittifoqqa – «dax'yu»ga uyushishgan. O'rta Osiyoda temir asriga o'tish davrida jamiyatning tuzilishi shunday bo'lgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Qadimgi aholining etnik tarkibi va hududiy joylashuvi haqida ma'lumot bering.
JAVOB: Yozma manbalarning guvohlik berishicha, mil. avv.VII–VI asrlarda O'zbekiston hamda qo'shni hududlarda sug'diylar, baqtriyaliklar,xorazmliklar kabi elatlar, shuningdek,sak va massaget qabilalari yashagan. Zarafshon va Qashqadaryo vohasida dehqonchilik bilan shug'ullanuvchi ko'plab aholi istiqomat qilgan.Yunon yozma manbalarida bu hudud Sug'diyona deb nom langan. Mazkur hududda yashaydigan aholi sug'diylar deb atalgan.Sug'diylarning eng yaqin qo'shnilari baqtriyaliklar bo'lib, ular Surxon vohasi, shimoliy Afg'oniston va janubiy Tojikiston hududlarida joylashgan. Yunon-rim muarrixlari u yerlarni Baqtriana yoki Baqtriya deb atagan. Amudaryoning quyi oqimida yashagan o'troq dehqon elatlari xorazmliklar bo'lgan. Ularning yurti yunon manbalarida Xorasmiya deyilgan. Cho'llar va Amudaryo bo'ylarida ko'chmanchi massaget qabilalari yashagan. O'rta Osiyoning tog'lik, dasht va cho'l yerlarida asosiy mashg'uloti chorvachilik bo'lgan saklar istiqomat qilgan. Qadimgi yunon-rim tarixchilarining yozishlaricha,saklar uch guruhga bo'lingan. Ularning ko'pchilik qismi saka-tigraxauda, ya'ni o'tkir uchli kigiz qalpoq kiyib yuruvchi saklar deb atalgan. Ular hozirgi Toshkent viloyati va Janubiy Qozog'iston yerlarida yashaganlar. Ikkinchi guruhi saka-tiay-taradarayya, ya'ni daryoning narigi tomonida yashovchi saklar deb atalgan. Ular Orol dengizi bo'ylarida,Sirdaryoning (qadimgi nomi Yaksart) quyi oqimida yashaganlar.Pomirning tog'li tumanlarida va Farg'onada saka-xaumovarka deb ataluvchi ya'ni muqaddas ichimlikka sig'inuvchi saklar yashagan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Mil. avv. VII–VI asrlarda xo'jalikning rivoji haqida ma'lumot bering.
JAVOB: Bu davrlarda Xorazm,So'g'd va Baqtriya aholisining asosiy mashg'uloti sun'iy sug'orishga asoslangan dehqonchilik bo'lgan. Hunarmandchilik va savdo-sotiq ham ancha rivoj topqan. Manzilgohlardan yuqori sifatli kulolchilik idishlari,temir va bronza bu yumlar topilgan.Ko'chmanchi sak va massaget qabilalarining asosiy mashg'uloti chorvachilik bo'lib, ular tuya, ot, qo'y va echkilarni boqqanlar. Chorvadorlar hayvon terisidan poyabzal,kiyimlar, chodirlar tikib, g'alla va mevaga ayirboshlaganlar.Hunarmandchilik va savdoning rivojlanishi natijasida mil. avv. VII-VI asrlarda qadimgi shaharlar rivojlangan. Ular hunarmandchilik ishlab chiqarishi va savdo markazlari edi. Yangi kitob bo'yicha: Tog'lardan mis, qalay, kumush va oltin ma'danlari hamda zargarlik buyumlari yasash uchun lojuvard (la'l) va feruza kabi qimmatbaho toshlar qazib olingan. Lojuvard Baqtriya tog'larida bo'lgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Baqtriya la'li to'g'risida ossuriya manbalaridagi ma'lumot haqida ma'lumot bering.
JAVOB: "Podshoh so'ragan la'l borasida: "Menga la'l keltiring", degan ekanlar. Men,janobi oliylari, tog'ga chiqib, la'lni qo'lga kiritganimda mamlakat ahli menga qarshi qo'zg'alganini bilmaydilar. Podshoh izn bersalar, janobi oliylari,katta qo'shin borib, la'lni keltirishsa; faqat men ular bilan non-u qatiqni baham ko'rmayman; ular yonida yurmayman, sening choparing yonida bo'lmayman,podshoh salomatligi xususida ham so'ramayman.Shohim buni gunohga yo'ymasalar bas…".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Mil. avv. VII –VI asr larda qadimgi shahar madaniyati haqida ma'lumot bering.
JAVOB: Qadimshunoslar Afrosiyob (Samarqand), Yerqo'r g'on va Uzunqir (Qash qadaryo vohasi), Ko' zaliqir (Xorazm), Qiziltepa (Surxondaryo vohasi) kabi qadimiy shaharlarni o'rganishgan. Qadimgi shaharlar mudofaa devorlari bilan o'ralgan. Shaharda hokim yashaydigan qal'a bo'lgan. Qal'ada xom g'ishtdan qurilgan katta saroy joylashgan. Devorning burjlari va o'q otish uchun maxsus shinaklari ham bo'lgan.Shahar ichkarisida turar joylar va hunarmandchilik ustaxonalari joylashgan. Shaharlarning bir guruhi savdo va hunarmandchilik markazlari bo'lsa, boshqalari alohida tuman va viloyatlar markazlari hisoblangan. Yangi kitob bo'yicha: O'sha olis davrlarda sayyoh uzoqdan yirik qadimiy shaharni ko'rishi mumkin edi. Ulkan ichki qal'a shahardagi boshqa xom g'ishtdan qurilgan xonadon, xo'jalik binolari va hunarmandchilik ustaxonalaridan ancha balandda viqorli bo'y cho'zib turardi. Qo'rg'onda turli xonalardan iborat katta saroy joylashardi. Daraxtlar kam, ko'chalari tor, lekin mudofaa devorlari kishini lol qoldiradi. Shaharda yashovchilar mudofaa tizimiga alohida e'tibor berardi. Shahar darvozasiga kirish yo'lini suv bilan to'ldirilgan chuqur – xandaq to'sib turardi. Devorning burjlari va o'q otish uchun shinaklari bo'lgan.Ulardan bronza paykonli kamon o'qi uchib kelishini har soniyada kutish mumkin edi.Xushmanzara soy bo'ylarida dehqonlarning uy-qo'rg'onlari bo'y cho'zib turar, ular bog'lar, ekinzorlar bilan o'ralgan bo'lardi. Chang-to'zonli yo'llar qo'shni vohalar sari eltardi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Qadimgi davlatlar haqida ma'lumot bering.
JAVOB: Mil. avv. VII asrda tashkil topgan Baqtriya davlati O'rta Osiyo hududidagi qadimgi davlatlardan biri sanaladi. Marg'iyona va Sug'd Baqtriyaning siyosiy va madaniy ta'sirida bo'lgan, shu sababli u turli qadimgi qardosh xalqlarning davlat birlashmasi hisoblanadi. Mazkur davrda Surxondaryo, Qashqadaryo,Zarafshon vohalarida gadimgi shaharlar rivojlangan. Qiziltepa, Uzunqir, Yerqo'rg'on va Afrosiyob o'rnida Baqtriya va So'g'dning markaziy shaharlari joylashgan. Yana bir qadimiy davlat Xorazm hududida tashkil topgan. Bu davlat Xorazmdan tashqarida bo'lgan yerlarni ham birlashtirgan.Qadimgi Xorazm vohasi markazlaridan biri Ko'zaliqir qal'asi edi. U qalin va mustahkam mudofaa devorlari bilan o'ralgan. Vohaning aholisi dehqonchilik va chorvachilik bilan shug'ullangan. Qadimgi Xorazmda hunarmandchilik, binokorlik va savdo-sotiq yuksak darajada rivojlangan.Mahalliy kulolchilik, qurolsozlik, zargarlik buyumlarining dovrug'i o'zga yurtlarga ham tarqalgan edi. Xorazmliklar mohir quruvchi va hunarmand bo'lganlar. Yangi kitob bo'yicha:Qadimiy davlat tizimi Xorazm hududida ham tashkil topgan. Xorazm vohasining yirik markazlaridan biri mustahkam mudofaa devorlari bilan o'rab olingan Ko'zaliqir qal'asi o'rnida joylashgan. Mil. avv. VI asrda xorazmliklar ushbu qal'ada katta saroy qurishgan. U turli xonalar va yog'och ustunli zallardan iborat bo'lgan. Saroy yaqinida arpa va bug'doyni saqlash uchun mo'ljallangan yirik g'alla omborxonasi bunyod etilgan. Voha aholisi dehqonchilik va chorvachilik bilan shug'ullangan. Qadimgi Xorazmda hunarmandchilik, binokorlik va savdo-sotiq yuksak darajada rivojlangan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Baqtriyaning Ossuriya bilan aloqalari haqida Ktesiy ma'lumoti. Ma'lumot bering.
JAVOB: Baqtriyaning Ossuriya bilan aloqalari haqida qadimgi yunon tarixchisi Ktesiy (mil. avv. V–IV asrlar) yozib qoldirgan. U uzoq muddat qadimgi fors shohi Artakserks saroyida yashab, saroy tabibi bo'lgan. Ktesiy Ossuriya podshosi Ninning Baqtriyaga yurishi haqida hikoya qiladi. Mamlakat aholisining ko'pligi, yirik shaharlari va mustahkam poytaxti Baqtra hamda Baqtriya podshosi Oksiart haqida quyidagicha ma'lumot beradi:
"Baqtriya botirlarining jasoratini, ularning yurti ko'plab mustahkam qo'rg'onlarga ega ekanini yaxshi bilgan Nin o'ziga qarashli elatlardan ko'p sonli jangchilar to'pladi. Yirik kuchlar bilan Baqtriyaga qo'shin tortib, u yerlarga o'tish mushkulligi, daralar nihoyatda torligi tufayli Nin qo'shinlarini bir necha qismga bo'lgan. Baqtriya yirik shaharlarga ega bo'lishidan tashqari, poytaxti nihoyatda ulkan edi. U Baqtra deb atalib, boshqa shaharlaridan qal'asining va devorlarining mustahkamligi bilan ajralib turardi. Podsho Oksiart qurol ko'tarishga qodir barchani jangga safarbar qildi. U o'z qo'shinlari tepasida turib, dushmanga ro'baro' bo'ldi va Nin qo'shinlaridan birining daradan o'tishiga imkon yaratdi. Tekislikka yetarli miqdordagi dushman qo'shini o'tib bo'lgach, Oksiart o'z qo'shinlaridan jangovar saf tizdi. Dahshatli jang boshlanganda baqtriyaliklar ossuriyaliklarni chekinishga majbur qildi. Ularni ta'qib etib, tog' etagigacha quvib bordi va yuz ming nafar dushman qo'shinini qirib tashladi".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Zardushtiylikning vujudga kelishi tarixi haqida ma'lumot bering.
JAVOB: Mil. avv. 1-mingyillikda O'rta Osiyoda zardushtiylik deb atalgan din keng tarqaladi. Bu din hali odamlar tabiatni ilohiylashtirgan kezlarda kurtak yoza boshlagan edi. Zardushtiylar olov (quyosh), yer, suv va yulduzlarga sig'ingan va ularni ilohiy deb hisoblagan."Zardushtiylik" so'zi Zaratushtra (Zardusht) nomi bilan bog'liq. U mil. avv. 1-mingyillikning birinchi choragida yashab o'tgan tarixiy shaxsdir. Keyinroq Yunonistonda uning ismini "Zoroastr" deb atashgan (yunoncha astron – "yulduz"), negaki Yunonistonda uni donishmand, munajjim deb hisoblashgan. Bu nomdan ta'limotning o'zi ham zоroastrizm, ya'ni zardush-tiylik deb atala boshlagan. Zardushtiylikning paydo bo'lishi haqida shunday afsona bor:
Bir kuni Zardusht suv olish uchun erta tongda daryo bo'yiga kelgan ekan. Zilol suvda u Ahuramazda vakillaridan birining siymosini ko'rib qoladi, siymo nur bilan qaysi tomonga borishga yo'l ko'rsatadi. Zardusht sehrli nur izidan ergashadi, ko'p o'tmay oliy iloh – Ahuramazda huzuriga yetib keladi. Ahuramazda o'zining ezgu amallari haqidagi bilimlarni tarqatish uchun uni tanlaganini aytadi va ilohiy vakolat olganini ma'lum qiladi. Shu tarzda Zardusht 30 yoshida yangi diniy ta'limotning targ'ibotchisiga aylangan. «Payg'ambar» so'zining o'zi esa «ezgu amallar haqida xabar beruvchi» ma'nosini anglatadi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Zardushtiylikning tarqalishi haqida ma'lumot bering.
JAVOB: Zardushtiylik tarqala boshlagan paytlarda ibodatxonalar, odamlar duo matnlarini o'rganishi uchun maxsus kitoblar bo'lmagan. Diniy marosimlar ochiq osmon ostida, gulxan yonida yoki uydagi o'choq olovi atrofida o'tkazilgan. Oldin turli qabilalarni istilochilarga qarshi kurashga birlashtirish uchun Zardusht ularni birlikka da'vat qilgan.Zardushtning so'nggi va'zlari kohinlar tomonidan yod olib, dindorlarga o'qib berilgan. Zardushtning vafotidan keyin bir necha asrlar o'tgach, barcha diniy marosimlar, madhiyalar va duolar zardushtiylar uchun muqaddas bo'lgan bir kitobga jamlandi. Bu kitobning nomi "Avesto" bo'lib, "qat'iy belgilangan qonun-qoidalar" degan ma'noni anglatadi. «Avesto»ning ilk qismi mil. avv. IX – VIII asrlarda paydo bo'lgan. Zardusht va'zlari matnlarining hammasi mil avv. III asrda 21 ta kitobda jamlangan, bu kitoblar «Avesto» asosini tashkil etgan edi. «Avesto» matnlariga sharh esa «Zand» deb yuritiladi. Olimlarning izlanishlari tufayli bugungi kunda biz zardushtiylarning muqaddas kitobi «Avesto» matnlari bilan tanishish imkoniyatiga ega bo'ldik. Fransuz olimi A.Dyuperron ilk marotaba «Avesto»ning alohida qismlarini tarjima qilgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Zardushtiylik xudolari, ta'limoti va marosimlari haqida ma'lumot bering.
JAVOB: Zardushtiylar o'zlarining ehtiromli ma'budlariga e'tiqod qilishgan. Ahuramazda zardushtiylarning ulug' va donishmand oliy xudosi hisoblangan. Mitra – Quyosh va yorug'lik ma'budidir. O'tli chaqmoqlar yordamida u yovuzlik va o'lim ma'budi bo'lmish Ahriman bilan jang qiladi.Zardushtiylar yomg'irdan keyin hosil bo'ladigan kamalakka Mitraning o'q uzayotgan yoyi deb sig'inishgan. Anaxita zardushtiylikda hosildorlik va suv ma'budasi hisoblangan.Zardushtiylik dini ta'limoti insoniyatning ezgulik va yovuzlik haqidagi qarashlari takomiliga katta ta'sir ko'rsatdi.Zardushtiylar hayotining tub ma'nosi ezgu amal, ezgu so'z va ezgu fikrdan iborat bo'lgan. Insonning asosiy burchi,eng avvalo, adolatli turmush tarzi hisoblangan.Zardushtiylik e'tiqodiga ko'ra, yolg'on so'zlamaslik,aldamaslik, va'daga vafo qilish, faqat ezgu ishlarni amalga oshirish kerak edi.Zardushtiylar ta'limotida o'lim yovuzlik ifodasi hisoblangan.Shu bois vafot etgan odamlarni dafn qilishning alohida marosimi yuzaga kelgan. O'lgan odamni yerga dafn qilish, yondirish, suvga oqizish ham mumkin emas edi. Shu sababli yirtqich qushlar va hayvonlar yeb ketishi uchun jasadni toshli va qumli tepaliklarda qoldirishgan. Yomg'irlarda yuvilgan va oftobda poklangan suyaklarni maxsus sopol tobutchalar – ossuariylar (suyakdonlar)da dafn etishgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: "Avesto" qonun-qoidalari haqida ma'lumot bering.
JAVOB: Zardushtiylar bosqinchilik,talon-taroj va turarjoylarni vayron qilish kabi harakatlarni og'ir jinoyat deb hisoblagan. Qurolni qo'lga olib insonga do'q qilish, birovni kaltaklab, unga jarohat yetkazish qattiq jazoga loyiq ko'rilgan. O'g'rilik va qarzdorlikni "Avesto" gunoh deb hisoblaydi. Olgan qarzni qaytarib bermaslik o'g'rilikka tenglashtirilgan.Mehnat yuksak ehtirom bilan qadrlangan. "Avesto"da inson mehnat qilishi, biror hunar, binokorlik, dehqonchilik va chorvachilik bilan shug'ullanishi kerakligi aytiladi. Inson suv, o'simliklar va zaminning pokligini ta'minlashi, tabiatni asrab-avaylashi lozim."Avesto" oila va bolalar huquqlarini qat'iy muhofaza qiladi.Voyaga yetmagan bolalarni ota-onalaridan olib ketish, vasiysiz qoldirish qoralangan. Yosh bolalarga bilim berib,bironta hunarga o'rgatish qadrlangan, negaki "o'qish –ko'zning nuri" deb uqtirilgan.Zardushtiylar kuylagan qasidalarning biri "Quyosh madhi"da shunday deyilgan: Biz Quyoshni madh etamiz, Bezavol Nurni. Uchqur uning tulporlari, Qachon Quyosh nur taratadir, Qachon ilitadir Quyosh, Qoyim turar yuz ming abad Ma'budlar. Taqsimlaydi baxtni shunda Ahuramazda bu yerga. "Avesto" kishilarni tinchlikka, adolat va ezgulikka chorlagan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Kir II va uning bosqinchilik yurishlari haqida ma'lumot bering.
JAVOB: Kir II O'rta Osiyo hududini bosib olishga harakat qilgan birinchi fors hukmdorlaridan bo'lgan. U Parfiya, Marg'iyona va Baqtriyani bosib oldi. Mil. avv. 530-yilda Kir II ulkan lashkar bilan massagetlar ustiga yurish qildi. Shu davrda massagetlar qabilalarining malikasi To'maris edi.Bu yurish to'g'risida "tarix otasi" Gerodot shunday hikoya qiladi: "Bu jang... barcha janglardan ham dahshatlirog'i di. Oldin har ikki dushman kuchlar bir-biriga qarshi jangovar saf tizishib, kamondan o'q yog'dirdi. O'qlari tugagach,qo'llariga xanjar va nayzalar olib, dushmanga qarshi tashlandi.Jang uzoq davom etdi. Hech kim chekinishni xayoliga keltirmasdi. Ko'p qon to'kildi. Nihoyat, massagetlarning qo'li baland keldi. Fors qo'shinlarining ko'pchiligi qirildi.Jang maydonida Kir II ning o'zi ham halok bo'ldi".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Frada qo'zg'oloni haqida ma'lumot bering.
JAVOB: Doro I hukmronligining birinchi yili Marg'iyonada fors istilochilariga qarshi yirik xalq qo'zg'oloni ko'tarildi.Qo'zg'olonga Frada rahbarlik qiladi. Qo'zg'olonchilar bilan forslar qo'shinlari o'rtasidagi hal qiluvchi jang mil.avv. 522-yilda bo'lib o'tgan. Fradaning o'zi asirga olinadi va qatl etiladi. Bu voqea haqidagi ma'lumotlar Behistun qoyatosh yozuvlarida qayd etilgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Doro I ning saklarga qarshi yurishi haqida ma'lumot bering.
JAVOB: Doro I hukmronligining uchinchi yilida saklar ustiga yurish qiladi. Bu yurish haqida ham Behistun bitiklarida ma'lumot qoldirilgan. Bu yurish haqida ham Behistun bitiklarida shunday deyilgan:«Shoh Doro ayturki: keyin qo'shin bilan saklar mam lakatiga yurish qildim. Keyin uchi o'tkir kuloh ki yib yu ruv chi saklar janggi kirdilar. Men daryo dan o'tgach, saklarni tamoman tor-mor keltir dim, qolgan qismini asirga ol dim... U larning Skunxa degan sardorini qo'lga tu shirib, huzurimga keltirdilar. Shunda men u larga boshqa bir sardor tayinladim.Men shunday bo'lishini xohladim. So'ngra bu mamlakat menga tobe bo'ldi».Ayni paytda bu yurish haqida tarixchi Poliyen (mil. avv. II asr) keltirgan boshqa bir rivoyat ham mavjud. Saklar rivoyatida hikoya qilinishicha, forslarning qoshiga sak qabilasidan bo'lgan cho'pon – Shiroq keladi,u fors qo'shinlarini o'zidan boshqa hech kim bilmaydigan so'qmoq orqali saklarning orqa tomoniga boshlab borishini aytadi.Suvsiz cho'l-biyobon bo'ylab yetti kun yo'l bosishgach, tashnalikdan azob chekayotgan forslar o'zlarining aldanganliklarini sezib qoladi va jasur cho'ponni o'ldiradilar. Doro I ning saklar ustiga yurishi muvaffaqiyatsiz tugaydi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Doro I ning Behistun yozuvlaridagi xabari haqida ma'lumot bering.
JAVOB: "Marg'iyona degan mamalakat menga bo'ysun-may qo'ydi. Marg'iyonalik Frada ismli bir kishini ular o'zlariga boshliq tayinladi. Shunda men Baqtriya satrapi Dadarshishga chopar jo'natib: "Borib meni mensimay qo'yganlarni tor-mor qilish kerak",– dedim. Dadarshish qo'shinlari bilan marg'iyonaliklar ustiga yurish qildi. Meni Ahuramazda qo'lladi. Ahuramazda irodasi bilan isyonkorlar qo'shini butunlay yengildi".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Poliyen Shiroq jasorati haqida ma'lumot bering.
JAVOB: "Qo'shinlar Shiroq bilan yetti kunlikyo'lga tushdi, suvsiz sahroga kirib bordi. Mingboshi Ranosbat qulovizdan (yo'lboshlovchi) so'radi: "Buyuk shohimizni aldab, ko'p sonli qo'shinni bu suvsiz sahroga boshlab kelishga seni nima majbur qildi? Bu yerlarda qush uchsa – qanoti, odam yursa – oyog'i kuyadi. Na bir chashma, na bir jonzot uchraydi. Ilgari yurmoq yoki orqaga qaytmoqning imkoni yo'q". Shiroq qah-qah urib javob berdi: "Men yengdim. Saklarni halokatdan qutqazmoq uchun sizlarni tashnalik va ochlik balosiga giriftor qildim".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Ahamoniylar davlat boshqaruvi haqida ma'lumot bering.
JAVOB: Bosib olingan mamlakatlarni itoatda tutib turish uchun ahamoniylar yagona davlatni alohida viloyat – satrapiyalarga bo'lib tashladi. Bu so'z forscha "xshatra" – "viloyat" so'zidan kelib chiqqan. Satrapiyalar hukmdorlari – satraplarga cheklanmagan hokimiyat berilgan edi. Ularning ko'pchiligi Ahamoniylar sulolasi vakillari bo'lgan.O'rta Osiyoning forslar bosib olgan viloyatlari uch satrapiyaga bo'lingan. Har bir satrapiyadan fors shohiga yillik o'lpon-soliq yetkazib berilgan. Bundan tashqari, qaram xalqlar saroy va ibodatxonalar qurilishiga ham safarbar etilgan. Soliq sifatida kumush,chorva mollari (otlar, tuyalar, qo'ylar), hunarmandchilik buyumlari (sopol idishlar, qurol-yarog', zeb-ziynatlar),kiyim-kechak, matolar va hayvonlarning terilari berilar edi.Doro I va uning vorisi Kserks hukmronligi davrida egallab olingan hududlarda istiqomat qilgan o'rtaosiyoliklar yunon-fors urushlarida ishtirok etgan. Mashhur Marafon jangida (mil. avv. 490-yil) fors qo'shinlari safining markazida bo'lgan saklar muvaffaqiyatli urishgan.Gerodot fors shohi Kserks boshchiligida yunonlar ustiga yurish qilgan o'rtaosiyolik jangchilar qurolyarog'larini tasvirlagan. Baqtriyaliklar kamon va nayzalar bilan, saklar xanjar va jangovar boltalar bilan, xorazmiylar va sug'diylar baqtriyaliklarniki kabi qurol-aslahalari bilan jangga kirgan. Saklar va baqtriya suvoriylari Kserks qo'shinidagi eng yaxshi jangchilardan hisoblangan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Gerodotning massagetlar haqidagi hikoyasi haqida ma'lumot bering.
JAVOB: "Massagetlar skif (sak)lar singari kiyinadi. Turmush
tarzlari bir xil. Ular otda va piyoda jang qiladi. Odatda o'q-yoy, nayza va jangovar boltalar bilan qurollanadi.Ularning barcha buyumlari va asboblari oltin va misdan ishlangan. Nayzalarining va kamon o'qlarining uchi hamda harbiy boltalari misdan yasalgan. Bosh kiyimlari kamarlari oltin bilan bezatilgan. Otlari himoyalovchi sovut bilan yopilgan, ular ham misdan to'qilgan.Massagetlar g'alla ekmaydi, chorvachilik va baliq ovlash bilan kun kechiradi. Araks (Amudaryo)da baliq ko'p. Sut ichadilar. Ular ibodat qiladigan yagona tangri – Quyoshdir.Quyosh xudosiga otni qurbonlik uchun keltiradilarki, g'ayratli tangriga g'ayratli va tezchopar jonliqni qurbon qilish kerak deb hisoblaydilar".

SAVOL: Madaniyatning rivojlanishi haqida ma'lumot bering.
JAVOB: Mil. avv. VI – IV asrlarda madaniyatning rivojlanishi yozma va arxeologik manbalar asosida o'rganilgan. Ular O'rta Osiyo xalqlarining hunarmandchilik, zargarlik, tikuvchilik,kulolchilik va binokorlik sohala rida yuksak darajaga erishganligidan dalolat beradi.O'lkamizda Qiziltepa, Uzunqir, Yerqo'rg'on, Afrosiyob va boshqa shu kabi yirik qadimiy shahar-qal'alar ri vojlan gan. Yozma manbalarda oltin, kumush, la'l,fi ruza ma'danlari qazib olingani, hunarmandchilik rivojlangani, O'rta Osiyoning Sharq mamla katlari bilan bog'langan qadimiy karvon yo'llarida olib borilgan savdo-sotiq ishlari to'g'risida xabar beriladi. Mil. avv. V-IV asrlarda O'rta Osiyo hududida dastlabki tanga pullar tarqalgan. Zargarlik san'atining yuksak darajada rivoj topganiga bugungi kunda Britaniya muzeyida saqlanayotgan,1877-yilda Amudaryo xazinasidan topilgan oltin va kumush buyumlar yorqin misol bo'la oladi. Yangi kitob bo'yicha: Daryolar vohalarida Ko'ktepa (Zarafshon), Daratepa (Qashqadaryo), Xumbuztepa va Ko'zaliqir (quyi Amudaryo vohasi) kabi qadimiy hunarmandchilik markazlari rivojlangan. Yozma manbalarda mis, temir ma'danlari qazib olingani, O'rta Osiyoning Sharq mamlakatlari bilan bog'langan qadimiy karvon yo'llarida olib borilgan savdo-sotiq ishlari to'g'risida ma'lumot beriladi. Savdo karvonlari qaroqchilar hujumi va talonchiligidan himoya qilingan. Muhim savdo yo'llari o'tgan daryolar kechuvlari va tog' dovonlari bo'ylab harbiy istehkomlar qurilgan.

SAVOL: Suzadagi saroy qurilishi haqida Doro I yozuvi. Ma'lumot bering.
JAVOB: "Qurilishda ishlatilgan oltin Sard va Baqtriyadan olib kelindi. Olmos, la'l va yoqut Sug'diyonadan keltirildi. Qo'llangan to'q ko'k yoqut Xorazmdan,kumush va jez Misrdan olib kelindi".
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Sirli "Amudaryo xazinasi" haqida ma'lumot bering.
JAVOB: 1880-yil may oyi oqshomlarining birida Afg'onistonning janubida, Kobuldan uch kunlik yo'lda Peshovarga ketayotgan buxorolik savdogarlar karvoniga qaroqchilar hujum qiladi. Karvonda oltin buyumlar bulgan. Savdogarlardan birining xizmatkori qaroqchilar bandidan qochib, shu tumanning angliyalik harbiy-siyosiy noibi kapitan F. Berton harbiy postini oyoqqa turg'izadi. Berton yordamchilarini yoniga olib, qaroqchilar ketidan tushadi. Yarim tunda Berton to'satdan qaroqchilar qarshisidan chiqadi. Ular o'ljani bo'lishayotgandi. Shu oradagi g'orda to'satdan paydo bo'lgan zobitga qaroqchilar qarshilik ko'rsata olmaydi. ...Hindistonda savdogarlarning qimmatbaho narsalarini angliyaliklar sotib olib, Britaniya muzeyiga topshirishgan. 1905-yilda Britaniya muzeyining xazinachisi O. Dalton Buxoro savdogarlari xazinasi to'g'risida "Oks xazinasi" degan kitob yozdi. Savdogarlar so'zi bo'yicha, bu oltin buyumlar 1877-yili Qubodiyon vodiysidan, qadimgi Baqtriya yeridan topilgan. U yuqori badiiy uslubda ishlangan oltin va kumush buyumlar majmuidan iborat edi. Bu yuksak darajada ishlangan tasviriy san'at namunalari hamda tangalar fanda "Amudaryo (Oks) xazinasi" nomi bilan mashhur.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: O'rta osiyo xalqlarining qurol-yarog'i va harbiy san'ati haqida ma'lumot bering.
JAVOB: Jangchilar jangga sovut kiyib kirganlar, boshlarida dubulg'a bo'lgan.Xanjar, jangovar oybolta va nayzalar bilan qurollanganlar. Kamon o'qi va xanjar temir va bronzadan yasalgan. Jangchilar otda ham, piyoda ham jang qila olganlar.Xanjar – «akinak», jangovar oybolta esa «sagaris» deb nomlangan. Uzoq masofadan turib jang qilish quroli sifatida kamondan foydalanilgan.Jangovar otlar ustiga va ko'kragiga temirdan yasalgan bargustvon yopilgan. Qal'a va shaharlarni himoya qilishda o'q-yoy va palaxmondan foydalanilgan. Mudofaa maqsadida tosh va pishirilgan loydan tayyorlangan yadrolar qo'llangan. Shaharlar burjlar va shinaklari bo'lgan mustahkam devorlar bilan o'rab olingan. Devorlar tepasida kamonchilar uchun yo'laklar qurilgan.Tashqi devorlar bo'ylab joylashgan dumaloq burjlar ichida ham kamonchilar joylashgan. Suv to'ldirilgan chuqur va keng xandaq qal'aga boradigan yo'lni to'sib turgan.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Mil. avv. IV asrda Makedoniyaning yuksalishi haqida ma'lumot bering.
JAVOB: Mil. avv. 336-yilda Filipp II o'limidan so'ng uning 20 yoshga to'lgan o'g'li Aleksandr Makedoniya podshosi bo'ladi. Mil. avv. 334-yilda u Sharqqa yurish boshladi, bu yurish 10 yil davom etdi. Ana shu yurish davomida u Kichik Osiyo, Suriya, Misr, Eron va Hindistonda katta-katta hududlarni bosib oladi. Makedoniyalik Aleksandr ulkan hududda yunon madaniyati tarqalishiga imkon yaratish maqsadida bosib olingan shaharlarga yunonlarni joylashtirdi.
MANBA: 6-sinf O'zbekiston tarixi darsligi
SAVOL: Aleksandrning istilochilik yurishlari haqida ma'lumot bering.
JAVOB: Mil. avv. 330-yilda Makedoniyalik Aleksandr qadimgi Fors davlatining ahamoniylar sulolasidan bo'lgan oxirgi shohi Doro III qo'shinlarini tor-mor keltiradi. U Hindistonga yurish qilishdan oldin qo'shinlarning orqa tomonini xavfsizlantirish maqsadida Oks (Amudaryo) ortida yashovchi elatlarni bo'ysundirishga qaror qiladi.Birinchi bo'lib uning yo'lini to'sgan shahar Baqtriya poytaxti Baqtra (Zariasp) bo'ldi. Bu vaqtda ahamoniylar sulolasining vakili Bess Baqtriyaning satrapi edi. U Baqtra shahrini dushmanga tashlab, Oks ortiga
qochib o'tgan.

SAVOL: Aleksandrning O'rta Osiyoga istilochilik yurishlari haqida ma'lumot bering.
JAVOB: Mil. avv. 329-yilda Makedoniyalik Aleksandr qo'shinlari Oks – Amudaryodan o'tib oldilar. Qo'shinlar yurishlari yo'nalishida esa Nautaka (Qashqadaryo vohasining sharqiy qismi) va Maroqanda shahri (Samarqand) turar edi.Miloddan avvalgi 329-yilda yunon-makedonlar Maroqandani egalladi. Aleksandr qo'shinlarning bir qismini shu yerda qoldirib, o'zi Kurushkat (Kiropolis) shahrini bosib olish u chun asosiy kuchlar bilan Sirdaryo qirg'oqlari sari yurdi.Unga qarshi Spitamen kurash olib bordi. O'rta Osiyo yerlarini bosib olish uchun Aleksandr deyarli uch yil urindi, biroq uncha katta bo'lmagan hududni: Marg'iyona, Baqtriya, So'g'diyona, hozirgi Bekobod va Xo'jand orasida Sirdaryo bo'ylarini bo'ysundirishga muvaffaq bo'ldi, xolos. Xorazm, Toshkent vohasi va Farg'ona mustaqilligicha qoldi.

SAVOL: Spitamen jasorati haqida ma'lumot bering.
JAVOB: So'g'diyona xalqi bosqinchilarga qarshi kurashga chiqadi. Tez orada so'g'diylarga baqtriyaliklar va saklar qo'shiladilar. Qo'zg'olonga iste'dodli tashkilotchi va harbiy yo'lboshchi Spitaman boshchilik qiladi. Ancha qo'shin to'plagan Spitamаn Maroqandani qamal qildi. Aleksandr qamalda qolganlarga yordamga uch mingga yaqin jangchidan iborat qo'shin jo'natadi. Qadimda «Politimet» deb atalgan Zarafshon daryosi bo'yida makedonlarga pistirma qo'ygan Spitaman dushman guruhini tamomila qirib tashlaydi.Shunda Aleksandrning o'zi qo'zg'olonni bostirishga otlanadi. Yunonlarning katta kuchlari yaqinlashib kelayotganidan xabar topgan Spitaman qamalni to'xtatadi va o'z qo'shinlarini sahro sari boshlab ketadi. Mil. avv. 328-yil kuzida Spitamanning Aleksandr bilan hal qiluvchi jangi bo'lib o'tadi.Kuchlar teng bo'lmaganidan Spitaman yengilib,yana cho'lga chekinadi. O'sha yerda u xoinlarcha o'ldiriladi.

SAVOL: Qasos haqida ma'lumot bering.
JAVOB: Aleksandrning jangchilari Zarafshon daryosiga olib boradigan yo'ldan chang-to'zon ko'tarib kelardi....To'satdan o'qlar vizillab ucha boshladi. Butalar orasidan kamon o'qlari yog'ilardi. Dushman bexosdan hujum qildi. Makedoniyaliklar qo'rquvdan qotib qoldi.Yana pistirma!...Karanning buyruq aralash baqirig'I kor qilmadi. Vahimaga tushgan makedonlar ixtiyorlarini qo'ldan berib, qocha boshladi, biroq dushman piyoda jangchilari qamishzor orasidan ularning ro'parasiga chiqib, oyboltalarini ustalik bilan ishga soldi: g'animlarni yer tishlata boshladi.Frakiyalik, agrian, peon, makedoniyalik, fessaliyalik va illiriyaliklardan ikki ming nafar jangchi Zarafshon bo'yida abadiy qolib ketdi. Intiqom o'zini kuttirmadi. Halok bo'lgan jangchilarni Olimp tog'idagi xudolar ham ellinlar armiyasi safiga qaytarishga ojiz qoldi. Bu ulkan mag'lubiyat yunon-makedon qo'shinlarining yengilmasligi haqidagi afsonani chippakka chiqardi. Spitaman o'z muvaffaqiyatiga rivoj berib, makedoniyaliklarni Maroqanda qal'asida mudofaa choralarini ko'rishga majbur etdi. Osiyoliklarning suvoriylari makedonlar ustiga ot qo'ydi. Krater hujum qilib kelayotgan suvoriylarga qarshi toshotar qurollarini ishga soladi. Otilgan yuzlab toshlar otliqlar safiga shikast yetkazadi. Qo'rqib qolgan otlar kishnab, pishqirgancha ag'darilib tusha boshladi. Ajabo, suvoriylar o'zlarini yo'qotib qo'ymadi. Otlaridan sakrab tushib, darhol jangga shaylandi.Fessaliya otliqlari Baqtriya suvoriylari qanotiga hujum qildi. Baqtriyaliklar chekindi. Dunyoning eng sara otliqlari hisoblangan Fessaliya jangchilari zarbasiga osiyoliklar dosh bera olmadi. Kraterning ko'ngli joyiga tushdi. Fessaliya otliqlari dushmanning urush san'atlarini bir dam xayoldan chiqarib, ularni ta'qib qilishda davom etdi. Saklar va baqtriyaliklar hatto otda shamoldek yelib ketayotganda ham kamondan bexato ota olishini ular unutdi. Ellinlar kamondan o'q uzishda Geraklni tengi yo'q deb hisoblashardi. Oks ortida o'sha afsonaviy qahramondan ham mohir kamonchilar yashar ekan.

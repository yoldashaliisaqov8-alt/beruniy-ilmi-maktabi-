<style>
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
  .mode{padding:26px;cursor:pointer;text-align:left;font-family:var(--font);color:var(--ink);border:1.5px solid var(--line);background:#fff;border-radius:24px;}
  .mode:hover{border-color:var(--blue);background:#f4f8ff;}
  .mode h3{margin:0 0 6px;font-size:24px;font-weight:800;}
  .mode p{margin:0;color:var(--ink-soft);font-weight:600;font-size:16px;}
  .qhead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .qhead .tm{margin-left:auto;font-size:28px;font-weight:800;color:var(--blue);}
  .qhead .tm.low{color:var(--red);}
  .track{flex:1;min-width:140px;height:10px;border-radius:5px;background:#dde6f0;overflow:hidden;}
  .fill{height:100%;background:var(--blue);width:0;transition:width .3s;}
  .opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 22px;margin-bottom:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;font-family:var(--font);font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;}
  .opt:hover{border-color:var(--blue);background:#f4f8ff;}
  .opt .k{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-soft);}
  .opt.sel{border-color:var(--blue);background:#eaf2ff;}
  .opt.sel .k{background:var(--blue);border-color:var(--blue);color:#fff;}
  .opt.ok{border-color:var(--green);background:rgba(47,154,95,.12);}
  .opt.ok .k{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.no{border-color:var(--red);background:rgba(229,72,77,.08);}
  .opt.no .k{background:var(--red);border-color:var(--red);color:#fff;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;}
  .nav button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:var(--font);font-weight:800;cursor:pointer;color:var(--ink-soft);}
  .nav button.done{background:#dbe9ff;border-color:#9ec2ff;color:var(--blue-dark);}
  .nav button.cur{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset;color:var(--blue);}
  .rv{padding:18px 22px;margin-bottom:12px;border-radius:18px;border:1.5px solid var(--line);background:#fff;}
  .rv.bad{border-color:var(--red);} .rv.good{border-color:var(--green);}
  .rv b{font-weight:800;} .rv p{margin:6px 0 0;font-weight:600;color:var(--ink-soft);}
  .warn{background:rgba(229,72,77,.08);border:1px solid var(--red);color:#9a3a30;padding:14px 18px;border-radius:14px;margin-bottom:14px;font-weight:600;}
  @media (max-width:700px){.modes{grid-template-columns:1fr;}.opt{font-size:18px;padding:14px;}}
  @media (min-width:1000px){.opt{font-size:24px;padding:20px 26px;}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script></head>

<script type="text/plain" class="set" data-title="Pedagogik mahorat va kasb standarti — to'liq (134 savol)" data-desc="Attestatsiya savollari asosida, hamma savollar aralashtiriladi" data-time="134">
Yosh o'qituvchi dars davomida turli holatlarga duch keladi (yangi mavzuni tushuntirish, tanbeh berish va hokazo). Pedagogik ta'sir o'tkazishda e'tibor berilishi kerak bo'lgan jihatlarning to'g'ri ketma-ketligini aniqlang.
1. Pedagogik ta'sir ko'rsatish.
2. Optimal metodlarni tanlash.
3. Murakkab vaziyatdan chiqishning mumkin bo'lgan variantlarini saralash.
4. Vaziyatni tahlil qilish.
A) 1, 2, 3, 4
B) 4, 2, 3, 1
C) 4, 3, 2, 1
D) 3, 4, 2, 1
JAVOB: C

Sinf rahbari bir o'quvchining ba'zi fanlardan orqada qolayotganini aniqladi va unga o'zlashtirishda yordam tariqasida darsdan keyingi faoliyatga jalb etmoqchi. Ta'limni tashkil etishning mumkin bo'lgan variantlarini belgilang.
1. Fan to'garaklari
2. Fakultativ mashg'ulotlar
3. O'qituvchi maslahati
4. O'quv ekskursiyalari
5. O'quv konferensiyalari
A) 1, 2, 3
B) 2, 3, 4
C) 1, 3, 5
D) 1, 2, 3, 4, 5
JAVOB: D

Yosh mutaxassis yuqori sinf o'quvchilarini boshqara olmadi. Ma'naviy-ma'rifiy ishlar bo'yicha direktor o'rinbosari uning darsini kuzatib, pedagogning kommunikativ madaniyati juda muhimligini uqtirdi. Pedagogning kommunikativ madaniyati qanday bo'lishi kerak?
A) Pedagogning faqat o'quvchilar bilan rasmiy tarzda va qat'iy tartibda muloqot qilishi
B) Pedagogning o'quvchilar va atrofdagilar bilan qisqa muddatda muloqot o'rnatishga doimiy intilishi
C) Pedagogning o'z fikrini o'quvchilarga so'zsiz qabul qildirishga intilishi
D) Pedagogning muloqotdan qochib, faqat yozma topshiriqlar bilan cheklanishi
JAVOB: B

Quyidagi tadbirlarning qaysilari mustaqil kasbiy rivojlanishga omil bo'ladi?
1. Onlayn kurslarda o'qish
2. Hamkasblarning darsini kuzatish
3. Fanga oid maqolalar bilan tanishish
4. Turli seminar, trening, konferensiyalarda ishtirok etish
5. Hamkasblar bilan hordiq chiqarish
6. Xayriya tadbirlarida ishtirok etish
A) 1, 2, 5, 6
B) 3, 4, 5, 6
C) 2, 4, 5
D) 1, 2, 3, 4
JAVOB: D

Ota-onalarni ta'lim jarayonida ishtirok etishga jalb qilish uchun o'qituvchi qanday zarur bilimlarga ega bo'lishi lozim?
1. Samarali ijtimoiy muloqot asoslari
2. Insoniyatni o'qitish va tarbiyalashning zamonaviy nazariyalari
3. Yosh pedagogikasi, psixologiyasi asoslari
4. Inklyuzivlik tamoyilini amalga oshirish
A) 1, 3
B) 2, 4
C) 1, 2, 4
D) 3, 4
JAVOB: A

O'qituvchi dars davomida o'quvchilarning turli yo'nalishlarda fikrlash qobiliyatlarini rivojlantirish uchun 4K usulidan samarali foydalandi. Bunda u ta'lim samaradorligini ta'minlashda qanday mehnat harakatini amalga oshirdi?
A) O'quvchilarni baholashdan butunlay ozod qildi
B) Dars maqsadlari asosida o'quvchilar uchun erishimli vazifalarni belgiladi
C) Barcha topshiriqlarni bir xil murakkablikda berdi
D) Dars mavzusini o'quvchilarning o'zi tanlashiga imkon berdi
JAVOB: B

Bir guruh o'quvchilar loyiha ishi ustida juda ko'p mehnat qilib, darsda sinfdoshlari oldida taqdimot o'tkazdilar. O'qituvchi loyihada ba'zi kamchiliklar bo'lsa-da, vazifa yaxshi bajarilganligi va dolzarbligini aytib, guruh a'zolarini maqtadi. U nima uchun bunday qildi?
A) O'quvchilarning yutuqlarini baholash orqali ularni o'qishni davom ettirishga qiziqtirish uchun
B) Loyihadagi kamchiliklarni yashirib, guruhni jazolamaslik uchun
C) Guruhlar o'rtasida raqobatni kuchaytirish uchun
D) Dars vaqtini tejab, keyingi mavzuga tezroq o'tish uchun
JAVOB: A

Kechqurun maktab rahbariyati ustozga boshlang'ich sinf o'qituvchisi betob bo'lib qolgani va ertaga uning o'rniga ishga chiqish lozimligini xabar qildi. Shu kungacha ustoz faqat 5–7- sinflarga dars berib kelgan edi. Darsga tayyorgarlik ko'rish uchun u qaysi faoliyat turini to'g'ri tanlagan?
A) Darsning maqsadlari, o'quvchilarning yosh xususiyatlari va o'zlashtirishiga mos keladigan dars shakllari va usullarini rejalashtirish
B) 5–7-sinflarda qo'llagan dars konspektini o'zgartirmasdan ishlatish
C) Darsni faqat o'zi qulay deb bilgan usulda, yosh xususiyatlariga e'tibor bermay o'tish
D) Dars rejasini tuzmasdan, o'quvchilar bilan erkin suhbat o'tkazish
JAVOB: A

Direktor o'rinbosari tarbiya darsiga tahlil uchun kirdi. Yakunda o'qituvchining mashg'ulot davomida milliy ruh, madaniyatning go'zal durdonalari, buyuk alloma va olimlarning ishlari va fikrlaridan o'rinli foydalanganini ta'kidladi. Bu qanday dars tahlili?
A) Didaktik tahlil
B) Metodologik tahlil
C) Psixologik tahlil
D) Tuzilmaviy tahlil
JAVOB: B

O'qituvchi bir o'quvchining berilgan vazifani tezlik bilan, pala-partish bajarib, so'ng partaning bir chekkasida berkinib rasm chizayotganini sezib qoldi. Darsdan so'ng bolani tasviriy san'at ustozi oldiga olib borib, fan to'garagiga yozdirib qo'ydi. Bunda o'qituvchining qaysi qobiliyati namoyon bo'ldi?
A) Kinestetik qobiliyat
B) Mantiqiy qobiliyat
C) Voqealarni oldindan ko'ra olish qobiliyati
D) Eshitish va his qilish qobiliyati
JAVOB: C

Biologiya o'qituvchisi dars vaqtida o'quvchilarni maktab baliqxonasiga olib chiqib, mavzu bo'yicha topshiriq berdi. O'quvchilar topshiriqni bajarish jarayonida yangi bilimlarni egalladilar. O'qituvchi qanday usuldan foydalandi?
A) Ma'ruza
B) Suhbat
C) Hikoya
D) Amaliy
JAVOB: D

O'qituvchi sinfdagi o'quvchining matematikaga qobiliyati borligini inobatga olib, uni matematika olimpiadasiga tayyorlamoqchi bo'ldi. O'quvchi esa boshqa fandan qatnashishni xohladi, ammo o'qituvchi fikridan qaytmay uni matematikadan ishtirok etishga majbur qildi. Bunda ta'lim-tarbiyaning qaysi tamoyili buzilgan?
A) Ilmiylik tamoyili
B) Demokratik tamoyil
C) Izchillik tamoyili
D) Ko'rgazmalilik tamoyili
JAVOB: B

O'quvchilar bilan muloqot qilish madaniyatining individual shaxsiy xususiyatlari berilgan qatorni aniqlang.
1) O'quvchilar shaxsiy xususiyatlarini mustaqil tahlil qilish;
2) O'quvchilar ichki imkoniyatlariga har tomonlama tavsif berish;
3) Pedagogik faoliyatga monand muloqot madaniyati modelini ishlab chiqish;
4) O'qituvchining muloqot madaniyatini to'g'ri tashkil etishi.
A) 1, 2, 4
B) 1, 3, 4
C) 2, 3, 4
D) 1, 2, 3
JAVOB: A

Shaxsning individual-psixologik xususiyati bo'lib, muayyan faoliyat yuzasidan layoqati va ishni muvaffaqiyatli amalga oshirishning subyektiv shart-sharoitini ifodalovchi individual psixik sifatlar yig'indisi nima deyiladi?
A) Xarakter
B) Qobiliyat
C) Temperament
D) Moyillik
JAVOB: B

O'qituvchi yangi mavzuni ma'ruza tarzida tushuntirib berdi. Dars davomida u faol bo'lib, o'quvchilarga qaratilgan nutq so'zladi. Bunda o'qituvchi faoliyatida nutqning qaysi shakli namoyon bo'ldi?
A) Dialog
B) Polilog
C) Ichki nutq
D) Monolog
JAVOB: D

O'quvchining aniq ehtiyojlariga yo'naltirilgan barcha faoliyat turlarini moslashtirish nima deyiladi?
A) Ta'limni standartlashtirish
B) Ta'limni faollashtirish
C) Ta'limni individuallashtirish
D) Ta'limni intensivlashtirish
JAVOB: C

Nutqning asosiy xususiyatlari nechta talabdan kelib chiqadi?
A) 2
B) 4
C) 3
D) 5
JAVOB: B

Boshqa fan asoslarini o'zlashtirishga imkon beradigan qobiliyat turini ko'rsating.
A) Pedagogik qobiliyat
B) Ijodiy qobiliyat
C) Akademik qobiliyat
D) Kommunikativ qobiliyat
JAVOB: C

Pedagogik faoliyatni tashkil etish va ijtimoiy xulq-atvor ko'nikmalarini shakllantirish usullarini aniqlang.
1) pedagogik tahlil; 2) o'rganish; 3) mashq qilish; 4) tarbiyalovchi vaziyatlar; 5) musobaqa; 6) rag'batlantirish.
A) 1, 3, 4, 5
B) 2, 3, 4, 5, 6
C) 1, 2, 5, 6
D) 1, 2, 3, 4, 6
JAVOB: D

Boshlang'ich sinf o'quvchisi darslarda o'zini yomon tutib, o'qituvchisiga sinfdoshlari oldida gap qaytardi. Sinf rahbarining alohida suhbatlari natija bermadi. Rahbar bolaning or-nomusi, izzat-nafsi, his-tuyg'ularini ehtiyotkorlik bilan o'stirish kerakligini inobatga olgan holda uni koyidi. Bola qilgan ishidan xijolat bo'ldi. Sinf rahbari motivatsion metodlarning qaysi biridan foydalangan?
A) Rag'batlantirish
B) Istiqbol
C) Musobaqa
D) Uyaltirish
JAVOB: D

Pessimist insonga mos javoblarni toping.
1. Tushkunlikka moyil
2. Qiyinchilikka oson yengiladi
3. Orzusiga qanday erishishni biladi
4. Xushchaqchaq bo'ladi
5. Hamma narsaga qodirligini aytadi
6. O'ziga ishonmaydi
A) 3, 4, 5
B) 1, 2, 6
C) 1, 4, 6
D) 2, 3, 6
JAVOB: B

4K modelini nimalar tashkil qiladi?
1. Kreativ 2. Kritik 3. Kombinatorika 4. Kommunikatsiya 5. Kooperatsiya 6. Kollaboratsiya
A) 1, 2, 4, 6
B) 1, 3, 4, 5
C) 2, 3, 5, 6
D) 1, 2, 3, 4
JAVOB: A

Ziddiyatlarni hal qilish va sinfda muloqot qilish uchun ijobiy muhit yaratishda qo'llaniladigan faoliyatlarni belgilang.
1. Odob-axloq haqida davra suhbatlari uyushtirish
2. Do'stona muhitni qo'llab-quvvatlash
3. Bolalarni maktabdan tashqari to'garaklarga yo'naltirish
4. Tarbiyaviy ishlarda o'quvchilarning jinsi, yoshi, madaniy xususiyatlarini inobatga olish
5. O'quvchilarda bag'rikenglik, odob-axloq va hayotga tayyorgarlik ko'nikmalarini shakllantirish
A) 1, 3, 4, 5
B) 2, 3, 4
C) 1, 2, 4, 5
D) 1, 2, 3, 5
JAVOB: C

4-sinfda ingliz tili darsi. O'qituvchiga nafaqat o'z guruhida, balki kasal bo'lib qolgan o'qituvchining guruhida ham dars o'tish vazifasi berilgan. O'quvchilar o'zlarini juda yomon tutmoqdalar: baland ovozda gaplashmoqda, urishmoqda, bir-biriga qog'oz qushchalar otmoqda. O'qituvchi nima qilishi kerak?
1. O'quvchilar diqqatini qiziqarli ma'lumotlar bilan jalb etish.
2. Darsni shu holatda davom ettirish.
3. Ko'proq qiziqarli o'yinlar o'tkazib, diqqatni darsga qaratish.
4. O'quvchilarga tartib-intizom va o'quvchining majburiyatlari haqida talab qo'yish.
A) 1, 2, 3
B) 1, 3, 4
C) 2, 3, 4
D) 1, 2, 4
JAVOB: B

O'qituvchi o'quvchilar bilan maslahatlashib tadbir rejalashtirdi, har bir bola o'zi rol tanlab oldi. Bu qanday ta'lim uslubi?
A) Avtoritar
B) Liberal
C) Reproduktiv
D) Demokratik
JAVOB: D

Ta'lim samaradorligini oshirish uchun o'qituvchi darsda ko'rgazmali qurollardan foydalanishni rejalashtirdi. Qo'l ostida ko'rgazmali va tarqatma materiallar juda ko'p edi. To'g'ri tanlangan tarqatma materiallar qatorini belgilang.
A) Dars mavzusiga mos keladigan namoyish va tarqatma materiallar
B) Mavzudan tashqari, ammo qiziqarli ko'rgazmalar
C) O'qituvchi o'zi tayyorlagan barcha materiallar
D) Mavzuga bevosita aloqasi bo'lmagan eng ko'p miqdordagi materiallar
JAVOB: A

O'quvchilar Konstitutsiya kuniga bag'ishlangan tadbir uyushtirmoqchi bo'lib, boshqa sinf o'quvchilarini ham jalb etishlarini o'qituvchiga aytdilar. O'qituvchi vazifani mustaqil bajarishlari uchun barcha shart-sharoitlarni yaratib berdi. Tarbiyaviy faoliyatning qaysi yo'nalishlari amalga oshirilgan?
1. O'quvchilarning o'zini o'zi boshqarish organlari faoliyatini tashkil qilishda yordam berish va qo'llab-quvvatlash
2. O'quvchilarga zamonaviy ommaviy axborot vositalari dunyosida xavfsiz ishlashga yordam berish
3. O'quvchilarda kognitiv faollik, mustaqillik, tashabbuskorlik, fuqarolik pozitsiyasi madaniyatini rivojlantirish
4. O'quvchilarda fuqarolik kompetensiyalari va media savodxonligini shakllantirish
A) 1, 3
B) 2, 4
C) 1, 2
D) 3, 4
JAVOB: A

Kasbiy faoliyat turlari va mehnat vazifalarini moslashtiring.
1. O'z-o'zini rivojlantirish va kasbiy o'sish
2. Tarbiyaviy faoliyatni tashkil etish
3. Hamkasblar va ta'lim oluvchilarning ota-onalari bilan hamkorlik
4. Ta'lim samaradorligini ta'minlash
A. O'zaro darslarda qatnashish, ularni tahlil qilish, undan o'z kasbiy faoliyatida foydalanish
B. Ziddiyatlarni hal qilish, sinfda va undan tashqarida muloqot uchun ijobiy muhit yaratish
C. Tarbiyaviy muammolarni hal qilishda boshqa pedagogik xodimlar va mutaxassislarni maktab hayotiga jalb qilish
D. O'quvchilarning jamoaviy va hamkorlikdagi loyihaviy ishlarini tashkil etish
E. Darsdan tashqari turli madaniy tadbirlarda ishtirok etish
A) 1-B, 2-A, 3-C, 4-D
B) 1-A, 2-C, 3-B, 4-E
C) 1-A, 2-B, 3-C, 4-D

<script>
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  var sets=[], warns=[];

    var set={title:sc.dataset.title||'To\'plam',desc:sc.dataset.desc||'',time:+sc.dataset.time||0,qs:[]};
    sc.textContent.trim().split(/\n\s*\n/).forEach(function(block,bi){
      var q={text:[],opts:[],ans:-1,izoh:'',img:[]}, m;
      block.split('\n').forEach(function(l){l=l.trim();if(!l)return;
        if(m=l.match(/^([A-D])\)\s*(.+)$/))q.opts.push(m[2]);
        else if(m=l.match(/^JAVOB:\s*([A-D])/i))q.ans='ABCD'.indexOf(m[1].toUpperCase());
        else if(m=l.match(/^IZOH:\s*(.+)/i))q.izoh=m[1];
        else if(m=l.match(/^RASM:\s*(.+)/i))q.img.push(m[1]);
        else q.text.push(l);});
      if(q.text.length&&q.opts.length>=2&&q.ans>=0&&q.ans<q.opts.length){q.text=q.text.join('\n');set.qs.push(q);}
      else warns.push('"'+set.title+'": '+(bi+1)+'-blok o\'tkazib yuborildi (savol, kamida 2 variant va JAVOB: kerak).');
    });
    if(!set.time)set.time=Math.max(1,set.qs.length);
    sets.push(set);
  });
  if(warns.length)document.getElementById('warn').innerHTML='<div class="warn">'+warns.map(esc).join('<br>')+'</div>';
  var list=document.getElementById('list');
  sets.forEach(function(s,i){
    var d=document.createElement('div');d.className='card row';
    d.innerHTML='<div>'+esc(s.title)+'<small>'+esc(s.desc)+' · '+s.qs.length+' savol · '+s.time+' daqiqa</small></div><span class="arrow">›</span>';
    d.onclick=function(){pick(i);};list.appendChild(d);

    function k(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    var d=new Date(),key=k(d);st.days[key]=(st.days[key]||0)+1;st.total++;if(ok)st.correct++;else st.wrong++;
    var n=0,c=new Date();while(st.days[k(c)]){n++;c.setDate(c.getDate()-1);}if(n>(st.best||0))st.best=n;
    localStorage.setItem('tm_stats',JSON.stringify(st));}catch(e){}}

  // ---- holat ----
  var S=null, Q=[], picked=[], cur=0, mode='', tmr=null, left=0, finished=false, shown=[];
  function screen(id){['sList','sMode','sQuiz','sRes'].forEach(function(x){document.getElementById(x).classList.toggle('hidden',x!==id);});window.scrollTo(0,0);}
  function pick(i){S=sets[i];document.getElementById('mTitle').textContent=S.title;document.getElementById('mDesc').textContent=S.qs.length+' savol · imtihon vaqti: '+S.time+' daqiqa';screen('sMode');}
  document.getElementById('mBack').onclick=function(){screen('sList');};
  document.getElementById('modeP').onclick=function(){begin('P');};
  document.getElementById('modeE').onclick=function(){begin('E');};
  function begin(m){
    mode=m;finished=false;cur=0;
    // savollar va variantlar aralashtiriladi
    Q=shuffle(S.qs).map(function(q){
      var idx=shuffle(q.opts.map(function(_,i){return i;}));
      return {text:q.text,img:q.img,izoh:q.izoh,opts:idx.map(function(i){return q.opts[i];}),ans:idx.indexOf(q.ans)};
    });
    picked=Q.map(function(){return -1;});shown=Q.map(function(){return false;});
    screen('sQuiz');
    clearInterval(tmr);
    var tmEl=document.getElementById('tm');
    if(m==='E'){left=S.time*60;drawT();tmr=setInterval(function(){left--;drawT();if(left<=0){clearInterval(tmr);finish();}},1000);}
    else tmEl.textContent='';
    render();
  }
  function drawT(){var t=document.getElementById('tm');var mm=Math.floor(left/60),ss=left%60;t.textContent=mm+':'+String(ss).padStart(2,'0');t.className='tm'+(left<=60?' low':'');}
  function render(){
    var q=Q[cur];
    document.getElementById('qcount').textContent=(cur+1)+' / '+Q.length;
    document.getElementById('fill').style.width=(picked.filter(function(x){return x>=0;}).length/Q.length*100)+'%';
    document.getElementById('media').innerHTML=q.img.map(function(s){return '<img src="'+esc(s)+'" alt="" style="max-width:100%;border-radius:14px;margin-bottom:14px">';}).join('');
    var qt=document.getElementById('qtext');qt.className='qtext'+(q.text.length>170?' sm':'');qt.innerHTML=esc(q.text).split('\n').join('<br>');
    var o=document.getElementById('opts');o.innerHTML='';
    q.opts.forEach(function(t,i){
      var b=document.createElement('button');b.className='opt';
      var cls='';
      if(mode==='P'&&shown[cur]){cls=i===q.ans?' ok':(i===picked[cur]?' no':'');}
      else if(picked[cur]===i)cls=' sel';
      b.className+=cls;b.disabled=(mode==='P'&&shown[cur]);
      b.innerHTML='<span class="k">'+'ABCD'[i]+'</span><span>'+esc(t)+'</span>';
      b.onclick=function(){choose(i);};o.appendChild(b);
    });
    document.getElementById('exp').innerHTML=(mode==='P'&&shown[cur]&&q.izoh)?'<div class="ans">Izoh: '+esc(q.izoh)+'</div>':'';
    var bt=document.getElementById('qbtns');bt.innerHTML='';
    if(mode==='E'){
      var p=document.createElement('button');p.className='btn ghost';p.textContent='← Oldingi';p.disabled=cur===0;p.onclick=function(){go(-1);};bt.appendChild(p);
      var n=document.createElement('button');n.className='btn ghost';n.textContent='Keyingi →';n.disabled=cur===Q.length-1;n.onclick=function(){go(1);};bt.appendChild(n);
      var f=document.createElement('button');f.className='btn good';f.textContent='Tugatish';f.onclick=function(){
        var un=picked.filter(function(x){return x<0;}).length;
        if(un&&!confirm(un+' ta savolga javob berilmagan. Baribir tugatilsinmi?'))return;finish();};bt.appendChild(f);
    } else if(shown[cur]){
      var nx=document.createElement('button');nx.className='btn';nx.textContent=cur===Q.length-1?'Natijani ko\'rish':'Keyingi →';nx.onclick=function(){if(cur===Q.length-1)finish();else go(1);};bt.appendChild(nx);
    }
    var nv=document.getElementById('nav');nv.innerHTML='';
    Q.forEach(function(_,i){var b=document.createElement('button');b.textContent=i+1;
      b.className=(i===cur?'cur ':'')+(picked[i]>=0?'done':'');
      b.onclick=function(){if(mode==='E'){cur=i;render();}};nv.appendChild(b);});
    nv.style.display=mode==='E'?'flex':'none';
    document.getElementById('hint').style.display='block';
  }
  function go(d){var n=cur+d;if(n>=0&&n<Q.length){cur=n;render();}}
  function choose(i){
    if(finished)return;
    if(mode==='P'){if(shown[cur])return;picked[cur]=i;shown[cur]=true;rec(i===Q[cur].ans);}
    else picked[cur]=i;
    render();
  }
  function finish(){
    if(finished)return;finished=true;clearInterval(tmr);
    var ok=0;Q.forEach(function(q,i){if(picked[i]===q.ans)ok++;if(mode==='E'&&picked[i]>=0)rec(picked[i]===q.ans);});
    var pct=Math.round(ok/Q.length*100);
    document.getElementById('rScore').textContent=ok+' / '+Q.length;
    document.getElementById('rPct').textContent=pct+'%';
    document.getElementById('rMsg').textContent=pct>=86?'Ajoyib natija! Imtihonga tayyorsiz.':pct>=60?'Yaxshi, lekin xatolar ustida ishlang.':'Mavzularni takrorlab, yana urinib ko\'ring.';
    var rv=document.getElementById('review');rv.innerHTML='';
    Q.forEach(function(q,i){
      var good=picked[i]===q.ans;
      var d=document.createElement('div');d.className='rv '+(good?'good':'bad');
      d.innerHTML='<b>'+(i+1)+'. '+esc(q.text)+'</b><p>Sizning javobingiz: '+(picked[i]>=0?'ABCD'[picked[i]]+') '+esc(q.opts[picked[i]]):'javob berilmagan')+'</p>'+
        (good?'':'<p>To\'g\'ri javob: <b>'+'ABCD'[q.ans]+') '+esc(q.opts[q.ans])+'</b></p>')+(q.izoh?'<p>Izoh: '+esc(q.izoh)+'</p>':'');
      rv.appendChild(d);
    });
    screen('sRes');
  }
  document.getElementById('rAgain').onclick=function(){screen('sMode');};
  document.getElementById('rList').onclick=function(){screen('sList');};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('sQuiz').classList.contains('hidden'))return;
    var k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
    if(map[k]!==undefined&&map[k]<Q[cur].opts.length){e.preventDefault();choose(map[k]);}
    else if(e.key==='ArrowRight'&&mode==='E')go(1);
    else if(e.key==='ArrowLeft'&&mode==='E')go(-1);
    else if((e.key==='Enter'||e.key===' ')&&mode==='P'&&shown[cur]){e.preventDefault();if(cur===Q.length-1)finish();else go(1);}
  });
</script></body></html>

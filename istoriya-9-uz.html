а-хан II","Кучкунджи-хан","Суюнчходжа"],1],["В какой династии наследника престола называли «навваб», «калга», «малый хан»?",["Тимуриды","Аштарханиды","Шейбаниды","Мангыты"],2],["Определите лицо, назначенное наследником престола после того, как Кучкунджи-хан стал верховным правителем.",["Убайдулла-хан","Абдулла-хан II","Джанибек-султан","Суюнчходжа"],3],["Определите лицо, назначенное наследником престола после смерти Суюнчходжи.",["Убайдулла-хан","Абдулла-хан II","Джанибек-султан","Абу Саид"],2],["Определите представителя Шейбанидов, умершего в 1529 году.",["Убайдулла-хан","Абдулла-хан II","Джанибек-султан","Абу Саид"],2],["Определите территорию, которая по порядку, введённому Абдулла-ханом II, передавалась в управление наследнику престола.",["Мерв","Куляб","Самарканд","Балх"],3],["Определите обладателя следующей должности. Он считался крупным сановником при дворе. Лицо, занимавшее эту должность, было самым близким и доверенным человеком верховного правителя и на церемониях ханских приёмов сидело совсем рядом с ним. Признавался главным советником хана по вопросам внутренней и внешней политики, а также военным делам.",["Аталык","Накиб","Парваначи","Додхох"],1],["Определите обладателя должности, отвечавшего за воспитание царевичей и назначавшегося из числа крупных эмиров племён.",["Аталык","Накиб","Парваначи","Додхох"],0],["Обладатель какой должности выполнял обязанность доведения указов и ярлыков верховного правителя до исполнителей и назначенных сановников?",["Аталык","Накиб","Парваначи","Додхох"],0],["Определите обладателя должности, который принимал письма с жалобами и просьбами населения, отвечал на них и контролировал соблюдение порядка правосудия в стране.",["Аталык","Накиб","Парваначи","Додхох"],3],["Определите обладателя должности, который принимал послов, организовывал их встречу и проводы, а также сам ездил послом в другие страны.",["Аталык","Накиб","Парваначи","Додхох"],3],["Обладатель какой должности считался одним из самых близких людей верховного правителя и династии и, как правило, был молочным братом кого-либо из представителей правящей династии?",["Кукельдаш","Диванбеги","Диван-и саркар-и хасса","Ханский ясаул"],0],["Под каким названием в источниках встречается особая структура, ведавшая управлением, контролем и налогами с земель, вод и имущества, принадлежавших правящей династии?",["Кукельдаш","Диванбеги","Диван-и саркар-и хасса","Ханский ясаул"],2],["Обладатель какой должности выполнял обязанности главного визиря?",["Кукельдаш","Диванбеги","Диван-и саркар-и хасса","Ханский ясаул"],1],["Определите обладателя должности, который ежедневно отчитывался перед верховным правителем о важных делах страны, имуществе, финансах, налогах, земельно-водных вопросах и назначениях на должности.",["Кукельдаш","Диванбеги","Диван-и саркар-и хасса","Ханский ясаул"],3],["Определите обладателя должности, на которого были возложены безопасность дворца, порядок и осведомлённость о прибывающих и убывающих.",["Миршаб","Мушриф","Эшик-ага","Мирахур"],2],["Определите обладателя должности, на которого было возложено ведение записей о дарованных правителем одеждах, военном снаряжении, а также о хирадже, собранном по налоговым книгам.",["Миршаб","Мушриф","Эшик-ага","Мирахур"],1],["Определите обладателя должности — начальника ночной стражи.",["Миршаб","Мушриф","Эшик-ага","Мирахур"],0],["Определите обладателя должности, отвечавшего за табуны, верховых лошадей верховного правителя и их содержание.",["Миршаб","Мушриф","Эшик-ага","Мирахур"],3],["Определите обладателя должности, ведавшего приёмом иностранных послов.",["Туксаба","Кушбеги","Шигаул","Кази-аскар"],2],["Определите обладателя должности, который разливал еду и напитки.",["Туксаба","Кушбеги","Шигаул","Кази-аскар"],0],["Определите обладателя должности, отвечавшего за охотничье оружие, ловчих птиц и собак.",["Туксаба","Кушбеги","Шигаул","Кази-аскар"],1],["В период правления какого правителя развивалось военное искусство?",["Убайдулла-хан","Абдулла-хан II","Кучкунджи-хан","Суюнчходжа"],1],["В

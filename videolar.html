<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videolar — Beruniy ilmi maktabi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
  .vcard{overflow:hidden;}
  .vcard .frame{position:relative;padding-top:56.25%;background:#10223d;}
  .vcard iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .vcard .info{padding:16px 20px 20px;}
  .vcard h3{margin:0 0 4px;font-size:19px;font-weight:800;}
  .vcard p{margin:0;color:var(--ink-soft);font-weight:600;font-size:15px;}
  .linkbtn{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;color:#fff;font-weight:800;font-size:18px;}
  .empty{padding:36px;text-align:center;color:var(--ink-soft);font-weight:600;font-size:18px;}
  .empty code{background:#eef2f6;padding:2px 8px;border-radius:8px;color:var(--ink);font-size:15px;}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script></head>
<body><div class="wrap">
<div class="top"><a class="back" href="index.html" aria-label="Orqaga">←</a><span class="brand">BERUNIY ILMI MAKTABI</span></div>
<h1>Videolar</h1>
<p class="sub">Dars videolari va qiziqarli tarixiy lavhalar</p>
<div class="grid" id="grid"></div>

<!--
  VIDEO QO'SHISH: pastdagi blokka har bir videoni bitta qatorga yozing:
      Sarlavha | YouTube havolasi | Qisqa tavsif
  Misol (oldiga "//" qo'ymasdan yozing):
      Yuz yillik urush | https://www.youtube.com/watch?v=VIDEO_ID | 8-sinf dars videosi
  Telegram yoki boshqa sayt havolasi bo'lsa, "Videoni ochish" tugmasi chiqadi.
-->
<script type="text/plain" id="videoData">
</script>
</div>
<script>
  function ytId(u){
    var m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  var lines = document.getElementById('videoData').textContent.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var grid = document.getElementById('grid');
  if (!lines.length) {
    grid.innerHTML = '<div class="card empty" style="grid-column:1/-1">Hozircha video qo\'shilmagan.<br><br>Qo\'shish uchun <code>videolar.html</code> faylidagi izohni o\'qing va qatorni <code>Sarlavha | YouTube havolasi | Tavsif</code> ko\'rinishida yozing.</div>';
  }
  lines.forEach(function(line){
    var p = line.split('|').map(function(x){return x.trim();});
    var title = p[0], url = p[1] || '', desc = p[2] || '', id = ytId(url);
    var media = id
      ? '<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen loading="lazy" title="'+esc(title)+'"></iframe>'
      : '<a class="linkbtn" href="'+esc(url)+'" target="_blank" rel="noopener">▶ Videoni ochish</a>';
    var el = document.createElement('div'); el.className = 'card vcard';
    el.innerHTML = '<div class="frame">'+media+'</div><div class="info"><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></div>';
    grid.appendChild(el);
  });
</script></body></html>

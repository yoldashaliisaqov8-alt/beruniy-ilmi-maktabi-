<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanlar — Beruniy ilmi maktabi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script></head>
<body><div class="wrap">
<div class="top"><a class="back" href="index.html" aria-label="Orqaga">←</a><span class="brand">BERUNIY ILMI MAKTABI</span></div>
<h1>Fanlar</h1>
<p class="sub">Fanni tanlang va testni boshlang</p>
<div class="list" id="list"></div>
</div>
<script>
  // Yangi fan qo'shish: ro'yxatga bitta qator yozing.
  // href — fan testi sahifasi. href bo'lmasa "Tez orada" bo'lib turadi.
  var subjects = [
    {name:"Tarix (Mavzulashgan)", note:"6-sinf Qadimgi dunyo (1128 ta test) 7-sinf O'zbekiston tarixi (818) va Jahon tarixi (993), 8-sinf O'zbekiston tarixi (860) va Jahon tarixi (1287), 9-sinf O'zbekiston tarixi (1133) va Jahon tarixi (2122), 10-sinf O'zbekiston tarixi (1125) va Jahon tarixi (888), 11-sinf O'zbekiston tarixi (595) va Jahon tarixi (413 ta test)", href:"test.html"},
    {name:"Istoriya (История — rus tilida)", note:"Tarix fanidan ruscha testlar: attestatsiya 3- va 4-variantlar va boshqalar", href:"istoriya.html"},
    {name:"Huquqshunoslik (Mavzulashgan)", note:"Davlat va huquq asoslari darsligi bo'yicha: 8-sinf (487), 9-sinf (453), 10-sinf (428) va 11-sinf (304 ta test)", href:"huquq-test.html"},
    {name:"Huquqshunoslik (Suhbat savollari)", note:"8–11-sinf savol-javoblar (651 ta), darslik manbasi bilan", href:"huquq.html"},
    {name:"Ingliz tili (Mavzulashgan)"},
    {name:"Biologiya (Mavzulashgan)"},
    {name:"Matematika (Mavzulashgan)"},
    {name:"Fizika (Mavzulashgan)"}
  ];
  var list = document.getElementById('list');
  subjects.forEach(function(s){
    var el = document.createElement(s.href ? 'a' : 'div');
    el.className = 'card row' + (s.href ? '' : ' soon');
    if (s.href) el.href = s.href;
    el.innerHTML = '<div>' + s.name + (s.note ? '<small>' + s.note + '</small>' : '') + '</div>' +
      (s.href ? '<span class="arrow">›</span>' : '<span class="pill" style="margin-left:auto">Tez orada</span>');
    list.appendChild(el);
  });
</script></body></html>

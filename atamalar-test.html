hur bosh kiyimlari.\ne) Bosh vazir; mamlakat moliyasi, soliq, yer-suv va mansabga tayinlash haqida xonga har kuni hisobot bergan.",["I-b, II-e, III-d, IV-a","I-b, II-a, III-c, IV-e","I-c, II-a, III-e, IV-d","I-b, II-c, III-d, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Otaliq (Mang'itlar)\nII. Amlokdor\nIII. Yershi\nIV. Qo'rchiboshi\na) Qurol-aslahaga mas'ul.\nb) Egarchi usta.\nc) Soliq undiruvchi mansabdor.\nd) Xivaning tashqi qal'asi (katta halqa ichidagi qism).\ne) Shahzodalar tarbiyasiga mas'ul; Samarqand–Buxoro oralig'idagi sug'orish ishlariga ham javobgar.",["I-c, II-d, III-e, IV-a","I-e, II-a, III-b, IV-d","I-e, II-c, III-b, IV-a","I-e, II-d, III-b, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Chilla\nII. Devoni sarkorixossa\nIII. Ushur (qoraqalpoqlarda)\nIV. Garmoba\na) Ruhoniylar uchun aholidan olingan soliq.\nb) Qo'qonda tayyorlangan, Hindistonda mashhur bo'lgan ipak navi.\nc) Aholining arz-dodi va iltimoslarini qabul qilib javob qaytaruvchi, adolat tartiblariga rioya qilinishini nazorat qiluvchi amaldor; elchilarni qabul qilgan.\nd) Hukmron sulolaga tegishli yer-suv, mol-mulk va soliq ishlarini yurituvchi maxsus tuzilma.\ne) O'rta asrlarda Buxoro hammomlarining nomi.",["I-b, II-c, III-d, IV-a","I-e, II-d, III-a, IV-b","I-b, II-d, III-a, IV-e","I-d, II-e, III-a, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tog'ar\nII. Beklarbegi\nIII. Hokim\nIV. Mehtar\na) Bosh vazir; oliy hukmdordan keyingi ikkinchi shaxs; poytaxt va viloyat hokimi ham sanalgan.\nb) Qo'shin ta'minoti uchun undirilgan oziq-ovqat solig'i.\nc) 1831-yilda Muhammad Alixon Toshkent hokimiga bergan unvon.\nd) Xon tayinlagan viloyat boshlig'i; ma'muriy, moliyaviy va sud ishlarini bajargan.\ne) Xivada bosh vazir (vaziri a'zam, dasturi mukarram, nizom ul-mulk).",["I-b, II-a, III-e, IV-d","I-b, II-c, III-d, IV-e","I-d, II-c, III-e, IV-b","I-b, II-c, III-d, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanobona\nII. Suyurg'ol, tiul, iqto, tanho\nIII. Oqsoqol\nIV. Ashrafiy\na) Tanob puli va alaf pulining yagona nomi.\nb) Shayboniylar davridagi oltin tanga.\nc) Davlat yerlari amaldorlarga tortiq etiladigan yer berish shakllari.\nd) Quyi ma'muriyat vakili; huquq-tartibot ishlarini nazorat qilgan.\ne) O'rta asrlarda Buxoro hammomlarining nomi.",["I-b, II-c, III-d, IV-a","I-c, II-e, III-d, IV-b","I-a, II-c, III-d, IV-b","I-c, II-d, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Zakot\nII. Pilta miltiq\nIII. Mirshab\nIV. Navkariya\na) Buxoro amirligidagi muntazam qo'shin.\nb) Musulmon daromadining 1/40 qismi; ko'chmanchilar 40 qo'ydan 1 qo'y to'laganlar.\nc) Tungi qo'riqlash boshlig'i.\nd) Uzun dastali jang boltasi.\ne) O'tsochar miltiq.",["I-c, II-e, III-a, IV-d","I-c, II-e, III-b, IV-a","I-b, II-e, III-c, IV-a","I-a, II-e, III-c, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Otaliq\nII. Vaqf yerlari\nIII. Qozikalon\nIV. Halqali ko'ylak\na) Masjid, madrasa, maktabxona, xonaqoh, mozorlarga qarashli yerlar.\nb) Shahzodalar tarbiyasiga mas'ul amaldor; mahalliy boshqaruvda ham muhim rol o'ynagan.\nc) Muntazam qo'shindagi piyoda askar (1837, Amir Nasrullo islohoti).\nd) Poytaxt (Buxoro) qozisi, bosh qozi; viloyat qozilari unga bo'ysungan.\ne) Ola shoyidan tikilib, qo'shaloq chillak kashtali bayram ko'ylagi.",["I-b, II-a, III-d, IV-e","I-c, II-a, III-e, IV-b","I-b, II-d, III-a, IV-c","I-a, II-d, III-b, IV-e"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Registon\nII. Lalmi yer\nIII. Eshik og'asi\nIV. Shayxulislom, muftiy, qozi\na) Moliya vaziri; quyi qushbegi; zakot yig'ishga mutasaddi.\nb) Yomg'ir suviga tayanib dehqonchilik qilinadigan yer.\nc) «Qumloq joy» degan ma'noni anglatadi.\nd) Shariat qonunlari bo'yicha intizom va tartibni saqlagan diniy-huquqiy mansabdorlar.\ne) Saroy xavfsizligi, tartibi va keldi-ketdidan xabardorlik uchun mas'ul.",["I-c, II-b, III-e, IV-d","I-e, II-b, III-c, IV-a","I-b, II-c, III-a, IV-d","I-b, II-c, III-e, IV-a"],0]]],["9-sinf O'zbekiston tarixi atamalari (2-to'plam)",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xon navkarlari\nII. Amlok\nIII. Davlat yeri (mulki xam)\nIV. Amlokdor\na) Ko'chmanchi jamoalarga berilgan, soliq to'langan, sotilmagan yer.\nb) Eng quyi ma'muriy bo'linma (bir necha qishloq birlashmasi).\nc) Kichik qishloqlar; yer maydoni va aholi soniga qarab tasniflangan.\nd) Amlokka rahbarlik qilgan amaldor.\ne) Muhammad Rahimxon I davrida tuzilgan 2 ming kishilik muntazam qo'shin.",["I-b, II-c, III-e, IV-d","I-e, II-a, III-d, IV-c","I-e, II-b, III-a, IV-d","I-b, II-a, III-e, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Miltiq puli\nII. Jul\nIII. Tabarzin\nIV. Qoracherik\na) Jang boltasi.\nb) Otni himoya qiluvchi zirhli to'shama.\nc) Kichik qishloqlar; yer maydoni va aholi soniga qarab tasniflangan.\nd) Nomuntazam qo'shin.\ne) Harbiy xarajatlarni qoplash uchun joriy etilgan soliq (kambag'allarga 2,5 tilla, boylarga 5 tilla).",["I-d, II-c, III-a, IV-e","I-e, II-d, III-c, IV-b","I-c, II-b, III-d, IV-a","I-e, II-b, III-a, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanho (Mang'itlar)\nII. Naqib (Xiva)\nIII. Qorovul\nIV. Harbiy vazir (lashkar to'pchiboshi)\na) Tungi qo'riqlash boshlig'i.\nb) Harbiy ishlar rahbari, qo'shin boshlig'i.\nc) Payg'ambar avlodlari vakili; diniy hayot va ta'lim nazoratchisi.\nd) Umumiy qo'shinni himoya qiluvchi orqa qism (himoya kuchi).\ne) Mansabdor shaxsga berilgan yer; undan olinadigan soliqlarning bir qismi unga tegishli bo'lgan.",["I-e, II-b, III-d, IV-a","I-e, II-b, III-c, IV-a","I-e, II-c, III-d, IV-b","I-a, II-c, III-d, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Shig'ovul\nII. Amlokdor (Mang'itlar)\nIII. Sahhoflik\nIV. Kuloh\na) Elchilarni qabul qiluvchi va kuzatuvchi amaldor.\nb) Qoraqalpoqlarda so'z ustalari.\nc) Hosil hisobini yurituvchi, soliq va tushumlarni yig'uvchi mansabdor.\nd) Qo'lyozma kitob tayyorlash sohasi.\ne) Kigizdan tikilgan konus shaklidagi bosh kiyim.",["I-b, II-e, III-d, IV-c","I-a, II-c, III-d, IV-e","I-e, II-c, III-b, IV-a","I-c, II-b, III-d, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kuyak\nII. Samarqand baxmali\nIII. Rais (qozi rais)\nIV. Qal'abon\na) Shayboniylar davrining eng mashhur matosi (to'qimachilikning eng rivojlangan sohasi).\nb) Hosildan olinadigan o'nlik soliq (1/10).\nc) Harbiy qal'alar qurilishi, ta'miri va mudofaasi uchun mas'ul.\nd) Parchin qoplangan mashhur zirh turi.\ne) Shariatga amal qilinishini va bolalarning maktabga borishini nazorat qilgan.",["I-d, II-a, III-e, IV-c","I-d, II-b, III-e, IV-c","I-d, II-c, III-a, IV-e","I-e, II-b, III-d, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xiroj (mol)\nII. Mirzo\nIII. Tuman (Mang'itlar)\nIV. Abdullaxon timi\na) 1577-yilda Buxoroda qurilgan yirik, usti berk bozor.\nb) Rus manbalarida Dashti Qipchoqning nomi (Vizantiyada «kumanlar», sharqda «qipchoqlar»).\nc) Sug'oriladigan yer miqdoriga qarab belgilangan hududiy birlik.\nd) Asosiy soliq, ya'ni yer solig'i.\ne) Kotiblik ishlarini olib borgan amaldor.",["I-e, II-c, III-d, IV-a","I-c, II-d, III-e, IV-a","I-d, II-c, III-b, IV-a","I-d, II-e, III-c, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanho\nII. A'lam\nIII. Oq jegde\nIV. Alaf puli\na) Davlat xizmatchilariga xizmat evaziga berilgan, lekin shaxsiy mulk bo'lmagan yer; tanhodor xizmatdan ketganda qaytarilgan.\nb) Bedazorlar uchun olingan soliq.\nc) Muftiylar ishiga rahbarlik qilgan shaxs.\nd) Xonning xos va sirdosh mulozimi, yaqin maslahatchi.\ne) Keksa ayollar uchun oq rangli yopinchiq kiyim.",["I-a, II-c, III-e, IV-b","I-a, II-d, III-c, IV-b","I-b, II-c, III-d, IV-a","I-b, II-d, III-e, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Bevatan, koranda, vaqfchi\nII. Otaliq (Shayboniylar)\nIII. Yalavoch\nIV. Qurchi\na) Shahzodalar tarbiyasi bilan shug'ullangan, ko'pincha yoshi katta amir.\nb) Harbiy qurolsozlik ustaxonasining rahbari.\nc) Qadimgi va o'rta asrlarda turkiylarda elchi, xabarchilarga nisbatan ishlatilgan atama.\nd) Xonni himoya qiluvchi soqchi, shaxsiy qo'riqchi.\ne) Davlat, xususiy va vaqf yerlarini ijaraga oluvchilar.",["I-a, II-b, III-e, IV-d","I-e, II-a, III-b, IV-c","I-c, II-a, III-d, IV-e","I-e, II-a, III-c, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanob puli\nII. Parvonachi (Mang'itlar)\nIII. To'qsabo (bayroqdor)\nIV. Dodxoh (Mang'itlar)\na) Amir yorliqlarini yetkazuvchi, arab aholisi ishlari bilan shug'ullanuvchi mansabdor.\nb) Jabrlanuvchilarning arzini amirga yetkazuvchi va javobini olib beruvchi shaxs.\nc) Sug'oriladigan yer miqdoriga qarab belgilangan hududiy birlik.\nd) Davlat bayrog'ining saqlanishi uchun javobgar, marosimlarda amir dasturxoniga taom tortuvchi.\ne) Bog' va polizlar uchun olingan soliq.",["I-c, II-e, III-d, IV-b","I-e, II-d, III-b, IV-c","I-e, II-a, III-d, IV-b","I-c, II-d, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Salg'ut\nII. Chanoh\nIII. O'zbek ulusi\nIV. Sovut\na) Qo'shinning o'ng va chap qanotlarini himoya qiluvchi bo'linma.\nb) 1428-yilda Abulxayrxon tuzgan davlat; poytaxti Tura (G'arbiy Sibir) shahri.\nc) Boshni himoya qiluvchi po'lat bosh kiyim.\nd) Xivada asosiy yer solig'i.\ne) Askarni himoya qiluvchi po'lat zirh kiyim.",["I-b, II-a, III-d, IV-c","I-a, II-d, III-b, IV-c","I-d, II-a, III-b, IV-e","I-c, II-a, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Bosh inoq\nII. Suvbo'yi, Tog'bo'yi\nIII. Chek yerlar\nIV. Mulki huri xolis (Qo'qon)\na) Amlok yerlarining uchinchi turi.\nb) Amir buyrug'ini yetkazish, ijrosini kuzatish, kadrlarni tayyorlashga mas'ul amaldor.\nc) Xonning maxsus yorlig'i bilan berilgan xususiy yer.\nd) Xiva xonligining Amudaryo orqali ikkiga bo'lingan qismlari: dehqonchilik hududi va chorvachilik (Ko'petdog' tog' oldi) hududi.\ne) Hosildan olinadigan o'nlik soliq (1/10).",["I-a, II-e, III-b, IV-c","I-e, II-d, III-b, IV-a","I-b, II-d, III-a, IV-c","I-e, II-d, III-c, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanga, tangacha, xoniy\nII. Minglik\nIII. Ovul\nIV. Viloyat (beklik)\na) Amirlikda 27 ta bo'lgan; ularni beklar (hokimlar) boshqargan.\nb) Kumush tangalar.\nc) 1000 kishilik, o'z tug'iga ega asosiy jang birligi.\nd) Qoraqalpoqlarning eng kichik ma'muriy birligi; unga Oqsoqollar kengashi rahbarlik qilgan.\ne) Davlat xavfsizligi xizmati rahbari.",["I-b, II-c, III-d, IV-a","I-b, II-d, III-e, IV-a","I-a, II-c, III-e, IV-d","I-a, II-b, III-d, IV-e"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Amin\nII. Navkarlar\nIII. Tofandoz\nIV. Biylar biyi\na) Tajribali otliq jangchilar; zarur bo'lsa piyoda ham jang qilganlar.\nb) Soliq yig'uvchi amaldor.\nc) Diniy va axloqiy tartiblarni nazorat qilgan amaldorlar.\nd) To'fang (miltiq) bilan qurollangan askarlar guruhi.\ne) Qoraqalpoq biylarining boshlig'i.",["I-e, II-b, III-d, IV-a","I-b, II-a, III-d, IV-e","I-a, II-b, III-d, IV-e","I-b, II-e, III-d, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Zabongiri\nII. Begar\nIII. Mulk yerlar\nIV. Zakot (Mang'itlar)\na) Suyurg'ol va tanho shaklida berilgan yerlar.\nb) Dushmandan asir olish bilan shug'ullanuvchi jangchi yoki bo'linma.\nc) Chorvador va savdogarlardan olinadigan diniy soliq; mol-mulkning 2,5%.\nd) Har yili 12 kunlik mehnat majburiyati.\ne) Payg'ambar avlodlari vakili; diniy hayot va ta'lim nazoratchisi.",["I-c, II-d, III-b, IV-e","I-b, II-c, III-d, IV-e","I-b, II-d, III-a, IV-c","I-a, II-e, III-b, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Shig'ovul (Mang'itlar)\nII. Navkariya\nIII. Sulton\nIV. Dor ush-shifo\na) Xonadonning boshqa a'zolari (shahzodalar) shunday atalgan.\nb) Subhonqulixon Buxoro Registonida qurdirgan sakkiz burchakli kasalxona (shifoxona va madrasa vazifasini o'tagan).\nc) Muntazam qo'shin (Qo'qonda Olimxon 1805-yilda tuzgan 10 ming kishilik armiya).\nd) Elchilar qabulini tashkil etuvchi amaldor.\ne) Xonlikdagi eng oliy diniy unvon.",["I-d, II-c, III-a, IV-b","I-d, II-c, III-b, IV-e","I-c, II-d, III-a, IV-b","I-b, II-c, III-a, IV-e"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Katta va kichik g'ullar\nII. To'lg'am\nIII. Qilquyruq, qora qozon, qora chechak, qoracherik\nIV. Amlok (Mang'itlar)\na) Harbiy qal'alar qurilishi, ta'miri va mudofaasi uchun mas'ul.\nb) Xon va sarkardalarni himoya qiluvchi maxsus bo'linma.\nc) Eng quyi ma'muriy birlik; bir necha qishloqdan iborat, uni amlokdor boshqargan.\nd) XVIII–XIX asrlardagi nomuntazam qo'shinlarning nomlari.\ne) Shayboniyxon janglarda qo'llagan aylanma hujum usuli.",["I-b, II-e, III-d, IV-c","I-b, II-d, III-a, IV-e","I-b, II-a, III-c, IV-e","I-d, II-e, III-a, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dasturxonchi (Qo'qon)\nII. Qozi askar\nIII. Qalb (markaz)\nIV. Otaliq (Mang'itlar)\na) Shahzodalar tarbiyachisi, Samarqand va Buxoroning sug'orish ishlari uchun mas'ul amaldor.\nb) Qo'shinning o'rta, asosiy qismi; jangda asosiy kuch joylashgan markaz.\nc) Saroy dasturxoni va ziyofatlar uchun mas'ul mansabdor.\nd) Qo'shin tarkibidagi diniy sudya.\ne) Karvonsaroy.",["I-a, II-d, III-b, IV-c","I-d, II-e, III-c, IV-a","I-b, II-d, III-c, IV-a","I-c, II-d, III-b, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sadr (Mang'itlar)\nII. Navvob, qolg'a, kichik xon\nIII. Dodxoh (Shayboniylar)\nIV. Kilmint\na) Vaqf mulklarining hisob-kitobi va nazoratini olib boruvchi.\nb) Aholi arzlarini qabul qiluvchi, adolat nazoratchisi, elchilarni kutuvchi.\nc) Qo'qonda yordamchi, nomuntazam qo'shin; zaruratga qarab xalq orasidan to'plangan.\nd) Shayboniylarda taxt vorisining nomlari.\ne) Subhonqulixon Buxoro Registonida qurdirgan sakkiz burchakli kasalxona (shifoxona va madrasa vazifasini o'tagan).",["I-e, II-c, III-b, IV-d","I-a, II-d, III-b, IV-c","I-a, II-b, III-d, IV-e","I-e, II-a, III-b, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kichik inoq\nII. Oliy Kengash va Kichik Kengash\nIII. Kimishek\nIV. Dubulg'a\na) Qo'qonda yordamchi, nomuntazam qo'shin; zaruratga qarab xalq orasidan to'plangan.\nb) Muhammad Rahimxon I tashkil etgan davlat kengashlari.\nc) Boshni himoya qiluvchi po'lat bosh kiyim.\nd) To'y ko'rayotgan qiz kiygan, o'zi tikkan bosh kiyim.\ne) Chet el elchilari hujjatlarini qabul qilish, amir muhri uchun javobgar amaldor.",["I-c, II-e, III-d, IV-a","I-e, II-b, III-d, IV-a","I-e, II-d, III-b, IV-c","I-e, II-b, III-d, IV-c"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xo'jagon sulolasi\nII. To'pchi\nIII. Qorovulbegi\nIV. To'pchiboshi\na) Kigizdan tikilgan konus shaklidagi bosh kiyim.\nb) Sharqiy Turkistonning ruhoniy nasabli hokimlari; asoschisi Maxdumi A'zam.\nc) To'pchilar bo'linmasining bevosita boshlig'i.\nd) Artilleriya askari (Qo'qonda Xudoyorxon davrida zamonaviy to'pchilar bo'linmasi tashkil etilgan).\ne) Chegaralarni qo'riqlagan qo'shin boshlig'i.",["I-e, II-a, III-d, IV-c","I-b, II-d, III-e, IV-c","I-d, II-e, III-b, IV-c","I-b, II-c, III-a, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sarboz\nII. JUL\nIII. Bosh xoja, kutvol, bakovulboshi, qorovulbegi\nIV. Dashti Qipchoq\na) Amir Shohmurod urush davrida joriy etgan soliq.\nb) Sirdaryoning yuqori oqimi va Tyan-shanning g'arbiy yonbag'ridan Dnepr daryosining quyi oqimigacha cho'zilgan dashtlar. Ural (Yoyiq) daryosi uni sharqiy va g'arbiy qismlarga ajratgan.\nc) Kumush tangalar.\nd) Muntazam qo'shindagi piyoda askar (Amir Nasrullo 1837-yilda tuzgan).\ne) Saroy va shahar tartibi, qurilish, qo'riqlash, yo'llar xavfsizligi uchun mas'ul amaldorlar.",["I-d, II-b, III-a, IV-e","I-c, II-d, III-a, IV-b","I-d, II-a, III-e, IV-c","I-d, II-a, III-e, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sipoh\nII. Tug'chi\nIII. Qozi kalon, qozi o'rda\nIV. Qo'sh puli\na) Davlat bayrog'ini va ramzlarini qo'riqlovchi maxsus qism.\nb) Har bir juft ho'kizga qarab olinadigan soliq.\nc) Volgabo'yida XV asr 30-yillarida tashkil topgan, 1556-yilda Rossiya bosib olgan davlat.\nd) Oliy darajadagi sudlar.\ne) Qo'qon qo'shinidagi otliq, asosiy harbiy kuch.",["I-e, II-a, III-d, IV-b","I-b, II-a, III-d, IV-e","I-e, II-c, III-b, IV-a","I-e, II-b, III-d, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Miroxur\nII. Jevachi\nIII. Oq kigiz\nIV. Naftandoz\na) Ot-ulov, yilqilar va ularning ta'minoti uchun javobgar amaldor.\nb) Qo'shin va xon qurol-yarog'larini tayyorlash, saqlash va ta'minlash bilan shug'ullangan.\nc) Xonni taxtga ko'tarish marosimida ustiga o'tqazilgan kigiz.\nd) Yonuvchi neftni dushman tomonga otuvchi maxsus jangchi.\ne) Muhammad Rahimxon I tashkil etgan davlat kengashlari.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-e, IV-d","I-d, II-a, III-c, IV-b","I-c, II-e, III-a, IV-d"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Suyurg'ol (Mang'itlar)\nII. Tavochi\nIII. Ko'kaldosh\nIV. Rabot\na) Harbiy askarlarni to'plash, yurishga tayyorlash, qo'shin ta'minotiga mas'ul amaldor.\nb) Davlat xizmatlari uchun berilgan, lekin xiroj to'lash majburiy bo'lgan yer.\nc) Xonning eng ishonchli odami, ko'pincha xon bilan bir onadan sut emgan kishi.\nd) Karvonsaroy.\ne) Qahramonlik dostonlarini qo'biz jo'rligida ijro etganlar.",["I-e, II-c, III-a, IV-d","I-b, II-a, III-c, IV-d","I-b, II-c, III-d, IV-a","I-c, II-a, III-e, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Shig'ovul (Qo'qon)\nII. O'tov (qora uy)\nIII. Oqsoqollik\nIV. Obikori / qoriya / marza\na) Kichik qishloqlar; yer maydoni va aholi soniga qarab tasniflangan.\nb) Qo'qon xonligida eng quyi ma'muriy bo'g'in (katta bir qishloq yoki bir necha kichik qishloq).\nc) Qoraqalpoqlarning eng asosiy va yaxshi ko'rilgan uyi.\nd) Chet mamlakatlardan kelgan elchilarni kutib olgan, joylashtirgan amaldor.\ne) Xon tomonidan tayinlangan bek va noib boshqargan ma'muriy birliklar.",["I-e, II-a, III-b, IV-d","I-d, II-c, III-b, IV-a","I-d, II-b, III-e, IV-a","I-e, II-d, III-b, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Mamlakai podshoh\nII. O'mirbek laqqi\nIII. Mehtar\nIV. Qushbegi (Mang'itlar)\na) Qoraqalpoq xalq og'zaki ijodidagi kulgi qahramoni (o'zbeklarda Afandi kabi).\nb) Moliya vazirining yordamchisi; devonbegiga ko'maklashgan.\nc) Bosh vazir, oliy hukmdordan keyingi shaxs; boshqaruv, moliya, soliq va poytaxt nazoratini olib borgan.\nd) Shayboniylar davrida barcha yerlarning davlat mulki ekanligini ifodalovchi nom.\ne) Muhammad Rahimxon I davrida tuzilgan 2 ming kishilik muntazam qo'shin.",["I-d, II-a, III-b, IV-c","I-d, II-a, III-c, IV-e","I-e, II-b, III-d, IV-c","I-d, II-e, III-a, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Otliq yeri\nII. Botir\nIII. Qo'biz\nIV. Jengse\na) Qoraqalpoqlarda harbiy qismlarni boshqargan shaxs.\nb) Turkiy xalqlarning eng sevimli torli-kamonli (qadimda tirnama) musiqa cholg'usi.\nc) Ko'ylak, to'n yoki chopon yengi; qizil guldor matodan alohida tayyorlanib tikilgan.\nd) Bozor tartibi, o'lchov-adolat va shariat qoidalariga rioya qilinishini nazorat qilgan.\ne) Harbiy otliqqa 30–50 tanob berilgan yer (shart: qo'shinga bir otliq tayyorlash); faqat Xivada bo'lgan.",["I-e, II-a, III-b, IV-c","I-b, II-a, III-e, IV-d","I-e, II-d, III-c, IV-b","I-d, II-a, III-b, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Manjanaqchilar\nII. Mirob\nIII. Qozikalon, muftiy, shayxulislom\nIV. Mushrif\na) Suv taqsimoti uchun javobgar amaldor.\nb) Diniy-huquqiy masalalarda shariat asosida hukm chiqaruvchi va fatvo beruvchi shaxslar.\nc) Tosh otuvchi qurollarni ishlatuvchi askarlar; qal'a yoki shahar qamalida qo'llanilgan.\nd) Soliqlar, xiroj va tortiq yozuvlarini yurituvchi amaldor.\ne) Davlat xizmatlari uchun berilgan, lekin xiroj to'lash majburiy bo'lgan yer.",["I-d, II-a, III-e, IV-b","I-c, II-a, III-b, IV-d","I-e, II-a, III-b, IV-c","I-c, II-e, III-b, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xos mulk\nII. Ushr (Qo'qon)\nIII. Qo'rboshi\nIV. Qo'raboshi\na) Amlokka rahbarlik qilgan amaldor.\nb) Amlok yerlarining bevosita xonga tegishli qismi; daromadi saroy ahli va soqchilari xarajatiga sarflangan.\nc) Qurol-aslaha ustaxonasi va omborxona boshlig'i.\nd) Hosildan olinadigan o'nlik soliq (1/10).\ne) Ko'chmanchi chorvadorlardan mol boshiga olingan zakot.",["I-b, II-d, III-c, IV-e","I-d, II-b, III-c, IV-a","I-a, II-e, III-c, IV-b","I-b, II-e, III-d, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Suyurg'ol\nII. Mirshab\nIII. Qora qalpoq\nIV. Xabargiri\na) Qoraqalpoq nomining ma'nosi; rus solnomalarida «chyorniye klobuki».\nb) Dushman haqida razvedka ma'lumotlarini to'playdigan maxsus qism.\nc) Sodiqlik evaziga berilgan yer; dastlab vaqtincha bo'lgan, keyin merosga aylangan.\nd) Tungi qo'riqlash boshlig'i.\ne) Suyurg'ol va tanho shaklida berilgan yerlar.",["I-d, II-a, III-c, IV-b","I-e, II-d, III-a, IV-b","I-c, II-d, III-a, IV-b","I-c, II-d, III-b, IV-e"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Oqsoqol\nII. Yalovbardor\nIII. Ponsadboshi\nIV. Biy\na) Qoraqalpoqlarda har bir urug' yoki qabilaga boshchilik qilgan shaxs.\nb) Amlokka rahbarlik qilgan amaldor.\nc) Davlat bayrog'ini (tug'ni) ko'tarib yuruvchi jangchi.\nd) 500 kishilik qo'shin qo'mondoni.\ne) Qishloq boshlig'i.",["I-b, II-e, III-c, IV-a","I-c, II-a, III-d, IV-b","I-a, II-b, III-d, IV-e","I-e, II-c, III-d, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xiroj (Mang'itlar)\nII. Zamini matruka\nIII. Chechanlar\nIV. Hokim\na) Qoraqalpoqlarda so'z ustalari.\nb) Vorissiz vafot etganlar va musodara qilingan yerlar davlatga o'tishi asosidagi yer.\nc) Qoraqalpoqlarda harbiy qismlarni boshqargan shaxs.\nd) Yer solig'i; hosilning 2/5 qismi.\ne) Viloyat boshliqlari shunday yuritilgan.",["I-b, II-d, III-a, IV-c","I-b, II-c, III-d, IV-e","I-b, II-e, III-a, IV-d","I-d, II-b, III-a, IV-e"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Ashtarxon (Hoji Tarxon)\nII. Amlok yerlari (zamini xos)\nIII. Otaliq (Qo'qon)\nIV. Barong'or (Maymana)\na) Xon yoki vorisning tarbiyachisi va maslahatchisi.\nb) Qo'shinning o'ng qanoti.\nc) Davlat yerlari; daromadi xon ixtiyorida, yirik dehqonlarga ijaraga berilgan (hosilning 1/5 qismi soliq).\nd) Volgabo'yida XV asr 30-yillarida tashkil topgan, 1556-yilda Rossiya bosib olgan davlat.\ne) Tosh otuvchi qurollarni ishlatuvchi askarlar; qal'a yoki shahar qamalida qo'llanilgan.",["I-e, II-d, III-a, IV-b","I-a, II-d, III-e, IV-b","I-d, II-c, III-a, IV-b","I-e, II-c, III-d, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Beklarbegi\nII. Yasovulboshi\nIII. Mulki xos\nIV. Yig'im soliq\na) Bevosita xonga tegishli yerlar; daromadi xon xarajatlariga sarflangan.\nb) Zakot to'lamaydiganlardan olinadigan to'lov (9 buyumdan iborat).\nc) Toshkent hokimining unvoni (1831-yildan, Muhammad Alixon joriy etgan).\nd) Xon navkarlarining bosh qo'mondoni.\ne) Chet mamlakatlardan kelgan elchilarni kutib olgan, joylashtirgan amaldor.",["I-a, II-c, III-d, IV-b","I-e, II-d, III-c, IV-a","I-a, II-d, III-e, IV-c","I-c, II-d, III-a, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Hazora / nim hazora\nII. Dargoh (Oliy devon)\nIII. Inoq\nIV. Shashmaqom\na) Buzruk, Rost, Navo, Dugoh, Segoh, Iroq maqomlaridan iborat musiqa turkumi; YUNESKO jahon madaniy merosi ro'yxatiga kiritilgan.\nb) Ashtarxoniylar davrida ham faoliyat yuritgan oliy boshqaruv organi.\nc) 50 ming yoki 25 ming tanob yer maydoniga ega bo'lgan birlik.\nd) Xon va shahzodalar o'rtasidagi aloqalarni tartibga soluvchi amaldor.\ne) Har bir qabilani boshqaruvchi, xonning maslahatchisi sifatida saroyda yashagan shaxs.",["I-d, II-c, III-e, IV-a","I-c, II-b, III-e, IV-a","I-c, II-a, III-e, IV-d","I-b, II-a, III-e, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Qushbegi (Shayboniylar)\nII. Sarkor (mirzaboshi)\nIII. Tiul\nIV. Yorlig'i xumoyun-u ali\na) Tosh otuvchi qurollarni ishlatuvchi askarlar; qal'a yoki shahar qamalida qo'llanilgan.\nb) Viloyat hokimining yordamchisi.\nc) Amaldorlarga xizmat evaziga berilgan yer (suyurg'ol, iqto, tanho bilan birga).\nd) Xon qozilarni tasdiqlagan hujjat.\ne) Ov qurollari, qushlar va itlar uchun javobgar amaldor.",["I-e, II-c, III-d, IV-b","I-a, II-b, III-c, IV-e","I-e, II-b, III-c, IV-d","I-e, II-d, III-c, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Qozoq xonligi\nII. Borgoh\nIII. Bala shapan\nIV. Sadoq\na) Bekliklardagi harbiy ishlar holati uchun javobgar shaxs.\nb) Bolalarning kichik choponi yoki ustki kiyimi.\nc) Xon yoki bosh qo'mondon uchun jang vaqtida tiklanadigan chodirli qarorgoh.\nd) Yoy o'qlari solinadigan maxsus g'ilof.\ne) 1465–1466-yillarda Girayxon va Jonibekxon Chu vodiysi va Yettisuvda tuzgan xonlik.",["I-d, II-a, III-b, IV-e","I-e, II-c, III-b, IV-d","I-c, II-a, III-b, IV-e","I-a, II-c, III-b, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Xojakalon\nII. Dargoh\nIII. Sadr, muhtasib, rais\nIV. Ichan qal'a, Dishan qal'a\na) Diniy va axloqiy tartiblarni nazorat qilgan amaldorlar.\nb) Amlok yerlarining bevosita xonga tegishli qismi; daromadi saroy ahli va soqchilari xarajatiga sarflangan.\nc) Fiqh bo'yicha yetuk olim; diniy-huquqiy masalalarda maslahat bergan.\nd) Davlat boshqaruvining oliy organi.\ne) Xiva shahrining ichki va tashqi qismlari.",["I-d, II-b, III-a, IV-e","I-c, II-e, III-b, IV-a","I-c, II-d, III-a, IV-e","I-a, II-d, III-c, IV-e"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Ixrojot\nII. Yasovul (Shayboniylar)\nIII. Parvonachi (Shayboniylar)\nIV. Qissaxonlar\na) Xon saroyi va qo'shin xarajatlari uchun olingan soliq.\nb) Xon va shahzodalar o'rtasidagi aloqalarni tartibga soluvchi amaldor.\nc) Dostonlarni qo'lyozmadan o'qib yoki yoddan aytib berganlar.\nd) Yoy o'qlari solinadigan maxsus g'ilof.\ne) Xon farmonlarini yetkazuvchi, jangda qo'mondonlik qilgan amaldor.",["I-a, II-b, III-e, IV-c","I-a, II-b, III-d, IV-e","I-c, II-b, III-d, IV-a","I-a, II-b, III-d, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Araqchin\nII. Devonbegi (Qo'qon)\nIII. Shogirdpesha\nIV. Vaqf yerlari\na) Mamlakat xazinasini boshqargan, kirim-chiqimni maxsus daftarlarga qayd etgan moliya mansabdori.\nb) Askarlarning tajribali jangchilardan amaliy o'rganish usuli (harbiy bilim yurtlari bo'lmagan).\nc) Vorissiz vafot etganlar va musodara qilingan yerlar davlatga o'tishi asosidagi yer.\nd) Diniy muassasalar uchun ajratilgan yerlar.\ne) Salla ostiga qo'yiladigan bosh kiyim.",["I-d, II-a, III-e, IV-b","I-a, II-e, III-c, IV-d","I-e, II-a, III-b, IV-d","I-b, II-a, III-c, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Beklik, noiblik\nII. To'qsoba, dasturxonchi\nIII. Ashrafiy\nIV. Ulug' xon\na) Xon tomonidan tayinlangan bek va noib boshqargan ma'muriy birliklar.\nb) Ovqat, ichimlik va saroy taomlari uchun mas'ul amaldor.\nc) Abulxayrxon 1430-yilda Xorazmni qisqa muddat egallagach olgan unvon.\nd) Xon qozilarni tasdiqlagan hujjat.\ne) Oltin tanga.",["I-c, II-b, III-e, IV-d","I-a, II-b, III-e, IV-c","I-a, II-d, III-e, IV-b","I-c, II-d, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Baktar, ko'krakpo'sh, yelkapo'sh\nII. Poloveslar yeri\nIII. Xudoydod\nIV. Taqiq yer (qo'riq yer)\na) Amlok yerlarining yaylov, qamishzor va chakalakzorlardan iborat qismi.\nb) Rus manbalarida Dashti Qipchoqning nomi (Vizantiyada «kumanlar», sharqda «qipchoqlar»).\nc) Xonning eng ishonchli odami, ko'pincha xon bilan bir onadan sut emgan kishi.\nd) Halqa-parchinli sovut turlari.\ne) Koshg'ardagi Qo'qon savdogarlari faoliyatini, haq-huquqlarini va tanga-pullarini nazorat qilgan lavozim (konsullik).",["I-e, II-b, III-c, IV-d","I-d, II-b, III-e, IV-a","I-a, II-b, III-d, IV-c","I-c, II-b, III-e, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Gurzi\nII. Oltin beshik\nIII. Inoq (Qo'qon)\nIV. Devonbegi (Shayboniylar)\na) Xonning xos va sirdosh mulozimi, yaqin maslahatchi.\nb) Bosh vazir; moliya, soliq, yer-suv, tayinlov ishlari uchun mas'ul.\nc) Urushlarda jasorat ko'rsatgan shaxslarga berilgan, soliqlardan ozod qilingan yer.\nd) Jang qurollaridan biri (o'q-yoy, nayza, qilich bilan birga).\ne) Shohruxbiyning Boburga borib taqalishini asoslash uchun to'qilgan afsona.",["I-d, II-e, III-a, IV-b","I-c, II-e, III-b, IV-a","I-e, II-d, III-a, IV-b","I-a, II-e, III-c, IV-b"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Javong'or (Maysara)\nII. Muzahhib, lavvoh, sahhof\nIII. Qushbegi (Ashtarxoniylar)\nIV. Baxshilar\na) Qo'lyozma tayyorlashda ishtirok etgan usta: oltin suvi yurituvchi, sarlavha yozuvchi, muqovalovchi.\nb) Saroydagi eng nufuzli amaldor; mansabga tayinlash, unvon berish va xon yorlig'isiz yozma ko'rsatma berish imtiyoziga ega bo'lgan.\nc) Kigizdan tikilgan konus shaklidagi bosh kiyim.\nd) Dostonlarni dutor va g'ijjak jo'rligida kuylaganlar.\ne) Qo'shinning chap qanoti.",["I-d, II-c, III-b, IV-e","I-b, II-a, III-e, IV-c","I-e, II-a, III-b, IV-d","I-b, II-c, III-a, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Boturboshi\nII. Tutun haqi\nIII. Mulk (xususiy yer) (Mang'itlar)\nIV. Dinor\na) Viloyat hokimining harbiy yordamchisi.\nb) Ko'ylak, to'n yoki chopon yengi; qizil guldor matodan alohida tayyorlanib tikilgan.\nc) Urushlarda jasorat ko'rsatgan shaxslarga berilgan, soliqlardan ozod qilingan yer.\nd) Mis tanga.\ne) Har xonadondan bahorda olinadigan zakot (1 ta qo'y).",["I-a, II-c, III-e, IV-b","I-e, II-a, III-c, IV-b","I-d, II-e, III-b, IV-c","I-a, II-e, III-c, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Tanobona\nII. Muhtasib (rais) (Mang'itlar)\nIII. Galabotit va merganlar\nIV. Devonbegi (Mang'itlar)\na) Moliya vaziri; zakot yig'ish, xazina va suv ta'minoti bilan shug'ullangan, «quyi qushbegi» deb ham atalgan.\nb) Maxsus tanlangan, tezkor va aniq o'q otuvchi bo'linmalar.\nc) Bozor tartibi, o'lchov-adolat va shariat qoidalariga rioya qilinishini nazorat qilgan.\nd) Sug'oriladigan yerlardan olinadigan soliq (yerga va bozordan uzoqlikka qarab).\ne) Davlat bayrog'ini va ramzlarini qo'riqlovchi maxsus qism.",["I-b, II-c, III-a, IV-d","I-c, II-d, III-b, IV-a","I-e, II-c, III-b, IV-a","I-d, II-c, III-b, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Manglay (Avangard)\nII. Botirboshi\nIII. Qoqra\nIV. Qozon solig'i\na) Qalbni dushman hujumidan saqlovchi oldingi jangchi qism.\nb) Bekliklardagi harbiy ishlar holati uchun javobgar shaxs.\nc) Shohruxbiyning Boburga borib taqalishini asoslash uchun to'qilgan afsona.\nd) Qoraqalpoqlarda loysuvoq uylarning nomi.\ne) Harbiy xavf, urush xavfi paytida umumxalqdan yig'iladigan soliq.",["I-a, II-e, III-c, IV-b","I-b, II-c, III-d, IV-e","I-e, II-a, III-d, IV-c","I-a, II-b, III-d, IV-e"],3]]],["9-sinf Jahon tarixi atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Syogun\nII. Negus\nIII. Sintoizm (sinto)\nIV. Boyarlar\na) 1192–1867-yillarda Yaponiya harbiy hukmdori unvoni; imperator haqiqiy hokimiyatdan mahrum bo'lgan.\nb) Qadimgi yapon dini («xudolar yo'li»); asosiy xudo – Quyosh ma'budasi Amaterasu.\nc) 1792–1795-yillarda Fransiyaning oliy qonun chiqaruvchi organi.\nd) Rus davlatidagi feodal jamiyatning oliy tabaqasi; votchinaga egalik qilgan.\ne) Efiopiya hukmdori unvoni.",["I-d, II-e, III-a, IV-b","I-a, II-d, III-e, IV-b","I-c, II-a, III-b, IV-e","I-a, II-e, III-b, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Latifundiya\nII. Konkista\nIII. Rasizm (irqchilik)\nIV. Renta\na) Lotin Amerikasida yevropaliklarga tegishli yirik yerga egalik shakli.\nb) Amerikani zabt etish.\nc) Qadimgi yapon dini («xudolar yo'li»); asosiy xudo – Quyosh ma'budasi Amaterasu.\nd) Mehnat daromadi va kapital qo'yilmalardan olingan daromaddan tashqari har qanday daromad.\ne) Irqlarning bo'linishi va bir irqning boshqasidan ustunligini tasdiqlovchi mafkura.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-e, IV-d","I-d, II-b, III-a, IV-c","I-b, II-c, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Feodal renta\nII. Mulatlar\nIII. Protestantizm\nIV. Metis\na) Bir monarx boshchiligidagi davlatlar ittifoqi.\nb) Pravoslav va katolik bilan birga xristianlikning asosiy yo'nalishlaridan biri (lot. «protestatio» – «tantanali bayonot, norozilik»).\nc) Yevropalik va hindularning nikohidan tug'ilgan farzandlar.\nd) XVII asr o'rtalaridan yevropaliklar va qora tanlilar nikohidan tug'ilgan farzandlar.\ne) Yer rentasi shakllaridan biri: feodal foydasiga ishlab berish, natural va naqd pul shaklida.",["I-d, II-e, III-a, IV-c","I-b, II-a, III-e, IV-c","I-e, II-d, III-b, IV-c","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. O'ttiz yillik urush\nII. Terror (lot. «qo'rquv, dahshat»)\nIII. Konvensiya\nIV. Konkistador (isp. «bosqinchi»)\na) Siyosiy raqiblarni zo'ravonlik, jumladan o'ldirish orqali qo'rqitish siyosati.\nb) Amerikani mustamlaka qilish davridagi ispan yoki portugal bosqinchilari.\nc) Inson huquqlarini jamiyat manfaatlaridan mutlaq ustun qo'yadigan ta'limot.\nd) 1618–1648-yillarda Muqaddas Rim imperiyasi hududida bo'lgan birinchi umumyevropa urushi.\ne) Maxsus masala bo'yicha ko'p tomonlama xalqaro shartnoma.",["I-d, II-b, III-c, IV-e","I-c, II-a, III-d, IV-b","I-a, II-c, III-d, IV-b","I-d, II-a, III-e, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Generalgubernator\nII. Zemstvo sobori\nIII. Intensiv dehqonchilik\nIV. Kapitalist\na) Muhim siyosiy masalalarni muhokama qilish va qonun qabul qilish uchun podsho yig'gan tabaqaviy-vakillik organi.\nb) Yangi texnologiya, mexanizatsiya, o'g'it kabilar orqali hosildorlikni oshirish.\nc) Burjua jamiyatidagi hukmron sinf vakili, kapital egasi, yollanma mehnatdan ekspluatatsiya qiluvchi.\nd) Monarx hokimiyati va huquqlari konstitutsiya bilan cheklangan davlat tuzumi (parlament monarxiyasi).\ne) Qirolning dominiondagi vakili.",["I-e, II-d, III-a, IV-b","I-e, II-a, III-b, IV-d","I-e, II-a, III-b, IV-c","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Individualizm\nII. Narxlar inqilobi\nIII. Reformatsiya\nIV. Faktoriya (fr. factorie)\na) Inson huquqlarini jamiyat manfaatlaridan mutlaq ustun qo'yadigan ta'limot.\nb) Katolik cherkovini isloh qilish jarayoni.\nc) Britaniya imperiyasi tarkibidagi o'zini o'zi boshqaradigan, qirolni davlat boshlig'i deb tan oladigan davlat.\nd) Pul vazifasini bajaruvchi qimmatbaho metallar qiymati pasayishi tufayli tovarlar narxining sezilarli oshishi.\ne) Boshqa davlat yoki mustamlakada xorijiy savdogarlar tashkil etgan savdo manzilgohi.",["I-b, II-d, III-a, IV-e","I-a, II-d, III-e, IV-c","I-a, II-d, III-b, IV-e","I-e, II-a, III-b, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dominion\nII. Taypinlar\nIII. Segregatsiya\nIV. Karbonariylar (ital. «ko'mirchilar»)\na) 1807–1832-yillarda Italiyada faoliyat yuritgan yashirin inqilobiy jamiyat.\nb) Britaniya imperiyasi tarkibidagi o'zini o'zi boshqaradigan, qirolni davlat boshlig'i deb tan oladigan davlat.\nc) Oq tanli aholini boshqa etnik guruhlardan ajratish.\nd) Burjua jamiyatidagi hukmron sinf vakili, kapital egasi, yollanma mehnatdan ekspluatatsiya qiluvchi.\ne) Xitoyda 1850-yillardagi qo'zg'olon qatnashchilari; «uzun sochlilar» deb ham atalgan.",["I-b, II-e, III-c, IV-a","I-b, II-d, III-c, IV-e","I-e, II-b, III-d, IV-a","I-d, II-b, III-c, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Proletariat (lot. «proletarius» – «kambag'al»)\nII. Plantatsiya\nIII. Missionerlik\nIV. Mikado\na) Biror dinga e'tiqod qiluvchi xalqlar orasida boshqa dinni targ'ib qilish.\nb) Tropik va subtropik ekinlar yetishtiriladigan yirik dehqonchilik xo'jaligi.\nc) Faqat o'z mehnatini sotib, yollanma mehnat evaziga tirikchilik qiladigan ijtimoiy sinf.\nd) Yaponiya imperatorining qadimgi unvoni.\ne) Britaniya imperiyasi tarkibidagi o'zini o'zi boshqaradigan, qirolni davlat boshlig'i deb tan oladigan davlat.",["I-c, II-b, III-d, IV-a","I-c, II-b, III-a, IV-d","I-b, II-c, III-a, IV-e","I-b, II-e, III-c, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Direktoriya\nII. Absolyut (mutlaq) monarxiya\nIII. Ekspeditsiya\nIV. Samuray\na) Maxsus belgilangan maqsad bilan uyushtiriladigan sayohat.\nb) 1795–1799-yillarda Fransiya Respublikasining besh direktordan iborat hukumati.\nc) Hokimiyat cheklovlarsiz butunlay monarx qo'lida bo'lgan boshqaruv shakli.\nd) Qirolning dominiondagi vakili.\ne) Feodal Yaponiyadagi mayda zodagonlar va daymyolarning harbiyfeodal tabaqasi.",["I-b, II-c, III-a, IV-e","I-c, II-b, III-a, IV-d","I-c, II-a, III-d, IV-e","I-a, II-b, III-d, IV-e"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Chartizm\nII. Yunker xo'jaligi\nIII. Harbiy-len (timar)\nIV. Milliy ta'sis majlisi\na) Ingliz ishchilarining 1836–1848-yillardagi dastlabki ommaviy ijtimoiy-siyosiy harakati.\nb) Turkiylar va Usmoniylarda feodal yer egaligi shakli; egasi harbiy yurishda ishtirok etgan.\nc) 1789–1791-yillarda Fransiyaning oliy vakillik va qonun chiqaruvchi organi; General shtatlar o'rniga tuzilgan.\nd) Mehnat taqsimoti va qo'l hunari texnikasiga asoslangan korxona.\ne) Nemis zodagonlarining kapitalistik tarzda isloh qilingan xo'jaligi: yollanma mehnat bilan birga krepostnoylar mehnati saqlangan.",["I-d, II-c, III-b, IV-e","I-a, II-e, III-b, IV-c","I-c, II-e, III-b, IV-a","I-c, II-d, III-b, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Birja\nII. Dvoryanlar\nIII. Oprichnina\nIV. Konsul\na) Direktoriya o'rniga joriy etilgan ijroiya hokimiyatining uch rahbaridan biri; Konsullik 1799–1804-yillarda amal qilgan.\nb) Qimmatli qog'ozlar, tovarlar, xomashyo, qimmatbaho metallar va valutalarni sotish-sotib olish mumkin bo'lgan savdo maydonchasi.\nc) Ivan Grozniy davrida podshoning yakkahokimligini o'rnatish va boyarlarni bostirish siyosati.\nd) Maxsus belgilangan maqsad bilan uyushtiriladigan sayohat.\ne) Knyaz yoki podsho xizmatida bo'lib, xizmat evaziga pomestye yerga egalik qilgan imtiyozli tabaqa.",["I-c, II-d, III-b, IV-a","I-d, II-c, III-b, IV-a","I-b, II-a, III-d, IV-c","I-b, II-e, III-c, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Gilyotina\nII. Fermer xo'jaligi\nIII. Sipohiylar (fors. «askar»)\nIV. Missioner\na) Boshni tanadan judo qilib o'lim jazosini ijro etish mexanizmi; 1792yilda Jozef Gilotenning taklifi bilan qo'llangan.\nb) Inglizlar tomonidan mahalliy aholidan yollangan askarlar.\nc) Ivan Grozniy davrida podshoning yakkahokimligini o'rnatish va boyarlarni bostirish siyosati.\nd) Cherkov tomonidan o'z dinini targ'ib qilish uchun yuborilgan shaxs.\ne) O'z yoki ijaraga olingan yer uchastkasidagi xususiy qishloq xo'jaligi korxonasi.",["I-a, II-e, III-b, IV-d","I-d, II-c, III-b, IV-e","I-a, II-b, III-c, IV-e","I-a, II-d, III-b, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Intervensiya\nII. Konsessiya (lot. «ruxsat»)\nIII. Funt\nIV. Konvent\na) Bir yoki bir necha davlatning boshqa davlat ichki ishlariga zo'rlik bilan aralashuvi.\nb) 1792–1795-yillarda Fransiyaning oliy qonun chiqaruvchi organi.\nc) Angliyada og'irlik o'lchovi, 453,6 grammga teng.\nd) Davlat korxonalari yoki mulkini muayyan muddatga chet el kapitaliga berish haqidagi kelishuv.\ne) Lotin Amerikasida yevropaliklarga tegishli yirik yerga egalik shakli.",["I-a, II-d, III-c, IV-e","I-b, II-d, III-c, IV-e","I-a, II-d, III-c, IV-b","I-a, II-c, III-d, IV-e"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Vigilar\nII. Puritanlik\nIII. Karavella\nIV. Qrim urushi (1853–1856)\na) Rossiya bilan Buyuk Britaniya, Fransiya, Usmoniylar va Sardiniya koalitsiyasi o'rtasidagi urush.\nb) Parlament huquqlarini himoya qilgan, islohotlar tarafdori bo'lgan guruh.\nc) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.\nd) Yevropada XV–XVII asrlarda keng tarqalgan yelkanli kema turi.\ne) Axloq qoidalariga qat'iy amal qilish, ehtiyojlarni o'ta cheklash, tejamkorlik va mehnatsevarlikka xos hayot tarzi.",["I-d, II-e, III-b, IV-a","I-b, II-a, III-c, IV-d","I-a, II-b, III-d, IV-c","I-b, II-e, III-d, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Torilar\nII. Birinchi afyun urushi (1839– 1842)\nIII. Industrial sivilizatsiya\nIV. Sanoat to'ntarishi\na) Tropik va subtropik ekinlar yetishtiriladigan yirik dehqonchilik xo'jaligi.\nb) Sanoat, fan va texnikaning taraqqiyotiga asoslangan jamiyat.\nc) Afyun kirishiga to'sqinlik qilish uchun Lin Szesyuy tayinlanishi bilan boshlangan Xitoy–Angliya urushi.\nd) Manufaktura ishlab chiqarishidan mashinalar keng qo'llaniladigan fabrika ishlab chiqarishiga o'tish.\ne) Qirolning huquq va manfaatlari hamda mavjud tartiblarni qo'llabquvvatlagan guruh.",["I-b, II-c, III-a, IV-d","I-e, II-c, III-b, IV-d","I-b, II-a, III-c, IV-d","I-d, II-c, III-b, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Krepostnoylik\nII. Ekstensiv dehqonchilik\nIII. Dekabristlar qo'zg'oloni\nIV. «Ost Indiya» kompaniyasi (1600–1858)\na) Sankt-Peterburgda Senat maydonida zodagonlar samoderjaviyeni ag'darish va krepostnoylikni yo'q qilish maqsadida ko'targan qo'zg'olon.\nb) Nemis zodagonlarining kapitalistik tarzda isloh qilingan xo'jaligi: yollanma mehnat bilan birga krepostnoylar mehnati saqlangan.\nc) Dehqonni yerga biriktiruvchi, feodalning ma'muriy va sud hokimiyatiga bo'ysundiruvchi huquqiy normalar majmuasi.\nd) Ekin maydoni va chorva sonini ko'paytirish hisobiga mahsulotni ko'paytirish; texnikadan kam foydalanish, hosili past.\ne) Hindiston, Janubi-sharqiy Osiyo va Xitoy bilan savdo qilgan, bosib olingan hududlarni ekspluatatsiya qilgan ingliz xususiy kompaniyasi.",["I-c, II-d, III-a, IV-e","I-c, II-b, III-d, IV-e","I-a, II-c, III-b, IV-e","I-c, II-b, III-d, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Gugenotlar\nII. Bob\nIII. Tanzimat\nIV. Manufaktura\na) Britaniya imperiyasi tarkibidagi o'zini o'zi boshqaradigan, qirolni davlat boshlig'i deb tan oladigan davlat.\nb) XVI–XVIII asrlarda Fransiyadagi protestant (kalvinizm) tarafdorlari.\nc) «Darvoza» ma'nosi; Said Ali Muhammad 1844-yilda o'zini shunday e'lon qilgan.\nd) 1839–1876-yillarda Usmoniylar imperiyasini modernizatsiyalashga qaratilgan islohotlar.\ne) Mehnat taqsimoti va qo'l hunari texnikasiga asoslangan korxona.",["I-e, II-c, III-d, IV-a","I-b, II-c, III-d, IV-e","I-c, II-b, III-d, IV-e","I-b, II-e, III-a, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Uniya\nII. «Oq koloniyalar»\nIII. Bank (ital. «banco» – «kursi»)\nIV. Konstitutsion monarxiya\na) Yevropadan (asosan Angliya va Irlandiyadan) kelgan ko'chmanchilar yashagan imtiyozli hududlar.\nb) Sarroflar almashish uchun tangalarni terib qo'yadigan stol.\nc) Monarx hokimiyati va huquqlari konstitutsiya bilan cheklangan davlat tuzumi (parlament monarxiyasi).\nd) Bir monarx boshchiligidagi davlatlar ittifoqi.\ne) Axloq qoidalariga qat'iy amal qilish, ehtiyojlarni o'ta cheklash, tejamkorlik va mehnatsevarlikka xos hayot tarzi.",["I-d, II-c, III-e, IV-b","I-d, II-a, III-b, IV-c","I-b, II-a, III-c, IV-d","I-c, II-e, III-b, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kapital (lot. «capitalis» – «hukmron»)\nII. Ko'p ukladli iqtisodiyot\nIII. Plantatsiya xo'jaligi\nIV. Birinchi afyun urushi (1839– 1842)\na) Mehnat daromadi va kapital qo'yilmalardan olingan daromaddan tashqari har qanday daromad.\nb) Real qiymatga ega bo'lgan va foyda keltiradigan hamma narsa.\nc) Iqtisodiy tizimda xo'jalik yuritishning turli shakllari (patriarxal, mayda tovar, kapitalistik) mavjudligi.\nd) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.\ne) Afyun kirishiga to'sqinlik qilish uchun Lin Szesyuy tayinlanishi bilan boshlangan Xitoy–Angliya urushi.",["I-b, II-a, III-e, IV-d","I-d, II-c, III-e, IV-a","I-a, II-b, III-d, I fayli tovarlar narxining sezilarli oshishi.\ne) Real qiymatga ega bo'lgan va foyda keltiradigan hamma narsa.",["I-e, II-b, III-d, IV-a","I-e, II-b, III-c, IV-a","I-e, II-c, III-d, IV-b","I-a, II-c, III-d, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kapitalist\nII. Uniya\nIII. Zemstvo sobori\nIV. Konsul\na) Direktoriya o'rniga joriy etilgan ijroiya hokimiyatining uch rahbaridan biri; Konsullik 1799–1804-yillarda amal qilgan.\nb) Burjua jamiyatidagi hukmron sinf vakili, kapital egasi, yollanma mehnatdan ekspluatatsiya qiluvchi.\nc) Bir monarx boshchiligidagi davlatlar ittifoqi.\nd) Qirolning dominiondagi vakili.\ne) Muhim siyosiy masalalarni muhokama qilish va qonun qabul qilish uchun podsho yig'gan tabaqaviy-vakillik organi.",["I-e, II-c, III-d, IV-b","I-c, II-b, III-d, IV-a","I-b, II-c, III-e, IV-a","I-d, II-c, III-e, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Proletariat (lot. «proletarius» – «kambag'al»)\nII. Feodal renta\nIII. Uniya\nIV. Plantatsiya xo'jaligi\na) Monarx hokimiyati va huquqlari konstitutsiya bilan cheklangan davlat tuzumi (parlament monarxiyasi).\nb) Yer rentasi shakllaridan biri: feodal foydasiga ishlab berish, natural va naqd pul shaklida.\nc) Bir monarx boshchiligidagi davlatlar ittifoqi.\nd) Faqat o'z mehnatini sotib, yollanma mehnat evaziga tirikchilik qiladigan ijtimoiy sinf.\ne) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.",["I-c, II-a, III-d, IV-e","I-d, II-b, III-c, IV-e","I-a, II-b, III-d, IV-c","I-d, II-b, III-a, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Harbiy-len (timar)\nII. Zemstvo sobori\nIII. Dvoryanlar\nIV. Chartizm\na) Boshqa davlat yoki mustamlakada xorijiy savdogarlar tashkil etgan savdo manzilgohi.\nb) Turkiylar va Usmoniylarda feodal yer egaligi shakli; egasi harbiy yurishda ishtirok etgan.\nc) Knyaz yoki podsho xizmatida bo'lib, xizmat evaziga pomestye yerga egalik qilgan imtiyozli tabaqa.\nd) Ingliz ishchilarining 1836–1848-yillardagi dastlabki ommaviy ijtimoiy-siyosiy harakati.\ne) Muhim siyosiy masalalarni muhokama qilish va qonun qabul qilish uchun podsho yig'gan tabaqaviy-vakillik organi.",["I-b, II-d, III-c, IV-e","I-b, II-e, III-c, IV-d","I-b, II-c, III-d, IV-a","I-e, II-b, III-c, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Segregatsiya\nII. Taypinlar\nIII. Mulatlar\nIV. Sipohiylar (fors. «askar»)\na) XVII asr o'rtalaridan yevropaliklar va qora tanlilar nikohidan tug'ilgan farzandlar.\nb) Oq tanli aholini boshqa etnik guruhlardan ajratish.\nc) Xitoyda 1850-yillardagi qo'zg'olon qatnashchilari; «uzun sochlilar» deb ham atalgan.\nd) Inglizlar tomonidan mahalliy aholidan yollangan askarlar.\ne) Faqat o'z mehnatini sotib, yollanma mehnat evaziga tirikchilik qiladigan ijtimoiy sinf.",["I-a, II-c, III-d, IV-e","I-b, II-c, III-a, IV-d","I-b, II-a, III-c, IV-e","I-c, II-b, III-e, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Boyarlar\nII. Konvensiya\nIII. Ekspeditsiya\nIV. Puritanlik\na) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.\nb) Maxsus masala bo'yicha ko'p tomonlama xalqaro shartnoma.\nc) Rus davlatidagi feodal jamiyatning oliy tabaqasi; votchinaga egalik qilgan.\nd) Axloq qoidalariga qat'iy amal qilish, ehtiyojlarni o'ta cheklash, tejamkorlik va mehnatsevarlikka xos hayot tarzi.\ne) Maxsus belgilangan maqsad bilan uyushtiriladigan sayohat.",["I-c, II-b, III-e, IV-d","I-c, II-b, III-d, IV-e","I-c, II-b, III-a, IV-d","I-e, II-c, III-b, IV-d"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Missioner\nII. Oprichnina\nIII. Mikado\nIV. Karavella\na) Cherkov tomonidan o'z dinini targ'ib qilish uchun yuborilgan shaxs.\nb) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.\nc) Yaponiya imperatorining qadimgi unvoni.\nd) Yevropada XV–XVII asrlarda keng tarqalgan yelkanli kema turi.\ne) Ivan Grozniy davrida podshoning yakkahokimligini o'rnatish va boyarlarni bostirish siyosati.",["I-b, II-e, III-c, IV-a","I-a, II-e, III-c, IV-d","I-a, II-d, III-b, IV-c","I-a, II-e, III-c, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Missionerlik\nII. Renta\nIII. Boyarlar\nIV. Generalgubernator\na) Boshni tanadan judo qilib o'lim jazosini ijro etish mexanizmi; 1792yilda Jozef Gilotenning taklifi bilan qo'llangan.\nb) Rus davlatidagi feodal jamiyatning oliy tabaqasi; votchinaga egalik qilgan.\nc) Mehnat daromadi va kapital qo'yilmalardan olingan daromaddan tashqari har qanday daromad.\nd) Qirolning dominiondagi vakili.\ne) Biror dinga e'tiqod qiluvchi xalqlar orasida boshqa dinni targ'ib qilish.",["I-b, II-c, III-e, IV-d","I-b, II-c, III-e, IV-a","I-a, II-e, III-c, IV-d","I-e, II-c, III-b, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dekabristlar qo'zg'oloni\nII. Latifundiya\nIII. Plantatsiya xo'jaligi\nIV. Industrial sivilizatsiya\na) Lotin Amerikasida yevropaliklarga tegishli yirik yerga egalik shakli.\nb) Sanoat, fan va texnikaning taraqqiyotiga asoslangan jamiyat.\nc) Hindiston, Janubi-sharqiy Osiyo va Xitoy bilan savdo qilgan, bosib olingan hududlarni ekspluatatsiya qilgan ingliz xususiy kompaniyasi.\nd) AQShda qullar mehnatiga asoslangan, paxta yetishtiradigan xo'jalik.\ne) Sankt-Peterburgda Senat maydonida zodagonlar samoderjaviyeni ag'darish va krepostnoylikni yo'q qilish maqsadida ko'targan qo'zg'olon.",["I-c, II-e, III-d, IV-b","I-e, II-d, III-b, IV-c","I-e, II-a, III-d, IV-b","I-c, II-d, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Missioner\nII. Gilyotina\nIII. Karbonariylar (ital. «ko'mirchilar»)\nIV. Terror (lot. «qo'rquv, dahshat»)\na) Boshni tanadan judo qilib o'lim jazosini ijro etish mexanizmi; 1792yilda Jozef Gilotenning taklifi bilan qo'llangan.\nb) 1807–1832-yillarda Italiyada faoliyat yuritgan yashirin inqilobiy jamiyat.\nc) Boshqa davlat yoki mustamlakada xorijiy savdogarlar tashkil etgan savdo manzilgohi.\nd) Cherkov tomonidan o'z dinini targ'ib qilish uchun yuborilgan shaxs.\ne) Siyosiy raqiblarni zo'ravonlik, jumladan o'ldirish orqali qo'rqitish siyosati.",["I-b, II-a, III-d, IV-c","I-a, II-d, III-b, IV-c","I-d, II-a, III-b, IV-e","I-c, II-a, III-e, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Konsessiya (lot. «ruxsat»)\nII. Plantatsiya\nIII. Funt\nIV. Oprichnina\na) Ivan Grozniy davrida podshoning yakkahokimligini o'rnatish va boyarlarni bostirish siyosati.\nb) Manufaktura ishlab chiqarishidan mashinalar keng qo'llaniladigan fabrika ishlab chiqarishiga o'tish.\nc) Davlat korxonalari yoki mulkini muayyan muddatga chet el kapitaliga berish haqidagi kelishuv.\nd) Tropik va subtropik ekinlar yetishtiriladigan yirik dehqonchilik xo'jaligi.\ne) Angliyada og'irlik o'lchovi, 453,6 grammga teng.",["I-e, II-d, III-b, IV-a","I-e, II-d, III-c, IV-b","I-e, II-c, III-b, IV-a","I-c, II-d, III-e, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Intensiv dehqonchilik\nII. Krepostnoylik\nIII. Intervensiya\nIV. Funt\na) Yangi texnologiya, mexanizatsiya, o'g'it kabilar orqali hosildorlikni oshirish.\nb) Dehqonni yerga biriktiruvchi, feodalning ma'muriy va sud hokimiyatiga bo'ysundiruvchi huquqiy normalar majmuasi.\nc) Bir yoki bir necha davlatning boshqa davlat ichki ishlariga zo'rlik bilan aralashuvi.\nd) Angliyada og'irlik o'lchovi, 453,6 grammga teng.\ne) Maxsus belgilangan maqsad bilan uyushtiriladigan sayohat.",["I-e, II-b, III-d, IV-a","I-a, II-d, III-e, IV-b","I-a, II-b, III-c, IV-d","I-a, II-c, III-e, IV-d"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Protestantizm\nII. Konsul\nIII. Ekstensiv dehqonchilik\nIV. Birinchi afyun urushi (1839– 1842)\na) Pravoslav va katolik bilan birga xristianlikning asosiy yo'nalishlaridan biri (lot. «protestatio» – «tantanali bayonot, norozilik»).\nb) Direktoriya o'rniga joriy etilgan ijroiya hokimiyatining uch rahbaridan biri; Konsullik 1799–1804-yillarda amal qilgan.\nc) Afyun kirishiga to'sqinlik qilish uchun Lin Szesyuy tayinlanishi bilan boshlangan Xitoy–Angliya urushi.\nd) Ekin maydoni va chorva sonini ko'paytirish hisobiga mahsulotni ko'paytirish; texnikadan kam foydalanish, hosili past.\ne) Yaponiya imperatorining qadimgi unvoni.",["I-a, II-b, III-d, IV-e","I-c, II-b, III-a, IV-d","I-a, II-b, III-d, IV-c","I-c, II-b, III-d, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Konvent\nII. Missionerlik\nIII. Birja\nIV. Faktoriya (fr. factorie)\na) Qimmatli qog'ozlar, tovarlar, xomashyo, qimmatbaho metallar va valutalarni sotish-sotib olish mumkin bo'lgan savdo maydonchasi.\nb) Biror dinga e'tiqod qiluvchi xalqlar orasida boshqa dinni targ'ib qilish.\nc) Afyun kirishiga to'sqinlik qilish uchun Lin Szesyuy tayinlanishi bilan boshlangan Xitoy–Angliya urushi.\nd) Boshqa davlat yoki mustamlakada xorijiy savdogarlar tashkil etgan savdo manzilgohi.\ne) 1792–1795-yillarda Fransiyaning oliy qonun chiqaruvchi organi.",["I-e, II-b, III-c, IV-a","I-e, II-a, III-d, IV-b","I-c, II-b, III-d, IV-a","I-e, II-b, III-a, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Direktoriya\nII. Mulatlar\nIII. Karavella\nIV. «Ost Indiya» kompaniyasi (1600–1858)\na) Yevropada XV–XVII asrlarda keng tarqalgan yelkanli kema turi.\nb) Hindiston, Janubi-sharqiy Osiyo va Xitoy bilan savdo qilgan, bosib olingan hududlarni ekspluatatsiya qilgan ingliz xususiy kompaniyasi.\nc) XVII asr o'rtalaridan yevropaliklar va qora tanlilar nikohidan tug'ilgan farzandlar.\nd) 1795–1799-yillarda Fransiya Respublikasining besh direktordan iborat hukumati.\ne) Xitoyda 1850-yillardagi qo'zg'olon qatnashchi nd) 1839–1876-yillarda Usmoniylar imperiyasini modernizatsiyalashga qaratilgan islohotlar.\ne) Inson huquqlarini jamiyat manfaatlaridan mutlaq ustun qo'yadigan ta'limot.",["I-e, II-c, III-b, IV-d","I-d, II-a, III-b, IV-e","I-b, II-a, III-e, IV-d","I-a, II-e, III-b, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Individualizm\nII. Puritanlik\nIII. Dominion\nIV. Torilar\na) Dehqonni yerga biriktiruvchi, feodalning ma'muriy va sud hokimiyatiga bo'ysundiruvchi huquqiy normalar majmuasi.\nb) Qirolning huquq va manfaatlari hamda mavjud tartiblarni qo'llabquvvatlagan guruh.\nc) Inson huquqlarini jamiyat manfaatlaridan mutlaq ustun qo'yadigan ta'limot.\nd) Britaniya imperiyasi tarkibidagi o'zini o'zi boshqaradigan, qirolni davlat boshlig'i deb tan oladigan davlat.\ne) Axloq qoidalariga qat'iy amal qilish, ehtiyojlarni o'ta cheklash, tejamkorlik va mehnatsevarlikka xos hayot tarzi.",["I-b, II-e, III-d, IV-a","I-c, II-e, III-d, IV-b","I-c, II-e, III-a, IV-d","I-e, II-d, III-a, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Generalgubernator\nII. Sanoat to'ntarishi\nIII. Milliy ta'sis majlisi\nIV. Plantatsiya\na) Yer rentasi shakllaridan biri: feodal foydasiga ishlab berish, natural va naqd pul shaklida.\nb) Tropik va subtropik ekinlar yetishtiriladigan yirik dehqonchilik xo'jaligi.\nc) Qirolning dominiondagi vakili.\nd) 1789–1791-yillarda Fransiyaning oliy vakillik va qonun chiqaruvchi organi; General shtatlar o'rniga tuzilgan.\ne) Manufaktura ishlab chiqarishidan mashinalar keng qo'llaniladigan fabrika ishlab chiqarishiga o'tish.",["I-c, II-a, III-e, IV-b","I-c, II-e, III-d, IV-b","I-a, II-e, III-b, IV-c","I-c, II-e, III-d, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Konkista\nII. Terror (lot. «qo'rquv, dahshat»)\nIII. Negus\nIV. Mikado\na) Siyosiy raqiblarni zo'ravonlik, jumladan o'ldirish orqali qo'rqitish siyosati.\nb) Efiopiya hukmdori unvoni.\nc) Yaponiya imperatorining qadimgi unvoni.\nd) Muhim siyosiy masalalarni muhokama qilish va qonun qabul qilish uchun podsho yig'gan tabaqaviy-vakillik organi.\ne) Amerikani zabt etish.",["I-e, II-a, III-b, IV-c","I-e, II-c, III-a, IV-b","I-c, II-a, III-b, IV-e","I-d, II-c, III-b, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Negus\nII. Kapitalist\nIII. O'ttiz yillik urush\nIV. Intensiv dehqonchilik\na) Yangi texnologiya, mexanizatsiya, o'g'it kabilar orqali hosildorlikni oshirish.\nb) Burjua jamiyatidagi hukmron sinf vakili, kapital egasi, yollanma mehnatdan ekspluatatsiya qiluvchi.\nc) 1839–1876-yillarda Usmoniylar imperiyasini modernizatsiyalashga qaratilgan islohotlar.\nd) Efiopiya hukmdori unvoni.\ne) 1618–1648-yillarda Muqaddas Rim imperiyasi hududida bo'lgan birinchi umumyevropa urushi.",["I-a, II-d, III-e, IV-b","I-b, II-e, III-c, IV-a","I-d, II-b, III-e, IV-a","I-d, II-e, III-c, IV-b"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Rasizm (irqchilik)\nII. Gilyotina\nIII. Konvent\nIV. Reformatsiya\na) Boshni tanadan judo qilib o'lim jazosini ijro etish mexanizmi; 1792yilda Jozef Gilotenning taklifi bilan qo'llangan.\nb) Feodal Yaponiyadagi mayda zodagonlar va daymyolarning harbiyfeodal tabaqasi.\nc) Katolik cherkovini isloh qilish jarayoni.\nd) 1792–1795-yillarda Fransiyaning oliy qonun chiqaruvchi organi.\ne) Irqlarning bo'linishi va bir irqning boshqasidan ustunligini tasdiqlovchi mafkura.",["I-e, II-b, III-d, IV-c","I-e, II-a, III-d, IV-c","I-d, II-a, III-e, IV-c","I-a, II-d, III-e, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Sintoizm (sinto)\nII. O'ttiz yillik urush\nIII. Tanzimat\nIV. Vigilar\na) 1839–1876-yillarda Usmoniylar imperiyasini modernizatsiyalashga qaratilgan islohotlar.\nb) 1618–1648-yillarda Muqaddas Rim imperiyasi hududida bo'lgan birinchi umumyevropa urushi.\nc) Parlament huquqlarini himoya qilgan, islohotlar tarafdori bo'lgan guruh.\nd) Qadimgi yapon dini («xudolar yo'li»); asosiy xudo – Quyosh ma'budasi Amaterasu.\ne) Siyosiy raqiblarni zo'ravonlik, jumladan o'ldirish orqali qo'rqitish siyosati.",["I-d, II-b, III-a, IV-c","I-c, II-b, III-d, IV-e","I-d, II-b, III-c, IV-e","I-a, II-b, III-d, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. «Oq koloniyalar»\nII. Syogun\nIII. Milliy ta'sis majlisi\nIV. Protestantizm\na) Pravoslav va katolik bilan birga xristianlikning asosiy yo'nalishlaridan biri (lot. «protestatio» – «tantanali bayonot, norozilik»).\nb) 1192–1867-yillarda Yaponiya harbiy hukmdori unvoni; imperator haqiqiy hokimiyatdan mahrum bo'lgan.\nc) Ivan Grozniy davrida podshoning yakkahokimligini o'rnatish va boyarlarni bostirish siyosati.\nd) 1789–1791-yillarda Fransiyaning oliy vakillik va qonun chiqaruvchi organi; General shtatlar o'rniga tuzilgan.\ne) Yevropadan (asosan Angliya va Irlandiyadan) kelgan ko'chmanchilar yashagan imtiyozli hududlar.",["I-e, II-d, III-c, IV-a","I-e, II-b, III-d, IV-a","I-d, II-e, III-b, IV-a","I-e, II-c, III-d, IV-b"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Yunker xo'jaligi\nII. Bob\nIII. Chartizm\nIV. Sintoizm (sinto)\na) Qadimgi yapon dini («xudolar yo'li»); asosiy xudo – Quyosh ma'budasi Amaterasu.\nb) Ingliz ishchilarining 1836–1848-yillardagi dastlabki ommaviy ijtimoiy-siyosiy harakati.\nc) Muhim siyosiy masalalarni muhokama qilish va qonun qabul qilish uchun podsho yig'gan tabaqaviy-vakillik organi.\nd) «Darvoza» ma'nosi; Said Ali Muhammad 1844-yilda o'zini shunday e'lon qilgan.\ne) Nemis zodagonlarining kapitalistik tarzda isloh qilingan xo'jaligi: yollanma mehnat bilan birga krepostnoylar mehnati saqlangan.",["I-d, II-a, III-b, IV-c","I-e, II-d, III-b, IV-c","I-e, II-d, III-b, IV-a","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kapital (lot. «capitalis» – «hukmron»)\nII. Konstitutsion monarxiya\nIII. Rasizm (irqchilik)\nIV. Sipohiylar (fors. «askar»)\na) Irqlarning bo'linishi va bir irqning boshqasidan ustunligini tasdiqlovchi mafkura.\nb) Inglizlar tomonidan mahalliy aholidan yollangan askarlar.\nc) Monarx hokimiyati va huquqlari konstitutsiya bilan cheklangan davlat tuzumi (parlament monarxiyasi).\nd) Real qiymatga ega bo'lgan va foyda keltiradigan hamma narsa.\ne) Rus davlatidagi feodal jamiyatning oliy tabaqasi; votchinaga egalik qilgan.",["I-d, II-a, III-e, IV-c","I-d, II-b, III-e, IV-a","I-d, II-c, III-a, IV-b","I-b, II-c, III-d, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Segregatsiya\nII. Manufaktura\nIII. «Oq koloniyalar»\nIV. Harbiy-len (timar)\na) Oq tanli aholini boshqa etnik guruhlardan ajratish.\nb) Mehnat taqsimoti va qo'l hunari texnikasiga asoslangan korxona.\nc) Turkiylar va Usmoniylarda feodal yer egaligi shakli; egasi harbiy yurishda ishtirok etgan.\nd) Ekin maydoni va chorva sonini ko'paytirish hisobiga mahsulotni ko'paytirish; texnikadan kam foydalanish, hosili past.\ne) Yevropadan (asosan Angliya va Irlandiyadan) kelgan ko'chmanchilar yashagan imtiyozli hududlar.",["I-e, II-a, III-b, IV-c","I-a, II-b, III-e, IV-c","I-b, II-d, III-e, IV-c","I-a, II-d, III-b, IV-e"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Torilar\nII. Taypinlar\nIII. Metis\nIV. Konsessiya (lot. «ruxsat»)\na) Yevropalik va hindularning nikohidan tug'ilgan farzandlar.\nb) Davlat korxonalari yoki mulkini muayyan muddatga chet el kapitaliga berish haqidagi kelishuv.\nc) Maxsus belgilangan maqsad bilan uyushtiriladigan sayohat.\nd) Qirolning huquq va manfaatlari hamda mavjud tartiblarni qo'llabquvvatlagan guruh.\ne) Xitoyda 1850-yillardagi qo'zg'olon qatnashchilari; «uzun sochlilar» deb ham atalgan.",["I-d, II-e, III-a, IV-b","I-d, II-a, III-e, IV-b","I-d, II-a, III-b, IV-c","I-d, II-e, III-a, IV-c"],0]]],["10-sinf O'zbekiston tarixi atamalari",[["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Jadid (arabcha)\nII. Bolshevik (ruscha bolshoy, bolshe – katta; ko'p)\nIII. Maorif (arabcha)\nIV. Chachvon\na) Rossiya sotsial-demokratik ishchi partiyasining 1903-yil II syezdida partiya a'zolarining ko'pchiligi asosida tashkil topgan guruhi bolsheviklar, kamchiligi esa minsheviklarga ajraldi.\nb) eski tuzum tarafdorlari, islohotlar va o'zgarishlarga qarshi turuvchilar.\nc) «yangi» degan ma'noni bildiradi.\nd) otning dumi qilidan to'qilgan, paranji ostidan yuzga tutiladigan to'r parda.\ne) insonlarning bilimi va tafakkurini oshirishga qaratilgan ta'lim-tarbiya.",["I-c, II-a, III-e, IV-d","I-b, II-c, III-e, IV-d","I-c, II-e, III-d, IV-b","I-d, II-a, III-b, IV-c"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kadetlar\nII. Deklaratsiya\nIII. Tuzem\nIV. Evakuatsiya (lotincha – bo'shatmoq, xoli qilmoq)\na) odamlar, tashkilot, korxonalarni, badiiy va boshqa kadriyatlarni urush, tabiiy ofat kabilar xavfidan saqlash maqsadida bir joydan boshqa joyga ko'chirish.\nb) «konstitutsion demokratlar» birikmasining bosh harflaridan olingan. Rossiyada 1905-yilda tashkil topgan, konstitutsion-demoqratik partiya deb ataluvchi partiyaning a'zolari.\nc) yerli xalq, mahalliy aholining mustamlakachilar tomonidan atalishi.\nd) hukumatning, biror tashkilotning muhim bir hujjatni, qonunni, voqeani ko'pchilik e'tiboriga yetkazuvchi bayonoti\ne) qabila urf-odatlariga tayanib ish ko'radigan sud.",["I-b, II-a, III-c, IV-d","I-e, II-d, III-a, IV-c","I-b, II-d, III-a, IV-c","I-b, II-d, III-c, IV-a"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Firqa (arab. – guruh, to'da; partiya)\nII. Biy sudlari\nIII. Gimnaziya\nIV. Konservativ (lotincha)\na) ayrim fanlarga ixtisoslashtirilgan va ular bo'yicha chuqur ta'lim beradigan o'quv muassasasi.\nb) qurol-asl to'planishi.\nc) 1) daromadga nisbatan xarajatlarning oshib ketishi; tanqislik; 2) yetish maslik, kamchillik, taqchillik; 3) yetarli miqdorda bo'lmagan, kam uchraydigan; kamchil, taqchil, kamyob.\nd) asosiy boyligini qishloq xo'jaligi mahsulotlari tashkil qiladigan, sanoati qishloq xo'jaligi mahsulotlari va tabiiy boyliklarni qayta ishlashga yo'naltirilgan mamlakat.\ne) dastlab hukumat idoralarining rahbarlari va amaldorlari hokimiyatini, keyinchalik jamiyatning turli sohalarida paydo bo'lgan yirik tashkilotlardagi xizmatchilar qatlamini ham ifodalagan.",["I-d, II-c, III-a, IV-b","I-e, II-d, III-c, IV-b","I-c, II-d, III-a, IV-e","I-c, II-d, III-b, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Kommunist\nII. Harbiy xunta\nIII. Postmodernizm\nIV. Korporatsiya\na) davlat to'ntarishi orqali hokimiyatga kelgan, odatda zo'rovonlik va diktatorlik usullari bilan davlatni boshqaradigan harbiylar hokimiyati.\nb) XX asr o'rtalari va oxirlarida rivojlangan yo'nalish bo'lib, u asosan falsafa, san'at, arxitektura va adabiy tanqidchilikda modernizm an'analaridan chekinishni o'zida ifodalaydi. Atama asosan modernizmdan keyin kelgan tarixiy davrni ifodalash uchun qo'llanadi.\nc) rivojlangan yirik aksiyadorlar jamiyati, biron-bir faoliyat uchun uyushgan yuridik va jismoniy shaxslar majmui.\nd) kommunizm tamoyillarini qo'llab-quvvatlaydigan yoki unga ishonadigan odam.\ne) dastlab hukumat idoralarining rahbarlari va amaldorlari hokimiyatini, keyinchalik jamiyatning turli sohalarida paydo bo'lgan yirik tashkilotlardagi xizmatchilar qatlamini ham ifodalagan.",["I-e, II-d, III-a, IV-c","I-b, II-d, III-a, IV-c","I-a, II-d, III-b, IV-c","I-d, II-a, III-b, IV-c"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Samoderjaviye\nII. Aqidaparastlik\nIII. Imperiya\nIV. Harbiy rejim\na) muayyan sharoitda biron-bir g'oya yoki tamoyilga qat'iy ishonib, uni mutlaqlashtirish asosida shakllangan qoida va tartiblarni sharoit, vaziyatni hisobga olmagan holda ko'r-ko'rona qo'llash yoki shunga urinish.\nb) xalqaro majburiyatlarga yoki xalqaro huquq me'yorlariga rioya qilmagan, ularni buzgan davlatlarga nisbatan bir mamlakat (yoki mamlakatlar guruhi) tomonidan qarshi qo'llanadigan (iqtisodiy, moliyaviy yoki harbiy) jazo yoxud ta'sir chorasi.\nc) 1) imperator, podshoh, qirol boshqaradigan davlat; 2) bir qancha mustamlaka hududlariga ega bo'lgan, totalitar tuzumga asoslangan davlat.\nd) davlatni boshqarish shakli bo'lib, unda butun hokimiyat harbiylarga tegishli bo'ladi. Odatda harbiy rejimlar harbiy to'ntarish orqali o'rnatiladi.\ne) Rossiyada podshoning cheklanmagan mustabid hokimiyati va shunday hokimiyat asosiga qurilgan davlat tuzumi.",["I-b, II-a, III-c, IV-d","I-e, II-a, III-c, IV-d","I-a, II-c, III-e, IV-d","I-c, II-e, III-b, IV-d"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Modernizatsiya\nII. Avtarkiya\nIII. Parij kommunasi\nIV. Antisovetizm\na) rivojlangan mamlakatlarda XX asrning ikkinchi yarmidan ijtimoiy taraqqiyotda vujudga kela boshlagan yangi bosqich.\nb) mamlakatning o'z-o'zini ta'minlash qoidasiga asoslangan, boshqa mamlakatlar bilan iqtisodiy aloqalardan uzilib qolgan biqiq xo'jalik yuritish siyosati.\nc) sovet hokimiyati, sovet turmush tarziga yoki Sovet Ittifoqiga qarshi qaratilgan qarashlar tizimi.\nd) biror narsani yangilash, zamonaviy talablar va me'yorlarga muvofiq o'zgartirish.\ne) 1871-yilning 18-martidan 28-mayigacha Fransiyani boshqargan muvaqqat hukumat.",["I-d, II-e, III-a, IV-b","I-a, II-b, III-c, IV-e","I-d, II-e, III-b, IV-a","I-d, II-b, III-e, IV-c"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Aparteid\nII. Sekulyarlik\nIII. Oq inqilob\nIV. Direktiva\na) irqiy kamsitishning eng ashaddiy ko'rinishi.\nb) hukumat va boshqa huquq manbalari dinning har qanday turidan alohida bo'lishi kerakligi haqidagi tushuncha.\nc) ommaviy yig'in, majlis, kengash, yirik anjuman.\nd) yuqori rahbar organlar tomonidan berilgan va bajarilishi majburiy sanalgan rasmiy yo'l-yo'riq, dastur, ko'rsatma.\ne) 1963–1979-yillarda shoh Muhammad Rizo Pahlaviy tomonidan Eronda amalga oshirilgan siyosiy va ijtimoiy-iqtisodiy islohotlar majmui. Ular madaniyat va agrar sektordagi o'zgarishlar, aholining saylov huquqlarini kengaytirish va mamlakatni sanoatlash tirishni o'z ichiga oladi.",["I-a, II-b, III-c, IV-d","I-a, II-b, III-e, IV-d","I-d, II-b, III-a, IV-c","I-b, II-c, III-e, IV-a"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Anneksiya\nII. Natsionalizatsiya\nIII. Avtoritar rejim\nIV. Koalitsiya\na) intervensiya uyushtiruvchi yoki unda qatnashuvchi.\nb) siyosiy hokimiyat birgina hukmdor shaxs yoki bir guruh shaxslarning irodasi, markazlashgan hokimiyatiga asoslangan davlat boshqaruvi usuli.\nc) 1) xalqaro munosabatlarning ayrim masalalarida birgalikda ish ko'rish haqida o'zaro ahdlashgan davlatlarning siyosiy yoki harbiy ittifoqi; 2) bir necha siyosiy partiyalarning shu partiyalar vakillaridan iborat hukumat tuzish to'g'risidagi kelishuvi.\nd) ayrim shaxs yoki birlashmalarning xususiy mulki bo'lgan yer, ishlab chiqarish korxonalari, transport, banklarni davlat yoki jamiyat mulkiga aylantirish, davlat ixtiyoriga olish.\ne) boshqa bir davlat hududini butunlay yoki qisman egallab olish yoki o'z davlatiga qo'shib olish siyosati.",["I-d, II-e, III-a, IV-c","I-b, II-a, III-e, IV-c","I-e, II-d, III-b, IV-c","I-d, II-c, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Konferensiya\nII. Demokratizatsiyalash\nIII. Dekret\nIV. Izolyatsionizm\na) demokratik tamoyillarni siyosiy tizimga, madaniyatga, turmush tarziga va boshqalarga joriy etish.\nb) boshqa davlatlar, millatlar, xalqlar, etnik guruhlarning ishlariga aralashmaslik g'oyasiga asoslangan tashqi siyosat yo'nalishini belgilash.\nc) Rossiyada podshoning cheklanmagan mustabid hokimiyati va shunday hokimiyat asosiga qurilgan davlat tuzumi.\nd) davlat yoki partiya, jamoat va olimlar vakillarining muayyan masalani muhokama etish uchun yig'ilishi.\ne) oliy hokimiyat yoki boshqaruv organi chiqargan va qonun kuchiga ega bo'lgan muhim qaror.",["I-d, II-b, III-c, IV-e","I-c, II-a, III-d, IV-b","I-a, II-c, III-d, IV-b","I-d, II-a, III-e, IV-b"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Genotsid\nII. Mandat\nIII. Fashizm\nIV. Kasta tizimi\na) biror shaxsning vakolatini, muayyan narsaga huquqini tasdiqlovchi hujjat.\nb) totalitar tipdagi siyosiy diktaturaga asoslangan hokimiyatning siyosiy konsepsiyasi.\nc) hind jamoasiga xos murakkab ijtimoiy tizim bo'lib, tabaqalanishni ifodalaydi.\nd) boshqa bir davlat hududini butunlay yoki qisman egallab olish yoki o'z davlatiga qo'shib olish siyosati.\ne) xalqaro jinoyatlarning bir turi: irqi, millati, dini, etnik tarkibiga ko'ra, aholi guruhlarini yoppasiga yoki qisman jismonan qirib yuborishga qaratilgan harakat.",["I-e, II-d, III-a, IV-b","I-e, II-a, III-b, IV-d","I-e, II-a, III-b, IV-c","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Dominion\nII. Forum\nIII. Pax Britanica\nIV. Industrial sivilizatsiya\na) ingliz qiroli (qirolicha)ni davlat boshlig'i deb tan oladigan va Britaniya imperiyasi tarkibida bo'lgan davlat.\nb) Buyuk Britaniyaning 1815-yilgi Vaterloo jangidan boshlab Birinchi jahon urushiga qadar dengizdagi va xalqaro munosabatlardagi hukmronlik davri.\nc) sovet hokimiyati, sovet turmush tarziga yoki Sovet Ittifoqiga qarshi qaratilgan qarashlar tizimi.\nd) ommaviy yig'in, majlis, kengash, yirik anjuman.\ne) ijtimoiy hayot uchun muhim rol o'ynaydigan jamiyat. Yangi davrda shakllangan bozor munosabatlari, siyosiy va ijtimoiy tenglik, huquqiy davlat, diniy bag'rikenglik, inson huquqlari, umuminsoniy qadriyatlar kabi tushunchalar industrial sivilizatsiyaning asosiy belgilari hisoblanadi.",["I-b, II-d, III-a, IV-e","I-a, II-d, III-e, IV-c","I-a, II-d, III-b, IV-e","I-e, II-a, III-b, IV-c"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Okkupatsiya\nII. Konveyer\nIII. Desentralizatsiyalash\nIV. Sotsializm\na) xususiy mulkni ijtimoiy mulkka aylantirish orqali erkinlik va tenglik, baxt va farovonlikka erishish mumkin deb hisoblovchi ta'limot.\nb) urush olib borayotgan tomon qurolli kuchlarining boshqa davlat yerlarini bosib olib, vaqtincha egallab turishi. Anneksiya – boshqa bir davlat hududini butunlay yoki qisman egallab olish yoki o'z davlatiga qo'shib olish siyosati.\nc) markazlashgan tizimdan markazlashmagan tizimga o'tish yoki o'tkazish.\nd) oliy hokimiyat yoki boshqaruv organi chiqargan va qonun kuchiga ega bo'lgan muhim qaror.\ne) yuk tashish, mashinani butlab yig'ish yoki ishlanayotgan narsalarni bir ish joyidan ikkinchi ish joyiga ketma-ket uzluksiz yetkazib berish uchun to'xtovsiz yoki davriy ravishda aylanib ishlab turadigan lentasimon maxsus transport qurilmasi.",["I-b, II-e, III-c, IV-a","I-b, II-d, III-c, IV-e","I-e, II-b, III-d, IV-a","I-d, II-b, III-c, IV-a"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Referendum\nII. Liberal\nIII. Intervensiya\nIV. Postindustrial sivilizatsiya\na) bir yoki bir necha davlatning boshqa bir davlat ichki ishlariga zo'rlik bilan aralashuvi, uning hududiy yaxlitligi, siyosiy mustaqilligiga qarshi qaratilgan harakatlari.\nb) 1) hur fikrli, erkin shaxs; murosasoz, kelishuvchi; 2) liberalizm tarafdori.\nc) fuqarolarning davlat, viloyat yoki mahalliy ko'lamda eng muhim masalalar bo'yicha ovoz berish yo'li orqali o'z fikrlarini bevosita bildirishlari.\nd) rivojlangan mamlakatlarda XX asrning ikkinchi yarmidan ijtimoiy taraqqiyotda vujudga kela boshlagan yangi bosqich.\ne) davlat to'ntarishi orqali hokimiyatga kelgan, odatda zo'rovonlik va diktatorlik usullari bilan davlatni boshqaradigan harbiylar hokimiyati.",["I-c, II-b, III-d, IV- , vaziyatni hisobga olmagan holda ko'r-ko'rona qo'llash yoki shunga urinish.",["I-a, II-b, III-c, IV-e","I-b, II-a, III-d, IV-e","I-e, II-d, III-c, IV-b","I-a, II-c, III-b, IV-d"],0],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Industrial sivilizatsiya\nII. Konferensiya\nIII. Defitsit\nIV. Parij kommunasi\na) 1) daromadga nisbatan xarajatlarning oshib ketishi; tanqislik; 2) yetish maslik, kamchillik, taqchillik; 3) yetarli miqdorda bo'lmagan, kam uchraydigan; kamchil, taqchil, kamyob.\nb) davlat yoki partiya, jamoat va olimlar vakillarining muayyan masalani muhokama etish uchun yig'ilishi.\nc) ijtimoiy hayot uchun muhim rol o'ynaydigan jamiyat. Yangi davrda shakllangan bozor munosabatlari, siyosiy va ijtimoiy tenglik, huquqiy davlat, diniy bag'rikenglik, inson huquqlari, umuminsoniy qadriyatlar kabi tushunchalar industrial sivilizatsiyaning asosiy belgilari hisoblanadi.\nd) 1871-yilning 18-martidan 28-mayigacha Fransiyani boshqargan muvaqqat hukumat.\ne) siyosiy hokimiyat birgina hukmdor shaxs yoki bir guruh shaxslarning irodasi, markazlashgan hokimiyatiga asoslangan davlat boshqaruvi usuli.",["I-d, II-c, III-a, IV-e","I-c, II-b, III-d, IV-a","I-a, II-b, III-c, IV-e","I-c, II-b, III-a, IV-d"],3],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Postindustrial sivilizatsiya\nII. Genotsid\nIII. Natsionalizatsiya\nIV. Okkupatsiya\na) oliy hokimiyat yoki boshqaruv organi chiqargan va qonun kuchiga ega bo'lgan muhim qaror.\nb) urush olib borayotgan tomon qurolli kuchlarining boshqa davlat yerlarini bosib olib, vaqtincha egallab turishi. Anneksiya – boshqa bir davlat hududini butunlay yoki qisman egallab olish yoki o'z davlatiga qo'shib olish siyosati.\nc) xalqaro jinoyatlarning bir turi: irqi, millati, dini, etnik tarkibiga ko'ra, aholi guruhlarini yoppasiga yoki qisman jismonan qirib yuborishga qaratilgan harakat.\nd) ayrim shaxs yoki birlashmalarning xususiy mulki bo'lgan yer, ishlab chi b chiqaradigan mahsulotlari turining kengayishi, yangilanib turishi.\nb) Davlat yoki boshqa biron-bir muassasa tomonidan boshqa davlat, muassasa yoki shaxsga ko'rsatiladigan moliyaviy yoki moddiy yordam.\nc) (inglizcha Brexit — Britain + exit) Buyuk Britaniyaning Yevropa Ittifoqiga a'zoligining to'xtatilishi, a'zolikdan chiqishi.\nd) Ko'zlangan maqsadga erishish uchun qo'llaniladigan usul va vositalar yig'indisi.\ne) Irqlarning teng emasligi, «oliy» irqlarning «past» irqlar ustidan hukmronlik qilishi haqidagi g'ayriilmiy, reaksion nazariya.",["I-b, II-c, III-d, IV-a","I-c, II-d, III-e, IV-a","I-e, II-d, III-b, IV-a","I-c, II-d, III-b, IV-a"],2],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Totalitar mafkura\nII. Paritet\nIII. Izolyatsiya\nIV. Institutsional o'zgarishlar\na) Qaysidir soha yoki jabhada mavjud barcha imkoniyatlar, vositalar yig'indisi; keng ma'noda «zaxira» vositalari.\nb) Mafkuraviy tuzum shakli bo'lib, totalitar jamiyatda aholini keng miqyosda, ommaviy ravishda mafkuraviy qayta tarbiyalash vositasi.\nc) Xarid qilish qobiliyati pariteti: turli mamlakatlar valyutalarining ma'lum tovar yoki xizmatga nisbatan sotib olish qobiliyatini hisobga oluvchi o'zaro nisbati.\nd) Ijtimoiy-iqtisodiy taraqqiyotning tarkibiy qismi bo'lib, ijtimoiy institutlardagi rivojlanish va o'zgarishlarda namoyon bo'ladi.\ne) Xalqaro hamjamiyatdan ajratib qo'yish, yakkalash.",["I-d, II-c, III-b, IV-e","I-b, II-c, III-e, IV-d","I-d, II-c, III-a, IV-b","I-b, II-e, III-d, IV-c"],1],["Quyida berilgan atamalar va ularning izohi to'g'ri moslashtirilgan javobni toping.\nI. Makrotexnologiya\nII. Devalvatsiya\nIII. Urbanizatsiya\nIV. Breksit\na) (inglizcha Brexit — Britain + exit) Buyuk Britaniyaning Yevropa Ittifoqiga a'zoligining to'xtatilishi, a'zolikdan chiqishi.\nb) Belgilangan parametrlar bo'yicha ma'lum mahsulot turini yaratishdagi barcha texnologik jarayonlar (ilmiy-texnik izlanishlar, konstruktorlik, ishlab chiqarish, sotish, servis) majm

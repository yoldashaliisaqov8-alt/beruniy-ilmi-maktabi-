<!DOCTYPE html>
<html lang="uz">
<head><script src="kirish.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-sinf testlari — Isakov school</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f9fb;
    --paper-light: #ffffff;
    --ink: #10223d;
    --ink-soft: #5b6b82;
    --wine: #1a6ee8;
    --wine-dark: #1457c0;
    --gold: #ffc928;
    --green: #2f9a5f;
    --bad: #d4574a;
    --line: #e6ecf2;
    --serif: 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  a{color:var(--ink-soft); text-decoration:none; font-size:16px;}
  .wrap{max-width:840px; margin:0 auto; padding:0 24px;}

  header{padding:26px 0;}
  .brand{font-family:var(--serif); font-size:24px; font-weight:600;}
  .brand span{color:var(--wine);}

  .test-head{padding:10px 0 34px;}
  .test-head .eyebrow{
    font-family:var(--serif); font-style:italic; color:var(--wine); font-size:17px; margin-bottom:10px;
  }
  .test-head h1{
    font-family:var(--serif); font-size:42px; font-weight:600; margin:0 0 12px;
  }
  .test-head p.sub{color:var(--ink-soft); font-size:18px; margin:0;}
  .progress-track{
    height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:22px;
  }
  .progress-fill{
    height:100%; background:var(--wine); width:0%; transition:width 0.3s ease;
  }
  .progress-text{font-size:16px; color:var(--ink-soft); margin-top:10px;}

  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    padding:44px 40px;
    margin-bottom:26px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:32px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 32px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:22px 24px;
    margin-bottom:14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:22px;
    color:var(--ink);
    cursor:pointer;
  }
  .option:hover{border-color:var(--ink-soft);}
  .option.correct{
    background:rgba(47,154,95,0.14);
    border-color:var(--green);
    font-weight:600;
  }
  .option.wrong{
    background:rgba(212,87,74,0.1);
    border-color:var(--bad);
  }
  .option:disabled{cursor:default;}

  .btn{
    display:inline-block;
    font-family:var(--sans);
    font-weight:600;
    font-size:18px;
    padding:16px 30px;
    border-radius:4px;
    border:none;
    background:var(--wine);
    color:var(--paper-light);
    cursor:pointer;
  }
  .btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}

  .result{
    text-align:center;
    padding:60px 20px;
  }
  .result .score{
    font-family:var(--serif);
    font-size:72px;
    font-weight:700;
    color:var(--wine);
    margin:0 0 10px;
  }
  .result p{color:var(--ink-soft); margin:0 0 32px; font-size:18px;}
  .hidden{display:none;}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .topic-card{
    background:var(--paper-light);
    padding:28px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-family:var(--sans);
  }
  .topic-card:hover{background:var(--paper);}
  .group-head{background:#eaf2ff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--wine-dark);}
  .group-head span{font-weight:700;font-size:15px;color:var(--ink-soft);}
  @media (max-width:600px){.group-head{padding:12px 18px;font-size:16px;}.topic-card{padding:20px 18px !important;}}
  .topic-info h3{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .topic-info p{
    margin:0;
    font-size:16px;
    color:var(--ink-soft);
  }
  .topic-arrow{
    font-family:var(--serif);
    font-style:italic;
    color:var(--wine);
    font-size:18px;
    flex-shrink:0;
  }
  .q-image{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:4px;
    margin:0 0 26px;
  }
  .q-table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 26px;
    font-family:var(--sans);
    font-size:17px;
  }
  .q-table td{
    border:1px solid var(--line);
    padding:10px 14px;
  }
  .q-table tr:first-child td{
    background:var(--paper);
    font-weight:600;
    font-family:var(--serif);
  }

  .error-box{
    background:rgba(212,87,74,0.1);
    border:1px solid var(--wine);
    color:#9a3a30;
    padding:18px 20px;
    margin-bottom:20px;
    font-size:15px;
    border-radius:4px;
  }


  /* Variant harfi belgisi */
  .option{display:flex; align-items:center; gap:18px;}
  .opt-key{
    flex-shrink:0; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink-soft); border-radius:4px; font-weight:600; font-size:18px;
    font-family:var(--serif); color:var(--ink-soft); background:var(--paper-light);
  }
  .option.correct .opt-key{background:var(--green); border-color:var(--green); color:#fff;}
  .option.wrong .opt-key{background:var(--bad); border-color:var(--bad); color:#fff;}
  .kbd-hint{display:none; font-size:15px; color:var(--ink-soft); margin-top:6px;}

  /* KOMPYUTER UCHUN: kengroq maket */
  @media (min-width:1000px){
    .wrap{max-width:1080px; padding:0 40px;}
    .test-head h1{font-size:50px;}
    .test-head p.sub{font-size:20px;}
    .card{padding:56px 64px;}
    .q-text{font-size:38px; margin-bottom:40px;}
    .option{font-size:24px; padding:24px 28px;}
    .opt-key{width:42px; height:42px; font-size:20px;}
    .q-table{font-size:20px;}
    .q-image{max-height:460px; margin-left:auto; margin-right:auto;}
    .kbd-hint{display:block;}
    .option:hover{background:var(--paper-light); border-color:var(--wine);}
  }
  @media (min-width:1500px){
    .wrap{max-width:1240px;}
    .q-text{font-size:42px;}
    .option{font-size:26px;}
  }

  @media (max-width:600px){
    .q-text{font-size:24px;}
    .option{font-size:18px; padding:18px 18px;}
    .test-head h1{font-size:32px;}
    .card{padding:28px 24px;}
    .topic-info h3{font-size:21px;}
  }

  body{
    background-color:var(--paper);
    background-image:radial-gradient(circle at 12% 0%, #e8f1ff 0, transparent 38%), radial-gradient(circle at 100% 100%, #fff3da 0, transparent 34%);
    background-attachment:fixed;
  }
  .card{border-radius:30px; box-shadow:0 8px 24px -16px rgba(16,34,61,.25);}
  .option{border-radius:18px;}
  .btn{border-radius:16px;}
  .progress-track,.progress-fill{border-radius:6px;}
  .brand{font-weight:800; letter-spacing:.5px;}
  .q-text,.test-head h1{font-weight:800;}
</style>

    <button class="btn btn-ghost" style="margin-left:10px;" onclick="showTopicScreen()">Boshqa mavzu tanlash</button>
  </div>

</main>

<script type="text/plain" class="question-data"
        data-key="k6-00" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="Kirish. Qadimgi dunyo tarixini o'rganish" data-desc="10 ta savol">
Tarix fanida qadimgi dunyo tarixi qaysi voqea bilan yakunlanadi?
A) Mil. avv. 27-yilda Rimda imperiya o'rnatilishi bilan
B) Mil. avv. 30-yilda Misrning Rimga bo'ysundirilishi bilan
C) Milodiy 395-yilda Rim imperiyasining ikkiga bo'linishi bilan
D) Milodiy 476-yilda G'arbiy Rim imperiyasining qulashi bilan
JAVOB: D

Qadimgi dunyo tarixi qaysi davrdan boshlanadi?
A) Yer yuzida odam paydo bo'lgan davrdan
B) Metall kashf qilingan davrdan
C) Ilk davlatlar tashkil topgan davrdan
D) Dastlabki yozuv ixtiro qilingan davrdan
JAVOB: A

Kirishga ko'ra, qadimgi dunyo tarixi qanday manbalarda o'z aksini topgan?
A) Turli-tuman arxeologik va yozma manbalarda
B) Faqat qadimgi hukmdorlarning bitiklarida
C) Faqat xalq og'zaki ijodi va rivoyatlarda
D) Faqat arxeologik qazishma topilmalarida
JAVOB: A

Kirishda insonning uzoq tarixiy yo'li qaysi bosqichdan boshlangani aytiladi?
A) Yozuvni yaratishdan
B) Dastlabki shaharlarni bunyod etishdan
C) Tosh qurollarni yasashdan
D) Metallni kashf qilishdan
JAVOB: C

Kirishga ko'ra, uzoq o'tmishda Vatanimiz – O'zbekiston zaminida nima yaratilgan?
A) Ilk iyeroglif yozuvi
B) Ilk yunon polislari
C) Dastlabki piramidalar
D) O'ziga xos sivilizatsiya
JAVOB: D

Kirishga ko'ra, qadimda O'zbekiston zaminida yana nimalar tashkil topgan?
A) Dastlabki piramidalar va zikkuratlar
B) Ilk yunon polislari va koloniyalari
C) Qadimgi shaharlar va davlatlar
D) Misrdagi kabi nomlar va nomarxliklar
JAVOB: C

Kirishga ko'ra, o'lka dovrug'ini o'z mehnati va yaratuvchanlik salohiyati bilan olamga kimlar yoyganlar?
A) Ovchilar, baliqchilar va termachilar
B) Sarkardalar, kohinlar va hukmdorlar
C) Ziroatchilar, hunarmandlar va quruvchilar
D) Savdogarlar, elchilar va sayyohlar
JAVOB: C

Jadvaldagi bo'sh joylarni to'ldiruvchi javoblarni toping.
JADVAL:
Kirishdagi ma'lumot | Javob
Qadimgi dunyo tarixi boshlanadigan davr | 1) ________
2) ________ | milodiy 476-yil
Qadimgi dunyo tarixi aks etgan manbalar | 3) ________
a) Yer yuzida odam paydo bo'lishi; b) ilk davlatlarning paydo bo'lishi; c) G'arbiy Rim imperiyasining qulashi; d) Rim imperiyasining ikkiga bo'linishi; e) arxeologik va yozma manbalar; f) faqat og'zaki rivoyatlar.
A) 1-a, 2-c, 3-e
B) 1-a, 2-c, 3-f
C) 1-b, 2-c, 3-e
D) 1-a, 2-d, 3-e
JAVOB: A

Jadvaldagi A, B, C harflari o'rniga mos keladigan javoblarni toping.
JADVAL:
Inson faoliyati | Boshlanishi | Erishilgan natija
Mehnat qurollari | tosh qurollar yasash | A
Turarjoy qurilishi | B | dastlabki shaharlar bunyod etilishi
Yaratuvchanlik | ziroatchilar, hunarmandlar, quruvchilar mehnati | C
1) metallning kashf qilinishi; 2) piramidalar qurilishi; 3) eng oddiy turarjoylar qurish; 4) o'lka dovrug'ining olamga yoyilishi; 5) temir qurollarning tarqalishi; 6) yangi yerlarning bosib olinishi.
A) A-5, B-3, C-4
B) A-1, B-3, C-4
C) A-1, B-2, C-4
D) A-1, B-3, C-6
JAVOB: B

Kirishga oid to'g'ri hukmlarni aniqlang.
I. Qadimgi dunyo tarixi milodiy 476-yilda G'arbiy Rim imperiyasining qulashi bilan yakunlanadi.
II. Qadimgi dunyo tarixi faqat yozma manbalarda aks etgan.
III. Inson tosh qurollarni yasashdan metallni kashf qilgunga qadar uzoq yo'l bosib o'tgan.
IV. Qadimda O'zbekiston zaminida shahar va davlatlar tashkil topmagan.
A) III va IV
B) I va II
C) I va III
D) II va IV
JAVOB: C

</script>

<script type="text/plain" class="question-data"
        data-key="k6-01" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="1-mavzu. Qadimgi tarix ildizlari" data-desc="30 ta savol">
Tarix fanida qadimgi dunyo tarixi qaysi davrni o'z ichiga oladi?
A) Tosh davri boshlanganidan Buyuk ipak yo'li vujudga kelguniga qadar
B) Yer yuzida odam paydo bo'lganidan milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar
C) Yer yuzida odam paydo bo'lganidan metallning kashf etilishigacha
D) Ilk davlatlar paydo bo'lganidan milodiy 476-yilgacha
JAVOB: B

Qadim zamonlarda odamlar yashagan manzilgoh va turarjoylarda qazishma ishlarini olib boruvchi olimlar qanday ataladi?
A) Geograflar
B) Antropologlar
C) Arxeologlar
D) Etnograflar
JAVOB: C

Qadimgi odamlarning skelet va bosh chanoqlarini tekshirib, ularning tashqi ko'rinishini tiklovchi olimlar kimlar?
A) Antropologlar
B) Tarixchilar
C) Arxeologlar
D) Etnograflar
JAVOB: A

Etnograflar nimani o'rganadi?
A) Qoyalarga o'yib yozilgan qadimgi bitiklarni
B) Qadimgi odamlarning suyak qoldiqlarini
C) Qadimgi manzilgohlardagi qazishma topilmalarini
D) Qadimgi urf-odat, xo'jalik va madaniy an'analarni saqlab qolgan, hozir yashayotgan qabila va elatlarni
JAVOB: D

Arxeologlar topgan mehnat qurollari, sopol idishlar, qurol-aslahalar va zeb-ziynat buyumlari qanday manbalar hisoblanadi?
A) Etnografik manbalar
B) Og'zaki manbalar
C) Yozma manbalar
D) Moddiy (ashyoviy) manbalar
JAVOB: D

Nima uchun olimlar arxeologik topilmalardan tashqari yozma manbalarga ham murojaat etadilar?
A) Arxeologiya ma'lumotlari qadimgi dunyo tarixi haqida to'la tasavvur bera olmaydi
B) Arxeologik topilmalar faqat O'rta Osiyodan topilgan
C) Yozma manbalar arxeologik topilmalardan qadimiyroq
D) Arxeologik qazishmalar taqiqlangan edi
JAVOB: A

O'rta Osiyo tarixi bo'yicha eng qadimgi yozma manba qaysi?
A) “Avesto”
B) Behistun yozuvlari
C) Gerodotning “Tarix” kitobi
D) Strabonning “Geografiya”si
JAVOB: A

Behistun qoyasi yozuvlari qayerda joylashgan va kimning buyrug'i bilan bitilgan?
A) Misrda; fir'avn Tutmos III buyrug'i bilan
B) Eronda; Kir II buyrug'i bilan
C) Bobilda; Hammurapi buyrug'i bilan
D) Eronda; fors shohi Doro I buyrug'i bilan
JAVOB: D

Behistun yozuvlari O'rta Osiyo tarixi uchun nima sababdan qimmatli manba hisoblanadi?
A) U O'rta Osiyoda yaratilgan eng qadimgi yozuv hisoblanadi
B) Unda Aleksandrning O'rta Osiyoga yurishlari yoritilgan
C) Unda zabt etilgan o'lkalar qatorida O'rta Osiyoning qadimgi davlatlari ham sanab o'tiladi
D) Unda O'rta Osiyo shaharlarining batafsil xaritasi berilgan
JAVOB: C

Miloddan avvalgi V asrda turli mamlakatlarga sayohat qilib, “Tarix” kitobini yozgan yunon tarixchisi kim?
A) Arrian
B) Gerodot
C) Strabon
D) Ksenofont
JAVOB: B

“Aleksandrning harbiy yurishlari” asari muallifi va u yozilgan davrni toping.
A) Gerodot; mil. avv. V asr
B) Strabon; mil. avv. I asr oxiri
C) Arrian; milodiy II asr
D) Arrian; mil. avv. II asr
JAVOB: C

Mil. avv. I asr oxirlarida “Geografiya” nomli asar yozgan qadimgi yunon tarixchisi va geografi kim?
A) Strabon
B) Gerodot
C) Arrian
D) Ptolemey
JAVOB: A

Mualliflar va ularning asarlari to'g'ri moslashtirilgan javobni aniqlang.
1) Gerodot; 2) Strabon; 3) Arrian.
a) “Geografiya”; b) “Aleksandrning harbiy yurishlari”; c) “Tarix”; d) “Avesto”.
A) 1-c, 2-a, 3-b
B) 1-a, 2-c, 3-b
C) 1-d, 2-a, 3-b
D) 1-c, 2-b, 3-a
JAVOB: A

Manbalarni yaratilish davri bo'yicha xronologik ketma-ketlikda joylashtiring.
1) Strabonning “Geografiya”si; 2) Gerodotning “Tarix” kitobi; 3) Arrianning “Aleksandrning harbiy yurishlari” asari.
A) 2, 1, 3
B) 1, 2, 3
C) 3, 2, 1
D) 2, 3, 1
JAVOB: A

Jahondagi barcha xalqlarning tarixi qaysi tuzumdan boshlangan?
A) Urug'chilik tuzumidan
B) Ibtidoiy jamoa tuzumidan
C) Quldorlik tuzumidan
D) Patriarxat tuzumidan
JAVOB: B

Insoniyat rivojidagi birinchi bosqich nima edi?
A) Dehqonchilikka o'tish
B) Kishilarning alohida guruhlarga birlashuvi – eng qadimgi odamlarning dastlabki jamoasi
C) Urug' jamoalarining qabilalarga birlashuvi
D) Ota urug'i davrining boshlanishi
JAVOB: B

Dastlabki urug' jamoalari kim atrofida birlashgan va bu davr qanday ataladi?
A) Oqsoqollar atrofida; matriarxat
B) Erkak kishi atrofida; patriarxat
C) Ayol – ona atrofida; patriarxat
D) Ayol – ona atrofida; matriarxat
JAVOB: D

Jamoadagi yetakchilik mavqeyining erkak kishiga o'ta boshlashiga nima sabab bo'lgan?
A) Olovdan foydalanishni o'rganish
B) Mehnat qurollari va xo'jalik yuritish shakllarining takomillashuvi
C) Buyuk muzlik davrining boshlanishi
D) Diniy e'tiqodlarning paydo bo'lishi
JAVOB: B

“Patriarxat” atamasining ma'nosini toping.

B) Memfis va Fiva ma'budlari birlashgan

Amon qaysi shaharning homiysi bo'lgan?

Quyosh ma'budi Raning ibodatxonasi qayerda bo'lgan?

Fir'avnlar hamma ishni kimning amri bilan amalga oshiradi deb qaralgan?

Xapi qanday ma'bud hisoblangan?

Osiris qanday ma'bud hisoblangan?

Qadimgi Misr ma'budlari va ularning vazifalari to'g'ri moslashtirilgan javobni aniqlang.
1) Amon-Ra; 2) Xapi; 3) Osiris.

B) 1-b, 2-c, 3-a

Misrda ma'budlar va odamlar o'rtasida kim vositachi hisoblangan?
A) Fir'avnlar

Misrliklar e'tiqodicha, Yer yuzida maxsus marosimlar ado etilmasa nima bo'ladi?

C) Ma'budlar odamlarga madad bermay qo'yadi
D) Quyosh chiqmay qoladi

Kohinlar nufuzining kuchli bo'lishiga sabab bo'lgan bilimlarni aniqlang.
1) Nil toshqini vaqtini bilgan; 2) urug' sochish va hosil yig'ish muddatini aniq bilgan; 3) diniy marosimlarni bilgan; 4) temir eritishni bilgan.

Kohinlarning vazifalariga oid to'g'ri fikrni toping.

Misrda ibodatxonalar qayerlarda bo'lgan?
A) Faqat Fivada

Fir'avnlar ibodatxonalarga nima hadya etardi?
A) Katta-katta boylik va yerlar

C) Faqat qurbonlik hayvonlari

Darslikka ko'ra, qaysi ma'bud Osiris taxtining himoyachisi sanalgan?
A) Ptax
B) Apis

D) Amon

Qadimgi misrliklar e'tiqodiga xos jihatni aniqlang.
A) Ajdodlar ruhiga sig'inmaslik
B) Ma'budlar hayvon qiyofasida odamlar orasida yashaydi, deb ishonish
C) Olov va suvga sig'inish

Misrliklarning qaysi e'tiqodi ibtidoiy odamlarning totemizmiga o'xshab ketadi?
A) Ma'budlarning hayvonlar qiyofasida yashashiga ishonish
B) Ibodatxonalarga yer hadya qilish
C) Kohinlarni vositachi deb bilish

Ma'budlar va ular bilan bog'liq shahar yoki joylar to'g'ri berilgan javobni toping.
A) Ptax – Memfis, Amon – Geliopol, Ra – Fiva

C) Ptax – Geliopol, Amon – Fiva, Ra – Memfis
D) Ptax – Memfis, Amon – Fiva, Ra – Geliopol

<script type="text/plain" class="question-data"
        data-key="k6-09" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="9-mavzu. Piramidalar va daxmalar" data-desc="30 ta savol">
Qadimgi va O'rta podsholiklar davrida barpo etilgan ulkan piramidalar nima vazifani bajargan?
A) Ibodatxonalar bo'lgan
B) Don omborlari bo'lgan
C) Rasadxonalar bo'lgan
D) Fir'avnlar dafn etiladigan joy – maqbaralar bo'lgan
JAVOB: D

“Hamma narsa vaqtdan qo'rqadi, vaqt esa piramidalardan!” iborasi nimani anglatadi?
A) Piramidalar kohinlar uchun qurilgan
B) Piramidalar juda tez qurilgan
C) Piramidalar ichida vaqt o'lchanadigan soatlar bo'lgan
D) Piramidalar to'rt ming yildan oshiq vaqt davomida o'zgarmasdan saqlanib turibdi
JAVOB: D

Eng mashhur piramidalar qaysi shahar yaqinida joylashgan?
A) Assuan

C) Fiva
D) Memfis

Memfis yaqinidagi mashhur piramidalar qaysi fir'avnlar uchun bunyod etilgan?
A) Menes, Yaxmos va Tutmos
B) Xufu, Xafra va Menkaura
C) Tutanxamon, Xufu va Menes
D) Tutmos II, Tutmos III va Yaxmos

Memfis yaqinidagi piramidalar qanday maqomga ega?
A) Butunlay vayron bo'lgan
B) Jahonning yetti mo'jizasidan biri hisoblanib, hozirgacha saqlanib qolgan
C) Yangi podsholik davrida qurilgan
D) Faqat Misrning ramzi hisoblanadi
JAVOB: B

Eng katta piramida kim uchun qurilgan?
A) Menkaura uchun
B) Xafra uchun
C) Tutanxamon uchun
D) Xufu (Xeops) uchun

Fir'avn Xufuni yunonlar qanday atashgan?

B) 20 metr
C) 100 metr
D) 147 metr

Xeops piramidasi qancha tosh bo'lagidan tashkil topgan?
A) 2,5 million dona
B) 250 ming dona

D) 1 million dona

B) 1, 2, 4
C) 1, 3, 5
D) 2, 3, 4

A) Sfinks

Daxmalar ichi qanday bitiklar bilan qoplangan?

Sfinks qanday haykal?

Sfinks haykali qanday vazifani bajargan?

C) Piramidalarni qo'riqlagan
D) Fir'avn saroyini bezagan

Yangi podsholik davriga kelib fir'avnlarni dafn etishda qanday o'zgarish yuz berdi?
A) Piramidalar yanada balandroq qurildi
B) Fir'avnlar ibodatxonalarga dafn etila boshlandi
C) Fir'avnlar mumiyolanmay qo'ydi

Yangi podsholik davrining eng mashhur maqbarasi qaysi fir'avnga tegishli?
A) Tutanxamon
B) Yaxmos
C) Xufu
D) Menes

Qadimgi misrliklar inson vafot etganidan keyin nima bo'ladi deb hisoblagan?
A) Hayvonga aylanadi
B) Yulduzga aylanadi
C) Butunlay yo'q bo'lib ketadi
D) Marhumlar saltanatiga ketib, o'sha yerda umrini davom ettiradi

Misrliklar fikricha, marhumlar saltanatidagi hayot nimaga bog'liq bo'lgan?
A) Kohinlar duosiga
B) Fir'avnning farmoniga
C) Qabrning kattaligiga
D) Osiris sudining natijalariga

C) Bir pallasiga yurak, boshqasiga papirus
D) Bir pallasiga oltin, boshqasiga tosh

A) Inson bu dunyoda faqat ezgu ishlar qilgan va ajoyib sharoitda umrini davom ettiradi
B) Inson qayta tirilmaydi
C) Inson fir'avn bo'ladi
D) Inson ko'p gunoh qilgan

Nima uchun misrliklar inson jasadini mumiyolagan?
A) Kasallik tarqalmasligi uchun
B) Jasadni muzeyda saqlash uchun
C) Jasadni boshqa shaharga olib ketish uchun
D) Osiris qarshisida go'zal qiyofada qad rostlash uchun
JAVOB: D

Mumiyolashga oid to'g'ri ma'lumotlarni aniqlang.
1) kohin-tabiblar shug'ullangan; 2) qariyb 70 kun davom etgan; 3) barcha misrliklar mumiyolangan; 4) mato qatlari orasiga tumorlar qo'yilgan; 5) faqat fir'avnlar mumiyolangan.
A) 1, 3, 5
B) 2, 3, 4
C) 1, 2, 4
D) 2, 4, 5

Obyekt | Ma'lumot

a) 147 metr; b) 20 metr; c) qariyb 70 kun; d) 2600 metr; e) 40 kun; f) 70 metr.
A) 1-a, 2-f, 3-c
B) 1-a, 2-b, 3-e
C) 1-a, 2-b, 3-c
D) 1-f, 2-b, 3-c
JAVOB: C

Davr | Dafn joyi | Fir'avn

Qadimgi podsholik | Memfis yaqinidagi piramida | C
1) piramida; 2) Tutanxamon; 3) Menkaura; 4) ibodatxona; 5) Menes; 6) Yaxmos.
A) A-1, B-2, C-3
B) A-1, B-2, C-5
C) A-1, B-6, C-3

IV. Mumiyolash bilan fir'avnning o'zi shug'ullangan.

B) I va II

<script type="text/plain" class="question-data"

C) Forslar; “shoh yozuvlari”

Misrliklar alifbosi nechta iyeroglifdan iborat bo'lgan?
A) 365 ta

Iyerogliflar qayerlarga yozilgan?

B) 1, 3, 4, 5

A) Temir nina bilan teriga

C) Mo'yqalam bilan ipakka
D) Uchi o'tkir tayoqcha bilan loy taxtachaga
JAVOB: B

Papirus nima?
A) Hayvon terisidan ishlangan yozuv materiali
B) Daraxt po'stlog'i
C) Papirus poyasidan ishlangan qog'oz

Qadimgi Misrda siyoh vazifasini nima o'tagan?
A) O'simlik sharbati
B) Turli rangdagi mineral bo'yoqlar
C) Qon

Ta'lim olayotgan o'quvchilar Misrda nimaga yozishgan?
A) Oltin taxtachalarga

C) Papirusga

Misrda husnixat san'atini egallagan kishilar qanday maqomda bo'lgan?

B) Yuksak savodxon sanalib, katta imtiyoz va izzat-hurmatga ega bo'lgan
C) Qul sifatida ishlagan

Misr iyerogliflari sirini kim va qachon kashf etdi?

B) Ingliz olimi Govard Karter; 1922-yilda
C) Fransuz olimi Jak-Fransua Shampolyon; 1822-yilda
D) Yunon tarixchisi Gerodot; mil. avv. V asrda

Iyerogliflarni o'qishga nima sababchi bo'ldi?
A) Rozett shahri yaqinidagi toshga qadimgi misr va yunon tillarida chekilgan bir xil ma'nodagi bitik
B) Behistun qoyasi yozuvlari
C) Tutanxamon maqbarasidagi papiruslar
D) Xeops piramidasidagi yozuvlar

Rozett shahri qaysi shahar yaqinida joylashgan?
A) Memfis
B) Fiva
C) Qohira
D) Aleksandriya

Rozett bitiktoshidagi yozuv qaysi tillarda bitilgan?
A) Qadimgi fors, bobil va elam tillarida

C) Shumer va akkad tillarida
D) Qadimgi misr va qadimgi yunon tillarida

Hozirgi kunda Rozett bitiktoshi qayerda saqlanmoqda?

D) Berlin muzeyida

Shampolyon kashfiyotining ahamiyati nimada?
A) Piramidalarni qurish siri ochildi

C) Mumiyolash usuli aniqlandi

Misrda astronomiya fanining paydo bo'lishiga nima sabab bo'lgan?
A) Fir'avnlar osmonni ma'bud deb bilgan
B) Dengizchilar yo'l topish uchun yulduzlarni o'rgangan
C) Ziroatkorlar urug' qadash va hosil yig'ish muddatlarini yulduzlarga qarab aniqlagan
D) Kohinlar fol ochish uchun yulduzlarni kuzatgan

C) 360 kun; 30 kundan 12 oy, qo'shimcha kunlar yo'q

Geometriya fani Misrda qanday ehtiyoj tufayli dunyoga keldi?

C) Yulduzlar orasidagi masofani o'lchash

A) Yulduzlar haqidagi fan

C) Yer yuzasini o'lchash ilmi
D) Inson tanasi haqidagi fan

Misrliklarning matematik bilimlariga oid to'g'ri fikrni toping.

D) Hisob-kitobni bilishmagan

Misrliklar odamning ichki tuzilishini qanday jarayonda yaxshi o'rgangan?
A) Hayvonlarni so'yishda
B) Mumiyolangan mayitlarni tayyorlash jarayonida
C) Ibodatxona marosimlarida
D) Urushlarda yaradorlarni davolashda

Misr tabiblari davolashda nimalardan keng foydalangan?
A) Faqat sehr va tumorlardan
B) Faqat duolardan
C) Giyohlar damlamasi, ma'danli suvlar va tuzdan

Misrda asosiy o'lchov birligi “tirsak” nimaga teng bo'lgan?

Nima uchun Misrda “podsho tirsagi” joriy etilgan va u nechaga teng bo'lgan?
A) Savdoni rivojlantirish uchun; 30 santimetr
B) Fir'avn qo'li eng uzun bo'lgani uchun; 100 santimetr
C) Qo'llar uzunligi turlicha bo'lgani uchun; 52,5 santimetr
D) Piramidalar qurish uchun; 147 santimetr
JAVOB: C

Misr o'lchov birliklariga ko'ra qaysi tenglik to'g'ri?
A) Bir kaft = to'rt barmoq; bir tirsak = yettita kaft
B) Bir kaft = besh barmoq; bir tirsak = o'nta kaft
C) Bir kaft = uch barmoq; bir tirsak = to'rtta kaft
D) Bir kaft = to'rt barmoq; bir tirsak = o'nta kaft
JAVOB: A

Misrda vaqt nima yordamida o'lchangan?
A) Quyosh soatlari
B) Shamlar
C) 24 ta bo'lmaga ajratilgan idishdan iborat suv soatlari
D) Qum soatlari
JAVOB: C

Jadvaldagi bo'sh joylarni to'ldiruvchi javoblarni toping.
JADVAL:
Ma'lumot | Miqdori
Misrliklar alifbosidagi iyerogliflar | 1) ________
Misr taqvimidagi yil | 2) ________
“Podsho tirsagi” | 3) ________
a) 750 ta; b) 365 kun; c) 52,5 santimetr; d) 22 ta; e) 354 kun; f) 147 santimetr.
A) 1-d, 2-b, 3-c
B) 1-a, 2-b, 3-f
C) 1-a, 2-b, 3-c
D) 1-a, 2-e, 3-c
JAVOB: C

Jadvaldagi A, B, C harflari o'rniga mos keladigan javoblarni toping.

Fan | Paydo bo'lish sababi | Yutug'i

B | maydon hajmini o'lchash | yer yuzasini o'lchash ilmi
Tibbiyot | mumiyolash | C
1) 365 kunlik taqvim; 2) geometriya; 3) tabiblar maktablari, giyoh damlamalari; 4) matematika; 5) suv soati; 6) sanoq tizimi.
A) A-1, B-4, C-3
B) A-5, B-2, C-3
C) A-1, B-2, C-3
D) A-1, B-2, C-6
JAVOB: C

Qadimgi Misr madaniyatiga oid to'g'ri hukmlarni aniqlang.
I. Misrliklar alifbosi 750 iyeroglifdan iborat bo'lgan.
II. Iyerogliflar sirini 1822-yilda Shampolyon kashf etgan.

<script type="text/plain" class="question-data"
        data-key="k6-11" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="11-mavzu. Mesopotamiya sivilizatsiyalari" data-desc="30 ta savol">
“Mesopotamiya” atamasi qanday ma'noni anglatadi?
A) Qora tuproq
B) To'rt iqlim mamlakati
C) Xudolar darvozasi
D) Ikki daryo oralig'i
JAVOB: D

Mesopotamiya qaysi daryolar oralig'idagi vodiy?
A) Nil va Iordan
B) Dajla va Frot
C) Hind va Gang
D) Amudaryo va Sirdaryo
JAVOB: B

Mesopotamiya va Misrning tabiiy sharoitidagi o'xshashlikni toping.
A) Daryolarning toshqin suvlari va ishlov berish uchun qulay serunum yerlar
B) Qalin o'rmonlar va ko'p yog'och
C) Dengizga chiqish yo'lining yo'qligi
D) Tog'li hudud va sovuq iqlim
JAVOB: A

Mesopotamiyada qishda qanday tabiiy hodisalar bo'lib turgan?
A) Surunkali yomg'ir va daryolar toshqini
B) Zilzilalar
C) Qurg'oqchilik
D) Qattiq sovuq va qor
JAVOB: A

Shumerlar manzilgohlari va shaharlari qachon vujudga kela boshladi?
A) Mil. avv. 3-mingyillik ikkinchi yarmida
B) Mil. avv. II mingyillikda
C) Mil. avv. VII asrda
D) Mil. avv. 4-mingyillikda
JAVOB: D

Shumerlar Mesopotamiyaning qaysi qismiga joylashgan va uni qanday atagan?
A) Shimoliy Mesopotamiyaga; Shumer
B) Shimoliy Mesopotamiyaga; Akkad
C) Janubiy Mesopotamiyaga; Akkad
D) Janubiy Mesopotamiyaga; Shumer
JAVOB: D

Mamlakatning Akkad deb atalgan qismida kimlar yashagan?
A) Akkadlar (shimoliy qismda)
B) Ossuriyaliklar
C) Elamliklar
D) Shumerlar (janubiy qismda)
JAVOB: A

Mesopotamiya aholisining asosiy mashg'uloti nima bo'lgan?
A) Konchilik
B) Ko'chmanchi chorvachilik
C) Dengizchilik
D) Dehqonchilik
JAVOB: D

Nima uchun Mesopotamiya aholisi savdo-sotiq bilan ham shug'ullangan?
A) Hunarmandchilik rivojlanmagan
B) Yog'och va metall bo'lmagan, ammo don mo'l yetishtirilib, chorva ko'p bo'lgan
C) Ular dengiz orolida yashagan
D) Dehqonchilik uchun yer bo'lmagan
JAVOB: B

Mesopotamiya aholisi qo'shni Kavkazorti va Eron o'lkalaridan donga ayirboshlab nimalarni keltirgan?
A) Papirus va kanopni
B) Oltin, mis, kumush, qalay va noyob toshlarni
C) Ipak va choyni
D) Temir va yog'ochni
JAVOB: B

Mesopotamiyada savdo-sotiqda nima ishlatilgan?
A) Chig'anoqlar
B) Qog'oz pullar
C) Faqat mol ayirboshlash
D) Kumush quymasi ko'rinishidagi metall tangalar
JAVOB: D

Mesopotamiyadagi “mino” og'irlik o'lchovi nimaga barobar bo'lgan?
A) 1 kilogramm oltinga
B) 52,5 santimetrga
C) 550 gramm kumushga
D) 100 gramm misga
JAVOB: C

Shumerlar ixtiro qilgan jahondagi eng qadimgi yozuvlardan biri qaysi?
A) Mixxat
B) Lotin yozuvi
C) Iyerogliflar
D) Finikiya alifbosi
JAVOB: A

Shumerlar nimaga va nima bilan yozgan?
A) Uchi o'tkirlangan tayoqchalar bilan loy taxtachalarga
B) Temir nina bilan toshga
C) Qamish qilqalam bilan papirusga
D) Mo'yqalam bilan ipakka
JAVOB: A

Mil. avv. 4-mingyillik oxirida Mesopotamiyada vujudga kela boshlagan shaharlarni aniqlang.
1) Uruk; 2) Memfis; 3) Umma; 4) Lagash; 5) Fiva; 6) Ur.
A) 1, 3, 4, 6
B) 2, 3, 5, 6
C) 1, 2, 4, 5
D) 1, 2, 3, 6
JAVOB: A

Mesopotamiyadagi shahar-davlatlar nimadan iborat bo'lgan?
A) Bir necha “nom”lardan
B) Ko'chmanchi qabilalar ittifoqidan
C) Shahar va unga tutash dehqonchilik tumanlaridan
D) Faqat ibodatxona va saroydan
JAVOB: C

Shumer shaharlarida dastlab kim hukmronlik qilgan va hokimiyat markazi nima bo'lgan?
A) Fir'avnlar; saroylar
B) Xalq yig'ini; maydon
C) Qo'shin boshliqlari; qal'alar
D) Oliy ma'bud nomidan kohinlar; ibodatxonalar
JAVOB: D

Mesopotamiyaning qadimiy ibodatxonalari qanday atalgan?
A) Zikkuratlar
B) Piramidalar
C) Daxmalar
D) Sfinkslar
JAVOB: A

Zikkuratlar qanday inshoot bo'lgan?
A) Xom g'ishtdan terilgan muhtasham zinapoyali inshoot
B) Yog'ochdan qurilgan minora
C) Tog'ga o'yilgan maqbara
D) Toshdan qurilgan uchburchak piramida
JAVOB: A

Mesopotamiya ma'budlari va ularning vazifalari to'g'ri moslashtirilgan javobni aniqlang.
1) Shamash; 2) Sin; 3) Ea; 4) Ishtar.
a) Oy ma'budi; b) suv ma'budi; c) Quyosh ma'budi, oliy hakam; d) hosildorlik va sevgi, urush va g'alaba ma'budasi.
A) 1-c, 2-a, 3-d, 4-b
B) 1-c, 2-b, 3-a, 4-d
C) 1-c, 2-a, 3-b, 4-d
D) 1-a, 2-c, 3-b, 4-d
JAVOB: C

Mesopotamiyada qaysi ma'bud oliy hakam hisoblanib, yovuz ishlari uchun odamlarni sud qilgan?
A) Ea
B) Sin
C) Shamash
D) Ishtar
JAVOB: C

Mesopotamiyada katta yer-mulklar kimlar qo'l ostida bo'lgan va dalalarga kimlar ishlov bergan?
A) Savdogarlar; hunarmandlar
B) Dehqon jamoalari; o'zlari
C) Hukmdorlar va kohinlar; qullar va erkin yollanma ishchilar
D) Qo'shin boshliqlari; asirlar
JAVOB: C

Mesopotamiyada podsholar hokimiyati qanday paydo bo'lgan?
A) Urush paytida saylangan sardorlarning nufuzi ortib, ular muntazam hukmronlik qila boshlagan
B) Kohinlar o'z orasidan podshoni tayinlagan
C) Fir'avnlar Mesopotamiyaga hukmdor yuborgan
D) Hokimiyat ayollardan erkaklarga o'tgan
JAVOB: A

Rivoyatga ko'ra Gilgamish qaysi shahar podshosi bo'lgan?
A) Bobil
B) Uruk
C) Ur
D) Lagash
JAVOB: B

Gilgamish haqidagi rivoyatga oid to'g'ri ma'lumotlarni aniqlang.
1) uni burgut tutib olib, bog'bonga eltib bergan; 2) Enkidu bilan do'st tutingan; 3) sehrli giyohni ilon o'g'irlab ketgan; 4) u Akkad podshosi bo'lgan.
A) 1, 2, 3
B) 1, 3, 4
C) 2, 3, 4
D) 1, 2, 4
JAVOB: A

Akkad podshosi Sargon I qachon Akkad va Shumer shaharlarini birlashtirdi?
A) Mil. avv. 4-mingyillik oxirida
B) Mil. avv. VII asrda
C) Mil. avv. XVIII asrda
D) Mil. avv. 3-mingyillikning ikkinchi yarmida
JAVOB: D

Sargon I ning faoliyatiga oid to'g'ri ma'lumotni toping.
A) Mixxatni ixtiro qilgan
B) Mesopotamiyani birinchi bo'lib qonunlar asosida boshqargan
C) Jahon tarixida birinchi bo'lib 5400 nafar jangchidan iborat muntazam qo'shin tuzgan
D) Bobilni “xudolar darvozasi” deb atagan
JAVOB: C

Jadvaldagi bo'sh joylarni to'ldiruvchi javoblarni toping.
JADVAL:
Ma'lumot | Javob
Sargon I tuzgan qo'shindagi jangchilar soni | 1) ________
“Mino” og'irlik o'lchovi | 2) ________
Sargon I o'zini e'lon qilgan unvon | 3) ________
a) 5400 nafar; b) 550 gramm kumush; c) “to'rt iqlim mamlakati podshosi”; d) 750 nafar; e) “xudolar darvozasi”; f) 52,5 santimetr.
A) 1-a, 2-b, 3-c
B) 1-a, 2-f, 3-c
C) 1-a, 2-b, 3-e
D) 1-d, 2-b, 3-c
JAVOB: A

Jadvaldagi A, B, C harflari o'rniga mos keladigan javoblarni toping.
JADVAL:
Ma'bud | Vazifasi
A | Quyosh ma'budi, oliy hakam
Sin | B
C | hosildorlik va sevgi, urush va g'alaba ma'budasi
1) Shamash; 2) Oy ma'budi; 3) Ishtar; 4) Ea; 5) suv ma'budi; 6) Amon-Ra.
A) A-6, B-2, C-3
B) A-1, B-2, C-3
C) A-1, B-5, C-3
D) A-1, B-2, C-4
JAVOB: B

Mesopotamiya sivilizatsiyasiga oid to'g'ri hukmlarni aniqlang.
I. Shumerlar Janubiy Mesopotamiyada yashagan.
II. Mesopotamiyada yog'och va metall ko'p bo'lgan.
III. Zikkuratlar xom g'ishtdan qurilgan.
IV. Gilgamish Akkad podshosi bo'lgan.
A) I va II
B) I va III
C) III va IV
D) II va IV
JAVOB: B

</script>

<script type="text/plain" class="question-data"
        data-key="k6-12" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="12-mavzu. Bobil podsholigi" data-desc="30 ta savol">
Bobil podsholigi qachon Mesopotamiya janubidagi eng yirik qudratli davlatga aylandi?
A) Mil. avv. II mingyillikda
B) Mil. avv. 4-mingyillikda
C) Mil. avv. 539-yilda
D) Mil. avv. VII asrda
JAVOB: A

Bobilning qulay geografik o'rni nimada edi?
A) Nil deltasida joylashgan
B) O'rta Yer dengizi sohilida joylashgan
C) Frot va Dajla daryolarining o'zanlari bir-biriga yaqinlashadigan hududda joylashgan
D) Tog'lar bilan o'ralgan
JAVOB: C

“Bobil” so'zi qanday ma'noni anglatadi?
A) Xudolar darvozasi
B) Qora tuproq
C) Ikki daryo oralig'i
D) Muqaddas bitiklar
JAVOB: A

Bobilning bosh ko'chasi qaysi darvozadan boshlangan?
A) Marduk darvozasidan
B) Oy ma'budi Sin darvozasidan
C) G'alaba ma'budasi Ishtar darvozasidan
D) Quyosh ma'budi Shamash darvozasidan
JAVOB: C

Bobil davlatida dehqonchilik, hunarmandchilik va savdo rivojiga nima xalaqit berardi?
A) O'zaro urushlar
B) Yozuvning yo'qligi
C) Nil toshqinlari
D) Forslar hukmronligi
JAVOB: A

Butun Mesopotamiyani yagona davlatga birlashtirgan Bobil podshosi kim va bu qachon bo'ldi?
A) Xammurapi; mil. avv. XVIII asrda
B) Xammurapi; mil. avv. VI asrda
C) Sargon I; mil. avv. 3-mingyillik ikkinchi yarmida
D) Navuxodonosor II; mil. avv. VII asrda
JAVOB: A

Xammurapi tarixda qanday hukmdor sifatida nom qoldirgan?
A) Piramidalar quruvchi sifatida
B) Qonunlar tuzuvchi hukmdor sifatida
C) Alifbo yaratuvchi sifatida
D) Birinchi muntazam qo'shin tuzuvchi sifatida
JAVOB: B

Xammurapi qonunlariga xos xususiyatni aniqlang.
A) Faqat qullarga tegishli bo'lgan
B) Faqat zodagonlarni himoya qilgan
C) Yengil jazolarni nazarda tutgan
D) Hamma uchun – badavlat va qashshoq kishilar uchun birdek bo'lgan
JAVOB: D

Xammurapi qonunlarining matnlari qayerga yozib qo'yilgan?
A) Mamlakatning barcha shaharlarida o'rnatilgan tosh ustunlarga
B) Saroy devorlariga
C) Faqat ibodatxona kitoblariga
D) Papirus o'ramlariga
JAVOB: A

Xammurapi qonunlariga ko'ra jarrohlik muolajasi natijasida bemor vafot etsa, shifokor qanday jazolangan?
A) Shifokor jarima to'lagan
B) Shifokor qatl etilgan
C) Shifokorning qo'llari kesib tashlangan
D) Shifokor quldorga sotilgan
JAVOB: C

Xammurapi qonunlariga ko'ra binokor qurgan uy qulab, kishini bosib qolsa nima qilingan?
A) Binokor uyni qayta qurgan
B) Binokor qatl etilgan
C) Binokor jarima to'lagan
D) Binokorning qo'li kesilgan
JAVOB: B

Xammurapi qonunlariga ko'ra eng qattiq jazo kimga berilgan?
A) Yong'in paytidagi o'g'riga – jarimaga tortilgan
B) Shifokorga – surgun qilingan
C) Binokorga – qamalgan
D) Qulfbuzar o'g'riga – mulkka tajovuz qilgan joyida o'ldirilib, o'sha yerga ko'mib yuborilgan
JAVOB: D

Xammurapi qonunlarini so'zsiz bajarish nima uchun talab qilingan?
A) Ularni kohinlar yozgan
B) Ular ma'budlar xohish-irodasi sifatida talqin etilgan
C) Ular qo'shni davlatlar bilan kelishilgan
D) Ularni xalq yig'ini qabul qilgan
JAVOB: B

Xammurapi qonunlari jamiyat rivojiga qanday ta'sir ko'rsatdi?
A) Talon-torojlik va o'g'rilik kabi jinoyatlar deyarli sodir etilmasdi
B) Jinoyatlar ko'payib ketdi
C) Qullar ozod qilindi
D) Savdo to'xtab qoldi
JAVOB: A

Yangi Bobil podsholigi qachon vujudga kelgan?
A) Mil. avv. II mingyillikda
B) Mil. avv. 539-yilda
C) Mil. avv. XVIII asrda
D) Mil. avv. VII asrda
JAVOB: D

Qaysi hukmdor davrida Yangi Bobil podsholigi o'z ravnaqining cho'qqisiga erishdi?
A) Sargon I
B) Navuxodonosor II
C) Xammurapi
D) Ashshurbanipal
JAVOB: B

Navuxodonosor II faoliyatiga oid to'g'ri ma'lumotlarni aniqlang.
1) Misrni Yangi Bobilga qo'shib olgan; 2) Iyerusalimni vayron qilgan; 3) qonunlar to'plamini yaratgan; 4) pishgan g'isht ishlatish to'g'risida farmon bergan; 5) birinchi muntazam qo'shin tuzgan.
A) 2, 3, 4
B) 1, 3, 5
C) 2, 4, 5
D) 1, 2, 4
JAVOB: D

Navuxodonosor II davrida Bobil shahrining nechta darvozasi bo'lgan?
A) Sakkizta
B) O'n ikkita
C) Bitta
D) To'rtta
JAVOB: A

Bobil darvozalari qanday nomlangan?
A) Har biri podsholar nomi bilan
B) Ular raqamlar bilan atalgan
C) Har biri qo'shni mamlakatlar nomi bilan
D) Har biri mamlakat bosh ma'budlaridan birining nomi bilan
JAVOB: D

Ishtar darvozasi nima bilan bezatilgan?
A) Afsonaviy hayvonlar tasviri tushirilgan naqshinkor tosh taxtachalar bilan
B) Iyerogliflar bilan
C) Xammurapi qonunlari matni bilan
D) Oltin va kumush qoplamalar bilan
JAVOB: A

Forslar Bobilni qachon zabt etdi?
A) Mil. avv. 525-yilda
B) Mil. avv. 539-yilda
C) Mil. avv. 330-yilda
D) Mil. avv. 605-yilda
JAVOB: B

Bobil madaniyatining eng qadimiy o'choqlari qaysilar bo'lgan?
A) Finikiya va Falastin
B) Misr va Nubiya
C) Ossuriya va Urartu
D) Shumer va Akkad
JAVOB: D

Shumer mixxati dastlab qanday bo'lgan?
A) 750 iyeroglifdan iborat
B) Unli va undosh harflardan iborat
C) “Suv”, “quyosh” kabi alohida so'zlarni anglatgan rasmlardan iborat
D) 22 undosh harfdan iborat alifbo
JAVOB: C

Mesopotamiya maktablarida kimlar ta'lim olgan?
A) Faqat qullar
B) Barcha aholi farzandlari
C) Zodagonlar va badavlat oilalarning farzandlari
D) Faqat qizlar
JAVOB: C

Loy taxtachalar qanday tayyorlangan?
A) Toshdan o'yib yasalgan
B) Olovda kuydirilib, keyin bo'yalgan
C) Avval oftobda quritilgan, so'ng xumdonlarda pishirilgan
D) Faqat oftobda quritilgan
JAVOB: C

Shumerliklar quyosh va oy yilini necha kun deb belgilagan?
A) Quyosh yili – 354 kun, oy yili – 365 kun
B) Quyosh yili – 365 kun, oy yili – 354 kun
C) Quyosh yili – 360 kun, oy yili – 365 kun
D) Ikkalasi ham 365 kun
JAVOB: B

Mesopotamiyada eng qadimgi rasadxonalar qayerda barpo etilgan?
A) Tog' cho'qqilarida
B) Zikkuratlar yuqorisidagi maydonchada
C) Piramidalar ichida
D) Saroy hovlisida
JAVOB: B

Jadvaldagi bo'sh joylarni to'ldiruvchi javoblarni toping.
JADVAL:
Voqea | Sana
Xammurapi Mesopotamiyani birlashtirdi | 1) ________
Yangi Bobil podsholigi vujudga keldi | 2) ________
Forslar Bobilni zabt etdi | 3) ________
a) mil. avv. XVIII asr; b) mil. avv. VII asr; c) mil. avv. 539-yil; d) mil. avv. 3000-yil; e) mil. avv. 605- yil; f) mil. avv. 525-yil.
A) 1-a, 2-b, 3-c
B) 1-a, 2-e, 3-c
C) 1-d, 2-b, 3-c
D) 1-a, 2-b, 3-f
JAVOB: A

Jadvaldagi A, B, C harflari o'rniga mos keladigan javoblarni toping.
JADVAL:
Xammurapi qonunida jinoyat | Jazo
Jarrohlik natijasida bemor vafoti | A
Qurilgan uy qulab, kishini bosishi | B
Yong'in paytida o'g'rilik | C
1) shifokorning qo'llari kesilgan; 2) binokor qatl etilgan; 3) o'g'ri olovga tashlangan; 4) jarima to'langan; 5) surgun qilingan; 6) qamoqqa olingan.
A) A-1, B-5, C-3
B) A-4, B-2, C-3
C) A-1, B-2, C-6
D) A-1, B-2, C-3
JAVOB: D

Bobil podsholigiga oid to'g'ri hukmlarni aniqlang.
I. “Bobil” so'zi “xudolar darvozasi” degan ma'noni anglatadi.
II. Xammurapi qonunlari faqat zodagonlar uchun bo'lgan.
III. Navuxodonosor II davrida Yangi Bobil ravnaq cho'qqisiga erishgan.
IV. Bobilni mil. avv. 525-yilda Misr bosib olgan.
A) II va IV
B) I va III
C) III va IV
D) I va II
JAVOB: B

</script>

<script type="text/plain" class="question-data"
        data-key="k6-13" data-group="6-sinf · Qadimgi dunyo tarixi" data-title="13-mavzu. Old Osiyo davlatlari" data-desc="30 ta savol">
Ossuriya podsholigi qachon vujudga kelgan?
A) Mil. avv. 4-mingyillikda
B) Mil. avv. 2-mingyillikda
C) Mil. avv. VII asrda
D) Mil. avv. IX asrda
JAVOB: B

Qadim zamonlarda ossuriyaliklar qayerni egallagan?
A) Kavkazortini
B) O'rta Yer dengizining sharqiy qirg'og'ini
C) Frot va Dajla daryolari yuqori oqimidagi (hozirgi Iroq) kichik hududni
D) Nil vodiysini

a) yunonlarning o'z vatani; b) yunon bo'lmagan xalqlar; c) yunonlarning o'zlarini atagan nomi; d) Afinadagi chet elliklar.

B) 1-a, 2-c, 3-b

D) 1-c, 2-a, 3-b

A) Finikiyaliklar

C) Koloniyalarda hunarmandchilik rivojlangan
D) Koloniyalar polislar bilan doimiy aloqada bo'lgan

1) Buyuk Yunon koloniyalashtirishi; 2) Akropol qal'asining qurilishi; 3) doriylarning Spartaga asos solishi.

a) ellinlar; b) Ellada; c) mil. avv. VIII–VI asrlar; d) varvarlar; e) Attika; f) mil. avv. XII asr.

<script type="text/plain" class="question-data"

B) Akropol

D) Palestra

B) Forslar bosqini tufayli
C) Aholining bir qismi zodagonlar bo'lib, oddiy xalq ularning foydasiga ishlashga majbur edi

B) 2, 4
C) 1, 2
D) 1, 3

C) Faqat sud ishlarini ko'rish

C) Podsho

C) Himoya qilish taqiqlangan

B) 2, 3, 4

</script>

<script>
  // =====================================================================
  // BU YERDAN PASTGA TEGISHNING HOJATI YO'Q — bu qism yuqoridagi oddiy
  // matnni avtomatik o'qib, testga aylantiradi.
  // =====================================================================

  // 1) Bitta mavzu matnini savollar ro'yxatiga aylantiruvchi funksiya
  function parseTopicText(rawText) {
    const blocks = rawText.trim().split(/\n\s*\n/); // bo'sh qatordan bo'lib olamiz
    const result = [];
    const warnings = [];

    blocks.forEach((block, blockIndex) => {
      const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const questionLines = [lines[0]];
      const images = [];
      const tableRows = [];
      const afterLines = [];
      const options = [];
      let correctLetter = null;
      let mode = 'question'; // 'question' | 'table'

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];

        const imgMatch = line.match(/^RASM:\s*(.+)$/i);
        if (imgMatch) { images.push(imgMatch[1].trim()); mode = 'question'; continue; }

        if (/^JADVAL:?$/i.test(line)) { mode = 'table'; continue; }

        const optMatch = line.match(/^([A-D])\)\s*(.+)$/);
        if (optMatch) { options.push(optMatch[2]); mode = 'options'; continue; }

        const ansMatch = line.match(/^JAVOB:\s*([A-D])/i);
        if (ansMatch) { correctLetter = ansMatch[1].toUpperCase(); continue; }

        if (mode === 'table' && line.includes('|')) {
          tableRows.push(line.split('|').map(cell => cell.trim()));
          continue;
        }
        if (mode === 'table') { afterLines.push(line); continue; }

        if (mode === 'question') {
          questionLines.push(line); // savol matni bir necha qatorli bo'lishi mumkin
        }
      }

      if (options.length < 2 || options.length > 4 || !correctLetter || "ABCD".indexOf(correctLetter) >= options.length) {
        warnings.push(`${blockIndex + 1}-savolda xatolik bor (variantlar yoki JAVOB qatori to'liq emas): "${questionLines[0].slice(0, 40)}..."`);
        return;
      }

      result.push({
        text: questionLines.join('\n'),
        images: images,
        table: tableRows,
        after: afterLines,
        options: options,
        correct: "ABCD".indexOf(correctLetter)
      });
    });

    return { questions: result, warnings: warnings };
  }

  // 2) Sahifadagi barcha mavzu bloklarini o'qib, questionSets ni yasaymiz
  const questionSets = {};
  const allWarnings = [];

  document.querySelectorAll('script.question-data').forEach(block => {
    const key = block.dataset.key;
    const parsed = parseTopicText(block.textContent);
    questionSets[key] = {
      title: block.dataset.title,
      group: block.dataset.group || '',
      desc: block.dataset.desc,
      questions: parsed.questions
    };
    parsed.warnings.forEach(w => allWarnings.push(`«${block.dataset.title}» mavzusida — ${w}`));
  });

  // Agar formatlashda xato bo'lsa, o'chirib tashlamay, o'qituvchiga ko'rsatamiz
  if (allWarnings.length > 0) {
    document.getElementById('errorArea').innerHTML =
      '<div class="error-box"><strong>Diqqat, quyidagi savollarni tekshiring:</strong><br>' +
      allWarnings.join('<br>') + '</div>';
  }

  let questions = [];
  let currentTopicKey = "";
  let current = 0;
  let score = 0;

  function renderTopicList() {
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    let lastGroup = null;
    for (const key in questionSets) {
      const set = questionSets[key];
      if (set.questions.length === 0) continue; // savoli yo'q mavzuni ko'rsatmaymiz
      if (set.group && set.group !== lastGroup) {
        lastGroup = set.group;
        const total = Object.values(questionSets).filter(x => x.group === set.group).reduce((a, x) => a + x.questions.length, 0);
        const h = document.createElement('div');
        h.className = 'group-head';
        h.innerHTML = `<b>${set.group}</b><span>${total} ta savol</span>`;
        list.appendChild(h);
        const mix = document.createElement('button');
        mix.className = 'topic-card';
        mix.innerHTML = `
          <div class="topic-info">
            <h3>Aralash test — ${set.group.split(' · ')[0]}</h3>
            <p>Hamma mavzulardan 30 ta tasodifiy savol</p>
          </div>
          <div class="topic-arrow">Boshlash →</div>`;
        mix.onclick = () => startMix(set.group);
        list.appendChild(mix);
      }
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `
        <div class="topic-info">
          <h3>${set.title}</h3>
          <p>${set.questions.length} ta savol</p>
        </div>
        <div class="topic-arrow">Boshlash →</div>
      `;
      card.onclick = () => startQuiz(key);
      list.appendChild(card);
    }
  }

  function startMix(group) {
    const all = [];
    Object.values(questionSets).forEach(x => { if (x.group === group) x.questions.forEach(q => all.push(q)); });
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    questionSets['__mix'] = { title: 'Aralash test — ' + group.split(' · ')[0], desc: '', group: '__mix', questions: all.slice(0, 30) };
    startQuiz('__mix');
  }

  function startQuiz(key) {
    currentTopicKey = key;
    questions = questionSets[key].questions;
    current = 0;
    score = 0;

    document.getElementById('testTitle').textContent = questionSets[key].title;
    document.getElementById('topicScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    const quizArea = document.getElementById('quizArea');

    let mediaHtml = '';
    (q.images || []).forEach(src => {
      mediaHtml += `<img class="q-image" src="${src}" alt="Savolga tegishli rasm">`;
    });
    if (q.table && q.table.length > 0) {
      mediaHtml += '<table class="q-table">';
      q.table.forEach(row => {
        mediaHtml += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      mediaHtml += '</table>';
    }
    if (q.after && q.after.length) mediaHtml += '<div class="q-text" style="margin-top:10px">' + q.after.join('<br>') + '</div>';

    let optionsHtml = '';
    q.options.forEach((opt, i) => {
      optionsHtml += `<button class="option" onclick="checkAnswer(${i})"><span class="opt-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    });

    const questionTextHtml = q.text.split('\n').join('<br>');

    quizArea.innerHTML = `
      <div class="card">
        <div class="q-text">${questionTextHtml}</div>
        ${mediaHtml}
        ${optionsHtml}
        <div class="kbd-hint">Klaviatura: A, B, C, D tugmalari bilan javob bering</div>
      </div>
    `;
    answered = false;

    document.getElementById('progressText').textContent = `${current + 1} / ${questions.length} savol`;
    document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
  }

  let answered = false;

  // Bosh sahifadagi statistika uchun (brauzer xotirasi)
  function recordAnswer(isCorrect){
    try {
      var st; try { st = JSON.parse(localStorage.getItem('tm_stats')); } catch(e){}
      if (!st || !st.days) st = {total:0, correct:0, wrong:0, best:0, days:{}};
      var d = new Date(), k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      st.days[k] = (st.days[k]||0) + 1;
      st.total++; if (isCorrect) st.correct++; else st.wrong++;
      var n=0, c=new Date(); while(st.days[c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0')]){n++; c.setDate(c.getDate()-1);}
      if (n > (st.best||0)) st.best = n;
      localStorage.setItem('tm_stats', JSON.stringify(st));
    } catch(e){}
  }

  function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const buttons = document.querySelectorAll('.option');

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      if (i === selectedIndex && selectedIndex !== q.correct) btn.classList.add('wrong');
    });

    if (selectedIndex === q.correct) score++;
    recordAnswer(selectedIndex === q.correct);

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
    window.Bonus && Bonus.done(score, questions.length, location.pathname + '#' + (typeof currentTopicKey !== 'undefined' ? currentTopicKey : ''));
  }

  function restartQuiz() {
    startQuiz(currentTopicKey);
  }

  function showTopicScreen() {
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('topicScreen').classList.remove('hidden');
  }

  // Klaviatura: A/B/C/D yoki 1/2/3/4
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const quiz = document.getElementById('quizScreen');
    if (!quiz || quiz.classList.contains('hidden')) return;
    const keys = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
    const idx = keys[e.key.toLowerCase()];
    if (idx === undefined) return;
    const btns = document.querySelectorAll('#quizArea .option');
    if (idx < btns.length) { e.preventDefault(); checkAnswer(idx); }
  });

  renderTopicList();
</script>

</body>
</html>

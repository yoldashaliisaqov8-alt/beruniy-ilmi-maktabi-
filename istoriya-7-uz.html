<script>
var D=[["Темы 1–2. Духовные ценности наших предков. Образ жизни народов нашей страны в IV–VII веках",[["Историю какого периода охватывает учебник «История Узбекистана» для 7 класса?",["С IV века до начала XIII века","Со II века до начала XI века","С VI века до начала XV века","С IV века до XVI века"],0],["Кто ввёл в историческую науку понятие «Средние века»?",["Греческие историки","Арабские историки","Французские историки","Итальянские историки"],3],["С каким процессом непосредственно связано понятие «Средние века»?",["С периодами изменения формы частной собственности","С открытием торговых путей","С возникновением городов","С распространением религий"],0],["На каких основах издавна развивались отношения собственности на землю в странах Востока?",["На основе государственной собственности","Издавна на общинных основах","На основе частной собственности","На основе религиозного вакфа"],1],["Почему в нашей истории понятие «Средние века» используется условно?",["Потому что на Востоке отношения собственности на землю издавна развивались на общинных основах","Потому что в этот период не было письменных источников","Потому что этот период полностью совпадал с историей Европы","Потому что в этот период не было государств"],0],["С каким событием совпадает начало Средних веков в Европе?",["С великими географическими открытиями","С падением Римской империи (476 г.)","С взятием Константинополя","С началом крестовых походов"],1],["Начиная с периода возникновения племенных объединений под какими этническими названиями начался период, называемый в нашей истории «Средними веками»?",["Саки, массагеты, сарматы","Карлуки, огузы, караханиды","Кидариты, хиониты, эфталиты","Саманиды, газневиды, сельджуки"],2],["С какого времени начался период «Средних веков» в нашей истории?",["С конца IV и середины V века","С начала I века","С начала VIII века","С конца X века"],0],["На какие этапы, в свою очередь, делятся Средние века в учебнике?",["На древний, ранний и новый периоды","На раннее и позднее Средневековье","На раннее, развитое и позднее Средневековье","На раннее, среднее и новое время"],2],["Как назывались крупные землевладельцы, именуемые в раннее Средневековье «сельскими правителями»?",["Кашаварзы","Кадиворы","Чокары","Дехкане"],3],["Как издавна называлась наша страна?",["Мавераннахр","Турон","Хорасан","Средняя Азия"],1],["С какого времени региону были даны названия «Мавераннахр» и «Хорасан»?",["С времён арабов","С древнего периода","С монгольских времён","С XVIII–XIX веков"],0],["Кто дал региону названия «Средняя Азия» или «Центральная Азия»?",["Западные учёные и путешественники XVIII–XIX веков","Арабские географы","Древнегреческие историки","Китайские послы"],0],["Какая власть установилась на территории нашей страны к началу VIII века?",["Господство Тюркского каганата","Господство Арабского халифата","Господство эфталитов","Господство Китайской империи"],1],["Кто из перечисленных не входит в число мыслителей, вышедших из нашей страны и внёсших вклад в развитие мировой науки?",["Мухаммад ибн Муса аль-Хорезми","Ахмад Фергани","Абу Али ибн Сина","Абу Бакр ар-Рази"],3],["В каком ответе указаны лица, входящие в число знаменитых учёных-богословов, родившихся и выросших на нашей земле в IX–XII веках, приведённых в учебнике?",["Имам Бухари, Имам Термизи, Махмуд Замахшари","Имам Бухари, Имам Газали, Ибн Рушд","Имам Термизи, Ибн Хальдун, аль-Кинди","Махмуд Замахшари, Ибн Баттута, Рашид ад-Дин"],0],["В какую группу в учебнике отнесены известные представители тариката тасаввуф — Ахмад Ясави и Наджмиддин Кубро?",["В правителей древнего периода","В полководцев хорезмшахов","В группу известных богословов, вышедших из нашей страны в IX–XII веках","В послов Тюркского каганата"],2],["К какому выводу должен прийти ученик на основании сведений, приведённых в учебнике?",["Государство достигает могущества через войны","К благополучию можно прийти только через торговлю","К совершенству можно прийти лишь стремлением к знаниям и просвещению","История подчиняется неизменным закономерностям"],2],["В чьё распоряжение в VI веке перешли плодородные земли и распределение воды?",["Купцов","Племенных вождей и старейшин","Духовенства","Ремесленников"],1],["Как назывался слой свободных земледельцев, живших на землях сельских общин и владевших общей собственностью в виде земли и воды?",["Кашаварзы","Кадиворы","Дехкане","Чокары"],0],["Как назывались зависимые жители, лишившиеся своей земли и свободы и работавшие на землях дехкан?",["Кашаварзы","Чокары","Мирабы","Кадиворы"],3],["Кто составлял особую военную группу, защищавшую хозяйство дехкан от внешних нападений и помогавшую поддерживать порядок и дисциплину внутри?",["Кадиворы","Чокары","Кашаварзы","Телохранители"],1],["Что было у дехкан в городе?",["Ремесленные лавки и дома","Только посевные площади","Караван-сараи и медресе","Только стада скота"],0],["Открытие каких водных сооружений, относящихся к сельскому хозяйству, повлияло на развитие сельскохозяйственных работ?",["Крыла, мельницы и дороги","Навеса, плуга и вспашки","Водяной мельницы, чигиря и колеса-черпака","Водохранилища, рабата и моста"],2],["С какого времени происходившие коренные изменения шли так быстро, что образовались местные правления?",["С позднего античного периода (II–IV века н. э.)","С раннего античного периода (VI–V века до н. э.)","С арабского нашествия (VIII век)","С монгольского нашествия (XIII век)"],0],["Кто автор произведения «Этногенез и этническая история узбекского народа»?",["Ахмадали Аскаров","Акбар Заманов","Наргиза Исматова","Дурбек Рахимжонов"],0],["[Врезка] Подставьте подходящее слово вместо точек в определении: «Дехкан (сельский правитель) — в раннее Средневековье ... сословие».",["зависимое","духовное","военное","имущее"],3],["[Врезка] Подставьте подходящее слово вместо точек в определении: «Кашаварз — земледелец ...».",["простой пахарь","землевладелец","военный страж","мираб"],0],["[Врезка] Подставьте подходящее слово вместо точек в определении: «Чокар — ... охраняющий имущество дехкан».",["военный стр

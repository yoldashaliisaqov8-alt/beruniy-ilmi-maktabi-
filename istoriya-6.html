еции?",["Афина","Зевс","Дионис","Геракл"],1],["Как часто проводились Олимпийские игры?",["Раз в 1 год","Раз в 2 года","Раз в 3 года","Раз в 4 года"],3],["Любовь к чему прививали мальчикам в Греции с детства?",["К поэзии и литературе","К поэзии и музыке","К Родине и матери","К Родине и борьбе"],1],["В случае необходимости защиты страны все мужчины, не достигшие ... лет, обязаны были явиться на смотр с оружием и военной одеждой?",["20","30","35","40"],1],["Когда были прекращены Олимпийские игры?",["393 г.","394 г.","395 г.","396 г."],1],["В каком из следующих ответов есть ошибка?",["Помимо общего образования, юноши получали также двухлетнее военное обучение","В первый год они жили дома и учились ходить строем, носить оружие, быть выносливыми к голоду и холоду","На второй год некоторые из них несли военную службу в пограничных крепостях Спарты","На второй год некоторые изучали основы морского дела в порту Пирей"],2],["Отметьте ответ, где неверно приведены сведения о Древних Олимпийских играх?",["Греки вели летоисчисление также по Олимпийским играм","Основателем Олимпийских игр признаётся Геракл","Спортсмен, четырежды победивший в соревнованиях, имел право поставить свою статую на горе Олимп","В Олимпийских играх могли участвовать свободные греки, не запятнавшие свою честь"],2],["Кто основатель Олимпийских игр?",["Афина","Зевс","Дионис","Геракл"],3],["По какой причине были запрещены Олимпийские игры, посвящённые богу Зевсу?",["В результате распространения христианства","В результате произошедшего землетрясения","Из-за завоевания Греции македонцами","В результате экономического упадка"],0],["Когда были проведены первые Олимпийские игры?",["776 г. до н.э.","775 г. до н.э.","774 г. до н.э.","773 г. до н.э."],0]]],["§30. Культура Древней Греции",[["Какое выражение означает уязвимое место?",["«Пята Гектора»","«Ахиллесова пята»","«Пята Париса»","«Пята Одиссея»"],1],["Каким гражданам в Древней Греции давали деньги, чтобы ходить в театр?",["Стратегам","Беднякам","Политикам","Иностранцам"],1],["Автор произведения «Царь Эдип»?",["Эсхил","Аристофан","Гомер","Софокл"],3],["В каком городе расположен Парфенон, являющийся историческим памятником?",["В Скопье","В Париже","В Афинах","В Салониках"],2],["Комедии, богатые прекрасными шутками, весёлыми сценами и тонким юмором, смеются над человеческими недостатками. Кто был мастером комедий?",["Аристобул","Софокл","Аристотель","Аристофан"],3],["В какую реку мать окунула младенца Ахиллеса?",["Река Тибр","Река По","Река Стикс","Река Дон"],2],["Покровительница Трои?",["Афина","Зевс","Дионис","Геракл"],0],["Сколько лет греки безуспешно осаждали Трою?",["9 лет","10 лет","11 лет","12 лет"],0],["По совету кого греки сделали огромного пустого внутри деревянного коня?",["Гектор","Ахиллес","Парис","Одиссей"],3],["Кто руководил строительством Парфенона в Афинах?",["Дедал","Фидий","Мирон","Поликлет"],1],["Главным героем какой поэмы является Ахиллес?",["«Илиада»","«Гомер»","«Одиссея»","«Троя»"],0],["Какое выражение означает опасный, коварный подарок?",["«Родосский конь»","«Троянский конь»","«Милетский конь»","«Фракийский конь»"],1],["Кто построил для царя Миноса знаменитый дворец-Лабиринт?",["Дедал","Фидий","Мирон","Поликлет"],0],["Автор произведения «Антигона»?",["Эсхил","Платон","Гомер","Софокл"],3],["О каком годе Троянской войны рассказывает знаменитая греческая поэма «Илиада»?",["О 9-м","О 10-м","О 11-м","О 12-м"],1],["В Греции храмы и другие общественные здания строились из ... (1). Частные дома строились из ... и ... (2). Вставьте пропущенное.",["1 — камень, 2 — глина и дерево","1 — мрамор, 2 — глинобитная смесь и дерево","1 — камень, 2 — кирпич и глина","1 — камень, 2 — кирпич и глинобитная смесь"],3],["Сколько лет назад в Греции возник театр?",["Две тысячи","Две с половиной тысячи","Три тысячи","Три с половиной тысячи"],1],["Кто сын троянского царя, похитивший жену спартанского царя?",["Гектор","Ахиллес","Парис","Одиссей"],2],["Как звали жену спартанского царя, ставшую причиной греко-троянской войны?",["Ел ств, жил в бочке?",["Сократ","Протагор","Диоген","Гераклит"],2],["Кому принадлежат известные слова: «В одну реку нельзя войти дважды», «Всё течёт, всё изменчиво»?",["Сократ","Протагор","Диоген","Гераклит"],3],["Какой философ был фракийцем?",["Демокрит","Архимед","Гераклит","Демосфен"],0],["Кто положил в основу своего учения мысль «У человека не должно быть никаких потребностей»?",["Сократ","Платон","Диоген","Гераклит"],2],["Когда жил Геродот, автор «Истории»?",["В IV в. до н.э.","В V в. до н.э.","В VI в. до н.э.","В VII в. до н.э."],1],["Чей родной город Сиракузы?",["Гераклит","Демокрит","Архимед","Геродот"],2],["Какое из следующих сведений неверно?",["В Древней Греции учёных знали как мудрецов, наставников жизни","Есть предание, что Архимед, собрав свет зеркалами, сжёг корабли римлян, нападавших на Сиракузы","Геродот написал книгу под названием «История», посвящённую греко-македонским войнам","В древности Геродота называли «отцом истории»"],2]]],["§32. Мифы Древней Греции",[["Три бога древних греков, правившие миром?",["Ника, Арес, Гермес","Атлант, Океан, Гефест","Уран, Гея, Фемида","Зевс, Посейдон, Аид"],3],["В древности Земля была со всех сторон окружена морями. Какой титан был первоначально их правителем?",["Уран","Атлас","Гея","Океан"],3],["На плечах какого титана, стоящего на краю Земли, держится огромный небесный свод?",["Уран","Атлант","Гея","Океан"],1],["Как в Греции называли существ, наполовину птиц, наполовину женщин?",["Сирена","Кентавр","Циклоп","Титан"],0],["Как в Греции называли существ, наполовину лошадей, наполовину людей?",["Сирена","Кентавр","Циклоп","Титан"],1],["Какие боги, по представлениям греков, жили в лесах, реках и горах?",["Циклопы и титаны","Сирены и кентавры","Сатиры и нимфы","Авгуры и понтифики"],2],["В каком ответе названы греческие богатыри, о которых повествуют греческие предания?",["Геракл, Ахиллес","Геракл, Ахиллес, Гильгамеш и Аякс","Геракл, Максимилиан, Тесей и Гектор","Геракл, Ахиллес, Одиссей"],0],["Верховный бог у греков и пр function save(i,s){try{var b=best();if(!(b[i]>=s)){b[i]=s;localStorage.setItem(KEY,JSON.stringify(b))}}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var cur=-1,qi=0,score=0,order=[],mode='list';
back.onclick=function(e){if(mode!=='list'){e.preventDefault();list()}};
function list(){mode='list';back.setAttribute('href','istoriya.html');H.textContent='История Древнего мира';SUB.textContent='Выберите тему · '+D.length+' тем';
 var b=best(),h='<div class="list">';
 D.forEach(function(t,i){h+='<div class="card row" data-i="'+i+'"><div>'+esc(t[0])+'<small>'+t[1].length+' вопросов'+(b[i]!=null?' · лучший результат: '+b[i]+'/'+t[1].length:'')+'</small></div><span class="arrow">›</span></div>'});
 app.innerHTML=h+'</div>';
 [].forEach.call(app.querySelectorAll('.row'),function(r){r.onclick=function(){start(+r.dataset.i)}});window.scrollTo(0,0)}
function start(i){cur=i;qi=0;score=0;mode='quiz';order=D[i][1].map(function(_,k){return k});show()}
function show(){var t=D[cur],q=t[1][order[qi]],n=t[1].length;H.textContent=t[0];SUB.textContent='Вопрос '+(qi+1)+' из '+n;
 var h='<div class="meta"><span>'+(qi+1)+' / '+n+'</span><span>Верно: '+score+'</span></div><div class="prog"><i style="width:'+(qi/n*100)+'%"></i></div><div class="card qbox"><p class="qt">'+esc(q[0])+'</p>';
 q[1].forEach(function(o,k){h+='<button class="op" data-k="'+k+'"><b>'+'ABCD'[k]+')</b> '+esc(o)+'</button>'});
 h+='</div><div class="btnrow"><button class="btn" id="nx" style="display:none">'+(qi+1<n?'Далее →':'Результат')+'</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 [].forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){var k=+b.dataset.k;
  [].forEach.call(app.querySelectorAll('.op'),function(x){x.disabled=true;if(+x.dataset.k===q[2])x.classList.add('ok')});
  if(k===q[2])score++;else b.classList.add('no');document.getElementById('nx').style.display='';}});
 document.getElementById('nx').onclick=function(){qi++;qi<n?show():fin()}}
function fin(){var n=D[cur][1].length;save(cur,score);mode='res';SUB.textContent='Результат';
 var p=Math.round(score/n*100);
 app.innerHTML='<div class="card qbox"><div class="big">'+score+' / '+n+'</div><p class="qt">'+p+'% правильных ответов</p></div><div class="btnrow"><button class="btn" id="re">Пройти заново</button><button class="btn ghost" id="ls">К списку тем</button></div>';
 document.getElementById('re').onclick=function(){start(cur)};document.getElementById('ls').onclick=list}
list();
</script></body></html>

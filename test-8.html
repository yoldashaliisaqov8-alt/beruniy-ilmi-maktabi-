<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-sinf testlari — Beruniy ilmi maktabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f9fb;
    --paper-light: #ffffff;
    --ink: #10223d;
    --ink-soft: #5b6b82;
    --wine: #1a6ee8;
    --wine-dark: #1457c0;
    --gold: #ffc928;
    --green: #2f9a5f;
    --bad: #d4574a;
    --line: #e6ecf2;
    --serif: 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  a{color:var(--ink-soft); text-decoration:none; font-size:16px;}
  .wrap{max-width:840px; margin:0 auto; padding:0 24px;}

  header{padding:26px 0;}
  .brand{font-family:var(--serif); font-size:24px; font-weight:600;}
  .brand span{color:var(--wine);}

  .test-head{padding:10px 0 34px;}
  .test-head .eyebrow{
    font-family:var(--serif); font-style:italic; color:var(--wine); font-size:17px; margin-bottom:10px;
  }
  .test-head h1{
    font-family:var(--serif); font-size:42px; font-weight:600; margin:0 0 12px;
  }
  .test-head p.sub{color:var(--ink-soft); font-size:18px; margin:0;}
  .progress-track{
    height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:22px;
  }
  .progress-fill{
    height:100%; background:var(--wine); width:0%; transition:width 0.3s ease;
  }
  .progress-text{font-size:16px; color:var(--ink-soft); margin-top:10px;}

  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    padding:44px 40px;
    margin-bottom:26px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:32px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 32px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:22px 24px;
    margin-bottom:14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:22px;
    color:var(--ink);
    cursor:pointer;
  }
  .option:hover{border-color:var(--ink-soft);}
  .option.correct{
    background:rgba(47,154,95,0.14);
    border-color:var(--green);
    font-weight:600;
  }
  .option.wrong{
    background:rgba(212,87,74,0.1);
    border-color:var(--bad);
  }
  .option:disabled{cursor:default;}

  .btn{
    display:inline-block;
    font-family:var(--sans);
    font-weight:600;
    font-size:18px;
    padding:16px 30px;
    border-radius:4px;
    border:none;
    background:var(--wine);
    color:var(--paper-light);
    cursor:pointer;
  }
  .btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}

  .result{
    text-align:center;
    padding:60px 20px;
  }
  .result .score{
    font-family:var(--serif);
    font-size:72px;
    font-weight:700;
    color:var(--wine);
    margin:0 0 10px;
  }
  .result p{color:var(--ink-soft); margin:0 0 32px; font-size:18px;}
  .hidden{display:none;}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .topic-card{
    background:var(--paper-light);
    padding:28px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-family:var(--sans);
  }
  .topic-card:hover{background:var(--paper);}
  .group-head{background:#eaf2ff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--wine-dark);}
  .group-head span{font-weight:700;font-size:15px;color:var(--ink-soft);}
  @media (max-width:600px){.group-head{padding:12px 18px;font-size:16px;}.topic-card{padding:20px 18px !important;}}
  .topic-info h3{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .topic-info p{
    margin:0;
    font-size:16px;
    color:var(--ink-soft);
  }
  .topic-arrow{
    font-family:var(--serif);
    font-style:italic;
    color:var(--wine);
    font-size:18px;
    flex-shrink:0;
  }
  .q-image{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:4px;
    margin:0 0 26px;
  }
  .q-table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 26px;
    font-family:var(--sans);
    font-size:17px;
  }
  .q-table td{
    border:1px solid var(--line);
    padding:10px 14px;
  }
  .q-table tr:first-child td{
    background:var(--paper);
    font-weight:600;
    font-family:var(--serif);
  }

  .error-box{
    background:rgba(212,87,74,0.1);
    border:1px solid var(--wine);
    color:#9a3a30;
    padding:18px 20px;
    margin-bottom:20px;
    font-size:15px;
    border-radius:4px;
  }


  /* Variant harfi belgisi */
  .option{display:flex; align-items:center; gap:18px;}
  .opt-key{
    flex-shrink:0; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink-soft); border-radius:4px; font-weight:600; font-size:18px;
    font-family:var(--serif); color:var(--ink-soft); background:var(--paper-light);
  }
  .option.correct .opt-key{background:var(--green); border-color:var(--green); color:#fff;}
  .option.wrong .opt-key{background:var(--bad); border-color:var(--bad); color:#fff;}
  .kbd-hint{display:none; font-size:15px; color:var(--ink-soft); margin-top:6px;}

  /* KOMPYUTER UCHUN: kengroq maket */
  @media (min-width:1000px){
    .wrap{max-width:1080px; padding:0 40px;}
    .test-head h1{font-size:50px;}
    .test-head p.sub{font-size:20px;}
    .card{padding:56px 64px;}
    .q-text{font-size:38px; margin-bottom:40px;}
    .option{font-size:24px; padding:24px 28px;}
    .opt-key{width:42px; height:42px; font-size:20px;}
    .q-table{font-size:20px;}
    .q-image{max-height:460px; margin-left:auto; margin-right:auto;}
    .kbd-hint{display:block;}
    .option:hover{background:var(--paper-light); border-color:var(--wine);}
  }
  @media (min-width:1500px){
    .wrap{max-width:1240px;}
    .q-text{font-size:42px;}
    .option{font-size:26px;}
  }

  @media (max-width:600px){
    .q-text{font-size:24px;}
    .option{font-size:18px; padding:18px 18px;}
    .test-head h1{font-size:32px;}
    .card{padding:28px 24px;}
    .topic-info h3{font-size:21px;}
  }

  body{
    background-color:var(--paper);
    background-image:radial-gradient(circle at 12% 0%, #e8f1ff 0, transparent 38%), radial-gradient(circle at 100% 100%, #fff3da 0, transparent 34%);
    background-attachment:fixed;
  }
  .card{border-radius:30px; box-shadow:0 8px 24px -16px rgba(16,34,61,.25);}
  .option{border-radius:18px;}
  .btn{border-radius:16px;}
  .progress-track,.progress-fill{border-radius:6px;}
  .brand{font-weight:800; letter-spacing:.5px;}
  .q-text,.test-head h1{font-weight:800;}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script></head>

    <div class="test-head">

      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <p>Natijangiz shu. Qayta urinib ko'rishingiz yoki boshqa mavzuni tanlashingiz mumkin.</p>
    <button class="btn" onclick="restartQuiz()">Shu mavzuni qayta boshlash</button>
    <button class="btn btn-ghost" style="margin-left:10px;" onclick="showTopicScreen()">Boshqa mavzu tanlash</button>
  </div>

</main>

<script type="text/plain" class="question-data"
        data-key="k8-01" data-group="8-sinf · O'zbekiston tarixi" data-title="XIII asr boshlarida Xorazm davlatida siyosiy vaziyat" data-desc="40 ta savol">
Muhammad Xorazmshoh 1212-yilda Movarounnahrda qaysi sulola boshqaruviga chek qo'ygan?
A) G'aznaviylar
B) Somoniylar
C) Saljuqiylar
D) Qoraxoniylar
JAVOB: D

Sulton Muhammad Xorazmshoh 1212-yilda qaysi hududda qoraxoniylar boshqaruviga chek qo'ygan?
A) Xurosonda
B) Hindistonda
C) Kirmonda
D) Movarounnahrda
JAVOB: D

Muhammad Xorazmshoh egallagan hududlarni aniqlang. 1) Mikron; 2) Kirmon viloyati; 3) Suriya; 4) Balujiston; 5) Misr.
A) 1, 2, 4
B) 1, 3, 4, 5
C) 2, 5
D) 1, 2, 5
JAVOB: A

1216-yilda Muhammad Xorazmshoh davlati tarkibiga qaysi yerlar qo'shib olingan?
A) Fors, Ozarbayjon, Seyiston
B) Kirmon, Mikron, Balujiston
C) G'azna, G'ur, Bomiyon
D) Mozandaron, Arron, Shirvon
JAVOB: C

1216-yilda Xorazmshohlar davlati qaysi daryo bo'yigacha cho'zilgan?
A) Sind daryosi
B) Dajla daryosi
C) Amudaryo
D) Gang daryosi
JAVOB: A

1216-yilga kelib Xorazmshohlar davlati bevosita qaysi mamlakat bilan chegaradosh bo'lib qolgan?
A) Hindiston
B) Misr
C) Vizantiya
D) Xitoy
JAVOB: A

1217-yilga kelib Muhammad Xorazmshoh davlati qaysi dengizdan Hindistongacha bo'lgan yerlarni qamragan?
A) Arab dengizidan
B) Orol dengizidan
C) Qora dengizdan
D) Kaspiy dengizidan
JAVOB: D

1217-yilga kelib Muhammad Xorazmshoh davlati tarkibiga kirgan hududlarni aniqlang. 1) Fors Iroqi (Iroqi Ajam); 2) Misr; 3) Mozandaron; 4) Gruziya; 5) Shirvon; 6) Ozarbayjon.
A) 1, 2, 4, 6
B) 1, 3, 5, 6
C) 2, 3, 6
D) 1, 2, 3, 6
JAVOB: B

1218-yil martida sodir bo'lgan voqeani toping.
A) Kirmon viloyati va Mikron egallandi
B) G'azna, G'ur va Bomiyon yerlari qo'lga kiritildi
C) Movarounnahrda qoraxoniylar boshqaruviga chek qo'yildi
D) Sulton xalifa nomini xutbadan chiqarib tashlashni buyurdi
JAVOB: D

Sulton xalifa nomini xutbadan chiqarib tashlashni qaysi yilda buyurgan?
A) 1220-yilda
B) 1216-yilda
C) 1212-yilda
D) 1218-yilda
JAVOB: D

Xalifa nomini xutbadan chiqarib tashlash nimani anglatgan?
A) Xalifaga yordam yuborishni
B) Xalifa hokimiyatini tan olmaslikni
C) Xalifa bilan ittifoq tuzishni
D) Xalifalikka bo'ysunishni
JAVOB: B

Muhammad Xorazmshoh qaysi shaharni o'z poytaxti deb e'lon qilgan?
A) Urganchni
B) Samarqandni
C) Nishopurni
D) Buxoroni
JAVOB: B

Xorazmshohning Bag'dod xalifaligi bilan kurashi natijasida qanday holat yuz bergan?
A) Xalifaning mo'g'ullar bilan yaqinlashuvi
B) Xalifaning Xorazmshohga bo'ysunishi
C) Xalifalikning Xitoy bilan ittifoqi
D) Xorazmshohning xalifa bilan sulhi
JAVOB: A

Bag'dod xalifasi maxfiy ravishda maxsus elchini kimning saroyiga yuborgan?
A) Chingizxonning
B) Botuxonning
C) Jo'jining
D) Ugedeyning
JAVOB: A

Sulton Muhammad Xorazmshoh qo'shinining umumiy soni qanchaga yetgan?
A) 100 000 ga qadar
B) 400 000 ga qadar
C) 600 000 ga qadar
D) 200 000 ga qadar
JAVOB: B

Xorazmshoh qo'shini mo'g'ullar qo'shiniga nisbatan qancha ortiq bo'lgan?
A) Besh baravar
B) Uch baravar
C) Ikki baravar
D) Bir yarim baravar
JAVOB: C

Xorazmshohlar saltanatining muntazam qo'shini asosan qaysi qabilalardan iborat bo'lgan?
A) Qang'li-qipchoq hamda turkmanlardan
B) Mo'g'ul va tatarlardan
C) Arab va fors qabilalaridan
D) Xitoy va uyg'urlardan
JAVOB: A

Qo'shinning katta qismini tashkil qilgan “lashkari berun” nima?
A) Zaxira qism
B) Mamluklardan iborat tansoqchilar
C) Nomuntazam armiya
D) Qal'alarni qo'riqlovchi qism
JAVOB: C

Qo'shin tarkibidagi mamluklardan iborat tansoqchilar qismi qanday atalgan?
A) Muqaddam
B) Xaros
C) Xofiya
D) Lashkari berun
JAVOB: B

Xaros qismi nechta kishidan iborat bo'lgan?
A) 50 ming
B) 20 ming
C) 10 ming
D) 5 ming
JAVOB: C

Qo'shin asosini qanday tamoyilga ko'ra turkiy qism va bo'linmalar tashkil etgan?
A) Qabilalar tamoyiliga ko'ra
B) Diniy tamoyilga ko'ra
C) Kasb tamoyiliga ko'ra
D) Hududiy tamoyilga ko'ra
JAVOB: A

Xorazmshoh qo'shinining ko'pchiligini kimlar tashkil etgan?
A) Piyodalar
B) Mamluklar
C) Otliqlar
D) Tuya mingan askarlar
JAVOB: C

Urush vaqtida Xorazmshoh qo'shini tarkibida nimalar tuzilgan?
A) Yollanma qo'shinlar
B) Dengiz floti
C) Xalq lashkarlari
D) Salibchilar otryadlari
JAVOB: C

Qo'shinning jangovar tartibidagi qismlar va ularning nomlari to'g'ri moslashtirilgan javobni aniqlang. 1) O'ng qanot; 2) So'l qanot. a) Maymana; b) Maysara; c) Qalb; d) Xofiya.
A) 1-b, 2-c
B) 1-a, 2-b
C) 1-a, 2-d
D) 1-a, 2-c
JAVOB: B

Qo'shinning jangovar tartibidagi qismlar va ularning nomlari to'g'ri moslashtirilgan javobni aniqlang. 1) Avang'or; 2) Markaz. a) Maysara; b) Maymana; c) Muqaddam (yozoq); d) Qalb.
A) 1-b, 2-a
B) 1-c, 2-d
C) 1-d, 2-a
D) 1-a, 2-d
JAVOB: B

Raqibni tor-mor etishni yakunlash vazifasi qaysi qism zimmasiga yuklatilgan?
A) Avang'or
B) Lashkari berun
C) Xofiya (zaxira qism)
D) Xaros
JAVOB: C

Xorazmshoh qo'shinining orqa qismida nima bo'lgan?
A) Qo'riqlovchi qism
B) Xaros qismi
C) Qamal mashinalari
D) Zaxira otliqlar
JAVOB: A

Qal'alarni shturm va qamal qilishda foydalanilgan manjaniq qanday vazifani bajargan?
A) Odimlovchi minora bo'lgan
B) Qal'a devorini teshgan
C) Qamal qiluvchilarni himoya qilgan
D) Katapulta sifatida tosh uloqtirgan
JAVOB: D

Qamal qurollari va ularning izohi to'g'ri moslashtirilgan javobni aniqlang. 1) Mataris; 2) Jamoluqot. a) Odimlovchi minoralar; b) Qamal mashinalari; c) Shotilar; d) Devorteshar mashinalar.
A) 1-a, 2-b
B) 1-a, 2-d
C) 1-c, 2-a
D) 1-d, 2-a
JAVOB: B

Xorazmshoh jangchilari foydalangan qurollarni aniqlang. 1) Miltiq; 2) Qilich; 3) Gurzi; 4) To'p; 5) Nayza; 6) Kamon.
A) 1, 2, 4, 6
B) 2, 3, 5, 6
C) 3, 4, 6
D) 2, 4, 6
JAVOB: B

Muhammad Xorazmshoh davrida mamlakat chegaralarida qanday shahar-qal'alar bo'lgan?
A) Faqat tuproq va somondan qurilgan
B) Faqat yog'ochdan qurilgan
C) Burjli devorlari tosh va xom g'ishtdan qilingan
D) Pishiq g'isht va marmardan qurilgan
JAVOB: C

XIII asr boshlarida Xorazmshoh-Anushtaginiylar davlati nimasi bilan ajralib turgan?
A) Dengiz floti bilan
B) Mo'g'ullarga tobeligi bilan
C) Kichik hududi bilan
D) Hududining kengligi va saltanatining nufuzi bilan
JAVOB: D

Muhammad Xorazmshohning onasi kim edi?
A) Nurjahon
B) Roziya
C) Zubayda
D) Turkon xotun
JAVOB: D

Turkon xotun taxt vorisi etib kimni tayinlagan?
A) Qutbiddin O'zloqshohni
B) Rukniddin G'ursonchini
C) Oqshohni
D) Jaloliddin Manguberdini
JAVOB: A

Xorazmshohlar davlatida Sulton Muhammad hukmini bekor qilib, uning nomidan qaror qabul qilish huquqiga kim ega bo'lgan?
A) Jaloliddin Manguberdi
B) Mahmud Yalavoch
C) Turkon xotun
D) Inalchuq
JAVOB: C

Xorazmshohlar davlatidagi “o'ziga xos ikki hokimlik” tizimi nimani bildirgan?
A) Sulton va Turkon xotun hokimiyatining yonma- yon mavjudligini
B) Xorazmshoh va xalifa hokimiyatini
C) Ikki poytaxt mavjudligini
D) Ikki qo'shin mavjudligini
JAVOB: A

Quyidagi voqealardan qaysi biri eng avval sodir bo'lgan?
A) G'azna, G'ur, Bomiyon yerlari qo'lga kiritildi
B) Davlat tarkibiga Fors Iroqi, Ozarbayjon va Shirvon kirdi
C) Xalifa nomi xutbadan chiqarib tashlandi
D) Movarounnahrda qoraxoniylar boshqaruviga chek qo'yildi
JAVOB: D

Quyidagi voqealardan qaysi biri eng keyin sodir bo'lgan?
A) G'azna, G'ur, Bomiyon yerlari qo'lga kiritildi
B) Xalifa nomi xutbadan chiqarib tashlandi
C) Davlat tarkibiga Fors Iroqi, Ozarbayjon va Shirvon kirdi

</script>

<script>
  // =====================================================================
  // BU YERDAN PASTGA TEGISHNING HOJATI YO'Q — bu qism yuqoridagi oddiy
  // matnni avtomatik o'qib, testga aylantiradi.
  // =====================================================================

  // 1) Bitta mavzu matnini savollar ro'yxatiga aylantiruvchi funksiya
  function parseTopicText(rawText) {
    const blocks = rawText.trim().split(/\n\s*\n/); // bo'sh qatordan bo'lib olamiz
    const result = [];
    const warnings = [];

    blocks.forEach((block, blockIndex) => {
      const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const questionLines = [lines[0]];
      const images = [];
      const tableRows = [];
      const options = [];
      let correctLetter = null;
      let mode = 'question'; // 'question' | 'table'

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];

        const imgMatch = line.match(/^RASM:\s*(.+)$/i);
        if (imgMatch) { images.push(imgMatch[1].trim()); mode = 'question'; continue; }

        if (/^JADVAL:?$/i.test(line)) { mode = 'table'; continue; }

        const optMatch = line.match(/^([A-D])\)\s*(.+)$/);
        if (optMatch) { options.push(optMatch[2]); mode = 'options'; continue; }

        const ansMatch = line.match(/^JAVOB:\s*([A-D])/i);
        if (ansMatch) { correctLetter = ansMatch[1].toUpperCase(); continue; }

        if (mode === 'table' && line.includes('|')) {
          tableRows.push(line.split('|').map(cell => cell.trim()));
          continue;
        }

        if (mode === 'question') {
          questionLines.push(line); // savol matni bir necha qatorli bo'lishi mumkin
        }
      }

      if (options.length < 2 || options.length > 4 || !correctLetter || "ABCD".indexOf(correctLetter) >= options.length) {
        warnings.push(`${blockIndex + 1}-savolda xatolik bor (variantlar yoki JAVOB qatori to'liq emas): "${questionLines[0].slice(0, 40)}..."`);
        return;
      }

      result.push({
        text: questionLines.join('\n'),
        images: images,
        table: tableRows,
        options: options,
        correct: "ABCD".indexOf(correctLetter)
      });
    });

    return { questions: result, warnings: warnings };
  }

  // 2) Sahifadagi barcha mavzu bloklarini o'qib, questionSets ni yasaymiz
  const questionSets = {};
  const allWarnings = [];

  document.querySelectorAll('script.question-data').forEach(block => {
    const key = block.dataset.key;
    const parsed = parseTopicText(block.textContent);
    questionSets[key] = {
      title: block.dataset.title,
      group: block.dataset.group || '',
      desc: block.dataset.desc,
      questions: parsed.questions
    };
    parsed.warnings.forEach(w => allWarnings.push(`«${block.dataset.title}» mavzusida — ${w}`));
  });

  // Agar formatlashda xato bo'lsa, o'chirib tashlamay, o'qituvchiga ko'rsatamiz
  if (allWarnings.length > 0) {
    document.getElementById('errorArea').innerHTML =
      '<div class="error-box"><strong>Diqqat, quyidagi savollarni tekshiring:</strong><br>' +
      allWarnings.join('<br>') + '</div>';
  }

  let questions = [];
  let currentTopicKey = "";
  let current = 0;
  let score = 0;

  function renderTopicList() {
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    let lastGroup = null;
    for (const key in questionSets) {
      const set = questionSets[key];
      if (set.questions.length === 0) continue; // savoli yo'q mavzuni ko'rsatmaymiz
      if (set.group && set.group !== lastGroup) {
        lastGroup = set.group;
        const total = Object.values(questionSets).filter(x => x.group === set.group).reduce((a, x) => a + x.questions.length, 0);
        const h = document.createElement('div');
        h.className = 'group-head';
        h.innerHTML = `<b>${set.group}</b><span>${total} ta savol</span>`;
        list.appendChild(h);
        const mix = document.createElement('button');
        mix.className = 'topic-card';
        mix.innerHTML = `
          <div class="topic-info">
            <h3>Aralash test — ${set.group.split(' · ')[0]}</h3>
            <p>Hamma mavzulardan 30 ta tasodifiy savol</p>
          </div>
          <div class="topic-arrow">Boshlash →</div>`;
        mix.onclick = () => startMix(set.group);
        list.appendChild(mix);
      }
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `
        <div class="topic-info">
          <h3>${set.title}</h3>
          <p>${set.questions.length} ta savol</p>
        </div>
        <div class="topic-arrow">Boshlash →</div>
      `;
      card.onclick = () => startQuiz(key);
      list.appendChild(card);
    }
  }

  function startMix(group) {
    const all = [];
    Object.values(questionSets).forEach(x => { if (x.group === group) x.questions.forEach(q => all.push(q)); });
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    questionSets['__mix'] = { title: 'Aralash test — ' + group.split(' · ')[0], desc: '', group: '__mix', questions: all.slice(0, 30) };
    startQuiz('__mix');
  }

  function startQuiz(key) {
    currentTopicKey = key;
    questions = questionSets[key].questions;
    current = 0;
    score = 0;

    document.getElementById('testTitle').textContent = questionSets[key].title;
    document.getElementById('topicScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    const quizArea = document.getElementById('quizArea');

    let mediaHtml = '';
    (q.images || []).forEach(src => {
      mediaHtml += `<img class="q-image" src="${src}" alt="Savolga tegishli rasm">`;
    });
    if (q.table && q.table.length > 0) {
      mediaHtml += '<table class="q-table">';
      q.table.forEach(row => {
        mediaHtml += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      mediaHtml += '</table>';
    }

    let optionsHtml = '';
    q.options.forEach((opt, i) => {
      optionsHtml += `<button class="option" onclick="checkAnswer(${i})"><span class="opt-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    });

    const questionTextHtml = q.text.split('\n').join('<br>');

    quizArea.innerHTML = `
      <div class="card">
        <div class="q-text">${questionTextHtml}</div>
        ${mediaHtml}
        ${optionsHtml}
        <div class="kbd-hint">Klaviatura: A, B, C, D tugmalari bilan javob bering</div>
      </div>
    `;
    answered = false;

    document.getElementById('progressText').textContent = `${current + 1} / ${questions.length} savol`;
    document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
  }

  let answered = false;

  // Bosh sahifadagi statistika uchun (brauzer xotirasi)
  function recordAnswer(isCorrect){
    try {
      var st; try { st = JSON.parse(localStorage.getItem('tm_stats')); } catch(e){}
      if (!st || !st.days) st = {total:0, correct:0, wrong:0, best:0, days:{}};
      var d = new Date(), k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      st.days[k] = (st.days[k]||0) + 1;
      st.total++; if (isCorrect) st.correct++; else st.wrong++;
      var n=0, c=new Date(); while(st.days[c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0')]){n++; c.setDate(c.getDate()-1);}
      if (n > (st.best||0)) st.best = n;
      localStorage.setItem('tm_stats', JSON.stringify(st));
    } catch(e){}
  }

  function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const buttons = document.querySelectorAll('.option');

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      if (i === selectedIndex && selectedIndex !== q.correct) btn.classList.add('wrong');
    });

    if (selectedIndex === q.correct) score++;
    recordAnswer(selectedIndex === q.correct);

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    startQuiz(currentTopicKey);
  }

  function showTopicScreen() {
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('topicScreen').classList.remove('hidden');
  }

  // Klaviatura: A/B/C/D yoki 1/2/3/4
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const quiz = document.getElementById('quizScreen');
    if (!quiz || quiz.classList.contains('hidden')) return;
    const keys = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
    const idx = keys[e.key.toLowerCase()];
    if (idx === undefined) return;
    const btns = document.querySelectorAll('#quizArea .option');
    if (idx < btns.length) { e.preventDefault(); checkAnswer(idx); }
  });

  renderTopicList();
</script>

</body>
</html>

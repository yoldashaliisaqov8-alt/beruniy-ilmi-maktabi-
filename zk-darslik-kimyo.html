<!--
  MAKTAB DARSLIGI bo'yicha svoyak: mavzular darslik boblari bo'yicha tuziladi (namuna savollar).
  YANGI MAVZU QO'SHISH: pastdagi blokka shu shaklda yozing.
  MAVZU: mavzu nomi
  10: savol matni          (ball: 10, 20, 30, 40, 50 ...)
  JAVOB: javob
  QABUL: boshqa qabul qilinadigan yozilishlar (ixtiyoriy)
  IZOH: izoh (ixtiyoriy)
  MANBA: manba (ixtiyoriy)
-->
<script type="text/plain" class="set" data-title="7-sinf Kimyo (darslik asosida, 2022)">
MAVZU: Kimyo tarixi va uning olimlari
10: Darslikdagi taxminga ko'ra, "kimyo" so'zi bir mamlakatning "qora yer" ma'nosidagi qadimgi nomidan kelib chiqqan. Mamlakatni ayting.
JAVOB: Misr
QABUL: Kem
IZOH: Qadimgi Misrni "Kem" deb atashgan; kimyo avval "Misr fani" deb yuritilgan.
MANBA: 7-sinf Kimyo darsligi, 7-bet
20: Alkimyogarlarni tanqid qilgan bu allomamiz: "Men buni imkonsiz deb hisoblayman, chunki bir metallni boshqasiga aylantirishning kimyoviy yo'llari yo'q", degan. Allomani ayting.
JAVOB: Ibn Sino
QABUL: Abu Ali ibn Sino
MANBA: 7-sinf Kimyo darsligi, 7-bet
30: 1865-yilda ingliz olimi Nyulands har sakkizinchi element birinchisiga o'xshashini payqab, kashfiyotini musiqadan olingan nom bilan atagan. Qonun nomini ayting.
JAVOB: Oktavalar qonuni
IZOH: Musiqiy o'lchovning yetti intervaliga o'xshatilgan.
MANBA: 7-sinf Kimyo darsligi, 76-bet
40: Bu rus olimi 1741-yilgi asarlarida molekulalarni "korpuskulalar", atomlarni esa "elementlar" deb atagan. Olimni ayting.
JAVOB: Lomonosov
QABUL: M. V. Lomonosov
MANBA: 7-sinf Kimyo darsligi, 38-bet
50: 1121-yilda yozilgan "Donishmandlik tarozilari haqida" risolasida gidrostatik tarozilar va qotishma tarkibini solishtirma og'irlik orqali aniqlash usullari yoritilgan. Muallifni ayting.
JAVOB: Abdurahmon Xaziniy
QABUL: Xaziniy
MANBA: 7-sinf Kimyo darsligi, 8-bet

MAVZU: Kimningdir nimasi
TUR: o'yinli — javob "egasining narsasi" shaklida
10: Uning birinchi varianti 1869-yil 1-martda yaratilgan deb hisoblanadi. Hozir unda 118 ta element bor. Uni ayting.
JAVOB: Mendeleyevning davriy jadvali
QABUL: Mendeleyev jadvali; Davriy sistema
MANBA: 7-sinf Kimyo darsligi, 81-bet
20: Bu son shunchalik kattaki, Yer yuzidagi barcha odamlarning sochlari tolasidan ham ko'p. Italiyalik olim sharafiga nomlangan. Uni ayting.
JAVOB: Avogadro doimiysi
QABUL: Avogadro soni; 6,02·10²³
MANBA: 7-sinf Kimyo darsligi, 61-bet
30: Olim suvdagi gul changlarini mikroskopda kuzatib, ularning to'xtovsiz tartibsiz harakatini ko'rgan. Bu harakat uning nomi bilan ataladi. Uni ayting.
JAVOB: Broun harakati
QABUL: Braun harakati
MANBA: 7-sinf Kimyo darsligi, 54-bet
40: Laboratoriyada vodorod odatda shu asbobda olinadi; oz miqdorda olish uchun esa Kiryushkin apparati ishlatiladi. Asbobni ayting.
JAVOB: Kipp apparati
MANBA: 7-sinf Kimyo darsligi, 113-bet
50: 1870-yilda nemis kimyogari elementlar valentligiga asoslangan jadval tuzgan va Mendeleyevdan mustaqil ravishda davriy qonunga kelgan. Jadvalni ayting.
JAVOB: Meyer jadvali
QABUL: Lotar Meyer jadvali
MANBA: 7-sinf Kimyo darsligi, 76-bet

MAVZU: Tarjimalar
TUR: shakliy — "...tilida ... deng"
10: Yunon tilida "bo'linmas" deng.
JAVOB: Atom
IZOH: Yunoncha atomos — "bo'linmas".
MANBA: 7-sinf Kimyo darsligi, 37-bet
20: Yunon tilida "hidli" deng. Bu nomni 1840-yilda Shenbeyn bir gazga bergan.
JAVOB: Ozon
MANBA: 7-sinf Kimyo darsligi, 102-bet
30: Lotincha "massa" so'zidan yasang: 1647-yilda Gassendi atomlar guruhini shunday atashni taklif qilgan.
JAVOB: Molekula
IZOH: Lotincha moles — "massa".
MANBA: 7-sinf Kimyo darsligi, 54-bet
40: Lotin tilida "shaxta, kon" deng. Issiqlik va elektrni yaxshi o'tkazuvchi yaltiroq oddiy moddalar shunday ataladi.
JAVOB: Metall
IZOH: Lotincha metallum — "shaxta, kon".
MANBA: 7-sinf Kimyo darsligi, 75-bet
50: "Suvni hosil qiluvchi" ma'nosidagi bu nomni elementga Lavuazye bergan. Elementning lotincha nomini ayting.
JAVOB: Hydrogenium
QABUL: Gidrogenium
IZOH: Qabul emas: Vodorod (lotincha nomi so'ralgan).
MANBA: 7-sinf Kimyo darsligi, 112-bet

MAVZU: Metallar va sayyoralar
TUR: mazmunli — alkimyogarlar yetti metallni yetti sayyora va hafta kunlariga bog'lagan
10: Alkimyogarlar bu metallni Quyosh va yakshanba bilan bog'lashgan. Metallni ayting.
JAVOB: Oltin
MANBA: 7-sinf Kimyo darsligi, 45-bet
20: Alkimyogarlar bu metallni Oy va dushanba bilan bog'lashgan. Metallni ayting.
JAVOB: Kumush
MANBA: 7-sinf Kimyo darsligi, 45-bet
30: Alkimyogarlar bu metallni urush xudosi nomidagi sayyora va seshanba bilan bog'lashgan. Metallni ayting.
JAVOB: Temir
IZOH: Sayyora — Mars.
MANBA: 7-sinf Kimyo darsligi, 45-bet
40: Alkimyogarlar bu metallni go'zallik ma'budasi nomidagi sayyora va juma bilan bog'lashgan. Metallni ayting.
JAVOB: Mis
IZOH: Sayyora — Venera.
MANBA: 7-sinf Kimyo darsligi, 45-bet
50: Alkimyogarlar bu metallni Saturn va haftaning oxirgi kuni — shanba bilan bog'lashgan. Metallni ayting.
JAVOB: Qo'rg'oshin
MANBA: 7-sinf Kimyo darsligi, 45-bet

MAVZU: Atom ichida
10: 1897-yilda J. Tomson atomdan ham kichik, vodorod atomidan 1837 marta yengil bo'lgan zarrani aniqlagan. Zarrani ayting.
JAVOB: Elektron
MANBA: 7-sinf Kimyo darsligi, 41-bet
20: Atomning bu modelida elektronlar yadro atrofida xuddi sayyoralar Quyosh atrofida aylangandek harakatlanadi. Modelni ayting.
JAVOB: Planetar model
QABUL: Atomning planetar modeli; Rezerford modeli
MANBA: 7-sinf Kimyo darsligi, 42-bet
30: Uglerodning 6, 7 va 8 neytronli turlari — uglerod-12, uglerod-13 va uglerod-14 umumiy nom bilan shunday ataladi. Uni ayting.
JAVOB: Izotoplar
QABUL: Izotop
MANBA: 7-sinf Kimyo darsligi, 49-bet
40: Bu vodorod atomining yadrosida protondan tashqari bitta neytron ham bor, shuning uchun u odatdagidan og'irroq. Uni ayting.
JAVOB: Deyteriy
MANBA: 7-sinf Kimyo darsligi, 49, 112-betlar
50: Vodorodning uchinchi izotopi bitta proton va ikkita neytrondan iborat, "T" harfi bilan belgilanadi. Uni ayting.
JAVOB: Tritiy
MANBA: 7-sinf Kimyo darsligi, 112-bet

MAVZU: Havoning sirlari
TUR: mazmunli — havo tarkibi kashfiyotlari
10: Bu buyuk italyan rassomi havoni ikki gaz aralashmasi deb ta'riflagan, ulardan faqat bittasi yonish va nafas olishda qatnashadi, degan. Uni ayting.
JAVOB: Leonardo da Vinchi
QABUL: Leonardo
MANBA: 7-sinf Kimyo darsligi, 90-bet
20: 1772-yilda Daniel Rezerford kashf etgan gazni ayting. U hajm bo'yicha havoning eng katta qismini tashkil qiladi.
JAVOB: Azot
IZOH: Atom modelini yaratgan Ernest Rezerford bilan adashtirmang.
MANBA: 7-sinf Kimyo darsligi, 90-bet
30: Bu gazni Sheele selitrani, Pristli esa simob oksidini qizdirib deyarli bir vaqtda olishgan. Lavuazye uni kislotalar tarkibida bo'lgani uchun shunday atagan. Gazni ayting.
JAVOB: Kislorod
MANBA: 7-sinf Kimyo darsligi, 90-bet
40: 1754-yilda havo oddiy modda emas, gazlar aralashmasi ekanini birinchi bo'lib eksperimental isbotlagan olimni ayting.
JAVOB: Jozef Blek
QABUL: Blek
MANBA: 7-sinf Kimyo darsligi, 85-bet
50: XVIII asr oxirida bu olim havodan elektr toki o'tkazib, g'ayrioddiy hidli gaz olgan va uni "elektr moddasi" deb taxmin qilgan. Olimni ayting.
JAVOB: Martin van Marum
QABUL: Van Marum
IZOH: Bu gaz keyinchalik "ozon" deb ataldi.
MANBA: 7-sinf Kimyo darsligi, 102-bet

MAVZU: Kislotalar
10: Darslikka ko'ra, sharobning havoda oksidlanishi natijasida inson olgan birinchi kislota shu edi. Uni ayting.
JAVOB: Sirka kislotasi
QABUL: Sirka
MANBA: 7-sinf Kimyo darsligi, 120-bet
20: Oziq-ovqatda E330 qo'shimchasi sifatida ishlatiladi, qurilishda esa sement va gipsning qotishini sekinlashtirish uchun qo'shiladi. Kislotani ayting.
JAVOB: Limon kislotasi
MANBA: 7-sinf Kimyo darsligi, 121-bet
30: E236 qo'shimchasi, asalarichilikda parazitlarga qarshi ishlatiladi. Nomi bir hasharotdan olingan. Kislotani ayting.
JAVOB: Chumoli kislotasi
MANBA: 7-sinf Kimyo darsligi, 121-bet
40: 1908-yilda daniyalik kimyogar Syorensen kiritgan, odatda 0 dan 14 gacha o'zgaradigan ko'rsatkichni ayting.
JAVOB: pH
QABUL: Vodorod ko'rsatkichi
MANBA: 7-sinf Kimyo darsligi, 122-bet
50: 1872-yilda shotland kimyogari Robert Engus Smit Manchester ustidagi tutunni o'rganib, fanga bu atamani kiritgan. Atamani ayting.
JAVOB: Kislotali yomg'ir
MANBA: 7-sinf Kimyo darsligi, 126-bet

MAVZU: O'zbekiston konlari
10: Toshkent viloyatidagi bu qo'ng'ir ko'mir koni respublikadagi barcha ko'mir zaxirasining 96,5 foizini tashkil qiladi. Konni ayting.
JAVOB: Ohangaron
QABUL: Ohangaron koni
MANBA: 7-sinf Kimyo darsligi, 169-bet
20: Qo'ng'irot soda zavodi shu konning tuzlarini qayta ishlaydi. Kon nomi "borsa — qaytmas" ma'nosini beradi. Konni ayting.
JAVOB: Borsakelmas
MANBA: 7-sinf Kimyo darsligi, 168-bet
30: Jeroy-Sardara, Qoraxat va Shimoliy Jetitov konlarida qazib olinadigan bu xomashyodan fosfat o'g'itlari ishlab chiqariladi. Uni ayting.
JAVOB: Fosforit
MANBA: 7-sinf Kimyo darsligi, 168-bet
40: G'ozg'on, Nurota va Zarband konlarida bu tosh bloklari zamonaviy texnologiya bilan qazib olinadi. Toshni ayting.
JAVOB: Marmar
MANBA: 7-sinf Kimyo darsligi, 168-bet
50: Toshkent viloyatining Qayrag'ochsoy hududida topilgan bu xomashyo chuqur quduqlarni parmalashda ishlatiladi va hozirgacha chetdan sotib olinardi. Uni ayting.
JAVOB: Barit
MANBA: 7-sinf Kimyo darsligi, 168-bet

MAVZU: Bilasizmi?
TUR: mazmunli — inson va tabiat kimyosi
10: O'zbekistonda uning eng yirik zaxiralari Orol dengizi bo'yida. Kattalarga kuniga 6 gramm tavsiya etiladi. Uni ayting.
JAVOB: Osh tuzi
QABUL: Natriy xlorid
MANBA: 7-sinf Kimyo darsligi, 24-bet
20: Uning 99 foizi suv, 0,8 foizi osh tuzi, qolgani natriy karbonat va oqsillardan iborat. Inson tanasidagi bu suyuqlikni ayting.
JAVOB: Ko'z yoshi
MANBA: 7-sinf Kimyo darsligi, 132-bet
30: Sovuq boshlanishi bilan bu hayvonning qonida glyukoza 60 barobar ortadi, shuning uchun muz ostida yaxlab qolsa ham nobud bo'lmaydi. Hayvonni ayting.
JAVOB: Baqa
MANBA: 7-sinf Kimyo darsligi, 155-bet
40: Bu element tanqisligi qalqonsimon bezning kattalashishiga — bo'qoq kasalligiga olib keladi. Elementni ayting.
JAVOB: Yod
MANBA: 7-sinf Kimyo darsligi, 151-bet
50: Kalsiferol deb ataladigan bu vitamin kalsiy va fosfor almashinuvini boshqaradi, baliq yog'i va tuxum sarig'ida bor. Vitamin harfini ayting.
JAVOB: D vitamini
QABUL: Vitamin D; D
MANBA: 7-sinf Kimyo darsligi, 158-bet

MAVZU: Elementlar oilalari
10: Li, Na, K, Rb, Cs, Fr — suv bilan ta'sirlashib ishqor hosil qiluvchi bu oilani ayting.
JAVOB: Ishqoriy metallar
MANBA: 7-sinf Kimyo darsligi, 79-bet
20: Bu oila nomi "tuz hosil qiluvchi" degan ma'noni anglatadi. Oilani ayting.
JAVOB: Galogenlar
QABUL: Galogen
MANBA: 7-sinf Kimyo darsligi, 79-80-betlar
30: Ishqoriy metallar oilasining radioaktiv a'zosi. Nomi Yevropadagi bir davlatga ishora qiladi. Elementni ayting.
JAVOB: Fransiy
MANBA: 7-sinf Kimyo darsligi, 79-bet
40: Galogenlar oilasidagi radioaktiv element. Elementni ayting.

50: Ishqoriy metallar kerosin qatlami ostida saqlanadi, bu element esa vazelin moyi ostida saqlanadi. Elementni ayting.

</script>

<script>
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  var themes=[], th=null, cq=null, m, balls=[];
  var SETS=[].slice.call(document.querySelectorAll('script.set'));
  function parse(text){
    themes=[];th=null;cq=null;
    text.split('\n').forEach(function(l){
      l=l.trim(); if(!l)return;
      if(m=l.match(/^MAVZU:\s*(.+)/i)){th={name:m[1],tur:'',qs:{}};themes.push(th);}
      else if(th&&(m=l.match(/^TUR:\s*(.+)/i)))th.tur=m[1];
      else if(th&&(m=l.match(/^(\d+):\s*(.+)/))){cq={ball:+m[1],q:m[2],a:'',acc:'',izoh:'',manba:'',used:false};th.qs[cq.ball]=cq;}
      else if(cq&&(m=l.match(/^JAVOB:\s*(.+)/i)))cq.a=m[1];
      else if(cq&&(m=l.match(/^QABUL:\s*(.+)/i)))cq.acc=m[1];
      else if(cq&&(m=l.match(/^IZOH:\s*(.+)/i)))cq.izoh=m[1];
      else if(cq&&(m=l.match(/^MANBA:\s*(.+)/i)))cq.manba=m[1];
    });
    balls=[]; themes.forEach(function(t){Object.keys(t.qs).forEach(function(b){b=+b;if(balls.indexOf(b)<0)balls.push(b);});});
    balls.sort(function(a,b){return a-b;});
  }
  var setSel=document.getElementById('setSel');
  setSel.innerHTML=SETS.map(function(x,i){return '<option value="'+i+'">'+esc(x.getAttribute('data-title'))+'</option>';}).join('');
  if(!SETS.length){document.querySelector('.wrap').insertAdjacentHTML('beforeend','<div class="card" style="padding:26px;text-align:center;font-weight:700">Kimyo fanidan savollar tez orada qo\'shiladi.<br><small style="font-weight:600;color:var(--ink-soft)">Savollar tayyor bo\'lishi bilan shu sahifada svoyak taxtasi paydo bo\'ladi.</small></div>');document.querySelector('.tools').style.display='none';}else parse(SETS[0].textContent);

  var players=[{n:"1-o'yinchi",s:0},{n:"2-o'yinchi",s:0},{n:"3-o'yinchi",s:0}];
  function drawScore(){
    var box=document.getElementById('score'); box.innerHTML='';
    players.forEach(function(p,i){
      var d=document.createElement('div'); d.className='pl';
      d.innerHTML='<input value="'+esc(p.n)+'" aria-label="Ism"><b>'+p.s+'</b>';
      d.querySelector('input').oninput=function(){p.n=this.value;};
      box.appendChild(d);
    });
  }
  function drawBoard(){
    var b=document.getElementById('board'); b.innerHTML=''; b.style.gridTemplateColumns='repeat('+themes.length+',minmax(0,1fr))';b.className='board'+(themes.length>6?' dense':'');
    themes.forEach(function(t){var h=document.createElement('div');h.className='th';h.textContent=t.name;b.appendChild(h);});
    balls.forEach(function(ball){
      themes.forEach(function(t){
        var q=t.qs[ball], c=document.createElement('button');
        c.className='cell'+(!q?' none':(q.used?' used':'')); c.textContent=ball;
        if(q&&!q.used)c.onclick=function(){openQ(t,q);};
        b.appendChild(c);
      });
    });
  }
  var tmr=null,left=30;
  function openQ(t,q){
    cq=q; document.getElementById('ov').classList.remove('hidden');
    document.getElementById('qm').textContent=t.name+' · '+q.ball+' ball'+(t.tur?' · '+t.tur:'');
    document.getElementById('qt').textContent=q.q;
    document.getElementById('ab').innerHTML='';
    document.getElementById('showA').classList.remove('hidden');
    var w=document.getElementById('who'); w.innerHTML='';
    players.forEach(function(p){
      var d=document.createElement('div'); d.className='p'; d.innerHTML='<span>'+esc(p.n)+'</span><button class="y" title="To\'g\'ri">✓</button><button class="n" title="Noto\'g\'ri">✗</button>';
      d.querySelector('.y').onclick=function(){p.s+=q.ball;finish(true);};
      d.querySelector('.n').onclick=function(){p.s-=q.ball;drawScore();};
      w.appendChild(d);
    });
    clearInterval(tmr); left=30; drawT();
    tmr=setInterval(function(){left--;drawT();if(left<=0){clearInterval(tmr);}},1000);
  }
  function drawT(){var t=document.getElementById('tm');t.textContent=left;t.className='timer'+(left<=8?' low':'');}
  function showAns(){
    var h='<div class="ans">Javob: '+esc(cq.a);
    if(cq.acc)h+='<small>Qabul: '+esc(cq.acc)+'</small>';
    if(cq.izoh)h+='<small>Izoh: '+esc(cq.izoh)+'</small>';
    if(cq.manba)h+='<small>Manba: '+esc(cq.manba)+'</small>';
    document.getElementById('ab').innerHTML=h+'</div>';
    document.getElementById('showA').classList.add('hidden');
  }
  function finish(){cq.used=true;clearInterval(tmr);document.getElementById('ov').classList.add('hidden');drawScore();drawBoard();}
  document.getElementById('showA').onclick=showAns;
  document.getElementById('closeQ').onclick=function(){finish();};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('ov').classList.contains('hidden'))return;
    if(e.key==='Escape')finish(); else if(e.key===' '&&e.target.tagName!=='INPUT'){e.preventDefault();showAns();}
  });
  document.getElementById('addP').onclick=function(){if(players.length<6){players.push({n:(players.length+1)+"-o'yinchi",s:0});drawScore();}};
  document.getElementById('delP').onclick=function(){if(players.length>2){players.pop();drawScore();}};
  document.getElementById('reset').onclick=function(){if(!confirm("Hamma ball va ishlatilgan kataklar tozalansinmi?"))return;
    players.forEach(function(p){p.s=0;});themes.forEach(function(t){Object.keys(t.qs).forEach(function(b){t.qs[b].used=false;});});drawScore();drawBoard();};
  setSel.onchange=function(){parse(SETS[+setSel.value].textContent);drawBoard();};
  if(SETS.length){drawScore(); drawBoard();}
</script></body></html>

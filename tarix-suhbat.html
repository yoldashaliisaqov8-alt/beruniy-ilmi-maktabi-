SAVOL: Abu Bakr Narshaxiy "Buxoro tarixi" asrida somoniylarning davlat boshqaruvi haqida ma'lumot bering.
JAVOB: Somoniylar davrida Nasr ibn Ahmad ibn Ismoil Somoniy Registonga bir saroy (qurishni) buyurdi. G'oyatda go'zal bir saroy qurdilar.
(Amir) bunga ko'p mol sarfladi. U o'z saroyi darvozasi oldida amaldorlari uchun saroy qurishga buyurdi, uni ham qurdilar, shundayki, har bir amaldorning podshoh saroyi darvozasi oldida qurilgan o'z saroyida alohida devoni bor edi; masalan: vazir devoni, moliya (kirim-chiqim) ishlari devoni, davlat hujjatlarini boshqarish ishlari devoni, soqchilar boshlig'i devoni, xat-xabarlar mutasaddisi devoni, saroy ish boshqaruvchisi devoni, davlat xos mulklari devoni, muhtasib devoni, vaqflar devoni, qozilik ishlari devoni.
(Amir) mana shu tartibda devonlar qurishga buyurdi va ularni qurdilar.
Narshaxiyning yozishicha, Somoniylar davlati asosan o'nta devon orqali idora etilib, ular orasida vazir devoni bosh boshqaruv mahkamasi hisoblanardi.

SAVOL: Somoniylar davlatining boshqaqruvi haqida ma'lumot bering.
JAVOB: Somoniylar mamlakatni boshqarishda dastavval ixcham boshqaruv ma'muriyatini tashkil etdilar.
U amir dargohi va devonlar (vazirliklar)dan iborat edi.
Dargohda amir qarorgohi hamda saroy a'yonlari, navkar va xizmatkorlarining turar joylari bo'lgan.
Nasr ibn Ahmad (Nasr II) davrida Buxoroning Registon maydonida amir qasri qarshisida devonlar uchun saroy qurilib, mahkama mana shu maxsus binoga joylashgan edi.
Mahkama xizmatchilari Qur'on ilmlari va shariatning asosiy qoidalarini yaxshi biladigan, arab, fors, turk tillarini puxta egallagan, turli fanlardan xabardor bo'lgan savodli aslzodalardan tanlab olingan.
Davlat ishlariga qabul qilishda ma'lum bir talablar mavjud edi. Masalan, birinchisi, davlat tilini mukammal bilish, ikkinchisi, zamona huquq me'yorlaridan to'liq xabardorlik, uchinchisi, tarix, adabiyot kabi ilmlardan boxabarlik, to'rtinchisi, hisob-kitob ishlaridagi bilimdonlik va hokazo.

SAVOL: Somoniylar davlatida harbiy ish haqida ma'lumot bering.
JAVOB: Ismoil Somoniy saroyning maxsus muntazam sarbozlaridan iborat yaxshi qurollangan harbiy qo'shin tuzadi.
Yaxshi va uzoq xizmat qilgan sarbozlar «hojib» lavozimiga ko'tarilgan. Hojiblarning boshlig'i «hojib ul-hujob» yoki «hojibi buzruk» deb yuritilar edi.
Bunday unvon Somoniylar saroyida oliy unvon hisoblangan.
Lashkar ikki toifaga bo'lingan: birinchisi, doimiy ravishda faoliyat ko'rsatuvchi saralangan qismlar (gvardiya) va ikkinchisi, zarur hollarda viloyatlardan yig'iladigan qismlar.
Saralangan qismlardagi xizmat kamida sakkiz bosqichdan iborat bo'lib, oddiy piyoda askarlikdan visoqboshi, ya'ni to'rt kishidan iborat guruhga boshliq darajasigacha bo'lgan yo'lni bosib o'tishiga to'g'ri kelgan.
Keyin u haylboshi (kichik qo'shin boshlig'i) maqomini egallashi mumkin bo'lgan.
Bu darajaga tegishli tartib-intizom, talablar doirasida xizmat qilingandagina erishish mumkin edi.
Somoniylarning harbiy qismlarida, ma'muriy lavozimlarida turklar xizmat qilganlar.
Turkiy qullar boshqa mamlakatlarga savdoga chiqarilgan. Qul qochib ketsa, uni hech kim qidirmagan. Somoniylar xizmatida ham turkiy qullar oz bo'lmagan.
Bularning ichidan viloyat hokimlari, harbiylar, hatto davlat boshliqlari yetishib chiqqan: Samjuriy, Alptegin, Tosh, Foyiq va boshqalar shular jumlasidan.
Alptegin somoniylarning sobiq quli, keyinchalik yirik harbiy sarkarda, Xuroson viloyatining hokimi va yirik yer egasi bo'lgan. U boyib, Xuroson va Movarounnahrda joylashgan qishloqlarni sotib olgan, har bir shaharda qasri, hovli-joylari, karvonsaroylari mavjud bo'lgan.
Alpteginning Nishopur bozoridan sotib olgan Sabuk (keyinchalik Sabuktegin) ismli yana bir quli o'z iste'dodi bilan yirik harbiy sarkarda darajasiga ko'tarilgan.

SAVOL: Somoniylar davlatining zaiflashuvi va parchalanishi haqida ma'lumot bering.
JAVOB: Ismoil Somoniyning vafotidan so'ng siyosiy boshboshdoqlik avjiga chiqib, markaziy hokimiyat mavqeyiga putur yetishi mintaqaning Yettisuv va Qoshg'ar qismida boshqa bir siyosiy sulola — qoraxoniylarning kuchayib borishi bilan bir vaqtga to'g'ri kelgandi.
Natijada X asr oxirida hokimiyat qoraxoniylar qo'liga o'tadi.
Qoraxoniylar mintaqaning Yettisuv, Qoshg'ar, Movarounnahr kabi qismlari ustidan hukmronlik qila
boshlaydilar.
Xuroson, G'azna kabi viloyatlar esa xuddi shu davrdan boshlab mintaqada shakllangan yana bir siyosiy sulola — g'aznaviylar tobeligiga o'tgan edi.
Somoniylarning harbiy yurishlari, hukmron sulolaning ichki nizolari, mahalliy hokimlarning o'zboshimcha harakatlari borgan sari avj olib bordi.
Oqibatda mamlakatda iqtisodiy tanglik yuzaga keldi. Hatto harbiylar, shu jumladan, amirning muntazam turk sarbozlari qo'shiniga maosh to'lash uchun mablag'i topilmaydi. Bunday og'ir ahvoldan chiqish uchun aholidan ikki marta soliq undirib olinadi. Behad tartibsizlik mamlakatdagi vaziyatni yanada keskinlashtirib, aholi turli tabaqalarining hokimiyatga qarshi qo'zg'alishiga sabab bo'ladi.
IX-X asrlarda katta yer egalari kadivarlarni ishlatishdan ko'ra, o'z yerlarini qishloq jamoalarining kam yerli a'zolariga ijaraga berishni afzal ko'radilar. O'sha zamonda ijarachilar «barzikor» yoki «qo'shchilar» deb atalardi.
Davlat soliqlari (xiroj va ushr) yer egasidan ham, qo'shchilardan ham alohida-alohida olinar edi.

SAVOL: Azamat Ziyo, "O'zbek davlatchiligi tarixi" asarida Ismoil Somoniy haqida ma'lumot bering.
JAVOB: Ismoil Farg'onada 849-yilda tug'ilgan.
14 yoshida otasi Ahmad vafot etib, akasi Nasr qo'lida qoladi.
Manba tili bilan aytganda «aqlli, adolatli, fikr va tadbir egasi» bo'lmish Ismoil, 892-yili butun Movarounnahr hukmini o'z qo'liga olishga erishib, «haqiqatan ham podshohlikka loyiq va haqli» ekanini isbotlaydi...
Ismoil davlatchiligimiz tarixidagi tajriba va an'analarni uddaburonlik bilan davom ettira bilgan davlat arbobi hisoblanadi.

Ismoil markazlashgan davlatchilik asoslarini qaytadan tiklashga muvaffaq bo'lgan.

SAVOL: Somoniylar davlatida yer egaligi munosabatlari haqida ma'lumot bering.
JAVOB: X asrda yirik mansabdorlarning davlat oldidagi xizmati uchun yer va suvdan iborat katta-katta mulklarni in'om qilish boshlanadi.
Bunday mulk «iqto», unga ega bo'lgan mulkdorlar «muqto» yoki «iqtodor» deb yuritilardi.
Iqto tarzida hatto ayrim viloyat yoki shaharlar va tumanlar hadya etilgan.
Iqto dastavval asosan oliy tabaqali zodagonlar: sulola a'zolari - amirzodalar va yirik mansabdorlarga in'om etilgan.
Bunday mulk avvaliga bir umrga emas, balki ma'lum muddatga berilib, nasldan naslga o'tkazilmagan.
Iqtodorlar o'ziga in'om qilingan hududlarda yashovchi aholidan olinadigan soliqlarning ma'lum qismini o'zlariga olish huquqiga ega bo'lganlar.
Somoniylar hukmronligi davrida yer egaligining Mulki Sultoniy – "Mulki Sultoniy" davlat tasarrufidagi yerlar. Mulk yerlari – hukmron sulola vakillari, mulkdor dehqon va aslzodalarning katta-katta yer maydonlaridan yer maydonlaridan tortib, qishloq aholisiga tegishli mayda xususiy yerlargacha. Vaqf yerlari – masjid, madrasa va xonaqohlarga vaqtincha yoki abadiy foydalanish uchun berilgan yerlar. Mulki xos – oliy martabali din peshvolari va sayyidlar qo'l ostidagi yerlar. Jamoa yerlari – qishloq jamoalari tasarrufidagi ma'lum yer maydonlari kabi turlari mavjud bo'lgan.

MAVZU: 7-sinf · 26-27-mavzular: Somoniylar davrida ijtimoiy-iqtisodiy hayot. (93-99-betlar)
SAVOL: Somoniylar davlatida dehqonchilikka e'tibor haqida ma'lumot bering.
JAVOB: Somoniylar davrida Farg'ona, Qashaqadaryo, Zarafshon vodiylari, Choch, Xorazm, Xuroson viloyatlarida dehqonchilik ishlari yuksak saviyada amalga oshirilgan.
Bug'doy, arpa, sholi, paxta, tariq, zig'ir, kunjut, kanop, no'xot, mosh, yasmiq, beda kabi qator ekinlar yetishtirilgan.
Bog'dorchilik, xususan, uzumchilik va polizchilik sohalarida ham yutuqlar shu kabi edi.
Uzumning o'nlab navlari, mevalardan olma, shaftoli, o'rik, nok, anjir, behi, olcha, olxo'ri, anor, bodom, yong'oq, poliz ekinlaridan qovoq, qovun (ayniqsa Buxoro qovunlari mashhur bo'lgan), sabzavotlardan baqlajon, sabzi, piyoz kabilar yetishtirilgan.
Dehqonchilik solig'i – xirojdan xazinaga tushadigan daromad davlat kirimchiqimining kattagina qismini qoplar edi. Shuning uchun ham somoniylar mamlakatda dehqonchilik xo'jaligini rivojlantirishga katta e'tibor berdilar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 26-27-mavzular, 93-99-betlar
SAVOL: Somoniylar davlatida shaharsozlik va hunarmandchilik haqida ma'lumot bering.
JAVOB: Movarounnahr viloyatlarining ichida eng ko'p nufuzli hudud Farg'ona vodiysi bo'lganligini tushunib olish qiyin emas. Farg'ona viloyatida ko'plab shaharlar bo'lgan.
Uning poytaxti shu davrlarda Axsikent bo'lib, shaharning kattaligi (aylanmasiga) 3 farsang masofaga cho'zilgan, uning ichida bog', kanallar va bir qancha hovuzlar bo'lgan.
Axsikentning atroflarida (devordan tashqarisida) ham bog'lar, daraxtzorlar mo'l bo'lib, ular bir-birlaridan uzilmasdan 2 farsang masofagacha cho'zilib ketgan. Istaxriy (arab geografi).
Bu davrda shaharlarning umumiy qiyofasi tubdan o'zgaradi.
Turon xalqlari va arab madaniyatining qorishuvi natijasida katta-katta gumbazli toq-u ravoqli va peshtoqli imoratlar, ustaxonalar, masjid, madrasa, maqbara, xonaqoh va karvonsaroylar qad ko'tardi.
Shaharlar hunarmandchilik markaziga aylandi. Samarqandda yuqori navli qog'oz ishlab chiqarilar edi.
Shosh o'zining ko'nchilik mahsulotlari va charm mollari bilan, Iloq esa kumush va qo'rg'oshin konlari hamda kumush tanga chiqaradigan zarbxonasi bilan mashhur edi.
Xorazmda qayiqsozlik taraqqiy topadi. Xorazm va Termizda yasalgan qayiqlar Amudaryo bo'ylab to Orol dengizigacha muttasil mol tashib, savdogarlarning yukini yengil, uzog'ini yaqin qilgan.
Bu davrda shaharlar bilan bir qatorda qishloqlar ham mamlakatning iqtisodiy hayotida katta o'ringa ega edi.
Buxoroning Zandana qishlog'ida to'qilgan mallarang bo'z «zandanichi», Samarqandning Vador qishlog'ida tayyorlangan mato «vadoriy» nomlari bilan Sharqda mashhur edi.
Farsax yoki farsang – taxminan 6 kmga teng masofa o'lchov birligi. Amalda farsax uzunligi turli hududlarda farqlangan. Markaziy Osiyoda bu masofa odatda qadamlar bilan o'lchangan va 12 000 qadamga teng bo'lgan.

SAVOL: Somoniylar davlatida ichki va tashqi savdo haqida ma'lumot bering.
JAVOB: Somoniylar davlatida tashqi savdo muomalasida sarroflik cheklaridan keng foydalanilgan. Savdogarlar o'zi bilan ko'p miqdorda pul olib yurmas edilar. O'z pullarini ular shahardagi sarroflardan biriga topshirib, undan tegishli hujjat – chek olardilar. Mo'ljallangan shaharga borishlari bilan shu chekni sarrofga berib, unda ko'rsatilgan miqdordagi pulni to'laligicha qaytarib olish mumkin edi.
Ichki bozorlarda «fals» deb atalgan mis chaqa, xalqaro savdo-sotiqda esa kumush tanga – dirhamlar ishlatilardi.
Mis chaqalarni markaziy hukumat ham, shuningdek, sulola a'zolaridan bo'lgan ba'zi viloyat hokimlari ham chiqarar edilar.
Kumush tangalar faqat hukumat boshlig'i nomidan Marv, Samarqand, Buxoro va Shoshdagi davlat zarbxonalarida so'qilar edi.
Somoniylar «ismoiliy», «muhammadiy» nomlari bilan yuritilgan bir necha xil kumush dirhamlar chiqargan edilar. Ular orasida «ismoiliy» tangasi yuqori sifatli sof kumushdan zarb etilib, ular asosan xalqaro savdo aloqalarida ishlatilgan.
Shimoliy yo'l orqali Janubiy Sibir va Mo'g'ulistonga Movarounnahrning shahar va qishloqlaridan bo'z, kiyim-kechak, egar-jabduq, qilich, idishlar, zargarlik buyumlari, dori-darmon, quruq meva, kunjut va zig'ir moyi kabi mollar olib borilgan.
Sibirdan turli xildagi qimmatbaho mo'ynalar, chorva mollari va chorvachilik mahsulotlari keltirilgan.
Xitoy bilan bo'lgan savdoda choy, ipak mato, tuz va ot muhim o'rinda turgan.
VII-VIII asrlarda choy asosiy import mahsulotlaridan biriga aylangan. Xitoycha «cha» yoki «ming» deb yuritilgan xushbo'y choy o'simligi va uning seleksiyasi bu davrda Sharqiy Turkiston orqali Turkiston diyoriga, so'ngra esa boshqa mamlakatlarga keng tarqalib, aholining maishiy hayotida kundalik iste'mol etiladigan chanqovbosdi benazir ichimlikka aylangan.
Itil, Xazar va Bulg'orga Movarounnahr va Xorazmdan guruch, quruq mevalar, shirinliklar, tuzlangan baliq, paxta, shoyi matolar, movut, kimxob va gilamlar olib borib sotilgan.
Bulg'or va Xazardan qimmatbaho mo'ynalar, shamlar, cho'qqi qalpoqlar keltirilgan.
«Chek» so'zi forscha atama bo'lib, o'sha vaqtda ham bu so'z ayni ma'noda ishlatilgan.

JAVOB: Pishiq g'isht ma'muriy va jamoa binolari qurilishida asosiy material bo'lib qoldi.
Turar joy binolari qurilishida esa sinchli konstruksiya keng tarqaldi.
Pardoz ishlarida somonli loy suvoq qatorida ganchning har xil turlari ishlatilgan. Keyinroq sirlanmagan koshin va sopol plitkalar, sirlangan koshin va naqshlar o'yilgan sirlangan yaxlit pishirilgan sopol taxtachalar — parchin (mayolika) ishlatish usuli kashf etildi.
Eng qadimiy obidalardan Qadimiy Xorazmdagi Qavat qal'a, Samarqand (Afrosiyob)dagi somoniylar asrining bir qismi va Termiz yaqinidagi Qirqqiz qal'asini qayd etish mumkin. Bularning har uchalasi ham xom g'isht va paxsadan bunyod etilgan.
Afrosiyobdagi somoniylar qasrining bir qismi hisoblanuvchi binoning old tomoni yogoch ustunli, peshayvonli bo'lib, o'rtada tomi gumbaz bilan yopilgan katta xona va uning ikki yonida yana qo'shimcha xonalari bo'lgan. Asosiy zal ohaktoshli ganchning ichiga tolasimon o'simliklar qo'shilgan materialdan juda nafis o'ymakorlik usulida hashamdor qilib ishlangan.

JAVOB: Sabuktegin asli Sirdaryo bo'ylarida yashagan barsxon turkiy qabilasiga mansub bo'lib, yoshligida asir olinib, so'ngra qul qilib sotilgan edi.
Somoniylar turkiy qo'shini boshlig'i Alptegin uni o'z qaramog'iga olgan.
Somoniylar davlatining turkiy askarlar qo'shinida xizmat qilgan Sabuktegin G'azna va uning atroflarini Somoniylar noibi sifatida boshqaradi. Bu vaqtga kelib Somoniylar sulolasi inqirozga yuz tutib, Sabuktegin rasman noib bo'lsa-da, aslida o'zini mustaqil hokimdek tuta boshlaydi.
Shijoatkor sarkarda Sabuktegin dushmanlarga qarshi kurashda somoniylarga yordam berdi va «Nosiriddin ad-davla» (Davlat va din himoyachisi) degan sharafli nomga sazovor bo'ldi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: G'aznaviy hukmdor Mahmud G'aznaviy siyosiy va harbiy faoliyati haqida ma'lumot bering.
JAVOB: Sabukteginning o'g'li bo'lgan Mahmud G'aznaviy davrida davlat hududi kengaydi.
Mahmud G'aznaviy Xurosonni butkul Somoniylar davlatidan ajratib oldi. Uning davrida G'aznaviylar davlati Sharqning eng qudratli davlatlaridan biriga aylangan.
Bag'dod xalifasi Mahmud G'aznaviyga «Yamin ud-davla va amin ul-milla» («Musulmon davlatining o'ng qo'li va millatning omonligi») degan faxriy unvon va Xuroson hokimligiga yorliq, bayroq va nog'ora yuboradi.
O'z navbatida, Mahmud G'aznaviy ham Abbosiylar xalifasini rasman tan olib, uni payg'ambar avlodi sifatida qadrlaydi. Bu esa Mahmud G'aznaviy davlatining to'liq mustaqilligidan darak berar edi.
Xutba — juma namozida hukmdor nomini aytib, uning haqiga duo o'qish, olqishlash.
1006-1008-yillarda qoraxoniylar Xurosonga bostirib kiradi. Mahmud G'aznaviy Xurosondan qoraxoniylarni haydab chiqaradi.
1017-yilda Mahmud kuyovi xorazmshoh Ma'mun ibn Ma'munga uyushtirilgan suiqasddan so'ng shu yilning bahorida Xorazmga yurish qiladi. Hazorasp yonidagi jangda Xorazm qo'shinini mag'lubiyatga uchratadi.
Xorazmdan ko'plab boyliklar bilan birga, fan va madaniyat arboblari ham G'aznaga ko'chirib keltiriladi. Ular orasida buyuk olim Abu Rayhon Beruniy ham bor edi.
Xorazmga esa sultonning sobiq bosh hojibi Oltuntosh noib еtib tayinlanadi. Keyinchalik Mahmud G'aznaviy qoraxoniylarga tegishli bo'lgan Amudaryo bo'ylariga yurish qilib, Chag'oniyon, Qobodiyon, Xuttalon va boshqa chegaradosh viloyatlarni o'z davlati tarkibiga kiritadi.
Mahmud G'aznaviy Erondagi Ray va Jilob yerlarini ham o'z mulkiga qo'shib oladi. Mahmud G'aznaviy o'z davrining yetuk sarkardasi bo'lib, murakkab va ziddiyatli vaziyat, qarama-qarshiliklarga boy bo'lgan chog'larda hukmdorlik qilgan. Mahmud G'aznaviy 1030-yilda vafot etadi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: Akbar Zamonovning "O'rta asr tarixiy shaxslari hayotining ayrim noma'lum sahifalari" asaridagi Mahmud G'aznaviyni "mag'lub etgan" malika voqeasi haqida ma'lumot bering.
JAVOB: Valiahd Majdiddin Davloning hali voyaga yetmaganligi tufayli, Ray hududini o'g'li nomidan Sayida Xotun idora qilib turgan edi.
Mahmud G'aznaviy Sayida Xotunga elchi jo'natib, juma namozida o'zining nomini xutbaga qo'shib o'qitishni, Sulton Mahmud nomi bilan tanga pul chiqarilishini talab qiladi. Agar malika bu shartlarga ko'nmaydigan bo'lsa, G'azna qo'shini kuch bilan viloyatni egallashi, talon-taroj qilishi hamda malikaning o'zini qatl etishini shart tarzida qo'yadi.
Sayida Xotun Mahmud G'aznaviyning do'q-po'pisasidan qo'rqmay, dadillik bilan elchilarga shunday javob beradi: «Sulton Mahmudga shuni aytingki, mening erim Faxriddin Davlo tirikligida Sultonning Rayga hujum qilishi mumkinligidan har vaqt xavotirda turar edi. Erim vafotidan keyin men bu haqda xavotir olmay qo'ydim. Chunki, mening nazarimda, Sulton Mahmud aql-farosatli hukmdor, u xotin kishi bilan jangga kirishni o'ziga ep ko'rmasa kerak. Shu narsa ma'lumki, sherning erkagigina emas, urg'ochisi ham xavflidir. Agar u bizga hujum qilmoqqa qaror qilsa, u vaqtda Xudo biladi, men jangdan qochmayman. Ikkisidan biri bo'ladi: yo g'alaba men tomonda bo'ladi, yoki men yengilaman. Agar g'alaba menga nasib etsa, u vaqtda butun dunyoga elchilar jo'natib, yuzlab hukmdorlarni qo'l ostida saqlagan Sulton Mahmudni men yengdim, deb mag'rurona jar solaman. Butun dunyo muarrixlari Sulton Mahmud xotin hukmdordan yengilganligi haqida tarix yozadilar, uning nomi tarix sahnasidan yo'qoladi, unga bundan ortiq uyat bo'lmaydi.
Agar Sulton meni yengsa, unga shuhrat kelmaydi, chunki hech qaysi shoir yoki tarixchi Sulton Mahmud xotin hukmdorning mamlakatini bosib oldi, deb maqtamaydilar». Sayida Xotunning dono va dadil fikrlarini tushungan Sulton Mahmud to bu ayol vafotigacha biror marotaba ham Rayga hujum qilmaydi.
Sayida Xotun 29 yil davomida shahzoda bilan birga hukmronlik qildi. Shundan so'nggina Sulton Mahmud Rayga qo'shin tortib, 1029-yilda uni o'z hukmronligiga o'tkazdi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: Mahmud G'aznaviyning mamlakat obodonchiligi va madaniy hayotidagi islohotlari haqida ma'lumot bering.
JAVOB: Mahmud G'aznaviy Hindiston va boshqa yurtlardan olib kelingan o'ljalarni ko'p hollarda obodonchilik hamda qurilish ishlariga sarflagan. Jumladan, u G'aznada ilk davlat madrasasini ochib, unga noyob qo'lyozmalarni to'platgan.
Bundan tashqari jome masjidi, ulkan suv to'g'oni va yana necha-necha inshootlar barpo еttiradi.
G'azna tez orada Sharqning eng go'zal va obod shaharlaridan biriga aylanadi.
Aby Rayhon Beruniy G'azna haqida gapirganda, bu shaharda hashamatli saroylar, madrasa va bozorlar ko'pligini qayd etgan edi.
Sulton Balx va Nishopurda ham bir qator qurilish ishlarini amalga oshirgan.
Shuningdek, sulton ilm-fan va madaniyat arboblariga ham homiylik qilgan.
Mahmud G'aznaviyning o'zi turkiy, arab, fors tillarini mukammal bilgan, she'riyatdan xabardor bo'lgan.
Uning saroyida Abulhasan Farruxiy, Abdulmajid Sanoiy, Unsuriy, Manuchehriy, Utbiy, Gardiziy, Bayhaqiy va shu singari shoir, tarixchilar ham faoliyat ko'rsatishgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: Mahmud G'aznaviy va Abu Rayhon Beruniy haqida ma'lumot bering.
JAVOB: Beruniyning eng sara asarlari ham G'aznada dunyoga kelgan.
U sulton bilan ko'pgina yurishlarda ishtirok etgan.
Beruniy bilan sulton o'rtasidagi munosabat iliq bo'lgan. Olim Mahmud G'aznaviy vafotidan (1030) keyin ham G'aznada to umrining oxirigacha, ya'ni 1048-yilga qadar yashab qolgan.
U G'aznada rasadxona ochib, shogirdlariga dars bergan, unumli ijod qilgan.
Mahmud G'aznaviy otasi Sabuktegin yozib qoldirgan: «Ma'naviy ulug'vorlik bamisoli alanga va shamol, bularning harakat va parvoz xususiyati bor. Maishat еsa qiya yerdagi qum uyumiga o'xshash. Uning tubanlikka surilish xosiyati bor», — degan nasihatiga amal qilib, ilm-fan sohasiga katta e'tibor qaratgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: Mahmud G'aznaviy va Abu Ali Ibn Sino haqida ma'lumot bering.
JAVOB: Mahmud G'aznaviy buyuk olim Abu Ali Ibn Sinoning ham o'z saroyida xizmat qilishini xohlagan.
O'z vaqtida xorazmshoh Ma'mundan boshqa olimlar qatorida uni G'aznaga yuborishini talab qilgan. Shu bois Gurganjga elchilarni ham jo'natgan edi.
Lekin, Masihiy va Ibn Sino Sulton Mahmud G'aznaviy saroyida xizmat qilishni istamay, Xorazmdan chiqib ketishga qaror qilishadi.
Mahmud G'aznaviy Ibn Sinoni o'z saroyiga jalb еtishga ko'p uringan, hatto uning siymosini qog'ozga ko'chirtirib, qanday qilib bo'lmasin, uni topib keltirishga farmon bergan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: Mahmud G'aznaviy va Firdavsiy haqida ma'lumot bering.
JAVOB: Sulton Mahmud G'aznaviy Abul Qosim ismli fors shoiriga Firdavsiy taxallusini bergan.
Sulton avval Firdavsiyga ijobiy munosabatda bo'lgan. Lekin, shoir ijodi uchun munosib haq olmaganligini ro'kach qilib, berilgan 60 000 kumush dirhamni aholiga tarqatish orqali hurmatsizlik ko'rsatgach, sulton bundan qattiq g'azablanadi va uni o'limga hukm qiladi.
Ammo keyinchalik ko'ngli yumshab, hukmni bekor qiladi va shoirning shahardan chiqib ketishiga ruxsat beradi.
Firdavsiyning turkiy xalqlar borasidagi ba'zi salbiy qarashlari ham sultonga maqbul bo'lmagan.
Shoir Tusga yo'l oladi.
Firdavsiy saldan keyin sultonni hajv tig'iga olgan baytlar yoza boshlaydi. Bu esa Mahmud G'aznaviy nomining keyinchalik ham Firdavsiy ijodida salbiy ohangda tilga olinishiga zamin hozirlaydi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: G'aznaviylar davlatida boshqaruv tizimi haqida ma'lumot bering.
JAVOB: G'aznaviylar davlatida boshqaruv tizimi o'zining murakkabligi bilan diqqatni jalb etadi.
Boshqaruv tizimining markazida dargoh va devonlar (vazirliklar) turgan.
Dargohga oliy hukmdor faoliyati bilan bog'liq xizmatlar va amallar kirgan.
G'aznaviylar davrida hojiblik xizmatining o'rni alohida e'tiborga loyiq.
Hojiblikning quyidagi shakllari bo'lgan: ulug' hojib, saroy hojibi, navbatchi hojib, hojib-jomador.
Ulug' hojib nafaqat hojiblar orasida, balki butun mamlakat hayotida katta mavqega ega bo'lgan.
Mahmud G'aznaviydan so'ng bevosita hokimiyat ishlarini qo'lga olgan ulug' hojib Ali Qarib ismli shaxs bo'lgan.
Rasmiy marosimlar, turli tadbirlarda ulug' hojib hukmdorga eng yaqin joyda turgan.
Janglarda ham unga qo'shinning eng salmoqli va mas'uliyatli qismiga boshchilik qilish vazifasi yuklatilgan.
Dargoh faoliyatida sipohdor (saroy xizmatchisi), davotdor (oliy hukmdorning hujjatlarini yurituvchi), pardador (mahram; xufiya ishlarni bajaruvchi), martabador (saroydagi o'rta amaldor), xazinachi, joma xona va farrosh kabi mansab va xizmatlarning o'rni katta bo'lgan.
Devonlar ijroiya idoralari bo'lib, o'sha davr manbalarida 5 ta devon nomi uchraydi. Ular vazir devoni (bosh vazir devoni), harbiy ishlar devoni, elchilik va boshqa rasmiy tadbirlarni yuritish devoni, moliya devoni, xat-xabar devoni.
Viloyat boshlig'i voliy deyilgan. Uni oliy hukmdor tayinlagan.
Viloyatlardagi boshqaruv ishlarini amid olib borgan.
Shahar boshlig'i rais deb atalgan. Shahar miqyosida kutvol, sohibi devon kabi amaldorlar ham faoliyat ko'rsatganlar.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar
SAVOL: G'aznaviylar davlati harbiy ish haqida ma'lumot bering.
JAVOB: G'aznaviylar davlati qudratli harbiy qo'shinga ega edi.
Oliy qo'mondonlik hukmdorning ixtiyorida bo'lgan.
Bosh qo'mondon – sipohsolor esa sulolaning eng ishonchli vakili yoxud shu xonadon a'zosi hisoblangan.
Masalan, Mahmud G'aznaviy sipohsolor mansabiga ukasi Muhammad Yusufni loyiq topgan.
Yuqori darajadagi harbiy lashkarboshilar salor, o'rta darajadagilari sarhang deyilgan.
Harbiylar o'z xat-xabar va qozilik xizmatlariga ega bo'lgan.
G'aznaviylar qo'shinida harbiy kemalar ham mavjud edi.
G'aznaviylar davrida ichki va tashqi savdo-sotiq aloqalari ancha rivoj topdi.
Shaharlarda hunarmandchilik sohalari, qurilish, binokorlik, ganchkorlik va boshqalar taraqqiy еtdi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 28-29-mavzular, 100-107-betlar

MAVZU: 7-sinf · 30-31-mavzular: Qoraxoniylar. (108-111-betlar)
SAVOL: Qoraxoniylar davlatining vujudga kelishi haqida ma'lumot bering.
JAVOB: Hukmronlik yillari: X asr o'rtalari – 1141-yillari.
Asoschisi: Abdullarim Sotuk Bug'roxon (859-955). Ibrohim Boritegin,
Hukmdorlari: Bilgakul, Abdullarim Sotuk Bug'roxon (859-955), Horun Bug'roxon, Nasr Eloqxon, Ibrohim Nasr
Poytaxtlari: Bolasog'un, Qoshg'ar (Sharqiy qoraxoniylar), Samarqand (Movaronnahrdagi Qoraxoniylar)
Hududi: Sharqiy Turkiston, Yettisuv va Tyanshanning janubiy yonbag'rida tashkil topgan.
X asrning ikkinchi yarmiga kelib ichki ziddiyatlarning kuchayishi va keskinlashuvi natijasida Somoniylar davlati kuchsizlana boshlaydi.
Yettisuv va Qoshg'arda X asrning ikkinchi yarmiga kelib, chig'il, yag'mo kabi turkiy qabilalar o'zlarining kuchli davlatlarini tuzishga muvaffaq bo'lgan edilar.
Shu davrda Isfijob (Sayram) hokimi Bilgakul o'zini xoqon deb atab, oliy hukmronlikka da'vo bilan chiqdi.
Lekin Somoniylar Isfijobni zabt etishdi. Ismoil Somoniy Tarozni egallaganidan so'ng turkiy qabilalar G'arbiy Qoshg'ar yerlari tomonga chekinishga majbur bo'lishdi.
Bilgakulning «qora» degan laqabi bo'lgan. Tarixchilar qoraxoniylarning nomi Bilgakulga nisbatan «qoraxon» deyilsa kerak, deb taxmin qiladilar.
Sotuq Bug'roxon hukmronligi davrida Qoraxoniylar sulolasi islomni qabul qilgan.
Butun Tyan-Shan va Yettisuvni egallab bo'lgandan so'ng, qoraxoniylar Somoniylar davlati tarkibida bo'lgan Movarounnahrga ham harbiy yurishlar uyushtiradilar.
Ular tez orada Farg'ona va Isfijobni bosib olishga erishadilar. Ular somoniylarga tegishli bo'lgan mulklarning kattagina qismini, xususan, Samarqand va Buxoroni ham egallaydi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 30-31-mavzular, 108-111-betlar
SAVOL: Qoraxoniy hukndor Ibrohim Nasr haqida ma'lumot bering.
JAVOB: Qoraxoniy Ibrohim Nasr 1066-yili Samarqanddagi bir shifoxona ixtiyoriga butun imoratlari, rastalari bilan ikki karvonsaroyni in'om-hadya (vaqf) etgan.
Ana shu ikki karvonsaroydan keladigan daromaddan kasallarning oziq-ovqati, dori-darmoni, tabiblar, barcha turdagi xizmat ko'rsatuvchilarni tegishli maosh bilan ta'minlash yo'lida foydalanilgan.
Boshqa bir hujjatga ko'ra, Samarqandda bunyod etilgan madrasa majmuyini ta'minlash uchun Ibrohim Nasr uch mehmonxona, bir karvonsaroy, bir erkaklar hammomi, suv ayirgich, uzumzor, bir qancha ekin yerlari va boshqalardan keladigan daromadni vaqf qilib bergan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 30-31-mavzular, 108-111-betlar
SAVOL: Qoraxoniylar davlati hududining kengayib borishi haqida ma'lumot bering.
JAVOB: X asr oxirida Somoniylar davlati o'rniga ikkita yangi davlat: Qoshg'ardan Amudaryogacha – Qoraxoniylar, Shimoliy Hindistondan Kasbiy dengizi janubigacha – G'aznaviylar davlati vujudga keladi.
X asr ikkinchi yarmi davomidagi sa'y-harakatlar natijasida qoraxoniylar sharqiy yo'nalishda Balxash ko'li — Cherchen daryosigacha (Sharqiy Turkiston) bo'lgan yerlarni bo'ysundirishga muvaffaq bo'lishdi.
G'arbiy yo'nalishda esa Isfijob, O'zgand, Murg'ob daryosi quyi oqimlarigacha bo'lgan hududlarni ular o'z ta'sir doiralariga kiritib oladilar.
1005-yildan qoraxoniylar Buxoro, Samarqand va Amudaryogacha bo'lgan hududlarni o'z tasarruflariga kiritadilar. Qoraxoniylarning Turondagi hukmronligi 200 yilga yaqin davom etadi.
Yettisuv viloyatida yuksalishni boshlagan qoraxoniylar janub, g'arb yo'nalishlarida o'z hukmronlik doiralarini kengaytirib borganlar va buning natijasida Cherchen daryosidan Xorazmgacha bo'lgan hududni boshqarganlar.
Siyosiy markaz sifatida esa o'z tarixiy makonlaridagi katta shaharlardan bo'lmish Bolosog'un va nisbatan undan uzoqda bo'lmagan Qoshg'arni tanlaganlar.
Buxoro, Samarqand, Chag'oniyon, Farg'ona va boshqalar tabiiy ravishda yangi siyosiy markazga nisbatan viloyat (mulk) o'rnida bo'lgan.
Qoraxoniylar davlati shartli ravishda Sharqiy va G'arbiy qismlarga ham bo'lingan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 30-31-mavzular, 108-111-betlar
SAVOL: Qoraxoniylar va G'aznaviylar munosabatlari haqida ma'lumot bering.
JAVOB: Qoraxoniylar do'stona munosabatlar o'rnatish tarafdori ekanligini bildirib, qo'shnisi g'aznaviylar bilan elchilik aloqalarini o'rnatadi. Ammo, bunday munosabatlar uzoqqa cho'zilmadi.
Qoraxoniylar g'aznaviylar tasarrufidagi hududlarga bir necha marotaba bosqinchilik hujumlarini uyushtiradilar. Lekin bu yurishlar muvaffaqiyatsizlik bilan tugaydi.
1008-yilda Mahmud G'aznaviyning o'zi 500 ta jangga o'rgatilgan fillarga ega bo'lgan katta qo'shin bilan qoraxoniylarga qarshi chiqadi va ularning qo'shinini butunlay yakson qiladi. Shundan keyin qoraxoniylar Xurosonga harbiy yurish uyushtirishga boshqa jur'at etmaydi.
Termiz, Qabodiyon, Xuttalon kabi Amudaryodan shimoldagi yerlar g'aznaviylar tasarrufida qoladi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 30-31-mavzular, 108-111-betlar
SAVOL: Qoraxoniylar davlarida davlat boshqaruvi haqida ma'lumot bering.
JAVOB: Qoraxoniylar somoniylarning o'rnini olishlari bilan markazlashgan davlat tizimiga zarba berildi, boshqaruvda mulkchilik (ya'ni, qo'l ostidagi viloyatlarni sulola namoyandalariga bo'lib berish) shakli joriy qilindi.
Markazdagi boshqaruv tizimi ikki idora: dargoh va devonlardan iborat bo'lgan.
Oliy hukmdor o'ziga tobe bo'lgan viloyat va shaharlarga hukmdor sulola namoyandalarini tayinlab, bu bilan, tabiiy ravishda, butun mamlakat uzra o'z siyosatini yurgizishni maqsad qilib qo'ygan.
Viloyat (mulk)larni takinlar boshqargan. Ular mustaqil siyosat yuritishga ham intilgan.
Davlatni odatda «qoraxon» unvoni bilan ulug'langan «buyuk xon» boshqargan.
Xonlik taxtiga og'a-inichilik udumi asosida sulolaning eng yoshi ulug' kishisi o'tirgan. Xonlar «qoraxon» unvoni bilan birga, tavg'achxon, arslonxon, bug'roxon kabi faxriy unvonlar bilan ham ulug'langan.
«Takin» (tegin) atamasi dastlab qadim turkiylarda xoqon vorisi, valiahdiga nisbatan qo'llanilib, keyinchalik harbiy lashkarboshilar unvoni sifatida ham ishlatilgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 30-31-mavzular, 108-111-betlar
SAVOL: Qoraxoniylar davlatining ikkiga bo'linib ketishi va G'arbiy Qoraxoniylarning davlat boshqaruvi haqida ma'lumot bering.
JAVOB: XI asrning uchinchi choragida qoraxoniylar siyosiy birligi ikkiga: g'arbiy (Samarqand, Buxoro, Xuttalon, Chag'oniyon) va sharqiy (Yettisuv, Sharqiy Turkiston) xoqonliklarga bo'linib ketadi.
Qoraxoniylar davlati. G'arbiy – Samarqand, Buxoro, Xuttalon, Chaga'niyon, Choch-Iloq. Sharqiy – Yettisuv, Sharqiy Turkiston.
Qoraxoniylarning Movarounnahrga hukmronlik qilgan vakillari markazga bo'ysunishdan bosh tortib, mustaqil siyosat yurgiza boshlaganlar.
G'arbiy xoqonlikda somoniylar davrida mavjud bo'lgan boshqaruv tizimi (bosh vazir, moliya ishlari, davlat rasmiy hujjatlarini ishlab chiqish, soqchilar boshlig'i, xat-xabarlar, saroy ish boshqaruvchisi, muhtasib, vaqflar, qozilik ishlari devonlari) saqlanib qolgan.
Shuningdek, viloyat boshliqlarini hokim, shahar boshlig'ini rais, deb atash odati ham o'zgarmay qolgan.
Qoraxoniyar davrida ham markazdagi (dargohdagi) boshqaruv tizimiga katta e'tibor berilgan. Bunda dargoh, ya'ni oliy hukmdor bilan viloyatlar, fuqarolar o'rtasidagi munosabatlarni uyg'unlashtirib turuvchi hojiblar faoliyati alohida o'rin tutgan.
Somoniylardan farqli ravishda qoraxoniylar davrida hojiblar, asosan, oliy hukmdor, viloyat hokimlarining davlat va raiyat ishlari bo'yicha eng yaqin maslahatchilari hisoblanganlar.
Yusuf Xos Hojib va Mahmud Qoshg'ariyga qoraxoniylar tomonidan «xos hojib» unvoni berilgan.

JAVOB: Temirchilik, kulolchilik, shishasozlik, zargarlik, to'qimachilik, ko'nchilik, suyaktaroshlik kabi o'ttizdan ortiq sohalar rivojlanib borgan. Masalan, shishasozlikda shishadan ishlangan buyumlar (oshxona buyumlari, jihozlari, bezakli taqinchoqlar, siyohdon, tuvak va boshqalar) ga turli rangda jilo berish urf bo'lgan.

MAVZU: 7-sinf · 32-33-mavzular: Saljuqiylar. (118-124-betlar)
SAVOL: Saljuqiylarning kelib chiqishi haqida ma'lumot bering.
JAVOB: Hukmronlik yillari: 1038-1308-yillar.
Asoschisi: Saljuqbekning nabirasi Sulton To'g'rulbek.
Hukmdorlari: Sulton To'g'rulbek, Alp Arslon(1063-1072), Sulton Malikshoh(1072-1092), Sulton Sanjar, Ahmad Sanjar.
Hududi: Xuroson, Yaqin va O'rta Sharq, Kichik Osiyo, qisman Movarounnahr.
Saljuqiylar turkiy o'guz qavmi tarkibida dastlab hozirgi Janubiy Qozog'iston hududiga to'g'ri keladigan yaylovlarda, Sirdaryoning o'rta oqimidagi yerlarda ko'chmanchi hayot kechirganlar.
X asrda Saljuq ismli shaxs o'zining fazilatlari, bilimdonligi, abjirligi va mardligi tufayli obro'-e'tibor qozonib, bir qancha qabilalar sardori, katta harbiy kuch boshlig'i darajasiga erishadi.
Mahmud G'aznaviyning roziligi va bir necha shartlar bilan saljuqiy oilalari Xurosonga qadam bosadilar. Keyinchalik, 1040-yilda saljuqiylar va g'aznaviylar o'rtasida Dandanaqonda to'qnashuv bo'ladi. Bu to'qnashuvda g'aznaviylar mag'lubiyatga uchraydilar.

SAVOL: Saljuqiylarning harbiy yurishlari va mamlakat sarhadlarining kengayib borishi haqida ma'lumot bering.
JAVOB: XI asrning 40-yillarida saljuqiylar Xorazm, Eron, Kavkazortiga harbiy yurishlar uyushtiradilar va bu hududlarni o'z ta'sir doiralariga o'tkazadilar.
Ular xalifalik poytaxti Bag'dodni egallaydilar.
Saljuqiy hukmdor Sulton Alp Arslon Kichik Osiyoda Vizantiya podshosi Roman IV Diogenni yengadi. Bu o'z o'rnida saljuqiylarning Kichik Osiyo va Yaqin Sharqda mustahkam o'rnashib olishlari uchun katta zamin yaratadi.
Saljuqiy Sulton Malikshoh zamonida Samarqand, Buxoro, Farg'ona saljuqiylar qo'l ostida birlashadi.
Sharqiy Turkistondagi qoraxoniylar ham saljuqiylar ustunligini tan oladi.
Sulton Malikshoh hukmronligi davrida Saljuqiylar saltanati Sharqiy Turkistondan O'rta dengizgacha bo'lgan hududni o'z ichiga olgan.
Saljuqiylar davlatining eng yuksalgan davrida Bag'dod xalifasi Sulton Tug'rulbekga «Malik al-Mashriq», ya'ni «Sharq hukmdori» hamda «Rukn ad-din» — «din suyanchig'i» degan nom bergan.
Saljuqiylar saltanatining zaiflashib parchalanishi jarayoni esa, XI asrning ikkinchi yarmida boshlanadi.
Oqibatda bu davrda saljuqiylar xonadoni vakillari faoliyati bilan bog'liq Suriya, Iroq, Onado'li (Kunya), Kirmon sultonliklari yuzaga keladi.

JAVOB: XII asr boshlaridayoq saltanat sharqiy va g'arbiy qismlarga bo'linib ketadi.
Sharqiy saljuqiylar: Xuroson va Movarounnahrdan iborat bo'lgan.
G'arbiy saljuqiylar: Eron, Iroq va Ozorbayjon.
Sulton Sanjar qudrati avjiga chiqqan vaqtlarda g'arbiy saljuqiylar (Eron, Iroq, Ozarbayjon) uning, ya'ni sharqiy saljuqiylarning siyosiy ta'sirida bo'lganlar.
Movarounnahrga qoraxitoylarning sharqdan bostirib kirishi natijasida Sulton Sanjarning ham kuchi qirqildi.
Qoraxitoylarga qarshi saljuqiylar qoraxoniylar bilan birgalikda lashkar tortgan bo'lsa-da, ammo mag'lubiyatga uchraydi.
Bu o'z o'rnida saljuqiylarga qaram bo'lgan Xorazmning yuksalishi uchun sharoit yaratadi.
Xorazmshohlar (anushteginiylar) XII asrning ikkinchi yarmida g'arbiy saljuqiylarga zarba beradilar.
Sharqiy saljuqiylar faoliyatiga esa Sulton Sanjar o'limidan keyin chek qo'yiladi.

SAVOL: Saljuqiylar bosh vaziri Nuzomulmulk haqida ma'lumot bering.
JAVOB: Xalq orasida va tarixda Nizomulmulk (mulk – davlatning tartibotchisi) nomi bilan mashhur bo'lgan saljuqiylarning mashhur vaziri Abu Ali Xasan ibn at-Tusiydir.
Nizomulmulk Saljuqiy shohlar davrida ishni oddiy amaldorlikdan boshlab, vazir darajasiga erishgan va ko'p yillar davomida davlatga xizmat qilgan.
«Temur tuzuklari»da har qanday podshoh, xalq orzu qilgulik aql-zakovat, valine'mat sohiblari bo'lmish vazirlar to'g'risida so'z yuritilganda «Siyosatnoma» muallifi Nizomulmulkni alohida mehr-muhabbat bilan, har jihatdan namuna qilib ko'rsatadi. Bunday «qilich va qalam sohibi» bo'lmish vazirlarni e'zozlashga, qadrlashga da'vat etiladi.
Nizomulmulk tomonidan yozilgan «Siyosatnoma» yoki «Siyar ulmuluk» (Podshohlarning turmush tarzi) nomli asar mazkur davlat boshqaruvining asosiy qoidalarini hamda huquqiy masalalarini o'rganishda muhim manba hisoblanadi.
Asar xuddi qissadan hissa, ya'ni hikoya va undan chiqarilishi lozim bo'lgan xulosalar tarzida tuzilgan.
Nizomulmulk vazirlik davrida Bag'dod, Basra, Isfahonda «Nizomiya» nomidagi madrasalar qurdiradi.
Buyuk olim Abu Homid G'azzoliy o'z vaqtida Bag'doddagi madrasada dars bergan.
Shuningdek, Nizomulmulk davrida taniqli astronom Umar Xayyom shamsiy taqvim – kalendarni isloh etish uchun tuzilgan ishchi guruhga rahbarlikka taklif qilinadi.
Umar Xayyom bu ishni bajarib, devonning ilmiy va davlat ishlarida Nizomulmulk bilan birga faoliyat olib boradi.

SAVOL: Nuzomulmulkning "Siyosatnoma" asari va undagi davlat boshqaruvi masalalari haqida ma'lumot bering.
JAVOB: «Podshohning bir haftada ikki kun zulm ko'rganlarni qabul qilmasdan iloji yo'q.
U zulmkorni jazolamog'i, insofga chaqirmog'i, raiyat so'zlarini o'z qulog'i bilan vositachisiz eshitmog'i kerak.
Arzchilar eng muhim so'zlarini aytmoqlari, (hukmdor esa) ular bo'yicha hukm chiqarmog'i lozim. Shunda mamlakatda podshoh ezilgan va adl istovchilarni haftada ikki kun qabul qilib, ularning so'zini tinglar ekan, ovozasi tarqaydi.
Zolimlar bundan cho'chiydilar, qullarini kaltaklamaydilar».
«Siyosatnoma» asarida davlat boshqaruviga aloqador aksariyat qoida va qonunlar, usul va vositalar, turli darajadagi davlat idoralari haqida so'z yuritiladi.
Asarning asosiy g'oyasi shundan iboratki, davlatni oqilona boshqarish, unda qat'iy qoida va tartib o'rnatishga, amaldorlarni vijdonli, pok, halol va iymonli bo'lishga, mamlakat obodonligi, uning ahli farovonligi, tinchlik va totuvligini ta'minlash uchun harakat qilishga da'vat qiladi.
Aynan davlat masalasi bu asarning asosiy g'oyasini tashkil qiladi.
«Siyosatnoma» asari yaratilgan davrdan boshlab olimlar, tarixchilar, adiblar, eng asosiysi, shoh-u hokimlar diqqatini o'ziga tortib keladi.
Bu asarni sultonlar va mansabdor shaxslar ko'chirtirib olib, o'z faoliyatlarida foydalanganlar.
«Siyosatnoma»ning eng qadimgi nusxasi Erondagi Tebriz Milliy kutubxonasida saqlanadi.

Saljuqiylar davrida ham chek, naqd pulsiz muomala qilish tizimidan foydalanilgan.

MAVZU: 7-sinf · 34-35-mavzular: Xorazmshohlkar davlati va uning yuksalishi. (125-129-betlar)
SAVOL: Anushteginiylarning hokimiyat tepasiga kelishi haqida ma'lumot bering.
JAVOB: Hukmronlik yillari: 1097-1231-yillar.
Asoschisi: Qutbiddin Muhammad.
Hukmdorlari: Anushtegin, Qutbiddin Muhammad(1097-1127), Otsiz(1127-1156), Elarslon(1156-1172), Sultonshoh Mahmud(1172), Takash(1172-1200), Alovuddin Muhammad(1200-1220), Jaloliddin Manguberdi(1221-1231).
Hududi: XIII asr boshida shimoli g'arbiy va g'arbiy chegarasi Orol va Kaspiy dengizi sohillaridan, janubi g'arbda Iroqqa qadar, janubi sharqiy hududlari G'azna viloyatidan, shimoliy sharqiy chegarasiYettisuv va Dashti Qipchoqdan o'tar edi.
Poytaxtlari: Gurganj, Samarqand.
Xorazm vohasida hukmronlik qilgan mahalliy sulolalar qadimdan xorazmshohlar umumiy nomi bilan yuritib kelingan. Masalan, afrig'iylar, ma'muniylar, oltintoshiylar boshqaruv kursisida xorazmshohlar unvoni bilan o'tirganlar.
Ammo Xorazm doirasidan tashqariga chiqib, boshqaruvning saltanat darajasiga erishgan sulola bu — anushteginiylar hisoblanadi.
Anushtegin saljuqiy Sulton Malikshohning ko'zga ko'ringan va ishonchli mansabdorlaridan sanalgan.

1097-yili esa, mazkur lavozim o'g'li Qutbiddin Muhammadga tegadi. U saljuqiylar dargohiga qaram bo'lib, har yili o'zi yoki o'g'li Otsiz orqali viloyatdan undiriladigan soliqni poytaxt Marvga olib borib turardi.

SAVOL: Anushteginiylar davlati Otsiz hukmronligi davrida haqida ma'lumot bering.
JAVOB: Otsiz esa otasidan keyin Sulton Sanjar hukmi bilan Xorazm hokimligiga tayinlanadi.
Bu vaqtda o'ttizga ham kirmagan Otsiz avvaliga otasi kabi saljuqiylar xonadoniga sidqidildan xizmat qiladi.
Ammo u o'z mavqeyi mustahkamlanib va, aksincha, raqobatchilari zaiflasha borayotganini sezgach, saljuqiylarga qaramlikdan bosh torta boshlaydi.
Bunga javoban Sulton Sanjar unga qarshi bir necha marta qo'shin yuboradi.
Mag'lubiyatga uchragan Otsiz qochishga majbur bo'ladi. Gurganch Xorazm saltanatining birinchi va asosiy poytaxti bo'lgan.
Xorazmni qo'lga kiritganidan keyin Sulton Sanjar uni Otsizning jiyani Sulaymonshoh boshqaruviga ergan. Biroq Sulaymonshoh u yerda o'z hokimiyatini mustahkamlay olmagan. U Marvga qaytib ketishi bilanoq Xorazmga kelgan Otsiz mahalliy aholining qo'llab-quvvatlashi orqali o'z hokimiyatini tiklagan.
Otsiz Buxoroni egallaydi.
U Bag'dod xalifasidan «Xorazm viloyati va u tomonidan Xorazmga qo'shib olingan hamda olinadigan g'arbiy, sharqiy chegaralardagi viloyatlarning hukmdori», deb tan olingan yorliq oladi.
Otsiz Marv, Nishopurni ham o'zining tasarrufiga o'tkazadi.
Otsiz o'zining ismi bitilgan oltin tangalarni zarb qilishni boshlab yuboradi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 34-35-mavzular, 125-129-betlar
SAVOL: Tarixchilar Otamalik Juvayniy, Rashiduddin va Hofizi Abro'larning asarlarida Anushteginiylar haqida ma'lumot bering.
JAVOB: «O'zaro sulh shartnomasiga ko'ra, xorazmshoh Otsiz Sulton Sanjarga tobelik bildirib, o'rta asrlar odatiga ko'ra, uning oyog'i ostidagi yerni o'pib, ta'zim еtishi shart edi. Lekin xorazmshoh bu kabi tobelik urfini bajarmadi.
Sulton Sanjar huzuriga mulozimatga (xizmatga) keldi va otidan tushmagan holda sultonga salom berdi.
Bu ham yеtmagandek, xorazmshoh sulton bilan uchrashuv joyini birinchi bo'lib tark еtdi.
Sulton Sanjar Otsizning bu «beodobligidan» jahli chiqsa ham, yaqinda o'zi unga shafqat-muruvvat qilgani uchun ahdini o'zgartirdi. Sulton bunga norozilik bildirmay, Marvga qaytib ketdi». Tarixchi Otamalik Juvayniy.
Tarixchilardan Rashiduddin va Hofizi Abro'larning yozishiga ko'ra, Anushteginiylar sulolasining asoschisi Anushtegin dastlabki faoliyatini Sulton Jaloliddin Malikshoh I saroyidan boshlagan.
U sultonning eng ishonchli kishilaridan biriga aylangan. Keyinchalik, u «Xorazm mutasarrufi» mansabiga tayinlanib, unga Xorazm shixnasi (qal'a boshlig'i) unvoni beriladi. Vaqt o'tib, Anushteginning o'g'li Qutbiddin Muhammad Xorazm hokimi bo'ladi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 34-35-mavzular, 125-129-betlar
SAVOL: Anushteginiylar davlati El Arslon, Takash va Muhammad Xorazmshohlar hukmronligi davrida haqida ma'lumot bering.
JAVOB: Otsiz o'limidan so'ng taxtga chiqqan o'g'li El Arslon ham mustaqil siyosat yurgizishga harakat qildi.
El Arslon Movarounnahrda qoraxitoylar bilan to'qnashadi va qo'li baland keladi.
U Nishopurni egallab, Ozarbayjonga harbiy yurish uyushtiradi.
Lekin El Arslonga ham markazida Xorazm bo'lgan, barcha tomonidan tan olingan qudratli siyosiy uyushmaga asos solish nasib etmagan.
El Arslonning vafotidan so'ng uning o'g'illari Takash (1172-1200) va Sultonshoh Mahmud o'rtasida o'zaro kurash kechadi. Faqat Sultonshoh Mahmud vafotidan so'nggina Takash yakka hukmdor sifatida keng qamrovli siyosat yuritish imkoniga ega bo'ladi.
Takash G'arbiy Eronning ayrim qismini hamda Kirmonni bo'ysundiradi.
Hukmronligi so'nggida u hatto Bag'dodni – xalifalik poytaxtini zabt etishga ham shaylanadi. Ammo yurish chog'ida vafot etadi va taxtga Alovuddin Muhammad (1200-1220) chiqadi.
Alovuddin Muhammad Movarounnahrdan qoraxitoylarni haydab chiqaradi. Bu voqea uning obro'-e'tiborini nihoyatda oshirib yuboradi.
Ozarbayjon, Eron, Xurosondan Hindistongacha bo'lgan yerlar xorazmshohlar tasarrufiga olinadi.
Sulton Muhammadning asosiy maqsadi Suriya, Kichik Osiyo va Misrni ham bo'ysundirish edi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 34-35-mavzular, 125-129-betlar
SAVOL: Xorazmda Anushteginiylar hukmronligi davrida harbiy ish haqida ma'lumot bering.
JAVOB: Xorazmshoh o'z davlatida majburiy umumxalq harbiy ta'lim tizimini joriy qilgan.
Davlatdagi harbiy qo'shin soni davr va yurishlarga qarab o'zgarib turgan. Masalan, xorazmshoh Takash qo'shinida 170 ming nafar otliq askar bo'lgan.
Xorazmshoh Muhammadning Fors Iroqi, Ozarbayjonga qilgan yurishida 100 ming nafar suvoriy bo'lgan.
Qoraxitoylarga qarshi qilingan yurishlarda xorazmshoh Muhammad otliq askarlari sonining o'zi 400 ming nafar bo'lgan.
Muhammad xorazmshoh 400 ming atrofidagi o'z qo'shinini Bag'dod yurishiga jo'natdi. Xorazmshoh qo'shini Hulvon viloyatiga yetganida g'ayritabiiy hodisa yuz beradi. To'satdan havo sovib, uch kecha-yu uch kunduz qor yog'di, izg'irin sovuq hammayoqni qamrab oldi. Jangchilar sovuqdan aziyat chekdi, otlar, tuyalarga qiron keldi. Bu ofatdan iztirobga tushgan Sulton o'z qo'shinini orqaga qaytarishga buyruq berdi.
Sulton xalifa nomini xutbadan chiqarib tashlashni buyurdi. Bu davrda anushteginiylar sulolasi dunyoning eng qudratli siyosiy kuchlaridan biriga aylangandi.
Orol dengizidan Hind okeanigacha, Iroqdan Sharqiy Turkistongacha bo'lgan ulkan hudud Xorazmshohlarga bo'ysundiriladi.
Alovuddin Muhammad – ikkinchi Iskandar, ikkinchi Sulton Sanjar laqabi bilan mashhur bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 34-35-mavzular, 125-129-betlar

MAVZU: 7-sinf · 36-37-mavzular: Xorazmshohlkar davlatining boshqaruvi va ijtimoiy-iqtisodiy hayot. (130-135-betlar)
SAVOL: Turkon Xotun kim bo'lgan?
JAVOB: Tarixchi Juvayniyning yozishicha: «Turkon xotun qang'li urug'idan bo'lgan xon Jonkishning qizi edi. Gurganch (Urganch) Turkon xotunning xos poytaxti hisoblangan, uning xos saroyi ham mavjud bo'lgan.
Tarixiy manbalarda ta'kidlanishicha, Sulton Muhammad hukmronligi davrida Turkon xotun saltanat ishlarida yetakchi mavqeni egallagan, uning farmoyishlari va maslahatlari o'g'li tomonidan so'zsiz bajarilgan.
Qipchoqlardan tashkil etilgan oliy martabali sarkardalar Turkon xotun bilan yaqin bo'lib, aksariyati saroyda Sultonga qarshi bo'lib turgan biron-bir guruhga boshchilik qilganlar.
Saltanat ishlari deyarli Turkon xotun tomonidan boshqarilgan. Ko'p hollarda Muhammad Xorazmshoh tarafidan e'lon qilingan hukm va farmoyishlar Turkon xotun tomonidan hech qanday asossiz, kengashsiz bekor qilinar edi.
Sulton onasi va haramini Mozandaronga olib ketib (mo'g'ullar hujumi davri haqida gap ketmoqda), u yerning qal'asiga bekitish uchun Xorazmga odamlarini yubordi. Turkon xotun o'g'lining buyrug'iga ko'ra harakat qildi.
Sulton oilasi va haramini olib ketayotganida askarlarni Xorazmda qoldirishdi. Harakat paytida asir qilib olingan turli mamlakatlarning podshohlarini buyruq bilan Jayhun daryosiga cho'ktirib yuborganidan so'ng bolalari, nevaralari, yaqinlarini xazinasi bilan vazir Nosiriddinning kuzatuvida Eron tomondagi Ilol (Tajan irmog'idagi hudud) qal'asiga yubordi.
Sulton ketidan ta'qib qilib Mozandaronga kelgan mo'g'ul sarkardasi Subutoy eslatilgan qal'ani qamal qilish uchun askar chaqirdi. Taqdirni qarangki, yomg'ir bulutlari o'z yuklarini ustiga to'kkan va o'sha paytgacha hech kim suv tanqisligini ko'rmagan Ilol qal'asi qurshovga olingan vaqtda yomg'ir ham ularga dushmanlik qilib, yog'may qo'ydi.
O'n besh kundan so'ng suv tugagach, og'ir ahvolda qolgan Turkon xotun boshqa haram a'zolari bilan va vazir Nosiriddin bilan pastga tushdi. Ular qal'aning tubiga borgan vaqtda yashin ustiga yashin chaqib yomg'ir yog'a boshladi. Mo'g'ul askarlari Turkon xotunni yaqinlari bilan birga Toliqonda turgan Chingizxon yoniga olib bordilar. Turkon xotun mo'g'ul davlati poytaxti bo'lgan Qoraqurumga olib ketilgan va shu yerda vafot etdi».
Sulton onasi Turkon xotunga hech qachon qarshi chiqmagan, uning gapini ikki qilmagan. Bu holatni o'sha davr tarixchisi An-Nasaviy quyidagicha izohlab, uni ikki sababga bog'lab ko'rsatgan edi: «birinchidan, onasining unga bo'lgan mehrini qadrlashi, ikkinchidan, mamlakatning barcha amirlari onasining urug'idan ekanligi».
Turkon xotun «Jahon hokimi» degan laqabga ega bo'lib, uning shaxsiy muhri (tug'ro)da: «Dunyo va uning pokdomoni, Ulug' Turkon, olam ayollarining malikasi» degan bitik yozilgan edi.
Turkon xotun poytaxt Gurganchda doimiy tarzda istiqomat qilar, o'z saroyi, ulkan mulklariga ega edi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 36-37-mavzular, 130-135-betlar
SAVOL: Anushteginiylar davlatining davlat boshqaruvi haqida ma'lumot bering.
JAVOB: Anushteginiylar davrida ham somoniylar, qoraxoniylar, g'aznaviylar, saljuqiylarda bo'lgani kabi devonlarning alohida o'rni ko'zga tashlanadi.
O'z navbatida, devonlar ham kichik devonlarga bo'lingan. Harbiy devon harbiy masalalarni ko'rish (devon jaysh) va harbiylarga maosh berish bilan shug'ullanuvchi (devon ravotib) kabilarga bo'lingan.
Harbiy devon boshlig'i, albatta, musulmon bo'lishi shart edi.
«Oliy toj faxriy majlisi» deb atalgan hukumat boshqaruvi vazirning (bosh vazirning) qo'lida bo'lgan.
Unga barcha devonlar bo'ysungan. Vazir, davlat boshlig'ining asosiy maslahatchisi hisoblangan va o'z harakatlari yuzasidan oliy hukmdorgagina hisobot bergan.
Rasmiy tantanalar, xalqaro munosabatlar, tobe mamlakatlar bilan muzokaralarda oliy hukmdor nomidan ish yuritgan.
Vazir fuqarolar va davlat hukmdori o'rtasida vositachi vazifasini bajargan hamda mamlakatdagi tartib-intizom uchun asosiy javobgar hisoblangan.
U amaldorlarni ishga tayinlash va lavozimidan bo'shatish, arzaq (nafaqa), oylik maosh hamda boshqa shu kabi to'lovlarni belgilash huquqlariga ham ega bo'lgan.
Vazirlar o'z ona tili — turkiy tildan tashqari, arab va fors tillarini mukammal bilishlari shart bo'lgan.
Sadr, dastur, xojayi buzurg kabi unvonlar bilan siylangan vazir har doim hukmdorning oldida yurgan, hukmdor safar va yurishlarga chiqqanida ham uni tark etmagan.
Rasmiy qabullar vaqtida vazirlar xorazmshohlarning o'ng tomonidan o'rin egallashgan.
«Nizom ul-mulk» unvoniga ega bo'lgan vazirlar xonaga oliy hukmdordan boshqa kim kirsa ham, hattoki u taxt vorisi bo'lgan taqdirda ham, u bilan salomlashish uchun o'rnilaridan turishmagan.
Vazirlik mansabining tilga olingan takomillashgan ko'rinishi Otsiz hukmronligi davri bilan bog'liqdir.
Chingizxon bosqini arafasida mazkur lavozim Alovuddin Muhammad tomonidan bekor qilingan va oliy hukmdor qoshida olti vakildan iborat kengashga o'xshagan boshqaruv joriy etilgan. Barcha a'zolarning roziligi bilan ish ko'rishi kerak bo'lgan ushbu kengashga davlat ahamiyatiga molik birorta ham jiddiy qaror qabul qilish nasib etmagan.
Yana bir muhim mansab – bu ulug' yoki buyuk hojib hisoblangan.
Qoidaga ko'ra, turkiy aslzodalar vakiligina hojiblikka tayinlanishi mumkin bo'lgan.
Hojib hukmdorning aynan o'ziga tegishli ishlari bo'yicha hisobot bergan, rasmiy marosimlarga
amal qilinishini nazorat qilgan.
Bir vaqtning o'zida bir necha hojib faoliyat yuritgan. Ular sultonlarning eng muhim topshiriqlarini bajarishgan va ularga hamma joyda hamrohlik qilishgan.
Saroy ishlari boshqaruvchisi sanalgan ustozdor lavozimi egasi otxonalar, oshxonalar, novvoyxonalar, chog'ir saqlanadigan yerto'lalarni nazorat qilgan, saroy xodimlari faoliyati uchun to'liq javobgar bo'lgan.
Sultonning shaxsiy otlari oxur amiri lavozimi egasining tasarrufida bo'lgan.
Bundan tashqari, amir a'lam, choshnigir (oliy hukmdorga beriladigan ovqat, ichimliklarni ta'tib ko'ruvchi), davatdor (oliy hukmdor kotibi), farrosh (oliy hukmdorga mo'ljallangan o'rin-ko'rpa, gilam, chodir va shunga o'xshashlar uchun mas'ul xizmat boshlig'i) kabi kichik mansablar ham mavjud bo'lgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 36-37-mavzular, 130-135-betlar
SAVOL: Xorazmshohlar (anushteginiylar) davlatida shaharlar haqida ma'lumot bering.
JAVOB: Poytaxt Urganch o'z davrining buyuk, boy va go'zal shahri sanalgan.
Urganch mohir hunarmandlari bilan mashhur bo'lgan, ayniqsa, temirchilar, duradgorlar o'z ishining ustalari bo'lishgan.
Urganchlik o'ymakor duradgorlar fil suyagi va obnus daraxti yog'ochidan ajoyib buyumlarni yasashgan.
Shaharda tabiiy shoyi mato ishlab chiqaradigan ustaxonalar bo'lgan.
Qurilish ishlarida esa majnuntol yog'ochidan keng foydalanilgan. Ushbu yog'ochdan qurilgan inshootlar yengil bo'lgan va toshdan qurilgan binolarga qaraganda zilzilaga chidamli hisoblangan.
Yo'llar va karvonlarni qo'riqlash ishining oliy darajada tashkil etilgani ichki va tashqi savdo aloqalarining rivojlanishida muhim rol o'ynagan.
Urganch savdogarlari Bag'dod, hattoki Andalusga qadar mahsulotlar olib borishgan.
Urganch mo'g'ullar tomonidan vayron etilguniga qadar aholi unda juda zich yashagan. Shaharda ko'plab bozorlar mavjud bo'lgan.
Bozordagi tartibni, asosan, muhtasib ushlab turgan. U mahsulotlarning sifatini, idishlarning tozaligini, mahsulotlarning yangiligini, tarozi toshlari va uzunlik o'lchovchi asboblarning to'g'riligini nazorat qilgan.
Xorazmning Ardaxushmisan, Xivak, Darg'an, Savakon, Govshfinj, Kot, Nuzkot, Hazorasp kabi kichikroq shaharlarida ham hunarmandchilik rivojlangan va savdo-sotiq gullab-yashnagan.
Marv, Buxoro, Samarqand, Ray, Nishopur kabi shaharlar mamlakat siyosiy-iqtisodiy va madaniy hayotida muhim o'rin egallagan.
Xorazmshohlarga qaram bo'lgan mulklarda ham xorazmshoh nomi bilan xutba o'qilgan va tangalar zarb etilgan.
Anushteginiylar ismi yozilgan tangalar Samarqand, Buxoro, O'tror, Termiz, Chag'oniyon, Vaxsh, Balx, Bomiyon, G'azna, G'ur, Jurzuvon, Zamindovar, Yamur, Kunduz, Marv, Niso, Nishopur, Peshovar va boshqa hududlarda zarb qilinganini aytish mumkin.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 36-37-mavzular, 130-135-betlar

MAVZU: 7-sinf · 38-mavzu: Etnik jarayonlar va o'zbek xalqining shakllanishi. (136-139-betlar)
SAVOL: Etnik jarayon haqida ma'lumot bering.
JAVOB: O'zbeklar alohida etnik birlik (elat) bo'lib, Movarounnahr, Xorazm, Yettisuv, qisman Sharqiy Turkistonning g'arbiy mintaqalarida shakllangan. Ular qadimdan o'troq yashab, sug'orma dehqonchilik, hunarmandchilik bilan shug'ullanib kelgan.
Bu hududda yashagan sug'diylar, baqtriylar, xorazmiylar, farg'onaliklar, shoshliklar, yarim chorvador qang'lar, ko'chmanchi sak-massaget kabi etnik guruhlar o'zbek xalqining etnogenezida ishtirpk etgan.
Janubiy Sibir, Oltoy, Yettisuv, Sharqiy Turkiston hamda Volga va Ural daryosi bo'ylaridan turli davrlarda Movarounnahrga kirib kelgan etnik guruh ham bu jarayonning ishtirokchilari bo'lishgan.
Yuqorida nomlari keltirilgan etnoslar asosan turkiy va sharqiy eroniy tillarda so'zlashganlar.
Etnik jarayon – kelib chiqishi bir-biriga yaqin bo'lgan turli qabila va elatlarning asrlar davomida qo'shilib borishi.
O'zbek xalqining asosini sug'diylar, baqtriylar, xorazmiylar, farg'onaliklar, shoshliklar va sak-massagetlar tashkil etgan.
Xalqlarning kelib chiqish tarixini (etnogenezini) va shakllanish jarayonini o'rganishda fanda
«etnos» (yunoncha «xalq») va «etnik birlik» iboralari qo'llaniladi.
Qang' davlati davrida turkiyzabon etnoslar ustuvorlik qilib, o'ziga xos uyg'unlashgan madaniyat yuzaga
keladi.
Arxeologik asarlarda bu madaniyat «Qovunchi madaniyati» nomini olgan.
Antropolog olimlarning ta'kidlashlaricha, aynan shu davrlarga kelib, O'rta Osiyoning vodiy va vohalarida yashovchi aholi tashqi qiyofalarida hozirgi o'zbek va voha tojiklariga xos antropologik qiyofasi to'liq shakllanadi.
O'zbeklar etnogenezida qatnashgan navbatdagi etnik guruhlar – kushonlar, xioniylar, kidariylar va eftallar, turkiy qabilalar faol ta'sir ko'rsatadi.
VII asrdan o'lkamiz «Turkiston» nomi bilan atala boshlangan.
Qang' davlati davrida "Qovunchi madaniyati" va O'rta Osiyoning antropologik qiyofasi to'liq shakllanadi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 38-mavzu, 136-139-betlar
SAVOL: O'zbek xalqining tashkil topishi haqida ma'lumot bering.
JAVOB: VIII asrdan arab va boshqa xalqlarining O'rta Osiyoga kirib kelishi mintaqadagi etnik jarayonlarga katta ta'sir etmagan.
IX asrda Movarounnahr mintaqasida yaxlit turkiy etnik qatlam, turkiy til muhiti vujudga kela boshladi va o'z navbatida sug'diylar va boshqa mahalliy etnoslarda ham turkiylashish jarayoni jadallashgan.
Qoraxoniylar davrida Movarounnahr va Xorazmda siyosiy hokimiyat turkiy sulolalarga o'tishi munosabati bilan sodir bo'lgan etnik jarayon o'zbek xalqining shakllanishida yakuniy bosqich bo'ldi.
IX-XII asrlarda o'zbek xalqi shakllandi. Uning asosini o'lkamizda yashab kelgan ziroatkor va chorvador tub yerli aholi tashkil etdi.
Movarounnahrda joylashgan aholi qadimdan ikki tilda: sug'd va turk tillarida so'zlashgan.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 38-mavzu, 136-139-betlar

MAVZU: 7-sinf · 39-40-mavzular: Mintaqada islom dinining yoyilishi. (140-146-betlar)
SAVOL: Islom dining Turonga kirib kelishi haqida ma'lumot bering.
JAVOB: Islom dinining Turonga kirib kelishi va tarqalishi bevosita arab istilolari va arablarning ko'p asrlik hukmronligi bilan bog'liq.
Mintaqada yangi siyosiy kuchning paydo bo'lishi oqibatida Turon ikki qismga bo'lindi: 1) Movarounnahr («Daryoning narigi tomoni»); 2) Arodi at-turk («Turklar yerlari», ya'ni arablarga bo'ysunmagan hukmdorlar yerlari).
Islom dinining Turonda tarqalishiga qator omillar bevosita o'z ta'sirini o'tkazdi.
Abu Muslim qo'zg'oloni davrigacha islomdan oldingi davr hukmdorlari o'z mavqelarini saqlab turdilar. Ular mahalliy aholini boshqarish va ulardan arablar uchun soliq yig'ish vazifalarini bajardilar.
Arablar ko'pgina imtiyozlarga ega edilar.
Islom dinini qabul qilgan mahalliy aholi ham jamiyatda arablar kabi imtiyozlarga ega bo'lardi.
Abu Hanifaning arab bo'lmagan musulmonlarning teng huquqli ekanligi haqidagi g'oyasi, ularning jamiyatda kamsitilishlariga qarshi sa'y-harakatining Turonda ham joriy etilishi mintaqada islom dinining keng tarqalishi uchun imkon yaratdi.
Islom dinining asosiy manbalaridan biri – hadislarning yig'ilishida buyuk vatandoshlarimiz Abu Abdulloh Buxoriy, Imom Termiziy, Hakim Termiziy, Imom Dorimiylarning xizmatlari katta bo'ldi.
Shu tufayli ham islom dinining mintaqada yoyilishi tezlashdi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 39-40-mavzular, 140-146-betlar
SAVOL: Turonda Islom dinining yoyilishi haqida ma'lumot bering.
JAVOB: IX-XII asrlarda islom dini O'rta Osiyo xalqlari davlatchiligi tarixida katta rol o'ynay boshladi. Movarounnahrda bu davr arab xalifaligidan mustaqil bo'lgan davlatlarning paydo bo'lishi va rivojlanishi davri bo'lgan.
Islom bu vaqtda Sharqda keng tarqalib, jahon dini darajasiga ko'tarildi, musulmon dunyosining mafkurasiga aylandi.
Arab tilida ilmiy asarlar yozildi.
Azaldan savodli bo'lgan, madaniyati yuqori darajaga ko'tarilgan Turon xalqi tez orada nafaqat arab tilini, balki islom ilmlarini ham chuqur o'rganib, arab tili va shariat masalalarida kitoblar yozadigan olimlarni yеtishtirib chiqara boshladi.
Shaharlarda masjid-u madrasalar qurilishiga e'tibor berila boshlandi.
Manbalarning darak berishicha, Buxoroda dastlabki madrasalar VIII-IX asrlardan boshlab barpo qilingan.
Hatto qonunshunoslar uchun ham maxsus «Faqihlar madrasasi» degan ixtisoslashtirilgan madrasa qurilgan.
Bunday bilim maskanlarida Qur'oni karim, hadis ilmi va shariat asoslari har tomonlama mukammal o'rganilgan.
O'sha davr shaharlari orasida islom dini ta'limotini chuqur targ'ib qilishda Buxoro shahri alohida o'rinni egalladi.
Yuqorida qayd qilinganidek, madrasayu, maktablarning borligi bu yerda ilohiyot fani o'yicha yirik olimlarning yеtishib chiqishiga xizmat qiladi.
Buxoro shu davrdan boshlab «Qubbatul islom» – «Islom dinining gumbazi» nomi bilan shuhrat topa boshladi. Sekin-asta islom dini markazlashgan davlatning asosiy mafkurasiga aylandi.
Tilingni yaxshi hunar bilan o'rgatgil va muloyim so'zdan boshqa narsani odat qilmagil. Nedinkim, tilga har nechuk so'zni o'rgatsang, shuni aytur, so'zni o'z joyida ishlatgil, so'z agar yaxshi bo'lsa, ammo noo'rin ishlatilsa, garchand u har nechuk yaxshi so'z bo'lsa ham yomon, nobop eshitilur. Shuning uchun behuda so'zlamagilki, foydasizdur. Bunday befoyda so'z ziyon keltirur va har so'zki undan hunar isi kelmasa, bunday so'zni gapirmaslik lozim. Kaykovus, «Qobusnoma»

SAVOL: Islom dinidagi mazhablar (Hanafiylik mazhabi) haqida ma'lumot bering.
JAVOB: Mazhab (arab. — yo'nalish, yo'l, ta'limot), shariat mazhablari — islomda diniy huquq tizimlari va yo'nalishlari.
Hanafiylik mazhabi asoschisi Abu Hanifa nomi bilan mashhur Nu'mon Sobit Kufiy (699-767) hisoblanadi. Ushbu mazhab o'z mohiyati, ta'limoti va qo'llagan uslubi bilan jamiyatda yuz berib turadigan har qanday savolga javob topishga intilgan. Ya'ni hanafiy mazhabi yangi vujudga kelgan diniy masalaning yechimini hal qilib bergan.
Abu Hanifa No'mon ibn Sobit (699, Kufa — 767, Bag'dod) — sunniy musulmonlar tomonidan hurmat bilan «Imomi A'zam» deb ataladi. Hanafiylik mazhabi sharafiga shunday nomlangan.
Faqih, muhaddis. «Abu Hanifa» uning kunyasi, «Imomi A'zam» («Ulug' imom») ulug'ligining e'tirofi uchun berilgan unvon.
Abu Hanifa og'ir vaziyatlarda odamlar uchun qulay sharoit yaratib berib, qiyinchiliklarini oson qilishga uringan.
Abu Hanifa erkinlik tamoyilining homiysi edi. Tijorat va boshqa sohalarda inson huquqi va erkinliklarini himoya qilib keldi. Masalan, turmush qurishda erkak va ayolga teng huquq berilishi, yetim bolalarning huquqlari va boshqalar.
Islom ta'limotiga ko'ra, Muhammad payg'ambar nomi zikr etilganda unga hurmat yuzasidan «sollallohu alayhi vasallam» (qisqacha: s.a.v.: «unga Allohning rahmat va salomi bo'lsin») yoki «alayhis-salom» (qisqacha: a.s.: «unga salom bo'lsin») iborasini aytish lozim hisoblangani uchun islom tarixiga oid adabiyotlarda s.a.v. yoki a.s. qisqartmasi ishlatiladi.
Imomi A'zam shu qadar go'zal xulqli inson ekanki, zamondoshlari u kishining fazilatlarini tan olib, «eng chiroyli xulq Imomi A'zamning xulqidir», deb e'tirof qilgan.
Doimo chiroyli va pokiza kiyimlarda yurgan. Shunday baland maqomga erishgan zot nihoyatda tavozeli, xokisor, kamtar bo'lgan.
U o'ziga yomonlik qilganlarni ko'rganida: «Bizlarni yomonlagan kishilarning gunohini Alloh kechirsin, bizlarni yaxshi ko'rganlarni Alloh rahmat qilsin», — deb duo qilar ekan.
Kunya — abu (arabcha «ota») so'zining izofa qaratqichli birikma holatidagi shakli. Arablar va boshqa musulmon xalqlarda ko'pchilik kunyalarning tarkibiy qismi. Masalan, Abu Ali ibn Sino, Abu Rayhon Beruniy va boshqalar. «Abu» bilan kelgan ism shaxsning otasi, «ibn» bilan kelgan ism esa shaxsning o'g'li degan ma'noni bildiradi.
Bugungi kunda Markaziy Osiyo musulmonlarining aksari hanafiylik mazhabiga ergashadi. Ayni damda mazkur fiqhiy ta'limot Hindiston, Pokiston, Afg'oniston, Iroq, Suriya, Turkiya va qator Afrika mamlakatlarida keng tarqalgan.

Molikiylik mazhabida shar'iy masalalarda Madina hayoti va odatlari ko'p hollarda ustun turgan.
Molikiylik Marokash, Jazoir, Tunis, Bangladesh kabi mamlakatlarda asosiy mazhab hisoblanadi.

Shofe'iylik mazhabi fiqhiy hukm chiqarishda Qur'on, sunnat, ijmo va qiyosga suyanadi.
Ular hanafiylar va molikiylarda mavjud bo'lgan istehsonni rad qiladilar.
Shofe'iylik, asosan, Indoneziya, Malayziya, Misr, Sudan, Keniya, Mali, Liviya kabi davlatlarda tarqalgan.

SAVOL: Islom dinidagi mazhablar (Hanbaliylik mazhabi) haqida ma'lumot bering.
JAVOB: Hanbaliylik mazhabi asoschisi imom Abu Abdulloh Ahmad ibn Hanbal (780-855) Bag'dod shahrida yashagan.
Hanbaliylik mazhabida Qur'on va sunnat asosiy manba hisoblanadi. Ijmo va sahobalarning gaplari keyingi o'rinlarda turadi. Qiyosni boshqa iloj qolmagandagina ishlatishga ruxsat beriladi.
Mazkur mazhab izdoshlari kam sonli bo'lib, asosan, Saudiya Arabistoni, Yaman, BAA, Quvayt, Qatar davlatlari aholisi orasida tarqalgan. Sunniylikdagi to'rtala mazhab bir-biri bilan teng hisoblanadi.
Mazhablar an'anaviy diniy huquq doirasidan chiqmagani holda, shariat masalalarida yengilroq yoki qattiqroq hukm chiqarishlari bilan farq qiladi.
Ijmo - ilk islom davrida ulamolarning bir ovozdan qabul qilgan qarorlari.

SAVOL: Islom dinidagi ta'limotlar (motrudiya ta'limoti) haqida ma'lumot bering.
JAVOB: Keyingi davrda paydo bo'lgan «soxta salafiylik», «Hizbut tahrir» kabi yo'nalishlarni fiqhiy mazhablarga tenglashtirib bo'lmaydi. Chunki ular shar'iy masalalarda o'z mustaqil yechimlarini bergan tizimga ega emas. Ularga noqonuniy diniy-siyosiy harakat sifatida qarash mumkin.
VIII-IX asrlarda musulmonlar orasida Qur'on oyatlari va hadislarni noto'g'ri tushungan toifalar paydo bo'ldi. Ular goh Allohni insonga o'xshash tasvirlar, goh uning xususiyatlarini inkor etar, payg'ambarlar, Qur'oni karim sha'niga noloyiq fikrlarni bildirar edi. Mana shunday sharoitda sunniylik yo'nalishi
olimlari ayrim oqimlarning buzg'unchi g'oyalariga bir qator raddiyalar berganlar.
Natijada Abu Mansur Moturidiy (870-944) moturidiya ta'limotiga asos solgan.
Moturidiy sof diniy aqida doirasidan chiqmagan holda aql-idrokni ulug'laydi va mantiqan asoslangan bilimning ahamiyatini alohida ta'kidlaydi.
Moturidiyga ko'ra, inson hayotiy imtihonlar uchun yaratilgan. Shu bilan bir vaqtda unga ushbu sinovlardan muvaffaqiyatli o'tish va to'g'ri yo'lni topish uchun keng imkoniyatlar ham berilgan.
Inson o'z xatti-harakatlarini tanlashda ixtiyorlidir. Buyuk alloma o'z qarashlari bilan hanafiylik ta'limotining Turon xalqlari an'analari, urf-odatlari bilan chambarchas bog'liqligini ko'rsatib berdi.
Eng e'tiborlisi, islom olamining aksariyat mintaqalarida, Suriya, Iroq, Turkiya, Pokiston, Hindiston, Shimoliy Afrika kabi mamlakatlarda moturidiylik ta'limoti hozir ham oliy, o'rta ta'lim tizimida va diniy o'quv yurtlarida mustaqil fan sifatida o'qitib kelinadi.
2017-yildan O'zbekiston Prezidenti tashabbusi bilan Imom Moturidiy majmuasida «Kalom ilmi maktabi», moturidiylik ta'limotining yirik vakili Abul Mu'in Nasafiy ziyoratgohida esa «Aqoid maktabi»ni tashkil etildi.
O'zbekistonda 2000-yilda Moturidiy tavalludining 1130-yilligi keng nishonlandi.
MANBA: 7-sinf O'zbekiston tarixi darsligi, 39-40-mavzular, 140-146-betlar
SAVOL: Islom dinidagi ta'limotlar (ash'ariya ta'limoti). Tasavvuf haqida ma'lumot bering.
JAVOB: Ushbu ta'limotga Abul Hasan Ash'ariy (873-936) asos solgan.
Imom Ash'ariy umrining yarmini adashgan oqimlarga qarshi kurashga bag'ishlagan.
Ash'ariya ta'limoti ham sunniylik aqidasiga muvofiq ta'limot hisoblanadi. Ushbu ta'limot ham, asosan, mo'taziliya, qadariya, jabariya kabi adashgan guruhlarning aqidaviy g'oyalariga qarshi turgan.
Ash'ariya ta'limoti, asosan, Iroqda, so'ngra saljuqiylar hukmronligi davrida Xurosonda rivojlangan.
Islom dinida tasavvuf va tariqat degan tushunchalar ham bor.
Tasavvufning chin mohiyati nafsni poklash, axloqni sayqallash, ma'naviy kamolotga erishishdan iborat.
Mazkur maqsadlarga erishish uchun olimlar tomonidan maxsus maktablar — tariqatlar tuzilgan.
«Tariqat» arab tilidagi so'z bo'lib, «yo'l» ma'nosini anglatadi.
Bugungi kunda tariqatlar soni ko'p bo'lib, ularning eng yiriklari Yassaviya, Kubraviya va Naqshbandiyadir. Muhimi, ularning barchasi ona yurtimizda yuzaga kelgan.
Tasavvuf va unga o'zakdosh bo'lgan sufiy, mutasavvif atamalarining kelib chiqishi arab tilidan «jun, yung» ma'nosini bildiruvchi «suf» so'zidan olingan.

MAVZU: 7-sinf · 41-42-mavzular: Ta'lim. (147-150-betlar)
SAVOL: Abu Homid G'azzoliy haqida ma'lumot bering.
JAVOB: Abu Homid G'azzoliy (1058-1111) o'z davrida «Hujjatul islom» (islom dalili) nomi bilan mashhur bo'lgan.
G'azzoliy Sharq va G'arbda ilohiyotchi, faylasuf sifatida tanilgan.
G'azzoliyning «Ihyou ulumid-din» asarining «Ilm kitobi» qismida «ta'lim oluvchi va ta'lim beruvchi odoblari haqida» ibratli fikrlar bayon qilingan. U: «Ilmning avvali sukut qilish, keyin tinglash, keyin uni yod olish, keyin unga amal qilish, keyin esa tarqatish – boshqalarga o'rgatishdir», – deb yozadi.
Ilmni kimlarga o'rgatmoq lozim, degan savolga «dunyoviy va diniy ilmlarni faqat qalbi ezgulikka limmo-lim insonlarga o'rgatish lozim. Ilm faqat ezgulikka xizmat qilishi kerak», degan fikrni ilgari suradi.

SAVOL: Turonda islomgacha va islom kirib kelgandan keyingi davrda ta'lim tizimi haqida ma'lumot bering.
JAVOB: Turonda islomga qadar ham bir necha asrlar davomida shakllangan ta'lim tizimi mavjud edi.
Mintaqada islom dini mafkurasining o'rnatilishi natijasida mahalliy ta'lim tizimida «madrasa» deb atalgan oliy ta'lim muassasalari paydo bo'ladi.
Shu ma'noda, ilk oliy o'quv yurti VIII-IX asrlarda Buxoroda paydo bo'lgani ham bejiz emas.
Ulardan eng mashhuri Farjak madrasasi bo'lib, u 937-yili yonib ketgan.
Samarqandda X asrda 17 ta madrasa tashkil etilgan.
Maktabdan yuqori bosqichdagi ta'lim dargohlari to «madrasa» nomi qat'iylashguncha «majlis» deb atala boshlangan va ularda shayx, hakim yoki ustoz deb atalgan ilmli kishilar dars berganlar.
Mug' tog'idan topilgan hujjatda VIII asrda o'lkamizda ro'y bergan voqealar haqida so'z boradi. Bu hujjat kul rang, ipak tolalari aralash «Xitoy» qog'oziga bitilgan. Hujjatni Divashtichning quli yozgan. Bu esa Turonda nafaqat erkin aholi, balki qullarning ham savodli bo'lishiga e'tibor qaratilganidan dalolat beradi.
Qutayba ibn Muslim davrida Buxoro hisorining ichida jome masjidi va madrasa bino qilingan. U joy (ilgari) butxona edi.
Qutayba ibn Muslim davrida Afshona qishlog'ining ekin yerlari va biyobonlari madrasa talabalariga vaqf qilingan. Madrasalarning ta'minoti pul, g'alla va o'sha ikki mahsulotda aralash holda amalga oshirilgan.
Har bir madrasa huzurida boshlang'ich maktablar bo'lgan.
Boshlang'ich ta'limda 6 yoshdan 12 yoshgacha bo'lgan bolalar o'qitilgan.
Madrasada ta'lim olish esa 12, 14 yoshdan boshlangan. Ta'lim aslida bepul bo'lgan. Shuningdek, nizomiya madrasalarida talabalarga stipendiya berilgan.
Mashhur sayyoh, Istaxriy (850-934) xorazmliklarning ilmga o'chliklarini o'zining «Kitob masolik va-l-mamolik» (930-933-yillarda yozilgan) asarida: «Hozir Bag'dodda biror olim yo'qki, uning xorazmlik shogirdi bo'lmasin», – deb ta'kidlagan.
IX asr boshlarida Balxda 400 ta madrasa va 900 ta maktab bo'lgan.
Turon Uyg'onish davrining o'ziga xos xususiyati, avvalo, matematika, astronomiya, fizika, kimyo, geodeziya, farmakologiya, tibbiyot kabi aniq va tabiiy fanlarning, shuningdek, tarix, falsafa va adabiyotning rivojlanishida namoyon bo'ldi.
Xorazmshoh Anushtegin davrida jami 4440 ta, faqatgina Gurganchning o'zida 700 ta madrasa bo'lgan.

SAVOL: Kaykovus, "Qobusnoma" asarida ilm haqida ma'lumot bering.
JAVOB: Ilmning sifati uch vajhdandir: yo bir pesha bila bog'lang'on ilm; ilm bilan bog'liq pesha (hunar, kasb); xayr va dalolatga taalluqli odat.
Biror pesha bila bog'liq ishlar tabiblik, munajjimlik, muhandislik, massohlik (yer o'lchovchi, tanobchi), shoirlik va bularga o'xshash ishlardir.
Ilmga taalluqli bor pesha xunyogarlik (musiqa asboblari ustasi), baytorlik (otlarni davolovchi), binokorlik, korizkunlik va bulardan tashqari ishlar ham bordur. Bularning har birisida shundoq qoida bordurki, agar sen uning rasmin va tartibin bilmasang, har qancha usta bo'lsang ham, ul bobda serrayg'on kishidek bo'lursan, ya'ni taajjublanib turg'aysan».

SAVOL: Turonda islomgacha bo'lgan davrda yozuv haqida ma'lumot bering.
JAVOB: Akademik A.Sagdullayevning «Qadimgi O'zbekiston ilk yozma manbalarda» nomli kitobida sug'd yozuvi ish yuritishda, savdo va madaniy aloqalarda katta ahamiyatga ega bo'lib, qadimgi uyg'ur, mo'g'ul va manjurlar yozuvlari paydo bo'lishiga asos bo'lganligi ta'kidlanadi.
Eftaliylar va Turk xoqonligiga oid bo'lgan tangalarda podshohlarning rasmi tushirilib, ismlari bilan zarb etilganlari uchraydi.
Turk xoqoni Istami Vizantiya imperatoriga noma yuboradi. Elchining sug'd ekanligi va u olib borgan noma sug'd tilida bitilganligi tarixiy manbalarda qayd etiladi.
Eftaliylar davrida mintaqada sug'dcha, xorazmcha, buxorocha, karoshti, eftaliycha yozuvlar mavjud bo'lgan.

JAVOB: Dunyoda xalqlar ko'p, davlatlar ko'p. Minglab millatlar va turli-tuman elatlar ham. Ulardan har birining dunyo tamadduniga qo'shgan o'z hissasi bor, ma'lum miqdordagi ulushi bor.
Bu ulushni esa kimdir ko'proq, kimdir kamroq qo'shib yashamoqda. Biz shu zamin egasi, shu xalq vakili sifatida dunyo tamadduniga qo'shgan ulkan ulushimiz bor, deb ayta olamiz.
Qomusiy olim sifatida Beruniy, tibbiyot madadi Abu Ali ibn Sino, aniq fanlarda Xorazmiy, diniy ilmda Imom Buxoriy, harb ilmida Amir Temur, osmon ilmida Mirzo Ulug'bek, she'riyat va badiiy adabiyotda Navoiy oldini kesib o'tadigani hali-hanuz topilmasa kerak. Keyingi mavzularimiz mana shu haqida…

Yaratgan insonlarni asl xilqatda iste'dod va qobiliyatli, yaxshi ila yomon, foyda ila zarar, oq ila qorani ayiradurgan qilub yaratmishdur. Lekin insondagi bu qobiliyatni kamolga yetkurmak tarbiya ila bo'ladur. Qush uyasinda ko'rganin qiladur. Inson javhari qobildur. Agar yaxshi tarbiya topib, buzuq xulqlardan saqlanub, go'zal xulqlarga odatlanub katta bo'lsa, har kim qoshida maqbul, baxtiyor bir inson bo'Iub chiqar. Agar tarbiyatsiz, axloqi buzulub o'ssa, Allohdan qo'rqmaydurgan, shariatga amal qilmaydurgan, nasihatni qulog'iga olmaydurgan, har xil buzuq ishlarni qiladurgan, nodon, johil bir rasvoyi olam bo'Iub qolur.
Alhosil, tarbiya bizlar uchun yo hayot - yo mamot, yo najot - yo halokat, yo saodat - yo falokat masalasidur.

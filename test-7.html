<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-sinf testlari — Beruniy ilmi maktabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f9fb;
    --paper-light: #ffffff;
    --ink: #10223d;
    --ink-soft: #5b6b82;
    --wine: #1a6ee8;
    --wine-dark: #1457c0;
    --gold: #ffc928;
    --green: #2f9a5f;
    --bad: #d4574a;
    --line: #e6ecf2;
    --serif: 'Nunito', sans-serif;
    --sans: 'Nunito', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  a{color:var(--ink-soft); text-decoration:none; font-size:16px;}
  .wrap{max-width:840px; margin:0 auto; padding:0 24px;}

  header{padding:26px 0;}
  .brand{font-family:var(--serif); font-size:24px; font-weight:600;}
  .brand span{color:var(--wine);}

  .test-head{padding:10px 0 34px;}
  .test-head .eyebrow{
    font-family:var(--serif); font-style:italic; color:var(--wine); font-size:17px; margin-bottom:10px;
  }
  .test-head h1{
    font-family:var(--serif); font-size:42px; font-weight:600; margin:0 0 12px;
  }
  .test-head p.sub{color:var(--ink-soft); font-size:18px; margin:0;}
  .progress-track{
    height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:22px;
  }
  .progress-fill{
    height:100%; background:var(--wine); width:0%; transition:width 0.3s ease;
  }
  .progress-text{font-size:16px; color:var(--ink-soft); margin-top:10px;}

  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    padding:44px 40px;
    margin-bottom:26px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:32px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 32px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:22px 24px;
    margin-bottom:14px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:22px;
    color:var(--ink);
    cursor:pointer;
  }
  .option:hover{border-color:var(--ink-soft);}
  .option.correct{
    background:rgba(47,154,95,0.14);
    border-color:var(--green);
    font-weight:600;
  }
  .option.wrong{
    background:rgba(212,87,74,0.1);
    border-color:var(--bad);
  }
  .option:disabled{cursor:default;}

  .btn{
    display:inline-block;
    font-family:var(--sans);
    font-weight:600;
    font-size:18px;
    padding:16px 30px;
    border-radius:4px;
    border:none;
    background:var(--wine);
    color:var(--paper-light);
    cursor:pointer;
  }
  .btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}

  .result{
    text-align:center;
    padding:60px 20px;
  }
  .result .score{
    font-family:var(--serif);
    font-size:72px;
    font-weight:700;
    color:var(--wine);
    margin:0 0 10px;
  }
  .result p{color:var(--ink-soft); margin:0 0 32px; font-size:18px;}
  .hidden{display:none;}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .topic-card{
    background:var(--paper-light);
    padding:28px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-family:var(--sans);
  }
  .topic-card:hover{background:var(--paper);}
  .group-head{background:#eaf2ff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--wine-dark);}
  .group-head span{font-weight:700;font-size:15px;color:var(--ink-soft);}
  @media (max-width:600px){.group-head{padding:12px 18px;font-size:16px;}.topic-card{padding:20px 18px !important;}}
  .topic-info h3{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .topic-info p{
    margin:0;
    font-size:16px;
    color:var(--ink-soft);
  }
  .topic-arrow{
    font-family:var(--serif);
    font-style:italic;
    color:var(--wine);
    font-size:18px;
    flex-shrink:0;
  }
  .q-image{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:4px;
    margin:0 0 26px;
  }
  .q-table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 26px;
    font-family:var(--sans);
    font-size:17px;
  }
  .q-table td{
    border:1px solid var(--line);
    padding:10px 14px;
  }
  .q-table tr:first-child td{
    background:var(--paper);
    font-weight:600;
    font-family:var(--serif);
  }

  .error-box{
    background:rgba(212,87,74,0.1);
    border:1px solid var(--wine);
    color:#9a3a30;
    padding:18px 20px;
    margin-bottom:20px;
    font-size:15px;
    border-radius:4px;
  }


  /* Variant harfi belgisi */
  .option{display:flex; align-items:center; gap:18px;}
  .opt-key{
    flex-shrink:0; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink-soft); border-radius:4px; font-weight:600; font-size:18px;
    font-family:var(--serif); color:var(--ink-soft); background:var(--paper-light);
  }
  .option.correct .opt-key{background:var(--green); border-color:var(--green); color:#fff;}
  .option.wrong .opt-key{background:var(--bad); border-color:var(--bad); color:#fff;}
  .kbd-hint{display:none; font-size:15px; color:var(--ink-soft); margin-top:6px;}

  /* KOMPYUTER UCHUN: kengroq maket */
  @media (min-width:1000px){
    .wrap{max-width:1080px; padding:0 40px;}
    .test-head h1{font-size:50px;}
    .test-head p.sub{font-size:20px;}
    .card{padding:56px 64px;}
    .q-text{font-size:38px; margin-bottom:40px;}
    .option{font-size:24px; padding:24px 28px;}
    .opt-key{width:42px; height:42px; font-size:20px;}
    .q-table{font-size:20px;}
    .q-image{max-height:460px; margin-left:auto; margin-right:auto;}
    .kbd-hint{display:block;}
    .option:hover{background:var(--paper-light); border-color:var(--wine);}
  }
  @media (min-width:1500px){
    .wrap{max-width:1240px;}
    .q-text{font-size:42px;}
    .option{font-size:26px;}
  }

  @media (max-width:600px){
    .q-text{font-size:24px;}
    .option{font-size:18px; padding:18px 18px;}
    .test-head h1{font-size:32px;}
    .card{padding:28px 24px;}
    .topic-info h3{font-size:21px;}
  }

  body{
    background-color:var(--paper);
    background-image:radial-gradient(circle at 12% 0%, #e8f1ff 0, transparent 38%), radial-gradient(circle at 100% 100%, #fff3da 0, transparent 34%);
    background-attachment:fixed;
  }
  .card{border-radius:30px; box-shadow:0 8px 24px -16px rgba(16,34,61,.25);}
  .option{border-radius:18px;}
  .btn{border-radius:16px;}
  .progress-track,.progress-fill{border-radius:6px;}
  .brand{font-weight:800; letter-spacing:.5px;}
  .q-text,.test-head h1{font-weight:800;}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a6ee8"><link rel="apple-touch-icon" href="rasmlar/icon-192.png"><script src="pwa.js" defer></script></head>

  <div class="brand">Beruniy <span>ilmi maktabi</span></div>

<main class="wrap">

  <div id="topicScreen">
    <div class="test-head">
      <div class="eyebrow">I bo'lim — Mavzulashtirilgan testlar</div>

      <p class="sub">Xohlagan tartibda o'ting.</p>
    </div>
    <div id="errorArea"></div>
    <div class="topic-list" id="topicList"></div>

  <div id="quizScreen" class="hidden">
    <div class="test-head">
      <div class="eyebrow">I bo'lim — Mavzulashtirilgan test</div>
      <h1 id="testTitle">—</h1>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">1 / 5 savol</div>
    </div>
    <div id="quizArea"></div>
  </div>

  <div id="resultArea" class="card result hidden">
    <div class="score" id="scoreText">0 / 5</div>
    <p>Natijangiz shu. Qayta urinib ko'rishingiz yoki boshqa mavzuni tanlashingiz mumkin.</p>
    <button class="btn" onclick="restartQuiz()">Shu mavzuni qayta boshlash</button>
    <button class="btn btn-ghost" style="margin-left:10px;" onclick="showTopicScreen()">Boshqa mavzu tanlash</button>
  </div>

</main>

<script type="text/plain" class="question-data"
        data-key="k7-00" data-group="7-sinf · O'zbekiston tarixi" data-title="Ajdodlarimizning ma'naviy qadriyatlari – jahon sivilizatsiyasi asoslaridan biri" data-desc="13 ta savol">
7-sinf O'zbekiston darsligi qaysi davr tarixini o'z ichiga oladi?
A) VI asrdan XIII asr boshlarigacha
B) IV asrdan XV asr boshlarigacha
C) IV asrdan XIII asr boshlarigacha
D) IV asrdan XVI asr boshlarigacha
JAVOB: C

Yurtimiz nomlanishini davrlari bilan to'g'ri moslashtiring: a) «Movarounnahr» va «Xuroson» b) «O'rta Osiyo» va «Markaziy Osiyo» c) «Turon»; 1) qadimgi davrdan 2) arablar davridan 3) XVIII-XIX asr g'arb olimlari va sayyohlari davridan
A) a-2, b-1, c-3
B) a-2, b-3, c-1
C) a-1, b-3, c-2
D) a-1, b-2, c-3
JAVOB: B

Kurush ustidan g'alaba qozongan xalq qahramonini aniqlang.
A) Shiroq
B) Spitamen
C) To'maris
D) Sparangiz
JAVOB: C

Yevropada o'rta asrlarning boshlanishi qaysi voqea bilan belgilanadi?
A) Buyuk Xitoy devori qurilishi yakunlanishi
B) G'arbiy Rim imperiyaning tashkil topishi
C) Xristian dining paydo bo'lishi
D) G'arbiy Rim imperiyaning qulashi
JAVOB: D

O'zbekiston tarixida o'rta asrlarning boshlanishi qaysi voqea bilan belgilanadi?
A) Arab xalifaligining yurtimizga kirib kelishi davridan
B) Siyosiy maydonda kidariylar, xioniylar, eftaliylar kabi qabila uyushmalari paydo bo'lgan davrdan
C) Turk xoqonligining ikkiga bo'lingan davridan
D) Qarluq, o'g'uz kabi qabilalar islomni qabul qilgan davridan
JAVOB: B

«O'rta asrlar» tushunchasi tarix faniga qaysi millatga mansub tarixchilari tomonidan olib kirilgan?
A) ingliz
B) italyan
C) fransuz
D) german
JAVOB: B

Ilk o'rta asrlarda «qishloq hokimlari» deb atalgan katta yer egalari tabaqasi nima deb atalgan?
A) kadivar
B) kashovarz
C) dehqon
D) chokar
JAVOB: C

Ilk o'rta asrlarda yerda ishlash tartiblarining tubdan o'zgarishi....
A) aholi o'rtasida tabaqalanishni yanada keskinlashtirgan
B) mahalliy aholining yerlaridagi hosil miqdorini oshirgan
C) yersiz dehqonlar qatlamining kamayishiga sabab bo'lgan
D) zodagon dehqonlarning aholi ustidan nazoratini kuchaytirgan
JAVOB: A

VIII asr boshlariga kelib mamlakatimiz hududida qanday voqea sodir bo'lganligini toping: 1) arab xalifaligi hukmronligi o'rnatildi 2) madaniyatimizga islom dinining ta'siri kuchaydi 3) «oq xunnlar» hukmronligi barham topdi
A) 1
B) 1, 2
C) 2, 3
D) 1, 2, 3
JAVOB: B

IX–XII asrlarda zaminimizda tug'ilib, voyaga yetgan mashhur ulamolar to'g'ri berilgan javobni toping: 1) Ahmad Yassaviy 2) Abdurahmon Jomiy 3) Najmiddin Kubro 4) Mahmud Zamaxshariy
A) 1, 3, 4
B) 2, 3, 4
C) 1, 2, 4
D) 1, 2, 3
JAVOB: A

«Qishloq hokimlari»ning ekinzorlarida ishlovchi yersiz kishilar tabaqasi nima deb atalgan?
A) kadivar
B) kashovarz
C) dehqon
D) chokar
JAVOB: A

IX–XII asrlarda zaminimizda tug'ilib, voyaga yetgan mashhur ulamolar noto'g'ri berilgan javobni toping: 1) Alisher Navoiy 2) Imom Termiziy 3) Abullays Samarqandiy 4) Imom Buxoriy
A) 1, 2
B) 2, 3
C) 1, 3
D) 2, 4
JAVOB: C

Quyidagi ma'lumotlardan qaysilari to'g'ri? 1. O'rta asrlar, o'z navbatida, ilk, rivojlangan va so'nggi o'rta asrlarga bo'linadi 2. Ilk o'rta asrlar IV–VIII asrlarni o'z ichiga oladi 3. Rivojlangan o'rta asrlar IX–XV asrlarni o'z ichiga oladi 4. So'nggi o'rta asrlar XVI–XIX asrlarni o'z ichiga oladi
A) 1, 2, 3, 4
B) 2, 3, 4
C) 1, 2, 4
D) 1, 2, 3
JAVOB: A

</script>
<script type="text/plain" class="question-data"
        data-key="k7-01" data-group="7-sinf · O'zbekiston tarixi" data-title="IV–VII asrlarda mamlakatimiz xalqlarining turmush tarzi" data-desc="15 ta savol">
Quyidagilardan qay biri vatanimizning shuhrat topgan qadimiy nomlari qatoriga kirmaydi?
A) Turkiston
B) Xuroson
C) Turon
D) Movarounnahr
JAVOB: B

O'rta Osiyoning dehqonchilik viloyatlarida tashkil topgan hokimlik nomi noto'g'ri berilgan qatorni toping.
A) Xorazm
B) Farg'ona
C) Choch
D) Samarqand
JAVOB: D

Ilk o'rta asrga oid atamalarni izohlari bilan to'g'ri moslashtiring: a) dehqon mulkini qo'riqlovchi, harbiy posbon b) ziroatchi oddiy qo'shchilar c) ilk o'rta asrlarda mulkdor tabaqa d) qishloqning dehqonlarga qaram aholisi; 1) dehqon 2) kashovarz 3) kadivar 4) chokar
A) a-4, b-3, c-1, d-2
B) a-1, b-2, c-3, d-4
C) a-4, b-2, c-3, d-1
D) a-4, b-2, c-1, d-3
JAVOB: D

VI asrda unumdor yerlar hamda suv taqsimoti kimlarning nazoratiga o'tganligini toping.
A) qabila boshliqlari va oqsoqollar
B) qabila boshliqlari va ishboshilar
C) oqsoqollar va ishboshilar
D) yirik yer egalari va ishboshilar
JAVOB: B

Qishloq jamoalari yerlarida yashab yer va suvdan iborat umumiy mulkka ega bo'lgan erkin ziroatchilar tabaqasi nima deb ataladi?
A) kadivar
B) kashovarz
C) dehqon
D) chokar
JAVOB: B

«O'zbek xalqining etnogenezi va etnik tarixi» asarining muallifini aniqlang.
A) Ahmadali Asqarov
B) Edvard Rtveladze
C) Anatoliy Sagdullayev
D) Dilorom Yusupova
JAVOB: A

So'nggi antik davr qaysi davrni o'z ichiga oladi?
A) mil.avv II – mil.avv. IV asr
B) mil.avv II – milodiy IV asr
C) milodiy IV – VI asr
D) milodiy II – IV asr
JAVOB: D

So'nggi antik davrda boshlangan tub o'zgarishlar to'g'ri berilgan javobni aniqlang: 1) O'rta Osiyoning dehqonchilik viloyatlarida o'nlab mahalliy hokimliklar tashkil topdi 2) mahalliy hokimliklarning yiriklashish jarayoni yuz berdi 3) mahalliy hokimliklarda yer egaligiga munosabatlari tugatildi
A) 1
B) 1, 2
C) 1, 3
D) 1, 2, 3
JAVOB: B

O'rta Osiyoning dehqonchilik viloyatlarida tashkil topgan hokimliklar to'g'ri berilgan javobni toping: 1) Baqtriya 2) Sug'diyona 3) Buxoro 4) Marg'iyona 5) Toxariston
A) 1, 3, 5
B) 2, 4, 5
C) 1, 2, 4
D) 2, 3, 4
JAVOB: B

Qanday suv inshootlari kashf etilishi qishloq xo'jalik ishlarining rivojiga ta'sir ko'rsatdi? 1) moyjuvoz 2) suv tegirmoni 3) chig'ir 4) charxpalak 5) objuvoz
A) 1, 2, 3
B) 3, 4, 5
C) 2, 3, 4
D) 1, 4, 5
JAVOB: C

Chokarlar bajaradigan vazifalarni aniqlang: 1) dehqonlarning xo'jalarida yer haydash va urug' ekish 2) dehqonlarning xo'jaligini tashqi hujumlardan himoya qilish 3) dehqon xo'jaligida tartib-intizomni saqlashga yordam berish
A) 1, 2
B) 2, 3
C) 1, 3
D) 1, 2, 3
JAVOB: B

... shaharda hunarmandchilik rastalari, uylari bo'lgan. Nuqtalar o'rniga mos so'zni qo'ying.
A) chokarlarning
B) dehqonlarning
C) kadivarlarning
D) kashovarzlarning
JAVOB: B

Qabila boshliqlari va ishboshilarga qishloq aholisiga o'z ta'sirlarini o'tkazish, ziroatchi aholiga hukmronlik qilish imkoniyatini berishga sabab bo'lgan omilni aniqlang.
A) unumdor yerlar ularning qo'liga o'tishi
B) chokarlardan iborat maxsus qo'shinga ega bo'lishi uchun
C) suv taqsimoti nazoratiga o'tishi
D) A va C
JAVOB: C

Quyidagilardan qaysi biri "hosil yetishtiruvchi" ma'nosini anglatadi?
A) mirob
B) qo'shchi
C) ziroatkor
D) chokar
JAVOB: C

Ilk o'rta asrlarda shaharlar qanday markazga aylanganligini toping: 1) dehqonchilik 2) hunarmandchilik 3) savdo-sotiq 4) madaniy hayot
A) 1, 2, 3
B) 2, 3, 4
C) 1, 2, 4
D) 1, 3, 4
JAVOB: B

</script>
<script type="text/plain" class="question-data"
        data-key="k7-02" data-group="7-sinf · O'zbekiston tarixi" data-title="IV–VII asrlarda Xorazm" data-desc="31 ta savol">
Zaiflashib borayotgan Qang' davlati tarkibidan dastlab qaysi davlat ajralib chiqganligini toping.
A) Baqtriya
B) Sug'diyona
C) Xorazm
D) Parfiya
JAVOB: C

Xorazm vohasiga qaysi sahro tutashib ketgan?
A) Qoraqum
B) Qizilqum
C) Mo'yinqum
D) Bo'rsiq
JAVOB: A

Ilk o'rta asrlar davrida Xorazm davlatining poytaxti dastlab qaysi shahar bo'lgan?
A) Ko'zaliqir
B) Tuproqqal'a
C) Kat
D) Jonbosqal'a
JAVOB: B

Xorazm vohasi Xiva meridianidan sal (I) da qum tepaliklar chegarasi (II) tomonga buriladi va shu yo'nalishda deyarli (III) gacha borib yetadi. Nuqtalar o'rniga mos so'zni qo'ying.

        if (/^JADVAL:?$/i.test(line)) { mode = 'table'; continue; }

        const optMatch = line.match(/^([A-D])\)\s*(.+)$/);
        if (optMatch) { options.push(optMatch[2]); mode = 'options'; continue; }

        const ansMatch = line.match(/^JAVOB:\s*([A-D])/i);
        if (ansMatch) { correctLetter = ansMatch[1].toUpperCase(); continue; }

        if (mode === 'table' && line.includes('|')) {
          tableRows.push(line.split('|').map(cell => cell.trim()));
          continue;
        }

        if (mode === 'question') {
          questionLines.push(line); // savol matni bir necha qatorli bo'lishi mumkin
        }
      }

      if (options.length < 2 || options.length > 4 || !correctLetter || "ABCD".indexOf(correctLetter) >= options.length) {
        warnings.push(`${blockIndex + 1}-savolda xatolik bor (variantlar yoki JAVOB qatori to'liq emas): "${questionLines[0].slice(0, 40)}..."`);
        return;
      }

      result.push({
        text: questionLines.join('\n'),
        images: images,
        table: tableRows,
        options: options,
        correct: "ABCD".indexOf(correctLetter)
      });
    });

    return { questions: result, warnings: warnings };
  }

  // 2) Sahifadagi barcha mavzu bloklarini o'qib, questionSets ni yasaymiz
  const questionSets = {};
  const allWarnings = [];

  document.querySelectorAll('script.question-data').forEach(block => {
    const key = block.dataset.key;
    const parsed = parseTopicText(block.textContent);
    questionSets[key] = {
      title: block.dataset.title,
      group: block.dataset.group || '',
      desc: block.dataset.desc,
      questions: parsed.questions
    };
    parsed.warnings.forEach(w => allWarnings.push(`«${block.dataset.title}» mavzusida — ${w}`));
  });

  // Agar formatlashda xato bo'lsa, o'chirib tashlamay, o'qituvchiga ko'rsatamiz
  if (allWarnings.length > 0) {
    document.getElementById('errorArea').innerHTML =
      '<div class="error-box"><strong>Diqqat, quyidagi savollarni tekshiring:</strong><br>' +
      allWarnings.join('<br>') + '</div>';
  }

  let questions = [];
  let currentTopicKey = "";
  let current = 0;
  let score = 0;

  function renderTopicList() {
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    let lastGroup = null;
    for (const key in questionSets) {
      const set = questionSets[key];
      if (set.questions.length === 0) continue; // savoli yo'q mavzuni ko'rsatmaymiz
      if (set.group && set.group !== lastGroup) {
        lastGroup = set.group;
        const total = Object.values(questionSets).filter(x => x.group === set.group).reduce((a, x) => a + x.questions.length, 0);
        const h = document.createElement('div');
        h.className = 'group-head';
        h.innerHTML = `<b>${set.group}</b><span>${total} ta savol</span>`;
        list.appendChild(h);
        const mix = document.createElement('button');
        mix.className = 'topic-card';
        mix.innerHTML = `
          <div class="topic-info">
            <h3>Aralash test — ${set.group.split(' · ')[0]}</h3>
            <p>Hamma mavzulardan 30 ta tasodifiy savol</p>
          </div>
          <div class="topic-arrow">Boshlash →</div>`;
        mix.onclick = () => startMix(set.group);
        list.appendChild(mix);
      }
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `
        <div class="topic-info">
          <h3>${set.title}</h3>
          <p>${set.questions.length} ta savol</p>
        </div>
        <div class="topic-arrow">Boshlash →</div>
      `;
      card.onclick = () => startQuiz(key);
      list.appendChild(card);
    }
  }

  function startMix(group) {
    const all = [];
    Object.values(questionSets).forEach(x => { if (x.group === group) x.questions.forEach(q => all.push(q)); });
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    questionSets['__mix'] = { title: 'Aralash test — ' + group.split(' · ')[0], desc: '', group: '__mix', questions: all.slice(0, 30) };
    startQuiz('__mix');
  }

  function startQuiz(key) {
    currentTopicKey = key;
    questions = questionSets[key].questions;
    current = 0;
    score = 0;

    document.getElementById('testTitle').textContent = questionSets[key].title;
    document.getElementById('topicScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    const quizArea = document.getElementById('quizArea');

    let mediaHtml = '';
    (q.images || []).forEach(src => {
      mediaHtml += `<img class="q-image" src="${src}" alt="Savolga tegishli rasm">`;
    });
    if (q.table && q.table.length > 0) {
      mediaHtml += '<table class="q-table">';
      q.table.forEach(row => {
        mediaHtml += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      mediaHtml += '</table>';
    }

    let optionsHtml = '';
    q.options.forEach((opt, i) => {
      optionsHtml += `<button class="option" onclick="checkAnswer(${i})"><span class="opt-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    });

    const questionTextHtml = q.text.split('\n').join('<br>');

    quizArea.innerHTML = `
      <div class="card">
        <div class="q-text">${questionTextHtml}</div>
        ${mediaHtml}
        ${optionsHtml}
        <div class="kbd-hint">Klaviatura: A, B, C, D tugmalari bilan javob bering</div>
      </div>
    `;
    answered = false;

    document.getElementById('progressText').textContent = `${current + 1} / ${questions.length} savol`;
    document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
  }

  let answered = false;

  // Bosh sahifadagi statistika uchun (brauzer xotirasi)
  function recordAnswer(isCorrect){
    try {
      var st; try { st = JSON.parse(localStorage.getItem('tm_stats')); } catch(e){}
      if (!st || !st.days) st = {total:0, correct:0, wrong:0, best:0, days:{}};
      var d = new Date(), k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      st.days[k] = (st.days[k]||0) + 1;
      st.total++; if (isCorrect) st.correct++; else st.wrong++;
      var n=0, c=new Date(); while(st.days[c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0')]){n++; c.setDate(c.getDate()-1);}
      if (n > (st.best||0)) st.best = n;
      localStorage.setItem('tm_stats', JSON.stringify(st));
    } catch(e){}
  }

  function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const buttons = document.querySelectorAll('.option');

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      if (i === selectedIndex && selectedIndex !== q.correct) btn.classList.add('wrong');
    });

    if (selectedIndex === q.correct) score++;
    recordAnswer(selectedIndex === q.correct);

    setTimeout(() => {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    startQuiz(currentTopicKey);
  }

  function showTopicScreen() {
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('topicScreen').classList.remove('hidden');
  }

  // Klaviatura: A/B/C/D yoki 1/2/3/4
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const quiz = document.getElementById('quizScreen');
    if (!quiz || quiz.classList.contains('hidden')) return;
    const keys = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3};
    const idx = keys[e.key.toLowerCase()];
    if (idx === undefined) return;
    const btns = document.querySelectorAll('#quizArea .option');
    if (idx < btns.length) { e.preventDefault(); checkAnswer(idx); }
  });

  renderTopicList();
</script>

</body>
</html>

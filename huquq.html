<script type="text/plain" class="suhbat-data">
MAVZU: 8-sinf
SAVOL: Yurtimizda so'nggi yillarda amalga oshirilayotgan islohotlarning bosh g'oyasi — maqsadi nimada?
JAVOB: Yurtimizda so'nggi yillarda shunday o'zgarishlar, yangilanishlar yuz bermoqdaki, bu o'zgarishlar shiddatidan, ko'lamidan, olamshumulligidan aql shoshib qoladi. Qisqa davr ichida qad ko'tarayotgan bino va inshootlar, ishga tushirilayotgan zavod va fabrikalar, foydalanishga topshirilayotgan ta'lim va sog'liqni saqlash maskanlari, oromgohlar, sport, san'at, madaniyat maskanlarining barchasi xalq uchun, siz va biz uchun bunyod qilinmoqda.
So'nggi yillarda, mustaqillikka erishgan davrimizdan keyingi davrda ilk bora mustaqillikning tub mohiyatini anglatuvchi g'oya — inson manfaatlarini davlatimiz faoliyatining markaziga olib chiqish g'oyasi ilgari surildi.
Har bir insonerkin, mustaqil hayot kechiruvchi, o'zining imkoniyatlarini, qobiliyatini toia namoyon qila olishiga barcha sharoitlar muhayyo qilingan joyda yashash, umrguzaronlik qilish insoniyatning azaliy orzusi bo'lib kelgan. Insonning bu orzusi ushalishi, u yashaydigan mamlakat haqiqiy erkin, baxtli hayotni ta'minlab bera olishi uchun ushbu mamlakatda muayyan iqtisodiy-ijtimoiy va siyosiy-huquqiy sharoit mavjud bo'lishi lozim. Bu joyda inson huquq va erkinliklariga bo'lgan e'tibor eng oliy darajada bo'lmog'i lozim. Chunki inson o'zini ustaqil va baxtli his qila olishi uchun, avvalambor, uning huquq va erkinliklari ta'minlangan bo'lishi shartdir.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 5-bet
SAVOL: “Inson huquqlari umumjahon deklaratsiyasi” qabul qilinishining ahamiyati haqida gapirib bering.
JAVOB: Har bir jamiyatning asosiy mezoni hisoblangan inson huquqlari xalqaro huquq ning obyekti sifatida 1948- yilda “Inson huquqlari umumjahon deklaratsiyasi” ning qabul qilinishi bilan rasman tan olindi. BMT Bosh Assa bleyasi tomonidan qabul qilingan ushbu hujjatning tarixiy ahamiyati shun daki,unda ilk marotaba dunyo hamjamiyati inson va uning huquqlarini himo yaqilishni xalqaro muammo darajasida e'tirof etdi. Mustaqil mamlakatlar qatori O'zbekiston Respublikasi ham muayyan huquq va majburiyatlarga egadir. Bularning ichida eng muhimi va ustuvori mamlakatimiz hududida inson huquq va erkinliklarini ta'minlash, mamlakatimiz fuqarosini tom ma'no da gi erkin va mustaqil shaxsga aylantirishdir.
Yurtimizning barcha hududlarida faoliyat yurita boshlagan Xalq qabulxonalari, davlat idoralarining xalqning muammo va arizalari bo'yicha joylarda ish olib bora boshlagani, kam ta'minlangan oilalarga alohida g'amxo'rlik ko'rsatila boshlangani, yoshlar ta'lim-tarbiyasiga, ulami ish bilan ta'minlashga berilayotgan e'tibor, bularning barchasi yurtimizda xalq manfaatlari ustuvorligining yaqqol isbotidir. Eng asosiysi, inson huquq va erkinliklarini ta'minlash mamlakatimizdagi ol^mshumul islohotlarning bosh g'oyasi, maqsadi qilib belgilandi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 5-6 betlar
SAVOL: Mustaqillik O'zbekiston Respublikasiga qanday huquqlarni berdi?
JAVOB: O'zbekiston Respublikasi mustaqil davlat sifatida quyidagi huquqlarga ega:
daxlsizlik, o'z hududiga va chegarasiga egalik huquqi;
shaxslami fuqarolikka qabul qilish va fuqarolikdan mahrum etish huquqi;
o'z Konstitusiyasi, kodekslari va qonunlarini qabul qilish huquqi;
qonun chiqaruvchi, ijro etuvchi va sud hokimiyatlarining faoliyatini yo'lga qo'yish huquqi;
o'z Qurolli Kuchlarini tashkil qilish huquqi;
xalqaro huquq subyekti sifatida xorijiy mamlakatlar bilan mustaqil ravishda aloqalar o'rnatish huquqi;
o'z mulkiga egalik, budjet, soliq va moliya tizimlarini tashkil qilish huquqi;
o'z xazinasi va pul birligi - milliy valutasini joriy qilish huquqi;
o'z sud tizimini tashkil qilish va sud ishlarini mustaqil yuritish huquqi;
o'z gerbi, bayrog'i, madhiyasi va poytaxtiga ega boiish huquqi;
davlat tiliga egalik huquqi;
o'z taraqqiyot yo'lini, o'z nomini, o'z ma'muriy tuzilishini o'zi belgilash huquqi;
referendum o'tkazish hamda hokimiyat va boshqaruv organlari tarkibini belgilash huquqi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 6-bet
SAVOL: Shaxsga ta'rif bering ?
JAVOB: Shaxs deganda o'ziga xos xususiyatlar, xohish-istaklar, orzu va intilishlar, bilim, ko'nikma, malakalarga ega, ma'naviy dunyosi boy bo'lgan inson tushuniladi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 13-bet
SAVOL: His-hayajon va ehtiyojlar inson hayotida qanday o'rin tutadi?
JAVOB: Shaxs ham, albatta odam, inson, individ. Lekin unda tabiiy xususiyatlar, ehtiyojlar, his- hayajon, tuyg'ulardan tashqari bir1 qadar ahamiyatliroq bo'lgan jihatlar mavjud. Masalan, shaxs uchun qator qadriyatlar muhim. Bu qadriyatlarga misol qilib o'z uyi - oilasi, mamlakati - vatani, mahallasi - qo'ni-qo'shnilari, o'quv dargohi - sinfdoshlari yoki kursdoshlari, ishxonasi - hamkasblari kabilami keltirish mumkin. Bu qadriyatlarga erishish, ularni saqlash va e'zozlash uning hayotining maqsadi, mazmuni bo'lib xizmat qiladi. Shaxsga yashash prinsiplari, atrofdagilar bilan munosabat qonunqoidalari, o'zi yashayotgan, faoliyat yuritayotgan muhitdaobro'-e'tiborga, nufiizga ega bo'lish istagi kabilar xosdir. Shaxs o'z his- hayajon va ehtiyojlarini jilovlay oladi. Unda ong va iroda kuchli. Shaxs o'z ichki dunyosini biladi, tushunadi va ma'lum tizimga sola oladi.
Shaxs o'z-o'zini va o'z hayotini quradi. Bunda u o'zini va o'z atrofidagi shart-sharoitlarni o'zgartiradi, shakllantiradi. Shaxs faqat o'z-o'zi bilan ovora emas. U atrofdagilar, hayot, mahalla, mamlakat, vatan haqida doimo o'ylaydi, qayg'uradi, g'amxo'rlik qiladi. Inson qay darajada shaxs sifatida shakllanganligining oichovi, me'yori sifatida uning o'z shaxsiyati bilan qay darajada atrofdagi boshqa odamlarga, vataniga va hayotga ta'sir o'tkaza olayotganligini keltirish mumkin.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 12-bet
SAVOL: Qanday tarixiy zotlarni "buyuk shaxslar" deb atashimiz mumkin? Siz bunday zotlardan kimlarning nomlarini aytib bera olasiz?
JAVOB: Biz Amir Temur, Jaloliddin Manguberdi, Alisher Navoiy, Zahiriddin Muhammad Bobur kabi ajdodlarimizni tilga olganimizda ularni buyuk shaxslar deb ulug'lashimiz ham shaxs tushunchasining naqadar salobatli ekanligini bildiradi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 12-bet
SAVOL: Inson shaxs sifatida shakllanishiga qanday omillar ta'sir qiladi?
JAVOB: Insonning shaxs sifatida shakllanishida oila, maktab, qo'ni-qo'shnilar, mahalla va do'stlaming ta'siri katta. Oila bola uchun eng dastlabki asoslami yaratsa, bolalar bog'chasi, maktab yoki boshqa ta'lim muassasalari zarur bilim, ko'nikma va malakalami beradi. Qo'ni- qo'shnilar va mahalla an'analar, urf-odatlar bilan tanishtiradi, atrofdagilar bilan munosabatga kirishishga o'rgatadi. Insonning qanday shaxsga aylanishi ko'p jihatdan davlatning yosh avlod ta'lim-tarbiyasiga qaratilgan siyosatiga bog'liq. O'zbekistonda so'nggi yillarda Prezidentimiz Shavkat Mirziyoyev tashabbusi bilan amalga oshirilayotgan islohotlaming eng muhim yo'nalishlaridan biri aynan yosh avlodning ta'lim-tarbiyasiga, kelajakda farovon turmush va taraqqiy etgan mamlakatning quruvchilari bo'lgan shaxslami voyagayetkazishga qaratilgan. Islohotlaming markaziga aynan shaxs, uning erkinligi, manfaatlari, orzu-istaklari, intilishlari qo'yilgan.
Shaxs sifatida shakllangan kishi yetarli darajadagi aql-idrok, bilim, zakovat, kuch-quwat, tajriba, kasbiy mahorat, ilmiy salohiyat, jismoniy va ma'naviy salomatlikka, ya'ni inson kapitali deb atalmish boylikka ega bolishi lozim.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 12-13 betlar
SAVOL: Insonning ma'naviy boyligiga nimalar kiradi?
JAVOB: Insonning ma'naviy boyligi - uning dunyoqarashi, xulqi, odobi, madaniyati kabi ruhiy dunyosi bilan bog'liq fazilatlari inson kapitalining asosiy tashkil etuvchilaridan hisoblanadi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 13-bet
SAVOL: Jamiyat atamasiga ta'rif bering ?
JAVOB: Jamiyat - arabcha so'z bo'lib, jamoa, jamlangan, birlashgan degan ma'nolami bildiradi. Jamiyat - muayyan hududda yashovchi, o'z ehtiyoj va manfaatlariga ko'ra birlashgan kishilardan iborat jamoa.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 17-bet
SAVOL: Davlatlarning tashkil topishi to'g'risida ma'lumot bering ?
JAVOB: Davlatlarning tashkil topishi bu — insoniyatning ibtidoiy jamoa tuzumidan sivilizatsiya tomon burilishi edi. Dunyoda birinchi sivilizatsiyalashgan davlatlarning paydo bo'lishi Qadimgi Sharqda miloddan avvalgi IV—III ming yilliklar davriga to'g'ri keladi. Markaziy Osiyo hududida miloddan avvalgi I ming yillikning boshlarida ilk davlat uyushmalari paydo bo'la boshlagan.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 21-bet
SAVOL: O'zbekiston hududida ilk davlatlar qachon tashkil topgan?
JAVOB: Miloddan avvalgi I ming yillikning birinchi yarmida, miloddan avvalgi VII-VI asrlarda O'zbekiston hududida ilk davlatlar Qadimgi Xorazm, Qadimgi Baqtriya paydo boigan davrdanoq mamlakatimizda davlatchilik asoslari uzil-kesil tashkil topdi.
Qadimgi Xorazm va Baqtriya davlatlari uyushmasi-ittifoqi hududiga Sirdaryodan O'rta Afg'onistongacha bo'lgan yerlar kirgan. Xorazm davlatining markazi Ko'zaliqir (Xorazm) shahri bo'lgan.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 21-bet
SAVOL: Davlatning ibtidoiy, urug'chilik jamiyatidan ajratib turadigan belgilarini sanab bering?
JAVOB: Davlatning ibtidoiy, urug'chilik jamiyatidan ajratib turadigan belgilari quyidagilar:
Davlat paydo bo'lgan jamiyatda fuqarolar ma'lum bir hududga birlashadilar.
Davlat o'z faoliyatini amalfea oshirishi uchun murak kab tizimdan tashkil topgan boshqaruv apparatiga ega bo'ladi va ana shu boshqaruv tizimi yordamida o'zining barcha fuqarolari uchun majburiy bo'lgan davlat hokimiyatini amalga oshiradi.
Davlat hokimiyatni to'laqonli amalgaoshirish uchun qonunlar va turli normativ hujjatlar qabul qiladi. Ya'ni, davlat mavjud bo'lgan joyda huquq ham mavjud bo'ladi.
O'z faoliyatini yuritishga kerak bo'ladigan zaruriy xarajatlar o'rnini qoplash uchun moliyaviy manbalarga ega bo'ladi. Soliqlar va boshqa to'lovlar joriy qiladi va ulami yig'adi. Ya'ni o'z budjetiga ega bo'ladi.
Davlat o'z faoliyatini toiaqonli tarzda amalga oshirishi uchun o'z suverenitetiga (mustaqilligiga) ega bo'lishi lozim.
MANBA: 8-sinf Davlat va huquq asoslari darsligi
SAVOL: Davlat atamasiga ta'rif bering.
JAVOB: Davlat - majbur qilish kuchiga, ya'ni hokimiyatga ega bo'lgan, o'z fuqarolari, shuningdek, hududida istiqomat qiluvchi barcha insonlaming manfaatlarini himoya qiladigan, boshqa davlatlar bilan siyosiy, iqtisodiy, madaniy aloqalami amalga oshiradigan mustaqil siyosiy tashkilotdir.
MANBA: 8-sinf Davlat va huquq asoslari darsligi
SAVOL: Davlatning funksiyalari sanab bering.
JAVOB: Davlatning funksiyalari - davlat faoliyatining asosiy yo'nalishlari bo'lib, ularda davlatning ijtimoiy jihatlari ro'yobga chiqariladi.
Davlatning funksiyalarini o'rganishda bu funksiyalami tasnifl ash (guruhlash) uslubi qulaydir. Tasnifl ashni quyidagi me'zonlar bo'yicha amalga oshirish maqsadga muvofi qdir:
Faoliyat ko'rsatish makoni bo'yicha:
-ichki; -tashqi.
Faoliyat ko'rsatish muddati bo'yicha:
-doimiy; - vaqtinchalik.
Ijtimoiy jihatdan muhimligi bo'yicha:
- asosiy; - asosiy bo'lmagan.
Amalga oshirishning huquqiy shakli bo'yicha:
huquqni ijod qilish; - huquqni ijro qilish;
- huquqni muhofaza qilish (qo'riqlash).
MANBA: 8-sinf Davlat va huquq asoslari darsligi
SAVOL: Davlatning ichki va tashqi funksiyalari to'g'risida ma'lumot bering?
JAVOB: Davlatning ichki funksiyalariga mamlakat ichida amalga oshiriladigan funksiyalar kiradi. Mamlakat tashqarisida amalga oshiriladigan funksiyalar esa davlatning tashqi funksiyalarini tashkil qiladi.
Davlat o'z funksiyalarini ado etar ekan bu undan qator vazifalami bajarishni taqozo qiladi. Mana shu vazifalami bajarish o'z navbatida davlatning o'z funksiyalarini amalga oshirishiga olib keladi. Davlat bajaradigan vazifalami ham sohalar bo'yicha turlarga ajratish mumkin. Davlatning ichki funksiyalarini amalga oshirish borasida bajariladigan vazifalami turlarga ajratib, batafsilroq o'rganamiz. Bunda biz davlat vazifalarini ijobiy, adolatli davlat misolida ko'rib chiqamiz. Lekin aslida, barcha davrlardagi davlatlar ham shunday-adolatli, xalqparvar bo'lavermaganligini ham e'tibordan qochirmaslik kerak.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 26-27-betlar
SAVOL: Davlatning ichki funksiyalari to'g'risida ma'lumot bering?
JAVOB: Davlatning ichki funksiyalariga oid vazifalar quyidagilardan iborat:
Iqtisodiy vazifalar:
Iqtisodiy siyosatni ishlab chiqish va iqtisodiyotga ta'sir o'tkazish;
Iqtisodiyotning davlat sektori (zavod-fabrikalar, elektrostansiyalar, konlar)ni boshqarish;
Bozor munosabatlarining huquqiy asoslari va narx siyosatini yo'lga qo'yish.
Ijtimoiy vazifalar:
Aholining yordamga muhtoj qismini himoyalash;
Sog'liqni saqlash va ta'lim tizimini qo'llab-quvvatlash;
Aholini ijtimoiy ne'matlar bilan ta'minlash.
Siyosiy-huquqiy vazifalar:
Fuqarolaming huquq va erkinliklarini himoya qilish;
Qonuniylik va tartibni ta'minlash;
Tinchlik va millatlararo totuvlikni saqlash.
Madaniy-ma'rifi у vazifalar:
Ilm-fan, ta'limni rivojlantirish;
Milliy madaniyatni va san'atni rivojlantirish.
Moliyaviy vazifalar:
Soliq tizimi va bojxona nazorati;
Pul aylanmasi ustidan nazorat;
Moliya sohasidagi boshqa faoliyatlar.
Xavfsizlik va himovalash borasidagi vazifalar:
Aholining huquq va erkinliklarini ta'minlash;
Tabiat muhofazasi;
Mulk daxlsizligini ta'minlash;
Huquqiy tartibotni o'matish.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 27-bet
SAVOL: Davlatning tashqi Funksiyalari haqida gapirib bering?
JAVOB: Boshqa davlatlar bilaii o'zaro munosabatlar olib borish davlatning tashqi funksiyalarini belgilaydi.
Har qanday davlat jahondagi boshqa davlatlar bilan turli aloqalami yo'lga qo'yishga majbur. Shundagina u jahon hamjamiyati tomonidan tan olinishi mumkin. Bu aloqalarga quyidagilami kiritsak bo'ladi:
1. Diplomatik aloqalar; 2. Savdo-sotiq aloqalari;
3. Madaniy aloqalar; 4. Harbiy aloqalar va boshqalar.
Davlat, shuningdek, xalqaro tashkilotlar bilan ham o'zaro aloqalarni yo'lga qo'yishi lozim. Xalqaro tashkilotlar sirasiga Birlashgan Millatlar Tashkiloti, Umumjahon Savdo Tashkiloti va boshqalami kiritish mumkin. Bu xalqaro tashkilotlaming eng nufuzlilariga O'zbekiston Respublikasi to'laqonli a'zo bo'lib kirgan.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 28-bet
SAVOL: Boshqaruv shakliga ko'ra davlatlar nechta turlarga bo'linadi?
JAVOB: Davlat shakllari deyilganda, davlatning bosh qaruv, hududiy tuzilishi va siyosiy tartibi jihatidan qanday shakllarga bo'linishi tushuniladi.
Boshqaruv shakli deganda, davlat hokimiyati, uning idoralarining aholi bilan o'zaro munosabatlari, aholining ushbu idoralami shakllantirishda ishtirok etish darajasi tushuniladi. Boshqaruv shakliga ko'ra davlatlar monarxiya va respublika turlariga bo'linadi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 30-31 betlar
SAVOL: Monarxiya shaklidagi davlat boshqaruvini tushuntirib bering?
JAVOB: Monarxiya - yunoncha so'z bo'lib, yakka hokimlik ma'nosi ni bildiradi.
Monarxiya - oliy hokimiyat yakka hokim - davlat boshlig'ining qo'lida bo'l gan davlat boshqaruv shakli. Bunda hokimiyat aksariyat hollarda yakka-hokim (monarx)ning farzandlariga, ayrim hollarda esa yakka-hokimning qaroriga ko'ra boshqa shaxsga meros bo'lib o'tadi.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 31-bet
SAVOL: Boshqaruv shakliga ko'ra Temuriylar davri davlatchiligi qaysi turga mansub?
JAVOB: O'zbekiston hududida tarixda mavjud bo'lgan monarxiya boshqaruviga misol qilib Temuriylar davri davlatchiligini keltirish mumkin.
Buyuk Sohibqiron Amir Temur va Temuriylar davri davlat boshqaruvi va huquq ning rivojlanishida yangi davr bo'lgan. Amir Temur davlat boshqa ruvi soha sida o'tmishda mavjud bo'lgan siyosiy boshqaruv tajribalaridan keng foy dalana olgan. Uning tarixdagi xizmati shundan iboratki, u davlatchilikning boshqaruv tizimi, ichki va tashqi siyosatining tartib-qoidalari, huquqiy asoslarini yangi tarixiy sharoitda takomillashtirdi. Davlat boshqa ruvi tizimi islom qonun-qoidalariga asos langan. Qozilar shaxsan Amir Те muming o'ziga hisobot berib turgan. Temur qat'iy tartiblar va qonunlami o'z tuzuklarida ifodalagan.
MANBA: 8-sinf Davlat va huquq asoslari darsligi, 31-bet
SAVOL: Monarxiyaning asosiy belgilarini sanab bering?
JAVOB: Monarxiyaning asosiy belgilari quyidagilardan iborat:
monarxiya davlatni shaxsiylashtiradi, tashqi va ichki siyosatda davlat boshlig'i sifatida maydonga chiqadi;
monarxiya davlatni yakka o'zi boshqaradi;
monarxiya hokimiyati muqaddas va ilohiy deb e'lon qilinadi;
monarxiya o'z faoliyatida mustaqildir;
hokimiyatni o'matish, qabul qilishning alohida tartibi mavjud;
umrbod boshqaruv;
monarx o'z boshqaruvining natijasi uchun yuridik jihatdan javobgar emas.
Monarxiya mutlaq va cheklangan (yoki parlamentar) shakllarda bo'ladi. Agar monarx
